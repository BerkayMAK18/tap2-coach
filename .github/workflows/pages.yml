# Erst prüfen, dann veröffentlichen.
# Die Prüfung vergleicht die neue index.html mit der aktuell veröffentlichten Version und
# stoppt den Deploy, wenn sich Frage-IDs verschieben würden (sonst wäre der Lernstand der Nutzer betroffen).
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    name: Lernstand-Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frage-IDs mit der veröffentlichten Version vergleichen
        run: node tools/check-ids.js

  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    needs: pruefen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Versionskennung = Prüfsumme der index.html. Ändert sich nur, wenn sich die App wirklich ändert
      # (README- oder Skript-Commits lösen also keinen „Neue Version“-Hinweis aus).
      - name: Versionskennung setzen
        run: |
          v=$(sha256sum index.html | cut -c1-12)
          grep -q 'const BUILD = "dev";' index.html || { echo "Platzhalter const BUILD = \"dev\"; fehlt in index.html"; exit 1; }
          sed -i "s/const BUILD = \"dev\";/const BUILD = \"$v\";/" index.html
          printf '{"build":"%s"}\n' "$v" > version.json
          echo "Version: $v"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
