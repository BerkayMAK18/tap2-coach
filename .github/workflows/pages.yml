# Erst prüfen, dann veröffentlichen.
# Die Prüfung vergleicht die neue index.html mit der aktuell veröffentlichten Version und
# stoppt den Deploy, wenn sich Frage-IDs verschieben würden (sonst wäre der Lernstand der Nutzer betroffen).
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    name: Lernstand-Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frage-IDs mit der veröffentlichten Version vergleichen
        run: node tools/check-ids.js

  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    needs: pruefen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Geräte-Sync: Supabase-Projekt aus den Repo-Secrets SYNC_URL / SYNC_ANON eintragen – nur in die veröffentlichte Datei, nie ins Repo.
      # Der Publishable key ist absichtlich öffentlich (Schutz über die Regeln in tools/supabase-sync.sql). Ohne Secrets bleibt der Sync ausgeblendet.
      # Läuft vor der Versionskennung: Ein neuer Key ergibt eine neue Version.
      - name: Sync-Projekt eintragen
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_ANON: ${{ secrets.SYNC_ANON }}
        run: |
          if [ -z "$SYNC_URL" ] && [ -z "$SYNC_ANON" ]; then echo "Keine Sync-Secrets hinterlegt – Sync bleibt ausgeblendet."; exit 0; fi
          SYNC_URL="${SYNC_URL%/}"
          [[ "$SYNC_URL" =~ ^https://[a-z0-9]+\.supabase\.co$ ]] || { echo "::error::SYNC_URL sieht nicht wie https://<projekt>.supabase.co aus."; exit 1; }
          case "$SYNC_ANON" in sb_secret_*) echo "::error::SYNC_ANON enthält den SECRET key! Bitte den Publishable key (sb_publishable_…) eintragen und den Secret key bei Supabase neu erzeugen."; exit 1;; esac
          [[ "$SYNC_ANON" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]] || { echo "::error::SYNC_ANON ist kein Publishable key (sb_publishable_…)."; exit 1; }
          grep -q 'const SYNC_URL = "", SYNC_ANON = "";' index.html || { echo "::error::Platzhalter const SYNC_URL = \"\", SYNC_ANON = \"\"; fehlt in index.html"; exit 1; }
          sed -i "s|const SYNC_URL = \"\", SYNC_ANON = \"\";|const SYNC_URL = \"$SYNC_URL\", SYNC_ANON = \"$SYNC_ANON\";|" index.html
          grep -q "const SYNC_URL = \"$SYNC_URL\", SYNC_ANON = \"$SYNC_ANON\";" index.html
          echo "Sync-Projekt eingetragen."
      # Versionskennung = Prüfsumme der index.html. Ändert sich nur, wenn sich die App wirklich ändert
      # (README- oder Skript-Commits lösen also keinen „Neue Version“-Hinweis aus).
      - name: Versionskennung setzen
        run: |
          v=$(sha256sum index.html | cut -c1-12)
          grep -q 'const BUILD = "dev";' index.html || { echo "Platzhalter const BUILD = \"dev\"; fehlt in index.html"; exit 1; }
          sed -i "s/const BUILD = \"dev\";/const BUILD = \"$v\";/" index.html
          printf '{"build":"%s"}\n' "$v" > version.json
          echo "Version: $v"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
