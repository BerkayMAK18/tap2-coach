    const tab = UI.ttab === "aufgaben" && !t.ueb.length ? "fragen" : UI.ttab;
    const theo = t.th.map((id) => PK[id]).filter(Boolean);
    let content = "";
    if (tab === "theorie") content = `<div class="stack">${theo.map((p, i) => theoryHTML(p, i, theo.length > 1)).join("")}<div class="row"><button type="button" class="btn primary big" data-act="learn">${ic("play", "ic sm")} Jetzt Fragen üben</button></div></div>`;
    else if (tab === "fragen") {
      content = `<section class="card">
        <div class="row"><span class="small muted">Tippe eine Frage an, um dort zu starten.</span><span class="spacer"></span><button type="button" class="btn small" id="q-add">${ic("plus", "ic xs")} Eigene Frage</button></div>
        ${UI.addQ ? `<div class="addq"><label class="f" for="add-f">Frage<textarea id="add-f" rows="2" placeholder="z. B. Was ist der Unterschied zwischen PUT und PATCH?"></textarea></label><label class="f" for="add-b">Antwort<textarea id="add-b" rows="4"></textarea></label><div class="row"><button type="button" class="btn primary" id="add-save">Frage hinzufügen</button><button type="button" class="btn ghost" id="add-close">Schließen</button><span class="small muted" id="add-msg"></span></div></div>` : ""}
        <ul class="qlist">${qs.map((q, i) => { const s = st(q.id); return `<li><button type="button" class="qrow" data-qi="${i}"><i class="amp ${s >= 0 ? "s" + s : ""}" title="${ST_LBL[s]}"></i><span class="qt">${esc(qTask(q.q))}</span>${S.mark[q.id] ? `<span class="mk">${ic("star", "ic xs")}</span>` : ""}<span class="qty">${q.type === "mc" ? "Auswahl" : q.own ? "Eigene" : "Wissen"}</span></button>${q.own ? (UI.confirm === q.id ? `<button type="button" class="btn small danger" data-del="${q.id}">Löschen?</button>` : `<button type="button" class="iconbtn sm" data-ask="${q.id}" aria-label="Eigene Frage löschen">${ic("x", "ic xs")}</button>`) : ""}</li>`; }).join("")}</ul>
      </section>`;
    } else {
      content = `<div class="ueb-list">${t.ueb.map((id) => { const u = UE[id], r = S.ueb[id], pct = r ? r.p / u.max : null; return `<button type="button" class="ueb-item t-${tcolOf(u.teil)}" data-u="${id}"><span class="id">${id}</span><span><span class="t">${esc(u.titel)}</span><br><span class="sub">${esc(u.teil)} · ${u.max} P · ca. ${u.min} Min.</span></span><span class="r">${r ? `<span class="chip ${pct >= 0.81 ? "ok" : pct >= 0.67 ? "warn" : "bad"}"><span class="d"></span>${r.p}/${u.max}</span>` : '<span class="chip">offen</span>'}</span></button>`; }).join("")}</div>`;
    }
    el.innerHTML = `
      <button type="button" class="backlink" id="t-back">${ic("left", "ic sm")} Alle Themen</button>
      <section class="pd-head t-${tcolOf(t.teil)}">
        <div class="pd-num">${ic(t.ic, "ic lg")}</div>
        <div class="pd-title"><div class="row"><span class="chip ${t.prio === "Muss" ? "muss" : "wichtig"}">${t.prio}</span><span class="chip">${esc(t.teil)}</span><span class="chip">${qs.length} Fragen</span></div><h2>${esc(t.n)}</h2>${ampBar(c)}${legend(c)}</div>
        <div class="pd-actions">${ring(c.pct, 88, 8, `${Math.round(c.pct * 100)}%<small>prüfungsreif</small>`, "anim")}</div>
      </section>
      <div class="actions">
        <button type="button" class="btn primary big" data-act="learn">${ic("play", "ic sm")} Lernen</button>
        <button type="button" class="btn" data-act="err" ${c.r ? "" : "disabled"}><i class="amp s0"></i> Fehler (${c.r})</button>
        <button type="button" class="btn" data-act="new" ${c.n ? "" : "disabled"}><i class="amp"></i> Neue (${c.n})</button>
        <button type="button" class="btn" data-act="all">Alle (${qs.length})</button>
      </div>
      <div class="tabs-in" role="tablist">
        <button type="button" role="tab" class="${tab === "theorie" ? "on" : ""}" aria-selected="${tab === "theorie"}" data-tab="theorie">${ic("book", "ic sm")} Theorie</button>
        <button type="button" role="tab" class="${tab === "fragen" ? "on" : ""}" aria-selected="${tab === "fragen"}" data-tab="fragen">${ic("list", "ic sm")} Fragen <span class="cnt">${qs.length}</span></button>
        ${t.ueb.length ? `<button type="button" role="tab" class="${tab === "aufgaben" ? "on" : ""}" aria-selected="${tab === "aufgaben"}" data-tab="aufgaben">${ic("pencil", "ic sm")} Aufgaben <span class="cnt">${t.ueb.length}</span></button>` : ""}
      </div>
      ${content}`;
    $("#t-back").onclick = () => { UI.topic = null; UI.addQ = false; render(); window.scrollTo({ top: 0 }); };
    el.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => learnList(b.dataset.act, t.id));
    el.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { UI.ttab = b.dataset.tab; UI.addQ = false; render(); });
    el.querySelectorAll("[data-qi]").forEach((b) => b.onclick = () => startSess(qs, t.n + ": Alle Fragen", { kind: "all", tid: t.id }, +b.dataset.qi));
    el.querySelectorAll("[data-u]").forEach((b) => b.onclick = () => { UI.ueb = b.dataset.u; UI.showSol = false; go("aufgaben"); });
    const qa = $("#q-add"); if (qa) qa.onclick = () => { UI.addQ = true; render(); const f = $("#add-f"); if (f) f.focus(); };
    if (UI.addQ && tab === "fragen") {
      $("#add-close").onclick = () => { UI.addQ = false; render(); };
      $("#add-save").onclick = () => {
        const f = $("#add-f").value.trim(), b = $("#add-b").value.trim();
        if (!f || !b) { $("#add-msg").textContent = "Bitte Frage und Antwort ausfüllen."; return; }
        S.custom[t.id] = (S.custom[t.id] || []).concat([{ id: "c" + Date.now(), f, b }]);
        save(); render(); $("#add-msg").textContent = "Hinzugefügt. Du kannst direkt die nächste anlegen."; $("#add-f").focus();
      };
    }
    el.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => { UI.confirm = b.dataset.ask; render(); });
    el.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { S.custom[t.id] = (S.custom[t.id] || []).filter((x) => x.id !== b.dataset.del); delete S.q[b.dataset.del]; delete S.mark[b.dataset.del]; UI.confirm = null; save(); render(); });
  }

  // ---------- Aufgaben (Übungsaufgaben)
  const UEB_TOPIC = {}; TOPICS.forEach((t) => t.ueb.forEach((u) => { if (!UEB_TOPIC[u]) UEB_TOPIC[u] = t.id; }));
  function rUeb() {
    const el = $("#v-aufgaben");
    if (UI.ueb && UE[UI.ueb]) {
      const u = UE[UI.ueb], r = S.ueb[u.id], tid = UEB_TOPIC[u.id];
      el.innerHTML = `<button type="button" class="backlink" id="u-back">${ic("left", "ic sm")} Alle Aufgaben</button>
        <section class="card t-${tcolOf(u.teil)}"><div class="row" style="align-items:flex-start"><span class="pk-num">${esc(u.id)}</span><div style="flex:1;min-width:200px"><h2>${esc(u.titel)}</h2><div class="row" style="margin-top:6px"><span class="chip">${esc(u.teil)}</span><span class="chip">${esc(u.thema)}</span><span class="chip blue">${u.max} P · ca. ${u.min} Min.</span>${tid ? `<button type="button" class="linkbtn" id="u-topic">Theorie: ${esc(TP[tid].n)}</button>` : ""}<a class="linkbtn" href="${reportUrlUeb(u)}" target="_blank" rel="noopener">Fehler melden</a></div></div></div>
        ${u.schema ? `<div style="margin-top:16px"><span class="small muted">Tabellen</span><pre>${esc(SQL_SCHEMA)}</pre></div>` : ""}
        <div class="qtext" style="margin-top:16px">${esc(u.text)}</div>
        <p class="small muted" style="margin-top:12px">Löse die Aufgabe auf Papier wie in der Prüfung, erst dann die Lösung ansehen.</p>
        <div class="row" style="margin-top:14px"><button type="button" class="btn ${UI.showSol ? "" : "primary"}" id="u-sol">${UI.showSol ? "Lösung ausblenden" : "Musterlösung zeigen"}</button></div>
        ${UI.showSol ? `<pre style="margin-top:14px">${esc(u.loesung)}</pre>
        <div class="row" style="margin-top:14px;align-items:flex-end"><label class="f" for="u-pts">Deine Punkte (0–${u.max})<input type="number" id="u-pts" min="0" max="${u.max}" step="0.5" value="${r ? r.p : ""}"></label><button type="button" class="btn primary" id="u-save">Speichern</button>${r ? `<span class="small muted">Zuletzt ${r.p}/${u.max} am ${fmtDay(r.at)}</span>` : ""}</div>` : ""}
        </section>`;
      $("#u-back").onclick = () => { UI.ueb = null; render(); };
      const ut = $("#u-topic"); if (ut) ut.onclick = () => { UI.topic = tid; UI.ttab = "theorie"; UI.sess = null; go("lernen"); };
      $("#u-sol").onclick = () => { UI.showSol = !UI.showSol; render(); };
      const sv = $("#u-save");
      if (sv) sv.onclick = () => { const v = Math.max(0, Math.min(u.max, parseFloat($("#u-pts").value))); if (isNaN(v)) return; S.ueb[u.id] = { p: v, at: today(), n: (r?.n || 0) + 1 }; save(); render(); };
      return;
    }
    const groups = {};
    UEB.forEach((u) => (groups[u.thema] = groups[u.thema] || []).push(u));
    const done = UEB.filter((u) => S.ueb[u.id]).length;
    el.innerHTML = `<div class="row" style="align-items:flex-end"><p class="lead" style="flex:1;min-width:260px">Große Aufgaben im Stil der IHK-Prüfung mit Musterlösung, so wie sie in Planen und Algorithmen drankommen. Löse sie auf Papier, vergleiche mit der Lösung und trage deine Punkte ein. Unter 70 % lohnt sich ein zweiter Versuch.</p><span class="chip">${done} von ${UEB.length} bearbeitet</span></div>
      ${Object.entries(groups).map(([g, l]) => `<div class="ueb-group"><h3>${esc(g)}</h3><div class="ueb-list">${l.map((u) => { const r = S.ueb[u.id]; const pct = r ? r.p / u.max : null; return `<button type="button" class="ueb-item t-${tcolOf(u.teil)}" data-u="${u.id}"><span class="id">${u.id}</span><span><span class="t">${esc(u.titel)}</span><br><span class="sub">${esc(u.teil)} · ${u.max} P · ca. ${u.min} Min.</span></span><span class="r">${r ? `<span class="chip ${pct >= 0.81 ? "ok" : pct >= 0.67 ? "warn" : "bad"}"><span class="d"></span>${r.p}/${u.max}</span>` : '<span class="chip">offen</span>'}</span></button>`; }).join("")}</div></div>`).join("")}`;
    el.querySelectorAll("[data-u]").forEach((b) => b.onclick = () => { UI.ueb = b.dataset.u; UI.showSol = false; render(); window.scrollTo({ top: 0 }); });
  }

  // ---------- Prüfung: Erzeugen
  function pickMC(teil, n) {
    const pool = BASE_Q.filter((q) => q.type === "mc" && (teil === "mix" || q.teil === teil));
    const w = (q) => { const s = st(q.id); return (s === 0 ? 3 : s === -1 ? 2 : s === 1 ? 1.5 : 1) + Math.random() * 2; };
    let list = pool.slice().sort((a, b) => w(b) - w(a));
    if (teil !== "mix") {
      const tids = [...new Set(list.map((q) => q.topic))], out = [];
      let i = 0, guard = 0;
      while (out.length < Math.min(n, list.length) && guard++ < 1000) { const tt = tids[i++ % tids.length]; const nx = list.find((q) => q.topic === tt && !out.includes(q)); if (nx) out.push(nx); }
      list = out;
    }
    return shuffle(list.slice(0, n)).map((q) => { const order = shuffle(q.opts.map((_, i) => i)); return { id: q.id, topic: q.topic, q: q.q, opts: order.map((i) => q.opts[i]), right: order.indexOf(q.right), why: q.why, pick: null }; });
  }
  function buildAufgabe(teil, cat) {
    const pool = shuffle(OPEN.filter((o) => o.teil === teil && o.cat === cat));
    const items = []; let rem = 25;
    for (const o of pool) { if (o.p <= rem) { items.push(o); rem -= o.p; } if (rem < 3) break; }
    return { cat, title: CATS[teil][cat], items: items.map((o) => ({ id: o.id, p: o.p, q: o.q, a: o.a, schema: !!o.schema, ans: "", got: null })) };
  }
  const SIM_MIN = { t1: 45, t2: 45, wiso: 60, mix: 45 };
  function startRun() {
    const { mode, teil } = UI.pk;
    if (mode === "sim") UI.run = { mode, teil, qs: pickMC(teil, 30), i: 0, total: SIM_MIN[teil] * 60000, used: 0, start: Date.now(), on: true, phase: "write" };
    else UI.run = { mode: "real", teil, auf: shuffle(Object.keys(CATS[teil])).map((c) => buildAufgabe(teil, c)), total: 90 * 60000, used: 0, start: Date.now(), on: true, phase: "write" };
    UI.confirm = null;
    keepRun();
  }
  function keepRun() { try { localStorage.setItem(KEY_RUN, JSON.stringify(UI.run)); } catch (e) {} }
  try { const r = JSON.parse(localStorage.getItem(KEY_RUN) || "null"); if (r && (r.mode === "sim" || r.mode === "real") && (r.phase === "write" || r.phase === "grade")) { if (r.on) { r.used += Date.now() - r.start; r.on = false; } UI.run = r; } } catch (e) {}
  function finishRun(pct, extra) {
    const r = UI.run;
    S.runs.push(Object.assign({ mode: r.mode, teil: r.teil, pct, note: note(pct), at: today(), ts: Date.now() }, extra || {}));
    save();
  }
  const left = () => { const r = UI.run; return r.total - r.used - (r.on ? Date.now() - r.start : 0); };
  function fmtT(ms) { const s = Math.max(0, Math.round(ms / 1000)); return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); }
  let tick = null;
  function ensureTick() {
    clearInterval(tick);
    const r = UI.run;
    if (r && r.on && r.phase === "write") tick = setInterval(() => {
      const t = $("#pk-time"); if (!t) return;
      const l = left(); t.textContent = fmtT(l); t.parentElement.classList.toggle("low", l < 10 * 60000);
      if (l <= 0) { clearInterval(tick); submitRun(true); }
    }, 500);
  }
  function submitRun(auto) {
    const r = UI.run;
    if (r.on) { r.used += Date.now() - r.start; r.on = false; }
    r.phase = "grade"; r.auto = !!auto; UI.confirm = null;
    if (r.mode === "sim") {
      r.qs.forEach((q) => { if (q.pick !== null) answer(q.id, q.pick === q.right); });
      const right = r.qs.filter((q) => q.pick === q.right).length;
      r.pct = Math.round(right / r.qs.length * 100);
      finishRun(r.pct, { detail: right + "/" + r.qs.length });
      r.phase = "done";
    }
    keepRun(); render(); window.scrollTo({ top: 0 });
  }
  const runsFor = (t) => S.runs.filter((x) => x.teil === t && (t === "wiso" ? x.mode !== "easy" : x.mode === "real")).slice(-2);
  const n1ok = (t) => { const rs = runsFor(t); return rs.length === 2 && rs.every((x) => x.pct >= 92); };

  // ---------- Bewertung wie ein Prüfer
  const OPS = {
    nennen: ["Nennen", "Stichwort oder Begriff genügt, keine Erklärung nötig. Punkte je richtigem Aspekt."],
    geben: ["Angeben", "Kurze, eindeutige Angabe genügt. Punkte je richtigem Aspekt."],
    ordnen: ["Zuordnen", "Jede Zuordnung zählt einzeln. Eindeutig schreiben, keine Mehrfachnennung."],
    beschreiben: ["Beschreiben", "Sachverhalt in ganzen Sätzen und in sinnvoller Reihenfolge darstellen, ohne Wertung."],
    erläutern: ["Erläutern", "Beschreiben und zusätzlich mit Beispiel oder Begründung verständlich machen. Nur genannt: höchstens die Hälfte."],
    erklären: ["Erklären", "Zusammenhang verständlich machen, mit Begründung oder Beispiel. Nur genannt: höchstens die Hälfte."],
    begründen: ["Begründen", "Klare Entscheidung plus tragfähiges Argument. Ohne Begründung kaum Punkte."],
    bewerten: ["Bewerten", "Abwägen und ein eigenes, begründetes Urteil fällen."],
    beurteilen: ["Beurteilen", "Abwägen und ein eigenes, begründetes Urteil fällen."],
    wägen: ["Abwägen", "Pro und Contra nennen, dann zu einem begründeten Ergebnis kommen."],
    vergleichen: ["Vergleichen", "Beide Seiten nach gleichen Kriterien gegenüberstellen und den Unterschied benennen."],
    unterscheiden: ["Unterscheiden", "Beide Begriffe abgrenzen; der Unterschied muss ausdrücklich genannt sein."],
    berechnen: ["Berechnen", "Rechenweg mit Einheiten zählt mit. Ergebnis ohne Weg kann Punkte kosten."]
  };
  const OP_ERST = ["Erstellen", "Vollständiges Ergebnis. Punkte gibt es je Baustein (z. B. Aktion, Schlüssel, Schleife, Rückgabe); fehlende Bausteine kosten einzeln."];
  function opHint(q) {
    const m = String(q).match(/\b(Nennen|Geben|Ordnen|Beschreiben|Erläutern|Erklären|Begründen|Bewerten|Beurteilen|Wägen|Vergleichen|Unterscheiden|Berechnen|Erstellen|Entwickeln|Implementieren|Zeichnen|Skizzieren|Schreiben|Formulieren|Ergänzen|Überführen|Bilden|Führen)\s+Sie\b/);
    if (!m) return null;
    return OPS[m[1].toLowerCase()] || OP_ERST;
  }
  // ---------- Prüfung: Ansichten
  const MODE_LBL = { sim: "Simulation", real: "Real-Klausur", easy: "Quiz" };
  function rPK() {
    const el = $("#v-pruefung");
    const r = UI.run;
    if (r && r.mode === "sim") return rSim(el);
    if (r) return rReal(el);
    const p = UI.pk;
    if (p.mode === "real" && !(p.teil === "t1" || p.teil === "t2")) p.teil = "t2";
    const hist = S.runs.slice().reverse();
    const X = PK.X01;
    const cat = counts(allQ());
    const teile = p.mode === "sim" ? ["t2", "t1", "wiso", "mix"] : ["t2", "t1"];
    el.innerHTML = `
      <div class="grid2">
        <section class="card">
          <h3>Prüfung simulieren</h3>
          <div class="modes">
            <button type="button" class="mode t-violet ${p.mode === "sim" ? "on" : ""}" data-mode="sim" aria-pressed="${p.mode === "sim"}"><span class="mi">${ic("list")}</span><b>Simulation</b><span>30 Auswahlfragen mit Zeitlimit, Frage für Frage. Note am Ende; deine Antworten zählen in den Lernstand.</span></button>
            <button type="button" class="mode t-blue ${p.mode === "real" ? "on" : ""}" data-mode="real" aria-pressed="${p.mode === "real"}"><span class="mi">${ic("pencil")}</span><b>Real-Klausur</b><span>Wie in der echten Prüfung: vier offene Aufgaben à rund 25 Punkte in 90 Minuten. Danach bewertest du wie ein IHK-Prüfer mit Erwartungshorizont und Operator-Hinweisen.</span></button>
          </div>
          <label class="f" for="pk-teil">Prüfungsteil<select id="pk-teil">${teile.map((t) => `<option value="${t}" ${t === p.teil ? "selected" : ""}>${TEIL[t].k}${t === "mix" ? " (alle Teile)" : " – " + TEIL[t].n}</option>`).join("")}</select></label>
          <div class="row" style="margin-top:18px"><button type="button" class="btn primary big" id="pk-go">${ic("play", "ic sm")} Starten</button><span class="small muted">${p.mode === "sim" ? `30 Fragen · ${SIM_MIN[p.teil] || 45} Minuten` : "90 Minuten · Papier für Skizzen bereitlegen"}</span></div>
        </section>
        <section class="card">
          <h3>Bereit für eine 1?</h3>
          <p class="small muted" style="margin-top:4px">Prüferblick: Das Wissen sitzt, und du schaffst es unter Prüfungsbedingungen.</p>
          <ul class="n1">
            <li class="${cat.pct >= 0.9 ? "ok" : ""}"><span class="n1-i">${cat.pct >= 0.9 ? ic("check", "ic sm") : ""}</span><span><b>Fragenkatalog</b><br><span class="tiny muted">mindestens 90 % prüfungsreif</span></span><span class="chip ${cat.pct >= 0.9 ? "yellow" : ""}">${pctS(cat.pct)}</span></li>
            ${["t2", "t1", "wiso"].map((t) => { const rs = runsFor(t), ok = n1ok(t), good = rs.filter((x) => x.pct >= 92).length; return `<li class="${ok ? "ok" : ""}"><span class="n1-i">${ok ? ic("check", "ic sm") : ""}</span><span><b>${TEIL[t].k}</b><br><span class="tiny muted">${t === "wiso" ? "zwei Simulationen in Folge ab 92 %" : "zwei Real-Klausuren in Folge ab 92 %"}${rs.length ? " · zuletzt " + rs.map((x) => x.pct + " %").join(", ") : ""}</span></span><span class="chip ${ok ? "yellow" : ""}">${good}/2</span></li>`; }).join("")}
          </ul>
        </section>
      </div>
      ${X ? `<section class="card"><div class="row"><h3>So holst du die Punkte</h3><span class="spacer"></span><span class="small muted">Prüfungstechnik</span></div><div class="kern-list">${X.kern.map(([h, t, c], i) => `<details class="kern"><summary><span class="kn">${i + 1}</span><span>${esc(h)}</span>${ic("down", "ic chev")}</summary><div class="kb"><p>${esc(t)}</p>${c ? `<pre>${esc(c)}</pre>` : ""}</div></details>`).join("")}</div></section>` : ""}
      <section class="card"><div class="row"><h3>Deine Ergebnisse</h3><span class="spacer"></span><span class="small muted">${hist.length} ${hist.length === 1 ? "Durchgang" : "Durchgänge"}</span></div>
        ${hist.length ? `<div class="res-list">${hist.map((x) => `<div class="res">${gradeBadge(x.note)}<div><div class="t">${MODE_LBL[x.mode] || x.mode} · ${TEIL[x.teil] ? TEIL[x.teil].k : esc(x.teil)}</div><div class="s">${fmtDay(x.at)}${x.detail ? " · " + esc(x.detail) : ""} · ${x.pct >= 50 ? "bestanden" : "nicht bestanden"}</div></div><span class="chip num">${x.pct} %</span>${UI.confirm === x.ts ? `<button type="button" class="btn small danger del" data-del="${x.ts}">Wirklich löschen</button>` : `<button type="button" class="iconbtn sm del" data-ask="${x.ts}" aria-label="Ergebnis löschen">${ic("x", "ic xs")}</button>`}</div>`).join("")}</div>` : `<p class="empty">Noch keine Prüfung geschrieben. Starte mit einer Simulation.</p>`}
      </section>`;
    el.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { p.mode = b.dataset.mode; render(); });
    $("#pk-teil").onchange = (e) => { p.teil = e.target.value; render(); };
    $("#pk-go").onclick = () => { startRun(); render(); window.scrollTo({ top: 0 }); };
    el.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => { UI.confirm = +b.dataset.ask; render(); });
    el.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { S.runs = S.runs.filter((x) => x.ts !== +b.dataset.del); UI.confirm = null; save(); render(); });
  }
  function closeRun() { UI.run = null; UI.confirm = null; clearInterval(tick); try { localStorage.removeItem(KEY_RUN); } catch (e) {} render(); window.scrollTo({ top: 0 }); }
  function timerBar(r, extra) {
    const open = r.mode === "sim" ? r.qs.filter((q) => q.pick === null).length : 0;
    return `<div class="timerbar"><span class="timer ${left() < 600000 ? "low" : ""}">${ic("timer")}<span id="pk-time">${fmtT(left())}</span></span>${extra || ""}<span class="spacer"></span>${r.on ? `<button type="button" class="btn" id="pk-pause">Pause</button>` : `<button type="button" class="btn" id="pk-resume">${r.used ? "Weiter" : "Start"}</button>`}<button type="button" class="btn primary" id="pk-submit">Abgeben</button><button type="button" class="btn small ghost" id="pk-cancel">Abbrechen</button>${UI.confirm === "submit" ? `<div class="confirm"><span class="small">${open ? `${open} ${open === 1 ? "Frage ist" : "Fragen sind"} noch offen. ` : ""}Wirklich abgeben? Danach kannst du nichts mehr ändern.</span><button type="button" class="btn small primary" id="pk-yes">Ja, abgeben</button><button type="button" class="btn small" id="pk-no">Weiterschreiben</button></div>` : ""}${UI.confirm === "cancel" ? `<div class="confirm"><span class="small">Abbrechen verwirft diese Prüfung.</span><button type="button" class="btn small danger" id="pk-cyes">Verwerfen</button><button type="button" class="btn small" id="pk-no">Zurück</button></div>` : ""}</div>`;
  }
  function bindTimer() {
    const r = UI.run;
    const pa = $("#pk-pause"); if (pa) pa.onclick = () => { r.used += Date.now() - r.start; r.on = false; keepRun(); render(); };
    const re = $("#pk-resume"); if (re) re.onclick = () => { r.start = Date.now(); r.on = true; keepRun(); render(); };
    $("#pk-submit").onclick = () => { UI.confirm = "submit"; render(); };
    $("#pk-cancel").onclick = () => { UI.confirm = "cancel"; render(); };
    const y = $("#pk-yes"); if (y) y.onclick = () => submitRun(false);
    const cy = $("#pk-cyes"); if (cy) cy.onclick = () => closeRun();
    const n = $("#pk-no"); if (n) n.onclick = () => { UI.confirm = null; render(); };
    ensureTick();
  }
  function rSim(el) {
    const r = UI.run;
    if (r.phase === "done") {
      const right = r.qs.filter((q) => q.pick === q.right).length, n = note(r.pct);
      el.innerHTML = `<section class="result-hero grad">${ring(r.pct / 100, 150, 12, `${r.pct}%<small>richtig</small>`, "anim")}<div><span class="eyebrow">Simulation ${TEIL[r.teil].k}</span><h2>${r.pct >= 50 ? "Bestanden" : "Nicht bestanden"} · Note ${n}</h2><div class="chips"><span class="chip">${right} von ${r.qs.length} richtig</span><span class="chip">${ic("clock", "ic xs")} ${Math.round(r.used / 60000)} Min.</span>${r.auto ? '<span class="chip">Zeit abgelaufen</span>' : ""}<span class="chip">Note 1 ab 92 %</span></div><div class="row"><button type="button" class="btn white" id="r-again">${ic("again", "ic sm")} Neue Simulation</button><button type="button" class="btn glass" id="r-out">Zur Übersicht</button></div></div></section>
        <section class="card"><h3>Auswertung</h3>${r.qs.map((q, i) => `<div class="review ${q.pick === q.right ? "ok" : "bad"}"><span class="ri">${ic(q.pick === q.right ? "check" : "x")}</span><div><b>${i + 1}. ${esc(qTask(q.q))}</b><br><span class="small">Deine Antwort: ${q.pick === null ? "keine" : esc(q.opts[q.pick])}${q.pick !== q.right ? ` · Richtig: ${esc(q.opts[q.right])}` : ""}${q.why ? " · " + esc(q.why) : ""}</span></div></div>`).join("")}</section>`;
      $("#r-out").onclick = closeRun;
      $("#r-again").onclick = () => { UI.pk = { mode: "sim", teil: r.teil }; startRun(); render(); window.scrollTo({ top: 0 }); };
      return;
    }
    const q = r.qs[r.i], answered = r.qs.filter((x) => x.pick !== null).length;
    el.innerHTML = `${timerBar(r, `<span class="small muted num">${answered} / ${r.qs.length} beantwortet</span>`)}
      <div class="quiz">
        <div class="navgrid" aria-label="Fragenübersicht">${r.qs.map((x, i) => `<button type="button" class="${x.pick !== null ? "ans" : ""} ${i === r.i ? "cur" : ""}" data-goq="${i}" aria-label="Frage ${i + 1}${x.pick !== null ? ", beantwortet" : ""}">${i + 1}</button>`).join("")}</div>
        <section class="card qcard"><div class="qlab"><span class="chip violet">Frage ${r.i + 1} von ${r.qs.length}</span><span class="chip">${esc(TP[q.topic] ? TP[q.topic].n : "")}</span></div>
          ${frontHTML(q.q)}
          <div class="optlist">${q.opts.map((o, i) => `<button type="button" class="opt ${q.pick === i ? "picked" : ""}" data-i="${i}" aria-pressed="${q.pick === i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        </section>
        <div class="study-nav"><button type="button" class="btn ghost" id="q-prev" ${r.i === 0 ? "disabled" : ""}>${ic("left", "ic sm")} Zurück</button><span class="kbdhelp"><span class="kbd">1</span>–<span class="kbd">4</span> antworten · <span class="kbd">←</span> <span class="kbd">→</span> blättern</span>${r.i < r.qs.length - 1 ? `<button type="button" class="btn primary" id="q-next">Weiter ${ic("right", "ic sm")}</button>` : `<button type="button" class="btn primary" id="q-end">Abgeben</button>`}</div>
      </div>`;
    el.querySelectorAll("[data-goq]").forEach((b) => b.onclick = () => { r.i = +b.dataset.goq; keepRun(); render(); });
    el.querySelectorAll(".opt").forEach((b) => b.onclick = () => { q.pick = +b.dataset.i; keepRun(); render(); });
    const pv = $("#q-prev"); if (pv) pv.onclick = () => { r.i--; keepRun(); render(); };
    const nx = $("#q-next"); if (nx) nx.onclick = () => { r.i++; keepRun(); render(); };
    const en = $("#q-end"); if (en) en.onclick = () => { UI.confirm = "submit"; render(); window.scrollTo({ top: 0 }); };
    bindTimer();
  }
  function rReal(el) {
    const r = UI.run;
    const total = r.auf.reduce((a, x) => a + x.items.reduce((b, i) => b + i.p, 0), 0);
    if (r.phase === "write") {
      el.innerHTML = `${timerBar(r)}<section class="card"><h2>Real-Klausur ${TEIL[r.teil].k}</h2><p class="small muted" style="margin-top:6px">${esc(TEIL[r.teil].n)} · 4 Aufgaben · ${total} Punkte · 90 Minuten. Diagramme auf Papier skizzieren und hier Stichpunkte notieren. Antworten werden auf diesem Gerät zwischengespeichert.</p></section>
        ${r.auf.map((a, ai) => `<section class="card"><div class="row"><h3>${ai + 1}. Aufgabe: ${esc(a.title)}</h3><span class="spacer"></span><span class="chip blue">${a.items.reduce((b, i) => b + i.p, 0)} P</span></div>
          ${a.items.some((i) => i.schema) ? `<div style="margin-top:12px"><span class="small muted">Tabellen</span><pre>${esc(SQL_SCHEMA)}</pre></div>` : ""}
          ${a.items.map((it, ii) => `<div class="sub-q"><div class="row"><b>${"abcdefgh"[ii]})</b><span class="spacer"></span><span class="small muted">${it.p} Punkte</span></div><div class="qtext">${esc(it.q)}</div><label class="sr" for="ans-${ai}-${ii}">Antwort zu Aufgabe ${ai + 1}${"abcdefgh"[ii]}</label><textarea id="ans-${ai}-${ii}" data-a="${ai}" data-i="${ii}" rows="${it.p >= 15 ? 12 : 5}" placeholder="Deine Antwort">${esc(it.ans)}</textarea></div>`).join("")}</section>`).join("")}
        <div class="row"><button type="button" class="btn primary big" id="pk-submit2">Abgeben und bewerten</button></div>`;
      let t = null;
      el.querySelectorAll("textarea[data-a]").forEach((ta) => ta.addEventListener("input", () => { r.auf[+ta.dataset.a].items[+ta.dataset.i].ans = ta.value; clearTimeout(t); t = setTimeout(keepRun, 400); }));
      $("#pk-submit2").onclick = () => { UI.confirm = "submit"; render(); window.scrollTo({ top: 0 }); };
      bindTimer();
      return;
    }
    const all = r.auf.flatMap((a) => a.items);
    const graded = all.filter((i) => i.got !== null).length;
    const got = all.reduce((a, i) => a + (i.got || 0), 0);
    const pct = Math.round(got / total * 100);
    if (r.phase === "done") {
      el.innerHTML = `<section class="result-hero grad">${ring(pct / 100, 150, 12, `${pct}%<small>Punkte</small>`, "anim")}<div><span class="eyebrow">Real-Klausur ${TEIL[r.teil].k}</span><h2>${dec(got)} von ${total} Punkten · Note ${note(pct)}</h2><div class="chips"><span class="chip">${pct >= 50 ? "bestanden" : "nicht bestanden"}</span><span class="chip">${ic("clock", "ic xs")} ${Math.round(r.used / 60000)} Min.</span><span class="chip">Note 1 ab 92 %</span></div><div class="row"><button type="button" class="btn white" id="r-again">Neue Real-Klausur ${TEIL[r.teil].k}</button><button type="button" class="btn glass" id="r-out">Zur Übersicht</button></div></div></section>
        <section class="card"><h3>Punkte je Aufgabe</h3><div class="stack" style="margin-top:14px">${r.auf.map((a, ai) => { const g = a.items.reduce((b, i) => b + (i.got || 0), 0), m = a.items.reduce((b, i) => b + i.p, 0); return `<div><div class="row"><b>${ai + 1}. ${esc(a.title)}</b><span class="spacer"></span><span class="small num">${dec(g)} / ${m} P</span></div><div class="bar" style="margin-top:6px"><i style="width:${g / m * 100}%"></i></div></div>`; }).join("")}</div></section>`;
      $("#r-out").onclick = closeRun;
      $("#r-again").onclick = () => { UI.pk = { mode: "real", teil: r.teil }; startRun(); render(); window.scrollTo({ top: 0 }); };
      return;
    }
    const steps = (p) => [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(p * f * 2) / 2);
    const stepLbl = ["0", "¼", "½", "¾", "voll"];
    el.innerHTML = `<div class="timerbar"><h2 style="font-size:1.25rem">Bewerten</h2><span class="spacer"></span><span class="chip blue num">${graded}/${all.length} bewertet · ${dec(got)} P</span></div>
      <p class="small muted">${r.auto ? "Die Zeit ist abgelaufen. " : ""}Bewerte wie ein IHK-Prüfer: volle Punkte nur, wenn alle erwarteten Aspekte da sind und der Operator erfüllt ist. Andere sachlich richtige Lösungen zählen voll.</p>
      ${r.auf.map((a, ai) => `<section class="card"><h3>${ai + 1}. Aufgabe: ${esc(a.title)}</h3>
        ${a.items.map((it, ii) => { const op = opHint(it.q); return `<div class="sub-q"><div class="row"><b>${"abcdefgh"[ii]})</b>${op ? `<span class="chip violet">${esc(op[0])}</span>` : ""}<span class="spacer"></span><span class="small muted">${it.p} P</span></div><div class="qtext small">${esc(it.q)}</div>
          ${op ? `<p class="ophint">${esc(op[1])}</p>` : ""}
          <div class="grade-grid"><div><span class="small muted">Deine Antwort</span><pre class="mine">${esc(it.ans || "(leer)")}</pre></div><div><span class="small muted">Erwartungshorizont</span><pre>${esc(it.a)}</pre></div></div>
          <div class="row steps">${steps(it.p).map((v, k) => `<button type="button" class="btn small ${it.got === v ? "sel" : ""}" data-g="${ai}|${ii}|${v}" aria-pressed="${it.got === v}">${stepLbl[k]}${k && k < 4 ? ` · ${dec(v)}` : ""}</button>`).join("")}<label class="f inline" for="g-${ai}-${ii}">Punkte <input type="number" id="g-${ai}-${ii}" min="0" max="${it.p}" step="0.5" value="${it.got ?? ""}" data-gi="${ai}|${ii}"></label></div></div>`; }).join("")}</section>`).join("")}
      <div class="row"><button type="button" class="btn primary big" id="r-finish" ${graded === all.length ? "" : "disabled"}>Ergebnis speichern (${pct} %)</button><span class="small muted">${graded === all.length ? "" : "Bitte alle Teilaufgaben bewerten."}</span></div>`;
    const setG = (key, v) => { const [ai, ii] = key.split("|").map(Number); const it = r.auf[ai].items[ii]; it.got = Math.max(0, Math.min(it.p, v)); keepRun(); const y = window.scrollY; render(); window.scrollTo({ top: y }); };
    el.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => { const p = b.dataset.g.split("|"); setG(p[0] + "|" + p[1], +p[2]); });
    el.querySelectorAll("[data-gi]").forEach((inp) => inp.onchange = () => { const v = parseFloat(inp.value); if (!isNaN(v)) setG(inp.dataset.gi, v); });
    $("#r-finish").onclick = () => { r.phase = "done"; finishRun(pct, { detail: dec(got) + "/" + total + " P" }); keepRun(); render(); window.scrollTo({ top: 0 }); };
  }

  // ---------- boot
  const h = location.hash.slice(1);
  if (VIEWS.includes(h)) view = h;
  localLoad();
  try { const ss = JSON.parse(localStorage.getItem(KEY_SESS) || "null"); if (ss && Array.isArray(ss.ids) && ss.i < ss.ids.length) { UI.sess = ss; view = "lernen"; } } catch (e) {}
  render();
})();


</script>
</body>
</html>
