  ["t1", "sec", "Ein Steuerbüro will seine Datensicherung so aufbauen, dass sie auch Brand, Diebstahl und Ransomware übersteht.\n\nWas beschreibt die 3-2-1-Backup-Regel?", ["Drei Kopien auf zwei verschiedenen Medien, eine davon außer Haus","Drei Backups pro Tag, zwei pro Woche und eines pro Monat","Drei Festplatten im RAID-Verbund, zwei Netzteile, eine USV","Drei Tage, zwei Wochen und ein Jahr Aufbewahrungsdauer je Sicherung"], 0, "Drei Kopien (Original + zwei Backups), zwei Medientypen, eine Kopie an einem anderen Ort bzw. offline. So bleibt mindestens eine Kopie unbeschädigt.", "T07"],
  ["t1", "sec", "Ein Handelsunternehmen muss Rechnungen zehn Jahre lang aufbewahren und sichert außerdem täglich seine Server.\n\nWas unterscheidet die Archivierung von einem Backup?", ["Die Archivierung bewahrt Daten langfristig und unveränderbar auf, ein Backup dient der Wiederherstellung.","Die Archivierung dient der schnellen Wiederherstellung, ein Backup bewahrt Daten langfristig unveränderbar auf.","Die Archivierung speichert die Änderungen seit der letzten Sicherung, ein Backup den gesamten Datenbestand.","Backups sind nach HGB und AO vorgeschrieben, die Archivierung ist eine freiwillige Zusatzmaßnahme."], 0, "Backups werden rotiert und dienen der Wiederherstellung nach Datenverlust. Archive erfüllen Aufbewahrungsfristen (z. B. nach HGB und AO) und müssen unveränderbar sein.", "T07"],
  ["t1", "sec", "Ein Rechenzentrumsbetreiber möchte sein Informationssicherheits-Managementsystem zertifizieren lassen.\n\nWelcher Standard beschreibt ein ISMS?", ["ISO/IEC 27001","ISO 9241-110","ISO/IEC 25010","ISO 8601"], 0, "ISO/IEC 27001 beschreibt Anforderungen an ein ISMS. In Deutschland ergänzt der IT-Grundschutz des BSI. ISO 9241-110 betrifft Ergonomie, ISO/IEC 25010 Softwarequalität, ISO 8601 Datumsformate.", "T07"],
  ["t1", "sec", "Bei der Registrierung in einer Fitness-App sind „Profil öffentlich“ und „Daten für Werbung nutzen“ standardmäßig ausgeschaltet.\n\nWas bedeutet Privacy by Default?", ["Die datenschutzfreundlichste Einstellung ist voreingestellt.","Datenschutz wird bereits beim Entwurf der Software berücksichtigt.","Nutzer müssen jede Datenschutzeinstellung selbst aktivieren.","Die Einwilligung gilt als erteilt, solange niemand widerspricht."], 0, "Art. 25 DSGVO: Privacy by Default (datenschutzfreundliche Voreinstellungen) und Privacy by Design (Datenschutz schon beim Entwurf berücksichtigen).", "T07"],
  // T08 OOP und Entwurfsmuster
  ["t1", "mod", "Eine alte Zahlungsbibliothek bietet die Methode zahle(betragInCent: Integer). Das neue Kassensystem erwartet das Interface Zahlung mit bezahle(betrag: Double). Die Bibliothek darf nicht geändert werden.\n\nWelches Entwurfsmuster hilft?", ["Adapter","Singleton","Observer","Iterator"], 0, "Der Adapter implementiert die erwartete Schnittstelle und übersetzt die Aufrufe an die alte Klasse (hier inklusive Umrechnung in Cent).", "T08"],
  ["t1", "mod", "Ein Webshop berechnet Versandkosten je nach gewählter Versandart (Standard, Express, Abholung). Neue Versandarten sollen ohne Änderung der Bestellklasse hinzukommen.\n\nWelches Entwurfsmuster passt?", ["Strategy","Decorator","Factory","Registry"], 0, "Strategy: jede Versandart ist eine austauschbare Implementierung des Interfaces Versandstrategie, die zur Laufzeit gewählt wird.", "T08"],
  ["t1", "mod", "Ein Textfeld soll zur Laufzeit wahlweise einen Rahmen, einen Scrollbalken oder beides erhalten, ohne für jede Kombination eine Unterklasse zu bauen.\n\nWelches Entwurfsmuster passt?", ["Decorator","Adapter","Template Method","Singleton"], 0, "Decorators haben dieselbe Schnittstelle wie das Original, umhüllen es und lassen sich beliebig verschachteln.", "T08"],
  ["t1", "mod", "Alle Berichte einer Software laufen gleich ab: Daten laden, auswerten, ausgeben. Nur das Auswerten unterscheidet sich je Berichtsart.\n\nWelches Muster legt den Ablauf in der Oberklasse fest und lässt Unterklassen einzelne Schritte überschreiben?", ["Template Method","Strategy","Decorator","Abstract Factory"], 0, "Template Method nutzt Vererbung: Die Oberklasse definiert den Ablauf, Unterklassen füllen einzelne Schritte. Strategy tauscht dagegen den ganzen Algorithmus über ein Interface aus.", "T08"],
  ["t1", "mod", "Eine Bibliothekssoftware soll alle Bücher durchlaufen können, egal ob sie intern in einer Liste, einem Baum oder einem Array liegen.\n\nWozu dient das Iterator-Muster?", ["Elemente einer Sammlung durchlaufen, ohne deren innere Struktur zu kennen","Objekte einer Sammlung zentral erzeugen, ohne deren konkrete Klasse zu kennen","Interessenten über Änderungen informieren, ohne deren Klassen zu kennen","Die Schnittstelle einer Sammlung in die vom Client erwartete übersetzen"], 0, "Der Iterator bietet einheitlich hasNext() und next(). Die for-each-Schleife vieler Sprachen nutzt ihn intern.", "T08"],
  ["t1", "mod", "Ein Entwickler ordnet das Adapter-Muster in die Kategorien der Entwurfsmuster ein.\n\nZu welcher Kategorie gehört es?", ["Strukturmuster","Erzeugungsmuster","Verhaltensmuster","Architekturmuster"], 0, "Strukturmuster (Adapter, Decorator, Facade, Proxy) setzen Klassen und Objekte zu größeren Strukturen zusammen.", "T08"],
  ["t1", "mod", "Die Klasse Ticket hat das statische Attribut naechsteNummer, das bei jedem neuen Ticket erhöht wird.\n\nWas gilt für dieses Attribut?", ["Es existiert einmal für die Klasse und wird von allen Objekten geteilt.","Es existiert in jedem Ticket-Objekt als eigene Kopie mit eigenem Wert.","Es existiert einmal für die Klasse und darf danach nicht verändert werden.","Es wird bei jedem new Ticket() wieder auf seinen Startwert gesetzt."], 0, "Statische Attribute gehören zur Klasse. Typisch sind Zähler oder Konstanten; unveränderlich wird ein Attribut erst mit final bzw. const.", "T08"],
  ["t1", "mod", "In der Klasse Konto soll die statische Methode zinssatz() direkt auf das Instanzattribut saldo zugreifen. Der Compiler meldet einen Fehler.\n\nWarum ist das nicht möglich?", ["Die Methode wird ohne Objekt aufgerufen, es gibt also kein this.","Das Attribut saldo ist privat, es ist also in Klassenmethoden unsichtbar.","Die Methode wird für jedes Konto kopiert, es gibt also mehrere this.","Die Methode läuft beim Laden der Klasse, saldo ist also noch leer."], 0, "saldo gehört zu einem konkreten Konto-Objekt. Eine statische Methode (Konto.zinssatz()) läuft ohne Objekt und weiß nicht, welches Konto gemeint wäre.", "T08"],
  ["t1", "mod", "Statt einer Liste vom Typ Object verwendet ein Entwickler List<Kunde>.\n\nWelchen Vorteil bieten Generics?", ["Typprüfung durch den Compiler, keine Casts nötig","Typprüfung zur Laufzeit, falsche Objekte entfallen","Automatische Umwandlung jedes Objekts in Kunde","Mehrfachvererbung, Kunde erbt zusätzlich von List"], 0, "Fügt jemand versehentlich einen Artikel in List<Kunde> ein, fällt das schon beim Kompilieren auf statt erst zur Laufzeit.", "T08"],
  ["t1", "mod", "Beim Anlegen eines neuen Kunden mit new Kunde(\"Becker\", \"Mainz\") werden Name und Ort gesetzt.\n\nWas ist ein Konstruktor?", ["Eine spezielle Methode, die beim Erzeugen eines Objekts aufgerufen wird und es initialisiert","Eine spezielle Methode, die beim Löschen eines Objekts aufgerufen wird und Ressourcen freigibt","Eine abstrakte Methode, die jede Unterklasse überschreiben muss, um Objekte anzulegen","Ein spezielles Attribut, das beim Erzeugen eines Objekts den Klassennamen speichert"], 0, "Der Konstruktor heißt wie die Klasse, hat keinen Rückgabetyp und kann überladen werden (z. B. mit und ohne Ort).", "T08"],
  ["t1", "mod", "Die Klasse Rechnungsdrucker erhält in der Methode drucke(r: Rechnung) eine Rechnung als Parameter, speichert sie aber nicht als Attribut.\n\nWelche Beziehung besteht zwischen Rechnungsdrucker und Rechnung?", ["Abhängigkeit (Dependency)","Assoziation (Association)","Aggregation (Teil-Ganzes)","Realisierung (Realization)"], 0, "Eine kurzzeitige Nutzung ohne dauerhafte Referenz ist eine Abhängigkeit, gezeichnet als gestrichelter Pfeil mit offener Spitze. Verwechslungsgefahr: Eine Assoziation oder Aggregation läge erst vor, wenn Rechnungsdrucker die Rechnung als Attribut hielte.", "T08"],
  ["t1", "mod", "In einem Projekt greifen viele Klassen über Singletons auf Datenbank und Konfiguration zu. Das Testen einzelner Klassen wird schwierig.\n\nWelcher Nachteil von Singleton (und Registry) zeigt sich hier?", ["Globaler Zustand erschwert Tests und versteckt Abhängigkeiten.","Mehrere Instanzen pro Klasse führen zu inkonsistenten Daten.","Jeder Zugriff erzeugt ein neues Objekt und belastet den Speicher.","Private Konstruktoren verhindern den Zugriff aus anderen Klassen."], 0, "Abhängigkeiten sind nicht in der Schnittstelle sichtbar und lassen sich schwer durch Testobjekte ersetzen. Besser: Abhängigkeiten explizit übergeben (Dependency Injection).", "T08"],
  // T09 Web, HTTP und Schnittstellen
  ["t1", "ux", "Ein Kunde klickt im Onlineshop versehentlich zweimal auf „Bestellung absenden“.\n\nWelche HTTP-Methode ist nicht idempotent?", ["POST","GET","PUT","DELETE"], 0, "Idempotent heißt: mehrfach ausgeführt wirkt wie einmal. Zweimal POST legt in der Regel zwei Bestellungen an – deshalb Doppelklick-Schutz oder Idempotenz-Schlüssel.", "T09"],
  ["t1", "ux", "Ein angemeldeter Mitarbeiter ohne Admin-Rolle ruft /api/admin/benutzer auf.\n\nWelcher Statuscode passt?", ["403 Forbidden","401 Unauthorized","404 Not Found","400 Bad Request"], 0, "Der Benutzer ist authentifiziert, hat aber keine Berechtigung: 403. Bei fehlender Anmeldung wäre es 401.", "T09"],
  ["t1", "ux", "Ein POST auf /api/bestellungen legt erfolgreich die Bestellung 1007 an.\n\nWelcher Statuscode bestätigt das?", ["201 Created","200 OK","204 No Content","302 Found"], 0, "201 Created bestätigt das Anlegen, meist mit Location-Header auf die neue Ressource (/api/bestellungen/1007).", "T09"],
  ["t1", "ux", "Nach einem Update antwortet die API eines Shops bei jeder Anfrage mit einem Fehler, weil die Datenbankverbindung fehlschlägt.\n\nWelcher Statuscode-Bereich steht für Serverfehler?", ["5xx","4xx","3xx","2xx"], 0, "2xx Erfolg, 3xx Umleitung, 4xx Clientfehler, 5xx Serverfehler (z. B. 500 Internal Server Error, 503 Service Unavailable).", "T09"],
  ["t1", "ux", "Ein Versicherungsunternehmen bindet einen älteren SOAP-Webservice eines Partners an.\n\nWomit wird die Schnittstelle eines SOAP-Webservices beschrieben?", ["WSDL","JSON Schema","HTML","YAML"], 0, "Die Web Services Description Language beschreibt Operationen, Nachrichten und Endpunkte. Bei REST übernimmt das oft OpenAPI.", "T09"],
  ["t1", "ux", "Ein Bankensystem tauscht Daten über SOAP aus.\n\nWelche Aussage über SOAP stimmt?", ["Nachrichten sind XML mit Envelope, Header und Body.","Nachrichten sind JSON mit Envelope, Header und Body.","Schnittstellen werden mit OpenAPI statt WSDL beschrieben.","Ressourcen werden per GET, PUT und DELETE adressiert."], 0, "SOAP ist ein XML-basiertes Protokoll mit festen Standards (z. B. WS-Security). Es läuft meist über HTTP, ist aber schwergewichtiger als REST.", "T09"],
  ["t1", "ux", "Eine XML-Rechnung soll automatisch geprüft werden: Das Rechnungsdatum muss ein gültiges Datum, der Betrag eine Dezimalzahl sein.\n\nWas verwenden Sie?", ["XML Schema (XSD)","DTD mit ATTLIST","XSLT-Stylesheet","Namensraum (xmlns)"], 0, "XSD kennt Datentypen wie xs:date und xs:decimal. Eine DTD prüft nur die Struktur, nicht die Datentypen.", "T09"],
  ["t1", "ux", "Ein Lagerverwaltungssystem liefert Daten als XML. Daraus soll automatisch eine HTML-Übersicht erzeugt werden.\n\nWozu dient XSLT?", ["XML in ein anderes Format transformieren, z. B. HTML","XML gegen ein Schema validieren, z. B. gegen eine XSD","XML für den Versand verschlüsseln, z. B. mit AES","XML in Tabellen speichern, z. B. in MySQL"], 0, "XSLT arbeitet regelbasiert mit Templates und adressiert Knoten mit XPath.", "T09"],
  ["t1", "ux", "Ein Importprogramm soll eine 4 GB große XML-Datei mit Messwerten verarbeiten, ohne den Arbeitsspeicher zu sprengen.\n\nWelcher XML-Parser liest ereignisbasiert und speicherschonend?", ["SAX","DOM","XSD","XPath"], 0, "SAX liest das Dokument sequenziell und meldet Ereignisse (Start-Tag, Text, End-Tag). DOM lädt das ganze Dokument als Baum in den Speicher.", "T09"],
  ["t1", "ux", "In einem Forum speichert ein Angreifer im Kommentarfeld <script>…<\/script>. Jeder, der den Beitrag öffnet, führt das Skript im Browser aus.\n\nWelcher Angriff liegt vor?", ["Cross-Site Scripting (XSS)","Cross-Site Request Forgery (CSRF)","SQL-Injection (SQLi)","Clickjacking (UI-Redressing)"], 0, "Bei XSS wird fremdes Skript in eine Seite eingeschleust. Schutz: Ausgaben kodieren (HTML-Escaping), Eingaben validieren, Content Security Policy.", "T09"],
  ["t1", "ux", "Ein Nutzer ist in seinem Onlinebanking angemeldet und besucht nebenbei eine präparierte Seite, die im Hintergrund eine Überweisung absendet.\n\nWas schützt gegen diese Cross-Site Request Forgery?", ["Ein geheimes CSRF-Token in Formularen","Ein komplexeres Passwort beim Login","Eine HTTPS-Verbindung zum Bankserver","Eine Eingabevalidierung in Formularen"], 0, "Das Token kennt nur die echte Seite; fremde Seiten können es nicht mitschicken. Ergänzend helfen SameSite-Cookies.", "T09"],
  ["t1", "ux", "In einem Onlineshop erscheinen beim Tippen ins Suchfeld sofort Vorschläge, ohne dass die Seite neu lädt.\n\nWas ermöglicht AJAX?", ["Daten im Hintergrund nachladen, ohne die Seite neu zu laden","Daten offline im Browser speichern, ohne Serververbindung","Seiten auf dem Server rendern, bevor sie ausgeliefert werden","Daten vom Server zum Browser pushen, ohne dass er anfragt"], 0, "AJAX (Asynchronous JavaScript and XML) lädt Daten asynchron nach – heute meist per fetch mit JSON statt XML.", "T09"],
  ["t1", "ux", "Ein Restaurant möchte eine App, die sich vom Browser aus auf dem Startbildschirm installieren lässt und die Speisekarte auch offline zeigt.\n\nWas ist ein Merkmal einer Progressive Web App?", ["Installierbar und offlinefähig über einen Service Worker","Installierbar über den App Store, offline über native APIs","Plattformunabhängig, wird aber vorab zu nativem Code kompiliert","Offlinefähig über Cookies, die die Speisekarte speichern"], 0, "PWAs laufen im Browser, lassen sich aber wie Apps installieren. Ein Service Worker cacht Inhalte für die Offline-Nutzung.", "T09"],
  ["t1", "ux", "Eine Foto-App soll die Kamera eines iPhones voll ausreizen und maximale Performance bieten. Andere Plattformen sind nicht nötig.\n\nWelche App-Art passt?", ["Native App","Web-App","Hybride App","Statische HTML-Seite"], 0, "Native Apps werden mit dem Plattform-SDK (z. B. Swift für iOS) entwickelt und haben direkten Zugriff auf alle Geräteschnittstellen.", "T09"],
  ["t1", "ux", "Nach einem XSS-Angriff sollen Sitzungs-IDs nicht mehr per JavaScript ausgelesen werden können.\n\nWelche Cookie-Eigenschaft verhindert das?", ["HttpOnly","Secure","SameSite=None","Expires"], 0, "HttpOnly-Cookies sind für JavaScript unsichtbar. Secure erzwingt die Übertragung nur per HTTPS, SameSite schützt vor CSRF.", "T09"],
  ["t1", "ux", "Ein Museum versieht seine Online-Sammlung mit maschinenlesbaren Metadaten, damit Suchmaschinen Künstler, Epoche und Ort verstehen.\n\nWofür steht das semantische Web (Web 3.0) im engeren Sinn?", ["Maschinenlesbare Bedeutung von Inhalten, z. B. mit RDF","Nutzergenerierte Inhalte und Interaktion, z. B. mit Wikis","Dezentrale Daten und Eigentum, z. B. mit Blockchain","Responsive Darstellung von Inhalten, z. B. mit CSS"], 0, "Inhalte erhalten eine maschinenlesbare Bedeutung (RDF, Ontologien, schema.org). Web 2.0 steht dagegen für nutzergenerierte Inhalte. Verwechslungsgefahr: „Web3“ bezeichnet die Idee eines dezentralen, Blockchain-basierten Webs und ist vom semantischen Web zu unterscheiden.", "T09"],
  // T17 Programmiersprachen und Paradigmen
  ["t1", "mod", "In einer Sprache kann einer Variablen erst eine Zahl und später ein Text zugewiesen werden; Typfehler zeigen sich erst beim Ausführen.\n\nWelche Sprache ist dynamisch typisiert?", ["Python","Java","Kotlin","C++"], 0, "Bei dynamischer Typisierung werden Typen zur Laufzeit geprüft. Java, Kotlin und C++ prüfen statisch beim Kompilieren.", "T17"],
  ["t1", "mod", "Ein Python-Skript führt \"3\" + 3 aus.\n\nWoran zeigt sich, dass Python stark typisiert ist?", ["\"3\" + 3 führt zu einem TypeError.","Variablen brauchen keine Typangabe.","Python wird interpretiert.","Python unterstützt Klassen."], 0, "Stark typisiert heißt: kaum implizite Typumwandlung. JavaScript (schwach typisiert) liefert dagegen \"33\". Fehlende Typangaben bedeuten nur dynamische Typisierung.", "T17"],
  ["t1", "mod", "Eine Java-Anwendung wird in Bytecode übersetzt und in der JVM ausgeführt. Häufig genutzte Methoden laufen nach kurzer Zeit deutlich schneller.\n\nWas macht der Just-in-Time-Compiler?", ["Er übersetzt Bytecode zur Laufzeit in Maschinencode.","Er übersetzt Quellcode vor dem Start in Bytecode.","Er interpretiert Bytecode Zeile für Zeile ohne Übersetzung.","Er übersetzt Maschinencode zur Laufzeit zurück in Bytecode."], 0, "Der JIT übersetzt (häufig genutzten) Bytecode während der Ausführung in nativen Maschinencode. So arbeiten die JVM und .NET.", "T17"],
  ["t1", "mod", "Ein Team entscheidet zwischen einer kompilierten und einer interpretierten Sprache für eine rechenintensive Anwendung.\n\nWelcher Vorteil spricht für einen Compiler?", ["Schnellere Ausführung, viele Fehler werden vorab gefunden","Der Quellcode läuft ohne Übersetzung auf jeder Plattform","Änderungen lassen sich ohne Übersetzung sofort ausführen","Kürzere Entwicklungszyklen, da kein Build-Schritt nötig ist"], 0, "Der Compiler übersetzt vorab in Maschinencode und meldet Syntax- und Typfehler vor der Ausführung. Nachteil: Übersetzungszeit und plattformabhängiges Ergebnis.", "T17"],
  ["t1", "mod", "Mit SELECT Name FROM Kunde WHERE Ort = 'Mainz' beschreibt man, welche Daten man will, nicht wie sie gesucht werden.\n\nZu welcher Sprachgeneration gehört SQL?", ["4GL","3GL","2GL","1GL"], 0, "4GL sind problemorientiert und deklarativ. 3GL sind höhere imperative Sprachen wie C oder Java, 2GL Assembler, 1GL Maschinencode.", "T17"],
  ["t1", "mod", "Für einen Mikrocontroller wird Code mit Befehlen wie MOV, ADD und JMP geschrieben.\n\nUm welche Sprache handelt es sich?", ["Assembler – maschinennahe Sprache der zweiten Generation","Maschinencode – binäre Sprache der ersten Generation","C – prozedurale Hochsprache der dritten Generation","Bytecode – plattformunabhängige Zwischensprache einer VM"], 0, "Assembler nutzt Mnemonics, die direkt Maschinenbefehlen entsprechen. Der Code ist prozessorabhängig.", "T17"],
  ["t1", "mod", "Eine Sprache ist nur für einen bestimmten Anwendungsbereich gedacht, hier die Gestaltung von Webseiten.\n\nWelche Sprache ist eine domänenspezifische Sprache (DSL)?", ["CSS","Java","C++","Python"], 0, "CSS beschreibt nur die Darstellung von HTML-Elementen. Weitere DSLs: SQL, reguläre Ausdrücke, HTML. Java, C++ und Python sind Allzwecksprachen.", "T17"],
  ["t1", "mod", "Die Funktion brutto(netto) liefert netto * 1,19, liest keine globalen Variablen und verändert nichts außerhalb.\n\nWas kennzeichnet eine solche pure Funktion?", ["Gleiche Eingabe liefert immer gleiche Ausgabe, ohne Seiteneffekte.","Gleiche Eingabe liefert gleiche Ausgabe, Seiteneffekte sind erlaubt.","Sie speichert ihr Ergebnis global, damit andere es wiederverwenden.","Sie liest den Steuersatz aus der Konfiguration und bleibt so flexibel."], 0, "Pure Funktionen hängen nur von ihren Parametern ab und verändern keinen Zustand. Sie sind leicht testbar und parallelisierbar.", "T17"],
  ["t1", "mod", "Die Methode filter(liste, bedingung) erhält als zweiten Parameter eine Funktion, z. B. p -> p > 100.\n\nWie nennt man eine Funktion wie filter?", ["Higher-Order Function","Funktion mit mehr als drei Parametern","Rekursive Funktion","Statische Methode"], 0, "Higher-Order Functions nehmen Funktionen als Parameter oder geben welche zurück. Typische Beispiele: map, filter, reduce.", "T17"],
  ["t1", "mod", "Aus einer Liste von Rechnungsbeträgen soll mit einem Stream die Gesamtsumme berechnet werden.\n\nWelche Operation fasst eine Liste zu einem einzigen Wert zusammen?", ["Reduce","Map","Filter","FlatMap"], 0, "Reduce fasst zusammen (Summe, Maximum). Map wandelt jedes Element um, Filter wählt Elemente aus.", "T17"],
  ["t1", "mod", "Eine Desktop-App lädt beim Klick auf „Aktualisieren“ Daten von einem Server. Währenddessen reagiert die Oberfläche einige Sekunden lang nicht.\n\nWelche Lösung passt?", ["Daten asynchron laden, z. B. mit async/await","Daten blockierend laden, z. B. mit Thread.sleep()","Oberfläche öfter neu zeichnen, z. B. mit repaint()","Server-Timeout erhöhen, z. B. auf 60 Sekunden"], 0, "Beim asynchronen Laden blockiert der UI-Thread nicht. Die Oberfläche bleibt bedienbar, das Ergebnis wird angezeigt, sobald es da ist.", "T17"],
  ["t1", "mod", "Zwei Threads erhöhen gleichzeitig denselben Zähler. Je nach zeitlicher Abfolge fehlen am Ende einige Erhöhungen.\n\nWie nennt man dieses Problem?", ["Race Condition","Wettlauf zwischen zwei Compilern","Besonders schneller Algorithmus","Kompilierfehler"], 0, "Bei einer Race Condition hängt das Ergebnis von der zufälligen Reihenfolge paralleler Zugriffe ab. Abhilfe: Synchronisation, Sperren, atomare Operationen, unveränderliche Daten.", "T17"],
  ["t1", "mod", "Ein Backup-Skript wird nachts automatisch gestartet. Die Überwachung wertet den Exit-Code aus.\n\nWelcher Exit-Code meldet üblicherweise Erfolg?", ["0","1","-1","255"], 0, "0 bedeutet Erfolg, jeder andere Wert signalisiert einen Fehler. Skripte und CI-Pipelines entscheiden anhand dieses Werts über den weiteren Ablauf.", "T17"],
  ["t1", "mod", "Ein Programm öffnet eine Datei im try-Block. Beim Lesen kann eine Exception auftreten. Die Datei soll in jedem Fall geschlossen werden.\n\nWann wird der finally-Block ausgeführt?", ["Immer, egal ob eine Exception auftrat","Nur dann, wenn eine Exception auftrat","Nur dann, wenn keine Exception auftrat","Nur dann, wenn kein catch-Block existiert"], 0, "finally läuft nach try bzw. catch immer – ideal zum Freigeben von Ressourcen wie Dateien oder Datenbankverbindungen.", "T17"],
  ["t1", "mod", "Ein Auszubildender hat in einer Java-Klasse ein Semikolon vergessen und an anderer Stelle die Mehrwertsteuer falsch berechnet.\n\nWelcher Fehler wird schon vom Compiler erkannt?", ["Syntaxfehler","Logischer Fehler","Division durch null zur Laufzeit","Falsch umgesetzte Geschäftsregel"], 0, "Der Compiler erkennt Syntax- und Typfehler. Laufzeitfehler zeigen sich erst beim Ausführen, logische Fehler (falsche MwSt.) nur durch Tests.", "T17"],
  ["t1", "mod", "Bei Spring Boot schreibt ein Entwickler nur Controller-Methoden; das Framework entscheidet, wann sie aufgerufen werden. Eine Bibliothek wie Apache Commons ruft er dagegen selbst auf.\n\nWas unterscheidet ein Framework von einer Bibliothek?", ["Das Framework gibt die Struktur vor und ruft deinen Code auf (Inversion of Control).","Die Bibliothek gibt die Struktur vor und ruft deinen Code auf (Inversion of Control).","Das Framework wird von deinem Code aufgerufen, wann immer du es brauchst (Delegation).","Das Framework wird zur Laufzeit geladen, eine Bibliothek fest einkompiliert (Linking)."], 0, "Inversion of Control bzw. Hollywood-Prinzip: „Don't call us, we call you.“", "T17"],
  ["t1", "mod", "Eine Fachabteilung baut ihre Urlaubsplanung selbst mit einer Low-Code-Plattform.\n\nWas ist ein typischer Nachteil?", ["Abhängigkeit vom Anbieter und Grenzen bei Spezialanforderungen","Zwingend nötige Programmierkenntnisse in Java oder C# für alle Nutzer","Höhere Entwicklungszeit als bei klassischer Individualprogrammierung","Keine Möglichkeit, Daten dauerhaft in einer Datenbank zu speichern"], 0, "Vendor-Lock-in, begrenzte Anpassbarkeit und Governance-Probleme (Schatten-IT). Vorteil: schnelle Ergebnisse, auch ohne Programmierkenntnisse.", "T17"],
  ["t1", "mod", "Ein Expertensystem wird mit Fakten wie elternteil(anna, ben) und Regeln wie grosselternteil(X, Z) definiert. Das System leitet Antworten selbst ab.\n\nWelches Paradigma liegt vor?", ["Logische Programmierung, z. B. Prolog","Funktionale Programmierung, z. B. Haskell","Objektorientierte Programmierung, z. B. Java","Imperative Programmierung, z. B. C"], 0, "Logische Programmierung ist deklarativ: Man beschreibt Fakten und Regeln, die Laufzeitumgebung findet die Lösung.", "T17"],
  ["t1", "mod", "Ein Linux-Server soll jede Nacht um 2 Uhr automatisch ein Backup-Skript ausführen.\n\nWomit planen Sie das?", ["cron","grep","ssh","chmod"], 0, "cron führt Aufgaben zeitgesteuert aus, z. B. mit dem Eintrag 0 2 * * * /opt/backup.sh. Unter Windows übernimmt das die Aufgabenplanung.", "T17"],
  // T18 Architektur, Cloud und Versionsverwaltung
  ["t1", "ux", "Ein Onlinehändler zerlegt seinen Shop in die Dienste Katalog, Warenkorb, Bezahlung und Versand, jeweils mit eigener Datenbank.\n\nWas ist ein typischer Vorteil von Microservices?", ["Dienste lassen sich unabhängig entwickeln, deployen und skalieren.","Alle Dienste teilen sich eine Datenbank und sind dadurch konsistent.","Betrieb und Monitoring sind einfacher als bei einem Monolithen.","Aufrufe zwischen den Diensten laufen ohne Netzwerkkommunikation."], 0, "Am Black Friday kann z. B. nur der Warenkorb-Dienst hochskaliert werden. Jeder Dienst hat eine klar abgegrenzte Aufgabe und eigene Daten.", "T18"],
  ["t1", "ux", "Nach der Umstellung auf 30 Microservices klagt das Betriebsteam über deutlich mehr Aufwand.\n\nWas ist ein typischer Nachteil von Microservices?", ["Höherer Aufwand für Betrieb, Monitoring und Kommunikation zwischen Diensten","Fehlende Möglichkeit, die einzelnen Dienste unabhängig voneinander zu skalieren","Zwang, alle 30 Dienste in derselben Programmiersprache zu entwickeln","Gemeinsames Deployment aller 30 Dienste bei jeder kleinen Änderung"], 0, "Verteilte Systeme bringen Netzwerklatenz, verteilte Fehlersuche, Versionierung von Schnittstellen und aufwendiges Monitoring mit sich.", "T18"],
  ["t1", "ux", "Eine Webanwendung zur Raumbuchung ist nach der klassischen 3-Schichten-Architektur aufgebaut.\n\nWelche Schicht gehört nicht dazu?", ["Hardwareschicht","Präsentationsschicht","Logikschicht","Datenhaltungsschicht"], 0, "Die drei Schichten sind Präsentation (Frontend), Geschäftslogik (Backend/API) und Datenhaltung (Datenbank).", "T18"],
  ["t1", "ux", "Ein Rechnungsmodul greift nur über die Schnittstelle KundenService auf Kundendaten zu und kennt deren interne Speicherung nicht.\n\nWas bedeutet lose Kopplung?", ["Module hängen nur über schmale, klare Schnittstellen voneinander ab.","Module greifen direkt auf die internen Daten anderer Module zu.","Module teilen sich globale Variablen, um Daten schnell auszutauschen.","Jedes Modul enthält nur Funktionen, die fachlich eng zusammengehören."], 0, "Lose Kopplung und hohe Kohäsion erleichtern Änderungen und Tests: Die Kundenspeicherung kann geändert werden, ohne das Rechnungsmodul anzupassen. Verwechslungsgefahr: Dass ein Modul nur fachlich eng Zusammengehöriges enthält, beschreibt hohe Kohäsion, nicht lose Kopplung.", "T18"],
  ["t1", "ux", "Ein Start-up nutzt eine vom Anbieter verwaltete Datenbank und lädt nur seinen Code auf eine bereitgestellte Laufzeitumgebung. Um Betriebssystem und Updates kümmert es sich nicht.\n\nWelches Cloud-Modell liegt vor?", ["PaaS","IaaS","SaaS","On-Premises"], 0, "Platform as a Service: Der Anbieter betreibt Infrastruktur, Betriebssystem und Laufzeit, der Kunde liefert nur die Anwendung.", "T18"],
  ["t1", "ux", "Ein Unternehmen mietet bei einem Cloud-Anbieter virtuelle Server und installiert Betriebssystem, Datenbank und Anwendung selbst.\n\nWelches Cloud-Modell liegt vor?", ["IaaS","PaaS","SaaS","FaaS"], 0, "Infrastructure as a Service: Der Anbieter stellt virtuelle Maschinen, Netz und Speicher; alles darüber verwaltet der Kunde.", "T18"],
  ["t1", "ux", "Bei jedem hochgeladenen Bild soll automatisch eine kleine Vorschau erzeugt werden. Abgerechnet wird nur pro Ausführung.\n\nWas kennzeichnet Serverless bzw. Function as a Service?", ["Einzelne Funktionen laufen ereignisgesteuert und werden pro Ausführung abgerechnet.","Es gibt keine Server mehr, die Funktionen laufen direkt auf den Clients der Nutzer.","Virtuelle Maschinen laufen dauerhaft und werden pro Monat pauschal abgerechnet.","Die Anwendung wird als Software im Browser genutzt und pro Nutzer abgerechnet."], 0, "Server gibt es natürlich weiterhin, der Anbieter verwaltet sie aber vollständig. Der Entwickler liefert nur einzelne Funktionen.", "T18"],
  ["t1", "ux", "Ein Team überlegt, ob es seine Anwendung in virtuellen Maschinen oder in Docker-Containern betreibt.\n\nWas unterscheidet einen Container von einer virtuellen Maschine?", ["Container teilen sich den Kernel des Hosts und starten schneller.","Container bringen ein eigenes Gastbetriebssystem samt Kernel mit.","Container benötigen einen Hypervisor und laufen nur in der Cloud.","Virtuelle Maschinen teilen sich den Kernel und sind leichtgewichtiger."], 0, "Eine VM bringt ein eigenes Gastbetriebssystem mit. Container isolieren nur Prozesse, sind dadurch kleiner und starten in Sekunden.", "T18"],
  ["t1", "ux", "Ein Onlineshop läuft in 40 Containern auf mehreren Servern. Fällt ein Container aus, soll automatisch ein neuer gestartet werden; bei Last sollen mehr Container laufen.\n\nWofür wird Kubernetes eingesetzt?", ["Orchestrierung vieler Container: Verteilung, Skalierung, Neustart","Erstellung einzelner Container-Images: Dockerfile, Build, Registry","Versionsverwaltung des Quellcodes: Branches, Merges, Pull Requests","Virtualisierung kompletter Server: Hypervisor, Gastsystem, Snapshots"], 0, "Docker baut und startet einzelne Container, Kubernetes verwaltet viele Container im Verbund.", "T18"],
  ["t1", "ux", "Eine Entwicklerin arbeitet im Zug ohne Internetverbindung und möchte trotzdem ihre Änderungen versionieren.\n\nWas ist ein Vorteil verteilter Versionsverwaltung wie Git?", ["Jeder hat die vollständige Historie lokal und kann offline committen.","Ein zentraler Server speichert jeden Commit sofort und sicher ab.","Merges sind nicht nötig, da alle direkt auf demselben Branch arbeiten.","Dateien werden beim Bearbeiten gesperrt, sodass keine Konflikte entstehen."], 0, "Zentrale Systeme wie Subversion brauchen für jeden Commit den Server. Bei Git wird später per Push synchronisiert.", "T18"],
  ["t1", "ux", "Zwei Entwickler ändern in ihren Feature-Branches dieselbe Zeile in config.json unterschiedlich.\n\nWann entsteht ein Merge-Konflikt?", ["Wenn zwei Branches dieselbe Stelle einer Datei unterschiedlich geändert haben","Wenn zwei Branches verschiedene Dateien des Projekts gleichzeitig geändert haben","Wenn ein Branch gepusht wird, ohne dass vorher ein Pull Request erstellt wurde","Wenn beide Branches dieselbe Datei an verschiedenen Stellen geändert haben"], 0, "Git kann nicht entscheiden, welche Änderung gilt. Ein Mensch löst den Konflikt, danach wird committet. Änderungen an verschiedenen Dateien oder an verschiedenen Stellen derselben Datei führt Git automatisch zusammen.", "T18"],
  ["t1", "ux", "Ein Entwickler hat ein Feature in einem eigenen Branch fertiggestellt. Bevor es in main gelangt, sollen Kollegen den Code prüfen.\n\nWozu dient ein Pull Request?", ["Änderungen eines Branches zur Prüfung und zum Zusammenführen vorschlagen","Änderungen aus dem entfernten Repository in den lokalen Branch holen","Einen Branch ohne Prüfung direkt in main übernehmen und anschließend löschen","Den aktuellen Stand eines Branches als Sicherung auf einen Server kopieren"], 0, "Pull Requests ermöglichen Code-Reviews, Diskussionen und automatische Tests vor dem Merge. Verwechslungsgefahr: git pull holt dagegen Änderungen aus dem entfernten Repository.", "T18"],
  ["t1", "ux", "Das Team veröffentlicht die Version 1.2.0 seiner App und will diesen Stand dauerhaft wiederfinden.\n\nWas ist ein Tag in Git?", ["Eine feste Markierung eines Commits, z. B. für das Release v1.2.0","Ein Branch für das Release v1.2.0, der mit neuen Commits weiterwandert","Ein Kommentar im Code, der die Version v1.2.0 im Quelltext angibt","Eine Kopie des Repositorys, z. B. als Backup des Release v1.2.0"], 0, "Tags markieren Versionen dauerhaft. Anders als ein Branch bewegt sich ein Tag nicht weiter.", "T18"],
  ["t1", "ux", "In Team A geht jede erfolgreich getestete Änderung automatisch live. In Team B wartet sie auf einen Freigabeklick.\n\nWas unterscheidet Continuous Delivery von Continuous Deployment?", ["Bei Delivery erfolgt die Freigabe in Produktion manuell, bei Deployment automatisch.","Bei Delivery wird automatisch in die Produktion freigegeben, bei Deployment manuell.","Bei Delivery wird nur gebaut, bei Deployment werden zusätzlich Tests ausgeführt.","Bei Delivery wird täglich ausgeliefert, bei Deployment einmal pro Sprint gesammelt."], 0, "Team A nutzt Continuous Deployment, Team B Continuous Delivery. Beide bauen auf Continuous Integration auf.", "T18"],
  ["t1", "ux", "Ein Team arbeitet mit den festen Branches main, develop, feature/*, release/* und hotfix/*.\n\nWelche Branching-Strategie ist das?", ["Git-Flow","Trunk-based Development","Forking ohne Branches","Kanban"], 0, "Git-Flow trennt Entwicklung und Releases streng. Trunk-based Development integriert dagegen sehr häufig direkt in main, oft mit Feature-Toggles.", "T18"],
  ["t1", "ux", "Eine Importstrecke liest CSV-Dateien, bereinigt sie, rechnet Währungen um und schreibt sie in die Datenbank – jeder Schritt ist ein eigener Baustein.\n\nWelches Architekturmuster liegt vor?", ["Pipes and Filters","Schichtenarchitektur","Model View Controller","Publish-Subscribe"], 0, "Daten durchlaufen nacheinander unabhängige Verarbeitungsschritte (Filter), verbunden über Pipes. Typisch für ETL-Strecken und Kommandozeilen-Pipes.", "T18"],
  // T19 Ergonomie, Recht und Softwarearten
  ["t1", "ux", "Ein Import von 100.000 Datensätzen läuft mehrere Minuten. Der Nutzer kann ihn jederzeit pausieren, fortsetzen oder abbrechen.\n\nWelcher Grundsatz der ISO 9241-110 ist erfüllt?", ["Steuerbarkeit","Erwartungskonformität","Lernförderlichkeit","Individualisierbarkeit"], 0, "Steuerbarkeit: Der Nutzer bestimmt Ablauf, Richtung und Tempo des Dialogs.", "T19"],
  ["t1", "ux", "Ein Bestellformular markiert ein ungültiges Datum rot mit Hinweis auf das richtige Format und behält alle anderen Eingaben.\n\nWelcher Grundsatz ist erfüllt?", ["Fehlertoleranz (Robustheit gegen Benutzungsfehler)","Steuerbarkeit (Einfluss auf Ablauf des Dialogs)","Individualisierbarkeit (Anpassung an persönliche Vorlieben)","Erlernbarkeit (Unterstützung beim Einarbeiten)"], 0, "Fehler werden erkannt und lassen sich mit minimalem Aufwand korrigieren, ohne dass Eingaben verloren gehen.", "T19"],
  ["t1", "ux", "In einer Warenwirtschaft sitzt der Speichern-Button in allen Masken an derselben Stelle und heißt immer gleich.\n\nWelcher Grundsatz ist erfüllt?", ["Erwartungskonformität","Selbstbeschreibungsfähigkeit","Fehlertoleranz","Lernförderlichkeit"], 0, "Konsistente Gestaltung entspricht den Erwartungen der Nutzer – sie müssen nicht in jeder Maske neu suchen.", "T19"],
  ["t1", "ux", "In einer Lern-App können Nutzer Schriftgröße und Farbschema an ihre Bedürfnisse anpassen.\n\nWelcher Grundsatz der klassischen Fassung der ISO 9241-110 ist erfüllt?", ["Individualisierbarkeit","Steuerbarkeit","Aufgabenangemessenheit","Erwartungskonformität"], 0, "Individualisierbarkeit: Anpassung an Bedürfnisse und Fähigkeiten. In der Fassung 2020 wurde der Grundsatz durch „Benutzerbindung“ ersetzt; die Anpassbarkeit wird dort anderen Grundsätzen zugeordnet.", "T19"],
  ["t1", "ux", "Im Checkout eines Shops soll der Kunde genau eine von drei Zahlungsarten wählen: PayPal, Kreditkarte oder Rechnung.\n\nWelches Bedienelement passt?", ["Radiobuttons","Checkboxen","Mehrzeiliges Textfeld","Schieberegler"], 0, "Radiobuttons erzwingen genau eine Auswahl und zeigen bei wenigen Optionen alle auf einen Blick. Bei sehr vielen Optionen wäre ein Dropdown besser.", "T19"],
  ["t1", "ux", "Auf einer Nachrichtenseite können Leser beliebig viele Newsletter-Themen abonnieren: Politik, Sport, Kultur, Wirtschaft.\n\nWelches Bedienelement passt?", ["Checkboxen","Radiobuttons","Dropdown mit Einfachauswahl","Ein einzelner Button"], 0, "Jede Checkbox ist unabhängig von den anderen – null, eine oder mehrere Auswahlen sind möglich.", "T19"],
  ["t1", "ux", "Ein Team misst, wie schnell Nutzer eine Bestellung abschließen. Die Marketingabteilung interessiert sich zusätzlich dafür, wie sich Kunden vor, während und nach dem Kauf fühlen.\n\nWas unterscheidet User Experience von Usability?", ["UX umfasst das gesamte Erleben vor, während und nach der Nutzung.","UX beschränkt sich auf die Effizienz der Bedienung während der Nutzung.","Usability umfasst das gesamte Erleben vor, während und nach der Nutzung.","UX bezeichnet die optische Gestaltung von Farben und Layout der Oberfläche."], 0, "Usability (ISO 9241-11): effektiv, effizient und zufriedenstellend ans Ziel. User Experience umfasst zusätzlich Erwartungen und Emotionen – Usability ist ein Teil davon.", "T19"],
  ["t1", "ux", "Ein Unternehmen ändert eine GPL-lizenzierte Bibliothek und verkauft seine Software mit dieser Bibliothek an Kunden.\n\nWas muss es tun?", ["Den geänderten Quellcode unter der GPL mitliefern bzw. zugänglich machen","Die Bibliothek umbenennen und unter einer eigenen proprietären Lizenz verkaufen","Die Bibliothek in der Lizenzdatei nennen, den Quellcode aber nicht offenlegen","Eine Lizenzgebühr an die Free Software Foundation für den Vertrieb zahlen"], 0, "Die GPL hat ein starkes Copyleft: Abgeleitete Werke müssen beim Vertrieb wieder unter der GPL mit Quellcode weitergegeben werden.", "T19"],
  ["t1", "ux", "Ein Softwarehaus möchte eine Open-Source-Bibliothek in sein kommerzielles, geschlossenes Produkt einbauen.\n\nWelche Lizenz erlaubt das, wenn der Lizenzhinweis erhalten bleibt?", ["MIT","GPL","AGPL","Proprietäre EULA eines Dritten"], 0, "MIT (und ähnlich Apache) ist freizügig: Nutzung, Änderung und Vertrieb auch in proprietärer Software, solange Copyright- und Lizenzhinweis erhalten bleiben.", "T19"],
  ["t1", "ux", "Ein Ingenieurbüro hat 50 Mitarbeitende, aber höchstens 10 nutzen die teure CAD-Software gleichzeitig.\n\nWas bedeutet Concurrent-Use-Lizenzierung?", ["Die Zahl der gleichzeitigen Nutzer ist begrenzt.","Jeder Mitarbeitende braucht eine eigene Lizenz.","Die Zahl der Geräte mit Installation ist begrenzt.","Die Nutzungsdauer pro Tag und Person ist begrenzt."], 0, "Hier reichen 10 Lizenzen, die ein Lizenzserver verteilt. Gut für Software, die viele nur gelegentlich nutzen. Verwechslungsgefahr: Named-User-Lizenzen gelten je Person, Gerätelizenzen je Installation.", "T19"],
  ["t1", "ux", "Ein angestellter Entwickler programmiert während der Arbeitszeit ein Tool zur Lagerverwaltung. Nach seiner Kündigung will er es selbst verkaufen.\n\nWem stehen die Nutzungsrechte zu?", ["Dem Arbeitgeber","Allein dem Angestellten","Dem Kunden","Der IHK"], 0, "§ 69b UrhG: Bei Computerprogrammen, die ein Arbeitnehmer in Erfüllung seiner Aufgaben schafft, stehen die vermögensrechtlichen Befugnisse dem Arbeitgeber zu.", "T19"],
  ["t1", "ux", "Ein Wettbewerber wirbt mit „100 % Ausfallsicherheit garantiert“, obwohl sein Rechenzentrum mehrfach ausgefallen ist.\n\nWelches Gesetz verbietet irreführende Werbung?", ["UWG (Gesetz gegen den unlauteren Wettbewerb)","GWB (Gesetz gegen Wettbewerbsbeschränkungen)","UrhG (Gesetz über Urheberrecht und verwandte Schutzrechte)","ProdHaftG (Produkthaftungsgesetz)"], 0, "Das UWG schützt Mitbewerber und Verbraucher vor unlauteren geschäftlichen Handlungen wie irreführender Werbung. Verwechslungsgefahr: Das GWB (Kartellrecht) regelt Wettbewerbsbeschränkungen wie Preisabsprachen.", "T19"],
  ["t1", "ux", "Ein Möbelhersteller möchte Einkauf, Lager, Produktion und Buchhaltung in einem integrierten System abbilden.\n\nWelche Softwareart passt?", ["ERP","CRM","CMS","CAD"], 0, "Enterprise Resource Planning (z. B. SAP) bildet die Geschäftsprozesse integriert ab. CRM verwaltet Kundenbeziehungen, CMS Webinhalte.", "T19"],
  ["t1", "ux", "Die Marketingabteilung will die Inhalte der Firmenwebsite selbst pflegen, ohne HTML zu schreiben.\n\nWofür steht CMS?", ["Content-Management-System zur Pflege von Webinhalten","Customer-Management-System zur Pflege von Kundendaten","Code-Management-System zur Pflege von Quellcode","Cloud-Management-System zur Verwaltung von Servern"], 0, "Ein CMS trennt Inhalt und Gestaltung; Redakteure pflegen Inhalte über eine Oberfläche. Beispiele: WordPress, TYPO3.", "T19"],
  ["t1", "ux", "Ein Logistikunternehmen lässt sich eine Tourenplanung exakt nach seinen Prozessen programmieren.\n\nWas ist Individualsoftware?", ["Eine für einen bestimmten Auftraggeber entwickelte Lösung","Eine für viele verschiedene Kunden entwickelte, anpassbare Lösung","Eine von einer einzelnen Person genutzte Anwendung","Eine kostenlos verfügbare Lösung mit offenem Quellcode"], 0, "Individualsoftware ist passgenau, aber teurer und dauert länger. Gegenstück: Standardsoftware für viele Kunden.", "T19"],
  ["t1", "ux", "Zum Abschluss eines Projekts werden ein Benutzerhandbuch und eine technische Dokumentation erstellt.\n\nFür wen ist die Benutzerdokumentation geschrieben?", ["Für Anwender, verständlich ohne Entwicklerwissen","Für Entwickler, mit Quellcodeauszügen und Architektur","Für den Betrieb, mit Installations- und Serverdetails","Für den Auftraggeber, mit Kosten- und Terminübersicht"], 0, "Die Benutzerdokumentation erklärt die Bedienung ohne Fachjargon. Die technische Dokumentation richtet sich an Entwicklung und Betrieb.", "T19"]
);

PAKETE.push(
  { id: "G01", titel: "Datenstrukturen, Suchen und Sortieren", teil: "Teil 2", prio: "Wichtig", h: 2, relevanz: "Standardalgorithmen und Datenstrukturen stehen im Prüfungskatalog. In Algorithmen-Aufgaben musst du sie meist anwenden, nicht nur nennen.",
    kern: [
      ["Array und Liste", "Ein Array hat eine feste Größe und erlaubt den Zugriff per Index in konstanter Zeit. Eine dynamische Liste (z. B. ArrayList) wächst automatisch. Eine verkettete Liste fügt schnell ein und löscht schnell, braucht für das n-te Element aber einen Durchlauf.", "werte[i]       // Zugriff per Index\nliste.add(x)   // anhängen\nliste.get(i)   // lesen\nliste.size()   // Anzahl"],
      ["Stack und Queue", "Ein Stack arbeitet nach LIFO: push legt oben ab, pop nimmt das oberste Element. Einsatz: Rückgängig-Funktion, Aufrufstapel, Klammerprüfung. Eine Queue arbeitet nach FIFO: hinten anfügen, vorne entnehmen. Einsatz: Druckaufträge, Nachrichtenverarbeitung."],
      ["Baum und Graph", "Ein Baum hat eine Wurzel; jeder andere Knoten hat genau einen Elternknoten. Im binären Suchbaum liegen kleinere Schlüssel links, größere rechts; Suchen dauert bei ausgeglichenem Baum etwa log2(n) Schritte. Ein Graph besteht aus Knoten und Kanten (gerichtet oder ungerichtet, gewichtet) und modelliert Netze wie Straßen oder Abhängigkeiten."],
      ["Lineare und binäre Suche", "Die lineare Suche prüft jedes Element nacheinander und funktioniert immer (bis zu n Vergleiche). Die binäre Suche halbiert den Suchbereich bei jedem Schritt und braucht höchstens etwa log2(n) + 1 Vergleiche, setzt aber sortierte Daten voraus.", "links = 0\nrechts = n - 1\nsolange links <= rechts\n  mitte = (links + rechts) / 2   // ganzzahlig\n  wenn werte[mitte] = gesucht dann\n    rückgabe mitte\n  sonst wenn werte[mitte] < gesucht dann\n    links = mitte + 1\n  sonst\n    rechts = mitte - 1\n  ende wenn\nende solange\nrückgabe -1"],
      ["Sortierverfahren im Vergleich", "Bubble Sort vertauscht benachbarte Elemente. Selection Sort sucht in jedem Durchlauf das Minimum und setzt es nach vorn (wenige Tauschvorgänge). Insertion Sort fügt jedes Element in den sortierten linken Teil ein und ist bei fast sortierten Daten schnell. Alle drei liegen im schlechtesten Fall bei O(n²); Quicksort und Mergesort schaffen im Mittel O(n · log n)."],
      ["Rekursion richtig aufbauen", "Jede rekursive Methode braucht einen Rekursionsanker (Abbruchbedingung) und einen rekursiven Schritt, der das Problem verkleinert. Fehlt der Anker, läuft der Aufrufstapel über. Rekursion ist elegant bei Bäumen und Verzeichnissen, kostet aber Speicher pro Aufruf.", "methode fakultaet(n : Integer) : Integer\n  wenn n <= 1 dann\n    rückgabe 1                    // Anker\n  ende wenn\n  rückgabe n * fakultaet(n - 1)   // Schritt\nende methode"],
      ["Laufzeit grob einschätzen", "Die O-Notation beschreibt, wie der Aufwand mit der Datenmenge wächst: O(1) konstant (Indexzugriff), O(log n) (binäre Suche), O(n) (eine Schleife), O(n²) (zwei verschachtelte Schleifen). In der Prüfung reicht meist die Begründung über die Anzahl der Schleifen."]
    ],
    fallen: ["Binäre Suche auf unsortierte Daten angewendet.", "Die Mitte als Kommazahl berechnet statt ganzzahlig.", "Stack und Queue verwechselt (LIFO und FIFO).", "Rekursion ohne Abbruchbedingung.", "Bei Sortierverfahren die äußere Schleife einen Durchlauf zu weit laufen lassen."],
    ziele: ["Ich wähle die passende Datenstruktur und begründe sie.", "Ich schreibe die binäre Suche in Pseudocode.", "Ich unterscheide Bubble, Selection und Insertion Sort.", "Ich baue eine rekursive Methode mit Anker."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G02", titel: "SQL: Sprachbereiche, Mengen und Unterabfragen", teil: "Teil 2", prio: "Wichtig", h: 1.5, relevanz: "Ergänzt „SQL komplett“ um Sprachbereiche, Mengenoperationen, EXISTS und Transaktionen. Diese Punkte tauchen als Teilfragen in SQL-Aufgaben oder als Kurzfragen in Planen auf.",
    kern: [
      ["Sprachbereiche", "DDL definiert die Struktur (CREATE, ALTER, DROP). DML ändert Daten (INSERT, UPDATE, DELETE). DQL fragt ab (SELECT). DCL regelt Rechte (GRANT, REVOKE). TCL steuert Transaktionen (COMMIT, ROLLBACK, SAVEPOINT)."],
      ["CRUD und HTTP", "Create = INSERT (POST), Read = SELECT (GET), Update = UPDATE (PUT oder PATCH), Delete = DELETE (DELETE)."],
      ["Weitere Join-Arten", "FULL OUTER JOIN liefert alle Zeilen beider Tabellen; fehlende Partner werden mit NULL aufgefüllt. CROSS JOIN bildet das kartesische Produkt. Ein Self Join verbindet eine Tabelle mit sich selbst, z. B. Mitarbeiter mit Vorgesetztem; dafür braucht man Aliasnamen.", "SELECT m.Name, v.Name AS Vorgesetzter\nFROM Mitarbeiter m\nLEFT JOIN Mitarbeiter v ON m.VorgesetzterID = v.MID;"],
      ["Unterabfragen mit EXISTS, IN, ANY, ALL", "IN prüft gegen eine Werteliste, EXISTS nur, ob die Unterabfrage mindestens eine Zeile liefert. > ALL heißt größer als jeder Wert, > ANY größer als mindestens einer. Vorsicht: NOT IN liefert nichts, sobald die Unterabfrage NULL enthält.", "SELECT k.Name\nFROM Kunde k\nWHERE NOT EXISTS (\n  SELECT * FROM Bestellung b WHERE b.KID = k.KID\n);"],
      ["Mengenoperationen", "UNION vereinigt zwei Ergebnisse ohne Duplikate (UNION ALL mit Duplikaten), INTERSECT liefert die Schnittmenge, EXCEPT (in Oracle MINUS) die Differenz. Beide Abfragen brauchen gleich viele Spalten mit verträglichen Datentypen.", "SELECT Ort FROM Kunde\nINTERSECT\nSELECT Ort FROM Lieferant;"],
      ["Relationale Algebra", "Die Projektion wählt Spalten (SELECT-Liste), die Selektion wählt Zeilen (WHERE), das kartesische Produkt kombiniert jede Zeile mit jeder. Ein Join ist ein kartesisches Produkt mit Selektion auf gleiche Schlüsselwerte."],
      ["Transaktionen in SQL", "Zusammengehörige Änderungen stehen in einer Transaktion: Entweder werden alle mit COMMIT festgeschrieben oder mit ROLLBACK verworfen.", "START TRANSACTION;\nUPDATE Konto SET Saldo = Saldo - 100 WHERE KtoNr = 1;\nUPDATE Konto SET Saldo = Saldo + 100 WHERE KtoNr = 2;\nCOMMIT;"]
    ],
    fallen: ["Bei UNION unterschiedliche Spaltenanzahl.", "NOT IN mit einer Unterabfrage, die NULL liefert: Ergebnis bleibt leer.", "Self Join ohne Aliasnamen.", "CROSS JOIN statt INNER JOIN: riesige Ergebnismenge.", "COMMIT vergessen oder nach einem Fehler nicht zurückgerollt."],
    ziele: ["Ich ordne Befehle den Sprachbereichen zu.", "Ich nutze EXISTS und NOT EXISTS sicher.", "Ich setze UNION, INTERSECT und EXCEPT richtig ein.", "Ich schreibe eine Transaktion mit COMMIT und ROLLBACK."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G03", titel: "Schlüssel, Kardinalitäten und Modellierungsphasen", teil: "Teil 1 + 2", prio: "Wichtig", h: 1, relevanz: "Grundlagen für jede Datenmodellierungsaufgabe: richtige Schlüssel, richtige Kardinalitäten und passende Datentypen.",
    kern: [
      ["Schlüsselarten", "Ein Superschlüssel identifiziert Datensätze eindeutig, ein Kandidatenschlüssel ist ein minimaler Superschlüssel. Einer davon wird Primärschlüssel, die übrigen heißen Alternativschlüssel. Ein Surrogatschlüssel ist eine künstliche ID ohne fachliche Bedeutung, ein zusammengesetzter Schlüssel besteht aus mehreren Attributen. Fremdschlüssel verweisen auf den Primärschlüssel einer anderen Tabelle."],
      ["Kardinalitäten lesen", "1:1 (Person – Personalausweis), 1:n (Kunde – Bestellung), m:n (Student – Kurs). In der Min-Max-Notation steht, wie oft eine Entität mindestens und höchstens an der Beziehung beteiligt ist, z. B. (0,n) oder (1,1)."],
      ["Krähenfuß-Notation", "Die Viele-Seite wird als dreizackiger Fuß gezeichnet, die Eins-Seite als Strich. Ein Kreis bedeutet optional (0), ein Strich Pflicht (1). Kunde ||——o< Bestellung heißt: Eine Bestellung gehört zu genau einem Kunden, ein Kunde hat keine bis viele Bestellungen."],
      ["Vom Sachverhalt zur Tabelle", "Anforderungsanalyse → konzeptionelles Modell (ER-Modell, unabhängig vom DBMS) → logisches Modell (Relationenmodell mit Tabellen und Schlüsseln) → physisches Modell (Datentypen, Indizes, Speicherung im konkreten DBMS)."],
      ["Drei-Ebenen-Architektur (ANSI/SPARC)", "Externe Ebene (Sichten der Anwender), konzeptionelle Ebene (Gesamtschema), interne Ebene (physische Speicherung). Ziel ist Datenunabhängigkeit: Änderungen an der Speicherung erfordern keine Änderung der Anwendungen."],
      ["Datentypen sinnvoll wählen", "INTEGER für Mengen, DECIMAL für Geldbeträge (keine Rundungsfehler wie bei FLOAT), CHAR oder VARCHAR für Texte, DATE oder TIMESTAMP für Zeitpunkte, BOOLEAN für Ja/Nein, BLOB für Binärdaten wie Bilder. Postleitzahlen und Telefonnummern sind Text, weil führende Nullen zählen."]
    ],
    fallen: ["Geldbeträge als FLOAT modelliert.", "Kardinalität an der falschen Seite der Linie notiert.", "Konzeptionelles und logisches Modell verwechselt.", "Surrogatschlüssel eingeführt, aber die fachliche Eindeutigkeit vergessen (z. B. doppelte E-Mail-Adresse)."],
    ziele: ["Ich unterscheide Primär-, Fremd-, Kandidaten- und Surrogatschlüssel.", "Ich lese Kardinalitäten in Min-Max- und Krähenfuß-Notation.", "Ich nenne die Phasen vom ER-Modell zur Tabelle.", "Ich wähle passende Datentypen."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G04", titel: "Datenbanksysteme, Transaktionen und NoSQL", teil: "Teil 1 + 2", prio: "Wichtig", h: 2, relevanz: "ACID, NoSQL und verteilte Datenhaltung kommen als Erläuterungs- und Entscheidungsfragen vor, oft im Zusammenhang mit der Datenbank aus der Situation.",
    kern: [
      ["ACID", "Atomarität: alles oder nichts. Konsistenz: Die Datenbank geht von einem gültigen in einen gültigen Zustand über. Isolation: Parallele Transaktionen beeinflussen sich nicht. Dauerhaftigkeit: Nach dem COMMIT bleiben Änderungen auch nach einem Absturz erhalten."],
      ["Probleme bei paralleler Verarbeitung", "Lost Update (eine Änderung überschreibt die andere), Dirty Read (Lesen nicht bestätigter Daten), Non-Repeatable Read und Phantome. Gegenmittel sind Sperren und Isolationsstufen; zu viele Sperren können zu Deadlocks führen."],
      ["Stored Procedure, Trigger, View", "Eine Stored Procedure ist gespeicherte SQL-Logik, die mit Parametern aufgerufen wird (weniger Netzlast, zentrale Logik, Schutz vor Injection). Ein Trigger startet automatisch bei INSERT, UPDATE oder DELETE, z. B. zur Protokollierung. Eine View ist eine gespeicherte Abfrage, die wie eine Tabelle genutzt wird und Spalten verbergen kann.", "CREATE VIEW KundenOhneMail AS\nSELECT KID, Name, Ort FROM Kunde;"],
      ["Replikation und Backup", "Replikation hält Kopien der Daten auf mehreren Servern synchron (Ausfallsicherheit, Lastverteilung). Sie ersetzt kein Backup, denn ein versehentliches DELETE wird mitrepliziert."],
      ["NoSQL-Typen", "Key-Value (z. B. Redis: Cache, Sitzungen), dokumentenorientiert (z. B. MongoDB: JSON-Dokumente mit wechselnder Struktur), spaltenorientiert bzw. Wide Column (z. B. Cassandra: riesige Datenmengen, Zeitreihen), Graph (z. B. Neo4j: Beziehungen, soziale Netze, Empfehlungen)."],
      ["CAP und BASE", "Ein verteiltes System kann bei einer Netzwerkpartition nicht gleichzeitig Konsistenz und Verfügbarkeit garantieren; es muss zwischen C und A wählen, Partitionstoleranz ist Pflicht. BASE (Basically Available, Soft State, Eventual Consistency) setzt auf Verfügbarkeit und nimmt in Kauf, dass Daten erst nach kurzer Zeit überall gleich sind."],
      ["Big Data, Data Warehouse, Data Lake", "Big Data: Volume, Velocity, Variety, oft ergänzt um Veracity und Value. Ein Data Warehouse speichert aufbereitete, strukturierte Daten für Auswertungen und wird per ETL (Extract, Transform, Load) befüllt. Ein Data Lake speichert Rohdaten jeder Art und strukturiert erst beim Lesen."]
    ],
    fallen: ["ACID-Buchstaben nur genannt, nicht am Beispiel erklärt.", "Replikation als Backup bezeichnet.", "NoSQL pauschal als „schneller“ begründet statt mit Datenstruktur und Skalierung.", "CAP so erklärt, als könne man Partitionstoleranz weglassen."],
    ziele: ["Ich erkläre ACID an einer Überweisung.", "Ich unterscheide Trigger, Stored Procedure und View.", "Ich ordne die vier NoSQL-Typen Anwendungsfällen zu.", "Ich erkläre CAP und BASE in zwei Sätzen."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G05", titel: "Struktur- und Verteilungsdiagramme", teil: "Teil 1 + 2", prio: "Wichtig", h: 1, relevanz: "Neben den Verhaltensdiagrammen werden Klassen-, Komponenten- und Verteilungsdiagramme gelesen oder ergänzt.",
    kern: [
      ["Komponentendiagramm", "Zeigt die großen Bausteine eines Systems (z. B. Web-Frontend, Bestellservice, Datenbank) und ihre Schnittstellen. Bereitgestellte Schnittstellen werden als Kreis (Lollipop), benötigte als Halbkreis (Socket) gezeichnet."],
      ["Verteilungsdiagramm", "Zeigt, auf welcher Hardware oder Laufzeitumgebung (Knoten, als Quader gezeichnet) welche Software-Artefakte laufen und wie die Knoten verbunden sind, z. B. Browser – Webserver – Datenbankserver mit dem Protokoll an der Verbindung."],
      ["Klassendiagramm im Detail", "Statische Attribute und Methoden werden unterstrichen, abstrakte Klassen und Methoden kursiv oder mit {abstract} markiert. Interfaces tragen «interface». Die Realisierung wird gestrichelt mit hohlem Dreieck gezeichnet, die Vererbung durchgezogen mit hohlem Dreieck.", "Kunde\n- kundennr : int\n- name : String\n+ anzahlKunden : int      (unterstrichen = static)\n+ getName() : String"],
      ["Welches Diagramm wofür?", "Struktur: Klassen-, Komponenten-, Verteilungs- und Objektdiagramm. Verhalten: Anwendungsfall-, Aktivitäts- und Zustandsdiagramm. Interaktion: Sequenzdiagramm. Meist nennt die Aufgabe das Diagramm ausdrücklich; lies Operator und Situation genau."]
    ],
    fallen: ["Realisierung eines Interfaces mit durchgezogener Linie gezeichnet.", "Im Verteilungsdiagramm Klassen statt Knoten und Artefakte gezeichnet.", "Statische Elemente nicht kenntlich gemacht."],
    ziele: ["Ich zeichne ein einfaches Verteilungsdiagramm.", "Ich erkenne bereitgestellte und benötigte Schnittstellen.", "Ich ordne jedem Diagrammtyp seinen Zweck zu."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G06", titel: "Testprozess und Qualitätsmanagement", teil: "Teil 1 + 2", prio: "Wichtig", h: 1, relevanz: "Teststufen, Testkonzept und Qualitätssicherung werden in Planen regelmäßig als Erläuterungsfragen gestellt.",
    kern: [
      ["Teststufen", "Modultest (einzelne Einheit, Entwickler), Integrationstest (Zusammenspiel von Komponenten und Schnittstellen), Systemtest (Gesamtsystem gegen die Anforderungen, Testumgebung), Abnahmetest (durch den Auftraggeber gegen den Vertrag, Grundlage für das Abnahmeprotokoll)."],
      ["Testkonzept", "Legt fest: Testobjekte und Umfang, Teststufen und Methoden, Testdaten, Testumgebung, Verantwortliche, Zeitplan, Eingangs- und Endekriterien (z. B. keine offenen kritischen Fehler) und die Dokumentation der Ergebnisse."],
      ["Weitere Testarten", "Smoke-Test (schneller Grundcheck nach einem Build), Regressionstest (bestehende Funktionen nach Änderungen erneut prüfen), Lasttest, Usability-Test, explorativer Test (erfahrungsbasiert ohne festes Drehbuch), Grey-Box-Test (Teilkenntnis des Codes)."],
      ["Statische Prüfungen", "Reviews, Walkthroughs und Inspektionen prüfen Code oder Dokumente ohne Ausführung. Statische Codeanalyse findet automatisch Regelverstöße, ungenutzte Variablen oder potenzielle Fehler. Pair Programming ist ein laufendes Review (Driver und Navigator)."],
      ["Kontinuierlicher Verbesserungsprozess", "KVP verbessert Produkte und Prozesse in kleinen Schritten nach dem PDCA-Zyklus von Deming: Plan (Ziel und Maßnahme planen), Do (im Kleinen umsetzen), Check (Wirkung messen), Act (bei Erfolg als Standard übernehmen, sonst anpassen). In Scrum entspricht die Retrospektive diesem Gedanken."]
    ],
    fallen: ["Systemtest und Abnahmetest verwechselt (wer testet, wogegen?).", "Regressionstest mit Integrationstest verwechselt.", "PDCA-Phasen in falscher Reihenfolge."],
    ziele: ["Ich ordne Teststufen Zweck und Verantwortlichen zu.", "Ich nenne Inhalte eines Testkonzepts.", "Ich erkläre den PDCA-Zyklus an einem Beispiel."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G07", titel: "Vorgehensmodelle im Vergleich", teil: "Teil 1", prio: "Wichtig", h: 1, relevanz: "Die Wahl eines Vorgehensmodells musst du in Planen oft für die Situation begründen.",
    kern: [
      ["Wasserfall", "Phasen nacheinander: Analyse, Entwurf, Implementierung, Test, Einführung, Wartung. Gut planbar und dokumentiert, aber späte Änderungen sind teuer. Geeignet bei stabilen, klaren Anforderungen."],
      ["V-Modell", "Jeder Entwicklungsphase steht eine Teststufe gegenüber: Anforderungsdefinition ↔ Abnahmetest, Systementwurf ↔ Systemtest, Architektur- bzw. Komponentenentwurf ↔ Integrationstest, Modulentwurf ↔ Modultest. Das V-Modell XT ist der Standard für IT-Projekte des Bundes."],
      ["Spiralmodell", "Iteratives Modell mit Fokus auf Risiken: Jede Windung durchläuft Ziele festlegen, Risiken analysieren (oft mit Prototyp), entwickeln und testen, nächste Runde planen."],
      ["Scrum, XP und Kanban", "Scrum arbeitet in Sprints mit festen Rollen (Product Owner, Scrum Master, Developers), Events und Artefakten. Extreme Programming setzt auf Technikpraktiken wie Pair Programming, TDD, kontinuierliche Integration und kurze Releases. Kanban visualisiert den Arbeitsfluss auf einem Board und begrenzt die Arbeit in Bearbeitung (WIP-Limit), ohne feste Iterationen."],
      ["Make or Buy", "Eigenentwicklung passt genau und bleibt unter eigener Kontrolle, kostet aber Zeit und Know-how. Fremdbezug (Standardsoftware oder Auftrag an einen Dienstleister) ist schneller verfügbar und oft günstiger, schafft aber Abhängigkeiten und passt nicht immer zu den Prozessen. Entscheidungshilfe: Nutzwertanalyse oder Kostenvergleich."]
    ],
    fallen: ["Vorgehensmodell gewählt, ohne es mit der Situation zu begründen.", "Kanban mit festen Sprints beschrieben.", "Im V-Modell Entwurfs- und Teststufen falsch gegenübergestellt."],
    ziele: ["Ich wähle ein Vorgehensmodell passend zur Situation und begründe es.", "Ich ordne im V-Modell Entwurfs- und Teststufen zu.", "Ich unterscheide Scrum, XP und Kanban."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G08", titel: "Angriffe, Kryptografie und DSGVO im Detail", teil: "Teil 1", prio: "Wichtig", h: 2, relevanz: "IT-Sicherheit und Datenschutz kommen in fast jeder Planen-Prüfung vor, häufig als Erläuterung von Maßnahmen für die Situation.",
    kern: [
      ["Schadsoftware und Angriffe", "Virus (hängt sich an Dateien, braucht Ausführung), Wurm (verbreitet sich selbst über Netze), Trojaner (getarnt als nützliches Programm), Ransomware (verschlüsselt Daten und erpresst Lösegeld), Spyware. Social Engineering nutzt den Menschen aus, z. B. Phishing, Pretexting oder Tailgating."],
      ["Hash, Salt und Pepper", "Ein Hash ist eine Einwegfunktion mit fester Ausgabelänge. Passwörter speichert man mit einem langsamen Verfahren wie bcrypt, scrypt oder Argon2 und einem zufälligen Salt pro Benutzer, damit gleiche Passwörter unterschiedliche Hashes ergeben und Rainbow Tables nutzlos werden. MD5 und SHA-1 gelten als unsicher."],
      ["Signatur und Zertifikat", "Signieren: Hash des Dokuments mit dem privaten Schlüssel des Absenders verschlüsseln. Prüfen: mit dem öffentlichen Schlüssel entschlüsseln und mit dem selbst berechneten Hash vergleichen. Ein Zertifikat bindet einen öffentlichen Schlüssel an eine Identität und ist von einer Zertifizierungsstelle (CA) signiert."],
      ["Erweiterte Schutzziele", "Neben Vertraulichkeit, Integrität und Verfügbarkeit: Authentizität (Echtheit der Quelle) und Nichtabstreitbarkeit (der Absender kann nicht leugnen, z. B. durch eine Signatur)."],
      ["Grundsätze der DSGVO (Art. 5)", "Rechtmäßigkeit und Transparenz, Zweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung, Integrität und Vertraulichkeit sowie Rechenschaftspflicht."],
      ["Pflichten des Unternehmens", "Verzeichnis von Verarbeitungstätigkeiten, technische und organisatorische Maßnahmen, Auftragsverarbeitungsvertrag mit Dienstleistern, Meldung von Datenpannen an die Aufsichtsbehörde möglichst binnen 72 Stunden, Datenschutz durch Technikgestaltung und datenschutzfreundliche Voreinstellungen (Privacy by Design und by Default)."],
      ["Sicherheitsmanagement", "BSI IT-Grundschutz und ISO/IEC 27001 beschreiben, wie ein Informationssicherheits-Managementsystem (ISMS) aufgebaut wird. Dazu gehören Risikoanalyse, Sicherheitsrichtlinien, Awareness-Schulungen und ein Notfallmanagement."],
      ["Backup oder Archivierung", "Ein Backup ist eine Kopie zur Wiederherstellung nach Datenverlust (3-2-1-Regel: drei Kopien, zwei Medien, eine außer Haus). Eine Archivierung bewahrt Daten unveränderbar und langfristig auf, oft wegen gesetzlicher Aufbewahrungsfristen (z. B. HGB, AO)."]
    ],
    fallen: ["Hashen und Verschlüsseln gleichgesetzt.", "Signatur mit dem öffentlichen Schlüssel erstellt.", "Bei den DSGVO-Rechten nur „Löschung“ genannt.", "Replikation oder RAID als Backup bezeichnet."],
    ziele: ["Ich erkläre Salt und Hash beim Speichern von Passwörtern.", "Ich beschreibe den Ablauf einer digitalen Signatur.", "Ich nenne Grundsätze, Rechte und Pflichten der DSGVO.", "Ich unterscheide Backup und Archivierung."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G09", titel: "Weitere Entwurfsmuster und OOP-Details", teil: "Teil 1 + 2", prio: "Wichtig", h: 1.5, relevanz: "Entwurfsmuster werden meist so geprüft: Situation lesen, passendes Muster wählen und begründen, manchmal als Klassendiagramm skizzieren.",
    kern: [
      ["Adapter", "Strukturmuster: macht eine vorhandene Klasse mit inkompatibler Schnittstelle nutzbar, indem ein Adapter die erwartete Schnittstelle anbietet und Aufrufe übersetzt. Beispiel: Altsystem an ein neues Bezahl-Interface anbinden."],
      ["Strategy", "Verhaltensmuster: kapselt austauschbare Algorithmen hinter einem gemeinsamen Interface. Beispiel: Versandkosten nach Standard, Express oder Abholung berechnen; die Strategie wird zur Laufzeit gesetzt.", "interface Versandstrategie {\n  double kosten(Bestellung b);\n}\nclass Express implements Versandstrategie { ... }\nbestellung.setStrategie(new Express());"],
      ["Decorator", "Strukturmuster: erweitert ein Objekt zur Laufzeit um Funktionen, indem es in ein Objekt mit gleicher Schnittstelle eingepackt wird. Beispiel: Datenstrom mit Puffer und Verschlüsselung umhüllen."],
      ["Iterator und Template Method", "Iterator: einheitlicher Durchlauf durch eine Sammlung, ohne deren innere Struktur zu kennen (hasNext, next). Template Method: Eine Oberklasse legt den Ablauf eines Algorithmus fest, Unterklassen überschreiben einzelne Schritte."],
      ["Registry und Singleton", "Eine Registry ist eine zentrale Stelle, bei der Objekte unter einem Namen registriert und abgefragt werden. Wie beim Singleton entsteht globaler Zustand; das erschwert Tests und erzeugt versteckte Abhängigkeiten."],
      ["Statische Elemente und Konstruktoren", "Statische Attribute gehören zur Klasse und existieren einmal für alle Objekte (z. B. ein Zähler); statische Methoden werden ohne Objekt aufgerufen. Ein Konstruktor initialisiert ein neues Objekt; überladene Konstruktoren unterscheiden sich in der Parameterliste.", "class Kunde {\n  private static int anzahl = 0;\n  private String name;\n  public Kunde(String name) {\n    this.name = name;\n    anzahl++;\n  }\n}"],
      ["Generics", "Generische Klassen arbeiten mit Typparametern, z. B. List<Kunde>. Der Compiler prüft die Typen, Casts entfallen und der Code ist wiederverwendbar."]
    ],
    fallen: ["Adapter und Decorator verwechselt (übersetzen oder erweitern).", "Strategy ohne gemeinsames Interface beschrieben.", "Statische Methode greift auf Instanzattribute zu."],
    ziele: ["Ich ordne Adapter, Strategy, Decorator, Iterator und Template Method einer Situation zu.", "Ich erkläre statische und Instanzelemente.", "Ich begründe den Einsatz von Generics."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G10", titel: "Web-Technologien, XML und Web-Sicherheit", teil: "Teil 1", prio: "Wichtig", h: 2, relevanz: "Schnittstellen, Datenformate und Web-Sicherheit stehen im Prüfungskatalog und tauchen als Kurz- und Erläuterungsfragen auf.",
    kern: [
      ["HTTP-Methoden genauer", "GET liest und ist sicher und idempotent. POST legt an und ist nicht idempotent. PUT ersetzt eine Ressource vollständig (idempotent), PATCH ändert teilweise, DELETE löscht (idempotent). HEAD liefert nur Header, OPTIONS fragt erlaubte Methoden ab (z. B. CORS-Preflight)."],
      ["Statuscodes nach Klassen", "1xx Information, 2xx Erfolg (200 OK, 201 Created, 204 No Content), 3xx Umleitung (301 Moved Permanently, 304 Not Modified), 4xx Clientfehler (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found), 5xx Serverfehler (500 Internal Server Error, 503 Service Unavailable, 504 Gateway Timeout)."],
      ["SOAP, WSDL und SOA", "SOAP ist ein XML-basiertes Protokoll mit Envelope, Header und Body; die Schnittstelle wird in WSDL beschrieben. SOA (serviceorientierte Architektur) baut Systeme aus lose gekoppelten Diensten, oft über einen Enterprise Service Bus. REST ist leichter, nutzt HTTP direkt und meist JSON."],
      ["XML-Werkzeuge", "Wohlgeformt: Syntaxregeln eingehalten (ein Wurzelelement, korrekt geschachtelt, Tags geschlossen). Gültig: zusätzlich passend zu einer DTD oder einem XML Schema (XSD, mit Datentypen). XSLT transformiert XML in andere Formate, XPath adressiert Knoten. DOM lädt das ganze Dokument als Baum, SAX liest ereignisbasiert und speicherschonend."],
      ["AJAX, SPA und PWA", "AJAX lädt Daten asynchron nach, ohne die Seite neu zu laden (heute meist fetch mit JSON). Eine Single Page Application lädt einmal und baut Inhalte per JavaScript um. Eine Progressive Web App ist installierbar, offlinefähig (Service Worker) und kann Push-Benachrichtigungen senden."],
      ["Native, Cross-Platform, hybrid oder Web-App", "Native Apps nutzen Plattform-SDKs (Kotlin, Swift): beste Performance und voller Gerätezugriff, aber pro Plattform entwickelt. Cross-Platform-Frameworks (z. B. Flutter, React Native, .NET MAUI) teilen den Code. Hybride Apps zeigen Webinhalte in einem nativen Container. Web-Apps laufen im Browser ohne Installation."],
      ["Angriffe auf Webanwendungen", "XSS: Angreifer schleust ein Skript ein, das im Browser anderer Nutzer läuft (Schutz: Ausgabe kodieren, Content Security Policy). CSRF: Eine fremde Seite löst Aktionen mit der Sitzung des Opfers aus (Schutz: CSRF-Token, SameSite-Cookies). Session Hijacking: Übernahme der Sitzungs-ID (Schutz: HTTPS, HttpOnly- und Secure-Cookies, neue ID nach dem Login)."],
      ["Web 2.0 und 3.0", "Web 2.0 steht für nutzergenerierte Inhalte und Interaktion (soziale Netzwerke, Wikis, Blogs). Web 3.0 meint das semantische Web mit maschinenlesbaren Bedeutungen (RDF, OWL) und wird auch für dezentrale, blockchainbasierte Ansätze verwendet."]
    ],
    fallen: ["401 und 403 verwechselt.", "Wohlgeformt und gültig gleichgesetzt.", "XSS und SQL-Injection verwechselt.", "Bei der App-Wahl nicht mit der Situation begründet (Gerätezugriff, Budget, Plattformen)."],
    ziele: ["Ich nenne Methoden und Statuscodes passend zur Situation.", "Ich unterscheide REST und SOAP.", "Ich erkläre XSS, CSRF und Session Hijacking samt Schutz.", "Ich wähle native App, Cross-Platform oder PWA begründet."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G11", titel: "Programmiersprachen und Paradigmen", teil: "Teil 1 + 2", prio: "Wichtig", h: 2, relevanz: "Sprachen, Paradigmen, Übersetzung und Fehlerbehandlung werden in Planen als Kurzfragen geprüft und helfen beim Pseudocode in Algorithmen.",
    kern: [
      ["Paradigmen", "Imperativ bzw. prozedural: Anweisungen nacheinander, Prozeduren (C, Pascal). Objektorientiert: Objekte mit Zustand und Verhalten (Java, C#). Funktional: Funktionen ohne Seiteneffekte, unveränderliche Daten (Haskell, F#, Teile von Java und JavaScript). Logisch bzw. deklarativ: Fakten und Regeln beschreiben, was gilt (Prolog); auch SQL ist deklarativ."],
      ["Typisierung", "Statisch: Typen werden beim Kompilieren geprüft (Java, C#). Dynamisch: zur Laufzeit (Python, JavaScript). Stark: wenig automatische Umwandlung (Python: \"3\" + 3 ist ein Fehler). Schwach: viel implizite Umwandlung (JavaScript: \"3\" + 3 ergibt \"33\")."],
      ["Compiler, Interpreter, JIT", "Ein Compiler übersetzt den ganzen Quellcode vorab in Maschinencode (schnell, plattformabhängig). Ein Interpreter führt den Code zur Laufzeit Anweisung für Anweisung aus (flexibel, langsamer). Java und C# kompilieren in Bytecode bzw. IL, der in einer virtuellen Maschine läuft und per Just-in-Time-Compiler zur Laufzeit in Maschinencode übersetzt wird."],
      ["Sprachgenerationen und DSL", "1GL Maschinencode, 2GL Assembler, 3GL höhere Sprachen (C, Java), 4GL deklarative, problemorientierte Sprachen (SQL). Domänenspezifische Sprachen (DSL) sind auf ein Fachgebiet zugeschnitten, z. B. SQL, HTML, CSS, reguläre Ausdrücke; General Purpose Languages sind universell."],
      ["Funktionale Konzepte", "Pure Funktionen liefern bei gleicher Eingabe immer dasselbe Ergebnis ohne Seiteneffekte. Higher-Order Functions nehmen Funktionen als Parameter oder geben sie zurück. Lambdas sind anonyme Funktionen. Map wandelt jedes Element um, Filter wählt aus, Reduce fasst zusammen.", "List<Double> brutto = netto.stream()\n  .filter(p -> p > 0)\n  .map(p -> p * 1.19)\n  .collect(Collectors.toList());"],
      ["Synchron, asynchron, parallel", "Synchron: Der Aufrufer wartet auf das Ergebnis (blockiert). Asynchron: Die Anfrage läuft im Hintergrund, das Ergebnis kommt per Callback, Promise oder async/await; die Oberfläche bleibt bedienbar. Parallel: Aufgaben laufen wirklich gleichzeitig auf mehreren Kernen; Gefahr von Race Conditions und Deadlocks, daher Synchronisation."],
      ["Fehlerbehandlung", "Syntaxfehler findet der Compiler, Laufzeitfehler (Exceptions) treten beim Ausführen auf, logische Fehler liefern falsche Ergebnisse ohne Absturz. Exceptions fängt man mit try-catch-finally. Programme melden über Exit-Codes ihren Erfolg (0 = erfolgreich, sonst Fehler). Der Debugger hält an Breakpoints an und zeigt Variablenwerte.", "try {\n  int menge = Integer.parseInt(eingabe);\n} catch (NumberFormatException e) {\n  zeigeFehler(\"Bitte eine ganze Zahl eingeben.\");\n} finally {\n  log.schliessen();\n}"],
      ["IDE, Bibliothek, Framework, Low-Code", "Eine IDE bündelt Editor, Compiler, Debugger und Versionsverwaltung. Eine Bibliothek wird von deinem Code aufgerufen; ein Framework gibt die Struktur vor und ruft deinen Code auf (Inversion of Control, Hollywood-Prinzip). Low-Code- und No-Code-Plattformen erstellen Anwendungen grafisch, schnell, aber mit Vendor-Lock-in und Grenzen bei Spezialfällen. Wiederkehrende Abläufe automatisiert man mit Skripten und Zeitplänen (cron, Aufgabenplanung)."]
    ],
    fallen: ["Statisch/dynamisch mit stark/schwach typisiert verwechselt.", "Java als rein interpretierte Sprache bezeichnet.", "Bibliothek und Framework ohne Inversion of Control unterschieden.", "Exit-Code 0 als Fehler gedeutet."],
    ziele: ["Ich ordne Sprachen Paradigmen und Typisierung zu.", "Ich erkläre Compiler, Interpreter und JIT.", "Ich unterscheide synchron, asynchron und parallel.", "Ich schreibe try-catch und nenne die Fehlerarten."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G12", titel: "Softwarearchitektur, Cloud und Versionsverwaltung", teil: "Teil 1", prio: "Wichtig", h: 2, relevanz: "Architekturentscheidungen, Cloud-Modelle und Git kommen in Planen als Begründungs- und Vergleichsfragen vor.",
    kern: [
      ["Architekturstile", "Monolith: eine Anwendung, ein Deployment; einfach am Anfang, schwer zu skalieren. Schichtenarchitektur: Präsentation, Logik und Datenhaltung mit klaren Zuständigkeiten. Microservices: kleine, unabhängig deploybare Dienste mit eigener Datenhaltung, die über APIs kommunizieren; flexibel und skalierbar, aber aufwendiger im Betrieb."],
      ["Weitere Muster", "MVC trennt Model, View und Controller; MVVM bindet die View per Datenbindung an ein ViewModel. Pipes and Filters verarbeitet Daten in Stufen (z. B. ETL). SOA verbindet Dienste über standardisierte Schnittstellen, oft mit einem Enterprise Service Bus."],
      ["Entwurfsrichtung und Modularisierung", "Top-down zerlegt das Gesamtsystem schrittweise in Teile, Bottom-up setzt fertige Bausteine zusammen; in der Praxis kombiniert man beides. Module sollen hohe Kohäsion (eine klare Aufgabe) und lose Kopplung (wenige Abhängigkeiten) haben."],
      ["Cloud-Servicemodelle", "IaaS: virtuelle Server, Netz und Speicher; Betriebssystem und Software verwaltet der Kunde. PaaS: Laufzeitumgebung und Datenbank als Dienst; der Kunde bringt nur die Anwendung. SaaS: fertige Software im Browser (z. B. Office 365, CRM). FaaS bzw. Serverless: einzelne Funktionen laufen ereignisgesteuert und werden pro Aufruf abgerechnet. On-Premises: alles im eigenen Rechenzentrum."],
      ["Container", "Docker verpackt eine Anwendung mit allen Abhängigkeiten in ein Image; Container teilen sich den Kernel des Hosts und starten schneller als virtuelle Maschinen. Kubernetes orchestriert viele Container: Verteilung, Skalierung und Neustart bei Ausfall."],
      ["Versionsverwaltung", "Zentral (z. B. Subversion): ein Server mit dem Repository, ohne Verbindung kaum Arbeit möglich. Verteilt (z. B. Git): Jeder hat das komplette Repository mit Historie. Begriffe: Commit, Branch, Merge, Konflikt, Tag (Release), Pull und Push, Pull Request für Code-Reviews.", "git switch -c feature/rabatt\ngit add .\ngit commit -m \"Rabattberechnung ergänzt\"\ngit push origin feature/rabatt"],
      ["Branching-Strategien", "Feature-Branch: jede Funktion in einem eigenen Branch, Merge per Pull Request. Git-Flow: feste Branches main, develop, feature, release und hotfix. Trunk-based Development: Alle integrieren sehr häufig in den Hauptzweig, unfertige Funktionen stehen hinter Feature-Toggles."],
      ["CI/CD", "Continuous Integration: Jeder Commit wird automatisch gebaut und getestet. Continuous Delivery: Jede getestete Version ist auslieferbar, die Freigabe erfolgt per Knopfdruck. Continuous Deployment: Die Auslieferung bis in die Produktion erfolgt automatisch."]
    ],
    fallen: ["IaaS, PaaS und SaaS über die Verantwortung falsch abgegrenzt.", "Container und virtuelle Maschine gleichgesetzt.", "Merge-Konflikt als Systemfehler statt als parallele Änderung erklärt.", "Continuous Delivery und Continuous Deployment verwechselt."],
    ziele: ["Ich vergleiche Monolith und Microservices mit Vor- und Nachteilen.", "Ich ordne IaaS, PaaS, SaaS und FaaS Beispielen zu.", "Ich erkläre Branch, Merge und Pull Request.", "Ich unterscheide CI, Continuous Delivery und Continuous Deployment."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G13", titel: "Software-Ergonomie, Recht und Softwarearten", teil: "Teil 1", prio: "Wichtig", h: 1.5, relevanz: "Dialoggrundsätze, Lizenzen und Softwarearten sind typische 2- bis 6-Punkte-Fragen in Planen, immer mit Bezug zur Situation.",
    kern: [
      ["Usability und User Experience", "Usability beschreibt, wie effektiv, effizient und zufriedenstellend Nutzer ihre Ziele erreichen (DIN EN ISO 9241-11). User Experience umfasst das gesamte Erleben vor, während und nach der Nutzung, auch Emotionen und Erwartungen."],
      ["Grundsätze der Dialoggestaltung (ISO 9241-110)", "Aufgabenangemessenheit, Selbstbeschreibungsfähigkeit, Erwartungskonformität, Lernförderlichkeit, Steuerbarkeit, Fehlertoleranz, Individualisierbarkeit. In der Fassung von 2020 heißen sie teils anders (Erlernbarkeit, Robustheit gegen Benutzungsfehler), und Individualisierbarkeit wurde durch Benutzerbindung ersetzt. In der Prüfung jeden Grundsatz mit einem Beispiel aus der Situation belegen."],
      ["Bedienelemente richtig wählen", "Radiobuttons für genau eine Auswahl aus wenigen Optionen, Checkboxen für mehrere unabhängige Optionen, Dropdown für eine Auswahl aus vielen Einträgen, Textfeld für freie Eingaben (mit Validierung), Buttons für Aktionen mit eindeutiger Beschriftung."],
      ["Lizenzen", "Open Source: Quellcode offen; Nutzung, Änderung und Weitergabe erlaubt. Copyleft (GPL): Weitergegebene Änderungen müssen unter derselben Lizenz stehen. Schwaches Copyleft (LGPL): Die Bibliothek darf auch in proprietärer Software genutzt werden. Freizügig (MIT, Apache): nahezu frei nutzbar, Lizenzhinweis behalten. Proprietär: Nutzung nach Vertrag, z. B. Kauf, Abo, pro Nutzer oder gleichzeitige Nutzung (Concurrent Use)."],
      ["Rechtsaspekte", "Das Urheberrecht schützt Software als Werk; bei Software aus dem Arbeitsverhältnis erhält der Arbeitgeber die Nutzungsrechte (§ 69b UrhG). Namens- und Markenrecht betreffen Produkt- und Domainnamen. Das Persönlichkeitsrecht schützt z. B. das Recht am eigenen Bild. Das Wettbewerbsrecht (UWG) verbietet irreführende Werbung und unlautere Methoden."],
      ["Softwarearten", "Standardsoftware für viele Kunden, Individualsoftware für einen Auftraggeber. ERP (Ressourcen und Geschäftsprozesse), CRM (Kundenbeziehungen), SCM (Lieferkette), CMS (Webinhalte), DMS (Dokumente), CAD (Konstruktion), Branchensoftware für spezielle Branchen."],
      ["Dokumentation", "Technische Dokumentation richtet sich an Entwicklung und Betrieb (Architektur, Schnittstellen, Installation, Code-Kommentare), Benutzerdokumentation an Anwender (Handbuch, Online-Hilfe, Schulungsunterlagen). Entscheidend ist die Zielgruppe."]
    ],
    fallen: ["Dialoggrundsatz nur genannt, ohne Beispiel aus der Situation.", "GPL und LGPL verwechselt.", "Benutzerdokumentation mit Fachbegriffen der Entwickler geschrieben."],
    ziele: ["Ich nenne die Dialoggrundsätze mit Beispiel.", "Ich wähle passende Bedienelemente.", "Ich unterscheide GPL, LGPL, MIT und proprietäre Lizenzen.", "Ich ordne ERP, CRM, CMS und DMS zu."], decks: [], ueb: [], quiz: null, alt: "" }
);
