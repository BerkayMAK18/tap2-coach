  ["Eine Bank bucht 500 € von einem Girokonto auf ein Sparkonto um.\n\nErläutern Sie die vier ACID-Eigenschaften am Beispiel dieser Überweisung. (4 P)", "Atomarität: Abbuchung und Gutschrift werden ganz oder gar nicht ausgeführt.\nKonsistenz: Die Summe beider Konten ist vorher und nachher gleich.\nIsolation: Eine parallele Buchung auf dem Girokonto stört die Überweisung nicht.\nDauerhaftigkeit: Nach dem COMMIT bleibt die Buchung auch nach einem Absturz erhalten.", "Je 1 P pro Eigenschaft mit Bezug zur Überweisung."],
  ["Im Lagerverwaltungssystem eines Großhändlers greifen viele Mitarbeiter gleichzeitig auf Bestände zu. Es kommt zu falschen Beständen und blockierten Buchungen.\n\nBeschreiben Sie die Probleme Lost Update, Dirty Read und Deadlock. (3 P)", "Lost Update: Zwei Transaktionen ändern denselben Wert, die zweite überschreibt die erste.\nDirty Read: Eine Transaktion liest Daten, die eine andere noch nicht bestätigt hat und später zurückrollt.\nDeadlock: Zwei Transaktionen warten gegenseitig auf Sperren der anderen; keine kommt weiter.", "Je 1 P pro Problem. Gegenmaßnahmen: Sperren bzw. Isolationsstufen; bei Deadlocks bricht das DBMS eine Transaktion ab."],
  ["Die Buchhaltung soll eine eingeschränkte Sicht auf Kundendaten erhalten, Preisänderungen sollen automatisch protokolliert werden und die Rabattberechnung soll zentral in der Datenbank liegen.\n\nOrdnen Sie jeder Anforderung Trigger, Stored Procedure oder View zu und erklären Sie das Objekt kurz. (6 P)", "Eingeschränkte Sicht → View: gespeicherte Abfrage, nutzbar wie eine Tabelle\nPreisänderungen protokollieren → Trigger: startet automatisch bei INSERT, UPDATE oder DELETE\nRabattberechnung → Stored Procedure: gespeicherte, parametrisierte SQL-Logik, wird aufgerufen", "Je 1 P pro richtiger Zuordnung, je 1 P pro Erklärung."],
  ["Ein Online-Händler prüft NoSQL-Datenbanken für Warenkorb-Cache, Produktkatalog, Klick-Zeitreihen und Produktempfehlungen.\n\nNennen Sie vier NoSQL-Typen mit je einem Beispielsystem und ordnen Sie die Anwendungsfälle zu. (4 P)", "Key-Value (z. B. Redis) → Warenkorb-Cache, Sitzungen\nDokument (z. B. MongoDB) → Produktkatalog mit wechselnden Merkmalen\nWide Column (z. B. Cassandra) → sehr große Datenmengen, Klick-Zeitreihen\nGraph (z. B. Neo4j) → Beziehungen, Produktempfehlungen", "Je 1 P pro Typ mit passender Zuordnung."],
  ["Ein Lieferdienst betreibt seine Datenbank verteilt in zwei Rechenzentren. Fällt die Verbindung zwischen ihnen aus, muss das System entscheiden, wie es reagiert.\n\nErläutern Sie das CAP-Theorem an diesem Beispiel. (3 P)", "CAP: Consistency (alle Knoten liefern denselben Stand), Availability (jede Anfrage wird beantwortet), Partition Tolerance (System arbeitet trotz Netzausfall weiter).\nBei einer Partition sind nur zwei der drei gleichzeitig möglich. Partitionstoleranz ist Pflicht, also: entweder Anfragen ablehnen (C) oder mit möglicherweise veraltetem Stand antworten (A).", "1 P Begriffe, 2 P Anwendung auf das Beispiel."],
  ["Ein soziales Netzwerk zeigt nach einem neuen Beitrag manchen Nutzern noch für einige Sekunden den alten Stand.\n\nErläutern Sie das BASE-Prinzip und grenzen Sie es von ACID ab. (3 P)", "BASE: Basically Available, Soft State, Eventual Consistency. Das System bleibt verfügbar, Daten dürfen kurzzeitig unterschiedlich sein und gleichen sich nach einiger Zeit an.\nACID verlangt dagegen sofortige Konsistenz nach jeder Transaktion.", "2 P BASE mit Bezug zum Beispiel, 1 P Abgrenzung zu ACID."],
  ["Ein Handelskonzern will Verkaufszahlen auswerten und zusätzlich Rohdaten wie Klickströme und Bilder für spätere Analysen aufheben.\n\nUnterscheiden Sie Data Warehouse und Data Lake. (4 P)", "Data Warehouse: bereinigte, strukturierte Daten für Auswertungen; Struktur wird beim Schreiben festgelegt (Schema on Write), befüllt per ETL.\nData Lake: Rohdaten jeder Art (strukturiert, unstrukturiert); Struktur erst beim Lesen (Schema on Read).", "Je 2 P pro Begriff (Datenart und Zeitpunkt der Strukturierung)."],
  ["Ein Onlineshop repliziert seine Datenbank auf einen zweiten Server und möchte deshalb auf Backups verzichten.\n\nErklären Sie den Zweck der Replikation und begründen Sie, warum sie kein Backup ersetzt. (3 P)", "Replikation hält Kopien der Datenbank auf mehreren Servern aktuell: Ausfallsicherheit und Lastverteilung (z. B. Lesezugriffe auf die Kopie).\nKein Backup-Ersatz: Fehler wie ein versehentliches DELETE oder Verschlüsselung durch Ransomware werden sofort mitrepliziert. Nur ein Backup erlaubt die Rückkehr zu einem früheren Stand.", "1 P Zweck, 2 P Begründung mit Beispiel."]
];
CARDS_RAW.uml.push(
  ["Ein Webshop besteht aus den Komponenten Shop-Frontend, Bestellservice und Zahlungsservice. Der Bestellservice benötigt die Schnittstelle des Zahlungsservice.\n\nBeschreiben Sie das Komponentendiagramm und die Darstellung der Schnittstellen. (3 P)", "Das Komponentendiagramm zeigt größere Softwarebausteine (Rechteck mit «component») und ihre Schnittstellen.\nBereitgestellte Schnittstelle: Kreis (Lollipop) am Zahlungsservice.\nBenötigte Schnittstelle: Halbkreis (Socket) am Bestellservice, der den Kreis umschließt.", "1 P Zweck, je 1 P pro Schnittstellendarstellung."],
  ["Ein Webshop läuft als shop.war auf einem Tomcat-Server. Kunden greifen per Browser über HTTPS zu, der Server spricht per JDBC mit dem Datenbankserver.\n\nBeschreiben Sie, wie dieses Szenario im Verteilungsdiagramm dargestellt wird. (4 P)", "Knoten (Quader) für Client-PC, Webserver und Datenbankserver; Laufzeitumgebungen wie Tomcat als verschachtelte Knoten («executionEnvironment»).\nArtefakt shop.war (Rechteck mit «artifact») auf dem Tomcat-Knoten.\nVerbindungen zwischen den Knoten mit Protokoll beschriftet: Browser —HTTPS— Webserver —JDBC— Datenbankserver.", "Je 1 P für Knoten, Laufzeitumgebung, Artefakt, beschriftete Verbindungen."],
  ["Im Klassendiagramm einer Zahlungsabwicklung gibt es eine abstrakte Klasse Zahlung, ein Interface Erstattbar, das statische Attribut anzahl und die Klasse Kartenzahlung, die Erstattbar implementiert.\n\nBeschreiben Sie die Darstellung dieser vier Elemente. (4 P)", "Abstrakte Klasse: Name kursiv oder {abstract}\nInterface: «interface» über dem Namen\nStatisches Attribut: unterstrichen\nRealisierung Kartenzahlung → Erstattbar: gestrichelte Linie mit hohlem Dreieck am Interface", "Je 1 P pro Element."],
  ["Im Sequenzdiagramm eines Bestellvorgangs ruft der Controller die Methode pruefen() auf und wartet, schickt eine E-Mail ohne zu warten, erhält eine Rückgabe und erzeugt ein neues Rechnungsobjekt.\n\nBeschreiben Sie die vier Nachrichtenarten. (4 P)", "Synchron (pruefen): durchgezogen, gefüllte Spitze\nAsynchron (E-Mail): durchgezogen, offene Spitze\nAntwort: gestrichelt, offene Spitze\nErzeugung (Rechnung): gestrichelt mit «create», endet am Kopf der neuen Lebenslinie", "Je 1 P pro Nachrichtenart."]
);
CARDS_RAW.test.push(
  ["Für eine Lagerverwaltung soll im Testkonzept festgelegt werden, wer welche Teststufe durchführt und wogegen geprüft wird.\n\nOrdnen Sie den vier Teststufen Verantwortliche und Prüfgrundlage zu. (4 P)", "Modultest: Entwickler, gegen die Modulspezifikation\nIntegrationstest: Entwickler bzw. Testteam, gegen Schnittstellen und Architektur\nSystemtest: Testteam des Auftragnehmers, gegen das Pflichtenheft in einer Testumgebung\nAbnahmetest: Auftraggeber, gegen Lastenheft bzw. Vertrag; Ergebnis im Abnahmeprotokoll", "Je 1 P pro Stufe mit Verantwortlichen und Grundlage."],
  ["Ein Support-Team möchte die Bearbeitungszeit von Tickets senken und geht dabei nach dem PDCA-Zyklus vor.\n\nBeschreiben Sie die vier Phasen an diesem Beispiel. (4 P)", "Plan: Ursache analysieren, Ziel und Maßnahme festlegen (z. B. Textbausteine für häufige Anfragen).\nDo: Maßnahme im Kleinen erproben (ein Team, vier Wochen).\nCheck: Wirkung messen (Bearbeitungszeit vorher/nachher).\nAct: Bei Erfolg als Standard für alle einführen, sonst anpassen und neu planen.", "Je 1 P pro Phase mit Bezug zum Beispiel."],
  ["In einer CI-Pipeline dauern alle Tests zusammen 40 Minuten. Häufig scheitern sie, weil der Build gar nicht startet.\n\nErklären Sie den Smoke-Test und seinen Nutzen in dieser Situation. (3 P)", "Smoke-Test: schneller Grundcheck nach jedem Build – startet die Anwendung, funktionieren die Kernfunktionen (z. B. Anmeldung, Startseite)?\nNutzen: Defekte Builds fallen nach wenigen Minuten auf, die langen Tests laufen nur bei lauffähigen Builds.", "2 P Erklärung, 1 P Nutzen."],
  ["Ein Team plant seine Qualitätssicherung und will sowohl ohne als auch mit Ausführung des Codes prüfen.\n\nUnterscheiden Sie statische und dynamische Qualitätssicherung mit je drei Beispielen. (4 P)", "Statisch (ohne Ausführung): Review, Walkthrough, Inspektion, statische Codeanalyse\nDynamisch (mit Ausführung): Unit-, Integrations-, System-, Last- und Abnahmetest", "Je 1 P Definition, je 1 P für die Beispiele."]
);
CARDS_RAW.pm.push(
  ["Ein Projekt soll nach dem V-Modell geplant werden.\n\nOrdnen Sie den vier Entwurfsphasen die zugehörigen Teststufen zu. (4 P)", "Anforderungsdefinition ↔ Abnahmetest\nSystementwurf ↔ Systemtest\nArchitektur- bzw. Komponentenentwurf ↔ Integrationstest\nModulentwurf ↔ Modultest", "Je 1 P pro richtigem Paar."],
  ["Ein Medizintechnikhersteller entwickelt eine neuartige Software mit hohen technischen Risiken.\n\nBeschreiben Sie das Spiralmodell und begründen Sie, warum es hier geeignet ist. (4 P)", "Iterativ und risikogetrieben; jede Runde durchläuft vier Schritte: Ziele festlegen → Risiken analysieren und reduzieren (oft mit Prototyp) → entwickeln und testen → nächste Runde planen.\nBegründung: Hohe Risiken werden früh erkannt und gezielt reduziert, bevor viel Geld investiert ist.", "3 P Beschreibung mit den Schritten, 1 P Begründung."],
  ["Ein IT-Support-Team bearbeitet laufend Tickets ohne feste Sprints.\n\nBeschreiben Sie Kanban und erklären Sie WIP-Limit und Pull-Prinzip. (4 P)", "Kanban visualisiert die Arbeit auf einem Board mit Spalten (z. B. To do, In Arbeit, Test, Fertig); es gibt keine festen Sprints, Ziel ist ein gleichmäßiger Fluss.\nWIP-Limit: begrenzt die Anzahl gleichzeitig bearbeiteter Aufgaben pro Spalte – Engpässe werden sichtbar.\nPull-Prinzip: Neue Aufgaben werden erst gezogen, wenn Kapazität frei ist.", "2 P Beschreibung, je 1 P WIP-Limit und Pull-Prinzip."],
  ["Ein Logistikunternehmen entscheidet, ob es seine Tourenplanung selbst entwickelt oder eine Standardsoftware kauft.\n\nStellen Sie je zwei Vor- und Nachteile von Make und Buy gegenüber und nennen Sie ein Entscheidungsverfahren. (5 P)", "Make (Eigenentwicklung): + passgenau für Sonderprozesse, + volle Kontrolle | − hoher Zeit- und Personalaufwand, − eigenes Know-how und Wartung nötig\nBuy (Fremdbezug): + schnell verfügbar und erprobt, + oft günstiger | − Abhängigkeit vom Anbieter, − Grenzen bei Anpassungen\nEntscheidung z. B. per Nutzwertanalyse.", "Je 0,5 P pro Vor- bzw. Nachteil (4 P), 1 P Verfahren."]
);
CARDS_RAW.sec.push(
  ["Nach einem Sicherheitsvorfall soll die IT-Abteilung erklären, welche Arten von Schadsoftware es gibt.\n\nUnterscheiden Sie Virus, Wurm, Trojaner und Ransomware. (4 P)", "Virus: hängt sich an Dateien und verbreitet sich, wenn diese ausgeführt werden.\nWurm: verbreitet sich selbstständig über Netzwerke.\nTrojaner: tarnt sich als nützliches Programm und öffnet z. B. eine Hintertür.\nRansomware: verschlüsselt Daten und erpresst Lösegeld.", "Je 1 P pro Art."],
  ["Nach einem Datendiebstahl sollen die erbeuteten Passwort-Hashes für Angreifer möglichst wertlos sein.\n\nErklären Sie Salt und Pepper und ihren Nutzen. (4 P)", "Salt: zufälliger Wert pro Benutzer, wird vor dem Hashen angehängt und mit dem Hash in der Datenbank gespeichert.\nPepper: geheimer Wert für alle Benutzer, getrennt von der Datenbank gespeichert (z. B. in der Konfiguration oder einem HSM).\nNutzen: Gleiche Passwörter ergeben verschiedene Hashes, vorberechnete Tabellen (Rainbow Tables) sind nutzlos; ohne Pepper kann der Angreifer selbst Brute Force kaum ansetzen.", "Je 1 P Salt und Pepper, 2 P Nutzen."],
  ["Ein Start-up entwickelt eine App, die Gesundheitsdaten verarbeitet, und will die Grundsätze der DSGVO einhalten.\n\nNennen Sie sechs Grundsätze nach Art. 5 DSGVO. (6 P)", "Rechtmäßigkeit, Verarbeitung nach Treu und Glauben, Transparenz\nZweckbindung\nDatenminimierung\nRichtigkeit\nSpeicherbegrenzung\nIntegrität und Vertraulichkeit\nRechenschaftspflicht", "Je 1 P pro Grundsatz (max. 6)."],
  ["Ein mittelständischer Online-Händler mit 40 Mitarbeitenden fragt, welche Pflichten die DSGVO ihm als Verantwortlichem auferlegt.\n\nNennen Sie fünf Pflichten. (5 P)", "Verzeichnis von Verarbeitungstätigkeiten führen\nTechnisch-organisatorische Maßnahmen (TOM) umsetzen\nAuftragsverarbeitungsverträge mit Dienstleistern schließen\nDatenpannen binnen 72 Stunden melden\nPrivacy by Design und by Default\nDatenschutzbeauftragten benennen (u. a. wenn in der Regel mindestens 20 Personen ständig mit der automatisierten Verarbeitung beschäftigt sind, § 38 BDSG)", "Je 1 P pro Pflicht (max. 5)."],
  ["Ein Handelsunternehmen sichert täglich seine Server und muss Rechnungen zehn Jahre aufbewahren.\n\nUnterscheiden Sie Backup und Archivierung und nennen Sie die 3-2-1-Regel. (4 P)", "Backup: Kopie zur Wiederherstellung nach Datenverlust; wird regelmäßig erstellt und rotiert.\nArchivierung: langfristige, unveränderbare Aufbewahrung wegen gesetzlicher Fristen (z. B. HGB, AO).\n3-2-1-Regel: drei Kopien, auf zwei verschiedenen Medien, eine davon außer Haus bzw. offline.", "Je 1 P Backup und Archivierung, 2 P Regel."],
  ["Für ein Online-Wahlsystem eines Vereins reichen die klassischen Schutzziele nicht aus.\n\nNennen Sie die fünf Schutzziele und erläutern Sie die beiden erweiterten. (5 P)", "Klassisch: Vertraulichkeit, Integrität, Verfügbarkeit\nAuthentizität: Echtheit der Quelle – die Stimme stammt wirklich von einem berechtigten Mitglied.\nNichtabstreitbarkeit (Verbindlichkeit): Eine Handlung kann später nicht geleugnet werden, z. B. durch digitale Signatur.", "1 P klassische Schutzziele, je 2 P pro erweitertem Schutzziel."]
);
CARDS_RAW.oop.push(
  ["Ein neues Kassensystem erwartet das Interface Zahlung mit bezahle(betrag: Double). Eine alte, nicht änderbare Bibliothek bietet nur zahle(betragInCent: Integer).\n\nErläutern Sie, wie das Adapter-Muster das Problem löst. (3 P)", "Kategorie: Strukturmuster.\nEine Klasse ZahlungsAdapter implementiert das Interface Zahlung und hält ein Objekt der alten Bibliothek.\nIn bezahle(betrag) rechnet der Adapter in Cent um und ruft zahle(betrag * 100) auf. Das Kassensystem bleibt unverändert.", "1 P Kategorie, 1 P Aufbau, 1 P Übersetzung des Aufrufs."],
  ["Ein Webshop berechnet Versandkosten je nach Versandart (Standard, Express). Neue Versandarten sollen ohne Änderung der Klasse Bestellung möglich sein.\n\nErläutern Sie das Strategy-Muster an diesem Beispiel. (3 P)", "Kategorie: Verhaltensmuster.\nInterface Versandstrategie mit berechneKosten(gewicht); Standardversand und Expressversand implementieren es.\nBestellung hält eine Versandstrategie und ruft nur berechneKosten() auf; die Strategie ist zur Laufzeit austauschbar.", "1 P Kategorie, 1 P Interface mit Implementierungen, 1 P Austauschbarkeit zur Laufzeit."],
  ["Ein Datenstrom soll wahlweise gepuffert, verschlüsselt oder beides werden, ohne für jede Kombination eine eigene Unterklasse zu schreiben.\n\nErläutern Sie das Decorator-Muster an diesem Beispiel. (3 P)", "Kategorie: Strukturmuster.\nEin Decorator hat dieselbe Schnittstelle wie der Datenstrom und umhüllt ihn; er ergänzt Verhalten und leitet dann weiter.\nBeispiel: new Verschluesselung(new Puffer(new Dateistrom())). Decorators lassen sich beliebig kombinieren.", "1 P Kategorie, 1 P gleiche Schnittstelle + Umhüllen, 1 P Beispiel bzw. Kombinierbarkeit."],
  ["Alle Berichte laufen gleich ab: Daten laden, auswerten, ausgeben. Nur das Auswerten unterscheidet sich zwischen Umsatz- und Lagerbericht.\n\nErläutern Sie das Template-Method-Muster und grenzen Sie es von Strategy ab. (4 P)", "Template Method (Verhaltensmuster): Die abstrakte Oberklasse Bericht legt den Ablauf in erstelle() fest und ruft laden(), auswerten(), ausgeben() auf. Unterklassen überschreiben nur auswerten().\nAbgrenzung: Template Method nutzt Vererbung und tauscht einzelne Schritte; Strategy nutzt Komposition und tauscht den ganzen Algorithmus über ein Interface.", "2 P Prinzip mit Beispiel, 2 P Abgrenzung."],
  ["Die Klasse Mitarbeiter hat das Attribut name und das Attribut anzahlMitarbeiter, das zählt, wie viele Objekte erzeugt wurden.\n\nUnterscheiden Sie statische Attribute und Instanzattribute an diesem Beispiel. (4 P)", "Statisch (anzahlMitarbeiter): gehört zur Klasse, existiert genau einmal, wird von allen Objekten geteilt, Zugriff über den Klassennamen (Mitarbeiter.anzahlMitarbeiter). Im UML-Diagramm unterstrichen.\nInstanzattribut (name): gehört zum Objekt, jedes Objekt hat seinen eigenen Wert.", "Je 2 P pro Begriff mit Beispiel."],
  ["Im Klassendiagramm einer Hotelsoftware gibt es: Gast kennt Zimmer, Hotel hat Zimmer (existenzabhängig), Abteilung hat Mitarbeiter (nicht existenzabhängig), Suite ist ein Zimmer, Rechnungsdrucker nutzt Rechnung als Parameter.\n\nBenennen Sie die fünf Beziehungen mit ihrer Notation. (5 P)", "Gast – Zimmer: Assoziation, durchgezogene Linie\nHotel – Zimmer: Komposition, gefüllte Raute am Hotel\nAbteilung – Mitarbeiter: Aggregation, hohle Raute an der Abteilung\nSuite → Zimmer: Vererbung, hohles Dreieck an Zimmer\nRechnungsdrucker → Rechnung: Abhängigkeit, gestrichelter Pfeil", "Je 1 P pro Beziehung mit Notation."]
);
CARDS_RAW.web.push(
  ["Bei einer instabilen Mobilfunkverbindung wiederholt eine App Anfragen automatisch.\n\nErklären Sie die Begriffe sicher und idempotent und ordnen Sie GET, POST, PUT, PATCH und DELETE zu. (5 P)", "Sicher: Die Methode ändert keine Daten – GET (auch HEAD, OPTIONS).\nIdempotent: Mehrfach ausgeführt wirkt wie einmal – GET, PUT, DELETE.\nNicht idempotent: POST (legt bei Wiederholung mehrfach an), PATCH in der Regel ebenfalls nicht.\nFolge: Idempotente Anfragen darf die App gefahrlos wiederholen, POST nicht.", "Je 1 P pro Begriff, 2 P Zuordnung, 1 P Folge für das Beispiel."],
  ["Bei Tests einer API liefern zwei Anfragen auf /api/admin unterschiedliche Fehler: einmal ohne Token, einmal mit Token eines normalen Benutzers.\n\nOrdnen Sie die Statuscodes 401 und 403 zu und erklären Sie den Unterschied. (2 P)", "Ohne Token: 401 Unauthorized – nicht oder nicht korrekt angemeldet (Authentifizierung fehlt).\nMit Token ohne Admin-Rolle: 403 Forbidden – angemeldet, aber keine Berechtigung (Autorisierung fehlt).", "Je 1 P pro Code mit Begründung."],
  ["Für eine neue Partneranbindung wird zwischen REST und SOAP entschieden.\n\nStellen Sie REST und SOAP anhand von vier Merkmalen gegenüber. (4 P)", "Prinzip: REST arbeitet mit Ressourcen und URLs, SOAP ist ein Protokoll mit Operationen.\nDatenformat: REST meist JSON, SOAP immer XML mit Envelope, Header, Body.\nSchnittstellenbeschreibung: REST oft OpenAPI, SOAP WSDL.\nGewicht: REST leichtgewichtig und zustandslos; SOAP schwergewichtiger mit eigenen Standards (z. B. WS-Security).", "Je 1 P pro Merkmal."],
  ["Ein Rechnungsaustausch per XML soll geprüft, in HTML umgewandelt und gezielt ausgewertet werden.\n\nOrdnen Sie DTD, XSD, XSLT und XPath ihren Aufgaben zu. (4 P)", "DTD: prüft die Struktur (Elemente, Reihenfolge), keine Datentypen.\nXSD (XML Schema): prüft Struktur und Datentypen wie xs:date, xs:decimal.\nXSLT: transformiert XML in andere Formate, z. B. HTML.\nXPath: adressiert Knoten, z. B. /rechnung/position[1]/betrag.", "Je 1 P pro Technik."],
  ["Bei einem Sicherheitsaudit eines Kundenportals werden XSS, CSRF und Session Hijacking geprüft.\n\nBeschreiben Sie die drei Angriffe mit je einer Schutzmaßnahme. (6 P)", "XSS: Angreifer schleust Skript in eine Seite ein, das bei anderen Nutzern läuft → Ausgaben kodieren, Content Security Policy.\nCSRF: Eine fremde Seite löst mit der bestehenden Sitzung des Opfers Aktionen aus → CSRF-Token, SameSite-Cookies.\nSession Hijacking: Angreifer stiehlt die Sitzungs-ID und übernimmt die Sitzung → HTTPS, Cookies mit HttpOnly und Secure, neue Sitzungs-ID nach dem Login.", "Je 1 P Beschreibung, je 1 P Schutzmaßnahme."],
  ["Ein Fitnessstudio möchte eine App für Kursbuchungen auf iOS und Android, das Budget ist begrenzt.\n\nUnterscheiden Sie vier App-Arten und empfehlen Sie eine. (5 P)", "Native: mit Plattform-SDK je Plattform, beste Performance, voller Gerätezugriff, aber doppelter Aufwand.\nCross-Platform (Flutter, .NET MAUI, React Native): ein Code für mehrere Plattformen, fast native Performance.\nHybrid: Webinhalt in einer nativen Hülle.\nWeb-App/PWA: läuft im Browser, PWA installierbar und offlinefähig.\nEmpfehlung: Cross-Platform oder PWA – ein Code für beide Plattformen, geringere Kosten, für Kursbuchungen ausreichend.", "Je 1 P pro App-Art, 1 P begründete Empfehlung."]
);
CARDS_RAW.lang = [
  ["Für einen Vortrag sollen Programmierparadigmen mit typischen Sprachen vorgestellt werden.\n\nNennen Sie vier Paradigmen mit je einem Beispiel. (4 P)", "Imperativ/prozedural: Anweisungsfolgen und Prozeduren – C\nObjektorientiert: Objekte mit Zustand und Verhalten – Java, C#\nFunktional: Funktionen ohne Seiteneffekte – Haskell, Streams und Lambdas in Java\nLogisch/deklarativ: Fakten und Regeln bzw. Beschreibung des Ergebnisses – Prolog, SQL", "Je 1 P pro Paradigma mit Beispiel."],
  ["In Python führt \"3\" + 3 zu einem Fehler, in JavaScript zu \"33\". Java meldet Typfehler schon beim Kompilieren.\n\nErklären Sie statische/dynamische sowie starke/schwache Typisierung an diesen Beispielen. (4 P)", "Statisch: Typprüfung beim Kompilieren (Java).\nDynamisch: Typprüfung zur Laufzeit (Python, JavaScript).\nStark: kaum implizite Typumwandlung (Python: \"3\" + 3 → TypeError).\nSchwach: viel implizite Typumwandlung (JavaScript: \"3\" + 3 → \"33\").", "Je 1 P pro Begriff mit Beispiel."],
  ["Ein Team vergleicht C++ (Compiler), Python (Interpreter) und Java (Bytecode mit JIT).\n\nErläutern Sie die drei Ausführungsmodelle mit je einem Vor- oder Nachteil. (6 P)", "Compiler (C++): übersetzt vorab in Maschinencode. Vorteil: schnelle Ausführung, Fehler vorab. Nachteil: plattformabhängig.\nInterpreter (Python): führt den Quellcode zur Laufzeit Anweisung für Anweisung aus. Vorteil: flexibel, kein Build. Nachteil: langsamer.\nBytecode + JIT (Java, C#): Übersetzung in Bytecode bzw. IL, die VM führt ihn aus, der JIT übersetzt häufig genutzten Code zur Laufzeit in Maschinencode. Vorteil: plattformunabhängig und trotzdem schnell.", "Je 1 P Beschreibung, je 1 P Vor- oder Nachteil."],
  ["In einer Theoriefrage sollen Maschinencode, Assembler, Java, SQL und Prolog den Sprachgenerationen zugeordnet werden.\n\nOrdnen Sie die Sprachen den Generationen 1GL bis 5GL zu und beschreiben Sie diese kurz. (5 P)", "1GL: Maschinencode – Binärbefehle des Prozessors\n2GL: Assembler – Mnemonics wie MOV, ADD\n3GL: Java (auch C, Python) – höhere, imperative Sprachen\n4GL: SQL – problemorientiert, deklarativ\n5GL: Prolog – wissensbasiert, logische Programmierung", "Je 1 P pro richtiger Zuordnung mit Beschreibung."],
  ["Aus einer Liste von Nettobeträgen sollen alle positiven Werte ausgewählt, in Bruttobeträge (19 % MwSt.) umgerechnet und aufsummiert werden.\n\nErklären Sie map, filter und reduce und geben Sie die Lösung als Stream-Ausdruck an. (5 P)", "filter: wählt Elemente aus, die eine Bedingung erfüllen\nmap: wandelt jedes Element um\nreduce: fasst alle Elemente zu einem Wert zusammen\nnetto.stream()\n  .filter(p -> p > 0)\n  .map(p -> p * 1.19)\n  .reduce(0.0, Double::sum)", "Je 1 P pro Operation, 2 P für den richtigen Ausdruck."],
  ["Eine App lädt Produktbilder vom Server, berechnet Preise und verarbeitet große Bilddateien.\n\nUnterscheiden Sie synchrone, asynchrone und parallele Verarbeitung und nennen Sie ein Risiko der Parallelität. (4 P)", "Synchron: Der Aufrufer wartet, bis das Ergebnis da ist (blockiert).\nAsynchron: Der Aufrufer arbeitet weiter, das Ergebnis kommt später (Callback, Promise, async/await) – z. B. Bilder laden, ohne dass die Oberfläche hängt.\nParallel: Aufgaben laufen gleichzeitig auf mehreren Kernen – z. B. Bildverarbeitung.\nRisiko: Race Condition bzw. Deadlock bei gemeinsamen Daten.", "Je 1 P pro Begriff, 1 P Risiko."],
  ["In einem Rechnungsprogramm fehlt ein Semikolon, eine Datei wird nicht gefunden und die Mehrwertsteuer wird mit 16 % statt 19 % berechnet.\n\nOrdnen Sie die drei Fehler den Fehlerarten zu und geben Sie an, wie sie jeweils entdeckt werden. (3 P)", "Fehlendes Semikolon: Syntaxfehler – meldet der Compiler bzw. die IDE.\nDatei nicht gefunden: Laufzeitfehler – Exception beim Ausführen.\nFalsche MwSt.: logischer Fehler – kein Absturz, falsches Ergebnis; nur durch Tests zu finden.", "Je 1 P pro richtiger Zuordnung mit Entdeckung."],
  ["Ein Programm liest Kundendaten aus einer Datei. Fehlt die Datei, soll eine Meldung erscheinen; die Datei soll in jedem Fall geschlossen werden.\n\nErläutern Sie try, catch und finally an diesem Beispiel. (3 P)", "try: enthält den kritischen Code (Datei öffnen und lesen).\ncatch: behandelt die Exception (z. B. FileNotFoundException → Meldung anzeigen, Fehler protokollieren).\nfinally: läuft immer und schließt die Datei.\nLeere catch-Blöcke vermeiden, sonst werden Fehler verschluckt.", "Je 1 P pro Block mit Bezug zum Beispiel."],
  ["Für ein Webprojekt wird Spring Boot eingesetzt, außerdem eine Bibliothek zur PDF-Erzeugung.\n\nUnterscheiden Sie Framework und Bibliothek an diesem Beispiel. (3 P)", "Bibliothek (PDF): Der eigene Code ruft sie bei Bedarf auf und behält die Kontrolle über den Ablauf.\nFramework (Spring Boot): gibt Struktur und Ablauf vor und ruft den eigenen Code auf, z. B. Controller-Methoden bei einer Anfrage.\nPrinzip: Inversion of Control (Hollywood-Prinzip: „Don't call us, we call you“).", "Je 1 P pro Begriff, 1 P Inversion of Control."],
  ["Die Personalabteilung möchte ihre Urlaubsplanung selbst mit einer Low-Code-Plattform umsetzen, statt die IT zu beauftragen.\n\nBeschreiben Sie Low-Code und nennen Sie je zwei Vor- und Nachteile. (5 P)", "Low-Code: Anwendungen werden überwiegend grafisch per Drag-and-drop und Konfiguration erstellt, mit wenig eigenem Code (No-Code: ganz ohne Code).\nVorteile: schnelle Ergebnisse; Fachabteilung kann selbst umsetzen.\nNachteile: Abhängigkeit vom Anbieter (Vendor-Lock-in); Grenzen bei Spezialanforderungen; Performance; Governance bzw. Schatten-IT.", "1 P Beschreibung, je 1 P pro Vor- und Nachteil."]
];
CARDS_RAW.arch = [
  ["Ein Onlinehändler überlegt, seinen gewachsenen Monolithen in Microservices zu zerlegen.\n\nStellen Sie je zwei Vor- und Nachteile von Monolith und Microservices gegenüber. (4 P)", "Monolith: + einfacher Start und Betrieb, ein Deployment; − schwer gezielt zu skalieren, große Codebasis, ein Fehler kann alles treffen.\nMicroservices: + unabhängig entwickel-, deploy- und skalierbar, eigene Datenhaltung je Dienst; − komplexer Betrieb und Monitoring, Netzwerkkommunikation und verteilte Fehlersuche.", "Je 0,5 P pro Vor- bzw. Nachteil."],
  ["Bei einem Code-Review fällt auf, dass die Klasse KundenManager Kunden speichert, Rechnungen druckt und E-Mails verschickt, und dass viele Klassen direkt auf ihre Attribute zugreifen.\n\nErklären Sie Kohäsion und Kopplung und bewerten Sie den Entwurf. (4 P)", "Kohäsion: Ein Modul hat eine klar umrissene Aufgabe. Ziel: hohe Kohäsion.\nKopplung: Abhängigkeiten zwischen Modulen. Ziel: lose Kopplung über schmale Schnittstellen.\nBewertung: KundenManager hat geringe Kohäsion (drei Aufgaben) und erzeugt starke Kopplung (direkter Attributzugriff). Besser: aufteilen in Kunden-, Rechnungs- und Mailservice mit klaren Schnittstellen.", "Je 1 P pro Begriff, 2 P Bewertung."],
  ["Ein Unternehmen nutzt gemietete virtuelle Server, eine verwaltete App-Plattform, Microsoft 365 und eine Funktion, die bei jedem Upload ein Vorschaubild erzeugt.\n\nOrdnen Sie IaaS, PaaS, SaaS und FaaS zu und geben Sie an, wofür der Kunde jeweils selbst verantwortlich ist. (4 P)", "IaaS (virtuelle Server): Anbieter stellt VMs, Netz, Speicher; Kunde verwaltet Betriebssystem, Laufzeit, Anwendung.\nPaaS (App-Plattform): Anbieter stellt Laufzeit und Datenbank; Kunde liefert nur die Anwendung.\nSaaS (Microsoft 365): fertige Software; Kunde nutzt sie nur und verwaltet Benutzer und Daten.\nFaaS (Vorschaubild): einzelne Funktionen, ereignisgesteuert, Abrechnung pro Aufruf; Kunde liefert nur den Funktionscode.", "Je 1 P pro richtiger Zuordnung mit Verantwortung."],
  ["Eine Steuerkanzlei überlegt, ihre Server in die Cloud zu verlagern.\n\nStellen Sie je zwei Vor- und Nachteile von Cloud und On-Premises gegenüber. (4 P)", "Cloud: + skalierbar, keine Hardwareinvestition, Abrechnung nach Nutzung; − Abhängigkeit vom Anbieter, Datenschutz (Serverstandort, AVV), laufende Kosten.\nOn-Premises: + volle Kontrolle über Daten und Hardware, keine Internetabhängigkeit; − hohe Anfangsinvestition, eigener Betrieb und eigenes Know-how nötig.", "Je 0,5 P pro Vor- bzw. Nachteil."],
  ["Die Anwendung eines Teams läuft auf dem Entwicklerrechner, aber nicht auf dem Testserver („works on my machine“).\n\nErklären Sie, wie Container das Problem lösen, und grenzen Sie Docker von Kubernetes ab. (4 P)", "Ein Container-Image enthält die Anwendung mit allen Abhängigkeiten (Bibliotheken, Laufzeit, Konfiguration). Es läuft auf jedem Host mit Container-Laufzeit gleich.\nContainer teilen sich den Kernel des Hosts, sind leichtgewichtig und starten in Sekunden.\nDocker: baut Images und startet einzelne Container.\nKubernetes: orchestriert viele Container über mehrere Server (Verteilung, Skalierung, Neustart).", "2 P Lösung des Problems, je 1 P Docker und Kubernetes."],
  ["Ein neues Teammitglied soll mit Git arbeiten.\n\nErklären Sie die Begriffe Repository, Commit, Branch, Merge, Pull Request und Tag. (6 P)", "Repository: Projektablage mit vollständiger Versionshistorie.\nCommit: gespeichertes Änderungspaket mit Nachricht.\nBranch: unabhängiger Entwicklungszweig, z. B. für ein Feature.\nMerge: Zusammenführen zweier Branches; bei widersprüchlichen Änderungen entsteht ein Konflikt.\nPull Request: Vorschlag, einen Branch zu übernehmen, mit Review vor dem Merge.\nTag: feste Markierung eines Commits, z. B. Release v1.2.0.", "Je 1 P pro Begriff."],
  ["Ein Team mit zehn Entwicklern sucht eine Branching-Strategie.\n\nBeschreiben Sie Feature-Branches, Git-Flow und Trunk-based Development. (3 P)", "Feature-Branch: Jedes Feature in einem eigenen Branch, Übernahme per Pull Request mit Review.\nGit-Flow: feste Branches main (Releases), develop (Integration), feature/*, release/*, hotfix/*.\nTrunk-based: sehr häufige Integration direkt in main mit kurzen Branches; unfertige Funktionen werden per Feature-Toggle ausgeblendet.", "Je 1 P pro Strategie."],
  ["Ein Unternehmen nutzt noch Subversion und überlegt den Umstieg auf Git.\n\nUnterscheiden Sie zentrale und verteilte Versionsverwaltung mit je einem Vor- und Nachteil. (4 P)", "Zentral (Subversion): ein Server mit dem Repository; einfaches Rechtekonzept, aber ohne Verbindung kaum Arbeit möglich, Server ist Single Point of Failure.\nVerteilt (Git): Jeder hat das vollständige Repository lokal; offline committen, schnelles Branching; aber anfangs komplexer zu lernen.", "Je 1 P Beschreibung, je 1 P Vor-/Nachteil."]
];
CARDS_RAW.ergo = [
  ["In einer Prüfungsaufgabe sollen Schwächen der Oberfläche einer Lagersoftware den Dialoggrundsätzen zugeordnet werden.\n\nNennen Sie die sieben Grundsätze der klassischen Fassung der ISO 9241-110 und die Änderungen der Fassung 2020. (7 P)", "Klassisch: Aufgabenangemessenheit, Selbstbeschreibungsfähigkeit, Erwartungskonformität, Lernförderlichkeit, Steuerbarkeit, Fehlertoleranz, Individualisierbarkeit.\nFassung 2020: Erlernbarkeit statt Lernförderlichkeit, Robustheit gegen Benutzungsfehler statt Fehlertoleranz, Benutzerbindung statt Individualisierbarkeit.", "Je 1 P pro Grundsatz; beide Fassungen werden akzeptiert. Immer mit Bezug zur Situation begründen."],
  ["Für ein Formular zur Hotelbuchung sollen Bedienelemente gewählt werden: Zimmerkategorie (eine aus drei), Extras (beliebig viele), Anreiseland (eines aus 190), Bemerkung (frei) und „Jetzt buchen“.\n\nOrdnen Sie jeweils ein passendes Bedienelement zu und begründen Sie. (5 P)", "Zimmerkategorie: Radiobuttons – genau eine Option aus wenigen, alle sichtbar.\nExtras: Checkboxen – mehrere unabhängige Optionen.\nAnreiseland: Dropdown (mit Suche) – eine Option aus vielen, platzsparend.\nBemerkung: mehrzeiliges Textfeld – freie Eingabe.\nJetzt buchen: Button – Aktion mit eindeutiger Beschriftung.", "Je 1 P pro Element mit Begründung."],
  ["Ein Onlineshop misst Abschlussrate und Bearbeitungszeit im Checkout. Die Marketingabteilung will zusätzlich wissen, wie Kunden den Shop insgesamt erleben.\n\nUnterscheiden Sie Usability und User Experience. (3 P)", "Usability (ISO 9241-11): Nutzer erreichen ihr Ziel effektiv, effizient und zufriedenstellend – z. B. Checkout schnell und fehlerfrei.\nUser Experience: das gesamte Erleben vor, während und nach der Nutzung, einschließlich Erwartungen und Emotionen – z. B. Werbung, Bestellung, Lieferung, Retoure.\nUsability ist ein Teil der UX.", "Je 1 P pro Begriff, 1 P Zusammenhang."],
  ["Für ein kommerzielles Produkt werden Bibliotheken unter GPL, LGPL und MIT geprüft; außerdem soll das eigene Produkt lizenziert werden.\n\nBeschreiben Sie die Lizenztypen und ihre Folgen für das Produkt. (4 P)", "GPL (starkes Copyleft): Wer sie einbindet und vertreibt, muss sein abgeleitetes Werk ebenfalls unter GPL mit Quellcode weitergeben.\nLGPL (schwaches Copyleft): Bibliothek darf in proprietärer Software genutzt werden; nur Änderungen an der Bibliothek selbst fallen unter LGPL.\nMIT/Apache (freizügig): Nutzung auch in proprietärer Software, Lizenzhinweis behalten.\nProprietär: Kauf, Abo, pro Nutzer oder Gerät, Concurrent Use.", "Je 1 P pro Lizenztyp mit Folge."],
  ["Ein Entwickler hat bei seinem Arbeitgeber ein Planungstool geschrieben und Code aus einem Internetforum übernommen. Nach seinem Wechsel will er das Tool weiterverkaufen.\n\nBeurteilen Sie die Lage nach Urheberrecht. (4 P)", "Software ist urheberrechtlich geschützt (§ 69a UrhG).\nFür Programme, die ein Arbeitnehmer in Erfüllung seiner Aufgaben schafft, stehen die vermögensrechtlichen Befugnisse dem Arbeitgeber zu (§ 69b UrhG) – der Entwickler darf das Tool nicht verkaufen.\nFremden Code darf man nur nutzen, wenn eine passende Lizenz das erlaubt; Code aus Foren hat oft eine Lizenz (z. B. CC BY-SA bei Stack Overflow), die eingehalten werden muss.", "1 P Schutz, 2 P Arbeitgeber mit Folge, 1 P fremder Code."],
  ["Ein mittelständischer Hersteller plant seine Softwarelandschaft: Geschäftsprozesse, Kundenbetreuung, Lieferkette, Website und Dokumentenablage.\n\nOrdnen Sie ERP, CRM, SCM, CMS und DMS zu und beschreiben Sie sie kurz. (5 P)", "ERP: Ressourcen und Geschäftsprozesse integriert (Einkauf, Lager, Produktion, Buchhaltung).\nCRM: Kundenbeziehungen (Kontakte, Angebote, Service).\nSCM: Lieferkette (Lieferanten, Bestände, Transporte).\nCMS: Webinhalte pflegen.\nDMS: Dokumente verwalten, versionieren, archivieren.", "Je 1 P pro System."],
  ["Eine Zahnarztpraxis entscheidet zwischen einer fertigen Praxissoftware und einer individuell programmierten Lösung.\n\nStellen Sie Standard- und Individualsoftware anhand von vier Kriterien gegenüber. (4 P)", "Kosten: Standard günstig (Kosten verteilt auf viele Kunden) – Individual teuer.\nVerfügbarkeit: Standard sofort – Individual nach Entwicklungszeit.\nAnpassung: Standard begrenzt – Individual passgenau.\nWartung/Abhängigkeit: Standard durch Hersteller, Updates für alle – Individual eigene Wartung bzw. Abhängigkeit vom Entwickler.", "Je 1 P pro Kriterium."],
  ["Nach Abschluss eines Projekts übergeben Sie eine Lagersoftware an Kunden und den IT-Betrieb.\n\nUnterscheiden Sie technische Dokumentation und Benutzerdokumentation nach Zielgruppe und Inhalt. (4 P)", "Technische Dokumentation – Zielgruppe: Entwickler und Administratoren; Inhalt: Architektur, Schnittstellen, Datenmodell, Installation, Betrieb, Code-Kommentare.\nBenutzerdokumentation – Zielgruppe: Anwender; Inhalt: Handbuch, Online-Hilfe, Schulungsunterlagen, verständlich ohne Fachjargon.", "Je 1 P Zielgruppe, je 1 P Inhalt."]
];

// ---------- Auswahlfragen
MC.push(
  // T01 Algorithmen und Datenstrukturen
  ["t2", "algo", "Die binäre Suche durchsucht das sortierte Array werte mit links = 0 und rechts = 9.\n\nWelchen Index prüft sie zuerst?", ["Index 4","Index 5","Index 0","Index 9"], 0, "mitte = (links + rechts) div 2 = 9 div 2 = 4. Ist der Wert dort zu klein, geht es mit links = 5 weiter, sonst mit rechts = 3.", "T01"],
  ["t2", "algo", "Ein Lager verwaltet 1.000 sortierte Artikelnummern und sucht eine davon mit der binären Suche.\n\nWie viele Vergleiche braucht die Suche höchstens ungefähr?", ["10","100","500","1.000"], 0, "Jeder Vergleich halbiert den Suchbereich: 2¹⁰ = 1.024 ≥ 1.000, also etwa 10 Vergleiche (log₂ n). Die lineare Suche bräuchte bis zu 1.000.", "T01"],
  ["t2", "algo", "Ein Texteditor speichert jede Änderung, damit „Rückgängig“ die zuletzt gemachte Änderung zuerst zurücknimmt.\n\nNach welchem Prinzip arbeitet die verwendete Datenstruktur (Stack)?", ["LIFO","FIFO","Zufällig","Nach Priorität"], 0, "Last In, First Out: Das zuletzt abgelegte Element (push) wird zuerst entnommen (pop).", "T01"],
  ["t2", "algo", "Mehrere Mitarbeiter schicken Druckaufträge an denselben Drucker. Sie sollen in der Reihenfolge ihres Eingangs gedruckt werden.\n\nWelche Datenstruktur passt?", ["Queue (Warteschlange)","Stack (Stapel)","Binärer Suchbaum","Zweidimensionales Array"], 0, "Eine Queue arbeitet nach FIFO (First In, First Out): enqueue hängt hinten an, dequeue entnimmt vorne.", "T01"],
  ["t2", "algo", "Bubble Sort wird so verbessert, dass er abbricht, sobald in einem Durchlauf nicht getauscht wurde. Die Daten sind bereits vollständig sortiert.\n\nWelche Laufzeit ergibt sich in diesem besten Fall?", ["O(n)","O(n²)","O(log n)","O(1)"], 0, "Ein einziger Durchlauf mit n - 1 Vergleichen genügt, um festzustellen, dass nichts zu tauschen ist. Ohne diese Abbruchbedingung bleibt es bei O(n²).", "T01"],
  ["t2", "algo", "Ein Mikrocontroller kann nur sehr selten in den Speicher schreiben, Vergleiche sind dagegen günstig.\n\nWarum eignet sich Selection Sort hier besser als Bubble Sort?", ["Selection Sort braucht höchstens n - 1 Tauschvorgänge.","Selection Sort braucht höchstens n - 1 Vergleiche.","Selection Sort arbeitet rekursiv und spart so Schreibzugriffe.","Selection Sort hat im besten Fall eine Laufzeit von O(n)."], 0, "Selection Sort tauscht pro Durchlauf höchstens einmal (das gefundene Minimum nach vorn). Bubble Sort tauscht bei jedem falschen Nachbarpaar. Die Zahl der Vergleiche ist bei beiden O(n²).", "T01"],
  ["t2", "algo", "Ein Kartenspieler nimmt Karten einzeln auf und steckt jede sofort an die richtige Stelle in seiner bereits sortierten Hand.\n\nWelchem Sortierverfahren entspricht das?", ["Insertion Sort","Selection Sort","Bubble Sort","Binäre Suche"], 0, "Insertion Sort („Sortieren durch Einfügen“) fügt jedes Element in den sortierten linken Teil ein und schiebt größere Elemente nach rechts.", "T01"],
  ["t2", "algo", "Eine rekursive Methode summe(n) ruft immer summe(n - 1) auf, enthält aber keine Abbruchbedingung.\n\nWas passiert beim Aufruf?", ["Sie ruft sich endlos auf, bis der Aufrufstapel überläuft.","Sie ruft sich so lange auf, bis n den Wert 0 erreicht hat.","Sie ruft sich endlos auf, bis der Heap-Speicher vollläuft.","Der Compiler meldet die fehlende Abbruchbedingung als Fehler."], 0, "Jeder Aufruf belegt Platz auf dem Stack. Ohne Anker endet die Rekursion nie; es kommt zum Stack Overflow.", "T01"],
  ["t2", "algo", "Ein Programm liest aus einem Array mit einer Million Messwerten den Wert werte[734512].\n\nWelche Laufzeit hat dieser Zugriff?", ["O(1)","O(log n)","O(n)","O(n²)"], 0, "Die Speicheradresse wird direkt aus Startadresse und Index berechnet – unabhängig von der Länge des Arrays.", "T01"],
  ["t2", "algo", "Ein Algorithmus vergleicht jedes von n Produkten mit jedem anderen, um ähnliche Produkte zu finden. Dazu laufen zwei verschachtelte Schleifen jeweils über alle n Elemente.\n\nWelche Laufzeitklasse ergibt sich?", ["O(n²)","O(n)","O(2n)","O(log n)"], 0, "n Durchläufe außen mal n Durchläufe innen = n². Konstante Faktoren wie bei O(2n) fallen in der O-Notation weg.", "T01"],
  ["t2", "algo", "Eine Navigations-App soll die kürzeste Route zwischen Städten berechnen. Gespeichert werden Städte, Straßen und deren Länge in km.\n\nWelche Datenstruktur bildet das ab?", ["Gewichteter Graph","Binärer Suchbaum","Ungewichteter Graph","Verkettete Liste"], 0, "Städte sind Knoten, Straßen Kanten, die Entfernung ist das Kantengewicht. Darauf arbeiten Algorithmen wie Dijkstra.", "T01"],
  ["t2", "algo", "In einem binären Suchbaum steht die 42 in der Wurzel. Der Wert 17 soll eingefügt werden.\n\nWohin kommt er?", ["In den linken Teilbaum","In den rechten Teilbaum","Er wird neue Wurzel","Hinter das größte Element"], 0, "Im binären Suchbaum liegen kleinere Schlüssel links, größere rechts. Dadurch ist die Suche bei ausgeglichenem Baum O(log n).", "T01"],
  ["t2", "algo", "Ein Programm fragt so lange eine PIN ab, bis sie richtig ist. Die Eingabe muss mindestens einmal erfolgen.\n\nWelche Schleifenart passt?", ["Fußgesteuerte Schleife (wiederhole … bis, do-while)","Kopfgesteuerte Schleife (solange … tue, while)","Zählschleife mit fester Anzahl (für … bis, for)","Mengenschleife über alle Elemente (für jedes, for-each)"], 0, "Die fußgesteuerte Schleife prüft die Bedingung erst nach dem Durchlauf und läuft daher mindestens einmal.", "T01"],
  ["t2", "algo", "Ein Sparplan verzinst 1.000 € zwei Jahre lang mit 5 % pro Jahr. Die Zinsen werden jeweils mitverzinst.\n\nWelcher Betrag ergibt sich nach zwei Jahren?", ["1.102,50 €","1.100,00 €","1.105,00 €","1.050,00 €"], 0, "1.000 · 1,05 = 1.050; 1.050 · 1,05 = 1.102,50 €. Allgemein: Kapital · (1 + p)ⁿ. Ohne Zinseszins wären es 1.100 €.", "T01"],
  // T02 SQL
  ["t2", "sql", "Der Datenbankadministrator vergibt dem neuen Mitarbeiter Leserechte auf die Tabelle Bestellung.\n\nZu welchem SQL-Sprachbereich gehört der Befehl GRANT?", ["DCL – Data Control Language","DDL – Data Definition Language","DML – Data Manipulation Language","TCL – Transaction Control Language"], 0, "Die DCL regelt Berechtigungen mit GRANT und REVOKE. DDL definiert Strukturen (CREATE, ALTER, DROP), DML ändert Daten (INSERT, UPDATE, DELETE).", "T02"],
  ["t2", "sql", "Während einer Umbuchung tritt ein Fehler auf. Alle Änderungen seit Beginn der Transaktion sollen verworfen werden.\n\nWelcher Befehl der TCL macht das?", ["ROLLBACK","COMMIT","SAVEPOINT","TRUNCATE"], 0, "Die Transaction Control Language steuert Transaktionen: COMMIT bestätigt, ROLLBACK verwirft, SAVEPOINT setzt einen Zwischenstand.", "T02"],
  ["t2", "sql", "Die Marketingabteilung sucht Kunden, die sowohl 2025 als auch 2026 bestellt haben. Dazu werden zwei Abfragen mit gleicher Spaltenliste kombiniert.\n\nWas liefert INTERSECT?", ["Nur die Zeilen, die in beiden Ergebnissen vorkommen","Alle Zeilen, die in mindestens einem Ergebnis vorkommen","Die Zeilen des ersten Ergebnisses ohne die des zweiten","Jede Zeile des ersten mit jeder Zeile des zweiten kombiniert"], 0, "INTERSECT bildet die Schnittmenge. UNION bildet die Vereinigung, EXCEPT (Oracle: MINUS) die Differenz.", "T02"],
  ["t2", "sql", "Gesucht sind Kunden, die 2025 bestellt haben, 2026 aber nicht mehr.\n\nWas liefert Abfrage2025 EXCEPT Abfrage2026 (in Oracle MINUS)?", ["Die Zeilen der ersten Abfrage, die in der zweiten nicht vorkommen","Die Zeilen der zweiten Abfrage, die in der ersten nicht vorkommen","Die Zeilen der ersten Abfrage, die auch in der zweiten vorkommen","Die Zeilen beider Abfragen, die nur in einer von beiden vorkommen"], 0, "EXCEPT bildet die Differenzmenge: erstes Ergebnis minus zweites. Die Reihenfolge der Abfragen ist also entscheidend.", "T02"],
  ["t2", "sql", "Zwei Abfragen sollen mit UNION zu einer Liste zusammengeführt werden.\n\nWelche Bedingung müssen beide Abfragen erfüllen?", ["Gleiche Spaltenanzahl mit verträglichen Datentypen","Gleiche Spaltennamen in identischer Schreibweise","Gleiche Zeilenanzahl in beiden Ergebnismengen","Gleiche Quelltabelle mit identischer WHERE-Bedingung"], 0, "Die Ergebnisse werden zeilenweise untereinandergesetzt. Dazu müssen Anzahl und Typen der Spalten zusammenpassen; die Spaltennamen kommen aus der ersten Abfrage.", "T02"],
  ["t2", "sql", "Für eine Preisliste werden versehentlich die Tabellen Farbe (4 Zeilen) und Groesse (5 Zeilen) ohne Join-Bedingung verknüpft (CROSS JOIN).\n\nWie viele Zeilen liefert das Ergebnis?", ["20","9","10","0"], 0, "Der CROSS JOIN bildet das kartesische Produkt: Jede Zeile wird mit jeder kombiniert, also 4 · 5 = 20 Zeilen. Verwechslungsgefahr: 9 wäre die Summe der Zeilen; leer ist das Ergebnis ohne Join-Bedingung gerade nicht.", "T02"],
  ["t2", "sql", "In der Tabelle Mitarbeiter verweist die Spalte ChefID auf die MID des Vorgesetzten. Es soll zu jedem Mitarbeiter der Name seines Chefs ausgegeben werden.\n\nWelche Technik ist dafür nötig?", ["Ein Self Join: die Tabelle wird mit sich selbst verbunden","Ein Natural Join: Verknüpfung über gleichnamige Spalten","Ein UNION: Mitarbeiter und Chefs werden untereinandergesetzt","Ein GROUP BY: die Mitarbeiter werden nach ChefID gruppiert"], 0, "Beim Self Join wird dieselbe Tabelle zweimal mit unterschiedlichen Aliasnamen verwendet, z. B. Mitarbeiter m und Mitarbeiter v ON m.ChefID = v.MID.", "T02"],
  ["t2", "sql", "Eine Abfrage enthält WHERE EXISTS (SELECT * FROM Bestellung b WHERE b.KID = k.KID).\n\nWas prüft EXISTS?", ["Ob die Unterabfrage mindestens eine Zeile liefert","Ob die Unterabfrage genau eine Zeile liefert","Ob die Unterabfrage keine NULL-Werte liefert","Ob die Tabelle Bestellung in der Datenbank existiert"], 0, "EXISTS ist wahr, sobald die (meist korrelierte) Unterabfrage eine Zeile liefert. Welche Spalten sie auswählt, spielt keine Rolle.", "T02"],
  ["t2", "sql", "Gesucht sind Artikel, die teurer sind als jede Maus im Sortiment. Die Bedingung lautet WHERE Preis > ALL (SELECT Preis FROM Artikel WHERE Kategorie = 'Maus').\n\nWas bedeutet ALL hier?", ["Der Preis muss größer als jeder Mauspreis sein.","Der Preis muss größer als irgendein Mauspreis sein.","Der Preis muss einem Mauspreis entsprechen.","Der Preis muss über dem Durchschnitt der Mauspreise liegen."], 0, "ALL verlangt die Bedingung für jeden Wert der Unterabfrage, also größer als das Maximum. ANY (SOME) genügt ein einziger Wert.", "T02"],
  ["t2", "sql", "In der Theorieaufgabe soll eine SQL-Abfrage in die relationale Algebra übertragen werden.\n\nWelcher Operation entspricht die WHERE-Klausel?", ["Selektion","Projektion","Vereinigung","Division"], 0, "Die Selektion wählt Zeilen nach einer Bedingung aus (WHERE). Die Projektion wählt Spalten aus (Spaltenliste nach SELECT).", "T02"],
  ["t2", "sql", "In der Abfrage SELECT Name, Ort FROM Kunde werden nur zwei Spalten ausgegeben.\n\nWelcher Operation der relationalen Algebra entspricht das?", ["Projektion","Selektion","Kartesisches Produkt","Differenz"], 0, "Die Projektion wählt Spalten aus. Merkhilfe: Selektion = Zeilen (WHERE), Projektion = Spalten (SELECT-Liste).", "T02"],
  ["t2", "sql", "Eine Abfrage sucht Artikel, die nie bestellt wurden: WHERE ArtNr NOT IN (SELECT ArtNr FROM Position). In Position steht durch einen Erfassungsfehler eine Zeile mit ArtNr = NULL.\n\nWas liefert die Hauptabfrage?", ["Keine Zeilen","Alle Artikel","Nur Artikel mit NULL","Einen Syntaxfehler"], 0, "x NOT IN (…, NULL) ist nie wahr, sondern „unbekannt“. Deshalb fällt jede Zeile heraus. NOT EXISTS ist bei möglichen NULL-Werten die sichere Variante.", "T02"],
  ["t2", "sql", "Die Buchhaltung soll Kundendaten sehen, aber ohne die E-Mail-Adressen. Der Administrator legt dafür eine View an.\n\nWelche Aussage über eine View stimmt?", ["Sie ist eine gespeicherte Abfrage, die wie eine Tabelle genutzt wird.","Sie ist ein Index, der die Spalte E-Mail beim Lesen ausblendet.","Sie ist eine Rolle, die der Buchhaltung Leserechte auf Spalten gibt.","Sie ist ein Trigger, der die E-Mail-Spalte bei jedem SELECT entfernt."], 0, "Eine View ist eine virtuelle Tabelle. Sie kann Spalten verbergen, komplexe Abfragen vereinfachen und mit GRANT gezielt freigegeben werden.", "T02"],
  ["t2", "sql", "Die nicht mehr benötigte Tabelle Altkunden soll vollständig aus der Datenbank verschwinden, also Daten und Struktur.\n\nWelcher Befehl ist richtig?", ["DROP TABLE Altkunden;","DELETE FROM Altkunden;","TRUNCATE COLUMN Altkunden;","REMOVE TABLE Altkunden;"], 0, "DROP entfernt das Objekt selbst (DDL). DELETE löscht nur die Zeilen, die leere Tabelle bleibt bestehen.", "T02"],
  ["t2", "sql", "Ein Kollege wundert sich, dass er in WHERE keinen Aliasnamen aus der SELECT-Liste verwenden darf.\n\nWelcher Teil einer Abfrage wird logisch zuerst ausgewertet?", ["FROM mit JOIN","WHERE-Bedingung","SELECT mit Aliasen","GROUP BY mit HAVING"], 0, "Logische Reihenfolge: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY. Der Alias entsteht erst im SELECT, ist in WHERE also noch unbekannt, in ORDER BY aber schon nutzbar.", "T02"],
  // T03 Datenmodell
  ["t2", "dm", "Die Tabelle Mitarbeiter erhält als Primärschlüssel eine automatisch hochgezählte Spalte MID statt der Kombination aus Name und Geburtsdatum.\n\nWie nennt man einen solchen Schlüssel?", ["Surrogatschlüssel: künstlicher Schlüssel ohne fachliche Bedeutung","Natürlicher Schlüssel: aus fachlichen Attributen gebildeter Schlüssel","Fremdschlüssel: Verweis auf den Primärschlüssel einer Tabelle","Zusammengesetzter Schlüssel: Kombination mehrerer Fachattribute"], 0, "Surrogatschlüssel sind kurz und ändern sich nie. Die fachliche Eindeutigkeit (z. B. Personalnummer) sollte trotzdem zusätzlich über UNIQUE abgesichert werden.", "T03"],
  ["t2", "dm", "In der Tabelle Student sind sowohl Matrikelnummer als auch E-Mail-Adresse eindeutig.\n\nWie heißen solche Attribute, bevor einer davon als Primärschlüssel gewählt wird?", ["Kandidatenschlüssel","Fremdschlüssel","Surrogatschlüssel","Zusammengesetzte Schlüssel"], 0, "Ein Kandidatenschlüssel ist eine minimale Attributkombination, die jeden Datensatz eindeutig identifiziert. Einer wird Primärschlüssel, die übrigen sind Alternativschlüssel.", "T03"],
  ["t2", "dm", "Ein Online-Shop speichert Rechnungsbeträge. Rundungsfehler im Cent-Bereich sind nicht akzeptabel.\n\nWelcher Datentyp eignet sich?", ["DECIMAL(10,2)","FLOAT(10,2)","DOUBLE PRECISION","VARCHAR(10)"], 0, "DECIMAL speichert Dezimalzahlen exakt mit fester Nachkommastellenzahl. FLOAT und DOUBLE PRECISION sind Gleitkommatypen und erzeugen Rundungsfehler, z. B. 0,1 + 0,2 ≠ 0,3 – daran ändert auch die Angabe (10,2) bei FLOAT nichts.", "T03"],
  ["t2", "dm", "Für eine neue Kursverwaltung zeichnen Sie zuerst Entitäten, Attribute und Beziehungen, noch ohne an ein bestimmtes DBMS zu denken.\n\nIn welcher Modellierungsphase entsteht dieses ER-Modell?", ["Konzeptionelles Modell","Logisches Relationenmodell","Physisches Datenbankmodell","Implementierungsmodell"], 0, "Reihenfolge: konzeptionell (ER-Modell, DBMS-unabhängig) → logisch (Relationenmodell mit Tabellen und Schlüsseln) → physisch (Datentypen, Indizes, Speicherung im konkreten DBMS).", "T03"],
  ["t2", "dm", "Nachdem das Relationenmodell steht, legen Sie für MySQL Datentypen, Indizes und Speicherparameter fest.\n\nWelches Modell beschreiben Sie damit?", ["Das physische Datenmodell","Die Anforderungen der Fachabteilung","Das konzeptionelle ER-Modell","Den Entwurf der Benutzeroberfläche"], 0, "Erst das physische Modell ist vom konkreten DBMS abhängig: Es legt fest, wie die Daten dort tatsächlich gespeichert werden.", "T03"],
  ["t2", "dm", "Im ER-Diagramm einer Werkstatt steht zwischen Kunde und Fahrzeug auf der Fahrzeug-Seite ein Kreis vor dem Krähenfuß.\n\nWas bedeutet das?", ["Ein Kunde hat keins bis viele Fahrzeuge.","Ein Kunde hat eins bis viele Fahrzeuge.","Ein Kunde hat keins oder genau ein Fahrzeug.","Ein Kunde hat genau ein Fahrzeug."], 0, "In der Krähenfuß-Notation bedeutet der Kreis „null“ (optional), der Strich „eins“ und der Krähenfuß „viele“. Kreis + Krähenfuß = 0..n.", "T03"],
  ["t2", "dm", "Ein Datenbanksystem soll so aufgebaut sein, dass sich die Speicherung ändern lässt, ohne die Anwendungsprogramme anzupassen.\n\nWas ist das Ziel der Drei-Ebenen-Architektur nach ANSI/SPARC?", ["Datenunabhängigkeit zwischen Anwendungen und Speicherung","Redundanzfreiheit durch Aufteilung der Daten in Tabellen","Ausfallsicherheit durch Verteilung der Daten auf Server","Zugriffsschutz durch Verschlüsselung der gespeicherten Daten"], 0, "Externe Ebene (Sichten der Anwender), konzeptionelle Ebene (Gesamtschema) und interne Ebene (physische Speicherung) sind getrennt. Änderungen auf einer Ebene wirken sich nicht auf die anderen aus.", "T03"],
  ["t2", "dm", "Im Modell einer Behörde hat jede Person genau einen Personalausweis und jeder Ausweis gehört genau einer Person.\n\nWelche Kardinalität liegt vor?", ["1:1","1:n","m:n","n:1"], 0, "Auf beiden Seiten steht genau eins. Bei 1:1 kann der Fremdschlüssel in einer der beiden Tabellen stehen und wird zusätzlich UNIQUE gesetzt.", "T03"],
  ["t2", "dm", "Die Tabelle Position einer Auftragsverwaltung hat den Primärschlüssel (BestellNr, ArtikelNr).\n\nWie nennt man einen solchen Schlüssel?", ["Zusammengesetzter Primärschlüssel aus mehreren Attributen","Doppelter Primärschlüssel aus zwei unabhängigen Schlüsseln","Alternativschlüssel aus mehreren eindeutigen Attributen","Sekundärschlüssel aus mehreren indizierten Attributen"], 0, "Erst beide Attribute zusammen sind eindeutig. Zusammengesetzte Schlüssel sind typisch für Zwischentabellen aufgelöster m:n-Beziehungen.", "T03"],
  // T16 Datenbanksysteme und NoSQL
  ["t2", "dbs", "Bei einer Überweisung wird der Betrag vom Konto A abgebucht. Vor der Gutschrift auf Konto B stürzt der Server ab.\n\nWelche ACID-Eigenschaft verhindert, dass nur die Abbuchung bestehen bleibt?", ["Atomarität","Isolation","Dauerhaftigkeit","Konsistenz durch Indizes"], 0, "Atomarität: Eine Transaktion wird ganz oder gar nicht ausgeführt. Nach dem Neustart wird die unvollständige Transaktion zurückgerollt.", "T16"],
  ["t2", "dbs", "Der Online-Shop bestätigt dem Kunden die Bestellung. Eine Sekunde später fällt der Strom aus.\n\nWelche ACID-Eigenschaft sichert, dass die bestätigte Bestellung erhalten bleibt?", ["Dauerhaftigkeit (Durability)","Atomarität (Atomicity)","Konsistenz (Consistency)","Verfügbarkeit (Availability)"], 0, "Nach dem COMMIT sind Änderungen dauerhaft, z. B. weil sie zuerst ins Transaktionslog geschrieben werden und nach einem Absturz wiederhergestellt werden können.", "T16"],
  ["t2", "dbs", "Zwei Lageristen lesen gleichzeitig den Bestand 10, buchen jeweils eine Entnahme und speichern 9 bzw. 8. Am Ende steht 8 statt 7 in der Datenbank.\n\nWie heißt dieses Problem?", ["Lost Update","Dirty Read","Deadlock","Phantom Read"], 0, "Beim Lost Update überschreibt die zweite Änderung die erste. Sperren (z. B. SELECT … FOR UPDATE) oder eine Versionsprüfung verhindern das.", "T16"],
  ["t2", "dbs", "Transaktion T1 sperrt Konto A und wartet auf Konto B. Transaktion T2 sperrt Konto B und wartet auf Konto A.\n\nWie nennt man diese Situation?", ["Deadlock","Dirty Read","Lost Update","Rekursiver Trigger"], 0, "Beim Deadlock warten Transaktionen gegenseitig auf die Sperren der anderen. Das DBMS erkennt das und bricht eine Transaktion ab (Rollback).", "T16"],
  ["t2", "dbs", "Ein Lagerverwaltungssystem soll bei jedem Abgang automatisch prüfen, ob der Mindestbestand unterschritten ist.\n\nWann wird ein Trigger ausgeführt?", ["Automatisch bei einem Ereignis wie INSERT, UPDATE oder DELETE","Erst nach ausdrücklichem Aufruf mit CALL oder EXECUTE","Zeitgesteuert in einem festen Intervall, z. B. stündlich per Cronjob","Automatisch bei jedem SELECT auf die betroffene Tabelle"], 0, "Trigger reagieren auf Datenänderungen in einer Tabelle (BEFORE oder AFTER). Eine Stored Procedure muss dagegen ausdrücklich aufgerufen werden.", "T16"],
  ["t2", "dbs", "Die Buchungslogik einer Bank wird als Stored Procedure in der Datenbank hinterlegt und von mehreren Anwendungen aufgerufen.\n\nWelcher Vorteil ergibt sich daraus?", ["Die Logik liegt zentral in der Datenbank, Parameter schützen vor SQL-Injection.","Die Logik ist herstellerunabhängig, die Syntax gilt in jedem DBMS identisch.","Die Logik liegt zentral in der Datenbank, Backups der Daten werden überflüssig.","Die Logik wird im Client ausgeführt, das entlastet den Datenbankserver."], 0, "Stored Procedures bündeln Logik zentral, verringern die Netzlast und arbeiten mit Parametern statt zusammengesetzter SQL-Strings. Nachteil: Die Syntax ist herstellerabhängig.", "T16"],
  ["t2", "dbs", "Ein Unternehmen spiegelt seine Datenbank in Echtzeit auf einen zweiten Server und verzichtet deshalb auf Backups.\n\nWarum ist das riskant?", ["Fehler wie ein versehentliches DELETE werden sofort mitrepliziert.","Replikation überträgt nur Strukturänderungen, aber keine Datensätze.","Replikation verdoppelt die Daten und verstößt damit gegen die DSGVO.","Fehler wie ein versehentliches DELETE werden erst nachts repliziert."], 0, "Replikation erhöht die Verfügbarkeit, hält aber keinen früheren Datenstand vor. Nur ein Backup erlaubt die Rückkehr zu einem Zeitpunkt vor dem Fehler.", "T16"],
  ["t2", "dbs", "Ein Online-Shop möchte Empfehlungen wie „Kunden, die X kauften, kauften auch Y“ über mehrere Ebenen berechnen.\n\nWelcher NoSQL-Typ passt am besten?", ["Graphdatenbank","Key-Value-Store","Spaltenorientierte Datenbank","Dokumentenorientierte Datenbank"], 0, "Graphdatenbanken (z. B. Neo4j) speichern Knoten und Kanten und verfolgen Beziehungen über viele Ebenen effizient, wo relationale Datenbanken viele Joins bräuchten.", "T16"],
  ["t2", "dbs", "Eine Webanwendung soll Sitzungsdaten der angemeldeten Nutzer extrem schnell über die Session-ID abrufen.\n\nWelcher NoSQL-Typ eignet sich?", ["Key-Value-Store","Graphdatenbank","Relationale Datenbank","Hierarchische Datenbank"], 0, "Ein Key-Value-Store (z. B. Redis) greift über einen Schlüssel direkt auf den Wert zu, oft im Arbeitsspeicher. Ideal für Caches und Sitzungen.", "T16"],
  ["t2", "dbs", "Ein weltweit verteiltes System verliert zeitweise die Verbindung zwischen zwei Rechenzentren.\n\nWas besagt das CAP-Theorem für diesen Fall?", ["Bei einer Netzwerkpartition kann das System nicht zugleich Konsistenz und Verfügbarkeit garantieren.","Bei einer Netzwerkpartition kann das System Konsistenz und Verfügbarkeit dennoch gleichzeitig garantieren.","Ohne Netzwerkpartition kann das System nur entweder Konsistenz oder Verfügbarkeit garantieren.","Bei einer Netzwerkpartition stellt das System die Konsistenz aller Knoten automatisch wieder her."], 0, "CAP: Consistency, Availability, Partition Tolerance. Partitionstoleranz ist bei verteilten Systemen Pflicht, also muss man zwischen C (alle sehen dasselbe) und A (jede Anfrage wird beantwortet) wählen.", "T16"],
  ["t2", "dbs", "Viele NoSQL-Systeme folgen statt ACID dem BASE-Prinzip.\n\nWofür steht das E in BASE?", ["Eventual Consistency","Enforced Consistency","Exclusive Locking","Eventual Durability"], 0, "Basically Available, Soft State, Eventual Consistency: Das System bleibt verfügbar, Daten sind kurzzeitig unterschiedlich und gleichen sich nach einiger Zeit an.", "T16"],
  ["t2", "dbs", "Ein Energieversorger sammelt Messwerte von Millionen Smart Metern im Sekundentakt, dazu Wetterdaten und Kundenbeschwerden als Freitext.\n\nWelche drei Vs beschreiben Big Data klassisch?", ["Volume, Velocity, Variety","Value, Version, Volume","Velocity, Validation, View","Variety, Virtualisierung, Verfügbarkeit"], 0, "Volume (Menge), Velocity (Geschwindigkeit), Variety (Vielfalt der Formate). Häufig ergänzt um Veracity (Verlässlichkeit) und Value (Nutzen).", "T16"],
  ["t2", "dbs", "Ein Konzern plant eine Plattform für Auswertungen. Die Fachabteilung will sowohl aufbereitete Kennzahlen als auch Rohdaten für spätere Analysen.\n\nWas unterscheidet einen Data Lake von einem Data Warehouse?", ["Der Data Lake speichert Rohdaten jeder Art, das Warehouse aufbereitete, strukturierte Daten.","Der Data Lake speichert aufbereitete, strukturierte Daten, das Warehouse Rohdaten jeder Art.","Der Data Lake dient dem operativen Tagesgeschäft, das Warehouse der Archivierung alter Daten.","Der Data Lake speichert relationale Tabellen per ETL, das Warehouse unstrukturierte Dateien."], 0, "Warehouse: Schema beim Schreiben (Schema on Write), befüllt per ETL. Lake: Daten werden roh abgelegt, Struktur erst beim Lesen (Schema on Read).", "T16"],
  ["t2", "dbs", "Daten aus Warenwirtschaft und Webshop werden nachts bereinigt und ins Data Warehouse übernommen.\n\nWofür steht ETL?", ["Extract, Transform, Load","Extract, Transfer, Logging","Export, Transform, Link","Evaluate, Test, Launch"], 0, "Extract: aus den Quellen lesen. Transform: bereinigen, vereinheitlichen, verdichten. Load: ins Zielsystem laden.", "T16"],
  ["t2", "dbs", "Ein Altsystem speichert Daten als Baum: Jede Filiale hat Abteilungen, jede Abteilung hat Mitarbeiter, jeder Datensatz hat genau einen übergeordneten Datensatz.\n\nWelches Datenbankmodell liegt vor?", ["Hierarchisches Modell","Relationales Modell","Objektorientiertes Modell","Netzwerkmodell"], 0, "Das hierarchische Modell erlaubt genau ein Elternelement pro Datensatz. Das Netzwerkmodell erlaubt mehrere, das relationale Modell arbeitet mit Tabellen und Schlüsseln.", "T16"],
  // T04 UML
  ["t2", "diag", "Für die Dokumentation eines Webshops soll gezeigt werden, dass shop.war auf einem Tomcat-Server läuft und per JDBC auf einen MariaDB-Server zugreift.\n\nWelches UML-Diagramm verwenden Sie?", ["Verteilungsdiagramm","Aktivitätsdiagramm","Zustandsdiagramm","Anwendungsfalldiagramm"], 0, "Das Verteilungsdiagramm zeigt die physische Sicht: Knoten (Hardware, Laufzeitumgebungen), darauf Artefakte und Verbindungen mit Protokollen.", "T04"],
  ["t2", "diag", "Ein System besteht aus den Bausteinen Bestellservice, Zahlungsservice und Lagerservice, die über definierte Schnittstellen zusammenarbeiten.\n\nWelches Diagramm zeigt diese Bausteine und ihre Schnittstellen?", ["Komponentendiagramm","Sequenzdiagramm","Klassendiagramm","Verteilungsdiagramm"], 0, "Im Komponentendiagramm werden bereitgestellte Schnittstellen als Kreis (Lollipop), benötigte als Halbkreis (Socket) dargestellt.", "T04"],
  ["t2", "diag", "Die Klasse Kunde zählt mit dem Attribut anzahlKunden, wie viele Objekte erzeugt wurden. Das Attribut gehört zur Klasse, nicht zum Objekt.\n\nWie wird es im Klassendiagramm dargestellt?", ["Unterstrichen","Kursiv","Mit # davor","In eckigen Klammern"], 0, "Statische Elemente werden unterstrichen. Kursiv steht für abstrakt, # für protected.", "T04"],
  ["t2", "diag", "Die Klassen PayPalZahlung und KartenZahlung implementieren das Interface Zahlungsart.\n\nWie wird diese Realisierung im Klassendiagramm gezeichnet?", ["Gestrichelte Linie mit hohlem Dreieck","Durchgezogene Linie mit hohlem Dreieck","Durchgezogene Linie mit gefüllter Raute","Gestrichelte Linie mit offener Pfeilspitze"], 0, "Realisierung: gestrichelt mit hohlem Dreieck am Interface. Vererbung: durchgezogen mit hohlem Dreieck an der Oberklasse.", "T04"],
  ["t2", "diag", "Im Klassendiagramm steht vor einem Attribut das Zeichen ~.\n\nWelche Sichtbarkeit hat es?", ["package","private","protected","public"], 0, "+ public, - private, # protected, ~ package (nur innerhalb desselben Pakets sichtbar).", "T04"],
  ["t2", "diag", "Für einen Login-Vorgang soll dargestellt werden, in welcher zeitlichen Reihenfolge Browser, Controller und Datenbank Nachrichten austauschen.\n\nWelches UML-Diagramm eignet sich?", ["Sequenzdiagramm","Klassendiagramm","Verteilungsdiagramm","Komponentendiagramm"], 0, "Das Sequenzdiagramm zeigt Lebenslinien der beteiligten Objekte und die Nachrichten in zeitlicher Reihenfolge von oben nach unten.", "T04"],
  ["t2", "diag", "Im Klassendiagramm einer Personalverwaltung hat ein Mitarbeiter höchstens einen Dienstwagen, viele haben keinen.\n\nWelche Multiplizität steht an der Seite von Dienstwagen?", ["0..1","1..1","1..*","0..*"], 0, "0..1: Untergrenze 0 (optional), Obergrenze 1.", "T04"],
  ["t2", "diag", "Im Aktivitätsdiagramm einer Bestellung endet nach dem Fork der parallele Zweig „Newsletter anbieten“, während die Bestellung weiterläuft.\n\nWelches Element beendet nur diesen Teilfluss?", ["Ablaufende (Kreis mit X)","Endknoten (Kreis mit Punkt)","Join-Knoten (dicker Balken)","Entscheidungsknoten (Raute)"], 0, "Das Ablaufende beendet nur den einen Fluss. Der Endknoten beendet die gesamte Aktivität mit allen parallelen Flüssen.", "T04"],
  ["t2", "diag", "Im Sequenzdiagramm ruft die Kasse die Methode bezahlen() beim Zahlungsdienst auf und wartet auf das Ergebnis.\n\nWie wird dieser synchrone Aufruf gezeichnet?", ["Durchgezogene Linie mit gefüllter Pfeilspitze","Gestrichelte Linie mit offener Pfeilspitze","Durchgezogene Linie mit offener Pfeilspitze","Durchgezogene Linie mit hohlem Dreieck am Ziel"], 0, "Synchron: durchgezogen, gefüllte Spitze. Asynchron: durchgezogen, offene Spitze. Antwort: gestrichelt.", "T04"],
  // T05 Testen und Qualität
  ["t2", "diag", "Die neue Lagersoftware ist fertig entwickelt und getestet. Vor der Rechnungsstellung soll geprüft werden, ob sie den Vertrag erfüllt.\n\nWer führt den Abnahmetest typischerweise durch?", ["Der Auftraggeber bzw. die Fachabteilung","Der Entwickler der jeweiligen Klasse","Die Qualitätssicherung des Auftragnehmers","Der Projektleiter des Softwarehauses"], 0, "Der Auftraggeber prüft gegen Lastenheft bzw. Vertrag. Das Ergebnis mit eventuellen Mängeln wird im Abnahmeprotokoll festgehalten. Verwechslungsgefahr: Den Systemtest führt der Auftragnehmer (z. B. seine Qualitätssicherung) durch, die Abnahme der Auftraggeber.", "T05"],
  ["t2", "diag", "Ein Ticketsystem wird in einer produktionsnahen Testumgebung vollständig gegen die Anforderungen aus dem Pflichtenheft geprüft.\n\nWelche Teststufe ist das?", ["Systemtest","Komponententest","Integrationstest der Datenbankverbindung","Kundenzufriedenheitsbefragung"], 0, "Der Systemtest prüft das Gesamtsystem gegen die spezifizierten Anforderungen, noch beim Auftragnehmer. Danach folgt der Abnahmetest durch den Auftraggeber.", "T05"],
  ["t2", "diag", "Nach jedem nächtlichen Build prüft ein Skript in zwei Minuten, ob die Anwendung startet und die Anmeldung funktioniert. Erst dann laufen die ausführlichen Tests.\n\nWie heißt dieser Test?", ["Smoke-Test","Lasttest","Penetrationstest","Usability-Test"], 0, "Der Smoke-Test ist ein schneller Grundcheck, ob ein Build überhaupt lauffähig ist. Schlägt er fehl, lohnen sich weitere Tests nicht.", "T05"],
  ["t2", "diag", "Ein Unternehmen führt einen kontinuierlichen Verbesserungsprozess nach dem Deming-Zyklus ein.\n\nWofür steht PDCA?", ["Plan, Do, Check, Act","Prepare, Develop, Control, Approve","Plan, Deploy, Code, Analyse","Process, Data, Control, Audit"], 0, "Plan: Maßnahme planen. Do: im Kleinen umsetzen. Check: Wirkung prüfen. Act: als Standard übernehmen oder anpassen – dann beginnt der Zyklus neu.", "T05"],
  ["t2", "diag", "Ein Team will Fehler finden, ohne den Code auszuführen.\n\nWelche Maßnahme gehört zur statischen Qualitätssicherung?", ["Code-Review","Unit-Test","Lasttest","Abnahmetest"], 0, "Statisch heißt: ohne Ausführung (Review, Walkthrough, Inspektion, statische Codeanalyse). Alle Testarten führen den Code aus und sind dynamisch.", "T05"],
  ["t2", "diag", "Vor dem Testbeginn eines Projekts soll ein Testkonzept erstellt werden.\n\nWas gehört hinein?", ["Testobjekte, Testdaten, Testumgebung, Verantwortliche und Endekriterien","Testprotokolle, Testberichte, gefundene Fehler, Korrekturen und Abnahmeprotokoll","Quellcode, Klassendiagramme, Datenbankschema, Deploymentskripte und Handbuch","Projektbudget, Stundensätze, Gehälter der Tester, Vertragsstrafen und Zahlungsplan"], 0, "Das Testkonzept plant, was, wie, womit, durch wen und bis wann getestet wird – und wann der Test als abgeschlossen gilt.", "T05"],
  ["t2", "diag", "Ein Tester kennt die Datenbankstruktur einer Webanwendung, testet aber ausschließlich über die REST-Schnittstelle.\n\nWelche Testmethode wendet er an?", ["Grey-Box-Test","Test ohne Testfälle","Reiner Oberflächentest","Code-Review"], 0, "Grey-Box ist eine Mischform: Teilwissen über die interne Struktur hilft beim Entwurf der Testfälle, getestet wird aber über die Schnittstellen.", "T05"],
  ["t2", "diag", "Ein Projekt folgt dem V-Modell. Jeder Entwicklungsphase steht eine Teststufe gegenüber.\n\nWelche Teststufe steht der Anforderungsdefinition gegenüber?", ["Abnahmetest","Modultest","Integrationstest","Smoke-Test"], 0, "Anforderungen ↔ Abnahmetest, Systementwurf ↔ Systemtest, Architektur ↔ Integrationstest, Modulentwurf ↔ Modultest.", "T05"],
  ["t2", "diag", "Ein Team trifft sich nach jedem Sprint, um seine Zusammenarbeit in kleinen Schritten zu verbessern.\n\nWas beschreibt der kontinuierliche Verbesserungsprozess (KVP)?", ["Prozesse und Produkte werden fortlaufend in kleinen Schritten verbessert.","Prozesse werden einmalig am Projektende in einem umfassenden Audit überprüft.","Prozesse und Produkte werden in einem großen Schritt grundlegend neu gestaltet.","Die Qualität wird durch eine abschließende Endkontrolle aller Produkte gesichert."], 0, "KVP setzt auf viele kleine, stetige Verbesserungen (PDCA). In Scrum entspricht die Retrospektive diesem Gedanken.", "T05"],
  // T06 Vorgehensmodelle
  ["t1", "pm", "Ein Projekt soll so geplant werden, dass zu jeder Entwurfsphase gleich festgelegt wird, mit welcher Teststufe ihr Ergebnis geprüft wird.\n\nWelches Vorgehensmodell stellt jeder Entwicklungsphase eine passende Teststufe gegenüber?", ["V-Modell","Wasserfallmodell","Kanban","Spiralmodell"], 0, "Im V-Modell steht links der Entwurf (Anforderungen bis Modulentwurf), rechts die passende Prüfung (Modultest bis Abnahmetest).", "T06"],
  ["t1", "pm", "Ein Raumfahrtzulieferer entwickelt eine Steuerungssoftware mit vielen technischen Unsicherheiten. Jede Runde beginnt mit der Frage, was am riskantesten ist.\n\nWas steht im Spiralmodell in jeder Runde im Mittelpunkt?", ["Die Risikoanalyse","Die Kostenabrechnung","Das Daily Scrum","Die Hardwarebeschaffung"], 0, "Das Spiralmodell ist iterativ und risikogetrieben: Ziele festlegen, Risiken analysieren (oft mit Prototyp), entwickeln und testen, nächste Runde planen.", "T06"],
  ["t1", "pm", "Auf dem Kanban-Board eines Support-Teams stauen sich in der Spalte „Test“ 15 Tickets. Das Team führt ein WIP-Limit von 4 ein.\n\nWas begrenzt das WIP-Limit?", ["Die Anzahl gleichzeitig bearbeiteter Aufgaben in einer Spalte","Die Anzahl der Aufgaben, die ein Sprint insgesamt enthalten darf","Die maximale Bearbeitungszeit eines einzelnen Tickets in einer Spalte","Die Anzahl der Teammitglieder, die gleichzeitig an einer Spalte arbeiten"], 0, "Work in Progress wird begrenzt: Neue Aufgaben werden erst gezogen, wenn Platz ist (Pull-Prinzip). So werden Engpässe sichtbar und der Fluss gleichmäßiger.", "T06"],
  ["t1", "pm", "Ein Team arbeitet nach Extreme Programming (XP).\n\nWelche Praxis gehört typisch dazu?", ["Pair Programming","Ein unveränderliches Lastenheft vor Projektstart","Releases nur einmal pro Jahr","Verzicht auf automatisierte Tests"], 0, "XP setzt auf Pair Programming, testgetriebene Entwicklung, kontinuierliche Integration, kurze Releases und enge Kundeneinbindung.", "T06"],
  ["t1", "pm", "Ein IT-Dienstleister bewirbt sich auf ein Entwicklungsprojekt einer Bundesbehörde, in dem das V-Modell XT vorgeschrieben ist.\n\nFür wen wurde das V-Modell XT als Standard entwickelt?", ["Für IT-Projekte der öffentlichen Verwaltung (Bund) in Deutschland","Für agile Softwareprojekte von Start-ups im deutschsprachigen Raum","Für Projekte der Automobilindustrie nach Automotive SPICE","Für IT-Projekte der Europäischen Union nach EU-Vergaberecht"], 0, "Das V-Modell XT ist der Standard für IT-Entwicklungsprojekte des Bundes. „XT“ steht für extreme tailoring – es wird an das Projekt angepasst.", "T06"],
  ["t1", "pm", "Ein Handwerksbetrieb braucht in vier Wochen eine Buchhaltungslösung für ganz normale Standardprozesse.\n\nWas spricht für Fremdbezug (Buy)?", ["Schnelle Verfügbarkeit einer erprobten Lösung","Volle Kontrolle über Quellcode und Weiterentwicklung","Exakte Abbildung aller betrieblichen Sonderprozesse","Unabhängigkeit vom Hersteller und dessen Updates"], 0, "Standardsoftware deckt Standardprozesse meist gut ab, ist sofort verfügbar und erprobt. Nachteile: Abhängigkeit vom Anbieter und Grenzen bei Anpassungen.", "T06"],
  ["t1", "pm", "Ein Logistikunternehmen überlegt, seine sehr speziellen Tourenplanungsprozesse mit einer Eigenentwicklung abzubilden.\n\nWas ist ein Nachteil der Eigenentwicklung (Make)?", ["Hoher Zeit- und Personalaufwand","Abhängigkeit vom externen Hersteller","Geringe Anpassbarkeit an Prozesse","Laufende Lizenzkosten pro Nutzer"], 0, "Eigenentwicklung kostet Zeit, Personal und Know-how, und die Wartung bleibt im Haus. Dafür passt das Ergebnis genau und bleibt unter eigener Kontrolle.", "T06"],
  ["t1", "pm", "Ein Projekt durchläuft die Phasen Analyse, Entwurf, Umsetzung, Test und Einführung nach dem Wasserfallmodell.\n\nWelche Aussage über das Wasserfallmodell stimmt?", ["Eine Phase beginnt erst, wenn die vorherige abgeschlossen ist.","Jede Phase wird in festen Iterationen mehrfach durchlaufen.","Anforderungen werden während der Umsetzung laufend neu priorisiert.","Umsetzung und Test laufen parallel in derselben Phase ab."], 0, "Die Phasen laufen streng nacheinander, jede endet mit einem Dokument bzw. einer Freigabe. Gut planbar, aber Änderungen in späten Phasen sind teuer.", "T06"],
  // T07 Sicherheit und Datenschutz
  ["t1", "sec", "Eine Schadsoftware infiziert einen Rechner und verbreitet sich danach ohne Zutun der Nutzer über das Firmennetz auf weitere Rechner.\n\nUm welche Art handelt es sich?", ["Wurm","Virus","Trojaner","Adware"], 0, "Ein Wurm verbreitet sich selbstständig über Netzwerke. Ein Virus braucht eine Wirtsdatei, die ausgeführt wird; ein Trojaner tarnt sich als nützliches Programm.", "T07"],
  ["t1", "sec", "Morgens sind alle Dateien auf dem Fileserver eines Steuerbüros verschlüsselt. Eine Nachricht fordert 2 Bitcoin für den Schlüssel.\n\nWie heißt diese Schadsoftware?", ["Ransomware","Cryptojacking","Scareware","Keylogger"], 0, "Ransomware verschlüsselt Daten und erpresst Lösegeld. Wichtigster Schutz: getrennte, offline gelagerte Backups, dazu aktuelle Systeme und geschulte Mitarbeitende.", "T07"],
  ["t1", "sec", "Eine Mitarbeiterin erhält einen Anruf: Der „IT-Support“ brauche dringend ihr Passwort, um ein Problem zu beheben.\n\nWelche Angriffsart liegt vor?", ["Social Engineering","Brute-Force-Angriff","Man-in-the-Middle","Credential Stuffing"], 0, "Social Engineering nutzt Vertrauen, Hilfsbereitschaft oder Zeitdruck aus. Echter IT-Support fragt nie nach Passwörtern – Awareness-Schulungen helfen.", "T07"],
  ["t1", "sec", "In der Benutzertabelle eines Portals haben zwei Nutzer das gleiche Passwort, aber unterschiedliche Hashwerte.\n\nWozu dient der Salt beim Speichern von Passwörtern?", ["Gleiche Passwörter ergeben unterschiedliche Hashes, vorberechnete Tabellen werden nutzlos.","Das Passwort wird damit verschlüsselt und kann bei Bedarf wieder entschlüsselt werden.","Der Salt ist ein geheimer Systemschlüssel, der für alle Nutzer gleich bleibt und getrennt liegt.","Das Passwort wird mehrfach gehasht, damit Brute-Force-Angriffe deutlich länger dauern."], 0, "Der Salt ist ein zufälliger Wert pro Benutzer, der vor dem Hashen angehängt und mit dem Hash gespeichert wird. Rainbow Tables passen dann nicht mehr. Verwechslungsgefahr: Ein geheimer, für alle gleicher Zusatzwert heißt Pepper; mehrfaches Hashen ist Key Stretching.", "T07"],
  ["t1", "sec", "Ein Entwickler wählt ein Verfahren, um Passwörter in einer neuen Webanwendung zu speichern.\n\nWelches Verfahren eignet sich?", ["bcrypt oder Argon2","MD5 oder SHA-1","Base64 oder ROT13","AES-256 oder RSA-4096"], 0, "bcrypt und Argon2 sind absichtlich langsam und arbeiten mit Salt – Brute Force wird teuer. MD5 und SHA-1 sind zu schnell und gebrochen, Base64 und ROT13 sind nur Kodierungen, AES und RSA sind umkehrbare Verschlüsselungen.", "T07"],
  ["t1", "sec", "Ein Lieferant bestellt per signierter E-Mail Waren und behauptet später, die Bestellung nie abgeschickt zu haben.\n\nWelches Schutzziel stellt sicher, dass ein Absender das Versenden nicht leugnen kann?", ["Nichtabstreitbarkeit (Verbindlichkeit)","Integrität (Unversehrtheit der Daten)","Vertraulichkeit (Schutz vor Mitlesen)","Verfügbarkeit (Erreichbarkeit des Dienstes)"], 0, "Nichtabstreitbarkeit wird z. B. durch eine digitale Signatur erreicht: Nur der Inhaber des privaten Schlüssels kann sie erzeugt haben.", "T07"],
  ["t1", "sec", "Die Buchhaltung erhält eine digital signierte Rechnung und will die Signatur prüfen.\n\nMit welchem Schlüssel wird die Signatur geprüft?", ["Mit dem öffentlichen Schlüssel des Absenders","Mit dem privaten Schlüssel des Absenders","Mit dem öffentlichen Schlüssel des Empfängers","Mit einem gemeinsamen Sitzungsschlüssel"], 0, "Signiert wird mit dem privaten, geprüft mit dem öffentlichen Schlüssel des Absenders. Stimmt der entschlüsselte Hash mit dem selbst berechneten überein, ist das Dokument echt und unverändert.", "T07"],
  ["t1", "sec", "Für die Anmeldung zu einem Newsletter fragt ein Online-Shop Name, Geburtsdatum, Adresse und Telefonnummer ab, obwohl nur die E-Mail-Adresse nötig wäre.\n\nWelcher DSGVO-Grundsatz ist verletzt?", ["Datenminimierung","Zweckbindung","Speicherbegrenzung","Rechenschaftspflicht"], 0, "Datenminimierung (Art. 5 DSGVO): Es dürfen nur so viele personenbezogene Daten erhoben werden, wie für den Zweck nötig sind.", "T07"],
  ["t1", "sec", "Ein Mitarbeiter verliert einen unverschlüsselten Laptop mit Kundendaten. Das Unternehmen erfährt am Montagmorgen davon.\n\nInnerhalb welcher Frist ist die Datenpanne in der Regel der Aufsichtsbehörde zu melden?", ["72 Stunden","24 Stunden","14 Tage","4 Wochen"], 0, "Art. 33 DSGVO: möglichst binnen 72 Stunden nach Bekanntwerden, sofern ein Risiko für die Betroffenen besteht. Eine Verspätung muss begründet werden.", "T07"],
  ["t1", "sec", "Eine Kundin wechselt ihren Stromanbieter und möchte ihre Verbrauchsdaten in einem gängigen, maschinenlesbaren Format mitnehmen.\n\nWelches Recht macht sie geltend?", ["Recht auf Datenübertragbarkeit","Recht auf Berichtigung","Widerspruchsrecht","Recht auf Einschränkung der Verarbeitung"], 0, "Art. 20 DSGVO: Recht auf Datenübertragbarkeit in einem strukturierten, gängigen und maschinenlesbaren Format.", "T07"],
  ["t1", "sec", "Ein Online-Shop lässt seine Kundendatenbank bei einem externen Hosting-Anbieter betreiben.\n\nWas regelt der Auftragsverarbeitungsvertrag (AVV)?", ["Die Verarbeitung personenbezogener Daten durch einen Dienstleister im Auftrag","Die Verfügbarkeit des Servers und die Haftung des Hosting-Anbieters bei Ausfällen","Die vollständige Übertragung der datenschutzrechtlichen Verantwortung auf den Dienstleister","Die Nutzungsrechte an der Software und am Quellcode des Hosting-Anbieters"], 0, "Der AVV (Art. 28 DSGVO) legt fest, dass der Dienstleister die Daten nur weisungsgebunden verarbeitet und welche Schutzmaßnahmen er trifft. Verantwortlich bleibt der Auftraggeber.", "T07"],
