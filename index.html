    ["Ein Kinoportal gewährt Kindern von 6 bis einschließlich 14 Jahren einen Rabatt. Eingaben unter 0 und über 120 sind ungültig.\n\nBilden Sie Äquivalenzklassen und geben Sie Testwerte nach der Grenzwertanalyse an. (5 P)", "Äquivalenzklassen:\nungültig: alter < 0 | gültig ohne Rabatt: 0–5 | gültig mit Rabatt: 6–14 | gültig ohne Rabatt: 15–120 | ungültig: alter > 120\nGrenzwerte: -1, 0, 5, 6, 14, 15, 120, 121", "3 P Äquivalenzklassen (gültige und ungültige), 2 P Grenzwerte jeweils an und neben der Grenze."],
    ["Eine neue Lagerverwaltung durchläuft vor der Einführung mehrere Teststufen.\n\nNennen Sie die vier Teststufen in der richtigen Reihenfolge und beschreiben Sie, was jeweils geprüft wird. (4 P)", "Komponententest (Unit-Test): einzelne Klassen bzw. Methoden isoliert\nIntegrationstest: Zusammenspiel und Schnittstellen der Komponenten\nSystemtest: Gesamtsystem gegen die Anforderungen in einer Testumgebung\nAbnahmetest: durch den Auftraggeber gegen den Vertrag", "Je 1 P pro Stufe mit Beschreibung in richtiger Reihenfolge."],
    ["Nach einer Fehlerkorrektur in der Preisberechnung eines Shops funktioniert plötzlich der Warenkorb nicht mehr.\n\nErklären Sie den Regressionstest und warum man ihn automatisiert. (3 P)", "Regressionstest: Nach jeder Änderung werden die vorhandenen Testfälle erneut ausgeführt, um sicherzustellen, dass bestehende Funktionen weiter funktionieren.\nAutomatisierung: Er wird sehr oft wiederholt; automatisiert (z. B. in einer CI-Pipeline) ist er schnell, günstig und zuverlässig.", "2 P Erklärung, 1 P Begründung für Automatisierung."],
    ["Ihr Team führt Unit-Tests für eine Zinsberechnung ein. Die Tests sollen den FIRST-Prinzipien folgen.\n\nNennen und erklären Sie die fünf FIRST-Prinzipien. (5 P)", "Fast: Tests laufen schnell.\nIndependent: Tests hängen nicht voneinander ab.\nRepeatable: Gleiches Ergebnis bei jedem Lauf, in jeder Umgebung.\nSelf-Validating: Der Test meldet selbst bestanden oder fehlgeschlagen.\nTimely: Tests werden zeitnah zum Code geschrieben (bei TDD vorher).", "Je 1 P pro Prinzip mit Erklärung."],
    ["Für die Anmeldefunktion eines Kundenportals soll ein Testfall dokumentiert werden.\n\nNennen Sie die Bestandteile eines Testfalls und füllen Sie sie für „Anmeldung mit falschem Passwort“ aus. (5 P)", "Vorbedingung: Benutzer max@example.de existiert\nEingabedaten: E-Mail max@example.de, Passwort „falsch123“\nErwartetes Ergebnis: Meldung „Anmeldung fehlgeschlagen“, keine Anmeldung\nTatsächliches Ergebnis: (beim Test eintragen)\nBewertung: bestanden / nicht bestanden", "Je 1 P pro Bestandteil mit sinnvollem Beispiel."],
    ["Für die Einführung eines Ticketsystems erstellen Sie ein Testkonzept.\n\nNennen Sie sechs Inhalte eines Testkonzepts. (6 P)", "Testziele und Testobjekte\nTeststufen und Testmethoden\nTestumgebung\nTestdaten\nVerantwortliche und Zeitplan\nEnde- bzw. Abbruchkriterien\nDokumentation der Ergebnisse", "Je 1 P pro Inhalt (maximal 6)."],
    ["Ein Kunde möchte die Qualität einer angebotenen Software anhand der Norm ISO/IEC 25010 bewerten.\n\nNennen Sie sechs Qualitätsmerkmale der Norm. (6 P)", "Funktionale Eignung\nLeistungseffizienz\nKompatibilität\nBenutzbarkeit (Interaktionskapazität)\nZuverlässigkeit\nSicherheit\nWartbarkeit\nÜbertragbarkeit (Flexibilität)", "Je 1 P pro Merkmal (maximal 6)."],
    ["Eine Klinik-Software muss rund um die Uhr laufen und darf bei Fehlern keine Daten verlieren.\n\nErklären Sie das Qualitätsmerkmal Zuverlässigkeit und nennen Sie drei Teilmerkmale. (4 P)", "Zuverlässigkeit: Die Software erbringt ihre Funktionen unter festgelegten Bedingungen über einen festgelegten Zeitraum.\nTeilmerkmale: Reife (selten Fehler), Verfügbarkeit, Fehlertoleranz (arbeitet trotz Fehlern weiter), Wiederherstellbarkeit (Daten und Betrieb nach einem Ausfall).", "1 P Definition, je 1 P pro Teilmerkmal."],
    ["In einem Entwicklungsteam fallen viele Fehler erst beim Kunden auf.\n\nNennen Sie fünf qualitätssichernde Maßnahmen für die Entwicklung. (5 P)", "Code-Reviews\nPair Programming\nAutomatisierte Tests in einer CI/CD-Pipeline\nCoding-Standards und statische Codeanalyse\nStandardisiertes Vorgehensmodell und Dokumentation", "Je 1 P pro Maßnahme."]
  ],
  sec: [
    ["Ein Krankenhaus speichert Patientenakten in einem Informationssystem.\n\nNennen und erläutern Sie die drei Schutzziele der IT-Sicherheit an diesem Beispiel. (6 P)", "Vertraulichkeit: Nur berechtigtes Personal kann Patientenakten lesen.\nIntegrität: Diagnosen und Medikationen sind vollständig und unverändert.\nVerfügbarkeit: Die Akten sind jederzeit abrufbar, auch nachts in der Notaufnahme.", "Je 1 P pro Schutzziel, je 1 P pro Bezug zum Beispiel.\nErgänzende Schutzziele: Authentizität und Nichtabstreitbarkeit."],
    ["Zwei Filialen eines Unternehmens sollen ihre Daten mit AES verschlüsselt austauschen.\n\nBeschreiben Sie das Prinzip der symmetrischen Verschlüsselung und nennen Sie je einen Vor- und Nachteil. (4 P)", "Ein gemeinsamer geheimer Schlüssel wird zum Ver- und Entschlüsseln verwendet (z. B. AES).\nVorteil: sehr schnell, auch für große Datenmengen.\nNachteil: Der Schlüssel muss vorher sicher ausgetauscht werden; bei vielen Partnern werden sehr viele Schlüssel benötigt.", "2 P Prinzip, je 1 P Vor- und Nachteil."],
    ["Ein Kunde möchte seinem Steuerberater vertrauliche Unterlagen schicken, ohne vorher einen Schlüssel auszutauschen.\n\nBeschreiben Sie das Prinzip der asymmetrischen Verschlüsselung an diesem Beispiel und nennen Sie einen Nachteil. (4 P)", "Jeder hat ein Schlüsselpaar aus öffentlichem und privatem Schlüssel (z. B. RSA).\nDer Kunde verschlüsselt mit dem öffentlichen Schlüssel des Steuerberaters; nur dieser kann mit seinem privaten Schlüssel entschlüsseln.\nNachteil: deutlich langsamer als symmetrische Verfahren.", "1 P Schlüsselpaar, 2 P richtige Schlüsselverwendung, 1 P Nachteil."],
    ["Ein Kunde ruft die Website seiner Bank per HTTPS auf.\n\nErläutern Sie, wie TLS hybride Verschlüsselung einsetzt, und begründen Sie das Vorgehen. (4 P)", "Der Server schickt sein Zertifikat; der Browser prüft es.\nAsymmetrisch (z. B. per Diffie-Hellman bzw. ECDHE) wird ein gemeinsamer Sitzungsschlüssel ausgehandelt.\nDie Nutzdaten werden dann symmetrisch (z. B. AES) verschlüsselt.\nBegründung: sicherer Schlüsselaustausch ohne vorheriges Treffen (asymmetrisch) plus schnelle Verschlüsselung der Daten (symmetrisch).", "1 P Zertifikat, 1 P asymmetrischer Austausch, 1 P symmetrische Daten, 1 P Begründung."],
    ["Die Personalabteilung verschickt Arbeitsverträge als PDF und möchte, dass Empfänger Herkunft und Unverändertheit prüfen können.\n\nBeschreiben Sie Erstellung und Prüfung einer digitalen Signatur. (5 P)", "Erstellung: Vom Dokument wird ein Hashwert gebildet und mit dem privaten Schlüssel des Absenders verschlüsselt; das ist die Signatur.\nPrüfung: Der Empfänger entschlüsselt die Signatur mit dem öffentlichen Schlüssel des Absenders und vergleicht den Hash mit einem selbst berechneten Hash des Dokuments.\nStimmen beide überein, sind Integrität und Authentizität nachgewiesen.", "2 P Erstellung, 2 P Prüfung, 1 P erreichte Schutzziele."],
    ["Ein Softwarehersteller veröffentlicht neben seinem Installationspaket einen SHA-256-Prüfwert.\n\nErklären Sie die Eigenschaften einer Hashfunktion und den Zweck des Prüfwerts. (4 P)", "Eigenschaften: Einwegfunktion (nicht umkehrbar), Ergebnis fester Länge, kleinste Änderung der Eingabe ergibt einen völlig anderen Hash, Kollisionen praktisch nicht auffindbar.\nZweck: Der Nutzer berechnet den Hash der heruntergeladenen Datei und vergleicht ihn – so erkennt er Übertragungsfehler oder Manipulation (Integrität).", "Je 1 P pro Eigenschaft (max. 3), 1 P Zweck."],
    ["Ein Online-Portal speichert Passwörter derzeit unverschlüsselt in der Datenbank.\n\nBeschreiben Sie, wie Passwörter sicher gespeichert und bei der Anmeldung geprüft werden. (4 P)", "Speichern: Für jeden Benutzer einen zufälligen Salt erzeugen, Passwort + Salt mit einer langsamen Hashfunktion (bcrypt, Argon2) hashen, Hash und Salt speichern – nie das Passwort.\nPrüfen: Eingegebenes Passwort mit dem gespeicherten Salt erneut hashen und mit dem gespeicherten Hash vergleichen.", "1 P kein Klartext, 1 P Salt, 1 P langsame Hashfunktion, 1 P Prüfung durch Vergleich."],
    ["Beim Aufruf eines Webshops prüft der Browser das TLS-Zertifikat.\n\nErklären Sie, was ein Zertifikat enthält und welche Rolle die Zertifizierungsstelle (CA) spielt. (4 P)", "Zertifikat: enthält den öffentlichen Schlüssel, die Identität (z. B. Domain shop.example.de), Gültigkeitszeitraum, Aussteller und die Signatur der CA.\nCA: bestätigt mit ihrer Signatur, dass der öffentliche Schlüssel zur Identität gehört. Der Browser vertraut den Stammzertifikaten bekannter CAs und prüft die Zertifikatskette.", "2 P Inhalte, 2 P Rolle der CA."],
    ["Ein Unternehmen will den Zugang zum VPN absichern und Zwei-Faktor-Authentifizierung einführen.\n\nNennen Sie die drei Faktorkategorien mit je einem Beispiel und erklären Sie, wann echte 2FA vorliegt. (4 P)", "Wissen: Passwort, PIN\nBesitz: Smartphone mit Authenticator-App, Hardware-Token, Chipkarte\nInhärenz (Biometrie): Fingerabdruck, Gesichtserkennung\nEchte 2FA liegt vor, wenn zwei Faktoren aus verschiedenen Kategorien kombiniert werden (z. B. Passwort + App-Code).", "Je 1 P pro Kategorie mit Beispiel, 1 P Bedingung."],
    ["Eine Hochschule führt Single Sign-On für Lernplattform, Mail und Bibliothek ein.\n\nNennen Sie je zwei Vor- und Nachteile von SSO. (4 P)", "Vorteile: nur ein Login für alle Dienste (Komfort, weniger Passwort-Wiederverwendung); zentrale Verwaltung und schnelles Sperren von Zugängen.\nNachteile: ein gestohlener Zugang öffnet alle Dienste; Abhängigkeit vom Identity Provider (fällt er aus, ist kein Dienst erreichbar).", "Je 1 P pro Vor- und Nachteil. Gegenmaßnahme: SSO mit MFA kombinieren."],
    ["Eine Fitness-App möchte auf die Schrittdaten eines Nutzers bei einem anderen Anbieter zugreifen, ohne dessen Passwort zu erfahren.\n\nBeschreiben Sie den Ablauf mit OAuth 2.0. (4 P)", "Die App (Client) leitet den Nutzer zum Authorization Server des Anbieters weiter.\nDer Nutzer meldet sich dort an und stimmt dem Zugriff (Scope, z. B. „Schrittdaten lesen“) zu.\nDie App erhält ein Access Token.\nMit dem Token ruft sie die Daten beim Resource Server ab – das Passwort erfährt sie nie.", "Je 1 P pro Schritt. OAuth 2.0 regelt die Autorisierung; für die Anmeldung selbst wird oft OpenID Connect ergänzt."],
    ["Ein ehemaliger Kunde eines Online-Shops möchte wissen, welche Daten über ihn gespeichert sind, falsche Angaben korrigieren und am Ende alles löschen lassen.\n\nNennen Sie sechs Rechte der Betroffenen nach DSGVO. (6 P)", "Auskunft (Art. 15)\nBerichtigung (Art. 16)\nLöschung, „Recht auf Vergessenwerden“ (Art. 17)\nEinschränkung der Verarbeitung (Art. 18)\nDatenübertragbarkeit (Art. 20)\nWiderspruch (Art. 21)", "Je 1 P pro Recht. Artikelnummern sind nicht verlangt, helfen aber beim Merken."],
    ["Eine Mitarbeiterin erhält eine E-Mail: „Ihr Konto wird in 2 Stunden gesperrt – jetzt hier anmelden!“ mit Link auf login-microsoft-support.info.\n\nNennen Sie fünf Merkmale, an denen man Phishing erkennt. (5 P)", "Zeitdruck bzw. Drohung („in 2 Stunden gesperrt“)\nFalsche oder ähnlich klingende Absender- bzw. Link-Domain\nAufforderung zur Eingabe von Zugangsdaten\nUnpersönliche Anrede, Rechtschreibfehler\nUnerwartete Anhänge, z. B. Office-Dateien mit Makros", "Je 1 P pro Merkmal. Richtig reagieren: nicht klicken, Absender über bekannten Weg prüfen, an die IT melden."]
  ],
  pm: [
    ["Ein Pflegedienst führt eine App zur Tourenplanung ein. Betroffen sind Pflegekräfte, Geschäftsführung, Patienten und der Betriebsrat.\n\nErstellen Sie eine Stakeholderanalyse für zwei Stakeholder mit Erwartung, Befürchtung und Maßnahme. (8 P)", "Pflegekräfte – Erwartung: weniger Papier, bessere Planung – Befürchtung: Überwachung, Überforderung – Maßnahme: frühe Einbindung, Schulung, Betriebsvereinbarung.\nGeschäftsführung – Erwartung: effizientere Touren, geringere Kosten – Befürchtung: Kosten- und Terminüberschreitung – Maßnahme: Kostencontrolling, Meilensteine.\n(Weitere: Betriebsrat – faire Arbeitszeiten / Leistungskontrolle / Betriebsvereinbarung; Patienten – verlässliche Zeiten / Datenschutz / transparente Information.)", "Je Stakeholder 4 P: Erwartung, Befürchtung, Maßnahme und Bezug zur Situation.\nIn der Prüfung immer als Tabelle darstellen."],
    ["Für die Software einer Behörde mit gesetzlich festen Anforderungen wird das Wasserfallmodell gewählt.\n\nBeschreiben Sie das Wasserfallmodell und nennen Sie je einen Vor- und Nachteil. (4 P)", "Lineare Phasen nacheinander: Analyse, Entwurf, Umsetzung, Test, Einführung. Jede Phase endet mit einem Ergebnisdokument; die Anforderungen stehen vorab im Lastenheft fest.\nVorteil: gut planbar, klare Meilensteine und Dokumentation.\nNachteil: unflexibel – Änderungen in späten Phasen sind teuer, lauffähige Software gibt es erst spät.", "2 P Beschreibung, je 1 P Vor- und Nachteil."],
    ["Ein Start-up entwickelt eine App, deren Anforderungen sich durch Nutzerfeedback ständig ändern.\n\nBeschreiben Sie drei Merkmale agiler Vorgehensweisen und begründen Sie, warum sie hier passen. (4 P)", "Iterativ in kurzen Zyklen (z. B. Sprints von zwei Wochen)\nAnforderungen werden laufend angepasst und neu priorisiert\nEnge Einbindung des Kunden, früh lauffähige Teilergebnisse\nBegründung: Nutzerfeedback kann nach jeder Iteration einfließen, Fehlentwicklungen fallen früh auf.", "Je 1 P pro Merkmal, 1 P Begründung."],
    ["Ein Unternehmen stellt ein Scrum-Team für die Entwicklung eines Kundenportals zusammen.\n\nNennen Sie die drei Scrum-Rollen und beschreiben Sie ihre Aufgaben. (6 P)", "Product Owner: verantwortet den Produktwert, pflegt und priorisiert das Product Backlog, Ansprechpartner für Stakeholder.\nScrum Master: sorgt für die Einhaltung von Scrum, beseitigt Hindernisse, coacht das Team.\nDevelopers: setzen die Backlog-Einträge im Sprint um und liefern ein fertiges Increment; organisieren sich selbst.", "Je 1 P Rolle, je 1 P Aufgabe."],
    ["Ein neues Teammitglied soll den Ablauf eines Scrum-Sprints verstehen.\n\nNennen Sie die Scrum-Events in zeitlicher Reihenfolge sowie die drei Artefakte. (6 P)", "Events: Sprint (1–4 Wochen) mit Sprint Planning → Daily Scrum (täglich, max. 15 Min.) → Sprint Review (Ergebnis zeigen) → Sprint Retrospektive (Zusammenarbeit verbessern)\nArtefakte: Product Backlog, Sprint Backlog, Increment", "Je 0,5 P pro Event, je 1 P pro Artefakt, 1 P richtige Reihenfolge."],
    ["Für eine Bibliotheks-App soll die Anforderung „Verlängern von Ausleihen“ als User Story formuliert werden.\n\nFormulieren Sie die User Story und nennen Sie die INVEST-Kriterien. (4 P)", "Als Leser möchte ich meine Ausleihen online verlängern, damit ich keine Mahngebühren zahle.\nINVEST: Independent (unabhängig), Negotiable (verhandelbar), Valuable (wertvoll), Estimable (schätzbar), Small (klein), Testable (testbar)", "2 P User Story (Rolle, Funktion, Nutzen), 2 P INVEST."],
    ["Ein Autohaus beauftragt einen IT-Dienstleister mit einer Werkstattplanung.\n\nUnterscheiden Sie Lastenheft und Pflichtenheft nach Ersteller und Inhalt. (4 P)", "Lastenheft: erstellt vom Auftraggeber (Autohaus); beschreibt, was gefordert ist – Anforderungen aus Sicht des Kunden.\nPflichtenheft: erstellt vom Auftragnehmer (IT-Dienstleister); beschreibt, wie die Anforderungen umgesetzt werden – technische Lösung, Grundlage für die Abnahme.", "Je 1 P Ersteller, je 1 P Inhalt."],
    ["Für eine Terminbuchungs-App einer Arztpraxis werden Anforderungen erhoben.\n\nUnterscheiden Sie funktionale und nichtfunktionale Anforderungen und nennen Sie je zwei Beispiele. (4 P)", "Funktional – was das System tut: Patienten buchen Termine; die Praxis sieht eine Tagesübersicht.\nNichtfunktional – wie gut es das tut: Seite lädt in unter 2 Sekunden; Verfügbarkeit 99,5 %; Daten verschlüsselt (DSGVO); barrierefreie Bedienung.", "Je 1 P Definition, je 1 P für die Beispiele."],
    ["Ein Großhändler führt eine neue Warenwirtschaft ein.\n\nErstellen Sie eine Risikoanalyse für zwei Risiken mit Ursache, Auswirkung und Gegenmaßnahme. (8 P)", "Fehlerhafte Datenmigration – Ursache: uneinheitliche Altdaten – Auswirkung: falsche Bestände – Gegenmaßnahme: Datenbereinigung, Testmigration.\nTerminverzug – Ursache: Aufwand unterschätzt – Auswirkung: Mehrkosten, späterer Start – Gegenmaßnahme: Puffer, Meilensteine, agile Planung.\n(Weitere: Akzeptanzprobleme – fehlende Einbindung – Software wird nicht genutzt – Schulung, Key-User.)", "Je Risiko 4 P: Risiko, Ursache, Auswirkung, Gegenmaßnahme. Tabelle verwenden."],
    ["Ein Projekt hat die Vorgänge A (3 Tage, Start), B (5 Tage, nach A), C (2 Tage, nach A) und D (4 Tage, nach B und C).\n\nBerechnen Sie FAZ, FEZ, SAZ und SEZ aller Vorgänge. (6 P)", "Vorwärtsrechnung (FEZ = FAZ + Dauer, FAZ = größter FEZ der Vorgänger):\nA: FAZ 0, FEZ 3 | B: FAZ 3, FEZ 8 | C: FAZ 3, FEZ 5 | D: FAZ 8, FEZ 12\nRückwärtsrechnung (SAZ = SEZ − Dauer, SEZ = kleinster SAZ der Nachfolger):\nD: SEZ 12, SAZ 8 | B: SEZ 8, SAZ 3 | C: SEZ 8, SAZ 6 | A: SEZ 3, SAZ 0", "3 P Vorwärtsrechnung, 3 P Rückwärtsrechnung.\nHäufiger Fehler: Bei mehreren Vorgängern den größten FEZ, bei mehreren Nachfolgern den kleinsten SAZ nehmen."],
    ["Im Netzplan mit A (3 Tage), B (5 Tage, nach A), C (2 Tage, nach A) und D (4 Tage, nach B und C) gilt für C: FAZ 3, FEZ 5, SAZ 6. D hat FAZ 8.\n\nBerechnen Sie Gesamtpuffer und freien Puffer von C und erklären Sie beide Begriffe. (4 P)", "Gesamtpuffer GP = SAZ − FAZ = 6 − 3 = 3 Tage: So weit kann C verschoben werden, ohne das Projektende zu verschieben.\nFreier Puffer FP = kleinster FAZ der Nachfolger − FEZ = 8 − 5 = 3 Tage: So weit kann C verschoben werden, ohne einen Nachfolger zu verschieben.", "Je 1 P Rechnung, je 1 P Erklärung."],
    ["Im Netzplan mit A (3 Tage), B (5 Tage, nach A), C (2 Tage, nach A) und D (4 Tage, nach B und C) soll die Projektleitung wissen, worauf sie achten muss.\n\nBestimmen Sie den kritischen Pfad und die Projektdauer und erklären Sie die Bedeutung des kritischen Pfads. (3 P)", "Kritischer Pfad: A → B → D (alle Vorgänge mit Gesamtpuffer 0)\nProjektdauer: 3 + 5 + 4 = 12 Tage\nBedeutung: Jede Verzögerung eines Vorgangs auf dem kritischen Pfad verschiebt das Projektende.", "1 P Pfad, 1 P Dauer, 1 P Bedeutung."],
    ["Die Einführung eines CRM-Systems ist abgeschlossen. Sie bereiten den Projektabschluss vor.\n\nNennen Sie fünf Bestandteile des Projektabschlusses. (5 P)", "Soll-Ist-Vergleich (Leistung laut Pflichtenheft, Kosten, Termine)\nAbnahme mit Abnahmeprotokoll\nAbschlussbericht\nLessons Learned\nÜbergabe in den Betrieb bzw. an den Support", "Je 1 P pro Bestandteil."],
    ["Ein Hotel überlegt, ein eigenes Buchungssystem entwickeln zu lassen, und gibt eine Machbarkeitsstudie in Auftrag.\n\nNennen Sie vier Kriterien einer Machbarkeitsstudie mit je einer Prüffrage. (4 P)", "Technisch: Lässt sich das System mit vorhandener Technik und Know-how umsetzen?\nWirtschaftlich: Übersteigt der Nutzen die Kosten, wann amortisiert es sich?\nOrganisatorisch: Sind Personal und Zeit vorhanden?\nRechtlich: Werden Datenschutz und Verträge eingehalten?\n(Markt: Gibt es Bedarf, was macht die Konkurrenz?)", "Je 1 P pro Kriterium mit Prüffrage."],
    ["Für die Einführung eines Ticketsystems soll eine Kostenaufstellung erstellt werden.\n\nNennen Sie fünf Kostenarten mit je einem Beispiel. (5 P)", "Personalkosten: Arbeitszeit der Entwickler (Stunden × Stundensatz)\nSachkosten: Server, Lizenzen\nSchulungskosten: Schulung der Support-Mitarbeitenden\nKosten externer Dienstleister: Beratung, Hosting\nLaufende Betriebskosten: Wartung, Support, Cloud-Gebühren", "Je 1 P pro Kostenart mit Beispiel."],
    ["Ein Kunde kann seine Anforderungen an eine Lager-App nur ungenau beschreiben.\n\nErläutern Sie den Zweck von Prototyping und unterscheiden Sie zwei Arten von Prototypen. (4 P)", "Zweck: vereinfachte Vorabversion, um Anforderungen mit dem Kunden zu klären oder Machbarkeit und Aufwand zu prüfen.\nWegwerf-Prototyp: wird nur zur Klärung gebaut und danach verworfen (z. B. Klick-Dummy).\nEvolutionärer Prototyp: wird schrittweise zum fertigen Produkt weiterentwickelt.", "2 P Zweck, je 1 P pro Art."]
  ],
  web: [
    ["Ein Onlineshop bietet eine Schnittstelle für Partner an, über die Produkte und Bestellungen abgerufen werden.\n\nNennen und erläutern Sie vier Prinzipien einer REST-Schnittstelle. (4 P)", "Ressourcen mit eindeutigen URLs, z. B. /api/produkte/42\nStandard-HTTP-Methoden für die Operationen (GET, POST, PUT, PATCH, DELETE)\nZustandslos: Jede Anfrage enthält alle nötigen Informationen, z. B. das Token\nTrennung von Client und Server; Daten meist als JSON, Caching möglich", "Je 1 P pro Prinzip mit Erläuterung."],
    ["Für die Verwaltung von Kunden über /api/kunden soll eine REST-API entworfen werden.\n\nOrdnen Sie den CRUD-Operationen die HTTP-Methoden zu und geben Sie jeweils ein Beispiel an. (5 P)", "Create → POST /api/kunden\nRead → GET /api/kunden bzw. /api/kunden/42\nUpdate (vollständig) → PUT /api/kunden/42\nUpdate (teilweise) → PATCH /api/kunden/42\nDelete → DELETE /api/kunden/42", "Je 1 P pro richtiger Zuordnung mit Beispiel."],
    ["Beim Test einer REST-API treten unterschiedliche Antworten auf.\n\nNennen Sie die Bedeutung der Statuscode-Klassen und ordnen Sie 200, 201, 204, 400, 401, 403, 404 und 500 zu. (5 P)", "2xx Erfolg: 200 OK, 201 Created, 204 No Content\n3xx Umleitung\n4xx Clientfehler: 400 Bad Request, 401 Unauthorized (nicht angemeldet), 403 Forbidden (keine Berechtigung), 404 Not Found\n5xx Serverfehler: 500 Internal Server Error", "1 P Klassen, 4 P Zuordnungen (je 0,5 P)."],
    ["Eine App fragt die offenen Bestellungen eines Kunden ab und schickt dabei ihr Token mit.\n\nBeschreiben Sie den Aufbau eines HTTP-Requests an diesem Beispiel. (4 P)", "Methode und URL mit Query-Parametern: GET /api/bestellungen?kunde=42&status=offen\nHeader mit Metadaten: Authorization: Bearer <Token>, Accept: application/json\nLeerzeile\nBody mit Nutzdaten (bei GET leer; bei POST z. B. JSON mit Content-Type: application/json)", "Je 1 P pro Bestandteil mit Beispiel."],
    ["Ein Lieferant schickt Bestellungen als XML. Ihr Importprogramm prüft sie zunächst syntaktisch, dann gegen ein XML-Schema.\n\nUnterscheiden Sie wohlgeformte und gültige XML-Dokumente. (4 P)", "Wohlgeformt: Die XML-Syntaxregeln sind eingehalten – genau ein Wurzelelement, jedes Tag geschlossen, korrekt verschachtelt, Attributwerte in Anführungszeichen, Groß-/Kleinschreibung beachtet.\nGültig: wohlgeformt und zusätzlich konform zur DTD bzw. zum XML-Schema (vorgeschriebene Elemente, Reihenfolge, Datentypen).", "Je 2 P pro Begriff."],
    ["Eine REST-API soll eine Bestellung mit Bestellnummer, Kunde (Name, Stammkunde ja/nein) und zwei Positionen als JSON liefern.\n\nErstellen Sie das JSON-Dokument. (4 P)", "{\n  \"bestellNr\": 1007,\n  \"kunde\": { \"name\": \"Weingut Becker\", \"stammkunde\": true },\n  \"positionen\": [\n    { \"artikel\": \"Monitor\", \"menge\": 2 },\n    { \"artikel\": \"Maus\", \"menge\": 5 }\n  ]\n}", "Objekt mit Schlüsseln in doppelten Anführungszeichen (1 P)\nVerschachteltes Objekt Kunde (1 P)\nArray der Positionen (1 P)\nRichtige Datentypen: Zahl, String, true/false (1 P)"],
    ["Die Website eines Landratsamts muss nach BITV barrierefrei werden.\n\nNennen Sie fünf Maßnahmen zur Barrierefreiheit. (5 P)", "Ausreichender Farbkontrast\nSkalierbare Schrift, Zoom ohne Funktionsverlust\nAlternativtexte für Bilder\nVollständige Bedienbarkeit per Tastatur\nScreenreader-Unterstützung durch semantisches HTML\nInformationen nicht nur über Farbe vermitteln\nLeichte bzw. einfache Sprache", "Je 1 P pro Maßnahme (max. 5)."],
    ["Ein Kunde bemängelt, dass seine neue Warenwirtschaft „unbequem“ sei. Sie sollen die Oberfläche anhand der ISO 9241-110 bewerten.\n\nNennen Sie die sieben Interaktionsprinzipien der aktuellen Fassung. (7 P)", "Aufgabenangemessenheit\nSelbstbeschreibungsfähigkeit\nErwartungskonformität\nErlernbarkeit\nSteuerbarkeit\nRobustheit gegen Benutzungsfehler\nBenutzerbindung", "Je 1 P pro Prinzip. Ältere Fassung: Lernförderlichkeit, Fehlertoleranz und Individualisierbarkeit statt Erlernbarkeit, Robustheit und Benutzerbindung – beide werden in Prüfungen akzeptiert."],
    ["Vor der Entwicklung einer Termin-App schlagen Sie dem Kunden vor, zuerst Mockups abzustimmen.\n\nNennen Sie vier Vorteile von Mockups. (4 P)", "Früh Feedback vom Kunden einholen\nMissverständnisse über Oberfläche und Ablauf vermeiden\nÄnderungen sind vor der Umsetzung günstig\nGrundlage für Entwicklung, Usability-Tests und Dokumentation", "Je 1 P pro Vorteil."],
    ["Ein Weingut plant: Büro-PCs vernetzen, Fotos auf einem zentralen Dateiserver ablegen, Weinbergsensoren über Kilometer anbinden. Ein Rechenzentrum nutzt zusätzlich ein eigenes Speichernetz.\n\nOrdnen Sie LAN, NAS, LPWAN und SAN zu und beschreiben Sie sie kurz. (4 P)", "LAN: lokales Netz im Gebäude – Büro-PCs.\nNAS: Dateiserver im Netz mit Dateizugriff (SMB, NFS) – Fotoablage.\nLPWAN (z. B. LoRaWAN): große Reichweite, wenig Energie, geringe Datenrate – Weinbergsensoren.\nSAN: eigenes schnelles Speichernetz mit Blockzugriff – Rechenzentrum.", "Je 1 P pro Netzart mit Zuordnung."],
    ["Ein Administrator findet im Switch-Protokoll die Adresse 3C:52:82:1A:F0:7B.\n\nBeschreiben Sie Aufbau und Funktion einer MAC-Adresse. (3 P)", "48 Bit (6 Byte), hexadezimal geschrieben.\nDie ersten 3 Byte (OUI) kennzeichnen den Hersteller, die letzten 3 Byte das Gerät.\nSie adressiert Netzwerkschnittstellen im lokalen Netz auf Schicht 2; Switches leiten Frames anhand der MAC-Adresse weiter.", "Je 1 P pro Aussage."],
    ["Ein Unternehmen vernetzt zwei Etagen und bindet das Netz an das Internet an.\n\nUnterscheiden Sie Switch, Router und Bridge nach Funktion und OSI-Schicht. (3 P)", "Switch: verbindet Geräte im selben Netz, leitet anhand der MAC-Adresse weiter (Schicht 2).\nRouter: verbindet verschiedene Netze, leitet anhand der IP-Adresse weiter (Schicht 3), z. B. zum Internet.\nBridge: koppelt zwei Netzsegmente auf Schicht 2.", "Je 1 P pro Gerät mit Schicht."],
    ["Ein Entwicklungsteam liefert bisher alle drei Monate manuell aus, mit vielen Fehlern beim Release.\n\nErläutern Sie Continuous Integration sowie Continuous Delivery und Deployment. (4 P)", "Continuous Integration: Änderungen werden mehrmals täglich in den Hauptzweig integriert; jeder Commit wird automatisch gebaut und getestet.\nContinuous Delivery: Jede getestete Version wird automatisch bis zur Auslieferungsreife gebracht; die Freigabe in Produktion erfolgt manuell.\nContinuous Deployment: Auch die Auslieferung in Produktion erfolgt automatisch.\nVorteil: kleine, häufige Releases, Fehler fallen früh auf.", "Je 1 P pro Begriff, 1 P Vorteil."],
    ["Eine Raumbuchung besteht aus einer Web-Oberfläche, einer REST-API und einer Datenbank.\n\nBeschreiben Sie die 3-Schichten-Architektur an diesem Beispiel und nennen Sie einen Vorteil. (4 P)", "Präsentationsschicht: Web-Oberfläche im Browser, zeigt Räume und nimmt Buchungen entgegen.\nLogikschicht: REST-API mit Geschäftsregeln (keine Doppelbuchung).\nDatenhaltungsschicht: Datenbank mit Räumen und Buchungen.\nDas Frontend fragt nur die API, die API fragt die Datenbank.\nVorteil: Schichten sind austauschbar und einzeln skalierbar (z. B. zusätzliche App nutzt dieselbe API).", "Je 1 P pro Schicht, 1 P Vorteil."]
  ],
  neu: [
    ["Ein Team soll eine Methode zur Rabattberechnung testgetrieben entwickeln.\n\nBeschreiben Sie den Zyklus von Test Driven Development und nennen Sie zwei Vorteile. (5 P)", "Red: Zuerst einen Test schreiben, der fehlschlägt (z. B. 10 % Rabatt ab 100 €).\nGreen: Minimalen Code schreiben, bis der Test besteht.\nRefactor: Code aufräumen, ohne das Verhalten zu ändern; Tests bleiben grün.\nVorteile: hohe Testabdeckung, testbares Design, sofortige Rückmeldung bei Regressionen.", "Je 1 P pro Phase, je 1 P pro Vorteil."],
    ["Ein Ticketshop erwartet zum Vorverkaufsstart 20.000 gleichzeitige Nutzer.\n\nUnterscheiden Sie Lasttest, Stresstest und Performancetest an diesem Beispiel. (3 P)", "Lasttest: Verhalten unter erwarteter Last prüfen – 20.000 gleichzeitige Nutzer.\nStresstest: Last über die Grenze hinaus steigern – Wann bricht das System ein, erholt es sich wieder?\nPerformancetest: Antwortzeiten und Ressourcenverbrauch messen – z. B. Kaufabschluss in unter 2 Sekunden.", "Je 1 P pro Testart mit Bezug zum Beispiel."],
    ["Ein Mitarbeiter nutzt im Café ein offenes WLAN. Ein Angreifer im selben Netz leitet den Datenverkehr über seinen Rechner um.\n\nBeschreiben Sie den Man-in-the-Middle-Angriff und nennen Sie zwei Schutzmaßnahmen. (4 P)", "Der Angreifer schaltet sich unbemerkt zwischen zwei Kommunikationspartner, kann Daten mitlesen und manipulieren; beide glauben, direkt miteinander zu kommunizieren.\nSchutz: TLS mit korrekter Zertifikatsprüfung (HTTPS, keine Zertifikatswarnungen ignorieren), VPN, keine Nutzung offener WLANs für sensible Daten.", "2 P Beschreibung, je 1 P pro Schutzmaßnahme."],
    ["Im Login eines Kundenportals lautet der Code:\n```\nsql = \"SELECT * FROM kunde WHERE name = '\" + name + \"' AND pw = '\" + pw + \"'\"\n```\n\nErklären Sie die Gefahr an einem Beispiel und nennen Sie drei Abwehrmaßnahmen. (5 P)", "Gefahr SQL-Injection: Eingaben werden ungeprüft in die Abfrage eingebaut. Mit name = admin' -- wird der Rest der Abfrage zum Kommentar, die Passwortprüfung entfällt; mit ' OR 1=1 -- liefert die Abfrage alle Datensätze.\nAbwehr: Prepared Statements (parametrisierte Abfragen), Eingabevalidierung, minimale Rechte des Datenbankbenutzers.", "2 P Erklärung mit Beispiel, je 1 P pro Abwehrmaßnahme. Prepared Statements sind die wichtigste Maßnahme."],
    ["Der Onlineshop eines Modehändlers ist am Black Friday stundenlang nicht erreichbar, weil Tausende gekaperte Geräte ihn mit Anfragen fluten.\n\nBeschreiben Sie den DDoS-Angriff, das betroffene Schutzziel und zwei Abwehrmaßnahmen. (4 P)", "DDoS (Distributed Denial of Service): Viele kompromittierte Systeme (Botnetz) überlasten gleichzeitig einen Dienst, bis er nicht mehr antwortet.\nSchutzziel: Verfügbarkeit.\nAbwehr: Filter und Rate Limiting, Content Delivery Network (CDN), spezialisierter DDoS-Schutzdienst beim Provider.", "2 P Beschreibung, 1 P Schutzziel, 1 P Abwehr."],
    ["In einem Unternehmensnetz mit Active Directory melden sich Benutzer einmal morgens an und greifen dann ohne erneute Passworteingabe auf Fileserver und Intranet zu.\n\nBeschreiben Sie, wie Kerberos das ermöglicht. (4 P)", "Kerberos ist ein Authentifizierungsprotokoll mit einer vertrauenswürdigen dritten Stelle, dem Key Distribution Center (KDC).\nBei der Anmeldung erhält der Benutzer ein Ticket Granting Ticket (TGT).\nMit dem TGT holt er sich beim KDC Service-Tickets für einzelne Dienste und legt sie dort vor.\nDas Passwort wird dabei nicht über das Netz übertragen.", "Je 1 P pro Aussage."],
    ["Ein Unternehmen will den Zugang zum Firmen-WLAN nicht mehr über ein gemeinsames Passwort regeln, sondern über persönliche Zugangsdaten.\n\nBeschreiben Sie RADIUS und seinen Einsatz in diesem Szenario. (3 P)", "RADIUS ist ein Protokoll für zentrale Authentifizierung, Autorisierung und Accounting (AAA).\nDer WLAN-Access-Point leitet die Anmeldedaten an den RADIUS-Server weiter, der sie z. B. gegen das Active Directory prüft (WPA2/WPA3-Enterprise).\nVorteil: persönliche Zugänge, einzeln sperrbar, Protokollierung.", "1 P Definition (AAA), 1 P Ablauf, 1 P Vorteil."],
    ["Eine Arztpraxis soll nachweisen, wie sie personenbezogene Gesundheitsdaten schützt.\n\nNennen Sie sechs technisch-organisatorische Maßnahmen (TOM) mit je einem Beispiel. (6 P)", "Zutrittskontrolle: abschließbarer Serverraum\nZugangskontrolle: Passwortrichtlinie, 2FA\nZugriffskontrolle: Rollenkonzept – Empfang sieht keine Befunde\nWeitergabekontrolle: verschlüsselte E-Mail, TLS\nEingabekontrolle: Protokollierung von Änderungen\nVerfügbarkeitskontrolle: Backups, USV\nWeitere: Verschlüsselung, Pseudonymisierung", "Je 1 P pro Maßnahme mit Beispiel."],
    ["Eine Webanwendung zur Raumbuchung soll so aufgebaut sein, dass Oberfläche und Geschäftslogik getrennt testbar sind.\n\nBeschreiben Sie das MVC-Muster mit den Aufgaben der Komponenten und nennen Sie einen Vorteil. (4 P)", "Model: Daten und Geschäftslogik (Räume, Buchungsregeln).\nView: Darstellung (Buchungskalender).\nController: nimmt Eingaben entgegen, ruft das Model auf und wählt die View.\nVorteil: Trennung der Zuständigkeiten – leichter wartbar, testbar und austauschbar (z. B. neue View für mobile Geräte).", "Je 1 P pro Komponente, 1 P Vorteil."],
    ["Eine Android-App zeigt den Kontostand an, der sich automatisch aktualisieren soll, sobald neue Daten vorliegen.\n\nBeschreiben Sie das MVVM-Muster und grenzen Sie es von MVC ab. (4 P)", "Model: Daten und Logik. View: Oberfläche. ViewModel: stellt Daten und Befehle für die View bereit und bereitet sie auf.\nView und ViewModel sind über Data Binding verbunden: Ändert sich der Wert im ViewModel, aktualisiert sich die Anzeige automatisch.\nAbgrenzung: Statt eines Controllers, der die View aktiv steuert, bindet sich die View selbst an das ViewModel.", "2 P Komponenten, 1 P Data Binding, 1 P Abgrenzung."],
    ["Eine Auswertungssoftware soll sowohl auf MySQL als auch auf Microsoft SQL Server zugreifen können, ohne den Code anzupassen.\n\nErklären Sie ODBC und den Vorteil für dieses Szenario. (3 P)", "ODBC (Open Database Connectivity) ist eine standardisierte Schnittstelle für den Datenbankzugriff.\nFür jedes DBMS gibt es einen Treiber, die Anwendung spricht nur die einheitliche ODBC-Schnittstelle an.\nVorteil: Die Datenbank kann gewechselt werden, indem nur Treiber und Verbindungsdaten geändert werden.", "Je 1 P pro Aussage. Java-Pendant: JDBC."],
    ["Ein Onlineshop fiel nachts aus, bemerkt wurde es erst morgens durch Kundenbeschwerden.\n\nBeschreiben Sie Monitoring und nennen Sie drei überwachte Kennzahlen. (4 P)", "Monitoring ist die laufende, automatische Überwachung von Systemen und Diensten mit Schwellwerten und Alarmierung (z. B. Nachricht an die Bereitschaft), damit Probleme früh erkannt werden.\nKennzahlen: CPU-Auslastung, Arbeitsspeicher, Festplattenplatz, Antwortzeiten, Erreichbarkeit, Fehlerraten in Logs.", "1 P Definition, 1 P Alarmierung, je 0,5–1 P pro Kennzahl (insgesamt 2 P)."],
    ["Ein Gartenbaubetrieb steuert die Bewässerung automatisch: Bodenfeuchtesensoren melden Werte, die Software öffnet bei Trockenheit die Ventile.\n\nErklären Sie den Begriff cyber-physisches System an diesem Beispiel. (3 P)", "Ein cyber-physisches System verbindet Software mit physischen Komponenten über ein Netzwerk.\nSensoren erfassen Messwerte aus der realen Welt (Bodenfeuchte).\nDie Software wertet sie aus und steuert Aktoren, die in die reale Welt eingreifen (Ventile öffnen).", "Je 1 P pro Aussage mit Bezug zum Beispiel."],
    ["Die neue Lagersoftware wird beim Kunden abgenommen. Zwei kleinere Mängel sind noch offen.\n\nNennen Sie die Inhalte eines Abnahmeprotokolls. (5 P)", "Datum, Ort und Beteiligte (Auftraggeber, Auftragnehmer)\nGegenstand der Abnahme bzw. geprüfte Leistungen\nFestgestellte Mängel mit Fristen zur Beseitigung\nErgebnis: abgenommen, abgenommen unter Vorbehalt oder abgelehnt\nUnterschriften beider Seiten", "Je 1 P pro Inhalt. Mit der Abnahme beginnt in der Regel die Gewährleistungsfrist und die Vergütung wird fällig."]
  ],
  wa: [
    ["Die Netzwerk GmbH möchte mit ihrer neuen Auszubildenden eine möglichst lange Probezeit vereinbaren.\n\nNennen Sie die gesetzliche Mindest- und Höchstdauer der Probezeit in der Ausbildung mit Rechtsgrundlage. (2 P)", "Mindestens 1 Monat, höchstens 4 Monate (§ 20 BBiG).", "Je 1 P. Im normalen Arbeitsverhältnis sind bis zu 6 Monate möglich – nicht verwechseln."],
    ["Ein Ausbildungsbetrieb und ein Auszubildender stellen in der fünften Woche fest, dass es nicht passt.\n\nBeschreiben Sie die Kündigungsmöglichkeiten während der Probezeit. (3 P)", "Beide Seiten können jederzeit ohne Einhaltung einer Frist und ohne Angabe von Gründen kündigen.\nDie Kündigung muss schriftlich erfolgen.", "1 P beide Seiten, 1 P ohne Frist und Grund, 1 P Schriftform (§ 22 BBiG)."],
    ["Eine Auszubildende im zweiten Ausbildungsjahr möchte in eine Ausbildung zur Mediengestalterin wechseln. Ihr Betrieb erwägt wegen wiederholter Verstöße eine Kündigung.\n\nBeschreiben Sie die Kündigungsmöglichkeiten nach der Probezeit für beide Seiten. (4 P)", "Auszubildende: mit einer Frist von 4 Wochen, wenn sie die Ausbildung aufgibt oder sich für einen anderen Beruf ausbilden lassen will.\nBeide Seiten: fristlos nur aus wichtigem Grund, innerhalb von 2 Wochen nach Kenntnis der Tatsachen.\nDer Betrieb kann nicht ordentlich kündigen.\nImmer schriftlich und unter Angabe der Gründe.", "Je 1 P pro Aussage (§ 22 BBiG)."],
    ["Ein Auszubildender fragt, wann genau seine Ausbildung endet: Sein Vertrag läuft bis zum 31. Januar, die mündliche Prüfung ist am 25. November.\n\nBeschreiben Sie, wann ein Ausbildungsverhältnis endet. (2 P)", "Grundsätzlich mit Ablauf der Ausbildungszeit.\nBesteht der Auszubildende vorher die Abschlussprüfung, endet es mit der Bekanntgabe des Prüfungsergebnisses – hier also am 25. November.", "Je 1 P (§ 21 BBiG). Bei Nichtbestehen verlängert sich die Ausbildung auf Verlangen bis zur nächsten Wiederholungsprüfung, höchstens um ein Jahr."],
    ["Nach bestandener Prüfung arbeitet ein ehemaliger Auszubildender am nächsten Tag einfach weiter. Eine Vereinbarung über die Übernahme gibt es nicht.\n\nBeschreiben Sie die Rechtsfolge. (2 P)", "Es gilt ein Arbeitsverhältnis auf unbestimmte Zeit als begründet (§ 24 BBiG).", "1 P unbefristetes Arbeitsverhältnis, 1 P Rechtsgrundlage bzw. Begründung (Weiterbeschäftigung ohne Vereinbarung)."],
    ["Ein Start-up bildet zum ersten Mal aus und erstellt den Ausbildungsvertrag.\n\nNennen Sie sechs Pflichtangaben des Ausbildungsvertrags und den Zeitpunkt der schriftlichen Niederlegung. (4 P)", "Art, sachliche und zeitliche Gliederung sowie Ziel der Ausbildung\nBeginn und Dauer\nAusbildungsmaßnahmen außerhalb der Ausbildungsstätte\nDauer der regelmäßigen täglichen Ausbildungszeit\nDauer der Probezeit\nHöhe der Vergütung\nDauer des Urlaubs\nKündigungsvoraussetzungen, Hinweis auf Tarif- und Betriebsvereinbarungen\nSchriftlich spätestens vor Beginn der Ausbildung (§ 11 BBiG).", "3 P für sechs Angaben (je 0,5 P), 1 P Zeitpunkt."],
    ["Ein Softwarehaus möchte erstmals ausbilden. Der Teamleiter soll Ausbilder werden.\n\nNennen Sie die Voraussetzungen, die ein Ausbilder erfüllen muss. (2 P)", "Persönliche Eignung (z. B. keine Verstöße gegen das BBiG, kein Beschäftigungsverbot für Jugendliche)\nFachliche Eignung: berufliche sowie berufs- und arbeitspädagogische Kenntnisse, meist nachgewiesen durch die Ausbildereignungsprüfung (AEVO)", "Je 1 P."],
    ["Ein Auszubildender hält das Führen des Berichtshefts für überflüssig.\n\nErläutern Sie zwei Zwecke des Ausbildungsnachweises. (2 P)", "Er dokumentiert den Ausbildungsverlauf und ermöglicht dem Ausbilder die Kontrolle, ob alle Inhalte vermittelt werden.\nDie Vorlage ist Zulassungsvoraussetzung für die Abschlussprüfung (§ 43 BBiG).", "Je 1 P."],
    ["Ein Ausbildungsbetrieb hat Fragen zur Eintragung seines neuen Ausbildungsvertrags und zu den Prüfungen.\n\nNennen Sie vier Aufgaben der IHK als zuständige Stelle in der Berufsausbildung. (4 P)", "Beratung von Betrieben und Auszubildenden (Ausbildungsberater)\nÜberwachung der Ausbildung\nFührung des Verzeichnisses der Ausbildungsverhältnisse (Eintragung der Verträge)\nAbnahme der Prüfungen (Zwischen- bzw. Teil-1- und Abschlussprüfung)\nPrüfung der Eignung von Ausbildungsstätte und Ausbildern", "Je 1 P pro Aufgabe."],
    ["Ein Betrieb plant für seinen 17-jährigen Auszubildenden die Arbeitszeiten.\n\nNennen Sie vier Regelungen des Jugendarbeitsschutzgesetzes zur Arbeitszeit. (4 P)", "Höchstens 8 Stunden täglich\nHöchstens 40 Stunden wöchentlich\n5-Tage-Woche\nKeine Nachtarbeit zwischen 20 und 6 Uhr (mit Ausnahmen)\nMindestens 12 Stunden Freizeit zwischen zwei Arbeitstagen", "Je 1 P pro Regelung."],
    ["Der 16-jährige Auszubildende Max arbeitet an einem Tag 5 Stunden, an einem anderen 7,5 Stunden.\n\nGeben Sie die Mindestpausen für beide Tage nach dem JArbSchG an und nennen Sie die Mindestdauer einer Pause. (3 P)", "5 Stunden (mehr als 4,5 bis 6 Stunden): 30 Minuten\n7,5 Stunden (mehr als 6 Stunden): 60 Minuten\nAls Pause zählt nur eine Unterbrechung von mindestens 15 Minuten.", "Je 1 P."],
    ["In einem Ausbildungsbetrieb sind am 1. Januar die Auszubildenden Ali (15), Ben (16) und Clara (17) beschäftigt.\n\nGeben Sie den Mindesturlaub nach dem JArbSchG für alle drei an. (3 P)", "Ali (noch nicht 16): 30 Werktage\nBen (noch nicht 17): 27 Werktage\nClara (noch nicht 18): 25 Werktage\nMaßgeblich ist das Alter zu Beginn des Kalenderjahres.", "Je 1 P. Erwachsene haben nach BUrlG mindestens 24 Werktage."],
    ["Die 17-jährige Auszubildende Nora hat montags 6 Unterrichtsstunden (à 45 Minuten) Berufsschule. Ihr Betrieb möchte, dass sie danach noch ins Büro kommt.\n\nBeurteilen Sie die Situation nach dem JArbSchG. (3 P)", "Ein Berufsschultag mit mehr als 5 Unterrichtsstunden von mindestens 45 Minuten wird einmal pro Woche mit 8 Stunden auf die Arbeitszeit angerechnet.\nAn diesem Tag darf Nora danach nicht mehr beschäftigt werden.\nDer Betrieb darf sie also montags nicht mehr ins Büro holen.", "Je 1 P (§ 9 JArbSchG)."],
    ["Eine Fachinformatikerin möchte sich zur IT-Projektleiterin weiterqualifizieren. Ihr Kollege, gelernter Koch, wechselt in die IT.\n\nUnterscheiden Sie Fortbildung und Umschulung an diesen Beispielen. (2 P)", "Fortbildung: Erweiterung der Qualifikation im ausgeübten Beruf bzw. beruflicher Aufstieg – die Fachinformatikerin (z. B. Bachelor Professional in IT).\nUmschulung: Befähigung zu einem anderen Beruf – der Koch wird Fachinformatiker.", "Je 1 P mit Zuordnung."],
    ["Eine Auszubildende absolviert einen Teil ihrer Ausbildung bei einer Partnerfirma in Spanien und möchte sich später europaweit bewerben.\n\nBeschreiben Sie den Europass und zwei seiner Dokumente. (3 P)", "Der Europass ist eine Sammlung von Dokumenten, die Qualifikationen und Kompetenzen in Europa verständlich und vergleichbar machen.\nDokumente: Lebenslauf, Mobilitätsnachweis (für Auslandsaufenthalte), Zeugniserläuterung, Diplomzusatz, Sprachenpass.", "1 P Zweck, je 1 P pro Dokument."]
  ],
  wr: [
    ["Ein Entwickler möchte seinen Arbeitsvertrag ordentlich kündigen. Weder Vertrag noch Tarif enthalten eine Regelung.\n\nNennen Sie die gesetzliche Kündigungsfrist für Arbeitnehmer. (2 P)", "4 Wochen zum 15. oder zum Ende eines Kalendermonats (§ 622 Abs. 1 BGB).", "1 P Frist, 1 P Termine. Die Frist gilt für Arbeitnehmer unabhängig von der Betriebszugehörigkeit."],
    ["Ein Arbeitgeber kündigt drei Mitarbeitern mit 3, 9 und 16 Jahren Betriebszugehörigkeit. Es gelten die gesetzlichen Fristen.\n\nGeben Sie die jeweilige Kündigungsfrist an. (3 P)", "3 Jahre (ab 2 Jahren): 1 Monat zum Monatsende\n9 Jahre (ab 8 Jahren): 3 Monate zum Monatsende\n16 Jahre (ab 15 Jahren): 6 Monate zum Monatsende\nStaffel: 2 J. → 1, 5 J. → 2, 8 J. → 3, 10 J. → 4, 12 J. → 5, 15 J. → 6, 20 J. → 7 Monate", "Je 1 P (§ 622 Abs. 2 BGB). Die verlängerten Fristen gelten nur für Kündigungen durch den Arbeitgeber."],
    ["Eine neu eingestellte Projektmanagerin hat im Arbeitsvertrag eine Probezeit.\n\nNennen Sie die Höchstdauer der Probezeit und die Kündigungsfrist in dieser Zeit. (2 P)", "Höchstens 6 Monate.\nKündigungsfrist: 2 Wochen, zu jedem Tag (§ 622 Abs. 3 BGB).", "Je 1 P. Nicht verwechseln: In der Probezeit einer Ausbildung gibt es keine Kündigungsfrist – beide Seiten können jederzeit schriftlich kündigen (§ 22 Abs. 1 BBiG). Für Arbeitnehmer gelten 2 Wochen."],
    ["Ein Mitarbeiter wird beim Diebstahl von Firmen-Notebooks erwischt. Der Arbeitgeber erfährt am 2. Juni davon.\n\nBeschreiben Sie die Voraussetzungen der fristlosen Kündigung und nennen Sie die Frist, bis zu der sie erklärt werden muss. (3 P)", "Fristlose (außerordentliche) Kündigung nur aus wichtigem Grund, wenn die Fortsetzung bis zum Ablauf der Kündigungsfrist unzumutbar ist – z. B. Diebstahl, Tätlichkeit, beharrliche Arbeitsverweigerung.\nSie muss innerhalb von 2 Wochen nach Kenntnis erklärt werden – hier bis 16. Juni (§ 626 BGB).", "1 P wichtiger Grund, 1 P Beispiel, 1 P Frist."],
    ["Ein Mitarbeiter eines Betriebs mit 8 Beschäftigten und ein Mitarbeiter eines Betriebs mit 50 Beschäftigten werden jeweils nach 2 Jahren gekündigt.\n\nNennen Sie die Voraussetzungen des Kündigungsschutzgesetzes und prüfen Sie, für wen es gilt. (3 P)", "Voraussetzungen: Betrieb mit mehr als 10 Arbeitnehmern und Arbeitsverhältnis länger als 6 Monate. Dann muss die Kündigung sozial gerechtfertigt sein.\nBetrieb mit 8 Beschäftigten: KSchG gilt nicht (Kleinbetrieb).\nBetrieb mit 50 Beschäftigten: KSchG gilt.", "1 P Voraussetzungen, je 1 P pro Prüfung."],
    ["Ein Unternehmen mit 200 Beschäftigten möchte drei Mitarbeitern kündigen: einem wegen dauerhafter Krankheit, einem wegen wiederholter Unpünktlichkeit und einem wegen der Schließung seiner Abteilung.\n\nOrdnen Sie die drei Gründe nach dem KSchG zu und nennen Sie jeweils eine Voraussetzung. (3 P)", "Dauerhafte Krankheit: personenbedingt – negative Gesundheitsprognose, erhebliche betriebliche Beeinträchtigung.\nUnpünktlichkeit: verhaltensbedingt – in der Regel vorherige Abmahnung.\nSchließung der Abteilung: betriebsbedingt – dringende betriebliche Erfordernisse, Sozialauswahl.", "Je 1 P pro richtiger Zuordnung mit Voraussetzung."],
    ["Eine Mitarbeiterin erhält am 10. April eine Kündigung, die sie für unberechtigt hält.\n\nNennen Sie Frist und zuständiges Gericht für die Kündigungsschutzklage. (2 P)", "Innerhalb von 3 Wochen nach Zugang der schriftlichen Kündigung – hier bis 1. Mai.\nZuständig ist das Arbeitsgericht.", "Je 1 P (§ 4 KSchG). Nach Ablauf der Frist gilt die Kündigung als wirksam."],
    ["Ein Arbeitgeber plant betriebsbedingte Kündigungen. Unter den Betroffenen sind eine Schwangere, ein schwerbehinderter Mitarbeiter, ein Betriebsratsmitglied und ein Auszubildender im zweiten Jahr.\n\nBeschreiben Sie den besonderen Kündigungsschutz dieser Personen. (4 P)", "Schwangere: Kündigungsverbot während der Schwangerschaft und bis 4 Monate nach der Entbindung (auch in der Elternzeit).\nSchwerbehinderte: Kündigung nur mit vorheriger Zustimmung des Integrationsamts.\nBetriebsratsmitglied: ordentliche Kündigung ausgeschlossen, fristlose nur mit Zustimmung des Betriebsrats.\nAuszubildender nach der Probezeit: Betrieb kann nur fristlos aus wichtigem Grund kündigen.", "Je 1 P pro Person."],
    ["Eine Mitarbeiterin erwartet Zwillinge, der errechnete Termin ist der 15. September.\n\nBeschreiben Sie die Mutterschutzfristen vor und nach der Entbindung. (3 P)", "6 Wochen vor der Entbindung: Schutzfrist, sie darf aber freiwillig weiterarbeiten.\nNach der Entbindung: Beschäftigungsverbot von 8 Wochen, bei Mehrlings- oder Frühgeburten 12 Wochen.\nBei Zwillingen also 12 Wochen.", "Je 1 P (§ 3 MuSchG)."],
    ["Ein IT-Dienstleister stellt eine Entwicklerin für ein Jahr ein, ohne Sachgrund. Eine zweite Entwicklerin wird als Elternzeitvertretung befristet eingestellt.\n\nBeschreiben Sie die Regeln für befristete Arbeitsverträge. (4 P)", "Schriftform vor Arbeitsbeginn, sonst gilt der Vertrag als unbefristet.\nOhne Sachgrund: höchstens 2 Jahre, innerhalb dieser Zeit bis zu 3 Verlängerungen; nicht bei vorheriger Beschäftigung beim selben Arbeitgeber.\nMit Sachgrund (z. B. Elternzeitvertretung): auch länger zulässig.", "1 P Schriftform, 2 P sachgrundlos, 1 P mit Sachgrund (§ 14 TzBfG)."],
    ["Ein Mitarbeiter verlässt nach fünf Jahren das Unternehmen und bittet um ein Zeugnis, das ihm bei Bewerbungen hilft.\n\nUnterscheiden Sie einfaches und qualifiziertes Arbeitszeugnis und erklären Sie die Formulierung „stets zu unserer vollsten Zufriedenheit“. (3 P)", "Einfaches Zeugnis: Art und Dauer der Tätigkeit.\nQualifiziertes Zeugnis: zusätzlich Beurteilung von Leistung und Verhalten.\n„stets zu unserer vollsten Zufriedenheit“ entspricht der Note sehr gut.", "Je 1 P. Das Zeugnis muss wohlwollend und wahr sein; der Arbeitnehmer hat Anspruch auf ein qualifiziertes Zeugnis, wenn er es verlangt."],
    ["Eine Mitarbeiterin arbeitet von Montag bis Freitag. Ihr Arbeitsvertrag regelt den Urlaub nicht.\n\nGeben Sie den gesetzlichen Mindesturlaub in Werktagen und Arbeitstagen an und begründen Sie den Unterschied. (2 P)", "24 Werktage nach BUrlG = 20 Arbeitstage bei einer 5-Tage-Woche.\nWerktage sind Montag bis Samstag (6 Tage), bei 5 Arbeitstagen: 24 ÷ 6 × 5 = 20.", "1 P Werte, 1 P Begründung."],
    ["Ein Unternehmen lehnt eine Bewerberin ab und schreibt dazu: „Wir suchen jemanden für ein junges Team.“\n\nNennen Sie die sechs nach dem AGG geschützten Merkmale und beurteilen Sie die Formulierung. (4 P)", "Ethnische Herkunft, Geschlecht, Religion oder Weltanschauung, Behinderung, Alter, sexuelle Identität.\nBeurteilung: „junges Team“ kann eine Benachteiligung wegen des Alters darstellen; die Bewerberin könnte Entschädigung verlangen.", "3 P Merkmale (je 0,5 P), 1 P Beurteilung."],
    ["Sie bereiten als Teamleitung Vorstellungsgespräche für eine Stelle als Anwendungsentwicklerin vor.\n\nNennen Sie je zwei zulässige und unzulässige Fragen und das Recht der Bewerberin bei unzulässigen Fragen. (5 P)", "Zulässig: Qualifikation (Welche Programmiersprachen beherrschen Sie?), Berufserfahrung, Gehaltsvorstellung, frühester Eintrittstermin.\nUnzulässig: Schwangerschaft, Familienplanung, Religion, Partei- oder Gewerkschaftszugehörigkeit.\nBei unzulässigen Fragen darf die Bewerberin die Unwahrheit sagen („Recht zur Lüge“), ohne dass dies später eine Anfechtung rechtfertigt.", "Je 1 P pro Frage, 1 P Recht."],
    ["Ein Mitarbeiter streitet mit seinem Arbeitgeber über ein schlechtes Zeugnis. Seine Kollegin streitet mit der Rentenversicherung über eine Erwerbsminderungsrente.\n\nOrdnen Sie beiden Streitigkeiten das zuständige Gericht zu. (2 P)", "Zeugnis (Streit aus dem Arbeitsverhältnis): Arbeitsgericht.\nRentenversicherung (Streit mit einem Sozialversicherungsträger): Sozialgericht.", "Je 1 P. Weitere Fälle: Kündigung, Lohn → Arbeitsgericht; Kranken-, Unfallversicherung, Arbeitsagentur → Sozialgericht."],
    ["In einem Arbeitsvertrag verpflichten sich Arbeitgeber und Arbeitnehmer gegenseitig.\n\nNennen Sie je drei Pflichten von Arbeitnehmer und Arbeitgeber. (6 P)", "Arbeitnehmer: Arbeitspflicht, Treue- und Verschwiegenheitspflicht, Gehorsams- bzw. Weisungsbefolgungspflicht, Wettbewerbsverbot während des Arbeitsverhältnisses.\nArbeitgeber: Vergütungspflicht, Fürsorgepflicht (Arbeitsschutz), Beschäftigungspflicht, Urlaubsgewährung, Zeugnispflicht.", "Je 1 P pro Pflicht."],
    ["Ein Personaldienstleister überlässt einen Systemadministrator an ein Krankenhaus.\n\nBeschreiben Sie die Arbeitnehmerüberlassung: Vertragsbeziehungen und Höchstdauer. (3 P)", "Der Arbeitsvertrag besteht zwischen Leiharbeitnehmer und Verleiher (Personaldienstleister).\nZwischen Verleiher und Entleiher (Krankenhaus) besteht ein Überlassungsvertrag; der Entleiher erteilt die Arbeitsanweisungen.\nHöchstüberlassungsdauer grundsätzlich 18 Monate (§ 1 AÜG).", "Je 1 P."]
  ],
  wb: [
    ["In einem kleinen IT-Unternehmen mit 7 Beschäftigten, davon 5 länger als 6 Monate dabei, möchten die Mitarbeitenden einen Betriebsrat gründen.\n\nNennen Sie die Voraussetzungen für die Wahl eines Betriebsrats und prüfen Sie den Fall. (3 P)", "Mindestens 5 ständige wahlberechtigte Arbeitnehmer, von denen 3 wählbar sind (§ 1 BetrVG).\nWählbar: ab 18 Jahren und mindestens 6 Monate im Betrieb.\nPrüfung: 7 Wahlberechtigte, 5 davon wählbar (sofern volljährig) → ein Betriebsrat kann gewählt werden.", "1 P Voraussetzungen, 1 P Wählbarkeit, 1 P Prüfung."],
    ["Bei der Betriebsratswahl stellen sich drei Fragen: Darf die 16-jährige Auszubildende wählen, darf der 19-jährige Kollege nach 4 Monaten kandidieren, und wie lange ist der Betriebsrat im Amt?\n\nBeantworten Sie die drei Fragen. (3 P)", "Die 16-Jährige darf wählen: wahlberechtigt sind alle Arbeitnehmer ab 16 Jahren, auch Auszubildende.\nDer 19-Jährige ist noch nicht wählbar: dafür sind 18 Jahre und mindestens 6 Monate Betriebszugehörigkeit nötig.\nAmtszeit: 4 Jahre.", "Je 1 P (§§ 7, 8, 21 BetrVG)."],
    ["In einem Betrieb mit Betriebsrat arbeiten sechs Auszubildende zwischen 17 und 27 Jahren.\n\nBeschreiben Sie, wann eine Jugend- und Auszubildendenvertretung gebildet wird, wer wählt, wer wählbar ist und wie lange sie im Amt ist. (4 P)", "Gebildet in Betrieben mit Betriebsrat und mindestens 5 Arbeitnehmern unter 18 oder Auszubildenden (unter 25; seit 2021 Auszubildende unabhängig vom Alter).\nWahlberechtigt: diese Jugendlichen und Auszubildenden.\nWählbar: Arbeitnehmer unter 25 und Auszubildende; nicht zugleich Betriebsratsmitglieder.\nAmtszeit: 2 Jahre.", "Je 1 P (§§ 60 ff. BetrVG)."],
    ["Die Geschäftsführung eines Callcenters plant Schichtarbeit, Überstunden und eine Software, die Gesprächszeiten pro Mitarbeiter auswertet.\n\nNennen Sie fünf Angelegenheiten, in denen der Betriebsrat nach § 87 BetrVG mitbestimmt, und ordnen Sie die geplanten Maßnahmen zu. (5 P)", "Beginn und Ende der täglichen Arbeitszeit, Pausen, Verteilung auf die Wochentage → Schichtarbeit\nVorübergehende Verkürzung oder Verlängerung der Arbeitszeit → Überstunden\nTechnische Einrichtungen zur Überwachung von Verhalten oder Leistung → Auswertungssoftware\nAllgemeine Urlaubsgrundsätze\nFragen der Ordnung im Betrieb\nEntlohnungsgrundsätze", "Je 1 P pro Angelegenheit, Zuordnung der drei Maßnahmen ist dabei erforderlich."],
    ["Ein Arbeitgeber möchte einem Mitarbeiter kündigen und fragt, welche Rolle der Betriebsrat spielt.\n\nBeschreiben Sie die Beteiligung des Betriebsrats bei Kündigungen. (3 P)", "Der Betriebsrat muss vor jeder Kündigung angehört werden (§ 102 BetrVG).\nOhne Anhörung ist die Kündigung unwirksam.\nDer Betriebsrat kann widersprechen, aber die Kündigung nicht verhindern; ein Widerspruch kann den Weiterbeschäftigungsanspruch bis zum Ende des Kündigungsschutzprozesses begründen.", "Je 1 P."],
    ["Ein Unternehmen mit 80 Beschäftigten will einen neuen Entwickler einstellen und eine Mitarbeiterin in eine andere Abteilung versetzen.\n\nBeschreiben Sie das Beteiligungsrecht des Betriebsrats. (2 P)", "In Unternehmen mit mehr als 20 wahlberechtigten Arbeitnehmern muss der Betriebsrat bei Einstellung und Versetzung zustimmen (§ 99 BetrVG).\nEr kann die Zustimmung nur aus bestimmten Gründen verweigern (z. B. Gesetzesverstoß, Benachteiligung anderer Beschäftigter); dann entscheidet ggf. das Arbeitsgericht.", "Je 1 P."],
    ["In einem Unternehmen sollen Gleitzeit und Homeoffice für alle einheitlich geregelt werden.\n\nBeschreiben Sie die Betriebsvereinbarung: Vertragspartner, Form, Geltungsbereich und Verhältnis zum Tarifvertrag. (4 P)", "Vertragspartner: Arbeitgeber und Betriebsrat.\nForm: schriftlich.\nGeltung: unmittelbar für alle Arbeitnehmer des Betriebs.\nVerhältnis zum Tarifvertrag: Sie darf tarifliche Regelungen nicht unterschreiten; Entgelte, die üblicherweise tariflich geregelt sind, dürfen grundsätzlich nicht Gegenstand sein.", "Je 1 P."],
    ["Der Betriebsrat lädt zur Betriebsversammlung ein. Einige Beschäftigte fragen, ob sie dafür Urlaub nehmen müssen.\n\nBeschreiben Sie Häufigkeit, Zeitpunkt und Vergütung der Betriebsversammlung. (3 P)", "Regelmäßig einmal pro Kalendervierteljahr (§ 43 BetrVG).\nSie findet grundsätzlich während der Arbeitszeit statt.\nDie Zeit wird wie Arbeitszeit vergütet – kein Urlaub nötig.", "Je 1 P."],
    ["Die Bundesregierung möchte die Gehälter in der IT-Branche nicht selbst festlegen.\n\nErklären Sie den Begriff Tarifautonomie und nennen Sie die Rechtsgrundlage. (2 P)", "Tarifautonomie ist das Recht von Gewerkschaften und Arbeitgebern bzw. Arbeitgeberverbänden, Arbeitsbedingungen wie Löhne und Arbeitszeit ohne staatliche Einmischung auszuhandeln.\nRechtsgrundlage: Koalitionsfreiheit, Art. 9 Abs. 3 GG.", "Je 1 P."],
    ["Die Metallindustrie schließt einen Tarifvertrag für alle Betriebe einer Region, ein großer Telekommunikationskonzern einen eigenen Tarifvertrag.\n\nNennen Sie die Tarifvertragsparteien beider Tarifarten. (2 P)", "Flächen- bzw. Verbandstarif: Gewerkschaft und Arbeitgeberverband.\nHaus- bzw. Firmentarif: Gewerkschaft und einzelner Arbeitgeber.", "Je 1 P."],
    ["Ein Unternehmen ist tarifgebunden. Die Mitarbeitenden fragen, wo ihre Gehälter und wo ihre Urlaubstage geregelt sind.\n\nUnterscheiden Sie Lohn- und Gehaltstarifvertrag und Manteltarifvertrag. (4 P)", "Lohn- und Gehaltstarifvertrag: regelt die Höhe der Entgelte, meist kurze Laufzeit (1–2 Jahre).\nManteltarifvertrag (Rahmentarif): regelt allgemeine Arbeitsbedingungen wie Arbeitszeit, Urlaub, Kündigungsfristen, Zuschläge; längere Laufzeit.", "Je 1 P Inhalt, je 1 P Laufzeit."],
    ["Der Entgelttarifvertrag läuft noch acht Monate. Die Gewerkschaft möchte wegen der hohen Inflation sofort für mehr Geld streiken.\n\nErläutern Sie die Friedenspflicht und beurteilen Sie den geplanten Streik. (3 P)", "Friedenspflicht: Während der Laufzeit eines Tarifvertrags dürfen keine Arbeitskämpfe über die darin geregelten Punkte geführt werden (relative Friedenspflicht).\nBeurteilung: Ein Streik für höhere Entgelte ist während der Laufzeit unzulässig; erst nach Ablauf bzw. Kündigung ist er möglich.", "2 P Erklärung, 1 P Beurteilung."],
    ["Der Entgelttarifvertrag der Druckindustrie wurde gekündigt. Die Verhandlungen bleiben ohne Ergebnis.\n\nBeschreiben Sie den typischen Ablauf einer Tarifauseinandersetzung bis zum neuen Tarifvertrag. (5 P)", "1. Kündigung des Tarifvertrags, Ende der Friedenspflicht\n2. Verhandlungen, ggf. Warnstreiks\n3. Scheitern der Verhandlungen, ggf. Schlichtung\n4. Urabstimmung: mindestens 75 % für einen Streik\n5. Streik, ggf. Aussperrung durch die Arbeitgeber\n6. Neue Verhandlungen, Einigung\n7. Urabstimmung über das Ergebnis: meist mindestens 25 % für die Annahme\n8. Neuer Tarifvertrag, neue Friedenspflicht", "5 P für die vollständige, richtige Reihenfolge; die Prozentwerte stammen aus den Satzungen großer Gewerkschaften."],
    ["Der Tarifvertrag sieht 30 Urlaubstage vor. Herr A hat im Arbeitsvertrag 32, Frau B 28 Tage vereinbart.\n\nErklären Sie das Günstigkeitsprinzip und wenden Sie es auf beide Fälle an. (3 P)", "Abweichungen vom Tarifvertrag sind nur zugunsten des Arbeitnehmers zulässig.\nHerr A: 32 Tage gelten (günstiger).\nFrau B: Die Vereinbarung ist insoweit unwirksam, es gelten 30 Tage.", "Je 1 P."],
    ["Ein Berufseinsteiger überlegt, in eine Gewerkschaft einzutreten.\n\nNennen Sie vier Aufgaben bzw. Leistungen von Gewerkschaften. (4 P)", "Tarifverhandlungen und Abschluss von Tarifverträgen\nRechtsberatung und Rechtsschutz für Mitglieder (z. B. im Kündigungsschutzprozess)\nStreikgeld bei Arbeitskämpfen\nInteressenvertretung gegenüber Politik und Öffentlichkeit, Bildungsangebote", "Je 1 P."]
  ],
  ws: [
    ["Auf der ersten Gehaltsabrechnung einer Auszubildenden stehen mehrere Abzüge für die Sozialversicherung.\n\nNennen Sie die fünf Zweige der gesetzlichen Sozialversicherung. (5 P)", "Krankenversicherung\nPflegeversicherung\nRentenversicherung\nArbeitslosenversicherung\nUnfallversicherung", "Je 1 P. Die Unfallversicherung taucht nicht als Abzug auf, weil der Arbeitgeber sie allein zahlt."],
    ["Ein Arbeitnehmer fragt, warum auf seiner Abrechnung nur ein Teil der Sozialversicherungsbeiträge abgezogen wird.\n\nBeschreiben Sie, wer die Beiträge der einzelnen Zweige trägt. (3 P)", "Kranken-, Pflege-, Renten- und Arbeitslosenversicherung: Arbeitgeber und Arbeitnehmer grundsätzlich je zur Hälfte.\nAusnahme: Kinderlose ab 23 Jahren zahlen in der Pflegeversicherung einen Zuschlag allein.\nUnfallversicherung: allein der Arbeitgeber.", "Je 1 P."],
    ["Ein Auszubildender verletzt sich bei einem Arbeitsunfall. Er fragt, welche Versicherung zahlt.\n\nNennen Sie die Träger der gesetzlichen Unfallversicherung. (2 P)", "Berufsgenossenschaften – für Unternehmen der Privatwirtschaft (z. B. Verwaltungs-BG für IT-Unternehmen).\nUnfallkassen – für den öffentlichen Dienst sowie Schülerinnen und Schüler.", "Je 1 P."],
    ["Eine Auszubildende stürzt auf dem direkten Weg zur Berufsschule mit dem Fahrrad. Ein Kollege erkrankt nach Jahren am Bildschirmarbeitsplatz an einer anerkannten Berufskrankheit.\n\nNennen Sie die Leistungsfälle der gesetzlichen Unfallversicherung und ordnen Sie die Beispiele zu. (3 P)", "Arbeitsunfälle (bei der Arbeit)\nWegeunfälle auf dem direkten Weg zur und von der Arbeit bzw. Berufsschule → Fahrradsturz\nBerufskrankheiten → Erkrankung des Kollegen", "Je 1 P. Umwege aus privaten Gründen sind in der Regel nicht versichert."],
    ["Ein Mitarbeiter verletzt sich an der Hand und ist danach eine Woche arbeitsunfähig.\n\nBeschreiben Sie, was der Arbeitgeber und der Verletzte tun müssen. (3 P)", "Der Verletzte geht zum Durchgangsarzt (D-Arzt).\nDer Arbeitgeber erstattet eine Unfallanzeige an die Berufsgenossenschaft, weil der Unfall mehr als 3 Tage Arbeitsunfähigkeit verursacht.\nFrist: innerhalb von 3 Tagen nach Kenntnis.", "Je 1 P (§ 193 SGB VII)."],
    ["Eine Softwarearchitektin verdient deutlich mehr als ihre Kollegen, zahlt aber prozentual weniger Rentenbeiträge.\n\nErklären Sie die Beitragsbemessungsgrenze. (2 P)", "Die Beitragsbemessungsgrenze ist die Einkommensgrenze, bis zu der Sozialversicherungsbeiträge berechnet werden. Einkommen darüber ist beitragsfrei.\nSie wird jährlich angepasst.", "Je 1 P."],
    ["Ein IT-Berater mit hohem Gehalt möchte von der gesetzlichen in eine private Krankenversicherung wechseln.\n\nErklären Sie die Versicherungspflichtgrenze und grenzen Sie sie von der Beitragsbemessungsgrenze ab. (3 P)", "Versicherungspflichtgrenze (Jahresarbeitsentgeltgrenze): Wer mit seinem Einkommen darüber liegt, ist nicht mehr versicherungspflichtig in der gesetzlichen Krankenversicherung und kann sich privat versichern.\nBeitragsbemessungsgrenze: bis zu diesem Einkommen werden Beiträge berechnet.\nBeide werden jährlich angepasst; in der Krankenversicherung liegt die Versicherungspflichtgrenze über der Beitragsbemessungsgrenze.", "2 P Erklärung, 1 P Abgrenzung."],
    ["In einer Diskussion über die Rente fällt der Begriff Generationenvertrag.\n\nErklären Sie das Umlageverfahren und nennen Sie ein Problem. (3 P)", "Die heutigen Beitragszahler finanzieren mit ihren Beiträgen die Renten der heutigen Rentner; ihre eigene Rente zahlt später die nächste Generation.\nProblem: Durch den demografischen Wandel stehen immer weniger Beitragszahler immer mehr Rentnern gegenüber – höhere Beiträge, niedrigeres Rentenniveau oder mehr Steuerzuschüsse.", "2 P Erklärung, 1 P Problem."],
    ["Ein Ehepaar verdient 4.500 € bzw. 1.800 € brutto, eine alleinerziehende Kollegin hat zwei Kinder, ein lediger Kollege hat neben seinem Hauptjob eine zweite, steuerpflichtige Teilzeitstelle.\n\nNennen Sie die sechs Lohnsteuerklassen und ordnen Sie die Personen zu. (5 P)", "I: ledig\nII: alleinerziehend → Kollegin\nIII: verheiratet, höheres Einkommen (Partner in V) → Ehepartner mit 4.500 €\nIV: verheiratet, ähnliches Einkommen\nV: Partner von III → Ehepartner mit 1.800 €\nVI: zweites bzw. weiteres Arbeitsverhältnis → zweiter Job des ledigen Kollegen (Hauptjob: I)", "3 P Steuerklassen, 2 P Zuordnungen."],
    ["Eine Fachinformatikerin erhält ihre erste Gehaltsabrechnung und versteht die Differenz zwischen Brutto und Netto nicht.\n\nBeschreiben Sie den Weg vom Brutto- zum Nettoentgelt. (4 P)", "Bruttoentgelt\n− Lohnsteuer\n− Solidaritätszuschlag (nur bei hohem Einkommen)\n− Kirchensteuer (nur bei Kirchenmitgliedschaft)\n− Arbeitnehmeranteile zur Kranken-, Pflege-, Renten- und Arbeitslosenversicherung\n= Nettoentgelt", "1 P Steuern, 1 P Solidaritätszuschlag/Kirchensteuer mit Bedingung, 1 P Sozialversicherung, 1 P richtige Reihenfolge."],
    ["Ein Mitarbeiter erhält 3 % Gehaltserhöhung, die Inflationsrate liegt bei 5 %.\n\nUnterscheiden Sie Nominal- und Realeinkommen und beurteilen Sie die Situation. (3 P)", "Nominaleinkommen: Einkommen in Euro.\nRealeinkommen: Kaufkraft des Einkommens, also das, was man sich dafür leisten kann.\nBeurteilung: Das Nominaleinkommen steigt um 3 %, das Realeinkommen sinkt um rund 2 %, weil die Preise stärker steigen.", "Je 1 P."],
    ["Im Arbeitsvertrag steht, dass der Arbeitgeber 40 € vermögenswirksame Leistungen zahlt.\n\nErklären Sie vermögenswirksame Leistungen und die staatliche Förderung. (3 P)", "Vermögenswirksame Leistungen sind ein Zuschuss des Arbeitgebers (oft tarifvertraglich), der direkt in eine langfristige Sparform fließt, z. B. Bausparvertrag oder Fondssparplan.\nDer Staat fördert das mit der Arbeitnehmer-Sparzulage, sofern das Einkommen unter bestimmten Grenzen liegt.", "2 P Erklärung mit Sparform, 1 P Förderung."]
  ],
  wu: [
    ["Drei Freunde wollen ein IT-Systemhaus gründen und ihr Privatvermögen vor einer Haftung schützen. Sie entscheiden sich für eine GmbH.\n\nBeschreiben Sie Gründung, Mindestkapital und Haftung der GmbH. (4 P)", "Gründung: notariell beurkundeter Gesellschaftsvertrag; die GmbH entsteht mit Eintragung ins Handelsregister (Abteilung B).\nStammkapital: mindestens 25.000 €, bei Anmeldung mindestens 12.500 € eingezahlt.\nHaftung: nur mit dem Gesellschaftsvermögen; die Gesellschafter haften nicht persönlich.", "1 P Gründung, 1 P Eintragung, 1 P Kapital, 1 P Haftung."],
    ["Die Rheinhessen IT GmbH hat 40 Beschäftigte und drei Gesellschafter.\n\nNennen Sie die Organe der GmbH mit ihren Aufgaben und geben Sie an, ob ein Aufsichtsrat nötig ist. (3 P)", "Geschäftsführer: leitet die Gesellschaft und vertritt sie nach außen.\nGesellschafterversammlung: oberstes Beschlussorgan (z. B. Gewinnverwendung, Bestellung der Geschäftsführer).\nAufsichtsrat: erst ab mehr als 500 Arbeitnehmern Pflicht – hier also nicht.", "Je 1 P."],
    ["Eine GmbH mit den Gesellschaftern A (Anteil 15.000 €) und B (Anteil 10.000 €) erzielt 50.000 € Gewinn. Die Satzung sagt nichts zur Verteilung.\n\nBerechnen Sie die Gewinnanteile und nennen Sie die Regel. (3 P)", "Regel: Verteilung nach dem Verhältnis der Geschäftsanteile (§ 29 Abs. 3 GmbHG), wenn der Gesellschaftsvertrag nichts anderes regelt.\nA: 50.000 € × 15/25 = 30.000 €\nB: 50.000 € × 10/25 = 20.000 €", "1 P Regel, je 1 P pro Berechnung."],
    ["Eine Studentin möchte mit sehr wenig Startkapital eine Firma für App-Entwicklung gründen und trotzdem nicht privat haften.\n\nBeschreiben Sie die UG (haftungsbeschränkt) und ihre Besonderheit bei der Gewinnverwendung. (3 P)", "„Mini-GmbH“: Stammkapital ab 1 €, Haftung nur mit dem Gesellschaftsvermögen.\nBesonderheit: 25 % des Jahresüberschusses müssen in eine Rücklage eingestellt werden, bis 25.000 € erreicht sind; dann kann sie in eine GmbH umfirmieren.", "1 P Kapital, 1 P Haftung, 1 P Rücklage."],
    ["Ein erfolgreiches Softwarehaus will an die Börse gehen und wird dazu in eine AG umgewandelt.\n\nNennen Sie Mindestkapital und die drei Organe der AG mit ihren Aufgaben. (4 P)", "Grundkapital mindestens 50.000 €.\nVorstand: leitet und vertritt die AG.\nAufsichtsrat: bestellt und überwacht den Vorstand.\nHauptversammlung: Versammlung der Aktionäre, beschließt z. B. über Gewinnverwendung, Entlastung und Satzungsänderungen.", "Je 1 P."],
    ["Herr Becker will sein IT-Unternehmen erweitern. Seine Tante gibt 100.000 € Kapital, möchte aber weder haften noch mitarbeiten. Gegründet wird eine KG.\n\nBeschreiben Sie die Rollen von Komplementär und Kommanditist. (4 P)", "Komplementär (Herr Becker): haftet unbeschränkt mit seinem Privatvermögen und führt die Geschäfte.\nKommanditist (Tante): haftet nur bis zur Höhe ihrer Einlage und ist von der Geschäftsführung ausgeschlossen; sie hat Kontrollrechte (z. B. Einsicht in den Jahresabschluss).", "Je 2 P pro Rolle (Haftung, Geschäftsführung)."],
    ["Zwei Programmierer gründen eine OHG. Der Gesellschaft gehen die Mittel aus, ein Lieferant fordert 20.000 €.\n\nBeschreiben Sie die Haftung der Gesellschafter einer OHG. (3 P)", "Alle Gesellschafter haften unbeschränkt (auch mit dem Privatvermögen), unmittelbar (der Gläubiger kann sich direkt an jeden wenden) und gesamtschuldnerisch (jeder haftet für die ganze Summe).\nDer Lieferant kann die 20.000 € also von einem der beiden vollständig verlangen.", "Je 1 P pro Haftungsmerkmal (unbeschränkt, unmittelbar, gesamtschuldnerisch)."],
    ["Ein Lieferant möchte prüfen, wer bei einem neuen Kunden, der „Mainz Data GmbH“, vertretungsberechtigt ist.\n\nBeschreiben Sie das Handelsregister: Führung, Abteilungen und Einsicht. (3 P)", "Öffentliches Verzeichnis, geführt beim Amtsgericht (online einsehbar).\nAbteilung A: Einzelkaufleute und Personengesellschaften (OHG, KG). Abteilung B: Kapitalgesellschaften (GmbH, UG, AG).\nJeder darf ohne besonderen Grund Einsicht nehmen – der Lieferant findet die Mainz Data GmbH in Abteilung B mit ihren Geschäftsführern.", "Je 1 P."],
    ["Ein wachsendes Softwarehaus überlegt, wie es sich organisieren soll: klassisch, mit Beratungsstellen oder mit Projektleitern quer zu den Abteilungen.\n\nBeschreiben Sie vier Leitungssysteme. (4 P)", "Einliniensystem: Jeder hat genau einen Vorgesetzten; klare Wege, aber lange Dienstwege.\nMehrliniensystem: Mitarbeiter haben mehrere fachliche Vorgesetzte; kurze Wege, aber Kompetenzkonflikte.\nStabliniensystem: Einliniensystem plus Stabsstellen, die beraten, aber keine Weisungen erteilen.\nMatrixorganisation: Funktionsverantwortung (Abteilung) und Produkt- bzw. Projektverantwortung kreuzen sich.", "Je 1 P pro Leitungssystem."],
    ["Ein Unternehmen hat Erträge von 500.000 €, Aufwendungen von 400.000 € und ein Eigenkapital von 800.000 €. In der Fertigung stellen 10 Mitarbeiter täglich 2.000 Teile her.\n\nBerechnen Sie Wirtschaftlichkeit, Eigenkapitalrentabilität und Arbeitsproduktivität. (6 P)", "Wirtschaftlichkeit = Ertrag ÷ Aufwand = 500.000 ÷ 400.000 = 1,25\nEigenkapitalrentabilität = Gewinn ÷ Eigenkapital × 100 = 100.000 ÷ 800.000 × 100 = 12,5 %\nArbeitsproduktivität = Ausbringung ÷ Arbeitseinsatz = 2.000 ÷ 10 = 200 Teile je Mitarbeiter und Tag", "Je 1 P Formel, je 1 P Ergebnis. Gewinn = Ertrag − Aufwand = 100.000 €."],
    ["Für den Markt für Smartphone-Betriebssysteme, den Markt für Bäckerbrötchen in einer Großstadt und die Trinkwasserversorgung einer Gemeinde soll die Marktform bestimmt werden.\n\nBeschreiben Sie Polypol, Oligopol und Monopol und ordnen Sie die Beispiele zu. (3 P)", "Polypol: viele Anbieter, viele Nachfrager → Bäckerbrötchen in der Großstadt\nOligopol: wenige Anbieter, viele Nachfrager → Smartphone-Betriebssysteme\nMonopol: ein Anbieter → Trinkwasserversorgung der Gemeinde", "Je 1 P mit Zuordnung."],
    ["In einer Theorieaufgabe soll begründet werden, warum der Markt für Computerspiele kein vollkommener Markt ist.\n\nNennen Sie die vier Bedingungen eines vollkommenen Marktes und begründen Sie. (5 P)", "Homogene (gleichartige) Güter\nVollständige Markttransparenz\nKeine persönlichen, räumlichen oder zeitlichen Präferenzen\nSofortige Reaktion aller Marktteilnehmer\nBegründung: Computerspiele sind nicht gleichartig, Käufer haben starke Vorlieben (Marken, Genres) – damit fehlen Homogenität und Präferenzfreiheit.", "Je 1 P pro Bedingung, 1 P Begründung."],
    ["Ein IT-Dienstleister möchte seine Personalplanung an der Konjunktur ausrichten.\n\nBeschreiben Sie die vier Konjunkturphasen mit je einem typischen Merkmal. (4 P)", "Aufschwung (Expansion): steigende Nachfrage und Produktion, Investitionen nehmen zu.\nHochkonjunktur (Boom): Kapazitäten ausgelastet, geringe Arbeitslosigkeit, steigende Preise.\nAbschwung (Rezession): sinkende Produktion und Nachfrage, steigende Arbeitslosigkeit.\nTiefstand (Depression): hohe Arbeitslosigkeit, geringe Investitionen, pessimistische Erwartungen.", "Je 1 P pro Phase mit Merkmal."],
    ["Eine Region hat ein Weingut, eine Autozulieferfabrik und mehrere IT-Dienstleister.\n\nBeschreiben Sie die Wirtschaftssektoren und ordnen Sie die Unternehmen zu. (3 P)", "Primärer Sektor (Urproduktion: Land- und Forstwirtschaft, Bergbau) → Weingut\nSekundärer Sektor (Verarbeitung: Industrie, Handwerk) → Autozulieferer\nTertiärer Sektor (Dienstleistungen: Handel, Banken, IT) → IT-Dienstleister\nTeilweise wird ein quartärer Informationssektor abgegrenzt.", "Je 1 P mit Zuordnung."],
    ["In einer Diskussion behauptet ein Kollege, in Deutschland herrsche „freie Marktwirtschaft“.\n\nBeschreiben Sie die soziale Marktwirtschaft und nennen Sie drei Beispiele für staatlichen Ausgleich. (4 P)", "Die soziale Marktwirtschaft verbindet freien Wettbewerb und Privateigentum mit staatlichem sozialem Ausgleich.\nBeispiele: gesetzliche Sozialversicherung, Kündigungs- und Arbeitsschutz, Wettbewerbsrecht und Kartellamt, Mindestlohn, progressive Einkommensteuer.", "1 P Beschreibung, je 1 P pro Beispiel."],
    ["Drei regionale IT-Händler vereinbaren, sich nicht gegenseitig Kunden in den jeweiligen Landkreisen abzuwerben.\n\nErklären Sie den Begriff Kartell und beurteilen Sie die Vereinbarung. (3 P)", "Kartell: Absprache rechtlich und wirtschaftlich selbstständiger Unternehmen zur Beschränkung des Wettbewerbs (z. B. Preise, Gebiete, Mengen).\nBeurteilung: Die Gebietsabsprache ist ein Kartell und nach dem GWB grundsätzlich verboten; das Bundeskartellamt kann Bußgelder verhängen (Ausnahmen nur in engen Grenzen, z. B. Mittelstandskartelle).", "1 P Definition, 2 P Beurteilung mit Rechtsgrundlage."],
    ["Die SoftCo AG übernimmt die DataNet GmbH vollständig und löst sie in sich auf. Ein anderer Konzern kauft die Mehrheit an zwei Firmen, die als eigene GmbHs weiterbestehen.\n\nUnterscheiden Sie Fusion und Konzern an diesen Beispielen. (4 P)", "Fusion (SoftCo/DataNet): Unternehmen verschmelzen zu einem; mindestens eines verliert die rechtliche Selbstständigkeit.\nKonzern (Mehrheitsbeteiligung): Die Unternehmen bleiben rechtlich selbstständig, stehen aber unter einheitlicher Leitung und verlieren ihre wirtschaftliche Selbstständigkeit.", "Je 2 P pro Begriff mit Zuordnung."],
    ["Ein Rechenzentrum verfolgt die Ziele „Gewinn steigern“, „Energiekosten senken“ und „nur teuren Ökostrom beziehen“.\n\nErklären Sie Zielharmonie und Zielkonflikt und ordnen Sie zwei Zielpaare zu. (4 P)", "Zielharmonie: Das Erreichen eines Ziels fördert ein anderes → Energiekosten senken und Gewinn steigern.\nZielkonflikt: Das Erreichen eines Ziels erschwert ein anderes → Gewinn steigern und teuren Ökostrom beziehen.", "Je 1 P Definition, je 1 P Beispiel."],
    ["Ein IT-Unternehmen formuliert seine Unternehmensziele für die nächsten fünf Jahre.\n\nNennen Sie je zwei ökonomische, ökologische und soziale Ziele. (6 P)", "Ökonomisch: Gewinn steigern, Umsatz erhöhen, Marktanteil ausbauen, Liquidität sichern.\nÖkologisch: Energieverbrauch senken, CO₂-Emissionen reduzieren, Elektroschrott vermeiden.\nSozial: sichere Arbeitsplätze, faire Bezahlung, Weiterbildung, Vereinbarkeit von Familie und Beruf.", "Je 1 P pro Ziel."],
    ["Ein Softwarehaus hat Abteilungen, deutschlandweit gibt es spezialisierte Berufe, und Hardware wird in Asien gefertigt.\n\nUnterscheiden Sie betriebliche, volkswirtschaftliche und internationale Arbeitsteilung. (3 P)", "Betrieblich: Zerlegung der Arbeit innerhalb eines Unternehmens in Abteilungen und Teilaufgaben (Vertrieb, Entwicklung, Support).\nVolkswirtschaftlich: Spezialisierung auf Berufe, Branchen und Wirtschaftssektoren.\nInternational: Spezialisierung von Ländern, z. B. Hardwarefertigung in Asien → Globalisierung.", "Je 1 P."],
    ["Ein IT-Hersteller kauft Bauteile weltweit ein und verkauft in über 50 Ländern.\n\nNennen Sie drei Faktoren, die die Globalisierung fördern, und je einen Vor- und Nachteil. (5 P)", "Faktoren: Abbau von Zöllen und Handelshemmnissen, Freihandelsabkommen, sinkende Transport- und Kommunikationskosten (Internet).\nVorteil: größere Absatzmärkte, günstigere Beschaffung, mehr Auswahl für Verbraucher.\nNachteil: Abhängigkeit von Lieferketten, Verlagerung von Arbeitsplätzen, Umweltbelastung durch Transporte.", "3 P Faktoren, je 1 P Vor- und Nachteil."],
    ["Eine Fachinformatikerin möchte sich mit einer App für Handwerksbetriebe selbstständig machen und braucht einen Bankkredit.\n\nNennen Sie fünf Bestandteile eines Businessplans und seinen Zweck. (5 P)", "Geschäftsidee und Gründerperson\nMarkt- und Wettbewerbsanalyse\nMarketing und Vertrieb\nOrganisation und Personal, Rechtsform\nFinanzplanung (Kapitalbedarf, Rentabilität, Liquidität)\nZweck: Grundlage für die Kreditentscheidung der Bank und Fahrplan für die Gründung.", "4 P für die Bestandteile (je 0,8 P), 1 P Zweck."]
  ],
  wx: [
    ["Für das neue Bürogebäude werden Sicherheitszeichen bestellt.\n\nNennen Sie die Bedeutung der vier Sicherheitsfarben mit je einem Beispiel. (4 P)", "Rot: Verbot und Brandschutz – Rauchen verboten, Feuerlöscher\nGelb: Warnung – Warnung vor elektrischer Spannung\nBlau: Gebot – Gehörschutz tragen\nGrün: Rettung und Erste Hilfe – Notausgang, Erste-Hilfe-Kasten", "Je 1 P pro Farbe mit Beispiel."],
    ["Im Büro bemerkt eine Auszubildende Rauch aus dem Papierkorb neben einem Drucker.\n\nBeschreiben Sie das richtige Verhalten im Brandfall in der richtigen Reihenfolge. (4 P)", "1. Ruhe bewahren\n2. Brand melden (Notruf 112, Brandmelder)\n3. In Sicherheit bringen: gefährdete Personen warnen, Türen schließen, keinen Aufzug benutzen, Sammelplatz aufsuchen\n4. Löschversuch unternehmen, wenn ohne Eigengefährdung möglich", "Je 1 P pro Schritt in richtiger Reihenfolge."],
    ["Im Rahmen der Brandschutzunterweisung soll der richtige Umgang mit dem Feuerlöscher erklärt werden.\n\nNennen Sie vier Regeln für den Einsatz eines Feuerlöschers. (4 P)", "Feuer in Windrichtung angreifen\nFlächenbrände von vorne nach hinten und von unten nach oben löschen\nTropf- und Fließbrände von oben nach unten löschen\nMehrere Feuerlöscher gleichzeitig statt nacheinander einsetzen\nBei Elektrobränden Abstand halten, CO₂-Löscher verwenden", "Je 1 P pro Regel."],
    ["In einem Softwarehaus mit 80 Beschäftigten wird gefragt, wer für den Arbeitsschutz zuständig ist und was getan werden muss.\n\nBeschreiben Sie die Verantwortung des Arbeitgebers und nennen Sie zwei beratende Stellen. (4 P)", "Der Arbeitgeber ist verantwortlich (ArbSchG): Er erstellt Gefährdungsbeurteilungen, trifft Schutzmaßnahmen und unterweist die Beschäftigten vor Aufnahme der Tätigkeit und danach mindestens jährlich (Jugendliche halbjährlich).\nBeratend: Fachkraft für Arbeitssicherheit, Betriebsarzt; außerdem Sicherheitsbeauftragte und Betriebsrat.", "2 P Verantwortung und Pflichten, je 1 P pro beratender Stelle."],
    ["Ein Mitarbeiter wird zum Sicherheitsbeauftragten ernannt und fragt, ob er nun für Unfälle haftet.\n\nBeschreiben Sie Aufgaben und Stellung des Sicherheitsbeauftragten. (3 P)", "Er unterstützt den Arbeitgeber, achtet auf Mängel und Gefahren und weist Kolleginnen und Kollegen auf sicheres Verhalten hin.\nEr übt die Aufgabe ehrenamtlich neben seiner Arbeit aus und trägt keine rechtliche Verantwortung – die bleibt beim Arbeitgeber.\nPflicht ab mehr als 20 Beschäftigten (§ 22 SGB VII).", "Je 1 P."],
    ["Ein neu gegründetes Unternehmen möchte wissen, welche Vorschriften zum Arbeitsschutz es beachten muss.\n\nNennen Sie fünf Gesetze bzw. Vorschriften des Arbeitsschutzes. (5 P)", "Arbeitsschutzgesetz\nArbeitszeitgesetz\nJugendarbeitsschutzgesetz\nMutterschutzgesetz\nArbeitsstättenverordnung\nUnfallverhütungsvorschriften der Berufsgenossenschaft", "Je 1 P (max. 5)."],
    ["Mehrere Entwickler klagen über Rückenschmerzen und brennende Augen.\n\nNennen Sie fünf Maßnahmen für einen gesunden Bildschirmarbeitsplatz. (5 P)", "Höhenverstellbarer Tisch und ergonomischer Stuhl\nBildschirm blendfrei, seitlich zum Fenster, Oberkante auf Augenhöhe\nRegelmäßige Pausen bzw. Tätigkeitswechsel\nBildschirmbrille bei Bedarf (Angebot einer Augenuntersuchung)\nBewegungsangebote, ausreichende Beleuchtung", "Je 1 P pro Maßnahme."],
