  ["t2", "diag", "Ein Tester erreicht für eine Methode vollständige Zweigüberdeckung (C1).\n\nWelche Aussage über die Anweisungsüberdeckung (C0) stimmt?", ["Sie ist nicht automatisch erfüllt.","Sie ist automatisch ebenfalls erfüllt.","Sie ist nur bei Black-Box-Tests relevant.","Sie entspricht dem Regressionstest."], 1, "Werden alle Zweige (wahr und falsch) durchlaufen, wird auch jede Anweisung ausgeführt. C1 schließt C0 ein, umgekehrt gilt das nicht."],
  ["t2", "diag", "Eine Methode enthält eine Schleife, deren Durchlaufzahl von der Eingabe abhängt. Der Tester soll vollständige Pfadüberdeckung (C2) erreichen.\n\nWarum ist das meist nicht möglich?", ["Eine Schleife bildet genau einen Pfad, egal wie oft sie läuft.","Die Zahl möglicher Pfade wächst stark oder ist unbegrenzt.","Pfadüberdeckung setzt Black-Box-Tests ohne Codekenntnis voraus.","Bei Schleifen ist schon die Anweisungsüberdeckung (C0) unerreichbar."], 1, "Jede mögliche Anzahl von Schleifendurchläufen ergibt einen eigenen Pfad. In der Praxis testet man daher repräsentativ: 0, 1 und viele Durchläufe."],
  ["t2", "diag", "Ein externer Tester erhält nur das Pflichtenheft eines Bestellsystems, nicht den Quellcode.\n\nWelche Testmethode wendet er an?", ["White-Box-Test","Black-Box-Test","Grey-Box-Test","Glass-Box-Test"], 1, "Black-Box-Tests leiten Testfälle aus der Spezifikation ab (Äquivalenzklassen, Grenzwerte). White-Box-Tests nutzen die Kenntnis des Codes (Überdeckungen)."],
  ["t2", "diag", "Ein Onlineshop gewährt 5 % Rabatt ab einem Bestellwert von 100,00 €.\n\nWelche Werte eignen sich für eine Grenzwertanalyse?", ["0,00 € und 1.000,00 €","99,99 € und 100,00 €","50,00 € und 150,00 €","Nur 100,00 €"], 1, "An Grenzen passieren die meisten Fehler (z. B. > statt >=). Getestet wird direkt an der Grenze und knapp daneben, hier 99,99 € (kein Rabatt) und 100,00 € (Rabatt)."],
  ["t2", "diag", "Nach einer Fehlerkorrektur im Warenkorb werden alle bereits vorhandenen Testfälle des Shops erneut ausgeführt.\n\nWie heißt diese Testart?", ["Erster Test einer neuen Funktion","Regressionstest","Lasttest","Abnahmetest"], 1, "Der Regressionstest prüft, ob Änderungen bestehende Funktionen beschädigt haben. Er wird idealerweise automatisiert, z. B. in einer CI-Pipeline."],
  ["t2", "diag", "Ein Team arbeitet testgetrieben (Test Driven Development).\n\nIn welcher Reihenfolge läuft ein TDD-Zyklus ab?", ["Green (Code bis Funktion läuft), Red (Test schlägt fehl), Refactor","Red (Test schlägt fehl), Green (Code bis Test besteht), Refactor","Red (Test schlägt fehl), Refactor (Code umbauen), Green (Test besteht)","Refactor (Code aufräumen), Red (Test schlägt fehl), Green (Test besteht)"], 1, "Zuerst wird ein Test geschrieben, der fehlschlägt (Red). Dann minimaler Code, bis er besteht (Green). Danach wird aufgeräumt, ohne das Verhalten zu ändern (Refactor)."],
  ["t2", "diag", "Im Sequenzdiagramm eines Bestellvorgangs wird nur dann eine Bestätigungs-E-Mail versendet, wenn der Kunde dem zugestimmt hat.\n\nWelches kombinierte Fragment verwenden Sie?", ["loop","opt","par","ref"], 1, "opt: Ablauf nur, wenn die Bedingung erfüllt ist. alt: mehrere sich ausschließende Alternativen. loop: Wiederholung. par: parallel."],
  ["t2", "diag", "Im Sequenzdiagramm ruft der Controller lagerPruefen() beim Lager auf und erhält den Bestand zurück.\n\nWie wird die Antwortnachricht gezeichnet?", ["Durchgezogen mit gefüllter Spitze","Gestrichelt mit offener Spitze","Durchgezogen mit offener Spitze","Als Balken auf der Lebenslinie"], 1, "Synchroner Aufruf: durchgezogen, gefüllte Spitze. Antwort: gestrichelt, offene Spitze, oft mit dem Rückgabewert beschriftet."],
  ["t2", "diag", "Im Zustandsdiagramm eines Fahrkartenautomaten wechselt der Automat beim Bezahlen in den Zustand „Druck“, wenn der Betrag reicht, und druckt dabei die Quittung.\n\nWie lautet die Form der Transitionsbeschriftung?", ["Aktion [Ereignis] / Bedingung","Ereignis [Bedingung] / Aktion","Bedingung [Ereignis] / Aktion","Ereignis / Aktion [Bedingung]"], 1, "Ereignis [Bedingung] / Aktion – hier: bezahlen [Betrag ausreichend] / Quittung drucken."],
  ["t2", "diag", "Im Aktivitätsdiagramm einer Bestellung wird nach „Lager prüfen“ verzweigt, je nachdem ob die Ware verfügbar ist.\n\nWo stehen die Bedingungen?", ["In runden Klammern innerhalb der Aktion „Lager prüfen“","In eckigen Klammern an den ausgehenden Kanten der Raute","In eckigen Klammern an der eingehenden Kante der Raute","In geschweiften Klammern am Kontrollfluss zum Endknoten"], 1, "Jede ausgehende Kante der Entscheidungsraute erhält eine Bedingung in eckigen Klammern, z. B. [verfügbar] und [nicht verfügbar]. Die Bedingungen müssen sich ausschließen."],
  ["t2", "diag", "Bestellservice und Zahlungsservice wurden einzeln getestet. Jetzt soll geprüft werden, ob die Übergabe der Bestelldaten zwischen beiden funktioniert.\n\nWelche Teststufe ist das?", ["Komponententest einer einzelnen Methode","Integrationstest","Abnahmetest durch den Kunden","Oberflächentest"], 1, "Der Integrationstest prüft das Zusammenspiel und die Schnittstellen mehrerer Komponenten."],

  // ---------- SoWi
  ["wiso", "w", "Die Netzwerk GmbH schließt mit Lena einen Ausbildungsvertrag zur Fachinformatikerin. Im Vertrag soll die Probezeit festgelegt werden.\n\nWie lange darf die Probezeit in einem Ausbildungsverhältnis höchstens dauern?", ["1 Monat","3 Monate","4 Monate","6 Monate"], 2, "§ 20 BBiG: mindestens 1 Monat, höchstens 4 Monate. Im normalen Arbeitsverhältnis sind bis zu 6 Monate möglich."],
  ["wiso", "w", "Jonas ist seit sechs Wochen Auszubildender und merkt, dass ihm der Beruf nicht liegt. Er befindet sich noch in der Probezeit.\n\nWas gilt für seine Kündigung?", ["Er muss eine Frist von 4 Wochen einhalten, und zwar schriftlich.","Er kann jederzeit ohne Frist kündigen, aber schriftlich.","Er kann jederzeit ohne Frist kündigen, auch mündlich.","Er kann ohne Frist kündigen, muss aber einen Grund angeben."], 1, "§ 22 BBiG: In der Probezeit können beide Seiten jederzeit ohne Frist und ohne Angabe von Gründen kündigen – immer schriftlich."],
  ["wiso", "w", "Mias Ausbildungsvertrag läuft bis 31. Januar. Ihre Abschlussprüfung besteht sie am 25. November, das Ergebnis wird ihr am selben Tag bekannt gegeben.\n\nWann endet ihr Ausbildungsverhältnis?", ["Mit Ablauf der vertraglichen Ausbildungszeit am 31. Januar","Mit Bekanntgabe des Prüfungsergebnisses am 25. November","Mit Zustellung des schriftlichen Zeugnisses Anfang Dezember","Am Ende des Monats der Prüfung, also am 30. November"], 1, "§ 21 Abs. 2 BBiG: Besteht der Auszubildende vor Ablauf der Ausbildungszeit die Abschlussprüfung, endet das Ausbildungsverhältnis mit der Bekanntgabe des Ergebnisses."],
  ["wiso", "w", "Nach bestandener Prüfung arbeitet Tim einfach weiter in seinem Ausbildungsbetrieb. Über eine Übernahme wurde nichts vereinbart.\n\nWas entsteht dadurch?", ["Ein befristetes Arbeitsverhältnis","Ein unbefristetes Arbeitsverhältnis","Ein verlängertes Ausbildungsverhältnis","Kein Arbeitsverhältnis, da kein Vertrag"], 1, "§ 24 BBiG: Wird der Auszubildende im Anschluss weiterbeschäftigt, ohne dass etwas vereinbart wurde, gilt ein Arbeitsverhältnis auf unbestimmte Zeit als begründet."],
  ["wiso", "w", "Sara beginnt im August ihre Ausbildung. Am 1. Januar des nächsten Jahres ist sie 16 Jahre alt.\n\nWie viele Werktage Urlaub stehen ihr in diesem Kalenderjahr nach dem Jugendarbeitsschutzgesetz mindestens zu?", ["24","25","27","30"], 2, "§ 19 JArbSchG richtet sich nach dem Alter zu Beginn des Kalenderjahres: noch nicht 16 → 30, noch nicht 17 → 27, noch nicht 18 → 25 Werktage. Mit 16 ist sie „noch nicht 17“."],
  ["wiso", "w", "In einem Softwarehaus mit 60 Beschäftigten wird ein Betriebsrat gewählt. Auch die Auszubildenden wollen wählen.\n\nAb welchem Alter darf man den Betriebsrat wählen?", ["16","18","21","25"], 0, "Seit 2021 sind alle Arbeitnehmer ab 16 Jahren wahlberechtigt (§ 7 BetrVG), Auszubildende eingeschlossen. Wählbar ist man ab 18 Jahren nach 6 Monaten Betriebszugehörigkeit."],
  ["wiso", "w", "In einem Betrieb mit Betriebsrat arbeiten acht Auszubildende und zwei Jugendliche. Es soll eine Jugend- und Auszubildendenvertretung gewählt werden.\n\nWer ist in die JAV wählbar?", ["Nur Auszubildende unter 18","Arbeitnehmer unter 25 sowie Auszubildende","Alle ab 18 mit 6 Monaten Betriebszugehörigkeit","Nur Mitglieder des Betriebsrats"], 1, "§ 61 BetrVG: wählbar sind Arbeitnehmer unter 25 Jahren; seit 2021 sind Auszubildende unabhängig vom Alter wählbar. Mitglieder des Betriebsrats können nicht zugleich JAV-Mitglied sein."],
  ["wiso", "w", "Die Geschäftsführung eines Callcenters plant mehrere Maßnahmen.\n\nBei welcher Maßnahme hat der Betriebsrat ein echtes Mitbestimmungsrecht?", ["Einführung eines elektronischen Zeiterfassungssystems","Festlegung der Preise für die Callcenter-Dienstleistungen","Ernennung eines neuen Geschäftsführers für das Callcenter","Erweiterung des Produktangebots um eine Technik-Hotline"], 0, "§ 87 Abs. 1 Nr. 6 BetrVG: Technische Einrichtungen, die Verhalten oder Leistung überwachen können, sind mitbestimmungspflichtig. Ohne Zustimmung entscheidet die Einigungsstelle."],
  ["wiso", "w", "Ein Arbeitgeber kündigt einem Mitarbeiter, ohne vorher den Betriebsrat anzuhören.\n\nWas gilt für diese Kündigung?", ["Sie ist wirksam.","Sie ist unwirksam.","Sie wird nach 3 Wochen wirksam.","Das Arbeitsgericht entscheidet automatisch."], 1, "§ 102 BetrVG: Der Betriebsrat ist vor jeder Kündigung anzuhören. Eine ohne Anhörung ausgesprochene Kündigung ist unwirksam."],
  ["wiso", "w", "Für alle Unternehmen der Metall- und Elektroindustrie in Baden-Württemberg wird ein neuer Tarifvertrag verhandelt.\n\nWer schließt einen solchen Flächentarifvertrag ab?", ["Betriebsrat und Arbeitgeberverband","Gewerkschaft und Arbeitgeberverband","Gewerkschaft und einzelner Arbeitgeber","Landesregierung und Gewerkschaft"], 1, "Flächen- bzw. Verbandstarif: Gewerkschaft und Arbeitgeberverband. Haus- bzw. Firmentarif: Gewerkschaft und einzelner Arbeitgeber."],
  ["wiso", "w", "Eine Gewerkschaft fordert 6 % mehr Geld für die Beschäftigten. Darüber wird ein neuer Tarifvertrag abgeschlossen.\n\nWas regelt der Lohn- und Gehaltstarifvertrag?", ["Kündigungsfristen","Dauer des Urlaubs","Höhe der Entgelte","Lage der Arbeitszeit"], 2, "Der Lohn- und Gehaltstarif regelt die Entgelthöhe und hat meist kurze Laufzeiten. Arbeitszeit, Urlaub und Kündigungsfristen stehen im Manteltarifvertrag."],
  ["wiso", "w", "Bei der Gehaltsabrechnung einer Auszubildenden werden Sozialversicherungsbeiträge abgezogen.\n\nWelcher Zweig der Sozialversicherung wird allein vom Arbeitgeber bezahlt?", ["Krankenversicherung","Unfallversicherung","Pflegeversicherung","Rentenversicherung"], 1, "Die gesetzliche Unfallversicherung (Berufsgenossenschaft) zahlt der Arbeitgeber allein. Die anderen Zweige werden grundsätzlich je zur Hälfte getragen."],
  ["wiso", "w", "Die Krankenkasse lehnt eine Reha-Maßnahme ab. Der Versicherte will dagegen klagen.\n\nWelches Gericht ist zuständig?", ["Amtsgericht","Arbeitsgericht","Sozialgericht","Verwaltungsgericht"], 2, "Streitigkeiten mit Kranken-, Renten-, Unfall- oder Arbeitslosenversicherung gehören vor das Sozialgericht. Streit aus dem Arbeitsverhältnis gehört vor das Arbeitsgericht."],
  ["wiso", "w", "Drei Fachinformatiker wollen gemeinsam ein IT-Systemhaus als GmbH gründen.\n\nWie hoch muss das Stammkapital einer GmbH mindestens sein?", ["1 €","12.500 €","25.000 €","50.000 €"], 2, "§ 5 GmbHG: mindestens 25.000 €, bei der Anmeldung müssen mindestens 12.500 € eingezahlt sein. 1 € ist bei der UG (haftungsbeschränkt) möglich, 50.000 € ist das Mindestgrundkapital der AG."],
  ["wiso", "w", "Die Becker Software KG hat einen Komplementär und zwei Kommanditisten. Das Unternehmen ist überschuldet.\n\nWer haftet unbeschränkt mit seinem Privatvermögen?", ["Die Kommanditisten","Der Komplementär","Alle Gesellschafter","Niemand"], 1, "Der Komplementär haftet unbeschränkt und führt die Geschäfte. Kommanditisten haften nur mit ihrer Einlage und sind von der Geschäftsführung ausgeschlossen."],
  ["wiso", "w", "In einem Softwarehaus berät eine Datenschutzbeauftragte die Geschäftsführung, darf den Abteilungen aber keine Anweisungen erteilen. Sonst hat jeder Mitarbeiter genau einen Vorgesetzten.\n\nWelches Leitungssystem liegt vor?", ["Einliniensystem","Mehrliniensystem","Stabliniensystem","Matrixorganisation"], 2, "Stabliniensystem: Einliniensystem plus Stabsstellen, die beraten und zuarbeiten, aber keine Weisungsbefugnis haben."],
  ["wiso", "w", "Ein IT-Systemhaus hatte im letzten Geschäftsjahr Erträge von 120.000 € und Aufwendungen von 100.000 €.\n\nWie hoch ist die Wirtschaftlichkeit?", ["0,83","1,2","20 %","120.000"], 1, "Wirtschaftlichkeit = Ertrag ÷ Aufwand = 120.000 ÷ 100.000 = 1,2. Ein Wert über 1 bedeutet wirtschaftliches Arbeiten."],
  ["wiso", "w", "In Deutschland betreiben nur wenige große Unternehmen eigene Mobilfunknetze, Millionen Kunden fragen Verträge nach.\n\nWelche Marktform liegt vor?", ["Bilaterales Oligopol","Angebotsoligopol","Angebotsmonopol","Nachfrageoligopol"], 1, "Oligopol: wenige Anbieter, viele Nachfrager. Polypol: viele Anbieter und Nachfrager. Monopol: ein Anbieter. Bilaterales Oligopol: wenige Anbieter und wenige Nachfrager."],
  ["wiso", "w", "Die Wirtschaftsnachrichten melden: Industrieproduktion und Aufträge gehen zurück, die Arbeitslosigkeit steigt, Unternehmen investieren weniger.\n\nIn welcher Konjunkturphase befindet sich die Wirtschaft?", ["Aufschwung (Expansion) mit steigender Produktion und sinkender Arbeitslosigkeit","Hochkonjunktur (Boom) mit ausgelasteten Kapazitäten und niedriger Arbeitslosigkeit","Abschwung (Rezession) mit rückläufiger Produktion und steigender Arbeitslosigkeit","Erholungsphase nach dem Tiefpunkt mit wieder anziehenden Investitionen"], 2, "Konjunkturphasen: Aufschwung (Expansion) → Hochkonjunktur (Boom) → Abschwung (Rezession) → Tiefstand (Depression)."],
  ["wiso", "w", "Eine IT-Firma legt ihre Ziele für das nächste Jahr fest.\n\nWelches Ziel ist ein ökologisches Unternehmensziel?", ["Umsatz im Bereich Cloud-Hosting um 10 % steigern","CO₂-Ausstoß des Rechenzentrums um 20 % senken","Eine Betriebskita für die Mitarbeitenden einrichten","Marktanteil bei Hosting-Kunden um 5 % ausbauen"], 1, "Ökologisch: Umwelt und Ressourcen schonen. Ökonomisch: Umsatz, Gewinn, Marktanteil. Sozial: Arbeitsplätze, Familienfreundlichkeit (Betriebskita)."],
  ["wiso", "w", "Im Treppenhaus eines Bürogebäudes hängt ein Schild mit einem laufenden Männchen und Pfeil zum Notausgang.\n\nWelche Farbe haben Rettungszeichen?", ["Rot","Gelb","Blau","Grün"], 3, "Grün: Rettung und Erste Hilfe. Rot: Verbot und Brandschutz. Gelb: Warnung. Blau: Gebot."],
  ["wiso", "w", "Im Serverraum riecht es verbrannt, aus einem Rack steigt Rauch auf.\n\nWas ist zuerst zu tun?", ["Sofort mit dem Feuerlöscher löschen","Ruhe bewahren und den Brand melden","Fenster öffnen und den Raum lüften","Zuerst die Daten des Servers sichern"], 1, "Reihenfolge: Ruhe bewahren → Brand melden (112) → in Sicherheit bringen und andere warnen → Löschversuch nur, wenn ohne Eigengefährdung möglich."],
  ["wiso", "w", "Nach einem Unfall im Lager stellt sich die Frage, wer für den Arbeitsschutz im Betrieb verantwortlich ist.\n\nWer trägt die Verantwortung?", ["Der Sicherheitsbeauftragte","Der Betriebsrat","Der Arbeitgeber","Die Berufsgenossenschaft"], 2, "Der Arbeitgeber ist verantwortlich (ArbSchG): Gefährdungsbeurteilung, Unterweisung, Schutzmaßnahmen. Sicherheitsbeauftragte, Fachkraft für Arbeitssicherheit und Betriebsarzt unterstützen und beraten nur."],
  ["wiso", "w", "Ein Unternehmen hat Altöl ins Grundwasser gelangen lassen und muss die Sanierung bezahlen.\n\nWelches Prinzip der Umweltpolitik liegt zugrunde?", ["Gemeinlastprinzip: Die Allgemeinheit trägt die Kosten.","Verursacherprinzip: Der Verursacher trägt die Kosten.","Vorsorgeprinzip: Schäden werden im Voraus vermieden.","Kooperationsprinzip: Staat und Betriebe lösen es gemeinsam."], 1, "Nach dem Verursacherprinzip trägt derjenige die Kosten für Vermeidung oder Beseitigung von Umweltschäden, der sie verursacht. Beispiel: CO₂-Preis."],
  ["wiso", "w", "Beim Einkauf von Druckerpapier für das Büro achtet die Beschaffung auf den „Blauen Engel“.\n\nWas bedeutet das Zeichen?", ["Das Produkt ist über seinen gesamten Lebensweg klimaneutral.","Das Produkt ist umweltfreundlicher als vergleichbare Produkte.","Das Produkt erfüllt die EU-Anforderungen an Sicherheit und Gesundheit.","Das Produkt stammt aus zertifizierter nachhaltiger Forstwirtschaft."], 1, "Der Blaue Engel ist das staatliche Umweltzeichen in Deutschland. Er kennzeichnet Produkte, die umweltfreundlicher sind als vergleichbare – z. B. Recyclingpapier oder energiesparende Geräte."],
  ["wiso", "w", "Eine Stellenanzeige soll diskriminierungsfrei formuliert werden.\n\nWelches Merkmal schützt das Allgemeine Gleichbehandlungsgesetz (AGG) nicht?", ["Ethnische Herkunft","Sexuelle Identität","Berufserfahrung","Weltanschauung"], 2, "Das AGG schützt ethnische Herkunft, Geschlecht, Religion/Weltanschauung, Behinderung, Alter und sexuelle Identität. Berufserfahrung ist ein zulässiges, sachliches Auswahlkriterium."],
  ["wiso", "w", "Eine Mitarbeiterin der Buchhaltung bringt ihr Kind ohne Komplikationen zur Welt.\n\nWie lange darf sie nach der Entbindung nicht beschäftigt werden?", ["6 Wochen","8 Wochen","12 Wochen","14 Wochen"], 1, "Mutterschutzgesetz: 6 Wochen vor (freiwillig arbeiten möglich) und 8 Wochen nach der Entbindung (Beschäftigungsverbot), bei Früh- oder Mehrlingsgeburten 12 Wochen."],
  ["wiso", "w", "Herr Yilmaz arbeitet seit 6 Jahren bei einem Softwarehaus. Der Arbeitgeber kündigt ordentlich, Tarif- oder Vertragsregeln gibt es nicht.\n\nWelche gesetzliche Kündigungsfrist gilt?", ["4 Wochen zum 15. oder zum Monatsende","1 Monat zum Monatsende","2 Monate zum Monatsende","3 Monate zum Monatsende"], 2, "§ 622 Abs. 2 BGB: Bei Kündigung durch den Arbeitgeber verlängert sich die Frist – ab 2 Jahren 1 Monat, ab 5 Jahren 2 Monate, ab 8 Jahren 3 Monate, jeweils zum Monatsende."],
  ["wiso", "w", "Frau Becker erhält am 3. März eine Kündigung, die sie für sozial ungerechtfertigt hält.\n\nInnerhalb welcher Frist muss sie Kündigungsschutzklage erheben?", ["1 Woche","2 Wochen","3 Wochen","1 Monat"], 2, "§ 4 KSchG: innerhalb von 3 Wochen nach Zugang der schriftlichen Kündigung beim Arbeitsgericht. Danach gilt die Kündigung als wirksam."],
  ["wiso", "w", "Ein IT-Dienstleister stellt einen Entwickler befristet ein, ohne einen sachlichen Grund zu nennen.\n\nWie lange darf eine sachgrundlose Befristung höchstens dauern?", ["6 Monate","1 Jahr","2 Jahre","5 Jahre"], 2, "§ 14 Abs. 2 TzBfG: ohne Sachgrund bis zu 2 Jahre, innerhalb dieser Zeit höchstens dreimal verlängerbar. Die Befristung muss schriftlich vor Arbeitsbeginn vereinbart sein."],
  ["wiso", "w", "Ein Tarifvertrag über die Entgelte läuft noch bis Ende des Jahres. Die Gewerkschaft möchte schon jetzt für höhere Löhne streiken.\n\nWas gilt aufgrund der Friedenspflicht?", ["Während der Laufzeit sind Warnstreiks über die geregelten Inhalte weiterhin erlaubt.","Während der Laufzeit sind keine Arbeitskämpfe über die geregelten Inhalte erlaubt.","Während der Laufzeit sind Arbeitskämpfe nur mit Zustimmung des Betriebsrats erlaubt.","Während der Laufzeit sind Arbeitskämpfe auch über nicht geregelte Themen verboten."], 1, "Relative Friedenspflicht: Solange der Tarifvertrag gilt, darf über die darin geregelten Punkte nicht gestreikt werden – auch nicht mit Warnstreiks. Erst nach Ablauf bzw. Kündigung sind Arbeitskämpfe möglich. Eine absolute Friedenspflicht, die auch Arbeitskämpfe über nicht geregelte Themen ausschließt, gilt nur, wenn sie ausdrücklich vereinbart wurde."],
  ["wiso", "w", "Ein Auszubildender verletzt sich auf dem direkten Weg zur Berufsschule.\n\nWofür ist die Berufsgenossenschaft zuständig?", ["Krankengeld bei Erkrankungen außerhalb der Arbeit","Arbeits- und Wegeunfälle sowie Berufskrankheiten","Arbeitslosengeld und Vermittlung nach Jobverlust","Altersrente nach Erreichen der Regelaltersgrenze"], 1, "Die Berufsgenossenschaft ist Träger der gesetzlichen Unfallversicherung. Sie kümmert sich um Prävention, Heilbehandlung, Reha und Renten nach Arbeitsunfällen."],
  ["wiso", "w", "In einem Unternehmen soll eine einheitliche Gleitzeitregelung für alle Beschäftigten eingeführt werden.\n\nWer schließt dazu eine Betriebsvereinbarung?", ["Gewerkschaft und Arbeitgeber","Betriebsrat und Arbeitgeber","IHK und Betriebsrat","Jeder Arbeitnehmer einzeln"], 1, "Die Betriebsvereinbarung wird schriftlich zwischen Arbeitgeber und Betriebsrat geschlossen und gilt für alle Arbeitnehmer des Betriebs."],
  ["wiso", "w", "Die Mutter AG hält die Mehrheit an drei Tochter-GmbHs, die eigenständige Firmen bleiben, aber nach den Vorgaben der Mutter geführt werden.\n\nWie nennt man diesen Zusammenschluss?", ["Fusion – Verschmelzung mehrerer Unternehmen zu einer rechtlichen Einheit","Konzern – rechtlich selbstständige Unternehmen unter einheitlicher Leitung","Kartell – vertragliche Preisabsprache rechtlich selbstständiger Unternehmen","Interessengemeinschaft – lose Zusammenarbeit ohne einheitliche Leitung"], 1, "Im Konzern bleiben die Unternehmen rechtlich selbstständig, verlieren aber ihre wirtschaftliche Selbstständigkeit. Bei der Fusion entsteht ein einziges Unternehmen."],
  ["wiso", "w", "Ein IT-Hersteller lässt Bauteile in Asien fertigen und verkauft weltweit.\n\nWelche Maßnahme fördert die Globalisierung?", ["Erhöhung von Einfuhrzöllen","Abbau von Handelshemmnissen","Einführung von Importquoten","Verschärfung von Kapitalkontrollen"], 1, "Der Abbau von Zöllen und Handelshemmnissen, Freihandelsabkommen sowie sinkende Transport- und Kommunikationskosten fördern die Globalisierung. Zölle und Quoten bremsen sie."],
  ["wiso", "w", "Die Personalabteilung prüft einen neuen Ausbildungsvertrag auf die Pflichtangaben nach § 11 BBiG.\n\nWas muss nicht zwingend im Ausbildungsvertrag stehen?", ["Dauer der täglichen Ausbildungszeit","Höhe der Ausbildungsvergütung","Name der Berufsschullehrkraft","Voraussetzungen einer Kündigung"], 2, "Pflichtangaben sind u. a. Ziel und Gliederung der Ausbildung, Beginn und Dauer, Ausbildungsstätte, tägliche Arbeitszeit, Probezeit, Vergütung, Urlaub und Kündigungsvoraussetzungen."],
  ["wiso", "w", "Der 17-jährige Auszubildende Paul soll in einer Projektwoche täglich 9 Stunden arbeiten.\n\nWas gilt nach dem Jugendarbeitsschutzgesetz für seine tägliche Arbeitszeit?", ["Höchstens 10 Stunden","Höchstens 8 Stunden","Höchstens 6 Stunden","Keine Grenze"], 1, "§ 8 JArbSchG: Jugendliche dürfen höchstens 8 Stunden täglich und 40 Stunden wöchentlich beschäftigt werden (in Ausnahmen 8,5 Stunden, wenn an anderen Tagen weniger gearbeitet wird)."],
  ["wiso", "w", "Die 16-jährige Auszubildende Emma arbeitet an einem Tag 7 Stunden.\n\nWie lang müssen ihre Pausen insgesamt mindestens sein?", ["15 Minuten","30 Minuten","45 Minuten","60 Minuten"], 3, "§ 11 JArbSchG: mehr als 4,5 bis 6 Stunden → 30 Minuten, mehr als 6 Stunden → 60 Minuten. Als Pause zählen nur Unterbrechungen von mindestens 15 Minuten."],
  ["wiso", "w", "Ein Fachinformatiker macht nach einigen Berufsjahren berufsbegleitend den IT-Spezialisten bzw. Bachelor Professional in IT.\n\nWas ist eine Fortbildung?", ["Befähigung zu einer anderen beruflichen Tätigkeit","Erweiterung der Qualifikation im ausgeübten Beruf","Erstmaliger Erwerb einer beruflichen Grundqualifikation","Vermittlung erster Praxiserfahrung vor der Ausbildung"], 1, "Fortbildung erweitert oder erhält die berufliche Qualifikation bzw. ermöglicht Aufstieg. Eine Umschulung befähigt dagegen zu einem anderen Beruf."],
  ["wiso", "w", "Der Tarifvertrag sieht 30 Urlaubstage vor. Im Arbeitsvertrag eines Mitarbeiters stehen 32, bei einem anderen 28 Tage.\n\nWas regelt das Günstigkeitsprinzip?", ["Der Arbeitsvertrag darf vom Tarifvertrag nur zugunsten des Arbeitnehmers abweichen.","Der Arbeitsvertrag darf vom Tarifvertrag nur zugunsten des Arbeitgebers abweichen.","Der Arbeitsvertrag geht dem Tarifvertrag vor, weil er die speziellere Regelung ist.","Der Tarifvertrag verdrängt jede abweichende Regelung im Arbeitsvertrag, auch günstigere."], 0, "32 Tage sind zulässig, 28 Tage nicht – hier gelten die tariflichen 30 Tage."],
  ["wiso", "w", "Die Tarifverhandlungen sind gescheitert. Die Gewerkschaft lässt ihre Mitglieder über einen Streik abstimmen.\n\nWie viel Zustimmung braucht die Urabstimmung für einen Streik üblicherweise mindestens?", ["25 %","50 %","75 %","100 %"], 2, "Nach den Satzungen der großen Gewerkschaften müssen mindestens 75 % der abstimmenden Mitglieder zustimmen. Für die Annahme eines Ergebnisses reichen oft 25 %."],
  ["wiso", "w", "Die gesetzliche Rentenversicherung wird oft als Generationenvertrag bezeichnet.\n\nWas wird im Umlageverfahren finanziert?", ["Die späteren eigenen Renten aus angesparten Beiträgen","Die heutigen Renten aus den heutigen Beiträgen","Die heutigen Renten vollständig aus dem Bundeszuschuss","Die heutigen Renten aus den Erträgen von Aktienfonds"], 1, "Die Beiträge der heute Erwerbstätigen werden direkt für die heutigen Renten verwendet. Probleme entstehen, wenn immer weniger Beitragszahler immer mehr Rentner finanzieren."],
  ["wiso", "w", "Ein 22-jähriger Entwickler ist ledig, hat keine Kinder und nur ein Arbeitsverhältnis.\n\nWelche Steuerklasse hat er?", ["I","II","III","V"], 0, "I: ledig. II: alleinerziehend. III/V: Verheiratete mit unterschiedlichem Einkommen. IV: Verheiratete mit ähnlichem Einkommen. VI: zweites Arbeitsverhältnis."],
  ["wiso", "w", "Eine Mitarbeiterin bekommt 2 % mehr Gehalt, die Preise steigen im selben Jahr um 4 %.\n\nWas folgt daraus?", ["Ihr Realeinkommen steigt.","Ihre Kaufkraft steigt.","Ihr Realeinkommen sinkt.","Ihr Nominaleinkommen sinkt."], 2, "Das Nominaleinkommen steigt um 2 %, die Kaufkraft (Realeinkommen) sinkt aber um etwa 2 %, weil die Preise stärker steigen."],
  ["wiso", "w", "Die Mainzer Software AG plant eine Unternehmensübernahme. Die Entscheidung trifft das Organ, das die Gesellschaft leitet.\n\nWer leitet eine AG?", ["Aufsichtsrat","Hauptversammlung","Vorstand","Gesellschafterversammlung"], 2, "Der Vorstand leitet und vertritt die AG. Der Aufsichtsrat bestellt und kontrolliert den Vorstand, die Hauptversammlung (Aktionäre) entscheidet z. B. über Gewinnverwendung und Satzungsänderungen."],
  ["wiso", "w", "Die neu gegründete Rheinhessen IT GmbH wird ins Handelsregister eingetragen.\n\nIn welcher Abteilung steht sie?", ["Abteilung A","Abteilung B","Abteilung C","Gar nicht"], 1, "Abteilung A: Einzelkaufleute und Personengesellschaften (OHG, KG). Abteilung B: Kapitalgesellschaften (GmbH, UG, AG). Die GmbH entsteht erst mit der Eintragung."],
  ["wiso", "w", "Ein Unternehmen entwickelt Software und betreut die IT-Systeme seiner Kunden.\n\nZu welchem Wirtschaftssektor gehört es?", ["Primärer Sektor","Sekundärer Sektor","Tertiärer Sektor","Keinem Sektor"], 2, "Primär: Urproduktion (Landwirtschaft, Bergbau). Sekundär: Verarbeitung (Industrie, Handwerk). Tertiär: Dienstleistungen (Handel, Banken, IT-Dienstleister). Teilweise wird ein quartärer Informationssektor abgegrenzt."],
  ["wiso", "w", "In Deutschland bilden sich Preise am Markt, gleichzeitig gibt es Sozialversicherung, Kündigungsschutz und ein Kartellamt.\n\nWas kennzeichnet die soziale Marktwirtschaft?", ["Staatliche Preisfestsetzung mit sozialem Ausgleich","Freier Markt mit sozialem Ausgleich durch den Staat","Freier Markt ohne staatliche Eingriffe in den Wettbewerb","Gemeineigentum an Produktionsmitteln mit Planvorgaben"], 1, "Freier Wettbewerb und Privateigentum werden durch staatliche Eingriffe ergänzt: soziale Sicherung, Arbeitnehmerschutz und Wettbewerbsrecht."],
  ["wiso", "w", "Ein Rechenzentrum will den Gewinn steigern und gleichzeitig freiwillig nur teuren Ökostrom einkaufen.\n\nWas liegt hier vor?", ["Zielharmonie: Gewinn steigern und Stromkosten durch Ökostrom senken","Zielkonflikt: Gewinn maximieren und teure Umweltmaßnahmen umsetzen","Zielneutralität: Gewinn und Ökostromeinkauf beeinflussen sich nicht","Zielhierarchie: Ökostrom ist ein Unterziel der Gewinnmaximierung"], 1, "Ein Zielkonflikt liegt vor, wenn das Erreichen eines Ziels ein anderes erschwert. Bei Zielharmonie fördern sich die Ziele gegenseitig."],
  ["wiso", "w", "In einem Softwarehaus gibt es die Abteilungen Vertrieb, Entwicklung, Support und Buchhaltung.\n\nWelche Form der Arbeitsteilung liegt vor?", ["Betriebliche Arbeitsteilung – Aufteilung auf Abteilungen eines Unternehmens","Internationale Arbeitsteilung – Spezialisierung von Staaten auf bestimmte Güter","Volkswirtschaftliche Arbeitsteilung – Gliederung der Wirtschaft in Sektoren","Outsourcing – Verlagerung von Abteilungsaufgaben an externe Dienstleister"], 0, "Betriebliche Arbeitsteilung zerlegt die Arbeit innerhalb eines Unternehmens. Volkswirtschaftlich entstehen Berufe und Sektoren, international führt sie zur Globalisierung."],
  ["wiso", "w", "An der Tür zum Serverraum hängt ein rundes, blaues Schild mit einem Gehörschutz-Symbol.\n\nWas bedeutet die Farbe Blau bei Sicherheitszeichen?", ["Verbot","Warnung","Gebot","Rettung"], 2, "Blau = Gebot (etwas muss getan werden, z. B. Gehörschutz tragen). Rot = Verbot, Gelb = Warnung, Grün = Rettung."],
  ["wiso", "w", "Eine Mitarbeiterin stolpert im Büro und ist danach fünf Tage arbeitsunfähig.\n\nWann muss ein Arbeitsunfall der Berufsgenossenschaft gemeldet werden?", ["Bereits ab dem 1. Tag der Arbeitsunfähigkeit","Bei mehr als 3 Tagen Arbeitsunfähigkeit","Bei mehr als 7 Tagen Arbeitsunfähigkeit","Erst bei mehr als 6 Wochen Arbeitsunfähigkeit"], 1, "§ 193 SGB VII: Unfallanzeige durch den Arbeitgeber, wenn der Unfall mehr als 3 Tage Arbeitsunfähigkeit verursacht, innerhalb von 3 Tagen nach Kenntnis; bei tödlichen Unfällen sofort."],
  ["wiso", "w", "Ein Unternehmen möchte seine Abfallmengen reduzieren und orientiert sich am Kreislaufwirtschaftsgesetz.\n\nWas ist die oberste Stufe der Abfallhierarchie?", ["Recycling","Beseitigung","Vermeidung","Verbrennung"], 2, "Vermeidung → Vorbereitung zur Wiederverwendung → Recycling → sonstige, z. B. energetische Verwertung → Beseitigung."],
  ["wiso", "w", "Im Vorstellungsgespräch für eine Stelle als Anwendungsentwicklerin werden verschiedene Fragen gestellt.\n\nWelche Frage ist zulässig?", ["Planen Sie in den nächsten Jahren eine Familie?","Welcher Partei oder Gewerkschaft gehören Sie an?","Welche Programmiersprachen beherrschen Sie?","Welcher Religionsgemeinschaft gehören Sie an?"], 2, "Zulässig sind nur Fragen mit Bezug zur Stelle. Fragen nach Schwangerschaft, Familienplanung, Religion, Partei oder Gewerkschaft sind unzulässig – auf sie darf man sogar wahrheitswidrig antworten."],
  ["wiso", "w", "Ein Mitarbeiter verlässt das Unternehmen und verlangt ein qualifiziertes Arbeitszeugnis.\n\nWas enthält es zusätzlich zum einfachen Zeugnis?", ["Eine Angabe von Gehalt und Sonderzahlungen","Eine Beurteilung von Leistung und Verhalten","Eine Aufstellung der Fehl- und Krankheitstage","Eine Angabe der Gewerkschaftszugehörigkeit"], 1, "Das einfache Zeugnis nennt Art und Dauer der Tätigkeit, das qualifizierte zusätzlich Leistung und Verhalten. Es muss wohlwollend und wahr sein; „stets zu unserer vollsten Zufriedenheit“ entspricht „sehr gut“."],
  ["wiso", "w", "Ein Personaldienstleister überlässt einen Systemadministrator an ein Krankenhaus.\n\nWie viele Monate darf er grundsätzlich höchstens beim selben Entleiher eingesetzt werden?", ["6","12","18","24"], 2, "§ 1 Abs. 1b AÜG: Höchstüberlassungsdauer grundsätzlich 18 Monate; Tarifverträge können abweichen."],
  ["wiso", "w", "In einem Unternehmen wurde im Mai 2026 ein Betriebsrat gewählt.\n\nWie lange dauert seine regelmäßige Amtszeit?", ["2 Jahre","3 Jahre","4 Jahre","5 Jahre"], 2, "§ 21 BetrVG: Die Amtszeit des Betriebsrats beträgt 4 Jahre, die der JAV 2 Jahre."],
  ["wiso", "w", "Drei Anbieter von Druckerpapier vereinbaren heimlich, ihre Preise gleichzeitig um 15 % zu erhöhen.\n\nWas ist ein Kartell?", ["Verschmelzung mehrerer Unternehmen zu einer rechtlichen Einheit","Wettbewerbsbeschränkende Absprache selbstständiger Unternehmen","Einheitliche Leitung rechtlich selbstständiger Unternehmen","Marktbeherrschende Stellung eines einzelnen Unternehmens"], 1, "Kartelle (z. B. Preis- oder Gebietsabsprachen) sind nach dem GWB grundsätzlich verboten; das Bundeskartellamt kann hohe Bußgelder verhängen."],
  ["wiso", "w", "Ein Konzern schult alle Beschäftigten zu Antikorruption, Datenschutz und Exportkontrolle und hat einen Verhaltenskodex.\n\nWie nennt man die Einhaltung von Gesetzen und internen Regeln?", ["Steuererklärung","Compliance","Kundenservice","Qualitätsprüfung"], 1, "Compliance bedeutet Regeltreue. Verstöße können Bußgelder, Schadensersatz und Imageschäden nach sich ziehen."],
  ["wiso", "w", "Ein Mitarbeiter erhält eine E-Mail, angeblich von der Hausbank des Unternehmens.\n\nWoran erkennt man eine Phishing-Mail?", ["Persönliche Anrede und bekannte Absenderdomain der Bank","Zeitdruck und Aufforderung, Zugangsdaten einzugeben","Fehlender Anhang und Hinweis auf die Datenschutzerklärung","Kurzer Text und Verzicht auf Links oder Anhänge"], 1, "Typische Merkmale: Zeitdruck oder Drohung, Link auf eine fremde Domain, Aufforderung zur Eingabe von Zugangsdaten, unpersönliche Anrede. Banken fragen nie per E-Mail nach Passwörtern."]
];

// Offene Fragen für den Real-Modus: Punkte p, Lösung a
const OPEN = [
  // ---------- Teil 1: Projektmanagement & Anforderungen
  { teil: "t1", cat: "pm", p: 8, q: "Ein Pflegedienst führt eine App zur Tourenplanung ein. Beschreiben Sie für zwei Stakeholder jeweils eine Erwartung, eine Befürchtung und eine geeignete Maßnahme.", a: "Pflegekräfte: Erwartung weniger Papier, Befürchtung Überwachung/Überforderung, Maßnahme frühe Einbindung, Schulung.\nGeschäftsführung: Erwartung effizientere Touren, Befürchtung Kostenüberschreitung, Maßnahme Kostencontrolling, Meilensteine.\nBetriebsrat: Erwartung faire Arbeitszeiten, Befürchtung Leistungskontrolle, Maßnahme Betriebsvereinbarung.\nJe Stakeholder 4 P (Erwartung, Befürchtung, Maßnahme, Bezug zur Situation)." },
  { teil: "t1", cat: "pm", p: 8, q: "Nennen Sie zwei Risiken für die Einführung einer neuen Warenwirtschaft und beschreiben Sie jeweils Ursache, Auswirkung und Gegenmaßnahme.", a: "Datenmigration fehlerhaft – Ursache: uneinheitliche Altdaten – Auswirkung: falsche Bestände – Gegenmaßnahme: Datenbereinigung, Testmigration.\nTerminverzug – Ursache: Aufwand unterschätzt – Auswirkung: Mehrkosten – Gegenmaßnahme: Puffer, Meilensteine, agile Planung.\nAkzeptanzprobleme – Ursache: fehlende Einbindung – Auswirkung: Nutzung bleibt aus – Gegenmaßnahme: Schulungen, Key-User.\nJe Risiko 4 P." },
  { teil: "t1", cat: "pm", p: 4, q: "Erläutern Sie den Unterschied zwischen klassischem und agilem Projektmanagement.", a: "Klassisch: lineare Phasen, Anforderungen vorab festgelegt (Lastenheft/Pflichtenheft), Änderungen aufwendig.\nAgil: iterativ in kurzen Zyklen, Anforderungen werden laufend angepasst, Kunde eng eingebunden, früh lauffähige Teilergebnisse." },
  { teil: "t1", cat: "pm", p: 4, q: "Begründen Sie, ob Sie für eine App mit noch unklaren Anforderungen agil oder klassisch vorgehen würden.", a: "Agil (z. B. Scrum): Anforderungen können nach jedem Sprint angepasst werden, frühes Feedback der Nutzer reduziert Fehlentwicklungen. Entscheidung 1 P, Begründung 3 P." },
  { teil: "t1", cat: "pm", p: 6, q: "Beschreiben Sie die drei Rollen in Scrum.", a: "Product Owner: verantwortet das Product Backlog und die Prioritäten, vertritt die Stakeholder.\nScrum Master: sorgt für die Einhaltung von Scrum, beseitigt Hindernisse.\nDevelopers: setzen die Backlog-Einträge im Sprint selbstorganisiert um." },
  { teil: "t1", cat: "pm", p: 6, q: "Formulieren Sie zwei User Stories für eine Kantinen-App (Speiseplan ansehen, Essen vorbestellen).", a: "Als Mitarbeiter möchte ich den Speiseplan der Woche sehen, damit ich mein Mittagessen planen kann.\nAls Mitarbeiter möchte ich ein Gericht bis 10 Uhr vorbestellen, damit es für mich reserviert ist.\nJe Story 3 P (Rolle, Funktion, Nutzen)." },
  { teil: "t1", cat: "pm", p: 4, q: "Unterscheiden Sie Lastenheft und Pflichtenheft.", a: "Lastenheft: vom Auftraggeber, beschreibt was gefordert ist.\nPflichtenheft: vom Auftragnehmer, beschreibt wie die Anforderungen umgesetzt werden." },
  { teil: "t1", cat: "pm", p: 6, q: "Nennen und erläutern Sie drei Kriterien einer Machbarkeitsstudie.", a: "Technisch (Infrastruktur, Know-how vorhanden?), wirtschaftlich (Kosten/Nutzen, Amortisation), organisatorisch (Personal, Zeit), rechtlich (Datenschutz, Lizenzen), Markt (Bedarf, Konkurrenz). Je 2 P." },
  { teil: "t1", cat: "pm", p: 4, q: "Nennen Sie je zwei funktionale und zwei nichtfunktionale Anforderungen an ein Online-Ticketsystem für ein Theater.", a: "Funktional: Sitzplatz auswählen, Ticket bezahlen, Ticket als QR-Code erhalten, Buchung stornieren.\nNichtfunktional: Verfügbarkeit 99 %, Antwortzeit < 2 s, Barrierefreiheit, sichere Zahlungsabwicklung (TLS)." },
  { teil: "t1", cat: "pm", p: 4, q: "Beschreiben Sie zwei Möglichkeiten, nach Projektende den Projekterfolg zu prüfen.", a: "Soll-Ist-Vergleich mit Pflichtenheft (Funktionen), Budget und Termin; Befragung der Nutzer zur Zufriedenheit; Kennzahlen vorher/nachher (z. B. Bearbeitungszeit); Abnahmeprotokoll; Lessons Learned." },
  { teil: "t1", cat: "pm", p: 4, q: "Nennen Sie vier Kostenarten in einem Softwareprojekt mit Beispiel.", a: "Personalkosten (Entwicklergehälter), Hardwarekosten (Server, Scanner), Softwarekosten (Lizenzen), Schulungskosten (Trainer), externe Dienstleister, Betriebskosten (Cloud). Je 1 P." },
  { teil: "t1", cat: "pm", p: 20, q: "Netzplan. Vorgänge (Dauer in Tagen, Vorgänger): A Analyse 4, –; B Datenbank 6, A; C Oberfläche 5, A; D Schnittstelle 3, A; E Logik 7, B; F Test 4, C, D, E; G Doku 3, C; H Einführung 2, F, G.\na) Berechnen Sie FAZ, FEZ, SAZ, SEZ, GP und FP (14 P).\nb) Kritischer Pfad und Projektdauer (3 P).\nc) Was bedeutet ein freier Puffer von 0 bei einem Vorgang mit Gesamtpuffer > 0? (3 P)", a: "A 0|4|0|4 GP0 FP0\nB 4|10|4|10 GP0 FP0\nC 4|9|12|17 GP8 FP0\nD 4|7|14|17 GP10 FP10\nE 10|17|10|17 GP0 FP0\nF 17|21|17|21 GP0 FP0\nG 9|12|18|21 GP9 FP9\nH 21|23|21|23 GP0 FP0\n\nb) A – B – E – F – H, 23 Tage.\nc) Der Vorgang kann sich zwar verschieben, ohne das Projektende zu gefährden, aber jede Verschiebung verschiebt sofort einen Nachfolger (bei C: G beginnt sonst später)." },
  { teil: "t1", cat: "pm", p: 3, q: "Was versteht man unter Lessons Learned?", a: "Am Projektende gesammelte positive und negative Erfahrungen, dokumentiert, damit künftige Projekte davon profitieren." },
  { teil: "t1", cat: "pm", p: 4, q: "Nennen Sie zwei Vor- und Nachteile, die Softwareentwicklung an einen externen Dienstleister zu vergeben (Outsourcing).", a: "Vorteile: Know-how von Spezialisten, planbare Kosten (Festpreis), interne Ressourcen frei.\nNachteile: Abhängigkeit, Know-how-Verlust, Abstimmungsaufwand, Datenschutzrisiken." },
  // ---------- Teil 1: Modellierung & OOP
  { teil: "t1", cat: "mod", p: 14, q: "Use-Case-Diagramm Bibliothek: Leser können Medien suchen, ausleihen und verlängern. Zum Ausleihen und Verlängern müssen sie sich anmelden. Ist ein Medium ausgeliehen, kann der Leser es optional vormerken (beim Suchen). Mitarbeitende können ebenfalls ausleihen und zusätzlich Medien erfassen und Mahnungen versenden. Mitarbeitende sind spezielle Leser.\nErstellen Sie das Use-Case-Diagramm.", a: "Systemgrenze „Bibliothekssystem“ (1 P).\nAkteure: Leser, Mitarbeiter; Generalisierung Mitarbeiter → Leser (3 P).\nAnwendungsfälle: Medium suchen, Medium ausleihen, Ausleihe verlängern, Anmelden, Medium vormerken, Medium erfassen, Mahnung versenden (7 P).\nBeziehungen: ausleihen <<include>> anmelden, verlängern <<include>> anmelden, vormerken <<extend>> suchen (3 P)." },
  { teil: "t1", cat: "mod", p: 13, q: "Klassendiagramm: Ein Online-Kurs-Anbieter hat Kurse (Titel, Preis). Es gibt Videokurse (Dauer in Minuten) und Livekurse (Termin, maxTeilnehmer). Jeder Kurs hat genau einen Dozenten (Name, Fachgebiet), ein Dozent hält beliebig viele Kurse. Teilnehmer (Name, Email) buchen Kurse; eine Buchung hat ein Datum. Alle Kurse haben getPreis(): Double; Livekurse berechnen 10 % Zuschlag.\nErstellen Sie das Klassendiagramm mit Sichtbarkeiten, Datentypen und Multiplizitäten.", a: "{abstract} Kurs: - titel: String, - preis: Double, + getPreis(): Double\nVideokurs (erbt): - dauer: Integer\nLivekurs (erbt): - termin: DateTime, - maxTeilnehmer: Integer, + getPreis(): Double (überschrieben)\nDozent: - name: String, - fachgebiet: String\nTeilnehmer: - name: String, - email: String\nBuchung: - datum: Date\nDozent 1 — 0..* Kurs; Teilnehmer 1 — 0..* Buchung; Buchung 0..* — 1 Kurs.\nKlassen je 1 P, Attribute/Typen 4 P, Vererbung 2 P, Beziehungen mit Multiplizität 3 P." },
  { teil: "t1", cat: "mod", p: 4, q: "Erklären Sie Polymorphie an einem selbst gewählten Beispiel.", a: "Methode flaeche() in Oberklasse Form, überschrieben in Kreis und Rechteck. Eine Liste von Formen wird durchlaufen und form.flaeche() aufgerufen; zur Laufzeit wird je nach Objekt die passende Implementierung ausgeführt (dynamisches Binden)." },
  { teil: "t1", cat: "mod", p: 4, q: "Unterscheiden Sie Aggregation und Komposition und nennen Sie je ein Beispiel.", a: "Beide Ganzes-Teil-Beziehungen. Aggregation (leere Raute): Teil existiert unabhängig (Team – Mitarbeiter). Komposition (gefüllte Raute): Teil ist existenzabhängig (Rechnung – Rechnungsposition)." },
  { teil: "t1", cat: "mod", p: 4, q: "Unterscheiden Sie abstrakte Klasse und Interface.", a: "Abstrakte Klasse: kann Attribute und implementierte Methoden enthalten, Einfachvererbung, nicht instanziierbar.\nInterface: nur Methodensignaturen (Vertrag), eine Klasse kann mehrere implementieren." },
  { teil: "t1", cat: "mod", p: 5, q: "Beschreiben Sie das Singleton-Muster und wie es umgesetzt wird.", a: "Erzeugungsmuster: Es gibt genau eine Instanz einer Klasse mit globalem Zugriffspunkt, z. B. für eine Konfiguration oder Datenbankverbindung. Umsetzung: privater Konstruktor, privates statisches Attribut instance, öffentliche statische Methode getInstance(), die die Instanz bei Bedarf erzeugt und zurückgibt." },
  { teil: "t1", cat: "mod", p: 5, q: "Erläutern Sie das Observer-Muster an einem Wetterstation-Beispiel.", a: "Die Wetterstation (Subjekt) hält eine Liste von Beobachtern (Anzeige, App, Logger). Sie bietet addObserver() und notifyObservers(). Bei neuen Messwerten ruft sie bei allen Beobachtern update() auf. Vorteil: lose Kopplung, neue Anzeigen ohne Änderung der Station." },
  { teil: "t1", cat: "mod", p: 5, q: "Erläutern Sie das Factory-Muster und seinen Vorteil.", a: "Die Erzeugung von Objekten wird in eine Fabrikmethode ausgelagert, z. B. createBesucher(typ) liefert je nach Typ StandardBesucher oder VipBesucher. Der Aufrufer arbeitet nur mit der Oberklasse/dem Interface. Vorteil: neue Typen ohne Änderung des aufrufenden Codes, zentrale Erzeugungslogik." },
  { teil: "t1", cat: "mod", p: 4, q: "Beschreiben Sie das MVC-Muster.", a: "Model: Daten und Geschäftslogik. View: Darstellung. Controller: nimmt Eingaben entgegen, ruft das Model auf und aktualisiert die View. Vorteil: Trennung von Darstellung und Logik, bessere Wartbarkeit und Testbarkeit." },
  { teil: "t1", cat: "mod", p: 12, q: "Zustandsdiagramm Bestellung: Eine Bestellung ist zunächst offen. Nach Zahlungseingang ist sie bezahlt; wird sie vorher storniert, ist sie storniert. Eine bezahlte Bestellung wird versendet und ist dann unterwegs; bei Zustellung ist sie zugestellt. Geht ein Paket zurück, ist sie retourniert und wird nach Erstattung abgeschlossen. Zugestellte Bestellungen werden nach 14 Tagen abgeschlossen.", a: "● → offen\noffen → bezahlt: Zahlungseingang\noffen → storniert: stornieren\nbezahlt → unterwegs: versenden\nunterwegs → zugestellt: zustellen\nunterwegs → retourniert: Rücksendung\nretourniert → abgeschlossen: erstatten / Gutschrift\nzugestellt → abgeschlossen: nach 14 Tagen\nstorniert, abgeschlossen → ◉\nZustände je 1 P (7), Übergänge mit Beschriftung je 0,5–1 P (5)." },
  { teil: "t1", cat: "mod", p: 15, q: "Aktivitätsdiagramm Urlaubsantrag mit Partitionen Mitarbeiter, Vorgesetzter, Personalabteilung: Der Mitarbeiter stellt den Antrag. Der Vorgesetzte prüft die Personalplanung. Lehnt er ab, wird der Mitarbeiter informiert (Ende). Genehmigt er, prüft die Personalabteilung den Resturlaub. Reicht er nicht, Ablehnung an den Mitarbeiter (Ende). Sonst parallel: Urlaub im System buchen und Kalendereintrag erstellen; danach Bestätigung an den Mitarbeiter.", a: "Mitarbeiter: ● → [Antrag stellen]\nVorgesetzter: [Personalplanung prüfen] → ◇ [abgelehnt] → [Mitarbeiter informieren] → ◉ / [genehmigt]\nPersonalabteilung: [Resturlaub prüfen] → ◇ [nicht ausreichend] → [Ablehnung senden] → ◉ / [ausreichend] → Fork\n  [Urlaub buchen] ‖ [Kalendereintrag erstellen] → Join → [Bestätigung senden] → ◉\nAktionen je 1 P (7), Verzweigungen mit Bedingungen je 2 P (4), Fork/Join 2 P, Partitionen/Start/Ende 2 P." },
  // ---------- Teil 1: Sicherheit & Netzwerk
  { teil: "t1", cat: "sec", p: 6, q: "Erklären Sie, wie TLS eine Verbindung absichert. Gehen Sie auf Zertifikat und hybride Verschlüsselung ein.", a: "Server sendet sein von einer CA signiertes Zertifikat, der Client prüft die Echtheit. Mit asymmetrischen Verfahren wird ein gemeinsamer Sitzungsschlüssel ausgehandelt. Die Nutzdaten werden symmetrisch verschlüsselt (schnell). Ergebnis: Vertraulichkeit, Integrität, Authentizität des Servers." },
  { teil: "t1", cat: "sec", p: 4, q: "Wie sollten Passwörter in einer Datenbank gespeichert werden? Begründen Sie.", a: "Als Hash mit langsamer Hashfunktion (bcrypt/Argon2) und individuellem Salt. Kein Klartext und keine umkehrbare Verschlüsselung; Salt verhindert Rainbow-Table-Angriffe und gleiche Hashes bei gleichen Passwörtern." },
  { teil: "t1", cat: "sec", p: 6, q: "Erklären Sie SQL-Injection an einem Beispiel und nennen Sie zwei Gegenmaßnahmen.", a: "Eingaben werden ungeprüft in SQL eingesetzt. Eingabe  ' OR '1'='1  im Passwortfeld macht die WHERE-Bedingung immer wahr → Anmeldung ohne Passwort. Gegenmaßnahmen: Prepared Statements, Eingabevalidierung, minimale DB-Rechte, ORM." },
  { teil: "t1", cat: "sec", p: 6, q: "Nennen Sie die drei Schutzziele der Informationssicherheit und je eine Maßnahme.", a: "Vertraulichkeit – Verschlüsselung, Zugriffsrechte. Integrität – Hashes/Signaturen, Protokollierung. Verfügbarkeit – Backups, Redundanz, USV, DDoS-Schutz." },
  { teil: "t1", cat: "sec", p: 4, q: "Unterscheiden Sie symmetrische und asymmetrische Verschlüsselung.", a: "Symmetrisch: ein gemeinsamer Schlüssel, schnell, Problem der Schlüsselverteilung (AES). Asymmetrisch: Schlüsselpaar öffentlich/privat, kein vorheriger Austausch, langsamer (RSA)." },
  { teil: "t1", cat: "sec", p: 4, q: "Wie funktioniert eine digitale Signatur und welche Schutzziele sichert sie?", a: "Absender bildet Hash der Nachricht und verschlüsselt ihn mit seinem privaten Schlüssel. Empfänger entschlüsselt mit dem öffentlichen Schlüssel und vergleicht mit eigenem Hash. Sichert Integrität und Authentizität (Verbindlichkeit)." },
  { teil: "t1", cat: "sec", p: 4, q: "Ein Kollege schlägt vor, Sensordaten nur mit einem Hash statt mit Verschlüsselung zu übertragen. Bewerten Sie den Vorschlag.", a: "Ein Hash (besser HMAC mit geheimem Schlüssel) sichert Integrität und erkennt Manipulation, aber keine Vertraulichkeit. Sind die Daten nicht geheim, ist das sinnvoll und spart Rechenleistung. Ein reiner Hash ohne Schlüssel kann vom Angreifer neu berechnet werden." },
  { teil: "t1", cat: "sec", p: 4, q: "Nennen Sie je einen Vor- und Nachteil von Single Sign-On.", a: "Vorteil: ein Login für viele Dienste, zentrale Rechteverwaltung, schnelles Sperren. Nachteil: Ein kompromittierter Zugang öffnet alle Dienste, Abhängigkeit vom Identity Provider." },
  { teil: "t1", cat: "sec", p: 3, q: "Was ist ein Man-in-the-Middle-Angriff und wie schützt man sich?", a: "Angreifer sitzt unbemerkt zwischen den Kommunikationspartnern und liest oder manipuliert Daten. Schutz: TLS mit Zertifikatsprüfung, VPN, keine offenen WLANs ohne Verschlüsselung." },
  { teil: "t1", cat: "sec", p: 3, q: "Erklären Sie einen DDoS-Angriff und eine Gegenmaßnahme.", a: "Viele gekaperte Systeme (Botnetz) überlasten einen Dienst mit Anfragen, Ziel ist die Verfügbarkeit. Gegenmaßnahmen: Rate Limiting, Filter, CDN/DDoS-Schutzdienst, Skalierung." },
  { teil: "t1", cat: "sec", p: 4, q: "Beschreiben Sie das Grundprinzip von Kerberos.", a: "Authentifizierung über ein Key Distribution Center. Der Nutzer meldet sich einmal an und erhält ein Ticket Granting Ticket; damit bekommt er Service-Tickets für einzelne Dienste. Das Passwort wird nicht über das Netz geschickt. Grundlage für SSO im Active Directory." },
  { teil: "t1", cat: "sec", p: 4, q: "Nennen Sie vier technisch-organisatorische Maßnahmen nach DSGVO.", a: "Zutrittskontrolle (Serverraum), Zugangskontrolle (Passwörter, 2FA), Zugriffskontrolle (Rollen), Weitergabekontrolle (Verschlüsselung), Eingabekontrolle (Protokollierung), Verfügbarkeitskontrolle (Backup)." },
  { teil: "t1", cat: "sec", p: 6, q: "Ordnen Sie zu und begründen Sie: Rechenzentrum mit hohem Speicherbedarf, Bürogebäude, Bodenfeuchtesensoren auf einem Feld. Netzwerkkonzepte: LAN, SAN, LPWAN.", a: "Rechenzentrum – SAN: schneller Blockzugriff auf zentralen Speicher, skalierbar.\nBüro – LAN: hohe Bandbreite, geringe Latenz, Ressourcen teilen.\nFeld – LPWAN (LoRaWAN): große Reichweite, sehr geringer Energieverbrauch, geringe Datenmengen. Je Zuordnung 1 P, Begründung 1 P." },
  { teil: "t1", cat: "sec", p: 3, q: "Beschreiben Sie den Aufbau einer MAC-Adresse.", a: "48 Bit (6 Byte), hexadezimal geschrieben. Die ersten 3 Byte sind die Herstellerkennung (OUI), die letzten 3 Byte die Gerätenummer." },
  { teil: "t1", cat: "sec", p: 4, q: "Unterscheiden Sie Switch und Router.", a: "Switch: verbindet Geräte innerhalb eines Netzes, leitet anhand der MAC-Adresse weiter (Schicht 2). Router: verbindet verschiedene Netze, leitet anhand der IP-Adresse weiter (Schicht 3)." },
  { teil: "t1", cat: "sec", p: 6, q: "Erläutern Sie CI/CD und nennen Sie zwei Vorteile.", a: "Continuous Integration: Codeänderungen werden häufig zusammengeführt und automatisch gebaut und getestet. Continuous Delivery/Deployment: automatisierte Auslieferung über Pipelines. Vorteile: Fehler früh erkannt, einheitliche Umgebungen, schnelle Rollbacks, keine manuellen Zugriffe auf Produktion nötig." },
  { teil: "t1", cat: "sec", p: 4, q: "Nennen Sie vier Rechte betroffener Personen nach DSGVO.", a: "Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit, Widerspruch." },
  // ---------- Teil 1: Web, UI & Qualität
  { teil: "t1", cat: "ux", p: 4, q: "Erläutern Sie zwei Prinzipien einer REST-API.", a: "Ressourcen über eindeutige URLs; einheitliche Schnittstelle mit HTTP-Methoden; zustandslos; Client-Server-Trennung; Darstellung meist JSON." },
  { teil: "t1", cat: "ux", p: 4, q: "Ordnen Sie den CRUD-Operationen die HTTP-Methoden zu.", a: "Create – POST, Read – GET, Update – PUT/PATCH, Delete – DELETE." },
  { teil: "t1", cat: "ux", p: 3, q: "Erklären Sie die Statuscode-Klassen 2xx, 4xx und 5xx.", a: "2xx Erfolg (200, 201), 4xx Fehler des Clients (400, 401, 404), 5xx Fehler des Servers (500, 503)." },
  { teil: "t1", cat: "ux", p: 3, q: "GET https://api.wetter.de/v1/forecast?city=Mainz&days=3&units=metric – beschreiben Sie die Bestandteile der URL.", a: "https: Protokoll, api.wetter.de: Host, /v1/forecast: Pfad/Endpunkt (Version 1), ?city=Mainz&days=3&units=metric: Query-Parameter (Ort, Anzahl Tage, Einheiten)." },
  { teil: "t1", cat: "ux", p: 4, q: "Unterscheiden Sie wohlgeformtes und gültiges XML.", a: "Wohlgeformt: Syntaxregeln erfüllt (genau ein Wurzelelement, Tags korrekt geschlossen und verschachtelt, Attribute in Anführungszeichen). Gültig: zusätzlich konform zu DTD oder XML-Schema; setzt Wohlgeformtheit voraus." },
  { teil: "t1", cat: "ux", p: 8, q: "Beschreiben Sie zwei Anforderungen an barrierefreie Software und je eine Maßnahme.", a: "Wahrnehmbar für Sehbehinderte – Alternativtexte, Screenreader-Unterstützung, hoher Kontrast, skalierbare Schrift.\nBedienbar ohne Maus – vollständige Tastaturbedienung, sichtbarer Fokus.\nVerständlich – einfache Sprache, klare Fehlermeldungen.\nFarbunabhängig – Informationen nicht nur über Farbe. Je Anforderung 2 P, Maßnahme 2 P." },
  { teil: "t1", cat: "ux", p: 4, q: "Nennen Sie zwei Vorteile von Mockups in der App-Entwicklung.", a: "Frühes Feedback vom Kunden, Missverständnisse werden vor der Programmierung erkannt, Änderungen sind günstig, Grundlage für Entwicklung und Usability-Tests." },
  { teil: "t1", cat: "ux", p: 6, q: "Skizzieren Sie in Stichpunkten ein Mockup für eine Seite „Neuen Patienten anlegen“ und begründen Sie zwei Gestaltungsentscheidungen.", a: "Überschrift, beschriftete Eingabefelder (Name, Vorname, Geburtsdatum mit Datumsauswahl), Auswahlfeld Krankenkasse, Pflichtfelder markiert, Buttons Speichern und Abbrechen.\nBegründung: Auswahlfeld vermeidet Tippfehler, Datumsauswahl verhindert falsche Formate, klare Primäraktion." },
  { teil: "t1", cat: "ux", p: 5, q: "Beschreiben Sie das Qualitätsmerkmal Zuverlässigkeit nach ISO/IEC 25010 und ein weiteres Merkmal.", a: "Zuverlässigkeit: Software erbringt ihre Funktion unter festgelegten Bedingungen über einen Zeitraum (Reife, Verfügbarkeit, Fehlertoleranz, Wiederherstellbarkeit).\nWeiteres z. B. Wartbarkeit: Änderungen und Fehlerbehebungen sind mit geringem Aufwand möglich." },
  { teil: "t1", cat: "ux", p: 4, q: "Nennen Sie vier qualitätssichernde Maßnahmen in der Softwareentwicklung.", a: "Code-Reviews, automatisierte Tests in CI, Coding-Standards, statische Codeanalyse, Pair Programming, standardisiertes Vorgehensmodell, Testkonzept." },
  { teil: "t1", cat: "ux", p: 6, q: "Beschreiben Sie sechs Inhalte eines Testkonzepts.", a: "Testziele, Teststufen, Testmethoden, Testumgebung, Testdaten, Verantwortlichkeiten, Zeitplan, Ende-Kriterien, Dokumentation der Ergebnisse. Je 1 P." },
  { teil: "t1", cat: "ux", p: 4, q: "Beschreiben Sie den typischen Aufbau einer Webanwendung (drei Schichten).", a: "Frontend/Präsentation im Browser, Backend/Applikationsserver mit Geschäftslogik und API, Datenbank. Das Frontend ruft per HTTP das Backend auf, das Backend greift auf die Datenbank zu." },
  { teil: "t1", cat: "ux", p: 3, q: "Schreiben Sie einen JSON-Datensatz für einen Kunden mit Name, Kundennummer und zwei Telefonnummern.", a: "{\n  \"name\": \"Lena Weber\",\n  \"kundennummer\": 1042,\n  \"telefon\": [\"06131 123456\", \"0171 987654\"]\n}" },

  // ---------- Teil 2: Pseudocode
  { teil: "t2", cat: "algo", p: 15, q: UEB_TEXT("P1"), a: UEB_LOES("P1") },
  { teil: "t2", cat: "algo", p: 20, q: UEB_TEXT("P2"), a: UEB_LOES("P2") },
  { teil: "t2", cat: "algo", p: 20, q: UEB_TEXT("P3"), a: UEB_LOES("P3") },
  { teil: "t2", cat: "algo", p: 15, q: UEB_TEXT("P4"), a: UEB_LOES("P4") },
  { teil: "t2", cat: "algo", p: 20, q: UEB_TEXT("P5"), a: UEB_LOES("P5") },
  { teil: "t2", cat: "algo", p: 20, q: "Ein Lager verwaltet List<Artikel>. Artikel hat getNr(), getBestand(), getMindestbestand(), getLieferant(): String.\nEntwickeln Sie nachbestellen(lager: List<Artikel>, lieferant: String) : List<Integer>.\nSie liefert die Nummern aller Artikel des angegebenen Lieferanten, deren Bestand unter dem Mindestbestand liegt. Gibt es keine, wird eine leere Liste zurückgegeben.", a: "nachbestellen(lager: List<Artikel>, lieferant: String) : List<Integer>\n  ergebnis = new List<Integer>()\n  für i = 0 bis lager.size() - 1\n    a = lager.get(i)\n    wenn a.getLieferant() == lieferant und a.getBestand() < a.getMindestbestand() dann\n      ergebnis.add(a.getNr())\n    ende wenn\n  ende für\n  Rückgabe ergebnis\nende nachbestellen\nListe 3 P, Schleife 5 P, beide Bedingungen 8 P, Rückgabe 4 P." },
  { teil: "t2", cat: "algo", p: 15, q: "Ein Passwort soll geprüft werden: mindestens 10 Zeichen, mindestens eine Ziffer und mindestens ein Großbuchstabe. Verfügbar: laenge(s), zeichenAn(s, i), istZiffer(c), istGross(c).\nEntwickeln Sie pruefePasswort(pw: String) : Boolean.", a: "pruefePasswort(pw: String) : Boolean\n  wenn laenge(pw) < 10 dann\n    Rückgabe false\n  ende wenn\n  ziffer = false\n  gross = false\n  für i = 0 bis laenge(pw) - 1\n    c = zeichenAn(pw, i)\n    wenn istZiffer(c) dann ziffer = true ende wenn\n    wenn istGross(c) dann gross = true ende wenn\n  ende für\n  Rückgabe ziffer und gross\nende pruefePasswort\nLängenprüfung (>= 10!) 3 P, Flags 3 P, Schleife bis laenge − 1 4 P, Prüfungen 3 P, Rückgabe 2 P." },
  { teil: "t2", cat: "algo", p: 20, q: "Raumbuchungen liegen als Array buchungen: Buchung[] vor. Buchung hat getRaum(): Integer, getStart(): Integer und getEnde(): Integer (Minuten seit Mitternacht).\nEntwickeln Sie istFrei(buchungen: Buchung[], raum: Integer, start: Integer, ende: Integer) : Boolean.\nDer Raum ist frei, wenn keine Buchung dieses Raums sich mit dem Zeitraum überschneidet. Zwei Zeiträume überschneiden sich, wenn start1 < ende2 und start2 < ende1.", a: "istFrei(buchungen: Buchung[], raum: Integer, start: Integer, ende: Integer) : Boolean\n  für i = 0 bis buchungen.length - 1\n    b = buchungen[i]\n    wenn b.getRaum() == raum und start < b.getEnde() und b.getStart() < ende dann\n      Rückgabe false\n    ende wenn\n  ende für\n  Rückgabe true\nende istFrei\nSchleife 5 P, Raumvergleich 4 P, Überschneidung korrekt 7 P, Rückgaben 4 P." },
  { teil: "t2", cat: "algo", p: 10, q: "Schreiben Sie eine rekursive Funktion quersumme(n: Integer) : Integer (z. B. quersumme(472) = 13) und nennen Sie je einen Vor- und Nachteil der Rekursion.", a: "quersumme(n: Integer) : Integer\n  wenn n < 10 dann\n    Rückgabe n\n  ende wenn\n  Rückgabe (n mod 10) + quersumme(n div 10)\nende quersumme\nVorteil: kurz und elegant bei rekursiven Problemen. Nachteil: Speicherbedarf auf dem Stack, Gefahr Stack Overflow. Code 6 P, Vor-/Nachteil 4 P." },
  { teil: "t2", cat: "algo", p: 5, q: "Führen Sie einen Schreibtischtest durch und geben Sie die Ausgabe an:\nx = 1\nfür i = 1 bis 4\n  wenn i mod 2 == 0 dann\n    x = x * i\n  sonst\n    x = x + i\n  ende wenn\nende für\nAusgabe(x)", a: "i=1: x = 1 + 1 = 2\ni=2: x = 2 · 2 = 4\ni=3: x = 4 + 3 = 7\ni=4: x = 7 · 4 = 28\nAusgabe: 28" },
  { teil: "t2", cat: "algo", p: 10, q: "Implementieren Sie Bubble Sort für ein Array mitarbeiter: Mitarbeiter[], aufsteigend nach getEintritt() (Date-Werte sind mit < vergleichbar).", a: "für i = 0 bis mitarbeiter.length - 2\n  für j = 0 bis mitarbeiter.length - 2 - i\n    wenn mitarbeiter[j].getEintritt() > mitarbeiter[j + 1].getEintritt() dann\n      tmp = mitarbeiter[j]\n      mitarbeiter[j] = mitarbeiter[j + 1]\n      mitarbeiter[j + 1] = tmp\n    ende wenn\n  ende für\nende für" },
  { teil: "t2", cat: "algo", p: 5, q: "Erklären Sie, warum Pseudocode in der Prüfung statt einer konkreten Programmiersprache verwendet wird, und nennen Sie zwei Regeln für gut lesbaren Pseudocode.", a: "Unabhängig von einer Sprache und für Dritte verständlich. Regeln: einheitliche Schlüsselwörter (wenn/ende wenn), Einrückung, sprechende Variablennamen, Datentypen bei Parametern angeben." },
  // ---------- Teil 2: SQL (Schema Kunde/Artikel/Bestellung/Position)
  { teil: "t2", cat: "sql", p: 16, schema: true, q: UEB_TEXT("S1"), a: UEB_LOES("S1") },
  { teil: "t2", cat: "sql", p: 13, schema: true, q: UEB_TEXT("S2"), a: UEB_LOES("S2") },
  { teil: "t2", cat: "sql", p: 15, schema: true, q: UEB_TEXT("S3"), a: UEB_LOES("S3") },
  { teil: "t2", cat: "sql", p: 16, schema: true, q: UEB_TEXT("S4"), a: UEB_LOES("S4") },
  { teil: "t2", cat: "sql", p: 3, schema: true, q: "Geben Sie die Anzahl der Artikel je Kategorie aus.", a: "SELECT Kategorie, COUNT(*) AS Anzahl\nFROM Artikel\nGROUP BY Kategorie;" },
  { teil: "t2", cat: "sql", p: 4, schema: true, q: "Geben Sie alle Kategorien aus, deren Durchschnittspreis über 50 € liegt, absteigend nach Durchschnittspreis.", a: "SELECT Kategorie, AVG(Preis) AS Schnitt\nFROM Artikel\nGROUP BY Kategorie\nHAVING AVG(Preis) > 50\nORDER BY Schnitt DESC;" },
  { teil: "t2", cat: "sql", p: 5, schema: true, q: "Geben Sie Name und Anzahl Bestellungen aller Kunden mit mindestens 5 Bestellungen aus.", a: "SELECT K.Name, COUNT(B.BID) AS Anzahl\nFROM Kunde AS K\nINNER JOIN Bestellung AS B ON B.KID = K.KID\nGROUP BY K.KID, K.Name\nHAVING COUNT(B.BID) >= 5;" },
  { teil: "t2", cat: "sql", p: 3, schema: true, q: "Setzen Sie den Status der Bestellung 1005 auf 'storniert'.", a: "UPDATE Bestellung SET Status = 'storniert' WHERE BID = 1005;" },
  { teil: "t2", cat: "sql", p: 4, schema: true, q: "Geben Sie alle offenen Bestellungen (Status 'offen') aus dem Oktober 2026 mit dem Namen des Kunden aus, sortiert nach Datum.", a: "SELECT B.BID, B.Datum, K.Name\nFROM Bestellung AS B\nINNER JOIN Kunde AS K ON K.KID = B.KID\nWHERE B.Status = 'offen'\n  AND B.Datum BETWEEN '2026-10-01' AND '2026-10-31'\nORDER BY B.Datum;" },
  { teil: "t2", cat: "sql", p: 6, schema: true, q: "Ermitteln Sie für jeden Artikel die insgesamt verkaufte Menge, auch für Artikel, die nie verkauft wurden (dann 0).", a: "SELECT A.ArtNr, A.Bezeichnung, COALESCE(SUM(P.Menge), 0) AS Menge\nFROM Artikel AS A\nLEFT JOIN Position AS P ON P.ArtNr = A.ArtNr\nGROUP BY A.ArtNr, A.Bezeichnung;\n(Ohne COALESCE NULL statt 0 – mit Hinweis ebenfalls volle Punktzahl.)" },
  { teil: "t2", cat: "sql", p: 4, schema: true, q: "Geben Sie alle Kunden aus, deren E-Mail-Adresse auf '@web.de' endet oder die keine E-Mail-Adresse haben.", a: "SELECT * FROM Kunde\nWHERE Email LIKE '%@web.de' OR Email IS NULL;" },
  { teil: "t2", cat: "sql", p: 6, schema: true, q: "Ermitteln Sie den Gesamtumsatz (Menge × Preis) je Monat im Jahr 2026.", a: "SELECT MONTH(B.Datum) AS Monat, SUM(P.Menge * A.Preis) AS Umsatz\nFROM Bestellung AS B\nINNER JOIN Position AS P ON P.BID = B.BID\nINNER JOIN Artikel AS A ON A.ArtNr = P.ArtNr\nWHERE YEAR(B.Datum) = 2026\nGROUP BY MONTH(B.Datum)\nORDER BY Monat;" },
  { teil: "t2", cat: "sql", p: 5, schema: true, q: "Ändern Sie die Spalte Email so, dass sie Pflichtfeld ist. Vorhandene NULL-Werte sollen vorher auf 'unbekannt@firma.de' gesetzt werden.", a: "UPDATE Kunde SET Email = 'unbekannt@firma.de' WHERE Email IS NULL;\nALTER TABLE Kunde MODIFY Email VARCHAR(100) NOT NULL;\n(je nach DBMS ALTER COLUMN)" },
  { teil: "t2", cat: "sql", p: 3, schema: true, q: "Legen Sie einen Benutzer 'controlling' an, der nur Bestellungen und Positionen lesen darf.", a: "CREATE USER controlling IDENTIFIED BY 'Start#2026';\nGRANT SELECT ON Bestellung TO controlling;\nGRANT SELECT ON Position TO controlling;" },
  { teil: "t2", cat: "sql", p: 6, q: "Erklären Sie Stored Procedure, Trigger und Index jeweils in einem Satz.", a: "Stored Procedure: in der Datenbank gespeicherte Folge von Anweisungen, die per Aufruf ausgeführt wird.\nTrigger: Prozedur, die automatisch bei INSERT/UPDATE/DELETE einer Tabelle ausgeführt wird.\nIndex: Zusatzstruktur zur schnelleren Suche und Sortierung über Spalten." },
  // ---------- Teil 2: Datenmodell
  { teil: "t2", cat: "dm", p: 25, q: UEB_TEXT("D1"), a: UEB_LOES("D1") },
  { teil: "t2", cat: "dm", p: 20, q: UEB_TEXT("D2"), a: UEB_LOES("D2") },
  { teil: "t2", cat: "dm", p: 20, q: "Ein Hotel speichert Gäste (Name, Adresse, Telefon), Zimmer (Nummer, Kategorie, Preis pro Nacht) und Buchungen (Anreise, Abreise). Eine Buchung gehört zu genau einem Gast und kann mehrere Zimmer umfassen. Zu jeder Buchung können Zusatzleistungen (Bezeichnung, Preis) mit Anzahl gebucht werden. Die Kategorie (Bezeichnung, Ausstattung) gilt für viele Zimmer.\nErstellen Sie das Relationenmodell in 3. NF mit PK, FK und Kardinalitäten.", a: "Gast (GastID [PK], Name, Strasse, PLZ, Ort, Telefon)\nKategorie (KatID [PK], Bezeichnung, Ausstattung)\nZimmer (ZimmerNr [PK], KatID [FK], PreisProNacht)\nBuchung (BuchungID [PK], GastID [FK], Anreise, Abreise)\nBuchung_Zimmer (BuchungID [PK, FK], ZimmerNr [PK, FK])\nLeistung (LeistungID [PK], Bezeichnung, Preis)\nBuchung_Leistung (BuchungID [PK, FK], LeistungID [PK, FK], Anzahl)\nBeziehungen: Gast 1:n Buchung, Kategorie 1:n Zimmer, Buchung 1:n Buchung_Zimmer n:1 Zimmer, Buchung 1:n Buchung_Leistung n:1 Leistung.\nPLZ/Ort für strenge 3. NF in eigene Tabelle Ort möglich." },
  { teil: "t2", cat: "dm", p: 14, q: "Erstellen Sie ein ER-Diagramm (Chen- oder Krähenfuß-Notation) mit Attributen: Ein Verein hat Mitglieder (Name, Geburtsdatum). Mitglieder gehören zu einer oder mehreren Abteilungen (Name); für jede Mitgliedschaft wird das Eintrittsdatum gespeichert. Jede Abteilung hat genau einen Leiter, der Mitglied ist.", a: "Entitäten: Mitglied (Name, Geburtsdatum), Abteilung (Name).\nBeziehung „gehört zu“ Mitglied m:n Abteilung mit Attribut Eintrittsdatum.\nBeziehung „leitet“ Mitglied 1 : n Abteilung (ein Mitglied kann mehrere Abteilungen leiten, jede Abteilung genau einen Leiter).\nEntitäten je 2 P, Attribute 4 P, Beziehungen mit Kardinalität je 3 P, Attribut an m:n 2 P." },
  { teil: "t2", cat: "dm", p: 6, q: "Erklären Sie Einfüge-, Änderungs- und Löschanomalie.", a: "Einfügeanomalie: Daten können nicht gespeichert werden, ohne andere unbekannte Daten mitzuerfassen.\nÄnderungsanomalie: redundante Daten müssen an mehreren Stellen geändert werden, sonst inkonsistent.\nLöschanomalie: Beim Löschen gehen ungewollt andere Informationen verloren." },
  { teil: "t2", cat: "dm", p: 5, q: "Eine Kamera macht pro Tag 300 Bilder mit 12 Megapixeln und 24 Bit Farbtiefe (unkomprimiert). Berechnen Sie den Speicherbedarf für 30 Tage in GiB (2 Nachkommastellen). Rechenweg angeben.", a: "12.000.000 Pixel × 3 Byte = 36.000.000 Byte pro Bild\n× 300 × 30 = 324.000.000.000 Byte\n÷ 1024³ = 301,75 GiB" },
  { teil: "t2", cat: "dm", p: 8, q: "Erklären Sie die vier ACID-Eigenschaften.", a: "Atomarität: Transaktion ganz oder gar nicht. Konsistenz: Datenbank vorher und nachher konsistent. Isolation: parallele Transaktionen beeinflussen sich nicht. Dauerhaftigkeit: bestätigte Änderungen bleiben auch nach Absturz erhalten. Je 2 P." },
  { teil: "t2", cat: "dm", p: 5, q: "Wägen Sie ab: Für einen Online-Shop mit sehr unterschiedlichen Produktattributen (Bücher, Kleidung, Elektronik) wird eine dokumentenorientierte Datenbank vorgeschlagen.", a: "Pro NoSQL: flexibles Schema für unterschiedliche Attribute, Produkt wird als Ganzes gelesen, gut skalierbar.\nContra: Bestellungen/Bezahlung brauchen Transaktionssicherheit und Konsistenz, Joins schwieriger.\nMögliches Fazit: Produktkatalog dokumentenorientiert, Bestellungen relational. Entscheidung 1 P, Argumente je 2 P." },

      ["INNER JOIN oder LEFT JOIN?", "Sollen auch Datensätze ohne Partner erscheinen (Kunden ohne Bestellung, Mitarbeiter ohne Urlaub), brauchst du LEFT JOIN. Bedingungen auf die rechte Tabelle gehören dann in ON, nicht in WHERE, und gezählt wird mit COUNT(spalte), nicht COUNT(*).", "SELECT M.Name, COUNT(U.UID) AS Urlaube\nFROM Mitarbeiter AS M\nLEFT JOIN Urlaub AS U ON U.MID = M.MID AND YEAR(U.Von) = 2026\nGROUP BY M.MID, M.Name;"],
      ["Unterabfragen", "Mit IN oder NOT IN (Artikel, die nie bestellt wurden), mit einem Vergleich (Preis = (SELECT MAX(Preis) …)) oder im FROM als abgeleitete Tabelle (Durchschnitt von Summen).", "DELETE FROM Artikel\nWHERE ArtNr NOT IN (SELECT ArtNr FROM Position);\n\nSELECT AVG(Anzahl) FROM (\n  SELECT COUNT(*) AS Anzahl FROM Verschreibung GROUP BY PID\n) AS t;"],
      ["Daten ändern", "INSERT INTO … VALUES, UPDATE … SET … WHERE, DELETE FROM … WHERE. Archivieren heißt: erst mit INSERT INTO … SELECT kopieren, dann löschen. Abhängige Datensätze (Fremdschlüssel) zuerst behandeln.", "INSERT INTO Archiv (ID, Datum, Wert)\n  SELECT ID, Datum, Wert FROM Messung WHERE Datum < '2025-01-01';\nDELETE FROM Messung WHERE Datum < '2025-01-01';"],
      ["Struktur ändern", "CREATE TABLE mit PRIMARY KEY und FOREIGN KEY … REFERENCES, ALTER TABLE … ADD / MODIFY / DROP COLUMN, CREATE INDEX. Wird eine Spalte zur Pflicht, vorher NULL-Werte füllen.", "CREATE TABLE Position (\n  BID INT NOT NULL,\n  ArtNr INT NOT NULL,\n  Menge INT NOT NULL,\n  PRIMARY KEY (BID, ArtNr),\n  FOREIGN KEY (BID) REFERENCES Bestellung(BID),\n  FOREIGN KEY (ArtNr) REFERENCES Artikel(ArtNr)\n);"],
      ["Rechte", "CREATE USER name IDENTIFIED BY 'pw'; GRANT SELECT, INSERT ON tabelle TO name; REVOKE INSERT ON tabelle FROM name."],
      ["Kleine Helfer", "LIKE mit % (beliebig viele Zeichen) und _ (genau ein Zeichen), BETWEEN, IS NULL, YEAR() und MONTH(), DISTINCT, UNION. Texte in einfachen Anführungszeichen."]

    kern: [
      ["Aktivitätsdiagramm", "Start (gefüllter Kreis), Aktionen (abgerundete Rechtecke), Entscheidungen und Zusammenführungen (Rauten), Bedingungen in eckigen Klammern an den ausgehenden Kanten, Parallelität mit Gabelung und Vereinigung (dicke Balken), Ende (Kreis mit Punkt). Steht im Text, wer etwas tut, gehören Partitionen (Swimlanes) dazu. Punkte gibt es meist je Aktion, je Verzweigung, für die Parallelisierung sowie Start, Ende und Partitionen."],

    kern: [
      ["Schutzziele", "Vertraulichkeit, Integrität, Verfügbarkeit, dazu Authentizität und Verbindlichkeit. Für jedes Ziel eine Maßnahme kennen."],
      ["Verschlüsselung", "Symmetrisch: ein gemeinsamer Schlüssel, schnell, Problem Schlüsselverteilung (AES). Asymmetrisch: öffentlicher und privater Schlüssel, langsamer, kein vorheriger Austausch (RSA). Hybrid: asymmetrisch einen Sitzungsschlüssel austauschen, Daten symmetrisch verschlüsseln. Genau so arbeitet TLS, auch bei der Transportverschlüsselung von E-Mails."],
      ["TLS-Ablauf", "Client verbindet sich, Server schickt sein Zertifikat, Client prüft die Signatur der CA, beide handeln einen Sitzungsschlüssel aus, danach symmetrische Verschlüsselung. Schützt Vertraulichkeit und Integrität und gegen Man-in-the-Middle."],
      ["Signatur, Hash, Passwörter", "Signatur: Hash der Nachricht mit privatem Schlüssel des Absenders, Prüfung mit dessen öffentlichem Schlüssel: Integrität und Authentizität. Hash: Einwegfunktion, erkennt Änderungen. Passwörter mit langsamem Verfahren (bcrypt, Argon2) und individuellem Salt hashen, nie verschlüsseln oder im Klartext speichern."],
      ["Authentifizierung", "Zwei-Faktor aus verschiedenen Kategorien (Wissen, Besitz, Biometrie). SSO: ein Login für viele Dienste, aber ein gestohlener Zugang öffnet alles. OAuth: Zugriff per Token ohne Passwortweitergabe. Kerberos: Tickets über ein Key Distribution Center, Basis von SSO im Active Directory. RADIUS: zentrale Anmeldung für WLAN und VPN."],
      ["Angriffe und Abwehr", "SQL-Injection: Prepared Statements. Man-in-the-Middle: TLS mit Zertifikatsprüfung, VPN. DDoS: Filter, Rate Limiting, CDN. Phishing: Schulung, 2FA, Absender und Links prüfen."],
      ["DSGVO und TOM", "Rechte: Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch. Verarbeitung braucht eine Rechtsgrundlage, etwa eine Einwilligung. Technisch-organisatorische Maßnahmen: Zutritts-, Zugangs-, Zugriffs-, Weitergabe-, Eingabe- und Verfügbarkeitskontrolle, Verschlüsselung, Pseudonymisierung."]

CARDS_RAW.algo.push(
  ["Ein Lager speichert sortierte Artikelnummern im Array werte: Integer[] mit n Elementen.\n\nEntwickeln Sie in Pseudocode die binäre Suche, die den Index von x liefert oder -1, wenn x nicht vorkommt. (6 P)", "links = 0\nrechts = n - 1\nsolange links <= rechts\n  mitte = (links + rechts) div 2\n  wenn werte[mitte] = x dann\n    Rückgabe mitte\n  sonst wenn werte[mitte] < x dann\n    links = mitte + 1\n  sonst\n    rechts = mitte - 1\n  ende wenn\nende solange\nRückgabe -1", "Grenzen initialisieren (1 P)\nSchleifenbedingung links <= rechts (1 P)\nMitte berechnen (1 P)\nTreffer zurückgeben (1 P)\nRichtige Hälfte verwerfen (1 P)\nRückgabe -1 nach der Schleife (1 P)"],
  ["Für eine App sollen eine Rückgängig-Funktion und eine Warteschlange für Support-Anfragen umgesetzt werden.\n\nUnterscheiden Sie Stack und Queue und ordnen Sie beide Anwendungsfälle zu. (4 P)", "Stack: LIFO (Last In, First Out), Operationen push/pop → Rückgängig-Funktion (zuletzt gemachte Änderung zuerst zurücknehmen).\nQueue: FIFO (First In, First Out), Operationen enqueue/dequeue → Support-Anfragen in Eingangsreihenfolge bearbeiten.", "Je 1 P pro Prinzip, je 1 P pro Zuordnung."],
  ["Die Ergebnisse eines Wettbewerbs stehen im Array a: Integer[] mit n Elementen.\n\nEntwickeln Sie in Pseudocode Selection Sort, der das Array aufsteigend sortiert. (6 P)", "für i = 0 bis n - 2\n  minIndex = i\n  für j = i + 1 bis n - 1\n    wenn a[j] < a[minIndex] dann\n      minIndex = j\n    ende wenn\n  ende für\n  tmp = a[i]\n  a[i] = a[minIndex]\n  a[minIndex] = tmp\nende für", "Äußere Schleife bis n - 2 (1 P)\nminIndex mit i initialisieren (1 P)\nInnere Schleife ab i + 1 (1 P)\nMinimum-Index merken (1 P)\nTausch nach der inneren Schleife (2 P)"],
  ["Eine Methode zur Berechnung der Summe 1 + 2 + … + n soll rekursiv umgesetzt werden.\n\nNennen Sie die zwei Pflichtbestandteile einer Rekursion und geben Sie sie für dieses Beispiel an. (4 P)", "Rekursionsanker (Abbruchbedingung): wenn n = 0 dann Rückgabe 0\nRekursiver Schritt, der das Problem verkleinert: Rückgabe n + summe(n - 1)\nOhne Anker läuft der Aufrufstapel über (Stack Overflow).", "Je 1 P pro Begriff, je 1 P pro richtigem Beispiel."],
  ["Ein Ticketsystem soll prüfen, ob im Array nummern: Integer[] mit n Elementen eine Nummer doppelt vorkommt.\n\nEntwickeln Sie in Pseudocode die Methode hatDuplikat(nummern: Integer[]): Boolean. (5 P)", "hatDuplikat(nummern: Integer[]): Boolean\n  für i = 0 bis n - 2\n    für j = i + 1 bis n - 1\n      wenn nummern[i] = nummern[j] dann\n        Rückgabe wahr\n      ende wenn\n    ende für\n  ende für\n  Rückgabe falsch\nende hatDuplikat", "Äußere Schleife (1 P)\nInnere Schleife ab i + 1, damit kein Element mit sich selbst verglichen wird (2 P)\nVergleich und vorzeitige Rückgabe wahr (1 P)\nRückgabe falsch erst nach den Schleifen (1 P)\nLaufzeit O(n²); schneller mit einer Menge (Set): vor dem Einfügen prüfen, ob die Nummer schon enthalten ist."],
  ["Ihr Team vergleicht mehrere Algorithmen für wachsende Datenmengen.\n\nOrdnen Sie den Laufzeitklassen O(1), O(log n), O(n), O(n · log n) und O(n²) je ein typisches Beispiel zu. (5 P)", "O(1): Zugriff auf ein Array-Element über den Index\nO(log n): binäre Suche\nO(n): lineare Suche, eine Schleife über alle Elemente\nO(n · log n): Mergesort, Quicksort im Mittel\nO(n²): Bubble Sort, Selection Sort, zwei verschachtelte Schleifen", "Je 1 P pro richtiger Zuordnung."]
);
CARDS_RAW.sql.push(
  ["In einer Theoriefrage sollen SQL-Befehle den Sprachbereichen zugeordnet werden.\n\nNennen Sie die fünf SQL-Sprachbereiche mit je zwei typischen Befehlen. (5 P)", "DDL (Data Definition): CREATE, ALTER, DROP\nDML (Data Manipulation): INSERT, UPDATE, DELETE\nDQL (Data Query): SELECT\nDCL (Data Control): GRANT, REVOKE\nTCL (Transaction Control): COMMIT, ROLLBACK, SAVEPOINT", "Je 1 P pro Bereich mit passenden Befehlen. Manche Lehrbücher zählen SELECT zur DML."],
  ["Die Marketingabteilung vergleicht die Kundenlisten der Jahre 2025 und 2026.\n\nNennen Sie die drei Mengenoperationen in SQL, erklären Sie sie und nennen Sie die Voraussetzung. (4 P)", "UNION: Vereinigung (Kunden aus 2025 oder 2026), UNION ALL mit Duplikaten\nINTERSECT: Schnittmenge (Kunden aus beiden Jahren)\nEXCEPT bzw. MINUS: Differenz (Kunden aus 2025, die 2026 fehlen)\nVoraussetzung: gleiche Spaltenanzahl, verträgliche Datentypen", "Je 1 P pro Operation mit Erklärung, 1 P Voraussetzung."],
  ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position. Für eine Werbeaktion werden Kunden gesucht, die noch nie bestellt haben.\n\nErstellen Sie die SQL-Anweisung mit NOT EXISTS. (4 P)", "SELECT k.Name\nFROM Kunde k\nWHERE NOT EXISTS (\n  SELECT *\n  FROM Bestellung b\n  WHERE b.KID = k.KID\n);", "- Hauptabfrage auf Kunde (1 P)\n- NOT EXISTS mit Unterabfrage (1 P)\n- Korrelation b.KID = k.KID (2 P)\nAlternativen: NOT IN oder LEFT JOIN … WHERE b.BID IS NULL."],
  ["In der Tabelle Mitarbeiter(MID, Name, Abteilung, ChefID) verweist ChefID auf die MID des Vorgesetzten. Die Geschäftsführerin hat keinen Vorgesetzten.\n\nErstellen Sie eine SQL-Anweisung, die jeden Mitarbeiter mit dem Namen seines Vorgesetzten ausgibt. Auch die Geschäftsführerin soll erscheinen. (4 P)", "SELECT m.Name, v.Name AS Chef\nFROM Mitarbeiter m\nLEFT JOIN Mitarbeiter v ON m.ChefID = v.MID;", "- Self Join mit zwei Aliasnamen (2 P)\n- Richtige ON-Bedingung (1 P)\n- LEFT JOIN, damit die Geschäftsführerin nicht fehlt (1 P)"],
  ["Ein Kollege fragt, warum er in ORDER BY den Alias aus der SELECT-Liste nutzen darf, in WHERE aber nicht.\n\nGeben Sie die logische Auswertungsreihenfolge einer SELECT-Anweisung an und beantworten Sie die Frage. (4 P)", "FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY\nDer Alias entsteht erst im SELECT. WHERE wird vorher ausgewertet und kennt ihn noch nicht, ORDER BY danach.", "3 P Reihenfolge, 1 P Begründung."],
  ["Bei einer Bank sollen 100 € von Konto 1 auf Konto 2 umgebucht werden. Beide Buchungen dürfen nur gemeinsam wirksam werden.\n\nErstellen Sie die SQL-Anweisungen als Transaktion. (4 P)", "START TRANSACTION;\nUPDATE Konto SET Saldo = Saldo - 100 WHERE Nr = 1;\nUPDATE Konto SET Saldo = Saldo + 100 WHERE Nr = 2;\nCOMMIT;", "- Transaktionsbeginn (1 P)\n- Beide UPDATE-Anweisungen (2 P)\n- COMMIT (1 P); bei einem Fehler ROLLBACK\nJe nach DBMS BEGIN TRANSACTION statt START TRANSACTION."]
);
CARDS_RAW.db.push(
  ["In der Tabelle Student(StudentID, Matrikelnr, Email, Name, StudiengangNr) sind StudentID, Matrikelnr und Email jeweils eindeutig.\n\nOrdnen Sie die Schlüsselbegriffe zu: Kandidatenschlüssel, Primärschlüssel, Alternativschlüssel, Surrogatschlüssel, Fremdschlüssel. (5 P)", "Kandidatenschlüssel: StudentID, Matrikelnr, Email (je minimal und eindeutig)\nPrimärschlüssel: StudentID (gewählter Kandidat)\nAlternativschlüssel: Matrikelnr, Email (übrige Kandidaten)\nSurrogatschlüssel: StudentID (künstliche ID ohne fachliche Bedeutung)\nFremdschlüssel: StudiengangNr (verweist auf Studiengang)", "Je 1 P pro richtig zugeordnetem Begriff.\nSuperschlüssel: jede eindeutige Attributkombination, auch nicht minimal (z. B. StudentID + Name)."],
  ["Für einen Kunden entwickeln Sie eine neue Datenbank, von den ersten Gesprächen bis zur Umsetzung in MySQL.\n\nNennen Sie die Phasen der Datenmodellierung in der richtigen Reihenfolge mit jeweils einem Ergebnis. (4 P)", "1. Anforderungsanalyse → Anforderungen, Datenbedarf\n2. Konzeptionelles Modell → ER-Modell (DBMS-unabhängig)\n3. Logisches Modell → Relationenmodell mit Tabellen und Schlüsseln\n4. Physisches Modell → Datentypen, Indizes, Speicherung im konkreten DBMS", "Je 1 P pro Phase mit Ergebnis in richtiger Reihenfolge."],
  ["Im ER-Diagramm eines Fitnessstudios steht zwischen Mitglied und Vertrag: auf der Mitglied-Seite zwei Striche, auf der Vertrag-Seite ein Kreis und ein Krähenfuß.\n\nErklären Sie die Symbole der Krähenfuß-Notation und lesen Sie die Beziehung. (3 P)", "Strich = genau eins, Kreis = null (optional), Krähenfuß = viele.\n||——o<: Ein Vertrag gehört zu genau einem Mitglied; ein Mitglied hat keinen bis viele Verträge.", "2 P Symbole, 1 P richtige Lesart in beide Richtungen."],
  ["Für die Tabelle Bestellung eines Online-Shops sollen Datentypen festgelegt werden: Bestellbetrag, Menge, Postleitzahl, Bestelldatum, Expressversand ja/nein und ein Produktfoto.\n\nOrdnen Sie jedem Attribut einen geeigneten Datentyp zu und begründen Sie die Wahl bei PLZ und Betrag. (4 P)", "Bestellbetrag: DECIMAL(10,2) – exakt, keine Rundungsfehler\nMenge: INTEGER\nPostleitzahl: CHAR(5) bzw. VARCHAR – führende Null bleibt erhalten, keine Rechnung\nBestelldatum: DATE\nExpressversand: BOOLEAN\nProduktfoto: BLOB (oder nur der Dateipfad als VARCHAR)", "2 P für die Zuordnung, je 1 P für die Begründung bei PLZ und Betrag."]
);
CARDS_RAW.dbs = [
