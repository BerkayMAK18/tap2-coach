  { id: "P2", teil: "Teil 2", thema: "Pseudocode", titel: "Durchschnittsgehalt je Abteilung", max: 20, min: 25,
    text: "Gegeben ist eine Liste List<Mitarbeiter>. Mitarbeiter hat die Getter getName(), getAbteilung(): String und getGehalt(): Double.\n\nDie Klasse AbtStat hat die Attribute abteilung: String, summe: Double, anzahl: Integer, den Konstruktor AbtStat(abteilung: String) (summe = 0, anzahl = 0) sowie Getter und Setter.\n\nListen bieten add(o), size(), get(i).\n\nEntwickeln Sie in Pseudocode die Methode\n  statistik(ma: List<Mitarbeiter>) : List<AbtStat>\n\nFür jede Abteilung soll genau ein AbtStat-Objekt mit Gehaltssumme und Anzahl der Mitarbeitenden in der Ergebnisliste stehen.",
    loesung: "statistik(ma: List<Mitarbeiter>) : List<AbtStat>\n  ergebnis = new List<AbtStat>()\n  für i = 0 bis ma.size() - 1\n    m = ma.get(i)\n    stat = null\n    für j = 0 bis ergebnis.size() - 1\n      wenn ergebnis.get(j).getAbteilung() == m.getAbteilung() dann\n        stat = ergebnis.get(j)\n      ende wenn\n    ende für\n    wenn stat == null dann\n      stat = new AbtStat(m.getAbteilung())\n      ergebnis.add(stat)\n    ende wenn\n    stat.setSumme(stat.getSumme() + m.getGehalt())\n    stat.setAnzahl(stat.getAnzahl() + 1)\n  ende für\n  Rückgabe ergebnis\nende statistik\n\nBewertung: Ergebnisliste 2 P, äußere Schleife 3 P, Suche in Ergebnisliste 6 P, neues Objekt anlegen und hinzufügen 4 P, Summe/Anzahl erhöhen 3 P, Rückgabe 2 P.\nDieses Muster (gruppieren ohne Map) kam so ähnlich in S 26 vor." },
  { id: "P3", teil: "Teil 2", thema: "Pseudocode", titel: "Umsätze im 2D-Array", max: 20, min: 25,
    text: "Im zweidimensionalen Array umsatz: Double[][] steht in umsatz[f][m] der Umsatz der Filiale f (0 … anzahl−1) im Monat m (0 = Januar … 11 = Dezember).\n\na) Entwickeln Sie besterMonat(umsatz: Double[][]) : Integer. Sie gibt die Monatsnummer 1–12 zurück, in dem der Gesamtumsatz aller Filialen am höchsten war. (10 P)\n\nb) Entwickeln Sie zielErreicht(umsatz: Double[][], ziel: Double) : Integer. Sie gibt zurück, wie viele Filialen in jedem einzelnen Monat mindestens ziel erreicht haben. (10 P)",
    loesung: "a)\nbesterMonat(umsatz: Double[][]) : Integer\n  besterIndex = 0\n  besteSumme = -1\n  für m = 0 bis 11\n    summe = 0\n    für f = 0 bis umsatz.length - 1\n      summe = summe + umsatz[f][m]\n    ende für\n    wenn summe > besteSumme dann\n      besteSumme = summe\n      besterIndex = m\n    ende wenn\n  ende für\n  Rückgabe besterIndex + 1\nende besterMonat\n\nb)\nzielErreicht(umsatz: Double[][], ziel: Double) : Integer\n  anzahl = 0\n  für f = 0 bis umsatz.length - 1\n    immer = true\n    für m = 0 bis 11\n      wenn umsatz[f][m] < ziel dann\n        immer = false\n      ende wenn\n    ende für\n    wenn immer dann\n      anzahl = anzahl + 1\n    ende wenn\n  ende für\n  Rückgabe anzahl\nende zielErreicht\n\nTypische Fehler: Summe nicht pro Monat zurücksetzen, Index statt Monatsnummer zurückgeben, Flag außerhalb der äußeren Schleife initialisieren." },
  { id: "P4", teil: "Teil 2", thema: "Pseudocode", titel: "Fehlersuche und Schreibtischtest", max: 15, min: 20,
    text: "Die Methode soll das Minimum eines Arrays und seine Position liefern:\n\n01 minimumUndPosition(werte: Integer[]) : Integer[]\n02   min = 0\n03   pos = 0\n04   für i = 1 bis werte.length\n05     wenn werte[i] > min dann\n06       min = werte[i]\n07       pos = i\n08     ende wenn\n09   ende für\n10   Rückgabe [min, pos]\n11 ende minimumUndPosition\n\na) Führen Sie einen Schreibtischtest mit werte = {4, -2, 7, -5} durch. Was passiert? (5 P)\nb) Nennen Sie drei Fehler mit Zeilennummer und Korrektur. (6 P)\nc) Welcher Testfall fehlt außerdem und wie behandeln Sie ihn? (4 P)",
    loesung: "a) min = 0, pos = 0\ni = 1: -2 > 0? nein\ni = 2: 7 > 0? ja → min = 7, pos = 2\ni = 3: -5 > 7? nein\ni = 4: Zugriff auf werte[4] → Index außerhalb des Arrays (Laufzeitfehler).\nSelbst ohne Absturz wäre das Ergebnis [7, 2] (Maximum statt Minimum).\n\nb)\nZeile 02: min = werte[0] statt 0\nZeile 04: für i = 1 bis werte.length - 1\nZeile 05: werte[i] < min statt >\n\nKorrektes Ergebnis für das Beispiel: [-5, 3]\n\nc) Leeres Array oder null: werte[0] löst einen Fehler aus. Vorher prüfen und z. B. null zurückgeben oder eine Exception mit verständlicher Meldung werfen." },
  { id: "P5", teil: "Teil 2", thema: "Pseudocode", titel: "Selection Sort und Insertion Sort", max: 20, min: 25,
    text: "Ein Array artikel: Artikel[] soll absteigend nach getPreis() sortiert werden.\n\na) Implementieren Sie die Sortierung als Selection Sort. (8 P)\nb) Implementieren Sie die Sortierung als Insertion Sort. (8 P)\nc) Welches Verfahren ist bei bereits fast sortierten Daten im Vorteil? Begründen Sie. (4 P)",
    loesung: "a) Selection Sort\nfür i = 0 bis artikel.length - 2\n  maxPos = i\n  für j = i + 1 bis artikel.length - 1\n    wenn artikel[j].getPreis() > artikel[maxPos].getPreis() dann\n      maxPos = j\n    ende wenn\n  ende für\n  tmp = artikel[i]\n  artikel[i] = artikel[maxPos]\n  artikel[maxPos] = tmp\nende für\n\nb) Insertion Sort\nfür i = 1 bis artikel.length - 1\n  aktuell = artikel[i]\n  j = i - 1\n  solange j >= 0 und artikel[j].getPreis() < aktuell.getPreis()\n    artikel[j + 1] = artikel[j]\n    j = j - 1\n  ende solange\n  artikel[j + 1] = aktuell\nende für\n\nc) Insertion Sort: Bei fast sortierten Daten wird die innere Schleife kaum durchlaufen, Aufwand nahe O(n). Selection Sort sucht immer den ganzen Rest ab und bleibt bei O(n²)." },
  { id: "S1", teil: "Teil 2", thema: "SQL", titel: "Abfragen mit JOIN, GROUP BY, HAVING", max: 16, min: 20,
    schema: true,
    text: "a) Alle Kunden aus Mainz, alphabetisch nach Name. (2 P)\n\nb) Für jeden Kunden die Anzahl seiner Bestellungen im Jahr 2026, auch Kunden ohne Bestellung (Anzahl 0). Absteigend nach Anzahl. (6 P)\n\nc) Umsatz je Kategorie im Jahr 2026 (Menge × Preis), nur Kategorien mit mehr als 10.000 € Umsatz, absteigend. (8 P)",
    loesung: "a)\nSELECT * FROM Kunde WHERE Ort = 'Mainz' ORDER BY Name;\n\nb)\nSELECT K.KID, K.Name, COUNT(B.BID) AS Anzahl\nFROM Kunde AS K\nLEFT JOIN Bestellung AS B\n  ON B.KID = K.KID AND YEAR(B.Datum) = 2026\nGROUP BY K.KID, K.Name\nORDER BY Anzahl DESC;\n\nWichtig: Jahresbedingung im ON, nicht im WHERE. COUNT(B.BID) statt COUNT(*).\n\nc)\nSELECT A.Kategorie, SUM(P.Menge * A.Preis) AS Umsatz\nFROM Bestellung AS B\nINNER JOIN Position AS P ON P.BID = B.BID\nINNER JOIN Artikel AS A ON A.ArtNr = P.ArtNr\nWHERE YEAR(B.Datum) = 2026\nGROUP BY A.Kategorie\nHAVING SUM(P.Menge * A.Preis) > 10000\nORDER BY Umsatz DESC;" },
  { id: "S2", teil: "Teil 2", thema: "SQL", titel: "Daten ändern, löschen, einfügen", max: 13, min: 15,
    schema: true,
    text: "a) Erhöhen Sie die Preise aller Artikel der Kategorie Zubehör um 5 %. (3 P)\nb) Löschen Sie alle Artikel, die noch nie bestellt wurden. (4 P)\nc) Fügen Sie den Artikel 4711, USB-C-Kabel 2 m, Zubehör, 12,90 € ein. (2 P)\nd) Geben Sie Bezeichnung und Preis des teuersten Artikels aus (bei Gleichstand alle). (4 P)",
    loesung: "a)\nUPDATE Artikel SET Preis = Preis * 1.05 WHERE Kategorie = 'Zubehör';\n\nb)\nDELETE FROM Artikel\nWHERE ArtNr NOT IN (SELECT ArtNr FROM Position);\n\nc)\nINSERT INTO Artikel (ArtNr, Bezeichnung, Kategorie, Preis)\nVALUES (4711, 'USB-C-Kabel 2 m', 'Zubehör', 12.90);\n\nd)\nSELECT Bezeichnung, Preis FROM Artikel\nWHERE Preis = (SELECT MAX(Preis) FROM Artikel);" },
  { id: "S3", teil: "Teil 2", thema: "SQL", titel: "Struktur, Rechte und Archivieren", max: 15, min: 20,
    schema: true,
    text: "a) Erweitern Sie Kunde um die Spalte Telefon (Text, 30 Zeichen). (2 P)\nb) Legen Sie einen Index auf Bestellung.Datum an. (2 P)\nc) Alle Bestellungen vor dem 01.01.2025 sollen in die Tabelle Bestellung_Archiv (gleiche Struktur) übertragen und danach aus Bestellung gelöscht werden. Beachten Sie die Fremdschlüssel. (8 P)\nd) Der Benutzer praktikant soll die Tabelle Artikel lesen dürfen. Entziehen Sie das Recht anschließend wieder. (3 P)",
    loesung: "a)\nALTER TABLE Kunde ADD Telefon VARCHAR(30);\n\nb)\nCREATE INDEX idx_bestellung_datum ON Bestellung (Datum);\n\nc)\nINSERT INTO Bestellung_Archiv (BID, KID, Datum, Status)\n  SELECT BID, KID, Datum, Status\n  FROM Bestellung\n  WHERE Datum < '2025-01-01';\n\nDELETE FROM Position\nWHERE BID IN (SELECT BID FROM Bestellung WHERE Datum < '2025-01-01');\n\nDELETE FROM Bestellung WHERE Datum < '2025-01-01';\n\nPositionen zuerst löschen (oder ebenfalls archivieren), sonst verletzt das Löschen die referentielle Integrität.\n\nd)\nGRANT SELECT ON Artikel TO praktikant;\nREVOKE SELECT ON Artikel FROM praktikant;" },
  { id: "S4", teil: "Teil 2", thema: "SQL", titel: "Tabelle anlegen und Unterabfrage im FROM", max: 16, min: 20,
    schema: true,
    text: "a) Erstellen Sie die Tabelle Position mit zusammengesetztem Primärschlüssel und beiden Fremdschlüsseln. (5 P)\nb) Geben Sie alle Kunden aus, die noch nie bestellt haben. (3 P)\nc) Ermitteln Sie je Kunde den durchschnittlichen Bestellwert (Wert einer Bestellung = Summe Menge × Preis ihrer Positionen). (8 P)",
    loesung: "a)\nCREATE TABLE Position (\n  BID INT NOT NULL,\n  ArtNr INT NOT NULL,\n  Menge INT NOT NULL,\n  PRIMARY KEY (BID, ArtNr),\n  FOREIGN KEY (BID) REFERENCES Bestellung(BID),\n  FOREIGN KEY (ArtNr) REFERENCES Artikel(ArtNr)\n);\n\nb)\nSELECT K.KID, K.Name\nFROM Kunde AS K\nLEFT JOIN Bestellung AS B ON B.KID = K.KID\nWHERE B.BID IS NULL;\n\nc)\nSELECT K.KID, K.Name, AVG(BW.Wert) AS DurchschnittBestellwert\nFROM Kunde AS K\nINNER JOIN (\n  SELECT B.BID, B.KID, SUM(P.Menge * A.Preis) AS Wert\n  FROM Bestellung AS B\n  INNER JOIN Position AS P ON P.BID = B.BID\n  INNER JOIN Artikel AS A ON A.ArtNr = P.ArtNr\n  GROUP BY B.BID, B.KID\n) AS BW ON BW.KID = K.KID\nGROUP BY K.KID, K.Name;" },
  { id: "D1", teil: "Teil 2", thema: "Datenmodell", titel: "Relationenmodell Fitnessstudio", max: 25, min: 25,
    text: "Ein Fitnessstudio verwaltet seine Mitglieder (Name, Vorname, Geburtsdatum). Jedes Mitglied hat genau einen Tarif (Bezeichnung, Monatsbeitrag).\nKurse (Bezeichnung, Wochentag, Uhrzeit) finden immer in genau einem Raum (Raumname, Kapazität) statt und werden von genau einem Trainer (Name, Qualifikation) geleitet.\nMitglieder melden sich für Kurse an. Gespeichert werden das Anmeldedatum und ob das Mitglied erschienen ist.\n\nErstellen Sie ein relationales Datenmodell in der 3. Normalform. Kennzeichnen Sie PK und FK und tragen Sie alle Beziehungen mit Kardinalitäten ein.",
    loesung: "Tarif (TarifID [PK], Bezeichnung, Monatsbeitrag)\nMitglied (MitgliedID [PK], Name, Vorname, Geburtsdatum, TarifID [FK])\nRaum (RaumID [PK], Raumname, Kapazitaet)\nTrainer (TrainerID [PK], Name, Qualifikation)\nKurs (KursID [PK], Bezeichnung, Wochentag, Uhrzeit, RaumID [FK], TrainerID [FK])\nAnmeldung (MitgliedID [PK, FK], KursID [PK, FK], Anmeldedatum, Erschienen)\n\nBeziehungen:\nTarif 1 : n Mitglied\nRaum 1 : n Kurs\nTrainer 1 : n Kurs\nMitglied 1 : n Anmeldung\nKurs 1 : n Anmeldung   (m:n Mitglied–Kurs über Anmeldung aufgelöst)\n\nBewertung wie in der IHK-Prüfung: 6 Tabellen à 1 P, 6 PK à 1 P, 6 FK à 1 P, 5 Beziehungen mit Kardinalität à 1 P, Attribute vollständig 2 P.\nFinden Kurse mehrfach an verschiedenen Terminen statt, gehört zusätzlich eine Tabelle Kurstermin dazu." },
  { id: "D2", teil: "Teil 1", thema: "Datenmodell", titel: "Anomalien und Normalisierung", max: 20, min: 20,
    text: "Eine Kfz-Werkstatt speichert Aufträge in einer einzigen Tabelle:\n\nAuftragNr | Datum | KundenNr | KundenName | KundenOrt | Kennzeichen | Leistungen\n1001 | 03.11.26 | 17 | Weber | Mainz | MZ-AB 12 | Ölwechsel 89 €, Bremsen 240 €\n1002 | 04.11.26 | 17 | Weber | Mainz | MZ-AB 12 | Inspektion 199 €\n1003 | 04.11.26 | 22 | Kaya | Wiesbaden | WI-K 77 | Ölwechsel 89 €\n\na) Welche Normalform ist verletzt? Begründen Sie. (2 P)\nb) Beschreiben Sie Einfüge-, Änderungs- und Löschanomalie an diesem Beispiel. (6 P)\nc) Überführen Sie die Daten in die 3. Normalform. (12 P)",
    loesung: "a) Schon die 1. NF: Die Spalte Leistungen enthält mehrere Werte (nicht atomar), Leistung und Preis sind zusammengeschrieben.\n\nb)\nEinfügeanomalie: Ein neuer Kunde oder eine neue Leistung kann nicht gespeichert werden, solange es keinen Auftrag gibt.\nÄnderungsanomalie: Zieht Weber um, muss der Ort in allen seinen Aufträgen geändert werden; wird einer vergessen, sind die Daten widersprüchlich. Ebenso bei Preisänderung Ölwechsel.\nLöschanomalie: Wird Auftrag 1003 gelöscht, gehen alle Daten von Kunde Kaya verloren.\n\nc)\nKunde (KundenNr [PK], Name, Ort)\nFahrzeug (Kennzeichen [PK], KundenNr [FK])\nAuftrag (AuftragNr [PK], Datum, Kennzeichen [FK])\nLeistung (LeistungNr [PK], Bezeichnung, Preis)\nAuftragsposition (AuftragNr [PK, FK], LeistungNr [PK, FK], Menge)\n\nKunde 1:n Fahrzeug, Fahrzeug 1:n Auftrag, Auftrag 1:n Auftragsposition, Leistung 1:n Auftragsposition.\nSoll der Preis zum Auftragszeitpunkt erhalten bleiben, zusätzlich Preis in Auftragsposition speichern." },
  { id: "U1", teil: "Teil 1 + 2", thema: "UML", titel: "Aktivitätsdiagramm Retoure", max: 18, min: 25,
    text: "Zeichnen Sie ein Aktivitätsdiagramm mit den Partitionen Kunde, Kundenservice und Lager:\n\nDer Kunde meldet eine Rücksendung online an. Der Kundenservice prüft, ob die 30-Tage-Frist eingehalten ist. Ist sie überschritten, wird dem Kunden eine Ablehnung gesendet und der Vorgang endet.\nSonst erzeugt der Kundenservice ein Retourenlabel und der Kunde verschickt das Paket. Das Lager prüft die Ware. Ist sie beschädigt, wird eine Teilerstattung berechnet, sonst die volle Erstattung.\nAnschließend laufen parallel: Das Lager bucht die Ware ein, der Kundenservice veranlasst die Erstattung und sendet eine Bestätigung. Sind beide fertig, ist der Vorgang abgeschlossen.",
    loesung: "Kunde: Start ● → [Rücksendung anmelden]\nKundenservice: [Frist prüfen] → Raute\n  [Frist überschritten] → [Ablehnung senden] → Ende ◉\n  [Frist eingehalten] → [Retourenlabel erzeugen]\nKunde: [Paket verschicken]\nLager: [Ware prüfen] → Raute\n  [beschädigt] → [Teilerstattung berechnen]\n  [nicht beschädigt] → [volle Erstattung berechnen]\n  → Zusammenführungsraute → Fork-Balken\n    Lager: [Ware einbuchen]\n    Kundenservice: [Erstattung veranlassen] → [Bestätigung senden]\n  → Join-Balken → Ende ◉\n\nPunkte je Aktion 1 P (9), je Verzweigung mit Bedingungen 2 P (4), Fork/Join 2 P, Start/Ende und richtige Partitionen 3 P.\nHäufige Fehler: Bedingungen ohne eckige Klammern, fehlende Zusammenführung nach der Verzweigung, Join vergessen." },
  { id: "U2", teil: "Teil 1 + 2", thema: "UML", titel: "Zustandsdiagramm Paketfach", max: 15, min: 20,
    text: "Ein Fach einer Paketstation kann frei, reserviert, belegt, abgelaufen oder gesperrt sein.\n- Ein freies Fach wird reserviert, wenn ein Zusteller ein Paket passender Größe ankündigt.\n- Legt der Zusteller das Paket ein, ist das Fach belegt und dem Empfänger wird ein Abholcode gesendet.\n- Wird nicht innerhalb von 24 Stunden eingelegt, ist das Fach wieder frei.\n- Gibt der Empfänger den richtigen Code ein, öffnet die Tür, er entnimmt das Paket und das Fach ist frei.\n- Wird ein Paket 7 Tage nicht abgeholt, ist das Fach abgelaufen; der Zusteller nimmt es mit und das Fach ist frei.\n- Bei einer Störung wird jedes Fach gesperrt; nach der Reparatur ist es frei.\n\nZeichnen Sie das Zustandsdiagramm.",
    loesung: "● → frei\nfrei → reserviert: ankündigen [Größe passt]\nreserviert → belegt: einlegen / Abholcode senden\nreserviert → frei: nach 24 h\nbelegt → frei: Code eingeben [Code korrekt] / Tür öffnen\nbelegt → abgelaufen: nach 7 Tagen\nabgelaufen → frei: Zusteller entnimmt\nfrei, reserviert, belegt, abgelaufen → gesperrt: Störung\ngesperrt → frei: repariert\n\nBewertung: je Zustand 1 P (5), je Übergang mit richtiger Beschriftung 1 P (9), Startzustand 1 P.\nÜbergangsform: Ereignis [Bedingung] / Aktion." },
  { id: "U3", teil: "Teil 1 + 2", thema: "UML", titel: "Sequenzdiagramm Login mit 2FA", max: 15, min: 20,
    text: "Lebenslinien: :Benutzer, :LoginView, :AuthService, :UserRepository.\n\nDer Benutzer gibt Benutzername und Passwort in der LoginView ein. Die LoginView ruft login(name, pw) beim AuthService auf. Dieser lädt mit findUser(name) den Benutzer aus dem UserRepository und prüft das Passwort mit checkHash(pw).\nIst das Passwort falsch, liefert login false und die View zeigt eine Fehlermeldung.\nIst es richtig, sendet der AuthService einen Code per SMS (sendCode()), die View fragt den Code ab und ruft verify(code) auf. Bei korrektem Code liefert verify true und die View zeigt das Dashboard.",
    loesung: "Benutzer → LoginView: eingeben(name, pw)\nLoginView → AuthService: login(name, pw)\nAuthService → UserRepository: findUser(name)\nUserRepository --> AuthService: user\nAuthService → AuthService: checkHash(pw)\nalt [Passwort falsch]\n  AuthService --> LoginView: false\n  LoginView → Benutzer: Fehlermeldung anzeigen\n[Passwort richtig]\n  AuthService → AuthService: sendCode()\n  AuthService --> LoginView: true (Code gesendet)\n  LoginView → Benutzer: Code abfragen\n  Benutzer → LoginView: code eingeben\n  LoginView → AuthService: verify(code)\n  AuthService --> LoginView: true\n  LoginView → Benutzer: Dashboard anzeigen\n\nBewertung: je Nachricht mit Antwort 0,5–1 P, alt-Fragment mit beiden Bedingungen 3 P, Aktivierungsbalken optional.\nAntworten gestrichelt, Aufrufe mit gefüllter Pfeilspitze." },
  { id: "N1", teil: "Teil 1", thema: "Projektmanagement", titel: "Netzplan", max: 20, min: 25,
    text: "Vorgänge (Dauer in Tagen, Vorgänger):\nA Anforderungsanalyse 5, –\nB Datenbankentwurf 4, A\nC UI-Entwurf 3, A\nD Backend implementieren 8, B\nE Frontend implementieren 6, C\nF Integrationstest 3, D und E\nG Schulungsunterlagen 2, C\nH Abnahme und Bereitstellung 2, F und G\n\na) Berechnen Sie FAZ, FEZ, SAZ, SEZ, Gesamtpuffer und freien Puffer. (14 P)\nb) Geben Sie den kritischen Pfad und die Projektdauer an. (3 P)\nc) Erklären Sie den Unterschied zwischen Gesamtpuffer und freiem Puffer. (3 P)",
    loesung: "Vorgang | FAZ | FEZ | SAZ | SEZ | GP | FP\nA | 0 | 5 | 0 | 5 | 0 | 0\nB | 5 | 9 | 5 | 9 | 0 | 0\nC | 5 | 8 | 8 | 11 | 3 | 0\nD | 9 | 17 | 9 | 17 | 0 | 0\nE | 8 | 14 | 11 | 17 | 3 | 3\nF | 17 | 20 | 17 | 20 | 0 | 0\nG | 8 | 10 | 18 | 20 | 10 | 10\nH | 20 | 22 | 20 | 22 | 0 | 0\n\nb) Kritischer Pfad A – B – D – F – H, Projektdauer 22 Tage.\n\nc) Gesamtpuffer (SAZ − FAZ): Verschiebung ohne Verzögerung des Projektendes. Freier Puffer (kleinster FAZ der Nachfolger − FEZ): Verschiebung, ohne dass ein Nachfolger später beginnen kann. C hat 3 Tage Gesamtpuffer, aber 0 freien Puffer, weil E und G sofort an C anschließen." },
  { id: "X1", teil: "Teil 2", thema: "Testen", titel: "Testfälle und Überdeckung", max: 20, min: 20,
    text: "versandkosten(gewicht: Double, express: Boolean) : Double\n  wenn gewicht <= 0 dann\n    Rückgabe -1\n  ende wenn\n  wenn gewicht <= 2 dann\n    preis = 4.99\n  sonst wenn gewicht <= 10 dann\n    preis = 6.99\n  sonst\n    preis = 14.99\n  ende wenn\n  wenn express dann\n    preis = preis + 5\n  ende wenn\n  Rückgabe preis\nende versandkosten\n\na) Bilden Sie Äquivalenzklassen für gewicht und nennen Sie Grenzwerte. (6 P)\nb) Geben Sie eine minimale Menge Testfälle für vollständige Zweigüberdeckung an (Eingabe und erwartetes Ergebnis). (6 P)\nc) Erklären Sie Anweisungs-, Zweig- und Pfadüberdeckung. (6 P)\nd) Wofür steht TDD und wie läuft es ab? (2 P)",
    loesung: "a) Klassen: ungültig gewicht <= 0; 0 < gewicht <= 2; 2 < gewicht <= 10; gewicht > 10.\nGrenzwerte: 0 und 0,01; 2 und 2,01; 10 und 10,01.\n\nb) Vier Testfälle genügen:\n(0, false) → -1\n(1, true) → 9.99\n(5, false) → 6.99\n(12, true) → 19.99\nJede Bedingung ist damit einmal wahr und einmal falsch.\n\nc) Anweisungsüberdeckung: jede Anweisung mindestens einmal. Zweigüberdeckung: jeder Zweig jeder Entscheidung (wahr/falsch) mindestens einmal, schließt Anweisungsüberdeckung ein. Pfadüberdeckung: jede mögliche Kombination von Zweigen vom Start bis zum Ende, hier 1 + 3 × 2 = 7 Pfade.\n\nd) Test Driven Development: Test zuerst schreiben (schlägt fehl), dann minimalen Code bis er besteht, dann Refactoring." },
  { id: "O1", teil: "Teil 1", thema: "OOP", titel: "Klassendiagramm Fahrzeugvermietung", max: 25, min: 25,
    text: "Eine Vermietung verwaltet Fahrzeuge. Jedes Fahrzeug hat Kennzeichen und Tagespreis. Es gibt PKW (Sitzplätze) und Transporter (Ladevolumen). Ein Fahrzeug selbst wird nie angelegt, nur PKW oder Transporter.\nAlle Fahrzeuge haben die Methode berechneMiete(tage: Integer): Double. Beim PKW ist die Miete Tage × Tagespreis, beim Transporter kommt eine Reinigungspauschale von 25 € dazu.\nEin Kunde (Name, Kundennummer) kann mehrere Mietverträge haben. Ein Mietvertrag (Beginn, Ende) gehört zu genau einem Kunden und genau einem Fahrzeug.\n\na) Erstellen Sie das Klassendiagramm mit Attributen, Datentypen, Sichtbarkeiten, Methoden und Beziehungen mit Multiplizitäten. (13 P)\nb) Erklären Sie Polymorphie an diesem Beispiel. (4 P)\nc) Wäre die Beziehung Kunde–Mietvertrag eine Komposition oder Aggregation? Begründen Sie. (4 P)\nd) Welches Entwurfsmuster passt, wenn Kunden bei Statusänderungen ihres Mietvertrags automatisch benachrichtigt werden sollen? (4 P)",
    loesung: "a)\n{abstract} Fahrzeug\n  - kennzeichen: String\n  - tagespreis: Double\n  + berechneMiete(tage: Integer): Double {abstract}\nPKW erbt von Fahrzeug\n  - sitzplaetze: Integer\n  + berechneMiete(tage: Integer): Double\nTransporter erbt von Fahrzeug\n  - ladevolumen: Double\n  + berechneMiete(tage: Integer): Double\nKunde\n  - kundennummer: Integer\n  - name: String\nMietvertrag\n  - beginn: Date\n  - ende: Date\n\nKunde 1 —— 0..* Mietvertrag\nMietvertrag 0..* —— 1 Fahrzeug\nVererbung mit leerem Dreieck zu Fahrzeug, Fahrzeug kursiv oder {abstract}.\n\nb) Der Aufruf fahrzeug.berechneMiete(3) ist für alle Fahrzeuge gleich. Erst zur Laufzeit wird anhand des tatsächlichen Objekts (PKW oder Transporter) entschieden, welche Implementierung läuft.\n\nc) Komposition ist vertretbar, wenn ein Mietvertrag ohne Kunden nicht existieren soll (gefüllte Raute beim Kunden). Müssen Verträge aus rechtlichen Gründen auch nach Löschung des Kunden aufbewahrt werden, eher Assoziation/Aggregation. Begründung zählt.\n\nd) Observer: Mietvertrag ist Subjekt, Kunde (bzw. ein Benachrichtigungsdienst) registriert sich als Beobachter und wird bei Statusänderung per update() informiert." },
  { id: "PM1", teil: "Teil 1", thema: "Projektmanagement", titel: "Projektplanung Zeiterfassungs-App", max: 28, min: 30,
    text: "Ein Handwerksbetrieb mit 60 Beschäftigten führt eine App zur mobilen Zeiterfassung ein; bisher werden Stundenzettel auf Papier geführt.\n\na) Beschreiben Sie für zwei Stakeholder Erwartung, Befürchtung und eine Maßnahme. (8 P)\nb) Nennen Sie zwei Risiken mit Ursache, Auswirkung und Gegenmaßnahme. (8 P)\nc) Würden Sie agil oder klassisch vorgehen? Begründen Sie. (4 P)\nd) Nennen Sie je zwei funktionale und nichtfunktionale Anforderungen. (4 P)\ne) Wie können Sie nach Projektende den Erfolg prüfen? Zwei Aspekte. (4 P)",
    loesung: "a) Beispiele:\nMitarbeitende – Erwartung: weniger Papierkram, schnellere Lohnabrechnung – Befürchtung: Überwachung per GPS – Maßnahme: früh informieren, nur Arbeitszeit ohne Standort, Schulung.\nBetriebsrat – Erwartung: korrekte Erfassung von Überstunden – Befürchtung: Leistungs- und Verhaltenskontrolle – Maßnahme: Betriebsvereinbarung abschließen (Mitbestimmung § 87 Nr. 6 BetrVG).\nGeschäftsführung – Erwartung: Kosten senken, Auswertungen – Befürchtung: Kostenüberschreitung – Maßnahme: Kostencontrolling, Meilensteine.\n\nb) Beispiele:\nAkzeptanzproblem – Ursache: Angst vor Kontrolle – Auswirkung: App wird nicht genutzt – Gegenmaßnahme: Einbindung, Schulung.\nSchnittstelle zur Lohnsoftware – Ursache: unklare Datenformate – Auswirkung: Verzögerung, Mehrkosten – Gegenmaßnahme: frühe Schnittstellenanalyse, Prototyp.\nKein Netz auf Baustellen – Ursache: Funklöcher – Auswirkung: Daten fehlen – Gegenmaßnahme: Offline-Modus mit Synchronisierung.\n\nc) Agil, z. B. Scrum: Anforderungen der Handwerker sind am Anfang unklar, frühe Testversionen geben Feedback. Klassisch ist auch vertretbar, wenn Anforderungen fest sind und ein Festpreis vereinbart ist.\n\nd) Funktional: Arbeitsbeginn/-ende erfassen, Zeiten einem Auftrag zuordnen, Export an Lohnbuchhaltung. Nichtfunktional: Bedienung mit Handschuhen/große Buttons, offlinefähig, Antwortzeit < 2 s, DSGVO-konforme Speicherung.\n\ne) Soll-Ist-Vergleich mit Pflichtenheft, Kosten und Termin; Nutzerbefragung zur Zufriedenheit; Kennzahlen wie Zeitaufwand der Lohnabrechnung vorher/nachher; Lessons Learned." },
  { id: "SEC1", teil: "Teil 1", thema: "IT-Sicherheit", titel: "Sicherheit einer Web-App", max: 22, min: 25,
    text: "Für ein Kundenportal sollen Sie das Sicherheitskonzept erstellen.\n\na) Erklären Sie, wie TLS die Verbindung zwischen Browser und Server schützt (hybride Verschlüsselung, Zertifikat). (6 P)\nb) Wie speichern Sie die Passwörter der Kunden? Begründen Sie. (4 P)\nc) Im Login steht der Code\n   sql = \"SELECT * FROM kunde WHERE name = '\" + name + \"' AND pw = '\" + pw + \"'\"\n   Erklären Sie die Gefahr an einem Beispiel und nennen Sie die Abhilfe. (6 P)\nd) Ordnen Sie den drei Schutzzielen je eine Maßnahme für das Portal zu. (6 P)",
    loesung: "a) Der Server schickt sein Zertifikat, signiert von einer CA; der Browser prüft die Signatur und so die Echtheit des Servers. Über asymmetrische Verfahren (Schlüsselaustausch, z. B. ECDHE) einigen sich beide auf einen Sitzungsschlüssel. Die eigentlichen Daten werden dann schnell symmetrisch (z. B. AES) verschlüsselt. Schutz vor Mitlesen (Vertraulichkeit) und Manipulation (Integrität), Man-in-the-Middle wird durch die Zertifikatsprüfung verhindert.\n\nb) Als Hash mit einem langsamen Verfahren (bcrypt, Argon2) und einem zufälligen Salt pro Kunde. Selbst bei einem Datenbankdiebstahl sind die Passwörter nicht im Klartext lesbar, gleiche Passwörter ergeben durch das Salt verschiedene Hashes, Rainbow-Tables helfen nicht.\n\nc) SQL-Injection: Gibt ein Angreifer als Name  admin' --  ein, wird die Passwortprüfung auskommentiert und er ist als admin angemeldet. Mit ' OR '1'='1 werden alle Datensätze geliefert. Abhilfe: Prepared Statements mit Parametern (WHERE name = ? AND …), Eingaben validieren, Datenbankbenutzer mit minimalen Rechten.\n\nd) Vertraulichkeit: TLS, Rollen- und Rechtekonzept, Verschlüsselung der Datenbank. Integrität: Hashes/Signaturen, Eingabevalidierung, Protokollierung von Änderungen. Verfügbarkeit: Backups, redundante Server, DDoS-Schutz, Monitoring." },
  { id: "WEB1", teil: "Teil 1", thema: "Web & REST", titel: "REST-API für Termine", max: 16, min: 20,
    text: "Eine Arztpraxis bietet unter https://api.praxis.de/termine eine REST-API an.\n\na) Erklären Sie zwei Merkmale von REST. (4 P)\nb) Geben Sie für Anlegen, Abrufen eines Termins (ID 42), Verschieben und Absagen jeweils HTTP-Methode und URL an. (4 P)\nc) Welche Statuscodes erwarten Sie für: Termin angelegt, Termin 42 existiert nicht, fehlende Anmeldung? (3 P)\nd) Schreiben Sie einen JSON-Body für einen neuen Termin (Datum, Uhrzeit, Patient-ID, Grund). (3 P)\ne) Unterschied zwischen PUT und PATCH? (2 P)",

  ["t2", "algo", "Durchschnitt = summe / anzahl mit summe = 7 und anzahl = 2 als Integer ergibt …", ["3,5", "3", "4", "Fehler"], 1, "Integer-Division schneidet ab."],
  // ---------- Teil 2: SQL
  ["t2", "sql", "Die Rheinhessen IT GmbH möchte nur die Kunden anzeigen, die mehr als zwei Bestellungen aufgegeben haben. Die Abfrage gruppiert dazu nach Kunde.\n\nIn welche Klausel gehört die Bedingung COUNT(*) > 2?", ["WHERE","HAVING","ORDER BY","FROM"], 1, "WHERE filtert einzelne Zeilen vor der Gruppierung und kennt noch keine Gruppenergebnisse. Bedingungen auf Aggregatfunktionen wie COUNT oder SUM stehen deshalb im HAVING."],
  ["t2", "sql", "Für eine Kundenübersicht sollen alle Kunden mit ihren Bestellungen erscheinen, auch Kunden, die noch nie bestellt haben.\n\nWelcher Join liefert dieses Ergebnis?", ["Kunde INNER JOIN Bestellung","Kunde LEFT JOIN Bestellung","Kunde RIGHT JOIN Bestellung","Kunde CROSS JOIN Bestellung"], 1, "Der LEFT JOIN behält alle Zeilen der linken Tabelle (Kunde). Fehlt ein Partner in Bestellung, sind dessen Spalten NULL. Der INNER JOIN würde Kunden ohne Bestellung weglassen."],
  ["t2", "sql", "Ein Entwickler zählt die Bestellungen je Kunde mit Kunde LEFT JOIN Bestellung und COUNT(*). Die Bäckerei Roth hat noch nie bestellt.\n\nWelche Anzahl zeigt die Abfrage für die Bäckerei Roth?", ["0","1","NULL","Fehlermeldung"], 1, "Der LEFT JOIN erzeugt für die Bäckerei eine Zeile mit NULL-Werten in den Bestellspalten. COUNT(*) zählt diese Zeile mit, also 1. Richtig ist COUNT(B.BID): Es zählt nur Werte, die nicht NULL sind, und liefert 0."],
  ["t2", "sql", "In der Tabelle Kunde ist bei einigen Kunden keine E-Mail-Adresse hinterlegt. Diese Kunden sollen angeschrieben werden.\n\nWelche Bedingung findet die Kunden ohne E-Mail-Adresse?", ["WHERE Email = NULL","WHERE Email IS NULL","WHERE Email == NULL","WHERE Email LIKE NULL"], 1, "NULL bedeutet „unbekannt“. Jeder Vergleich mit = oder LIKE ergibt wieder „unbekannt“ und damit nie wahr. Auf NULL prüft man nur mit IS NULL bzw. IS NOT NULL."],
  ["t2", "sql", "Der Preis des Artikels 102 (Monitor 27 Zoll) steigt auf 269,90 €.\n\nMit welchem SQL-Befehl ändern Sie den vorhandenen Datensatz?", ["ALTER","UPDATE","INSERT","MODIFY"], 1, "UPDATE ändert Werte vorhandener Zeilen (DML): UPDATE Artikel SET Preis = 269.90 WHERE ArtNr = 102. ALTER ändert dagegen die Struktur einer Tabelle (DDL)."],
  ["t2", "sql", "Die Tabelle Kunde soll zusätzlich eine Telefonnummer speichern.\n\nWelcher Befehl ergänzt die Spalte?", ["UPDATE TABLE Kunde ADD Telefon","ALTER TABLE Kunde ADD Telefon VARCHAR(30)","INSERT COLUMN Telefon INTO Kunde","CREATE COLUMN Telefon ON Kunde"], 1, "Strukturänderungen gehören zur DDL. ALTER TABLE … ADD fügt eine Spalte mit Datentyp hinzu, ALTER TABLE … DROP COLUMN entfernt sie."],
  ["t2", "sql", "Der Auszubildende mit dem Datenbankbenutzer azubi soll die Tabelle Artikel lesen, aber nicht ändern dürfen.\n\nWelche Anweisung vergibt genau dieses Recht?", ["GRANT SELECT ON Artikel TO azubi;","ALLOW READ Artikel azubi;","REVOKE SELECT ON Artikel FROM azubi;","SET RIGHTS Artikel = 'read' FOR azubi;"], 0, "Rechte werden mit GRANT vergeben und mit REVOKE entzogen (DCL). SELECT erlaubt nur das Lesen."],
  ["t2", "sql", "Im Kundenstamm wird nach einem Namen gesucht, der „Meier“, „Maier“ oder „Mayer“ geschrieben sein kann. Die Bedingung lautet Name LIKE 'M_ier'.\n\nWas bewirkt der Unterstrich?", ["Er steht für beliebig viele Zeichen am Anfang.","Er steht für genau ein beliebiges Zeichen an dieser Stelle.","Er steht für beliebig viele Zeichen an dieser Stelle.","Er wird als normales Zeichen „_“ gesucht."], 1, "Bei LIKE steht _ für genau ein Zeichen, % für beliebig viele (auch keins). 'M_ier' findet Meier und Maier, aber nicht Mayer."],
  ["t2", "sql", "Eine Abfrage gruppiert die Artikel mit GROUP BY Kategorie und berechnet den Durchschnittspreis.\n\nWelche Spalten dürfen im SELECT stehen?", ["Beliebige Spalten der Tabelle Artikel","Nur die Gruppierungsspalten und Aggregatfunktionen","Nur Aggregatfunktionen","Nur der Primärschlüssel"], 1, "Pro Gruppe entsteht genau eine Ergebniszeile. Eine Spalte wie Bezeichnung hat in einer Gruppe aber mehrere Werte. Deshalb sind nur Gruppierungsspalten und Aggregate wie AVG(Preis) erlaubt."],
  ["t2", "sql", "Ein Kollege führt in der Produktivdatenbank die Anweisung UPDATE Artikel SET Preis = 0; aus.\n\nWas passiert?", ["Es erscheint eine Fehlermeldung, weil WHERE fehlt.","Nichts, weil kein Artikel ausgewählt ist.","Der Preis aller Artikel wird auf 0 gesetzt.","Nur der erste Artikel der Tabelle erhält den Preis 0."], 2, "Ohne WHERE gilt UPDATE (und ebenso DELETE) für alle Zeilen der Tabelle. Vor Änderungen deshalb die Bedingung erst mit einem SELECT testen und in einer Transaktion arbeiten."],
  ["t2", "sql", "Die Suche nach Kunden über den Ort ist bei großen Datenmengen langsam. Ein Kollege schlägt einen Index auf Kunde(Ort) vor.\n\nWas bewirkt der Index?", ["Er spart Speicherplatz.","Er beschleunigt Suche und Sortierung nach dem Ort.","Er verschlüsselt die Ortsangaben.","Er ersetzt den Fremdschlüssel."], 1, "Ein Index ist eine zusätzliche, sortierte Zugriffsstruktur. Lesen wird schneller, dafür kostet er Speicher und verlangsamt INSERT, UPDATE und DELETE etwas, weil er mitgepflegt werden muss."],
  ["t2", "sql", "Sie schreiben in der Prüfung eine Abfrage mit Gruppierung und Sortierung.\n\nIn welcher Reihenfolge müssen die Klauseln notiert werden?", ["SELECT, WHERE, FROM, GROUP BY","SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY","FROM, SELECT, HAVING, WHERE","SELECT, FROM, HAVING, WHERE, GROUP BY"], 1, "Die Schreibreihenfolge ist fest: SELECT – FROM (mit JOIN … ON) – WHERE – GROUP BY – HAVING – ORDER BY. Eine falsche Reihenfolge ist ein Syntaxfehler."],
  ["t2", "sql", "Jede Preisänderung in der Tabelle Artikel soll automatisch in einer Protokolltabelle festgehalten werden, egal welches Programm die Änderung auslöst.\n\nWelches Datenbankobjekt eignet sich dafür?", ["Ein Index","Ein Trigger, der bei UPDATE auf Artikel ausgeführt wird","Ein Benutzerrecht","Eine View"], 1, "Ein Trigger startet automatisch bei INSERT, UPDATE oder DELETE auf einer Tabelle. Er eignet sich für Protokollierung und Plausibilitätsprüfungen direkt in der Datenbank."],
  ["t2", "sql", "Die Kundenliste der Filiale Mainz und die der Filiale Worms sollen untereinander ausgegeben werden. Ein Kunde, der in beiden Listen steht, soll zweimal erscheinen.\n\nWelchen Operator verwenden Sie?", ["UNION – er entfernt Duplikate","UNION ALL – er behält Duplikate","JOIN – er setzt die Tabellen nebeneinander","INTERSECT – er liefert nur gemeinsame Zeilen"], 1, "UNION und UNION ALL hängen Ergebnisse gleicher Spaltenstruktur untereinander. UNION entfernt doppelte Zeilen, UNION ALL behält sie und ist dadurch auch schneller."],
  // ---------- Teil 2: Datenmodell
  ["t2", "dm", "Eine Tierarztpraxis speichert in der Tabelle Halter das Feld Telefonnummern mit dem Inhalt „0611-123, 0171-456“.\n\nWelche Normalform ist verletzt?", ["1. Normalform","2. Normalform","3. Normalform","Keine"], 0, "Die 1. NF verlangt atomare Werte: pro Feld genau ein Wert. Mehrere Telefonnummern gehören in eine eigene Tabelle (z. B. Telefon mit Fremdschlüssel auf Halter)."],
  ["t2", "dm", "Die Tabelle Kunde eines Online-Shops hat die Spalten KundenNr (PK), Name, PLZ und Ort.\n\nWelche Normalform ist verletzt?", ["1. Normalform","2. Normalform","3. Normalform","Keine"], 2, "Ort hängt nicht direkt vom Schlüssel ab, sondern über PLZ: KundenNr → PLZ → Ort. Diese transitive Abhängigkeit verletzt die 3. NF. Lösung: eigene Tabelle Ort(PLZ, Ort)."],
  ["t2", "dm", "Sie prüfen mehrere Tabellen eines Fitnessstudios auf die 2. Normalform.\n\nBei welchen Tabellen kann die 2. NF überhaupt verletzt sein?", ["Bei Tabellen mit zusammengesetztem Primärschlüssel","Bei Tabellen mit Fremdschlüsseln","Bei Tabellen mit Textspalten","Bei Tabellen mit Index"], 0, "Die 2. NF verbietet, dass ein Nichtschlüsselattribut nur von einem Teil des Schlüssels abhängt. Besteht der Schlüssel aus nur einem Attribut, gibt es keinen Teil – die 2. NF ist dann automatisch erfüllt."],
  ["t2", "dm", "In einer Musikschule kann jeder Schüler mehrere Kurse belegen und jeder Kurs hat mehrere Schüler.\n\nWie setzen Sie diese m:n-Beziehung im Relationenmodell um?", ["Je ein Fremdschlüssel in Schueler und Kurs","Eine Zwischentabelle mit beiden Fremdschlüsseln","Gar nicht, m:n ist relational nicht darstellbar","Eine der beiden Tabellen wird gelöscht"], 1, "Die m:n-Beziehung wird über eine Zwischentabelle (z. B. Belegung) aufgelöst. Sie enthält beide Fremdschlüssel, meist zusammen als Primärschlüssel, plus Beziehungsattribute wie das Anmeldedatum."],
  ["t2", "dm", "Eine Abteilung hat viele Mitarbeiter, ein Mitarbeiter gehört zu genau einer Abteilung.\n\nIn welcher Tabelle steht der Fremdschlüssel?", ["In Abteilung (1-Seite)","In Mitarbeiter (n-Seite)","In beiden Tabellen","In einer Zwischentabelle"], 1, "Bei 1:n steht der Fremdschlüssel immer auf der n-Seite: Mitarbeiter.AbteilungsNr verweist auf Abteilung. Umgekehrt müsste eine Abteilung mehrere Werte in einem Feld speichern."],
  ["t2", "dm", "In einer nicht normalisierten Tabelle Auftrag stehen Kundendaten und Auftragsdaten zusammen. Ein neuer Interessent kann erst gespeichert werden, wenn er einen Auftrag erteilt.\n\nWelche Anomalie liegt vor?", ["Einfügeanomalie","Änderungsanomalie","Löschanomalie","Keine Anomalie"], 0, "Bei der Einfügeanomalie lässt sich eine Information nicht speichern, ohne andere, noch fehlende Daten mitzuerfassen. Ursache ist die Vermischung zweier Entitäten in einer Tabelle."],
  ["t2", "dm", "Ein Datenbanksystem wirbt mit vollständiger ACID-Unterstützung.\n\nWofür steht das I in ACID?", ["Integrity","Isolation","Index","Identity"], 1, "ACID: Atomicity, Consistency, Isolation, Durability. Isolation bedeutet, dass sich parallel laufende Transaktionen nicht gegenseitig beeinflussen."],
  ["t2", "dm", "Eine Klinik speichert Röntgenbilder als unkomprimierte RGB-Bilder mit 24 Bit Farbtiefe.\n\nWie viele Byte belegt ein Pixel?", ["2 Byte","3 Byte","4 Byte","24 Byte"], 1, "24 Bit ÷ 8 Bit pro Byte = 3 Byte, je ein Byte für Rot, Grün und Blau."],
  ["t2", "dm", "Ein Speicherhersteller gibt die Kapazität in GiB an.\n\nWie viel Byte entspricht 1 GiB?", ["1.000.000.000 Byte","1.073.741.824 Byte","1.024.000 Byte","8.000.000.000 Bit"], 1, "GiB ist eine Binäreinheit: 1 GiB = 2³⁰ Byte = 1024³ Byte. 1 GB = 10⁹ Byte ist die Dezimaleinheit."],
  ["t2", "dm", "Für die Kundentabelle eines Versandhändlers soll der Datentyp der Postleitzahl festgelegt werden. Es gibt auch Kunden in Dresden (PLZ 01067).\n\nWelcher Datentyp passt?", ["INTEGER","CHAR(5) bzw. VARCHAR","FLOAT","BOOLEAN"], 1, "Bei einem Zahlentyp ginge die führende Null verloren (01067 → 1067). Mit der PLZ wird außerdem nicht gerechnet. Gleiches gilt für Telefonnummern."],
  ["t2", "dm", "In einer Bibliotheksdatenbank soll keine Ausleihe auf ein Buch verweisen, das es nicht gibt.\n\nWelches Prinzip stellt das sicher?", ["Schnelle Abfragen durch Indizes","Referentielle Integrität: Fremdschlüssel verweisen nur auf existierende Datensätze","Verschlüsselung der Datenbank","Eindeutige Spaltennamen"], 1, "Referentielle Integrität wird über FOREIGN KEY durchgesetzt. Das DBMS lehnt dann z. B. eine Ausleihe mit unbekannter BuchNr oder das Löschen eines ausgeliehenen Buches ab."],
  ["t2", "dm", "Ein Start-up speichert Produktbeschreibungen, deren Merkmale je nach Produkt stark variieren. Ein Produkt wird meist komplett geladen.\n\nWann ist eine dokumentenorientierte Datenbank sinnvoll?", ["Bei streng gleich strukturierten Buchungsdaten mit vielen Joins","Bei flexibel strukturierten Daten, die meist zusammen gelesen werden","Nur bei sehr kleinen Datenmengen","Nie, relationale Datenbanken sind immer besser"], 1, "Dokumentdatenbanken (z. B. MongoDB) speichern JSON-ähnliche Dokumente ohne festes Schema. Stark vernetzte, einheitliche Daten mit Transaktionen passen dagegen besser in ein relationales System."],

// Offene Fragen für den Real-Modus: Punkte p, Lösung a
const OPEN = [
  // ---------- Teil 1: Projektmanagement & Anforderungen
  { teil: "t1", cat: "pm", p: 8, q: "Ein Pflegedienst führt eine App zur Tourenplanung ein. Beschreiben Sie für zwei Stakeholder jeweils eine Erwartung, eine Befürchtung und eine geeignete Maßnahme.", a: "Pflegekräfte: Erwartung weniger Papier, Befürchtung Überwachung/Überforderung, Maßnahme frühe Einbindung, Schulung.\nGeschäftsführung: Erwartung effizientere Touren, Befürchtung Kostenüberschreitung, Maßnahme Kostencontrolling, Meilensteine.\nBetriebsrat: Erwartung faire Arbeitszeiten, Befürchtung Leistungskontrolle, Maßnahme Betriebsvereinbarung.\nJe Stakeholder 4 P (Erwartung, Befürchtung, Maßnahme, Bezug zur Situation)." },
  { teil: "t1", cat: "pm", p: 8, q: "Nennen Sie zwei Risiken für die Einführung einer neuen Warenwirtschaft und beschreiben Sie jeweils Ursache, Auswirkung und Gegenmaßnahme.", a: "Datenmigration fehlerhaft – Ursache: uneinheitliche Altdaten – Auswirkung: falsche Bestände – Gegenmaßnahme: Datenbereinigung, Testmigration.\nTerminverzug – Ursache: Aufwand unterschätzt – Auswirkung: Mehrkosten – Gegenmaßnahme: Puffer, Meilensteine, agile Planung.\nAkzeptanzprobleme – Ursache: fehlende Einbindung – Auswirkung: Nutzung bleibt aus – Gegenmaßnahme: Schulungen, Key-User.\nJe Risiko 4 P." },
  { teil: "t1", cat: "pm", p: 4, q: "Erläutern Sie den Unterschied zwischen klassischem und agilem Projektmanagement.", a: "Klassisch: lineare Phasen, Anforderungen vorab festgelegt (Lastenheft/Pflichtenheft), Änderungen aufwendig.\nAgil: iterativ in kurzen Zyklen, Anforderungen werden laufend angepasst, Kunde eng eingebunden, früh lauffähige Teilergebnisse." },
  { teil: "t1", cat: "pm", p: 4, q: "Begründen Sie, ob Sie für eine App mit noch unklaren Anforderungen agil oder klassisch vorgehen würden.", a: "Agil (z. B. Scrum): Anforderungen können nach jedem Sprint angepasst werden, frühes Feedback der Nutzer reduziert Fehlentwicklungen. Entscheidung 1 P, Begründung 3 P." },
  { teil: "t1", cat: "pm", p: 6, q: "Beschreiben Sie die drei Rollen in Scrum.", a: "Product Owner: verantwortet das Product Backlog und die Prioritäten, vertritt die Stakeholder.\nScrum Master: sorgt für die Einhaltung von Scrum, beseitigt Hindernisse.\nDevelopers: setzen die Backlog-Einträge im Sprint selbstorganisiert um." },
  { teil: "t1", cat: "pm", p: 6, q: "Formulieren Sie zwei User Stories für eine Kantinen-App (Speiseplan ansehen, Essen vorbestellen).", a: "Als Mitarbeiter möchte ich den Speiseplan der Woche sehen, damit ich mein Mittagessen planen kann.\nAls Mitarbeiter möchte ich ein Gericht bis 10 Uhr vorbestellen, damit es für mich reserviert ist.\nJe Story 3 P (Rolle, Funktion, Nutzen)." },
  { teil: "t1", cat: "pm", p: 4, q: "Unterscheiden Sie Lastenheft und Pflichtenheft.", a: "Lastenheft: vom Auftraggeber, beschreibt was gefordert ist.\nPflichtenheft: vom Auftragnehmer, beschreibt wie die Anforderungen umgesetzt werden." },
  { teil: "t1", cat: "pm", p: 6, q: "Nennen und erläutern Sie drei Kriterien einer Machbarkeitsstudie.", a: "Technisch (Infrastruktur, Know-how vorhanden?), wirtschaftlich (Kosten/Nutzen, Amortisation), organisatorisch (Personal, Zeit), rechtlich (Datenschutz, Lizenzen), Markt (Bedarf, Konkurrenz). Je 2 P." },
  { teil: "t1", cat: "pm", p: 4, q: "Nennen Sie je zwei funktionale und zwei nichtfunktionale Anforderungen an ein Online-Ticketsystem für ein Theater.", a: "Funktional: Sitzplatz auswählen, Ticket bezahlen, Ticket als QR-Code erhalten, Buchung stornieren.\nNichtfunktional: Verfügbarkeit 99 %, Antwortzeit < 2 s, Barrierefreiheit, sichere Zahlungsabwicklung (TLS)." },
  { teil: "t1", cat: "pm", p: 4, q: "Beschreiben Sie zwei Möglichkeiten, nach Projektende den Projekterfolg zu prüfen.", a: "Soll-Ist-Vergleich mit Pflichtenheft (Funktionen), Budget und Termin; Befragung der Nutzer zur Zufriedenheit; Kennzahlen vorher/nachher (z. B. Bearbeitungszeit); Abnahmeprotokoll; Lessons Learned." },
  { teil: "t1", cat: "pm", p: 4, q: "Nennen Sie vier Kostenarten in einem Softwareprojekt mit Beispiel.", a: "Personalkosten (Entwicklergehälter), Hardwarekosten (Server, Scanner), Softwarekosten (Lizenzen), Schulungskosten (Trainer), externe Dienstleister, Betriebskosten (Cloud). Je 1 P." },
  { teil: "t1", cat: "pm", p: 20, q: "Netzplan. Vorgänge (Dauer in Tagen, Vorgänger): A Analyse 4, –; B Datenbank 6, A; C Oberfläche 5, A; D Schnittstelle 3, A; E Logik 7, B; F Test 4, C, D, E; G Doku 3, C; H Einführung 2, F, G.\na) Berechnen Sie FAZ, FEZ, SAZ, SEZ, GP und FP (14 P).\nb) Kritischer Pfad und Projektdauer (3 P).\nc) Was bedeutet ein freier Puffer von 0 bei einem Vorgang mit Gesamtpuffer > 0? (3 P)", a: "A 0|4|0|4 GP0 FP0\nB 4|10|4|10 GP0 FP0\nC 4|9|12|17 GP8 FP0\nD 4|7|14|17 GP10 FP10\nE 10|17|10|17 GP0 FP0\nF 17|21|17|21 GP0 FP0\nG 9|12|18|21 GP9 FP9\nH 21|23|21|23 GP0 FP0\n\nb) A – B – E – F – H, 23 Tage.\nc) Der Vorgang kann sich zwar verschieben, ohne das Projektende zu gefährden, aber jede Verschiebung verschiebt sofort einen Nachfolger (bei C: G beginnt sonst später)." },
  { teil: "t1", cat: "pm", p: 3, q: "Was versteht man unter Lessons Learned?", a: "Am Projektende gesammelte positive und negative Erfahrungen, dokumentiert, damit künftige Projekte davon profitieren." },
  { teil: "t1", cat: "pm", p: 4, q: "Nennen Sie zwei Vor- und Nachteile, die Softwareentwicklung an einen externen Dienstleister zu vergeben (Outsourcing).", a: "Vorteile: Know-how von Spezialisten, planbare Kosten (Festpreis), interne Ressourcen frei.\nNachteile: Abhängigkeit, Know-how-Verlust, Abstimmungsaufwand, Datenschutzrisiken." },
  // ---------- Teil 1: Modellierung & OOP
  { teil: "t1", cat: "mod", p: 14, q: "Use-Case-Diagramm Bibliothek: Leser können Medien suchen, ausleihen und verlängern. Zum Ausleihen und Verlängern müssen sie sich anmelden. Ist ein Medium ausgeliehen, kann der Leser es optional vormerken (beim Suchen). Mitarbeitende können ebenfalls ausleihen und zusätzlich Medien erfassen und Mahnungen versenden. Mitarbeitende sind spezielle Leser.\nErstellen Sie das Use-Case-Diagramm.", a: "Systemgrenze „Bibliothekssystem“ (1 P).\nAkteure: Leser, Mitarbeiter; Generalisierung Mitarbeiter → Leser (3 P).\nAnwendungsfälle: Medium suchen, Medium ausleihen, Ausleihe verlängern, Anmelden, Medium vormerken, Medium erfassen, Mahnung versenden (7 P).\nBeziehungen: ausleihen <<include>> anmelden, verlängern <<include>> anmelden, vormerken <<extend>> suchen (3 P)." },
  { teil: "t1", cat: "mod", p: 13, q: "Klassendiagramm: Ein Online-Kurs-Anbieter hat Kurse (Titel, Preis). Es gibt Videokurse (Dauer in Minuten) und Livekurse (Termin, maxTeilnehmer). Jeder Kurs hat genau einen Dozenten (Name, Fachgebiet), ein Dozent hält beliebig viele Kurse. Teilnehmer (Name, Email) buchen Kurse; eine Buchung hat ein Datum. Alle Kurse haben getPreis(): Double; Livekurse berechnen 10 % Zuschlag.\nErstellen Sie das Klassendiagramm mit Sichtbarkeiten, Datentypen und Multiplizitäten.", a: "{abstract} Kurs: - titel: String, - preis: Double, + getPreis(): Double\nVideokurs (erbt): - dauer: Integer\nLivekurs (erbt): - termin: DateTime, - maxTeilnehmer: Integer, + getPreis(): Double (überschrieben)\nDozent: - name: String, - fachgebiet: String\nTeilnehmer: - name: String, - email: String\nBuchung: - datum: Date\nDozent 1 — 0..* Kurs; Teilnehmer 1 — 0..* Buchung; Buchung 0..* — 1 Kurs.\nKlassen je 1 P, Attribute/Typen 4 P, Vererbung 2 P, Beziehungen mit Multiplizität 3 P." },
  { teil: "t1", cat: "mod", p: 4, q: "Erklären Sie Polymorphie an einem selbst gewählten Beispiel.", a: "Methode flaeche() in Oberklasse Form, überschrieben in Kreis und Rechteck. Eine Liste von Formen wird durchlaufen und form.flaeche() aufgerufen; zur Laufzeit wird je nach Objekt die passende Implementierung ausgeführt (dynamisches Binden)." },
  { teil: "t1", cat: "mod", p: 4, q: "Unterscheiden Sie Aggregation und Komposition und nennen Sie je ein Beispiel.", a: "Beide Ganzes-Teil-Beziehungen. Aggregation (leere Raute): Teil existiert unabhängig (Team – Mitarbeiter). Komposition (gefüllte Raute): Teil ist existenzabhängig (Rechnung – Rechnungsposition)." },
  { teil: "t1", cat: "mod", p: 4, q: "Unterscheiden Sie abstrakte Klasse und Interface.", a: "Abstrakte Klasse: kann Attribute und implementierte Methoden enthalten, Einfachvererbung, nicht instanziierbar.\nInterface: nur Methodensignaturen (Vertrag), eine Klasse kann mehrere implementieren." },
  { teil: "t1", cat: "mod", p: 5, q: "Beschreiben Sie das Singleton-Muster und wie es umgesetzt wird.", a: "Erzeugungsmuster: Es gibt genau eine Instanz einer Klasse mit globalem Zugriffspunkt, z. B. für eine Konfiguration oder Datenbankverbindung. Umsetzung: privater Konstruktor, privates statisches Attribut instance, öffentliche statische Methode getInstance(), die die Instanz bei Bedarf erzeugt und zurückgibt." },
  { teil: "t1", cat: "mod", p: 5, q: "Erläutern Sie das Observer-Muster an einem Wetterstation-Beispiel.", a: "Die Wetterstation (Subjekt) hält eine Liste von Beobachtern (Anzeige, App, Logger). Sie bietet addObserver() und notifyObservers(). Bei neuen Messwerten ruft sie bei allen Beobachtern update() auf. Vorteil: lose Kopplung, neue Anzeigen ohne Änderung der Station." },
  { teil: "t1", cat: "mod", p: 5, q: "Erläutern Sie das Factory-Muster und seinen Vorteil.", a: "Die Erzeugung von Objekten wird in eine Fabrikmethode ausgelagert, z. B. createBesucher(typ) liefert je nach Typ StandardBesucher oder VipBesucher. Der Aufrufer arbeitet nur mit der Oberklasse/dem Interface. Vorteil: neue Typen ohne Änderung des aufrufenden Codes, zentrale Erzeugungslogik." },
  { teil: "t1", cat: "mod", p: 4, q: "Beschreiben Sie das MVC-Muster.", a: "Model: Daten und Geschäftslogik. View: Darstellung. Controller: nimmt Eingaben entgegen, ruft das Model auf und aktualisiert die View. Vorteil: Trennung von Darstellung und Logik, bessere Wartbarkeit und Testbarkeit." },
  { teil: "t1", cat: "mod", p: 12, q: "Zustandsdiagramm Bestellung: Eine Bestellung ist zunächst offen. Nach Zahlungseingang ist sie bezahlt; wird sie vorher storniert, ist sie storniert. Eine bezahlte Bestellung wird versendet und ist dann unterwegs; bei Zustellung ist sie zugestellt. Geht ein Paket zurück, ist sie retourniert und wird nach Erstattung abgeschlossen. Zugestellte Bestellungen werden nach 14 Tagen abgeschlossen.", a: "● → offen\noffen → bezahlt: Zahlungseingang\noffen → storniert: stornieren\nbezahlt → unterwegs: versenden\nunterwegs → zugestellt: zustellen\nunterwegs → retourniert: Rücksendung\nretourniert → abgeschlossen: erstatten / Gutschrift\nzugestellt → abgeschlossen: nach 14 Tagen\nstorniert, abgeschlossen → ◉\nZustände je 1 P (7), Übergänge mit Beschriftung je 0,5–1 P (5)." },
  { teil: "t1", cat: "mod", p: 15, q: "Aktivitätsdiagramm Urlaubsantrag mit Partitionen Mitarbeiter, Vorgesetzter, Personalabteilung: Der Mitarbeiter stellt den Antrag. Der Vorgesetzte prüft die Personalplanung. Lehnt er ab, wird der Mitarbeiter informiert (Ende). Genehmigt er, prüft die Personalabteilung den Resturlaub. Reicht er nicht, Ablehnung an den Mitarbeiter (Ende). Sonst parallel: Urlaub im System buchen und Kalendereintrag erstellen; danach Bestätigung an den Mitarbeiter.", a: "Mitarbeiter: ● → [Antrag stellen]\nVorgesetzter: [Personalplanung prüfen] → ◇ [abgelehnt] → [Mitarbeiter informieren] → ◉ / [genehmigt]\nPersonalabteilung: [Resturlaub prüfen] → ◇ [nicht ausreichend] → [Ablehnung senden] → ◉ / [ausreichend] → Fork\n  [Urlaub buchen] ‖ [Kalendereintrag erstellen] → Join → [Bestätigung senden] → ◉\nAktionen je 1 P (7), Verzweigungen mit Bedingungen je 2 P (4), Fork/Join 2 P, Partitionen/Start/Ende 2 P." },
  // ---------- Teil 1: Sicherheit & Netzwerk
  { teil: "t1", cat: "sec", p: 6, q: "Erklären Sie, wie TLS eine Verbindung absichert. Gehen Sie auf Zertifikat und hybride Verschlüsselung ein.", a: "Server sendet sein von einer CA signiertes Zertifikat, der Client prüft die Echtheit. Mit asymmetrischen Verfahren wird ein gemeinsamer Sitzungsschlüssel ausgehandelt. Die Nutzdaten werden symmetrisch verschlüsselt (schnell). Ergebnis: Vertraulichkeit, Integrität, Authentizität des Servers." },
  { teil: "t1", cat: "sec", p: 4, q: "Wie sollten Passwörter in einer Datenbank gespeichert werden? Begründen Sie.", a: "Als Hash mit langsamer Hashfunktion (bcrypt/Argon2) und individuellem Salt. Kein Klartext und keine umkehrbare Verschlüsselung; Salt verhindert Rainbow-Table-Angriffe und gleiche Hashes bei gleichen Passwörtern." },
  { teil: "t1", cat: "sec", p: 6, q: "Erklären Sie SQL-Injection an einem Beispiel und nennen Sie zwei Gegenmaßnahmen.", a: "Eingaben werden ungeprüft in SQL eingesetzt. Eingabe  ' OR '1'='1  im Passwortfeld macht die WHERE-Bedingung immer wahr → Anmeldung ohne Passwort. Gegenmaßnahmen: Prepared Statements, Eingabevalidierung, minimale DB-Rechte, ORM." },
  { teil: "t1", cat: "sec", p: 6, q: "Nennen Sie die drei Schutzziele der Informationssicherheit und je eine Maßnahme.", a: "Vertraulichkeit – Verschlüsselung, Zugriffsrechte. Integrität – Hashes/Signaturen, Protokollierung. Verfügbarkeit – Backups, Redundanz, USV, DDoS-Schutz." },
  { teil: "t1", cat: "sec", p: 4, q: "Unterscheiden Sie symmetrische und asymmetrische Verschlüsselung.", a: "Symmetrisch: ein gemeinsamer Schlüssel, schnell, Problem der Schlüsselverteilung (AES). Asymmetrisch: Schlüsselpaar öffentlich/privat, kein vorheriger Austausch, langsamer (RSA)." },
  { teil: "t1", cat: "sec", p: 4, q: "Wie funktioniert eine digitale Signatur und welche Schutzziele sichert sie?", a: "Absender bildet Hash der Nachricht und verschlüsselt ihn mit seinem privaten Schlüssel. Empfänger entschlüsselt mit dem öffentlichen Schlüssel und vergleicht mit eigenem Hash. Sichert Integrität und Authentizität (Verbindlichkeit)." },
  { teil: "t1", cat: "sec", p: 4, q: "Ein Kollege schlägt vor, Sensordaten nur mit einem Hash statt mit Verschlüsselung zu übertragen. Bewerten Sie den Vorschlag.", a: "Ein Hash (besser HMAC mit geheimem Schlüssel) sichert Integrität und erkennt Manipulation, aber keine Vertraulichkeit. Sind die Daten nicht geheim, ist das sinnvoll und spart Rechenleistung. Ein reiner Hash ohne Schlüssel kann vom Angreifer neu berechnet werden." },
  { teil: "t1", cat: "sec", p: 4, q: "Nennen Sie je einen Vor- und Nachteil von Single Sign-On.", a: "Vorteil: ein Login für viele Dienste, zentrale Rechteverwaltung, schnelles Sperren. Nachteil: Ein kompromittierter Zugang öffnet alle Dienste, Abhängigkeit vom Identity Provider." },
  { teil: "t1", cat: "sec", p: 3, q: "Was ist ein Man-in-the-Middle-Angriff und wie schützt man sich?", a: "Angreifer sitzt unbemerkt zwischen den Kommunikationspartnern und liest oder manipuliert Daten. Schutz: TLS mit Zertifikatsprüfung, VPN, keine offenen WLANs ohne Verschlüsselung." },
  { teil: "t1", cat: "sec", p: 3, q: "Erklären Sie einen DDoS-Angriff und eine Gegenmaßnahme.", a: "Viele gekaperte Systeme (Botnetz) überlasten einen Dienst mit Anfragen, Ziel ist die Verfügbarkeit. Gegenmaßnahmen: Rate Limiting, Filter, CDN/DDoS-Schutzdienst, Skalierung." },
  { teil: "t1", cat: "sec", p: 4, q: "Beschreiben Sie das Grundprinzip von Kerberos.", a: "Authentifizierung über ein Key Distribution Center. Der Nutzer meldet sich einmal an und erhält ein Ticket Granting Ticket; damit bekommt er Service-Tickets für einzelne Dienste. Das Passwort wird nicht über das Netz geschickt. Grundlage für SSO im Active Directory." },
  { teil: "t1", cat: "sec", p: 4, q: "Nennen Sie vier technisch-organisatorische Maßnahmen nach DSGVO.", a: "Zutrittskontrolle (Serverraum), Zugangskontrolle (Passwörter, 2FA), Zugriffskontrolle (Rollen), Weitergabekontrolle (Verschlüsselung), Eingabekontrolle (Protokollierung), Verfügbarkeitskontrolle (Backup)." },
  { teil: "t1", cat: "sec", p: 6, q: "Ordnen Sie zu und begründen Sie: Rechenzentrum mit hohem Speicherbedarf, Bürogebäude, Bodenfeuchtesensoren auf einem Feld. Netzwerkkonzepte: LAN, SAN, LPWAN.", a: "Rechenzentrum – SAN: schneller Blockzugriff auf zentralen Speicher, skalierbar.\nBüro – LAN: hohe Bandbreite, geringe Latenz, Ressourcen teilen.\nFeld – LPWAN (LoRaWAN): große Reichweite, sehr geringer Energieverbrauch, geringe Datenmengen. Je Zuordnung 1 P, Begründung 1 P." },
  { teil: "t1", cat: "sec", p: 3, q: "Beschreiben Sie den Aufbau einer MAC-Adresse.", a: "48 Bit (6 Byte), hexadezimal geschrieben. Die ersten 3 Byte sind die Herstellerkennung (OUI), die letzten 3 Byte die Gerätenummer." },
  { teil: "t1", cat: "sec", p: 4, q: "Unterscheiden Sie Switch und Router.", a: "Switch: verbindet Geräte innerhalb eines Netzes, leitet anhand der MAC-Adresse weiter (Schicht 2). Router: verbindet verschiedene Netze, leitet anhand der IP-Adresse weiter (Schicht 3)." },
  { teil: "t1", cat: "sec", p: 6, q: "Erläutern Sie CI/CD und nennen Sie zwei Vorteile.", a: "Continuous Integration: Codeänderungen werden häufig zusammengeführt und automatisch gebaut und getestet. Continuous Delivery/Deployment: automatisierte Auslieferung über Pipelines. Vorteile: Fehler früh erkannt, einheitliche Umgebungen, schnelle Rollbacks, keine manuellen Zugriffe auf Produktion nötig." },
  { teil: "t1", cat: "sec", p: 4, q: "Nennen Sie vier Rechte betroffener Personen nach DSGVO.", a: "Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit, Widerspruch." },
  // ---------- Teil 1: Web, UI & Qualität
  { teil: "t1", cat: "ux", p: 4, q: "Erläutern Sie zwei Prinzipien einer REST-API.", a: "Ressourcen über eindeutige URLs; einheitliche Schnittstelle mit HTTP-Methoden; zustandslos; Client-Server-Trennung; Darstellung meist JSON." },
  { teil: "t1", cat: "ux", p: 4, q: "Ordnen Sie den CRUD-Operationen die HTTP-Methoden zu.", a: "Create – POST, Read – GET, Update – PUT/PATCH, Delete – DELETE." },
  { teil: "t1", cat: "ux", p: 3, q: "Erklären Sie die Statuscode-Klassen 2xx, 4xx und 5xx.", a: "2xx Erfolg (200, 201), 4xx Fehler des Clients (400, 401, 404), 5xx Fehler des Servers (500, 503)." },
  { teil: "t1", cat: "ux", p: 3, q: "GET https://api.wetter.de/v1/forecast?city=Mainz&days=3&units=metric – beschreiben Sie die Bestandteile der URL.", a: "https: Protokoll, api.wetter.de: Host, /v1/forecast: Pfad/Endpunkt (Version 1), ?city=Mainz&days=3&units=metric: Query-Parameter (Ort, Anzahl Tage, Einheiten)." },
  { teil: "t1", cat: "ux", p: 4, q: "Unterscheiden Sie wohlgeformtes und gültiges XML.", a: "Wohlgeformt: Syntaxregeln erfüllt (genau ein Wurzelelement, Tags korrekt geschlossen und verschachtelt, Attribute in Anführungszeichen). Gültig: zusätzlich konform zu DTD oder XML-Schema; setzt Wohlgeformtheit voraus." },
  { teil: "t1", cat: "ux", p: 8, q: "Beschreiben Sie zwei Anforderungen an barrierefreie Software und je eine Maßnahme.", a: "Wahrnehmbar für Sehbehinderte – Alternativtexte, Screenreader-Unterstützung, hoher Kontrast, skalierbare Schrift.\nBedienbar ohne Maus – vollständige Tastaturbedienung, sichtbarer Fokus.\nVerständlich – einfache Sprache, klare Fehlermeldungen.\nFarbunabhängig – Informationen nicht nur über Farbe. Je Anforderung 2 P, Maßnahme 2 P." },
  { teil: "t1", cat: "ux", p: 4, q: "Nennen Sie zwei Vorteile von Mockups in der App-Entwicklung.", a: "Frühes Feedback vom Kunden, Missverständnisse werden vor der Programmierung erkannt, Änderungen sind günstig, Grundlage für Entwicklung und Usability-Tests." },
  { teil: "t1", cat: "ux", p: 6, q: "Skizzieren Sie in Stichpunkten ein Mockup für eine Seite „Neuen Patienten anlegen“ und begründen Sie zwei Gestaltungsentscheidungen.", a: "Überschrift, beschriftete Eingabefelder (Name, Vorname, Geburtsdatum mit Datumsauswahl), Auswahlfeld Krankenkasse, Pflichtfelder markiert, Buttons Speichern und Abbrechen.\nBegründung: Auswahlfeld vermeidet Tippfehler, Datumsauswahl verhindert falsche Formate, klare Primäraktion." },
  { teil: "t1", cat: "ux", p: 5, q: "Beschreiben Sie das Qualitätsmerkmal Zuverlässigkeit nach ISO/IEC 25010 und ein weiteres Merkmal.", a: "Zuverlässigkeit: Software erbringt ihre Funktion unter festgelegten Bedingungen über einen Zeitraum (Reife, Verfügbarkeit, Fehlertoleranz, Wiederherstellbarkeit).\nWeiteres z. B. Wartbarkeit: Änderungen und Fehlerbehebungen sind mit geringem Aufwand möglich." },
  { teil: "t1", cat: "ux", p: 4, q: "Nennen Sie vier qualitätssichernde Maßnahmen in der Softwareentwicklung.", a: "Code-Reviews, automatisierte Tests in CI, Coding-Standards, statische Codeanalyse, Pair Programming, standardisiertes Vorgehensmodell, Testkonzept." },
  { teil: "t1", cat: "ux", p: 6, q: "Beschreiben Sie sechs Inhalte eines Testkonzepts.", a: "Testziele, Teststufen, Testmethoden, Testumgebung, Testdaten, Verantwortlichkeiten, Zeitplan, Ende-Kriterien, Dokumentation der Ergebnisse. Je 1 P." },
  { teil: "t1", cat: "ux", p: 4, q: "Beschreiben Sie den typischen Aufbau einer Webanwendung (drei Schichten).", a: "Frontend/Präsentation im Browser, Backend/Applikationsserver mit Geschäftslogik und API, Datenbank. Das Frontend ruft per HTTP das Backend auf, das Backend greift auf die Datenbank zu." },
  { teil: "t1", cat: "ux", p: 3, q: "Schreiben Sie einen JSON-Datensatz für einen Kunden mit Name, Kundennummer und zwei Telefonnummern.", a: "{\n  \"name\": \"Lena Weber\",\n  \"kundennummer\": 1042,\n  \"telefon\": [\"06131 123456\", \"0171 987654\"]\n}" },

  // ---------- Teil 2: Pseudocode
  { teil: "t2", cat: "algo", p: 15, q: UEB_TEXT("P1"), a: UEB_LOES("P1") },
  { teil: "t2", cat: "algo", p: 20, q: UEB_TEXT("P2"), a: UEB_LOES("P2") },
  { teil: "t2", cat: "algo", p: 20, q: UEB_TEXT("P3"), a: UEB_LOES("P3") },
  { teil: "t2", cat: "algo", p: 15, q: UEB_TEXT("P4"), a: UEB_LOES("P4") },
  { teil: "t2", cat: "algo", p: 20, q: UEB_TEXT("P5"), a: UEB_LOES("P5") },
  { teil: "t2", cat: "algo", p: 20, q: "Ein Lager verwaltet List<Artikel>. Artikel hat getNr(), getBestand(), getMindestbestand(), getLieferant(): String.\nEntwickeln Sie nachbestellen(lager: List<Artikel>, lieferant: String) : List<Integer>.\nSie liefert die Nummern aller Artikel des angegebenen Lieferanten, deren Bestand unter dem Mindestbestand liegt. Gibt es keine, wird eine leere Liste zurückgegeben.", a: "nachbestellen(lager: List<Artikel>, lieferant: String) : List<Integer>\n  ergebnis = new List<Integer>()\n  für i = 0 bis lager.size() - 1\n    a = lager.get(i)\n    wenn a.getLieferant() == lieferant und a.getBestand() < a.getMindestbestand() dann\n      ergebnis.add(a.getNr())\n    ende wenn\n  ende für\n  Rückgabe ergebnis\nende nachbestellen\nListe 3 P, Schleife 5 P, beide Bedingungen 8 P, Rückgabe 4 P." },
  { teil: "t2", cat: "algo", p: 15, q: "Ein Passwort soll geprüft werden: mindestens 10 Zeichen, mindestens eine Ziffer und mindestens ein Großbuchstabe. Verfügbar: laenge(s), zeichenAn(s, i), istZiffer(c), istGross(c).\nEntwickeln Sie pruefePasswort(pw: String) : Boolean.", a: "pruefePasswort(pw: String) : Boolean\n  wenn laenge(pw) < 10 dann\n    Rückgabe false\n  ende wenn\n  ziffer = false\n  gross = false\n  für i = 0 bis laenge(pw) - 1\n    c = zeichenAn(pw, i)\n    wenn istZiffer(c) dann ziffer = true ende wenn\n    wenn istGross(c) dann gross = true ende wenn\n  ende für\n  Rückgabe ziffer und gross\nende pruefePasswort\nLängenprüfung (>= 10!) 3 P, Flags 3 P, Schleife bis laenge − 1 4 P, Prüfungen 3 P, Rückgabe 2 P." },
  { teil: "t2", cat: "algo", p: 20, q: "Raumbuchungen liegen als Array buchungen: Buchung[] vor. Buchung hat getRaum(): Integer, getStart(): Integer und getEnde(): Integer (Minuten seit Mitternacht).\nEntwickeln Sie istFrei(buchungen: Buchung[], raum: Integer, start: Integer, ende: Integer) : Boolean.\nDer Raum ist frei, wenn keine Buchung dieses Raums sich mit dem Zeitraum überschneidet. Zwei Zeiträume überschneiden sich, wenn start1 < ende2 und start2 < ende1.", a: "istFrei(buchungen: Buchung[], raum: Integer, start: Integer, ende: Integer) : Boolean\n  für i = 0 bis buchungen.length - 1\n    b = buchungen[i]\n    wenn b.getRaum() == raum und start < b.getEnde() und b.getStart() < ende dann\n      Rückgabe false\n    ende wenn\n  ende für\n  Rückgabe true\nende istFrei\nSchleife 5 P, Raumvergleich 4 P, Überschneidung korrekt 7 P, Rückgaben 4 P." },
  { teil: "t2", cat: "algo", p: 10, q: "Schreiben Sie eine rekursive Funktion quersumme(n: Integer) : Integer (z. B. quersumme(472) = 13) und nennen Sie je einen Vor- und Nachteil der Rekursion.", a: "quersumme(n: Integer) : Integer\n  wenn n < 10 dann\n    Rückgabe n\n  ende wenn\n  Rückgabe (n mod 10) + quersumme(n div 10)\nende quersumme\nVorteil: kurz und elegant bei rekursiven Problemen. Nachteil: Speicherbedarf auf dem Stack, Gefahr Stack Overflow. Code 6 P, Vor-/Nachteil 4 P." },
  { teil: "t2", cat: "algo", p: 5, q: "Führen Sie einen Schreibtischtest durch und geben Sie die Ausgabe an:\nx = 1\nfür i = 1 bis 4\n  wenn i mod 2 == 0 dann\n    x = x * i\n  sonst\n    x = x + i\n  ende wenn\nende für\nAusgabe(x)", a: "i=1: x = 1 + 1 = 2\ni=2: x = 2 · 2 = 4\ni=3: x = 4 + 3 = 7\ni=4: x = 7 · 4 = 28\nAusgabe: 28" },
  { teil: "t2", cat: "algo", p: 10, q: "Implementieren Sie Bubble Sort für ein Array mitarbeiter: Mitarbeiter[], aufsteigend nach getEintritt() (Date-Werte sind mit < vergleichbar).", a: "für i = 0 bis mitarbeiter.length - 2\n  für j = 0 bis mitarbeiter.length - 2 - i\n    wenn mitarbeiter[j].getEintritt() > mitarbeiter[j + 1].getEintritt() dann\n      tmp = mitarbeiter[j]\n      mitarbeiter[j] = mitarbeiter[j + 1]\n      mitarbeiter[j + 1] = tmp\n    ende wenn\n  ende für\nende für" },
  { teil: "t2", cat: "algo", p: 5, q: "Erklären Sie, warum Pseudocode in der Prüfung statt einer konkreten Programmiersprache verwendet wird, und nennen Sie zwei Regeln für gut lesbaren Pseudocode.", a: "Unabhängig von einer Sprache und für Dritte verständlich. Regeln: einheitliche Schlüsselwörter (wenn/ende wenn), Einrückung, sprechende Variablennamen, Datentypen bei Parametern angeben." },
  // ---------- Teil 2: SQL (Schema Kunde/Artikel/Bestellung/Position)
  { teil: "t2", cat: "sql", p: 16, schema: true, q: UEB_TEXT("S1"), a: UEB_LOES("S1") },
  { teil: "t2", cat: "sql", p: 13, schema: true, q: UEB_TEXT("S2"), a: UEB_LOES("S2") },
  { teil: "t2", cat: "sql", p: 15, schema: true, q: UEB_TEXT("S3"), a: UEB_LOES("S3") },
  { teil: "t2", cat: "sql", p: 16, schema: true, q: UEB_TEXT("S4"), a: UEB_LOES("S4") },
  { teil: "t2", cat: "sql", p: 3, schema: true, q: "Geben Sie die Anzahl der Artikel je Kategorie aus.", a: "SELECT Kategorie, COUNT(*) AS Anzahl\nFROM Artikel\nGROUP BY Kategorie;" },
  { teil: "t2", cat: "sql", p: 4, schema: true, q: "Geben Sie alle Kategorien aus, deren Durchschnittspreis über 50 € liegt, absteigend nach Durchschnittspreis.", a: "SELECT Kategorie, AVG(Preis) AS Schnitt\nFROM Artikel\nGROUP BY Kategorie\nHAVING AVG(Preis) > 50\nORDER BY Schnitt DESC;" },
  { teil: "t2", cat: "sql", p: 5, schema: true, q: "Geben Sie Name und Anzahl Bestellungen aller Kunden mit mindestens 5 Bestellungen aus.", a: "SELECT K.Name, COUNT(B.BID) AS Anzahl\nFROM Kunde AS K\nINNER JOIN Bestellung AS B ON B.KID = K.KID\nGROUP BY K.KID, K.Name\nHAVING COUNT(B.BID) >= 5;" },
  { teil: "t2", cat: "sql", p: 3, schema: true, q: "Setzen Sie den Status der Bestellung 1005 auf 'storniert'.", a: "UPDATE Bestellung SET Status = 'storniert' WHERE BID = 1005;" },
  { teil: "t2", cat: "sql", p: 4, schema: true, q: "Geben Sie alle offenen Bestellungen (Status 'offen') aus dem Oktober 2026 mit dem Namen des Kunden aus, sortiert nach Datum.", a: "SELECT B.BID, B.Datum, K.Name\nFROM Bestellung AS B\nINNER JOIN Kunde AS K ON K.KID = B.KID\nWHERE B.Status = 'offen'\n  AND B.Datum BETWEEN '2026-10-01' AND '2026-10-31'\nORDER BY B.Datum;" },
  { teil: "t2", cat: "sql", p: 6, schema: true, q: "Ermitteln Sie für jeden Artikel die insgesamt verkaufte Menge, auch für Artikel, die nie verkauft wurden (dann 0).", a: "SELECT A.ArtNr, A.Bezeichnung, COALESCE(SUM(P.Menge), 0) AS Menge\nFROM Artikel AS A\nLEFT JOIN Position AS P ON P.ArtNr = A.ArtNr\nGROUP BY A.ArtNr, A.Bezeichnung;\n(Ohne COALESCE NULL statt 0 – mit Hinweis ebenfalls volle Punktzahl.)" },
  { teil: "t2", cat: "sql", p: 4, schema: true, q: "Geben Sie alle Kunden aus, deren E-Mail-Adresse auf '@web.de' endet oder die keine E-Mail-Adresse haben.", a: "SELECT * FROM Kunde\nWHERE Email LIKE '%@web.de' OR Email IS NULL;" },
  { teil: "t2", cat: "sql", p: 6, schema: true, q: "Ermitteln Sie den Gesamtumsatz (Menge × Preis) je Monat im Jahr 2026.", a: "SELECT MONTH(B.Datum) AS Monat, SUM(P.Menge * A.Preis) AS Umsatz\nFROM Bestellung AS B\nINNER JOIN Position AS P ON P.BID = B.BID\nINNER JOIN Artikel AS A ON A.ArtNr = P.ArtNr\nWHERE YEAR(B.Datum) = 2026\nGROUP BY MONTH(B.Datum)\nORDER BY Monat;" },
  { teil: "t2", cat: "sql", p: 5, schema: true, q: "Ändern Sie die Spalte Email so, dass sie Pflichtfeld ist. Vorhandene NULL-Werte sollen vorher auf 'unbekannt@firma.de' gesetzt werden.", a: "UPDATE Kunde SET Email = 'unbekannt@firma.de' WHERE Email IS NULL;\nALTER TABLE Kunde MODIFY Email VARCHAR(100) NOT NULL;\n(je nach DBMS ALTER COLUMN)" },
  { teil: "t2", cat: "sql", p: 3, schema: true, q: "Legen Sie einen Benutzer 'controlling' an, der nur Bestellungen und Positionen lesen darf.", a: "CREATE USER controlling IDENTIFIED BY 'Start#2026';\nGRANT SELECT ON Bestellung TO controlling;\nGRANT SELECT ON Position TO controlling;" },
  { teil: "t2", cat: "sql", p: 6, q: "Erklären Sie Stored Procedure, Trigger und Index jeweils in einem Satz.", a: "Stored Procedure: in der Datenbank gespeicherte Folge von Anweisungen, die per Aufruf ausgeführt wird.\nTrigger: Prozedur, die automatisch bei INSERT/UPDATE/DELETE einer Tabelle ausgeführt wird.\nIndex: Zusatzstruktur zur schnelleren Suche und Sortierung über Spalten." },
  // ---------- Teil 2: Datenmodell
  { teil: "t2", cat: "dm", p: 25, q: UEB_TEXT("D1"), a: UEB_LOES("D1") },
  { teil: "t2", cat: "dm", p: 20, q: UEB_TEXT("D2"), a: UEB_LOES("D2") },
  { teil: "t2", cat: "dm", p: 20, q: "Ein Hotel speichert Gäste (Name, Adresse, Telefon), Zimmer (Nummer, Kategorie, Preis pro Nacht) und Buchungen (Anreise, Abreise). Eine Buchung gehört zu genau einem Gast und kann mehrere Zimmer umfassen. Zu jeder Buchung können Zusatzleistungen (Bezeichnung, Preis) mit Anzahl gebucht werden. Die Kategorie (Bezeichnung, Ausstattung) gilt für viele Zimmer.\nErstellen Sie das Relationenmodell in 3. NF mit PK, FK und Kardinalitäten.", a: "Gast (GastID [PK], Name, Strasse, PLZ, Ort, Telefon)\nKategorie (KatID [PK], Bezeichnung, Ausstattung)\nZimmer (ZimmerNr [PK], KatID [FK], PreisProNacht)\nBuchung (BuchungID [PK], GastID [FK], Anreise, Abreise)\nBuchung_Zimmer (BuchungID [PK, FK], ZimmerNr [PK, FK])\nLeistung (LeistungID [PK], Bezeichnung, Preis)\nBuchung_Leistung (BuchungID [PK, FK], LeistungID [PK, FK], Anzahl)\nBeziehungen: Gast 1:n Buchung, Kategorie 1:n Zimmer, Buchung 1:n Buchung_Zimmer n:1 Zimmer, Buchung 1:n Buchung_Leistung n:1 Leistung.\nPLZ/Ort für strenge 3. NF in eigene Tabelle Ort möglich." },
  { teil: "t2", cat: "dm", p: 14, q: "Erstellen Sie ein ER-Diagramm (Chen- oder Krähenfuß-Notation) mit Attributen: Ein Verein hat Mitglieder (Name, Geburtsdatum). Mitglieder gehören zu einer oder mehreren Abteilungen (Name); für jede Mitgliedschaft wird das Eintrittsdatum gespeichert. Jede Abteilung hat genau einen Leiter, der Mitglied ist.", a: "Entitäten: Mitglied (Name, Geburtsdatum), Abteilung (Name).\nBeziehung „gehört zu“ Mitglied m:n Abteilung mit Attribut Eintrittsdatum.\nBeziehung „leitet“ Mitglied 1 : n Abteilung (ein Mitglied kann mehrere Abteilungen leiten, jede Abteilung genau einen Leiter).\nEntitäten je 2 P, Attribute 4 P, Beziehungen mit Kardinalität je 3 P, Attribut an m:n 2 P." },
  { teil: "t2", cat: "dm", p: 6, q: "Erklären Sie Einfüge-, Änderungs- und Löschanomalie.", a: "Einfügeanomalie: Daten können nicht gespeichert werden, ohne andere unbekannte Daten mitzuerfassen.\nÄnderungsanomalie: redundante Daten müssen an mehreren Stellen geändert werden, sonst inkonsistent.\nLöschanomalie: Beim Löschen gehen ungewollt andere Informationen verloren." },
  { teil: "t2", cat: "dm", p: 5, q: "Eine Kamera macht pro Tag 300 Bilder mit 12 Megapixeln und 24 Bit Farbtiefe (unkomprimiert). Berechnen Sie den Speicherbedarf für 30 Tage in GiB (2 Nachkommastellen). Rechenweg angeben.", a: "12.000.000 Pixel × 3 Byte = 36.000.000 Byte pro Bild\n× 300 × 30 = 324.000.000.000 Byte\n÷ 1024³ = 301,75 GiB" },
  { teil: "t2", cat: "dm", p: 8, q: "Erklären Sie die vier ACID-Eigenschaften.", a: "Atomarität: Transaktion ganz oder gar nicht. Konsistenz: Datenbank vorher und nachher konsistent. Isolation: parallele Transaktionen beeinflussen sich nicht. Dauerhaftigkeit: bestätigte Änderungen bleiben auch nach Absturz erhalten. Je 2 P." },
  { teil: "t2", cat: "dm", p: 5, q: "Wägen Sie ab: Für einen Online-Shop mit sehr unterschiedlichen Produktattributen (Bücher, Kleidung, Elektronik) wird eine dokumentenorientierte Datenbank vorgeschlagen.", a: "Pro NoSQL: flexibles Schema für unterschiedliche Attribute, Produkt wird als Ganzes gelesen, gut skalierbar.\nContra: Bestellungen/Bezahlung brauchen Transaktionssicherheit und Konsistenz, Joins schwieriger.\nMögliches Fazit: Produktkatalog dokumentenorientiert, Bestellungen relational. Entscheidung 1 P, Argumente je 2 P." },
  { teil: "t2", cat: "dm", p: 3, q: "Ordnen Sie geeignete Datentypen zu: Postleitzahl, Preis, lieferbar ja/nein.", a: "Postleitzahl: CHAR(5)/VARCHAR (führende Null), Preis: DECIMAL(10,2), lieferbar: BOOLEAN." },
  // ---------- Teil 2: Diagramme & Testen
  { teil: "t2", cat: "diag", p: 18, q: UEB_TEXT("U1"), a: UEB_LOES("U1") },
  { teil: "t2", cat: "diag", p: 15, q: UEB_TEXT("U2"), a: UEB_LOES("U2") },
  { teil: "t2", cat: "diag", p: 15, q: UEB_TEXT("U3"), a: UEB_LOES("U3") },
  { teil: "t2", cat: "diag", p: 20, q: UEB_TEXT("X1"), a: UEB_LOES("X1") },
  { teil: "t2", cat: "diag", p: 15, q: "Sequenzdiagramm Geldautomat: Lebenslinien :Kunde, :Automat, :Bankserver. Der Kunde steckt die Karte und gibt die PIN ein. Der Automat prüft die PIN beim Bankserver (pruefePin). Ist sie falsch, zeigt der Automat eine Meldung. Ist sie richtig, wählt der Kunde einen Betrag, der Automat fragt beim Bankserver auszahlen(betrag) an. Bei ausreichender Deckung gibt der Automat Geld aus, sonst Meldung „Betrag nicht verfügbar“.", a: "Kunde → Automat: karteEinstecken()\nKunde → Automat: pinEingeben(pin)\nAutomat → Bankserver: pruefePin(karte, pin); Bankserver --> Automat: ok/nicht ok\nalt [PIN falsch] Automat → Kunde: Meldung\n[PIN richtig]\n  Kunde → Automat: betragWaehlen(betrag)\n  Automat → Bankserver: auszahlen(betrag); --> Ergebnis\n  alt [gedeckt] Automat → Kunde: Geld ausgeben\n  [nicht gedeckt] Automat → Kunde: „Betrag nicht verfügbar“\nNachrichten je 1 P, zwei alt-Fragmente mit Bedingungen je 3 P." },
  { teil: "t2", cat: "diag", p: 6, q: "Erklären Sie Anweisungs-, Zweig- und Pfadüberdeckung.", a: "Anweisungsüberdeckung: jede Anweisung mindestens einmal ausgeführt. Zweigüberdeckung: jeder Zweig jeder Entscheidung mindestens einmal (schließt Anweisungsüberdeckung ein). Pfadüberdeckung: jeder mögliche Pfad vom Start bis Ende (bei Schleifen meist nicht vollständig erreichbar)." },
  { teil: "t2", cat: "diag", p: 4, q: "Unterscheiden Sie Black-Box- und White-Box-Test.", a: "Black-Box: Testfälle aus der Spezifikation ohne Kenntnis des Codes (Äquivalenzklassen, Grenzwerte). White-Box: Testfälle aus dem Quellcode (Überdeckungsmaße), meist durch Entwickler." },
  { teil: "t2", cat: "diag", p: 3, q: "Was ist ein Regressionstest und wann wird er ausgeführt?", a: "Wiederholung bestehender Tests nach Änderungen (neue Funktion, Bugfix, Refactoring), um sicherzustellen, dass Vorhandenes weiter funktioniert. Idealerweise automatisiert bei jedem Build." },
  { teil: "t2", cat: "diag", p: 4, q: "Beschreiben Sie den Ablauf von Test Driven Development und einen Vorteil.", a: "Red: Test schreiben, der fehlschlägt. Green: minimalen Code schreiben, bis der Test besteht. Refactor: Code verbessern, Tests bleiben grün. Vorteil: hohe Testabdeckung, testbares Design, weniger Regressionen." },
  { teil: "t2", cat: "diag", p: 6, q: "Eine Funktion berechnet den Eintrittspreis: unter 6 Jahre frei, 6 bis 17 Jahre 5 €, ab 18 Jahre 10 €, ab 65 Jahre 7 €. Bilden Sie Äquivalenzklassen und nennen Sie Grenzwerttestfälle.", a: "Klassen: ungültig < 0; 0–5 → 0 €; 6–17 → 5 €; 18–64 → 10 €; ab 65 → 7 €.\nGrenzwerte: -1, 0, 5, 6, 17, 18, 64, 65." },
  { teil: "t2", cat: "diag", p: 3, q: "Nennen und erläutern Sie drei FIRST-Prinzipien für Unit-Tests.", a: "Fast (schnell), Independent (unabhängig voneinander), Repeatable (immer gleiches Ergebnis), Self-Validating (bestanden/nicht bestanden ohne manuelle Prüfung), Timely (rechtzeitig, vor dem Produktivcode)." },
  { teil: "t2", cat: "diag", p: 4, q: "Beschreiben Sie den Unterschied zwischen Last- und Stresstest.", a: "Lasttest: Verhalten bei erwarteter Last (z. B. 500 gleichzeitige Nutzer), Antwortzeiten messen. Stresstest: Last über die Grenze hinaus, um Belastungsgrenze und Verhalten bei Überlast zu ermitteln." }
];

function UEB_TEXT(id) { const u = UEB.find((x) => x.id === id); return u ? u.text : ""; }
function UEB_LOES(id) { const u = UEB.find((x) => x.id === id); return u ? u.loesung : ""; }

// Zusätzliche Rechenfragen für WiSo (werden an MC angehängt, damit bestehende IDs stabil bleiben)
MC.push(
  ["wiso", "w", "Ein Arbeitnehmer (3 Jahre im Betrieb) kündigt selbst; die Kündigung geht am 20.05. zu. Wann endet das Arbeitsverhältnis frühestens (gesetzliche Grundfrist)?", ["15.06.", "17.06.", "30.06.", "15.07."], 2, "Grundfrist nach § 622 Abs. 1 BGB: vier Wochen zum 15. oder zum Monatsende. 20.05. + 4 Wochen = 17.06.; der nächste zulässige Termin ist der 30.06."],

  ["In der Tabelle Mitarbeiter(MID, Name, Abteilung, ChefID) verweist ChefID auf die MID des Vorgesetzten. Die Geschäftsführerin hat keinen Vorgesetzten.\n\nErstellen Sie eine SQL-Anweisung, die jeden Mitarbeiter mit dem Namen seines Vorgesetzten ausgibt. Auch die Geschäftsführerin soll erscheinen. (4 P)", "SELECT m.Name, v.Name AS Chef\nFROM Mitarbeiter m\nLEFT JOIN Mitarbeiter v ON m.ChefID = v.MID;", "- Self Join mit zwei Aliasnamen (2 P)\n- Richtige ON-Bedingung (1 P)\n- LEFT JOIN, damit die Geschäftsführerin nicht fehlt (1 P)"],
