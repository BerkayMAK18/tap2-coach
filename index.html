  function buildPlan() {
    const days = []; for (let d = today(); d < EXAM_DAY && days.length < 120; d = addDays(d, 1)) days.push(d);
    const plan = {}; days.forEach((d) => (plan[d] = []));
    if (!days.length) return { days, plan, per: 0, total: 0 };
    const last = days[days.length - 1];
    const study = days.filter((d) => d !== last && wdOf(d) !== 0);
    const topics = TOPICS.slice().sort((a, b) => teilRank(a) - teilRank(b) || (a.prio === "Muss" ? 0 : 1) - (b.prio === "Muss" ? 0 : 1)).map((t) => ({ t, open: topicQ(t.id).filter((q) => st(q.id) !== 2).length })).filter((x) => x.open > 0);
    const total = topics.reduce((a, x) => a + x.open, 0), per = study.length ? Math.ceil(total / study.length) : total;
    let di = 0, cap = per;
    topics.forEach((x) => { let rest = x.open; while (rest > 0 && di < study.length) { const take = Math.min(rest, cap); plan[study[di]].push({ kind: "topic", tid: x.t.id, n: take }); rest -= take; cap -= take; if (cap <= 0) { di++; cap = per; } } });

    $("#t-back").onclick = () => { UI.topic = null; UI.addQ = false; render(); window.scrollTo({ top: 0 }); };

    el.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { UI.ttab = b.dataset.tab; UI.addQ = false; render(); });

    el.querySelectorAll("[data-qi]").forEach((b) => b.onclick = () => startSess(qs, t.n + ": Alle Fragen", { kind: "all", tid: t.id }, +b.dataset.qi));
    el.querySelectorAll("[data-u]").forEach((b) => b.onclick = () => { UI.ueb = b.dataset.u; UI.showSol = false; UI.uFree = false; go("aufgaben"); });

        S.custom[t.id] = (S.custom[t.id] || []).concat([{ id: "c" + Date.now(), f, b }]);
        save(); render(); $("#add-msg").textContent = "Hinzugefügt. Du kannst direkt die nächste anlegen."; $("#add-f").focus();
      };
    }
    el.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => { UI.confirm = b.dataset.ask; render(); });
    el.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { S.custom[t.id] = (S.custom[t.id] || []).filter((x) => x.id !== b.dataset.del); syncEv("c", b.dataset.del); delete S.q[b.dataset.del]; delete S.mark[b.dataset.del]; UI.confirm = null; save(); render(); });
  }

  // ---------- Aufgaben (Übungsaufgaben)
  const UEB_TOPIC = {}; TOPICS.forEach((t) => t.ueb.forEach((u) => { if (!UEB_TOPIC[u]) UEB_TOPIC[u] = t.id; }));
  function rUeb() {
    const el = $("#v-aufgaben");
    if (UI.ueb && UE[UI.ueb]) {
      const u = UE[UI.ueb], r = S.ueb[u.id], tid = UEB_TOPIC[u.id], tkey = "u:" + u.id, ust = tmState(tkey);
      el.innerHTML = `<button type="button" class="backlink" id="u-back">${ic("left", "ic sm")} Alle Aufgaben</button>
        <section class="card t-${tcolOf(u.teil)}"><div class="row" style="align-items:flex-start"><span class="pk-num">${esc(u.id)}</span><div style="flex:1;min-width:200px"><h2>${esc(u.titel)}</h2><div class="row" style="margin-top:6px"><span class="chip">${esc(u.teil)}</span><span class="chip">${esc(u.thema)}</span><span class="chip blue">${u.max} P · ca. ${u.min} Min.</span>${tid ? `<button type="button" class="linkbtn" id="u-topic">Theorie: ${esc(TP[tid].n)}</button>` : ""}<a class="linkbtn" href="${reportUrlUeb(u)}" target="_blank" rel="noopener">Fehler melden</a></div></div></div>
        ${ust === "idle" && !UI.uFree ? `<div class="tm-start-box">${tmHTML(tkey, u.min, { label: "Aufgabe starten", hint: "Die Aufgabe erscheint mit dem Start. Läuft die Zeit ab, zählt der Timer ins Minus weiter." })}<button type="button" class="linkbtn" id="u-free">Ohne Zeitmessung öffnen</button></div>` : `<div class="tm-bar">${ust === "idle" ? `<span class="small muted">Ohne Zeitmessung geöffnet</span>` : tmHTML(tkey, u.min)}</div>

        ${r && r.p < u.max ? `<div class="cause-box"><span class="small muted">Fehlerprotokoll: Warum fehlen ${dec(u.max - r.p)} P?</span>${causeChips(r.cause, "data-uc")}</div>` : ""}` : ""}
        </section>`;
      $("#u-back").onclick = () => { UI.ueb = null; render(); };
      const ut = $("#u-topic"); if (ut) ut.onclick = () => { UI.topic = tid; UI.ttab = "theorie"; UI.sess = null; go("lernen"); };

      bindTM(el);
      const sv = $("#u-save");
      if (sv) sv.onclick = () => { const v = Math.max(0, Math.min(u.max, parseFloat($("#u-pts").value))); if (isNaN(v)) return; S.ueb[u.id] = { p: v, at: today(), n: (r?.n || 0) + 1 }; save(); render(); };

    }
    const groups = {};

    const done = UEB.filter((u) => S.ueb[u.id]).length;
    el.innerHTML = `<div class="row" style="align-items:flex-end"><p class="lead" style="flex:1;min-width:260px">Große Aufgaben im Stil der IHK-Prüfung mit Musterlösung, so wie sie in Planen und Algorithmen drankommen. Löse sie auf Papier, vergleiche mit der Lösung und trage deine Punkte ein. Unter 70 % lohnt sich ein zweiter Versuch.</p><span class="chip">${done} von ${UEB.length} bearbeitet</span></div>
      ${Object.entries(groups).map(([g, l]) => `<div class="ueb-group"><h3>${esc(g)}</h3><div class="ueb-list">${l.map((u) => { const r = S.ueb[u.id]; const pct = r ? r.p / u.max : null; return `<button type="button" class="ueb-item t-${tcolOf(u.teil)}" data-u="${u.id}"><span class="id">${u.id}</span><span><span class="t">${esc(u.titel)}</span><br><span class="sub">${esc(u.teil)} · ${u.max} P · ca. ${u.min} Min.</span></span><span class="r">${r ? `<span class="chip ${pct >= 0.81 ? "ok" : pct >= 0.67 ? "warn" : "bad"}"><span class="d"></span>${r.p}/${u.max}</span>` : '<span class="chip">offen</span>'}</span></button>`; }).join("")}</div></div>`).join("")}`;
    el.querySelectorAll("[data-u]").forEach((b) => b.onclick = () => { UI.ueb = b.dataset.u; UI.showSol = false; UI.uFree = false; render(); window.scrollTo({ top: 0 }); });
  }

  // ---------- Prüfung: Erzeugen
  function pickMC(teil, n) {
    const pool = BASE_Q.filter((q) => q.type === "mc" && (teil === "mix" || q.teil === teil));
    const w = (q) => { const s = st(q.id); return (s === 0 ? 3 : s === -1 ? 2 : s === 1 ? 1.5 : 1) + Math.random() * 2; };
    let list = pool.slice().sort((a, b) => w(b) - w(a));
    if (teil !== "mix") {
      const tids = [...new Set(list.map((q) => q.topic))], out = [];
      let i = 0, guard = 0;
      while (out.length < Math.min(n, list.length) && guard++ < 1000) { const tt = tids[i++ % tids.length]; const nx = list.find((q) => q.topic === tt && !out.includes(q)); if (nx) out.push(nx); }
      list = out;
    }
    return shuffle(list.slice(0, n)).map((q) => { const order = shuffle(q.opts.map((_, i) => i)); return { id: q.id, topic: q.topic, q: q.q, opts: order.map((i) => q.opts[i]), right: order.indexOf(q.right), why: q.why, pick: null }; });
  }
  function buildAufgabe(teil, cat) {
    const pool = shuffle(OPEN.filter((o) => o.teil === teil && o.cat === cat));
    const items = []; let rem = 25;
    for (const o of pool) { if (o.p <= rem) { items.push(o); rem -= o.p; } if (rem < 3) break; }
    return { cat, title: CATS[teil][cat], items: items.map((o) => ({ id: o.id, p: o.p, q: o.q, a: o.a, schema: !!o.schema, ans: "", got: null })) };
  }
  const SIM_MIN = { t1: 45, t2: 45, wiso: 60, mix: 45 };
  function startRun() {
    const { mode, teil } = UI.pk;
    if (mode === "sim") UI.run = { mode, teil, qs: pickMC(teil, 30), i: 0, total: SIM_MIN[teil] * 60000, used: 0, start: Date.now(), on: true, phase: "write" };
    else UI.run = { mode: "real", teil, auf: shuffle(Object.keys(CATS[teil])).map((c) => buildAufgabe(teil, c)), total: 90 * 60000, used: 0, start: Date.now(), on: true, phase: "write" };
    UI.confirm = null;
    keepRun();
  }
  function keepRun() { try { localStorage.setItem(KEY_RUN, JSON.stringify(UI.run)); } catch (e) {} }
  try { const r = JSON.parse(localStorage.getItem(KEY_RUN) || "null"); if (r && (r.mode === "sim" || r.mode === "real") && (r.phase === "write" || r.phase === "grade")) { if (r.on) { r.used += Date.now() - r.start; r.on = false; } UI.run = r; } } catch (e) {}
  function finishRun(pct, extra) {
    const r = UI.run;
    S.runs.push(Object.assign({ mode: r.mode, teil: r.teil, pct, note: note(pct), at: today(), ts: Date.now() }, extra || {}));
    save();
  }
  const left = () => { const r = UI.run; return r.total - r.used - (r.on ? Date.now() - r.start : 0); };
  function fmtT(ms) { const s = Math.max(0, Math.round(ms / 1000)); return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); }
  let tick = null;
  function ensureTick() {
    clearInterval(tick);
    const r = UI.run;
    if (r && r.on && r.phase === "write") tick = setInterval(() => {
      const t = $("#pk-time"); if (!t) return;
      const l = left(); t.textContent = fmtT(l); t.parentElement.classList.toggle("low", l < 10 * 60000);
      if (l <= 0) { clearInterval(tick); submitRun(true); }
    }, 500);
  }
  function submitRun(auto) {
    const r = UI.run;
    if (r.on) { r.used += Date.now() - r.start; r.on = false; }
    r.phase = "grade"; r.auto = !!auto; UI.confirm = null;
    if (r.mode === "sim") {
      r.qs.forEach((q) => { if (q.pick !== null) answer(q.id, q.pick === q.right); });
      const right = r.qs.filter((q) => q.pick === q.right).length;
      r.pct = Math.round(right / r.qs.length * 100);
      finishRun(r.pct, { detail: right + "/" + r.qs.length });
      r.phase = "done";
    }
    keepRun(); render(); window.scrollTo({ top: 0 });
  }
  const runsFor = (t) => S.runs.filter((x) => x.teil === t && (t === "wiso" ? x.mode !== "easy" : x.mode === "real")).slice(-2);
  const n1ok = (t) => { const rs = runsFor(t); return rs.length === 2 && rs.every((x) => x.pct >= 92); };

  // ---------- Bewertung wie ein Prüfer
  const OPS = {
    nennen: ["Nennen", "Stichwort oder Begriff genügt, keine Erklärung nötig. Punkte je richtigem Aspekt."],
    geben: ["Angeben", "Kurze, eindeutige Angabe genügt. Punkte je richtigem Aspekt."],
    ordnen: ["Zuordnen", "Jede Zuordnung zählt einzeln. Eindeutig schreiben, keine Mehrfachnennung."],
    beschreiben: ["Beschreiben", "Sachverhalt in ganzen Sätzen und in sinnvoller Reihenfolge darstellen, ohne Wertung."],
    erläutern: ["Erläutern", "Beschreiben und zusätzlich mit Beispiel oder Begründung verständlich machen. Nur genannt: höchstens die Hälfte."],
    erklären: ["Erklären", "Zusammenhang verständlich machen, mit Begründung oder Beispiel. Nur genannt: höchstens die Hälfte."],
    begründen: ["Begründen", "Klare Entscheidung plus tragfähiges Argument. Ohne Begründung kaum Punkte."],
    bewerten: ["Bewerten", "Abwägen und ein eigenes, begründetes Urteil fällen."],
    beurteilen: ["Beurteilen", "Abwägen und ein eigenes, begründetes Urteil fällen."],
    wägen: ["Abwägen", "Pro und Contra nennen, dann zu einem begründeten Ergebnis kommen."],
    vergleichen: ["Vergleichen", "Beide Seiten nach gleichen Kriterien gegenüberstellen und den Unterschied benennen."],
    unterscheiden: ["Unterscheiden", "Beide Begriffe abgrenzen; der Unterschied muss ausdrücklich genannt sein."],
    berechnen: ["Berechnen", "Rechenweg mit Einheiten zählt mit. Ergebnis ohne Weg kann Punkte kosten."]
  };
  const OP_ERST = ["Erstellen", "Vollständiges Ergebnis. Punkte gibt es je Baustein (z. B. Aktion, Schlüssel, Schleife, Rückgabe); fehlende Bausteine kosten einzeln."];
  function opHint(q) {
    const m = String(q).match(/\b(Nennen|Geben|Ordnen|Beschreiben|Erläutern|Erklären|Begründen|Bewerten|Beurteilen|Wägen|Vergleichen|Unterscheiden|Berechnen|Erstellen|Entwickeln|Implementieren|Zeichnen|Skizzieren|Schreiben|Formulieren|Ergänzen|Überführen|Bilden|Führen)\s+Sie\b/);
    if (!m) return null;
    return OPS[m[1].toLowerCase()] || OP_ERST;
  }
  // ---------- Prüfung: Ansichten
  const MODE_LBL = { sim: "Simulation", real: "Real-Klausur", easy: "Quiz" };
  function rPK() {
    const el = $("#v-pruefung");
    const r = UI.run;
    if (r && r.mode === "sim") return rSim(el);
    if (r) return rReal(el);
    const p = UI.pk;
    if (p.mode === "real" && !(p.teil === "t1" || p.teil === "t2")) p.teil = "t1";
    const hist = S.runs.slice().reverse();
    const X = PK.X01;
    const cat = counts(allQ());
    const teile = p.mode === "sim" ? ["t1", "t2", "wiso", "mix"] : ["t1", "t2"];
    el.innerHTML = `
      <div class="grid2">
        <section class="card">
          <h3>Prüfung simulieren</h3>
          <div class="modes">
            <button type="button" class="mode t-violet ${p.mode === "sim" ? "on" : ""}" data-mode="sim" aria-pressed="${p.mode === "sim"}"><span class="mi">${ic("list")}</span><b>Simulation</b><span>30 Auswahlfragen mit Zeitlimit, Frage für Frage. Note am Ende; deine Antworten zählen in den Lernstand.</span></button>
            <button type="button" class="mode t-blue ${p.mode === "real" ? "on" : ""}" data-mode="real" aria-pressed="${p.mode === "real"}"><span class="mi">${ic("pencil")}</span><b>Real-Klausur</b><span>Wie in der echten Prüfung: vier offene Aufgaben à rund 25 Punkte in 90 Minuten. Danach bewertest du wie ein IHK-Prüfer mit Erwartungshorizont und Operator-Hinweisen.</span></button>
          </div>
          <label class="f" for="pk-teil">Prüfungsteil<select id="pk-teil">${teile.map((t) => `<option value="${t}" ${t === p.teil ? "selected" : ""}>${TEIL[t].k}${t === "mix" ? " (alle Teile)" : " – " + TEIL[t].n}</option>`).join("")}</select></label>
          <div class="row" style="margin-top:18px"><button type="button" class="btn primary big" id="pk-go">${ic("play", "ic sm")} Starten · ${fmtClock((p.mode === "sim" ? SIM_MIN[p.teil] || 45 : 90) * 60)}</button><span class="small muted">${p.mode === "sim" ? `30 Fragen · ${SIM_MIN[p.teil] || 45} Minuten` : "90 Minuten · Papier für Skizzen bereitlegen"}</span></div>
        </section>
        <section class="card">
          <h3>Bereit für eine 1?</h3>
          <p class="small muted" style="margin-top:4px">Prüferblick: Das Wissen sitzt, und du schaffst es unter Prüfungsbedingungen.</p>
          <ul class="n1">
            <li class="${cat.pct >= 0.9 ? "ok" : ""}"><span class="n1-i">${cat.pct >= 0.9 ? ic("check", "ic sm") : ""}</span><span><b>Fragenkatalog</b><br><span class="tiny muted">mindestens 90 % prüfungsreif</span></span><span class="chip ${cat.pct >= 0.9 ? "yellow" : ""}">${pctS(cat.pct)}</span></li>
            ${["t1", "t2", "wiso"].map((t) => { const rs = runsFor(t), ok = n1ok(t), good = rs.filter((x) => x.pct >= 92).length; return `<li class="${ok ? "ok" : ""}"><span class="n1-i">${ok ? ic("check", "ic sm") : ""}</span><span><b>${TEIL[t].k}</b><br><span class="tiny muted">${t === "wiso" ? "zwei Simulationen in Folge ab 92 %" : "zwei Real-Klausuren in Folge ab 92 %"}${rs.length ? " · zuletzt " + rs.map((x) => x.pct + " %").join(", ") : ""}</span></span><span class="chip ${ok ? "yellow" : ""}">${good}/2</span></li>`; }).join("")}
          </ul>
        </section>
      </div>
      <section class="card tip-link"><div class="row">${ic("bulb", "ic")}<div style="flex:1;min-width:200px"><b>Prüfungstechnik</b><br><span class="small muted">Operatoren, Zeiteinteilung und typische Punktverluste findest du unter Tipps.</span></div><button type="button" class="btn small" data-go2="tipps">Zu den Tipps</button></div></section>
      <section class="card"><div class="row"><h3>Deine Ergebnisse</h3><span class="spacer"></span><span class="small muted">${hist.length} ${hist.length === 1 ? "Durchgang" : "Durchgänge"}</span></div>
        ${hist.length ? `<div class="res-list">${hist.map((x) => `<div class="res">${gradeBadge(x.note)}<div><div class="t">${MODE_LBL[x.mode] || x.mode} · ${TEIL[x.teil] ? TEIL[x.teil].k : esc(x.teil)}</div><div class="s">${fmtDay(x.at)}${x.detail ? " · " + esc(x.detail) : ""} · ${x.pct >= 50 ? "bestanden" : "nicht bestanden"}</div></div><span class="chip num">${x.pct} %</span>${UI.confirm === x.ts ? `<button type="button" class="btn small danger del" data-del="${x.ts}">Wirklich löschen</button>` : `<button type="button" class="iconbtn sm del" data-ask="${x.ts}" aria-label="Ergebnis löschen">${ic("x", "ic xs")}</button>`}</div>`).join("")}</div>` : `<p class="empty">Noch keine Prüfung geschrieben. Starte mit einer Simulation.</p>`}
      </section>`;
    el.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { p.mode = b.dataset.mode; render(); });
    el.querySelectorAll("[data-go2]").forEach((b) => b.onclick = () => navTo(b.dataset.go2));
    $("#pk-teil").onchange = (e) => { p.teil = e.target.value; render(); };
    $("#pk-go").onclick = () => { startRun(); render(); window.scrollTo({ top: 0 }); };
    el.querySelectorAll("[data-ask]").forEach((b) => b.onclick = () => { UI.confirm = +b.dataset.ask; render(); });
    el.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { S.runs = S.runs.filter((x) => x.ts !== +b.dataset.del); syncEv("r", +b.dataset.del); UI.confirm = null; save(); render(); });
  }
  function closeRun() { UI.run = null; UI.confirm = null; clearInterval(tick); try { localStorage.removeItem(KEY_RUN); } catch (e) {} render(); window.scrollTo({ top: 0 }); }
  function timerBar(r, extra) {
    const open = r.mode === "sim" ? r.qs.filter((q) => q.pick === null).length : 0;
    return `<div class="timerbar"><span class="timer ${left() < 600000 ? "low" : ""}">${ic("timer")}<span id="pk-time">${fmtT(left())}</span></span>${extra || ""}<span class="spacer"></span>${r.on ? `<button type="button" class="btn" id="pk-pause">Pause</button>` : `<button type="button" class="btn" id="pk-resume">${r.used ? "Weiter" : "Start"}</button>`}<button type="button" class="btn primary" id="pk-submit">Abgeben</button><button type="button" class="btn small ghost" id="pk-cancel">Abbrechen</button>${UI.confirm === "submit" ? `<div class="confirm"><span class="small">${open ? `${open} ${open === 1 ? "Frage ist" : "Fragen sind"} noch offen. ` : ""}Wirklich abgeben? Danach kannst du nichts mehr ändern.</span><button type="button" class="btn small primary" id="pk-yes">Ja, abgeben</button><button type="button" class="btn small" id="pk-no">Weiterschreiben</button></div>` : ""}${UI.confirm === "cancel" ? `<div class="confirm"><span class="small">Abbrechen verwirft diese Prüfung.</span><button type="button" class="btn small danger" id="pk-cyes">Verwerfen</button><button type="button" class="btn small" id="pk-no">Zurück</button></div>` : ""}</div>`;
  }
  function bindTimer() {
    const r = UI.run;
    const pa = $("#pk-pause"); if (pa) pa.onclick = () => { r.used += Date.now() - r.start; r.on = false; keepRun(); render(); };
    const re = $("#pk-resume"); if (re) re.onclick = () => { r.start = Date.now(); r.on = true; keepRun(); render(); };
    $("#pk-submit").onclick = () => { UI.confirm = "submit"; render(); };
    $("#pk-cancel").onclick = () => { UI.confirm = "cancel"; render(); };

      <p class="small muted">Gesammelt: ${skins.filter((s) => G.owned[s.id]).length}/${skins.length} Skins · Farbig = in deiner Garderobe, grau = noch nicht gefunden, ✓ = angezogen. Pro Slot: 4 Normal, 3 Selten, 2 Episch, 1 Legendär.</p>
      ${["SSR", "SR", "R", "N"].map(group).join("")}
      <h3 class="gm-ih">Extras <span class="small muted">verbrauchbar, zählen nicht zur Sammlung</span></h3><div class="gm-tiles">${EXTRAS.map((i) => { const n = i.slot === "boost" ? G.boosts[i.id] : 0; return tile(i, n ? `<span class="gm-tag">×${n}</span>` : "", n ? "" : "locked"); }).join("")}</div>
      <h3 class="gm-ih">Regeln</h3><ul class="small muted" style="padding-left:18px;margin:0;text-align:left"><li>Episch oder besser spätestens alle ${GACHA.srEvery} Züge.</li><li>Ab Zug ${GACHA.softPity} steigt die Legendär-Chance um ${GACHA.softStep * 100} Prozentpunkte pro Zug, bei Zug ${GACHA.hardPity} ist es sicher.</li><li>Jedes Legendär ist zu ${GACHA.featured * 100} % das Wochen-Highlight; sonst ist das nächste garantiert das Highlight.</li><li>Zähler pro Kollektion. Mit allen Garantien kommt Legendär im Schnitt etwa alle 47 Züge.</li><li>Federn gibt es nur durchs Lernen – kein Echtgeld.</li></ul></div>`);
  }

  // ---- Seite
  const charSel = (attr, cur, label) => `<div class="gm-sel">${CHARS.map((c) => `<button type="button" class="gm-bsel" data-gm-${attr}="${c}" aria-pressed="${c === cur}"><span class="gm-mini">${figure(c, G.equip[c])}</span>${esc(label(c))}</button>`).join("")}</div>`;
  function rQuests() {
    const qs = G.quests.ids.map((id) => QPOOL.find((q) => q.id === id)), all = G.quests.claimed.length === 3;
    return `<section class="card"><div class="row" style="justify-content:space-between"><h3>Tagesquests</h3><span class="small muted">neu um Mitternacht</span></div>
      ${qs.map((q) => { const p = qprog(q), done = G.quests.claimed.includes(q.id); return `<div class="gm-quest"><div><b>${esc(q.txt)}</b><div class="bar"><i style="width:${p / q.goal * 100}%"></i></div><div class="small muted">${p}/${q.goal}${q.note ? q.note(G.today) : ""} · ${q.f} 🪶 + ${q.xp} XP</div></div><button type="button" class="btn small ${p >= q.goal && !done ? "primary" : ""}" data-gm-claim="${q.id}" ${p < q.goal || done ? "disabled" : ""}>${done ? "✓ Erledigt" : "Abholen"}</button></div>`; }).join("")}
      <div class="gm-quest"><div><b>🎁 Tagestruhe</b><div class="small muted">Alle drei Quests abholen · 150 🪶 + 1 🎟️</div></div><button type="button" class="btn small ${all && !G.quests.chest ? "primary" : ""}" data-gm-chest ${!all || G.quests.chest ? "disabled" : ""}>${G.quests.chest ? "✓ Geöffnet" : "Öffnen"}</button></div></section>
      <section class="card"><div class="row" style="justify-content:space-between"><h3>Login-Kalender <span class="small muted">· Runde ${G.calRound}</span></h3><span class="chip">🔥 ${G.loginStreak} ${G.loginStreak === 1 ? "Tag" : "Tage"}</span></div>
      <p class="small muted">Jeder Login-Tag rückt ein Feld weiter. Nach Tag 7 beginnt die nächste Runde mit denselben Belohnungen. Ein ausgelassener Tag setzt nur die 🔥-Serie zurück.</p>
      ${calHTML(G.loginClaimed !== today() ? G.calIdx : -1)}${G.loginClaimed !== today() ? `<div class="row" style="margin-top:12px"><button type="button" class="btn primary" data-gm-showlogin>Heutigen Bonus abholen</button></div>` : ""}</section>
      <section class="card"><h3>So bekommst du XP</h3><p class="small muted">Jede richtige Antwort in einer Lernrunde: 10 XP und 5 🪶. Serie: 3 richtig in Folge ×1,5 · 6 ×2 · 10 ×3. Ein Fehler setzt die Serie zurück (außer mit Serien-Schild). Neue Level bringen 100 🪶, alle 5 Level ein Ticket.</p></section>`;
  }
  function rSchatz() {
    const c = G.banner, A = ANIMALS[c], P = pityOf(c), feat = featuredOf(c);
    const can1 = G.tickets >= 1 || G.federn >= GACHA.cost1, can10 = G.tickets >= 10 || G.federn >= GACHA.cost10, toSR = GACHA.srEvery - P.sr, toSSR = GACHA.hardPity - P.ssr, skins = SKINS.filter((s) => s.char === c && s.rar !== "S");
    return `${charSel("banner", c, (x) => ANIMALS[x].banner)}
      <section class="card gm-banner"><span class="gm-kicker">${GACHA.name.toUpperCase()} · ${esc(A.banner.toUpperCase())}</span>
        <div class="gm-bgrid"><div>${tile(feat, G.owned[feat.id] ? `<span class="gm-tag">IM BESITZ</span>` : `<span class="gm-tag dup">NOCH NICHT</span>`)}</div>
          <div><span class="gm-rateup">WOCHEN-HIGHLIGHT</span><h2>${esc(feat.name)}</h2><p class="small gm-soft">50 % aller Legendären sind dieses Teil. Wechselt in ${daysToMonday()} ${daysToMonday() === 1 ? "Tag" : "Tagen"}. Gesammelt: ${skins.filter((s) => G.owned[s.id]).length}/${skins.length}.</p>${P.guar ? `<p class="small" style="color:#F7C948;font-weight:700">Dein nächstes Legendär ist garantiert das Highlight.</p>` : ""}</div></div>
        <div class="row"><button type="button" class="btn gm-gold" data-gm-pull="1" ${can1 ? "" : "disabled"}>1× öffnen · ${G.tickets >= 1 ? "1 🎟️" : GACHA.cost1 + " 🪶"}</button><button type="button" class="btn gm-gold" data-gm-pull="10" ${can10 ? "" : "disabled"}>10× öffnen · ${G.tickets >= 10 ? "10 🎟️" : GACHA.cost10 + " 🪶"}</button></div>
        <div class="gm-pity"><div class="row" style="justify-content:space-between"><span>Legendär spätestens in <b>${toSSR}</b> Zügen</span><span class="gm-soft">nächster Zug: ${pct(ssrChance(P.ssr + 1))}</span></div><div class="bar"><i style="width:${P.ssr / GACHA.hardPity * 100}%"></i></div><span>Episch oder besser spätestens in <b>${toSR}</b> ${toSR === 1 ? "Zug" : "Zügen"}</span><div class="bar sr"><i style="width:${P.sr / GACHA.srEvery * 100}%"></i></div></div></section>
      <section class="card"><div class="row" style="justify-content:space-between"><h3>Chancen</h3><button type="button" class="gm-q" data-gm-info="${c}" aria-label="Alle Teile dieser Kollektion anzeigen" title="Alle Teile dieser Kollektion">?</button></div>
        <table class="gm-rates"><tr><th>Seltenheit</th><th>Chance</th><th>Skins</th></tr>${["SSR", "SR", "R", "N"].map((r) => { const p = poolOf(c, r).filter((i) => !i.icon); return `<tr><td class="r-${r}"><b>${RAR[r]}</b></td><td>${pct(GACHA.rates[r])}</td><td>${p.filter((i) => G.owned[i.id]).length}/${p.length} gefunden</td></tr>`; }).join("")}</table>
        <p class="small muted">Tippe auf „?“, um alle Teile dieser Kollektion zu sehen. Federn gibt es nur durchs Lernen.</p></section>`;
  }
  function rGarderobe() {
    const c = G.char, eq = G.equip[c], skins = SKINS.filter((s) => s.char === c && s.rar !== "S");
    return `${charSel("char", c, (x) => ANIMALS[x].name)}
      <section class="card" style="text-align:center"><div class="gm-ava-big">${myFigure()}</div><h2 style="margin-top:12px">${esc(ANIMALS[c].name)} · ${rank(G.level)}</h2><p class="small muted">Aktive Figur – so erscheint sie oben in der Leiste · Sammlung ${skins.filter((i) => G.owned[i.id]).length}/${skins.length}</p></section>
      <section class="card"><h3>Boosts</h3><div class="gm-tiles">${["xp2", "shield"].map((id) => { const it = IT[id], n = G.boosts[id], act = id === "xp2" ? G.xp2Left > 0 : G.shieldOn; return `<div class="gm-tile r-${it.rar} ${n || act ? "" : "locked"}"><div class="gm-icon">${it.icon}</div><div class="gm-nm">${it.name} ×${n}</div><div class="small muted">${it.desc}</div><button type="button" class="btn small" data-gm-use="${id}" ${!n || act ? "disabled" : ""}>${act ? "aktiv" : "Benutzen"}</button></div>`; }).join("")}</div></section>
      ${SLOTS.map(([slot, label]) => { const list = SKINS.filter((i) => i.char === c && i.slot === slot).sort((a, b) => RORDER.indexOf(b.rar) - RORDER.indexOf(a.rar)); return `<section class="card"><div class="row" style="justify-content:space-between"><h3>${label}</h3><span class="small muted">${list.filter((i) => i.rar !== "S" && G.owned[i.id]).length}/${list.length - 1}</span></div><div class="gm-tiles">${list.map((i) => `<button type="button" class="gm-tbtn" data-gm-eq="${i.id}" ${G.owned[i.id] ? "" : "disabled"} title="${G.owned[i.id] ? "Anziehen" : "Noch nicht gefunden"}">${tile(i, "", (G.owned[i.id] ? "" : "locked") + (eq[slot] === i.id ? " eq" : ""))}</button>`).join("")}</div></section>`; }).join("")}`;
  }
  function viewHTML(el) {
    rollDay();
    const tabs = [["quests", "Quests"], ["schatz", GACHA.name], ["garderobe", "Garderobe"]];
    el.innerHTML = `<div class="gm-head card"><div class="gm-ava">${myFigure()}</div><div class="gm-lvl"><div class="row" style="gap:8px;align-items:baseline"><b class="gm-lv">Level ${G.level}</b><span class="muted small">${rank(G.level)}</span><span class="spacer"></span><span class="small muted num">${G.xp}/${need(G.level)} XP</span></div><div class="bar"><i style="width:${G.xp / need(G.level) * 100}%"></i></div></div><div class="gm-cur"><span class="chip">🪶 ${G.federn}</span><span class="chip">🎟️ ${G.tickets}</span><span class="chip">🔥 ${G.loginStreak}</span></div></div>
      <div class="tabs-in gm-tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" class="${G.tab === k ? "on" : ""}" aria-selected="${G.tab === k}" data-gm-tab="${k}">${l}</button>`).join("")}</div>
      <div class="gm-body">${G.tab === "schatz" ? rSchatz() : G.tab === "garderobe" ? rGarderobe() : rQuests()}</div>`;
    el.onclick = (e) => {
      const t = e.target.closest("button"); if (!t || t.disabled) return; const d = t.dataset;
      if (d.gmTab) { G.tab = d.gmTab; save(); render(); }
      else if (d.gmClaim) { const q = QPOOL.find((x) => x.id === d.gmClaim); if (qprog(q) < q.goal || G.quests.claimed.includes(q.id)) return; G.quests.claimed.push(q.id); G.federn += q.f; addXP(q.xp); save(); toast(`Quest erledigt: +${q.f} 🪶 · +${q.xp} XP`); render(); }
      else if (d.gmChest !== undefined) { if (G.quests.chest || G.quests.claimed.length < 3) return; G.quests.chest = true; G.federn += 150; G.tickets++; save(); confetti(40); modal(`<div style="font-size:60px">🎁</div><h2>Tagestruhe</h2><p class="gm-gain">+150 🪶 · +1 🎟️</p><button type="button" class="btn primary" data-gm-close>Super</button>`); }
      else if (d.gmShowlogin !== undefined) showLogin();
      else if (d.gmPull) pull(+d.gmPull);
      else if (d.gmInfo) showInfo(d.gmInfo);
      else if (d.gmBanner) { G.banner = d.gmBanner; save(); render(); }
      else if (d.gmChar) { G.char = d.gmChar; G.lookAt = Date.now(); save(); render(); }
      else if (d.gmEq) { const it = IT[d.gmEq]; if (!it || !G.owned[it.id]) return; G.equip[it.char][it.slot] = it.id; G.lookAt = Date.now(); save(); render(); }
      else if (d.gmUse) { const id = d.gmUse; if (G.boosts[id] < 1) return; G.boosts[id]--; if (id === "xp2") G.xp2Left = 10; else G.shieldOn = true; save(); toast(`${IT[id].icon} ${IT[id].name} aktiviert`); render(); }
      if (d.gmClaim || d.gmChest !== undefined || d.gmPull || d.gmChar || d.gmEq || d.gmUse) { try { syncSoon(3000); } catch (x) {} } // Belohnungen auch ohne Lernen abgleichen
    };
    return true;
  }

  // ---- Übertragung und Sicherung: zusammenführen, nie verlieren
  function pack() {
    const own = {}; Object.keys(G.owned).forEach((id) => { const it = IT[id]; if (it && it.rar !== "S") (own[it.char] = own[it.char] || []).push(it.art); });
    const eq = {}; CHARS.forEach((c) => { eq[c] = SLOTS.map(([s]) => (IT[G.equip[c][s]] || {}).art || "").join("."); });
    return { v: 1, x: G.earned, l: G.level, p: G.xp, f: G.federn, t: G.tickets, o: Object.fromEntries(Object.entries(own).map(([c, l]) => [c, l.join(".")])), e: eq, c: G.char, b: [G.boosts.xp2, G.boosts.shield], y: G.pity, n: G.pulls, s: [G.loginStreak, G.lastLogin, G.calIdx, G.calRound, G.best], a: G.lookAt || 0 };
  }
  function unpack(p) {
    if (!p || typeof p !== "object") return null;
    if (p.owned) return Object.assign(fresh(), p); // ganze Sicherung
    const g = fresh(), s = p.s || [];
    Object.assign(g, { earned: +p.x || 0, level: +p.l || 1, xp: +p.p || 0, federn: +p.f || 0, tickets: +p.t || 0, char: p.c || "rabe", pity: p.y || {}, pulls: +p.n || 0, loginStreak: +s[0] || 0, lastLogin: s[1] || null, calIdx: +s[2] || 0, calRound: +s[3] || 1, best: +s[4] || 0 });
    g.boosts = { xp2: +(p.b || [])[0] || 0, shield: +(p.b || [])[1] || 0 }; if (+p.a) g.lookAt = +p.a;
    Object.entries(p.o || {}).forEach(([c, l]) => String(l).split(".").forEach((a) => { if (IT[c + "-" + a]) g.owned[c + "-" + a] = 1; }));
    Object.entries(p.e || {}).forEach(([c, l]) => { if (!ANIMALS[c]) return; const arts = String(l).split("."); g.equip[c] = baseEquip(c); SLOTS.forEach(([sl], i) => { const id = c + "-" + arts[i]; if (arts[i] && IT[id] && IT[id].slot === sl) g.equip[c][sl] = id; }); });
    return g;
  }
  function merge(p) {
    const inc = unpack(p); if (!inc) return;
    Object.keys(inc.owned || {}).forEach((id) => { if (IT[id]) G.owned[id] = 1; });           // Skins: Vereinigung
    G.boosts.xp2 = Math.max(G.boosts.xp2, +inc.boosts.xp2 || 0); G.boosts.shield = Math.max(G.boosts.shield, +inc.boosts.shield || 0);
    const ahead = (+inc.earned || 0) > G.earned, tie = (+inc.earned || 0) === G.earned, incA = +inc.lookAt || 0, myA = +G.lookAt || 0;
    const lookKey = (g) => g.char + "|" + CHARS.map((c) => SLOTS.map(([s]) => ((g.equip || {})[c] || {})[s] || "").join(",")).join(";");
    if (ahead) {                                                                                 // Fortschritt: der weiter fortgeschrittene Stand
      ["earned", "xp", "level", "federn", "tickets", "pulls", "best", "loginStreak", "lastLogin", "calIdx", "calRound"].forEach((k) => { if (inc[k] != null) G[k] = inc[k]; });
      if (inc.pity) G.pity = inc.pity;
    }
    if (incA > myA) {                                                                            // Figur + Ausrüstung: die zuletzt getroffene Wahl gilt auf allen Geräten
      if (inc.char && ANIMALS[inc.char]) G.char = inc.char;
      CHARS.forEach((c) => { const ie = inc.equip && inc.equip[c]; if (ie) SLOTS.forEach(([s]) => { const it = IT[ie[s]]; if (it && it.char === c && it.slot === s && G.owned[it.id]) G.equip[c][s] = it.id; }); });
      G.lookAt = incA;
    } else if (!incA && !myA) {                                                                  // Stände ohne Zeitpunkt (vor dem Update gewählt):
      // Der weiter fortgeschrittene Stand gibt Figur und Ausrüstung vor (bei Gleichstand eine feste Regel); wo er nur die Grundausstattung trägt, gilt die des anderen.
      // So landen beide Geräte nach einem Abgleich hin und zurück beim selben Aussehen.
      // Bei gleichem Stand entscheidet eine feste Regel (Vergleich des Aussehens), die beide Geräte gleich anwenden.
      const lead = ahead || (tie && lookKey(inc) > lookKey(G));
      if (lead && inc.char && ANIMALS[inc.char]) G.char = inc.char;
      CHARS.forEach((c) => {
        const ie = inc.equip && inc.equip[c], base = baseEquip(c); if (!ie) return;
        const incBase = SLOTS.every(([s]) => !ie[s] || ie[s] === base[s]), myBase = SLOTS.every(([s]) => G.equip[c][s] === base[s]);
        if ((lead && !incBase) || myBase) SLOTS.forEach(([s]) => { const it = IT[ie[s]]; if (it && it.char === c && it.slot === s && G.owned[it.id]) G.equip[c][s] = it.id; });
      });
    }
    fix(); save();
  }

  // ---- App-Anbindung (erst nach dem Laden des Lernstands initialisieren)
  return {
    init: ensure,
    hudHTML() { ensure(); return `<button type="button" class="pill gm-pill" data-go="belohnungen" title="Belohnungen: Level ${G.level}" aria-label="Belohnungen, Level ${G.level}"><span class="gm-hava">${myFigure()}</span><b>${G.level}</b>${claimable() ? `<i class="gm-dot" aria-hidden="true"></i>` : ""}</button>`; },
    chip() { ensure(); return G.combo >= 2 ? `<span class="gm-combo" title="Serie richtiger Antworten">🔥 ${G.combo}${mult(G.combo) > 1 ? " · " + fmtM(mult(G.combo)) : ""}</span>` : ""; },
    answer(q, ok) { ensure(); onAnswer(q, ok); }, view(el) { ensure(); return viewHTML(el); }, pack() { ensure(); return pack(); }, merge(p) { ensure(); merge(p); },
    data() { ensure(); return JSON.parse(JSON.stringify(G)); },
    boot(h) { ensure(); rollDay(); save(); if (!h.startsWith("import=") && view !== "tutorial" && !UI.sess && !UI.run && G.loginClaimed !== today()) setTimeout(() => { if (!UI.sess && !UI.run && view !== "tutorial") showLogin(); }, 700); }
  };
  })(); } catch (e) { GAMI = null; try { console.error("Belohnungen deaktiviert:", e); } catch (x) {} }

  // ---------- boot
  const h = location.hash.slice(1);
  if (h.startsWith("import=")) { setTimeout(() => txReceive(h), 0); }
  if (VIEWS.includes(h)) view = h;
  localLoad();
  gm("init");
  try { const ss = JSON.parse(localStorage.getItem(KEY_SESS) || "null"); if (ss && Array.isArray(ss.ids) && ss.i < ss.ids.length) { UI.sess = ss; view = "lernen"; } } catch (e) {}
  try { if (!h && !UI.sess && !localStorage.getItem(KEY_TUT) && !Object.keys(S.q).length) view = "tutorial"; } catch (e) {}
  render();
  gm("boot", h.startsWith("verbinden=") ? "import=" : h); // beim Verbinden keinen Login-Kalender darüberlegen
  syncBoot(h);
})();


</script>
</body>
</html>
