  ["Bei einer Bank sollen 100 € von Konto 1 auf Konto 2 umgebucht werden. Beide Buchungen dürfen nur gemeinsam wirksam werden.\n\nErstellen Sie die SQL-Anweisungen als Transaktion. (4 P)", "START TRANSACTION;\nUPDATE Konto SET Saldo = Saldo - 100 WHERE Nr = 1;\nUPDATE Konto SET Saldo = Saldo + 100 WHERE Nr = 2;\nCOMMIT;", "- Transaktionsbeginn (1 P)\n- Beide UPDATE-Anweisungen (2 P)\n- COMMIT (1 P); bei einem Fehler ROLLBACK\nJe nach DBMS BEGIN TRANSACTION statt START TRANSACTION."]
);
CARDS_RAW.db.push(
  ["In der Tabelle Student(StudentID, Matrikelnr, Email, Name, StudiengangNr) sind StudentID, Matrikelnr und Email jeweils eindeutig.\n\nOrdnen Sie die Schlüsselbegriffe zu: Kandidatenschlüssel, Primärschlüssel, Alternativschlüssel, Surrogatschlüssel, Fremdschlüssel. (5 P)", "Kandidatenschlüssel: StudentID, Matrikelnr, Email (je minimal und eindeutig)\nPrimärschlüssel: StudentID (gewählter Kandidat)\nAlternativschlüssel: Matrikelnr, Email (übrige Kandidaten)\nSurrogatschlüssel: StudentID (künstliche ID ohne fachliche Bedeutung)\nFremdschlüssel: StudiengangNr (verweist auf Studiengang)", "Je 1 P pro richtig zugeordnetem Begriff.\nSuperschlüssel: jede eindeutige Attributkombination, auch nicht minimal (z. B. StudentID + Name)."],
  ["Für einen Kunden entwickeln Sie eine neue Datenbank, von den ersten Gesprächen bis zur Umsetzung in MySQL.\n\nNennen Sie die Phasen der Datenmodellierung in der richtigen Reihenfolge mit jeweils einem Ergebnis. (4 P)", "1. Anforderungsanalyse → Anforderungen, Datenbedarf\n2. Konzeptionelles Modell → ER-Modell (DBMS-unabhängig)\n3. Logisches Modell → Relationenmodell mit Tabellen und Schlüsseln\n4. Physisches Modell → Datentypen, Indizes, Speicherung im konkreten DBMS", "Je 1 P pro Phase mit Ergebnis in richtiger Reihenfolge."],
  ["Im ER-Diagramm eines Fitnessstudios steht zwischen Mitglied und Vertrag: auf der Mitglied-Seite zwei Striche, auf der Vertrag-Seite ein Kreis und ein Krähenfuß.\n\nErklären Sie die Symbole der Krähenfuß-Notation und lesen Sie die Beziehung. (3 P)", "Strich = genau eins, Kreis = null (optional), Krähenfuß = viele.\n||——o<: Ein Vertrag gehört zu genau einem Mitglied; ein Mitglied hat keinen bis viele Verträge.", "2 P Symbole, 1 P richtige Lesart in beide Richtungen."],
  ["Für die Tabelle Bestellung eines Online-Shops sollen Datentypen festgelegt werden: Bestellbetrag, Menge, Postleitzahl, Bestelldatum, Expressversand ja/nein und ein Produktfoto.\n\nOrdnen Sie jedem Attribut einen geeigneten Datentyp zu und begründen Sie die Wahl bei PLZ und Betrag. (4 P)", "Bestellbetrag: DECIMAL(10,2) – exakt, keine Rundungsfehler\nMenge: INTEGER\nPostleitzahl: CHAR(5) bzw. VARCHAR – führende Null bleibt erhalten, keine Rechnung\nBestelldatum: DATE\nExpressversand: BOOLEAN\nProduktfoto: BLOB (oder nur der Dateipfad als VARCHAR)", "2 P für die Zuordnung, je 1 P für die Begründung bei PLZ und Betrag."]
);
CARDS_RAW.dbs = [
  ["Eine Bank bucht 500 € von einem Girokonto auf ein Sparkonto um.\n\nErläutern Sie die vier ACID-Eigenschaften am Beispiel dieser Überweisung. (4 P)", "Atomarität: Abbuchung und Gutschrift werden ganz oder gar nicht ausgeführt.\nKonsistenz: Die Summe beider Konten ist vorher und nachher gleich.\nIsolation: Eine parallele Buchung auf dem Girokonto stört die Überweisung nicht.\nDauerhaftigkeit: Nach dem COMMIT bleibt die Buchung auch nach einem Absturz erhalten.", "Je 1 P pro Eigenschaft mit Bezug zur Überweisung."],
  ["Im Lagerverwaltungssystem eines Großhändlers greifen viele Mitarbeiter gleichzeitig auf Bestände zu. Es kommt zu falschen Beständen und blockierten Buchungen.\n\nBeschreiben Sie die Probleme Lost Update, Dirty Read und Deadlock. (3 P)", "Lost Update: Zwei Transaktionen ändern denselben Wert, die zweite überschreibt die erste.\nDirty Read: Eine Transaktion liest Daten, die eine andere noch nicht bestätigt hat und später zurückrollt.\nDeadlock: Zwei Transaktionen warten gegenseitig auf Sperren der anderen; keine kommt weiter.", "Je 1 P pro Problem. Gegenmaßnahmen: Sperren bzw. Isolationsstufen; bei Deadlocks bricht das DBMS eine Transaktion ab."],
  ["Die Buchhaltung soll eine eingeschränkte Sicht auf Kundendaten erhalten, Preisänderungen sollen automatisch protokolliert werden und die Rabattberechnung soll zentral in der Datenbank liegen.\n\nOrdnen Sie jeder Anforderung Trigger, Stored Procedure oder View zu und erklären Sie das Objekt kurz. (6 P)", "Eingeschränkte Sicht → View: gespeicherte Abfrage, nutzbar wie eine Tabelle\nPreisänderungen protokollieren → Trigger: startet automatisch bei INSERT, UPDATE oder DELETE\nRabattberechnung → Stored Procedure: gespeicherte, parametrisierte SQL-Logik, wird aufgerufen", "Je 1 P pro richtiger Zuordnung, je 1 P pro Erklärung."],
  ["Ein Online-Händler prüft NoSQL-Datenbanken für Warenkorb-Cache, Produktkatalog, Klick-Zeitreihen und Produktempfehlungen.\n\nNennen Sie vier NoSQL-Typen mit je einem Beispielsystem und ordnen Sie die Anwendungsfälle zu. (4 P)", "Key-Value (z. B. Redis) → Warenkorb-Cache, Sitzungen\nDokument (z. B. MongoDB) → Produktkatalog mit wechselnden Merkmalen\nWide Column (z. B. Cassandra) → sehr große Datenmengen, Klick-Zeitreihen\nGraph (z. B. Neo4j) → Beziehungen, Produktempfehlungen", "Je 1 P pro Typ mit passender Zuordnung."],
  ["Ein Lieferdienst betreibt seine Datenbank verteilt in zwei Rechenzentren. Fällt die Verbindung zwischen ihnen aus, muss das System entscheiden, wie es reagiert.\n\nErläutern Sie das CAP-Theorem an diesem Beispiel. (3 P)", "CAP: Consistency (alle Knoten liefern denselben Stand), Availability (jede Anfrage wird beantwortet), Partition Tolerance (System arbeitet trotz Netzausfall weiter).\nBei einer Partition sind nur zwei der drei gleichzeitig möglich. Partitionstoleranz ist Pflicht, also: entweder Anfragen ablehnen (C) oder mit möglicherweise veraltetem Stand antworten (A).", "1 P Begriffe, 2 P Anwendung auf das Beispiel."],
  ["Ein soziales Netzwerk zeigt nach einem neuen Beitrag manchen Nutzern noch für einige Sekunden den alten Stand.\n\nErläutern Sie das BASE-Prinzip und grenzen Sie es von ACID ab. (3 P)", "BASE: Basically Available, Soft State, Eventual Consistency. Das System bleibt verfügbar, Daten dürfen kurzzeitig unterschiedlich sein und gleichen sich nach einiger Zeit an.\nACID verlangt dagegen sofortige Konsistenz nach jeder Transaktion.", "2 P BASE mit Bezug zum Beispiel, 1 P Abgrenzung zu ACID."],
  ["Ein Handelskonzern will Verkaufszahlen auswerten und zusätzlich Rohdaten wie Klickströme und Bilder für spätere Analysen aufheben.\n\nUnterscheiden Sie Data Warehouse und Data Lake. (4 P)", "Data Warehouse: bereinigte, strukturierte Daten für Auswertungen; Struktur wird beim Schreiben festgelegt (Schema on Write), befüllt per ETL.\nData Lake: Rohdaten jeder Art (strukturiert, unstrukturiert); Struktur erst beim Lesen (Schema on Read).", "Je 2 P pro Begriff (Datenart und Zeitpunkt der Strukturierung)."],
  ["Ein Onlineshop repliziert seine Datenbank auf einen zweiten Server und möchte deshalb auf Backups verzichten.\n\nErklären Sie den Zweck der Replikation und begründen Sie, warum sie kein Backup ersetzt. (3 P)", "Replikation hält Kopien der Datenbank auf mehreren Servern aktuell: Ausfallsicherheit und Lastverteilung (z. B. Lesezugriffe auf die Kopie).\nKein Backup-Ersatz: Fehler wie ein versehentliches DELETE oder Verschlüsselung durch Ransomware werden sofort mitrepliziert. Nur ein Backup erlaubt die Rückkehr zu einem früheren Stand.", "1 P Zweck, 2 P Begründung mit Beispiel."]
];

  ["t2", "algo", "Für welche Daten ist Insertion Sort besonders schnell?", ["Fast sortierte Daten", "Umgekehrt sortierte Daten", "Sehr große, zufällige Daten", "Daten mit vielen Duplikaten"], 0, "Bei fast sortierten Daten muss kaum verschoben werden; der Aufwand liegt dann nahe O(n).", "T01"],
  ["t2", "algo", "Was passiert, wenn eine rekursive Methode keinen Rekursionsanker hat?", ["Sie ruft sich endlos auf, bis der Aufrufstapel überläuft", "Sie liefert automatisch 0", "Der Compiler ergänzt den Anker", "Sie läuft genau einmal"], 0, "Ohne Abbruchbedingung endet die Rekursion nicht; es folgt ein Stack Overflow.", "T01"],
  ["t2", "algo", "Welche Laufzeit hat der Zugriff auf werte[i] in einem Array?", ["O(1)", "O(log n)", "O(n)", "O(n²)"], 0, "Die Adresse wird direkt aus dem Index berechnet, unabhängig von der Länge.", "T01"],
  ["t2", "algo", "Zwei verschachtelte Schleifen laufen jeweils über alle n Elemente. Welche Laufzeit ergibt sich?", ["O(n²)", "O(n)", "O(2n)", "O(log n)"], 0, "n Durchläufe außen mal n Durchläufe innen.", "T01"],
  ["t2", "algo", "Welche Datenstruktur bildet Straßenverbindungen zwischen Städten mit Entfernungen ab?", ["Gewichteter Graph", "Stack", "Queue", "Array fester Länge"], 0, "Städte sind Knoten, Straßen Kanten, die Entfernung ist das Kantengewicht.", "T01"],
  ["t2", "algo", "Im binären Suchbaum steht 42 in der Wurzel. Wo wird 17 eingefügt?", ["Im linken Teilbaum", "Im rechten Teilbaum", "Als neue Wurzel", "Hinter dem größten Element"], 0, "Kleinere Schlüssel liegen links, größere rechts.", "T01"],
  ["t2", "algo", "Welche Schleife prüft die Bedingung erst nach dem ersten Durchlauf?", ["Fußgesteuerte Schleife (wiederhole … bis, do-while)", "Kopfgesteuerte Schleife (solange, while)", "Zählschleife (für, for)", "for-each-Schleife"], 0, "Die fußgesteuerte Schleife läuft mindestens einmal.", "T01"],
  ["t2", "algo", "1.000 € werden 2 Jahre mit 5 % Zinseszins verzinst. Welcher Betrag ergibt sich?", ["1.102,50 €", "1.100,00 €", "1.105,00 €", "1.050,00 €"], 0, "1.000 · 1,05² = 1.102,50 €; bei Zinseszins werden die Zinsen mitverzinst.", "T01"],
  // T02 SQL
  ["t2", "sql", "Der Datenbankadministrator vergibt dem neuen Mitarbeiter Leserechte auf die Tabelle Bestellung.\n\nZu welchem SQL-Sprachbereich gehört der Befehl GRANT?", ["DCL – Data Control Language","DDL – Data Definition Language","DML – Data Manipulation Language","TCL – Transaction Control Language"], 0, "Die DCL regelt Berechtigungen mit GRANT und REVOKE. DDL definiert Strukturen (CREATE, ALTER, DROP), DML ändert Daten (INSERT, UPDATE, DELETE).", "T02"],
  ["t2", "sql", "Während einer Umbuchung tritt ein Fehler auf. Alle Änderungen seit Beginn der Transaktion sollen verworfen werden.\n\nWelcher Befehl der TCL macht das?", ["ROLLBACK","ALTER","INSERT","REVOKE"], 0, "Die Transaction Control Language steuert Transaktionen: COMMIT bestätigt, ROLLBACK verwirft, SAVEPOINT setzt einen Zwischenstand.", "T02"],
  ["t2", "sql", "Die Marketingabteilung sucht Kunden, die sowohl 2025 als auch 2026 bestellt haben. Dazu werden zwei Abfragen mit gleicher Spaltenliste kombiniert.\n\nWas liefert INTERSECT?", ["Nur die Zeilen, die in beiden Ergebnissen vorkommen","Alle Zeilen beider Ergebnisse","Die Zeilen des ersten Ergebnisses ohne die des zweiten","Das kartesische Produkt beider Ergebnisse"], 0, "INTERSECT bildet die Schnittmenge. UNION bildet die Vereinigung, EXCEPT (Oracle: MINUS) die Differenz.", "T02"],
  ["t2", "sql", "Gesucht sind Kunden, die 2025 bestellt haben, 2026 aber nicht mehr.\n\nWas liefert Abfrage2025 EXCEPT Abfrage2026 (in Oracle MINUS)?", ["Die Zeilen der ersten Abfrage, die in der zweiten nicht vorkommen","Die Schnittmenge beider Abfragen","Alle Zeilen ohne Duplikate","Nur Zeilen mit NULL-Werten"], 0, "EXCEPT bildet die Differenzmenge: erstes Ergebnis minus zweites. Die Reihenfolge der Abfragen ist also entscheidend.", "T02"],
  ["t2", "sql", "Zwei Abfragen sollen mit UNION zu einer Liste zusammengeführt werden.\n\nWelche Bedingung müssen beide Abfragen erfüllen?", ["Gleiche Spaltenanzahl mit verträglichen Datentypen","Gleiche Tabellennamen","Gleiche WHERE-Bedingung","Einen gemeinsamen Primärschlüssel"], 0, "Die Ergebnisse werden zeilenweise untereinandergesetzt. Dazu müssen Anzahl und Typen der Spalten zusammenpassen; die Spaltennamen kommen aus der ersten Abfrage.", "T02"],
  ["t2", "sql", "Für eine Preisliste werden versehentlich die Tabellen Farbe (4 Zeilen) und Groesse (5 Zeilen) ohne Join-Bedingung verknüpft (CROSS JOIN).\n\nWie viele Zeilen liefert das Ergebnis?", ["20","9","5","4"], 0, "Der CROSS JOIN bildet das kartesische Produkt: Jede Zeile wird mit jeder kombiniert, also 4 · 5 = 20 Zeilen.", "T02"],
  ["t2", "sql", "In der Tabelle Mitarbeiter verweist die Spalte ChefID auf die MID des Vorgesetzten. Es soll zu jedem Mitarbeiter der Name seines Chefs ausgegeben werden.\n\nWelche Technik ist dafür nötig?", ["Ein Self Join: die Tabelle wird mit sich selbst verbunden","Ein Löschen der Duplikate mit DISTINCT","Eine Kopie der Tabelle mit CREATE TABLE … AS","Eine Rechtevergabe mit GRANT"], 0, "Beim Self Join wird dieselbe Tabelle zweimal mit unterschiedlichen Aliasnamen verwendet, z. B. Mitarbeiter m und Mitarbeiter v ON m.ChefID = v.MID.", "T02"],
  ["t2", "sql", "Eine Abfrage enthält WHERE EXISTS (SELECT * FROM Bestellung b WHERE b.KID = k.KID).\n\nWas prüft EXISTS?", ["Ob die Unterabfrage mindestens eine Zeile liefert","Ob eine Spalte NULL ist","Ob die Tabelle Bestellung existiert","Ob ein Wert eindeutig ist"], 0, "EXISTS ist wahr, sobald die (meist korrelierte) Unterabfrage eine Zeile liefert. Welche Spalten sie auswählt, spielt keine Rolle.", "T02"],
  ["t2", "sql", "Gesucht sind Artikel, die teurer sind als jede Maus im Sortiment. Die Bedingung lautet WHERE Preis > ALL (SELECT Preis FROM Artikel WHERE Kategorie = 'Maus').\n\nWas bedeutet ALL hier?", ["Der Preis muss größer als jeder Mauspreis sein.","Der Preis muss größer als irgendein Mauspreis sein.","Der Preis muss einem Mauspreis entsprechen.","Der Preis muss über dem Durchschnitt der Mauspreise liegen."], 0, "ALL verlangt die Bedingung für jeden Wert der Unterabfrage, also größer als das Maximum. ANY (SOME) genügt ein einziger Wert.", "T02"],
  ["t2", "sql", "In der Theorieaufgabe soll eine SQL-Abfrage in die relationale Algebra übertragen werden.\n\nWelcher Operation entspricht die WHERE-Klausel?", ["Selektion","Projektion","Vereinigung","Division"], 0, "Die Selektion wählt Zeilen nach einer Bedingung aus (WHERE). Die Projektion wählt Spalten aus (Spaltenliste nach SELECT).", "T02"],
  ["t2", "sql", "In der Abfrage SELECT Name, Ort FROM Kunde werden nur zwei Spalten ausgegeben.\n\nWelcher Operation der relationalen Algebra entspricht das?", ["Projektion","Selektion","Kartesisches Produkt","Differenz"], 0, "Die Projektion wählt Spalten aus. Merkhilfe: Selektion = Zeilen (WHERE), Projektion = Spalten (SELECT-Liste).", "T02"],
  ["t2", "sql", "Eine Abfrage sucht Artikel, die nie bestellt wurden: WHERE ArtNr NOT IN (SELECT ArtNr FROM Position). In Position steht durch einen Erfassungsfehler eine Zeile mit ArtNr = NULL.\n\nWas liefert die Hauptabfrage?", ["Keine Zeilen","Alle Artikel","Nur Artikel mit NULL","Einen Syntaxfehler"], 0, "x NOT IN (…, NULL) ist nie wahr, sondern „unbekannt“. Deshalb fällt jede Zeile heraus. NOT EXISTS ist bei möglichen NULL-Werten die sichere Variante.", "T02"],
  ["t2", "sql", "Die Buchhaltung soll Kundendaten sehen, aber ohne die E-Mail-Adressen. Der Administrator legt dafür eine View an.\n\nWelche Aussage über eine View stimmt?", ["Sie ist eine gespeicherte Abfrage, die wie eine Tabelle genutzt wird.","Sie speichert immer eine vollständige Kopie der Daten.","Sie ersetzt den Primärschlüssel der Tabelle.","Sie ist eine besondere Form eines Index."], 0, "Eine View ist eine virtuelle Tabelle. Sie kann Spalten verbergen, komplexe Abfragen vereinfachen und mit GRANT gezielt freigegeben werden.", "T02"],
  ["t2", "sql", "Die nicht mehr benötigte Tabelle Altkunden soll vollständig aus der Datenbank verschwinden, also Daten und Struktur.\n\nWelcher Befehl ist richtig?", ["DROP TABLE Altkunden;","DELETE FROM Altkunden;","TRUNCATE COLUMN Altkunden;","REMOVE TABLE Altkunden;"], 0, "DROP entfernt das Objekt selbst (DDL). DELETE löscht nur die Zeilen, die leere Tabelle bleibt bestehen.", "T02"],
  ["t2", "sql", "Ein Kollege wundert sich, dass er in WHERE keinen Aliasnamen aus der SELECT-Liste verwenden darf.\n\nWelcher Teil einer Abfrage wird logisch zuerst ausgewertet?", ["FROM mit JOIN","SELECT","ORDER BY","HAVING"], 0, "Logische Reihenfolge: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY. Der Alias entsteht erst im SELECT, ist in WHERE also noch unbekannt, in ORDER BY aber schon nutzbar.", "T02"],
  // T03 Datenmodell
  ["t2", "dm", "Die Tabelle Mitarbeiter erhält als Primärschlüssel eine automatisch hochgezählte Spalte MID statt der Kombination aus Name und Geburtsdatum.\n\nWie nennt man einen solchen Schlüssel?", ["Surrogatschlüssel: künstlicher Schlüssel ohne fachliche Bedeutung","Zusammengesetzter Schlüssel aus Fachattributen","Fremdschlüssel auf die eigene Tabelle","Schlüssel, der nur in Views existiert"], 0, "Surrogatschlüssel sind kurz und ändern sich nie. Die fachliche Eindeutigkeit (z. B. Personalnummer) sollte trotzdem zusätzlich über UNIQUE abgesichert werden.", "T03"],
  ["t2", "dm", "In der Tabelle Student sind sowohl Matrikelnummer als auch E-Mail-Adresse eindeutig.\n\nWie heißen solche Attribute, bevor einer davon als Primärschlüssel gewählt wird?", ["Kandidatenschlüssel","Fremdschlüssel","Surrogatschlüssel","Indexschlüssel"], 0, "Ein Kandidatenschlüssel ist eine minimale Attributkombination, die jeden Datensatz eindeutig identifiziert. Einer wird Primärschlüssel, die übrigen sind Alternativschlüssel.", "T03"],
  ["t2", "dm", "Ein Online-Shop speichert Rechnungsbeträge. Rundungsfehler im Cent-Bereich sind nicht akzeptabel.\n\nWelcher Datentyp eignet sich?", ["DECIMAL(10,2)","FLOAT","VARCHAR(10)","BOOLEAN"], 0, "DECIMAL speichert Dezimalzahlen exakt mit fester Nachkommastellenzahl. FLOAT ist ein Gleitkommatyp und erzeugt Rundungsfehler, z. B. 0,1 + 0,2 ≠ 0,3.", "T03"],
  ["t2", "dm", "Für eine neue Kursverwaltung zeichnen Sie zuerst Entitäten, Attribute und Beziehungen, noch ohne an ein bestimmtes DBMS zu denken.\n\nIn welcher Modellierungsphase entsteht dieses ER-Modell?", ["Konzeptionelles Modell","Physisches Modell","Logisches Modell","Implementierung"], 0, "Reihenfolge: konzeptionell (ER-Modell, DBMS-unabhängig) → logisch (Relationenmodell mit Tabellen und Schlüsseln) → physisch (Datentypen, Indizes, Speicherung im konkreten DBMS).", "T03"],
  ["t2", "dm", "Nachdem das Relationenmodell steht, legen Sie für MySQL Datentypen, Indizes und Speicherparameter fest.\n\nWelches Modell beschreiben Sie damit?", ["Das physische Datenmodell","Die Anforderungen der Fachabteilung","Das konzeptionelle ER-Modell","Den Entwurf der Benutzeroberfläche"], 0, "Erst das physische Modell ist vom konkreten DBMS abhängig: Es legt fest, wie die Daten dort tatsächlich gespeichert werden.", "T03"],
  ["t2", "dm", "Im ER-Diagramm einer Werkstatt steht zwischen Kunde und Fahrzeug auf der Fahrzeug-Seite ein Kreis vor dem Krähenfuß.\n\nWas bedeutet das?", ["Ein Kunde hat keins bis viele Fahrzeuge.","Ein Kunde hat genau ein Fahrzeug.","Ein Kunde hat mindestens ein Fahrzeug.","Ein Kunde hat höchstens ein Fahrzeug."], 0, "In der Krähenfuß-Notation bedeutet der Kreis „null“ (optional), der Strich „eins“ und der Krähenfuß „viele“. Kreis + Krähenfuß = 0..n.", "T03"],
  ["t2", "dm", "Ein Datenbanksystem soll so aufgebaut sein, dass sich die Speicherung ändern lässt, ohne die Anwendungsprogramme anzupassen.\n\nWas ist das Ziel der Drei-Ebenen-Architektur nach ANSI/SPARC?", ["Datenunabhängigkeit zwischen Anwendungen und Speicherung","Schnellere Abfragen durch Indizes","Verschlüsselung der Daten","Verteilung auf mehrere Server"], 0, "Externe Ebene (Sichten der Anwender), konzeptionelle Ebene (Gesamtschema) und interne Ebene (physische Speicherung) sind getrennt. Änderungen auf einer Ebene wirken sich nicht auf die anderen aus.", "T03"],
  ["t2", "dm", "Im Modell einer Behörde hat jede Person genau einen Personalausweis und jeder Ausweis gehört genau einer Person.\n\nWelche Kardinalität liegt vor?", ["1:1","1:n","m:n","n:1"], 0, "Auf beiden Seiten steht genau eins. Bei 1:1 kann der Fremdschlüssel in einer der beiden Tabellen stehen und wird zusätzlich UNIQUE gesetzt.", "T03"],
  ["t2", "dm", "Die Tabelle Position einer Auftragsverwaltung hat den Primärschlüssel (BestellNr, ArtikelNr).\n\nWie nennt man einen solchen Schlüssel?", ["Zusammengesetzter Primärschlüssel aus mehreren Attributen","Schlüssel aus Text und Zahl","Zwei Primärschlüssel in einer Tabelle","Primärschlüssel mit Index"], 0, "Erst beide Attribute zusammen sind eindeutig. Zusammengesetzte Schlüssel sind typisch für Zwischentabellen aufgelöster m:n-Beziehungen.", "T03"],
  // T16 Datenbanksysteme und NoSQL
  ["t2", "dbs", "Bei einer Überweisung wird der Betrag vom Konto A abgebucht. Vor der Gutschrift auf Konto B stürzt der Server ab.\n\nWelche ACID-Eigenschaft verhindert, dass nur die Abbuchung bestehen bleibt?", ["Atomarität","Isolation","Dauerhaftigkeit","Konsistenz durch Indizes"], 0, "Atomarität: Eine Transaktion wird ganz oder gar nicht ausgeführt. Nach dem Neustart wird die unvollständige Transaktion zurückgerollt.", "T16"],
  ["t2", "dbs", "Der Online-Shop bestätigt dem Kunden die Bestellung. Eine Sekunde später fällt der Strom aus.\n\nWelche ACID-Eigenschaft sichert, dass die bestätigte Bestellung erhalten bleibt?", ["Dauerhaftigkeit (Durability)","Atomarität","Isolation","Konsistenz"], 0, "Nach dem COMMIT sind Änderungen dauerhaft, z. B. weil sie zuerst ins Transaktionslog geschrieben werden und nach einem Absturz wiederhergestellt werden können.", "T16"],
  ["t2", "dbs", "Zwei Lageristen lesen gleichzeitig den Bestand 10, buchen jeweils eine Entnahme und speichern 9 bzw. 8. Am Ende steht 8 statt 7 in der Datenbank.\n\nWie heißt dieses Problem?", ["Lost Update","Dirty Read","Deadlock","Phantom Read"], 0, "Beim Lost Update überschreibt die zweite Änderung die erste. Sperren (z. B. SELECT … FOR UPDATE) oder eine Versionsprüfung verhindern das.", "T16"],
  ["t2", "dbs", "Transaktion T1 sperrt Konto A und wartet auf Konto B. Transaktion T2 sperrt Konto B und wartet auf Konto A.\n\nWie nennt man diese Situation?", ["Deadlock","Dirty Read","Lost Update","Rekursiver Trigger"], 0, "Beim Deadlock warten Transaktionen gegenseitig auf die Sperren der anderen. Das DBMS erkennt das und bricht eine Transaktion ab (Rollback).", "T16"],
  ["t2", "dbs", "Ein Lagerverwaltungssystem soll bei jedem Abgang automatisch prüfen, ob der Mindestbestand unterschritten ist.\n\nWann wird ein Trigger ausgeführt?", ["Automatisch bei einem Ereignis wie INSERT, UPDATE oder DELETE","Nur wenn ein Benutzer ihn aufruft","Beim Anmelden am DBMS","Nach jedem SELECT"], 0, "Trigger reagieren auf Datenänderungen in einer Tabelle (BEFORE oder AFTER). Eine Stored Procedure muss dagegen ausdrücklich aufgerufen werden.", "T16"],
  ["t2", "dbs", "Die Buchungslogik einer Bank wird als Stored Procedure in der Datenbank hinterlegt und von mehreren Anwendungen aufgerufen.\n\nWelcher Vorteil ergibt sich daraus?", ["Die Logik liegt zentral in der Datenbank, Parameter schützen vor SQL-Injection.","Sie ersetzen regelmäßige Backups.","Sie machen Indizes überflüssig.","Sie funktionieren in jedem DBMS identisch."], 0, "Stored Procedures bündeln Logik zentral, verringern die Netzlast und arbeiten mit Parametern statt zusammengesetzter SQL-Strings. Nachteil: Die Syntax ist herstellerabhängig.", "T16"],
  ["t2", "dbs", "Ein Unternehmen spiegelt seine Datenbank in Echtzeit auf einen zweiten Server und verzichtet deshalb auf Backups.\n\nWarum ist das riskant?", ["Fehler wie ein versehentliches DELETE werden sofort mitrepliziert.","Replikation ist zu langsam für Echtzeit.","Replikation funktioniert nur offline.","Replikation speichert nur Indizes."], 0, "Replikation erhöht die Verfügbarkeit, hält aber keinen früheren Datenstand vor. Nur ein Backup erlaubt die Rückkehr zu einem Zeitpunkt vor dem Fehler.", "T16"],
  ["t2", "dbs", "Ein Online-Shop möchte Empfehlungen wie „Kunden, die X kauften, kauften auch Y“ über mehrere Ebenen berechnen.\n\nWelcher NoSQL-Typ passt am besten?", ["Graphdatenbank","Key-Value-Store","Spaltenorientierte Datenbank","Dokumentenorientierte Datenbank"], 0, "Graphdatenbanken (z. B. Neo4j) speichern Knoten und Kanten und verfolgen Beziehungen über viele Ebenen effizient, wo relationale Datenbanken viele Joins bräuchten.", "T16"],
  ["t2", "dbs", "Eine Webanwendung soll Sitzungsdaten der angemeldeten Nutzer extrem schnell über die Session-ID abrufen.\n\nWelcher NoSQL-Typ eignet sich?", ["Key-Value-Store","Graphdatenbank","Relationale Datenbank","Hierarchische Datenbank"], 0, "Ein Key-Value-Store (z. B. Redis) greift über einen Schlüssel direkt auf den Wert zu, oft im Arbeitsspeicher. Ideal für Caches und Sitzungen.", "T16"],
  ["t2", "dbs", "Ein weltweit verteiltes System verliert zeitweise die Verbindung zwischen zwei Rechenzentren.\n\nWas besagt das CAP-Theorem für diesen Fall?", ["Bei einer Netzwerkpartition kann das System nicht zugleich Konsistenz und Verfügbarkeit garantieren.","Jede Datenbank muss ACID erfüllen.","Ein System erfüllt immer alle drei Eigenschaften.","Partitionen machen Daten automatisch konsistent."], 0, "CAP: Consistency, Availability, Partition Tolerance. Partitionstoleranz ist bei verteilten Systemen Pflicht, also muss man zwischen C (alle sehen dasselbe) und A (jede Anfrage wird beantwortet) wählen.", "T16"],
  ["t2", "dbs", "Viele NoSQL-Systeme folgen statt ACID dem BASE-Prinzip.\n\nWofür steht das E in BASE?", ["Eventual Consistency","Encryption","Error Handling","Exclusive Lock"], 0, "Basically Available, Soft State, Eventual Consistency: Das System bleibt verfügbar, Daten sind kurzzeitig unterschiedlich und gleichen sich nach einiger Zeit an.", "T16"],
  ["t2", "dbs", "Ein Energieversorger sammelt Messwerte von Millionen Smart Metern im Sekundentakt, dazu Wetterdaten und Kundenbeschwerden als Freitext.\n\nWelche drei Vs beschreiben Big Data klassisch?", ["Volume, Velocity, Variety","Value, Version, Volume","Velocity, Validation, View","Variety, Virtualisierung, Verfügbarkeit"], 0, "Volume (Menge), Velocity (Geschwindigkeit), Variety (Vielfalt der Formate). Häufig ergänzt um Veracity (Verlässlichkeit) und Value (Nutzen).", "T16"],
  ["t2", "dbs", "Ein Konzern plant eine Plattform für Auswertungen. Die Fachabteilung will sowohl aufbereitete Kennzahlen als auch Rohdaten für spätere Analysen.\n\nWas unterscheidet einen Data Lake von einem Data Warehouse?", ["Der Data Lake speichert Rohdaten jeder Art, das Warehouse aufbereitete, strukturierte Daten.","Der Data Lake ist immer relational.","Das Data Warehouse speichert nur Bilder.","Es gibt keinen Unterschied."], 0, "Warehouse: Schema beim Schreiben (Schema on Write), befüllt per ETL. Lake: Daten werden roh abgelegt, Struktur erst beim Lesen (Schema on Read).", "T16"],
  ["t2", "dbs", "Daten aus Warenwirtschaft und Webshop werden nachts bereinigt und ins Data Warehouse übernommen.\n\nWofür steht ETL?", ["Extract, Transform, Load","Encrypt, Transfer, Lock","Edit, Test, Launch","Export, Translate, Link"], 0, "Extract: aus den Quellen lesen. Transform: bereinigen, vereinheitlichen, verdichten. Load: ins Zielsystem laden.", "T16"],
  ["t2", "dbs", "Ein Altsystem speichert Daten als Baum: Jede Filiale hat Abteilungen, jede Abteilung hat Mitarbeiter, jeder Datensatz hat genau einen übergeordneten Datensatz.\n\nWelches Datenbankmodell liegt vor?", ["Hierarchisches Modell","Relationales Modell","Graphmodell","Netzwerkmodell"], 0, "Das hierarchische Modell erlaubt genau ein Elternelement pro Datensatz. Das Netzwerkmodell erlaubt mehrere, das relationale Modell arbeitet mit Tabellen und Schlüsseln.", "T16"],
  // T04 UML
  ["t2", "diag", "Was zeigt ein Verteilungsdiagramm?", ["Auf welchen Knoten (Hardware, Laufzeitumgebungen) welche Software-Artefakte laufen", "Den Ablauf einer Methode", "Die Zustände eines Objekts", "Akteure und Anwendungsfälle"], 0, "Verteilungsdiagramme zeigen die physische Sicht mit Knoten, Artefakten und Verbindungen.", "T04"],
  ["t2", "diag", "Was zeigt ein Komponentendiagramm?", ["Größere Softwarebausteine und ihre Schnittstellen", "Die zeitliche Reihenfolge von Nachrichten", "Die Attribute einer Klasse", "Die Verkabelung der Hardware"], 0, "Bereitgestellte Schnittstellen als Kreis, benötigte als Halbkreis.", "T04"],
  ["t2", "diag", "Wie wird ein statisches Attribut im Klassendiagramm dargestellt?", ["Unterstrichen", "Kursiv", "Mit #", "In eckigen Klammern"], 0, "Kursiv steht für abstrakt, # für protected.", "T04"],
  ["t2", "diag", "Wie wird die Realisierung eines Interfaces gezeichnet?", ["Gestrichelte Linie mit hohlem Dreieck", "Durchgezogene Linie mit hohlem Dreieck", "Linie mit gefüllter Raute", "Linie mit offener Pfeilspitze"], 0, "Durchgezogen mit hohlem Dreieck ist die Vererbung.", "T04"],
  ["t2", "diag", "Welche Sichtbarkeit hat ein Attribut mit dem Zeichen ~?", ["Package", "Private", "Protected", "Public"], 0, "+ public, - private, # protected, ~ package.", "T04"],
  ["t2", "diag", "Welches Diagramm zeigt Lebenslinien von Objekten und ihren Nachrichtenaustausch?", ["Sequenzdiagramm", "Klassendiagramm", "Verteilungsdiagramm", "Komponentendiagramm"], 0, "Das Sequenzdiagramm stellt die zeitliche Reihenfolge der Nachrichten dar.", "T04"],
  ["t2", "diag", "Was bedeutet die Multiplizität 0..1?", ["Keins oder genau eins", "Genau eins", "Mindestens eins", "Beliebig viele"], 0, "Untergrenze 0, Obergrenze 1.", "T04"],
  ["t2", "diag", "Welches Element beendet im Aktivitätsdiagramm nur einen Teilfluss, nicht die ganze Aktivität?", ["Ablaufende (Kreis mit X)", "Endknoten (Kreis mit Punkt)", "Startknoten", "Join-Balken"], 0, "Der Endknoten beendet die gesamte Aktivität, das Ablaufende nur den einen Fluss.", "T04"],
  ["t2", "diag", "Wie wird im Sequenzdiagramm ein synchroner Aufruf gezeichnet?", ["Durchgezogene Linie mit gefüllter Pfeilspitze", "Gestrichelte Linie mit offener Pfeilspitze", "Durchgezogene Linie mit offener Pfeilspitze", "Linie mit Raute"], 0, "Offene Spitze steht für asynchron, gestrichelt für die Antwort.", "T04"],
  // T05 Testen und Qualität
  ["t2", "diag", "Wer führt den Abnahmetest typischerweise durch?", ["Der Auftraggeber bzw. die Fachabteilung", "Der Entwickler der Klasse", "Der Compiler", "Der Datenbankadministrator"], 0, "Der Auftraggeber prüft gegen den Vertrag; das Ergebnis steht im Abnahmeprotokoll.", "T05"],

PAKETE.push(
  { id: "G01", titel: "Datenstrukturen, Suchen und Sortieren", teil: "Teil 2", prio: "Wichtig", h: 2, relevanz: "Standardalgorithmen und Datenstrukturen stehen im Prüfungskatalog. In Algorithmen-Aufgaben musst du sie meist anwenden, nicht nur nennen.",
    kern: [
      ["Array und Liste", "Ein Array hat eine feste Größe und erlaubt den Zugriff per Index in konstanter Zeit. Eine dynamische Liste (z. B. ArrayList) wächst automatisch. Eine verkettete Liste fügt schnell ein und löscht schnell, braucht für das n-te Element aber einen Durchlauf.", "werte[i]       // Zugriff per Index\nliste.add(x)   // anhängen\nliste.get(i)   // lesen\nliste.size()   // Anzahl"],
      ["Stack und Queue", "Ein Stack arbeitet nach LIFO: push legt oben ab, pop nimmt das oberste Element. Einsatz: Rückgängig-Funktion, Aufrufstapel, Klammerprüfung. Eine Queue arbeitet nach FIFO: hinten anfügen, vorne entnehmen. Einsatz: Druckaufträge, Nachrichtenverarbeitung."],
      ["Baum und Graph", "Ein Baum hat eine Wurzel; jeder andere Knoten hat genau einen Elternknoten. Im binären Suchbaum liegen kleinere Schlüssel links, größere rechts; Suchen dauert bei ausgeglichenem Baum etwa log2(n) Schritte. Ein Graph besteht aus Knoten und Kanten (gerichtet oder ungerichtet, gewichtet) und modelliert Netze wie Straßen oder Abhängigkeiten."],
      ["Lineare und binäre Suche", "Die lineare Suche prüft jedes Element nacheinander und funktioniert immer (bis zu n Vergleiche). Die binäre Suche halbiert den Suchbereich bei jedem Schritt und braucht höchstens etwa log2(n) + 1 Vergleiche, setzt aber sortierte Daten voraus.", "links = 0\nrechts = n - 1\nsolange links <= rechts\n  mitte = (links + rechts) / 2   // ganzzahlig\n  wenn werte[mitte] = gesucht dann\n    rückgabe mitte\n  sonst wenn werte[mitte] < gesucht dann\n    links = mitte + 1\n  sonst\n    rechts = mitte - 1\n  ende wenn\nende solange\nrückgabe -1"],
      ["Sortierverfahren im Vergleich", "Bubble Sort vertauscht benachbarte Elemente. Selection Sort sucht in jedem Durchlauf das Minimum und setzt es nach vorn (wenige Tauschvorgänge). Insertion Sort fügt jedes Element in den sortierten linken Teil ein und ist bei fast sortierten Daten schnell. Alle drei liegen im schlechtesten Fall bei O(n²); Quicksort und Mergesort schaffen im Mittel O(n · log n)."],
      ["Rekursion richtig aufbauen", "Jede rekursive Methode braucht einen Rekursionsanker (Abbruchbedingung) und einen rekursiven Schritt, der das Problem verkleinert. Fehlt der Anker, läuft der Aufrufstapel über. Rekursion ist elegant bei Bäumen und Verzeichnissen, kostet aber Speicher pro Aufruf.", "methode fakultaet(n : Integer) : Integer\n  wenn n <= 1 dann\n    rückgabe 1                    // Anker\n  ende wenn\n  rückgabe n * fakultaet(n - 1)   // Schritt\nende methode"],
      ["Laufzeit grob einschätzen", "Die O-Notation beschreibt, wie der Aufwand mit der Datenmenge wächst: O(1) konstant (Indexzugriff), O(log n) (binäre Suche), O(n) (eine Schleife), O(n²) (zwei verschachtelte Schleifen). In der Prüfung reicht meist die Begründung über die Anzahl der Schleifen."]
    ],
    fallen: ["Binäre Suche auf unsortierte Daten angewendet.", "Die Mitte als Kommazahl berechnet statt ganzzahlig.", "Stack und Queue verwechselt (LIFO und FIFO).", "Rekursion ohne Abbruchbedingung.", "Bei Sortierverfahren die äußere Schleife einen Durchlauf zu weit laufen lassen."],
    ziele: ["Ich wähle die passende Datenstruktur und begründe sie.", "Ich schreibe die binäre Suche in Pseudocode.", "Ich unterscheide Bubble, Selection und Insertion Sort.", "Ich baue eine rekursive Methode mit Anker."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G02", titel: "SQL: Sprachbereiche, Mengen und Unterabfragen", teil: "Teil 2", prio: "Wichtig", h: 1.5, relevanz: "Ergänzt „SQL komplett“ um Sprachbereiche, Mengenoperationen, EXISTS und Transaktionen. Diese Punkte tauchen als Teilfragen in SQL-Aufgaben oder als Kurzfragen in Planen auf.",
    kern: [
      ["Sprachbereiche", "DDL definiert die Struktur (CREATE, ALTER, DROP). DML ändert Daten (INSERT, UPDATE, DELETE). DQL fragt ab (SELECT). DCL regelt Rechte (GRANT, REVOKE). TCL steuert Transaktionen (COMMIT, ROLLBACK, SAVEPOINT)."],
      ["CRUD und HTTP", "Create = INSERT (POST), Read = SELECT (GET), Update = UPDATE (PUT oder PATCH), Delete = DELETE (DELETE)."],
      ["Weitere Join-Arten", "FULL OUTER JOIN liefert alle Zeilen beider Tabellen; fehlende Partner werden mit NULL aufgefüllt. CROSS JOIN bildet das kartesische Produkt. Ein Self Join verbindet eine Tabelle mit sich selbst, z. B. Mitarbeiter mit Vorgesetztem; dafür braucht man Aliasnamen.", "SELECT m.Name, v.Name AS Vorgesetzter\nFROM Mitarbeiter m\nLEFT JOIN Mitarbeiter v ON m.VorgesetzterID = v.MID;"],
      ["Unterabfragen mit EXISTS, IN, ANY, ALL", "IN prüft gegen eine Werteliste, EXISTS nur, ob die Unterabfrage mindestens eine Zeile liefert. > ALL heißt größer als jeder Wert, > ANY größer als mindestens einer. Vorsicht: NOT IN liefert nichts, sobald die Unterabfrage NULL enthält.", "SELECT k.Name\nFROM Kunde k\nWHERE NOT EXISTS (\n  SELECT * FROM Bestellung b WHERE b.KID = k.KID\n);"],
      ["Mengenoperationen", "UNION vereinigt zwei Ergebnisse ohne Duplikate (UNION ALL mit Duplikaten), INTERSECT liefert die Schnittmenge, EXCEPT (in Oracle MINUS) die Differenz. Beide Abfragen brauchen gleich viele Spalten mit verträglichen Datentypen.", "SELECT Ort FROM Kunde\nINTERSECT\nSELECT Ort FROM Lieferant;"],
      ["Relationale Algebra", "Die Projektion wählt Spalten (SELECT-Liste), die Selektion wählt Zeilen (WHERE), das kartesische Produkt kombiniert jede Zeile mit jeder. Ein Join ist ein kartesisches Produkt mit Selektion auf gleiche Schlüsselwerte."],
      ["Transaktionen in SQL", "Zusammengehörige Änderungen stehen in einer Transaktion: Entweder werden alle mit COMMIT festgeschrieben oder mit ROLLBACK verworfen.", "START TRANSACTION;\nUPDATE Konto SET Saldo = Saldo - 100 WHERE KtoNr = 1;\nUPDATE Konto SET Saldo = Saldo + 100 WHERE KtoNr = 2;\nCOMMIT;"]
    ],
    fallen: ["Bei UNION unterschiedliche Spaltenanzahl.", "NOT IN mit einer Unterabfrage, die NULL liefert: Ergebnis bleibt leer.", "Self Join ohne Aliasnamen.", "CROSS JOIN statt INNER JOIN: riesige Ergebnismenge.", "COMMIT vergessen oder nach einem Fehler nicht zurückgerollt."],
    ziele: ["Ich ordne Befehle den Sprachbereichen zu.", "Ich nutze EXISTS und NOT EXISTS sicher.", "Ich setze UNION, INTERSECT und EXCEPT richtig ein.", "Ich schreibe eine Transaktion mit COMMIT und ROLLBACK."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G03", titel: "Schlüssel, Kardinalitäten und Modellierungsphasen", teil: "Teil 1 + 2", prio: "Wichtig", h: 1, relevanz: "Grundlagen für jede Datenmodellierungsaufgabe: richtige Schlüssel, richtige Kardinalitäten und passende Datentypen.",
    kern: [
      ["Schlüsselarten", "Ein Superschlüssel identifiziert Datensätze eindeutig, ein Kandidatenschlüssel ist ein minimaler Superschlüssel. Einer davon wird Primärschlüssel, die übrigen heißen Alternativschlüssel. Ein Surrogatschlüssel ist eine künstliche ID ohne fachliche Bedeutung, ein zusammengesetzter Schlüssel besteht aus mehreren Attributen. Fremdschlüssel verweisen auf den Primärschlüssel einer anderen Tabelle."],
      ["Kardinalitäten lesen", "1:1 (Person – Personalausweis), 1:n (Kunde – Bestellung), m:n (Student – Kurs). In der Min-Max-Notation steht, wie oft eine Entität mindestens und höchstens an der Beziehung beteiligt ist, z. B. (0,n) oder (1,1)."],
      ["Krähenfuß-Notation", "Die Viele-Seite wird als dreizackiger Fuß gezeichnet, die Eins-Seite als Strich. Ein Kreis bedeutet optional (0), ein Strich Pflicht (1). Kunde ||——o< Bestellung heißt: Eine Bestellung gehört zu genau einem Kunden, ein Kunde hat keine bis viele Bestellungen."],
      ["Vom Sachverhalt zur Tabelle", "Anforderungsanalyse → konzeptionelles Modell (ER-Modell, unabhängig vom DBMS) → logisches Modell (Relationenmodell mit Tabellen und Schlüsseln) → physisches Modell (Datentypen, Indizes, Speicherung im konkreten DBMS)."],
      ["Drei-Ebenen-Architektur (ANSI/SPARC)", "Externe Ebene (Sichten der Anwender), konzeptionelle Ebene (Gesamtschema), interne Ebene (physische Speicherung). Ziel ist Datenunabhängigkeit: Änderungen an der Speicherung erfordern keine Änderung der Anwendungen."],
      ["Datentypen sinnvoll wählen", "INTEGER für Mengen, DECIMAL für Geldbeträge (keine Rundungsfehler wie bei FLOAT), CHAR oder VARCHAR für Texte, DATE oder TIMESTAMP für Zeitpunkte, BOOLEAN für Ja/Nein, BLOB für Binärdaten wie Bilder. Postleitzahlen und Telefonnummern sind Text, weil führende Nullen zählen."]
    ],
    fallen: ["Geldbeträge als FLOAT modelliert.", "Kardinalität an der falschen Seite der Linie notiert.", "Konzeptionelles und logisches Modell verwechselt.", "Surrogatschlüssel eingeführt, aber die fachliche Eindeutigkeit vergessen (z. B. doppelte E-Mail-Adresse)."],
    ziele: ["Ich unterscheide Primär-, Fremd-, Kandidaten- und Surrogatschlüssel.", "Ich lese Kardinalitäten in Min-Max- und Krähenfuß-Notation.", "Ich nenne die Phasen vom ER-Modell zur Tabelle.", "Ich wähle passende Datentypen."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G04", titel: "Datenbanksysteme, Transaktionen und NoSQL", teil: "Teil 1 + 2", prio: "Wichtig", h: 2, relevanz: "ACID, NoSQL und verteilte Datenhaltung kommen als Erläuterungs- und Entscheidungsfragen vor, oft im Zusammenhang mit der Datenbank aus der Situation.",
    kern: [
      ["ACID", "Atomarität: alles oder nichts. Konsistenz: Die Datenbank geht von einem gültigen in einen gültigen Zustand über. Isolation: Parallele Transaktionen beeinflussen sich nicht. Dauerhaftigkeit: Nach dem COMMIT bleiben Änderungen auch nach einem Absturz erhalten."],
      ["Probleme bei paralleler Verarbeitung", "Lost Update (eine Änderung überschreibt die andere), Dirty Read (Lesen nicht bestätigter Daten), Non-Repeatable Read und Phantome. Gegenmittel sind Sperren und Isolationsstufen; zu viele Sperren können zu Deadlocks führen."],
      ["Stored Procedure, Trigger, View", "Eine Stored Procedure ist gespeicherte SQL-Logik, die mit Parametern aufgerufen wird (weniger Netzlast, zentrale Logik, Schutz vor Injection). Ein Trigger startet automatisch bei INSERT, UPDATE oder DELETE, z. B. zur Protokollierung. Eine View ist eine gespeicherte Abfrage, die wie eine Tabelle genutzt wird und Spalten verbergen kann.", "CREATE VIEW KundenOhneMail AS\nSELECT KID, Name, Ort FROM Kunde;"],
      ["Replikation und Backup", "Replikation hält Kopien der Daten auf mehreren Servern synchron (Ausfallsicherheit, Lastverteilung). Sie ersetzt kein Backup, denn ein versehentliches DELETE wird mitrepliziert."],
      ["NoSQL-Typen", "Key-Value (z. B. Redis: Cache, Sitzungen), dokumentenorientiert (z. B. MongoDB: JSON-Dokumente mit wechselnder Struktur), spaltenorientiert bzw. Wide Column (z. B. Cassandra: riesige Datenmengen, Zeitreihen), Graph (z. B. Neo4j: Beziehungen, soziale Netze, Empfehlungen)."],
      ["CAP und BASE", "Ein verteiltes System kann bei einer Netzwerkpartition nicht gleichzeitig Konsistenz und Verfügbarkeit garantieren; es muss zwischen C und A wählen, Partitionstoleranz ist Pflicht. BASE (Basically Available, Soft State, Eventual Consistency) setzt auf Verfügbarkeit und nimmt in Kauf, dass Daten erst nach kurzer Zeit überall gleich sind."],
      ["Big Data, Data Warehouse, Data Lake", "Big Data: Volume, Velocity, Variety, oft ergänzt um Veracity und Value. Ein Data Warehouse speichert aufbereitete, strukturierte Daten für Auswertungen und wird per ETL (Extract, Transform, Load) befüllt. Ein Data Lake speichert Rohdaten jeder Art und strukturiert erst beim Lesen."]
    ],
    fallen: ["ACID-Buchstaben nur genannt, nicht am Beispiel erklärt.", "Replikation als Backup bezeichnet.", "NoSQL pauschal als „schneller“ begründet statt mit Datenstruktur und Skalierung.", "CAP so erklärt, als könne man Partitionstoleranz weglassen."],
    ziele: ["Ich erkläre ACID an einer Überweisung.", "Ich unterscheide Trigger, Stored Procedure und View.", "Ich ordne die vier NoSQL-Typen Anwendungsfällen zu.", "Ich erkläre CAP und BASE in zwei Sätzen."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G05", titel: "Struktur- und Verteilungsdiagramme", teil: "Teil 1 + 2", prio: "Wichtig", h: 1, relevanz: "Neben den Verhaltensdiagrammen werden Klassen-, Komponenten- und Verteilungsdiagramme gelesen oder ergänzt.",
    kern: [
      ["Komponentendiagramm", "Zeigt die großen Bausteine eines Systems (z. B. Web-Frontend, Bestellservice, Datenbank) und ihre Schnittstellen. Bereitgestellte Schnittstellen werden als Kreis (Lollipop), benötigte als Halbkreis (Socket) gezeichnet."],
      ["Verteilungsdiagramm", "Zeigt, auf welcher Hardware oder Laufzeitumgebung (Knoten, als Quader gezeichnet) welche Software-Artefakte laufen und wie die Knoten verbunden sind, z. B. Browser – Webserver – Datenbankserver mit dem Protokoll an der Verbindung."],
      ["Klassendiagramm im Detail", "Statische Attribute und Methoden werden unterstrichen, abstrakte Klassen und Methoden kursiv oder mit {abstract} markiert. Interfaces tragen «interface». Die Realisierung wird gestrichelt mit hohlem Dreieck gezeichnet, die Vererbung durchgezogen mit hohlem Dreieck.", "Kunde\n- kundennr : int\n- name : String\n+ anzahlKunden : int      (unterstrichen = static)\n+ getName() : String"],
      ["Welches Diagramm wofür?", "Struktur: Klassen-, Komponenten-, Verteilungs- und Objektdiagramm. Verhalten: Anwendungsfall-, Aktivitäts- und Zustandsdiagramm. Interaktion: Sequenzdiagramm. Meist nennt die Aufgabe das Diagramm ausdrücklich; lies Operator und Situation genau."]
    ],
    fallen: ["Realisierung eines Interfaces mit durchgezogener Linie gezeichnet.", "Im Verteilungsdiagramm Klassen statt Knoten und Artefakte gezeichnet.", "Statische Elemente nicht kenntlich gemacht."],
    ziele: ["Ich zeichne ein einfaches Verteilungsdiagramm.", "Ich erkenne bereitgestellte und benötigte Schnittstellen.", "Ich ordne jedem Diagrammtyp seinen Zweck zu."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G06", titel: "Testprozess und Qualitätsmanagement", teil: "Teil 1 + 2", prio: "Wichtig", h: 1, relevanz: "Teststufen, Testkonzept und Qualitätssicherung werden in Planen regelmäßig als Erläuterungsfragen gestellt.",
    kern: [
      ["Teststufen", "Modultest (einzelne Einheit, Entwickler), Integrationstest (Zusammenspiel von Komponenten und Schnittstellen), Systemtest (Gesamtsystem gegen die Anforderungen, Testumgebung), Abnahmetest (durch den Auftraggeber gegen den Vertrag, Grundlage für das Abnahmeprotokoll)."],
      ["Testkonzept", "Legt fest: Testobjekte und Umfang, Teststufen und Methoden, Testdaten, Testumgebung, Verantwortliche, Zeitplan, Eingangs- und Endekriterien (z. B. keine offenen kritischen Fehler) und die Dokumentation der Ergebnisse."],
      ["Weitere Testarten", "Smoke-Test (schneller Grundcheck nach einem Build), Regressionstest (bestehende Funktionen nach Änderungen erneut prüfen), Lasttest, Usability-Test, explorativer Test (erfahrungsbasiert ohne festes Drehbuch), Grey-Box-Test (Teilkenntnis des Codes)."],
      ["Statische Prüfungen", "Reviews, Walkthroughs und Inspektionen prüfen Code oder Dokumente ohne Ausführung. Statische Codeanalyse findet automatisch Regelverstöße, ungenutzte Variablen oder potenzielle Fehler. Pair Programming ist ein laufendes Review (Driver und Navigator)."],
      ["Kontinuierlicher Verbesserungsprozess", "KVP verbessert Produkte und Prozesse in kleinen Schritten nach dem PDCA-Zyklus von Deming: Plan (Ziel und Maßnahme planen), Do (im Kleinen umsetzen), Check (Wirkung messen), Act (bei Erfolg als Standard übernehmen, sonst anpassen). In Scrum entspricht die Retrospektive diesem Gedanken."]
    ],
    fallen: ["Systemtest und Abnahmetest verwechselt (wer testet, wogegen?).", "Regressionstest mit Integrationstest verwechselt.", "PDCA-Phasen in falscher Reihenfolge."],
    ziele: ["Ich ordne Teststufen Zweck und Verantwortlichen zu.", "Ich nenne Inhalte eines Testkonzepts.", "Ich erkläre den PDCA-Zyklus an einem Beispiel."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G07", titel: "Vorgehensmodelle im Vergleich", teil: "Teil 1", prio: "Wichtig", h: 1, relevanz: "Die Wahl eines Vorgehensmodells musst du in Planen oft für die Situation begründen.",
    kern: [
      ["Wasserfall", "Phasen nacheinander: Analyse, Entwurf, Implementierung, Test, Einführung, Wartung. Gut planbar und dokumentiert, aber späte Änderungen sind teuer. Geeignet bei stabilen, klaren Anforderungen."],
      ["V-Modell", "Jeder Entwicklungsphase steht eine Teststufe gegenüber: Anforderungsdefinition ↔ Abnahmetest, Systementwurf ↔ Systemtest, Architektur- bzw. Komponentenentwurf ↔ Integrationstest, Modulentwurf ↔ Modultest. Das V-Modell XT ist der Standard für IT-Projekte des Bundes."],
      ["Spiralmodell", "Iteratives Modell mit Fokus auf Risiken: Jede Windung durchläuft Ziele festlegen, Risiken analysieren (oft mit Prototyp), entwickeln und testen, nächste Runde planen."],
      ["Scrum, XP und Kanban", "Scrum arbeitet in Sprints mit festen Rollen (Product Owner, Scrum Master, Developers), Events und Artefakten. Extreme Programming setzt auf Technikpraktiken wie Pair Programming, TDD, kontinuierliche Integration und kurze Releases. Kanban visualisiert den Arbeitsfluss auf einem Board und begrenzt die Arbeit in Bearbeitung (WIP-Limit), ohne feste Iterationen."],
      ["Make or Buy", "Eigenentwicklung passt genau und bleibt unter eigener Kontrolle, kostet aber Zeit und Know-how. Fremdbezug (Standardsoftware oder Auftrag an einen Dienstleister) ist schneller verfügbar und oft günstiger, schafft aber Abhängigkeiten und passt nicht immer zu den Prozessen. Entscheidungshilfe: Nutzwertanalyse oder Kostenvergleich."]
    ],
    fallen: ["Vorgehensmodell gewählt, ohne es mit der Situation zu begründen.", "Kanban mit festen Sprints beschrieben.", "Im V-Modell Entwurfs- und Teststufen falsch gegenübergestellt."],
    ziele: ["Ich wähle ein Vorgehensmodell passend zur Situation und begründe es.", "Ich ordne im V-Modell Entwurfs- und Teststufen zu.", "Ich unterscheide Scrum, XP und Kanban."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G08", titel: "Angriffe, Kryptografie und DSGVO im Detail", teil: "Teil 1", prio: "Wichtig", h: 2, relevanz: "IT-Sicherheit und Datenschutz kommen in fast jeder Planen-Prüfung vor, häufig als Erläuterung von Maßnahmen für die Situation.",
    kern: [
      ["Schadsoftware und Angriffe", "Virus (hängt sich an Dateien, braucht Ausführung), Wurm (verbreitet sich selbst über Netze), Trojaner (getarnt als nützliches Programm), Ransomware (verschlüsselt Daten und erpresst Lösegeld), Spyware. Social Engineering nutzt den Menschen aus, z. B. Phishing, Pretexting oder Tailgating."],
      ["Hash, Salt und Pepper", "Ein Hash ist eine Einwegfunktion mit fester Ausgabelänge. Passwörter speichert man mit einem langsamen Verfahren wie bcrypt, scrypt oder Argon2 und einem zufälligen Salt pro Benutzer, damit gleiche Passwörter unterschiedliche Hashes ergeben und Rainbow Tables nutzlos werden. MD5 und SHA-1 gelten als unsicher."],
      ["Signatur und Zertifikat", "Signieren: Hash des Dokuments mit dem privaten Schlüssel des Absenders verschlüsseln. Prüfen: mit dem öffentlichen Schlüssel entschlüsseln und mit dem selbst berechneten Hash vergleichen. Ein Zertifikat bindet einen öffentlichen Schlüssel an eine Identität und ist von einer Zertifizierungsstelle (CA) signiert."],
      ["Erweiterte Schutzziele", "Neben Vertraulichkeit, Integrität und Verfügbarkeit: Authentizität (Echtheit der Quelle) und Nichtabstreitbarkeit (der Absender kann nicht leugnen, z. B. durch eine Signatur)."],
      ["Grundsätze der DSGVO (Art. 5)", "Rechtmäßigkeit und Transparenz, Zweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung, Integrität und Vertraulichkeit sowie Rechenschaftspflicht."],
      ["Pflichten des Unternehmens", "Verzeichnis von Verarbeitungstätigkeiten, technische und organisatorische Maßnahmen, Auftragsverarbeitungsvertrag mit Dienstleistern, Meldung von Datenpannen an die Aufsichtsbehörde möglichst binnen 72 Stunden, Datenschutz durch Technikgestaltung und datenschutzfreundliche Voreinstellungen (Privacy by Design und by Default)."],
      ["Sicherheitsmanagement", "BSI IT-Grundschutz und ISO/IEC 27001 beschreiben, wie ein Informationssicherheits-Managementsystem (ISMS) aufgebaut wird. Dazu gehören Risikoanalyse, Sicherheitsrichtlinien, Awareness-Schulungen und ein Notfallmanagement."],
      ["Backup oder Archivierung", "Ein Backup ist eine Kopie zur Wiederherstellung nach Datenverlust (3-2-1-Regel: drei Kopien, zwei Medien, eine außer Haus). Eine Archivierung bewahrt Daten unveränderbar und langfristig auf, oft wegen gesetzlicher Aufbewahrungsfristen (z. B. HGB, AO)."]
    ],
    fallen: ["Hashen und Verschlüsseln gleichgesetzt.", "Signatur mit dem öffentlichen Schlüssel erstellt.", "Bei den DSGVO-Rechten nur „Löschung“ genannt.", "Replikation oder RAID als Backup bezeichnet."],
    ziele: ["Ich erkläre Salt und Hash beim Speichern von Passwörtern.", "Ich beschreibe den Ablauf einer digitalen Signatur.", "Ich nenne Grundsätze, Rechte und Pflichten der DSGVO.", "Ich unterscheide Backup und Archivierung."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G09", titel: "Weitere Entwurfsmuster und OOP-Details", teil: "Teil 1 + 2", prio: "Wichtig", h: 1.5, relevanz: "Entwurfsmuster werden meist so geprüft: Situation lesen, passendes Muster wählen und begründen, manchmal als Klassendiagramm skizzieren.",
    kern: [
      ["Adapter", "Strukturmuster: macht eine vorhandene Klasse mit inkompatibler Schnittstelle nutzbar, indem ein Adapter die erwartete Schnittstelle anbietet und Aufrufe übersetzt. Beispiel: Altsystem an ein neues Bezahl-Interface anbinden."],
      ["Strategy", "Verhaltensmuster: kapselt austauschbare Algorithmen hinter einem gemeinsamen Interface. Beispiel: Versandkosten nach Standard, Express oder Abholung berechnen; die Strategie wird zur Laufzeit gesetzt.", "interface Versandstrategie {\n  double kosten(Bestellung b);\n}\nclass Express implements Versandstrategie { ... }\nbestellung.setStrategie(new Express());"],
      ["Decorator", "Strukturmuster: erweitert ein Objekt zur Laufzeit um Funktionen, indem es in ein Objekt mit gleicher Schnittstelle eingepackt wird. Beispiel: Datenstrom mit Puffer und Verschlüsselung umhüllen."],
      ["Iterator und Template Method", "Iterator: einheitlicher Durchlauf durch eine Sammlung, ohne deren innere Struktur zu kennen (hasNext, next). Template Method: Eine Oberklasse legt den Ablauf eines Algorithmus fest, Unterklassen überschreiben einzelne Schritte."],
      ["Registry und Singleton", "Eine Registry ist eine zentrale Stelle, bei der Objekte unter einem Namen registriert und abgefragt werden. Wie beim Singleton entsteht globaler Zustand; das erschwert Tests und erzeugt versteckte Abhängigkeiten."],
      ["Statische Elemente und Konstruktoren", "Statische Attribute gehören zur Klasse und existieren einmal für alle Objekte (z. B. ein Zähler); statische Methoden werden ohne Objekt aufgerufen. Ein Konstruktor initialisiert ein neues Objekt; überladene Konstruktoren unterscheiden sich in der Parameterliste.", "class Kunde {\n  private static int anzahl = 0;\n  private String name;\n  public Kunde(String name) {\n    this.name = name;\n    anzahl++;\n  }\n}"],
      ["Generics", "Generische Klassen arbeiten mit Typparametern, z. B. List<Kunde>. Der Compiler prüft die Typen, Casts entfallen und der Code ist wiederverwendbar."]
    ],
    fallen: ["Adapter und Decorator verwechselt (übersetzen oder erweitern).", "Strategy ohne gemeinsames Interface beschrieben.", "Statische Methode greift auf Instanzattribute zu."],
    ziele: ["Ich ordne Adapter, Strategy, Decorator, Iterator und Template Method einer Situation zu.", "Ich erkläre statische und Instanzelemente.", "Ich begründe den Einsatz von Generics."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G10", titel: "Web-Technologien, XML und Web-Sicherheit", teil: "Teil 1", prio: "Wichtig", h: 2, relevanz: "Schnittstellen, Datenformate und Web-Sicherheit stehen im Prüfungskatalog und tauchen als Kurz- und Erläuterungsfragen auf.",
    kern: [
      ["HTTP-Methoden genauer", "GET liest und ist sicher und idempotent. POST legt an und ist nicht idempotent. PUT ersetzt eine Ressource vollständig (idempotent), PATCH ändert teilweise, DELETE löscht (idempotent). HEAD liefert nur Header, OPTIONS fragt erlaubte Methoden ab (z. B. CORS-Preflight)."],
      ["Statuscodes nach Klassen", "1xx Information, 2xx Erfolg (200 OK, 201 Created, 204 No Content), 3xx Umleitung (301 Moved Permanently, 304 Not Modified), 4xx Clientfehler (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found), 5xx Serverfehler (500 Internal Server Error, 503 Service Unavailable, 504 Gateway Timeout)."],
      ["SOAP, WSDL und SOA", "SOAP ist ein XML-basiertes Protokoll mit Envelope, Header und Body; die Schnittstelle wird in WSDL beschrieben. SOA (serviceorientierte Architektur) baut Systeme aus lose gekoppelten Diensten, oft über einen Enterprise Service Bus. REST ist leichter, nutzt HTTP direkt und meist JSON."],
      ["XML-Werkzeuge", "Wohlgeformt: Syntaxregeln eingehalten (ein Wurzelelement, korrekt geschachtelt, Tags geschlossen). Gültig: zusätzlich passend zu einer DTD oder einem XML Schema (XSD, mit Datentypen). XSLT transformiert XML in andere Formate, XPath adressiert Knoten. DOM lädt das ganze Dokument als Baum, SAX liest ereignisbasiert und speicherschonend."],
      ["AJAX, SPA und PWA", "AJAX lädt Daten asynchron nach, ohne die Seite neu zu laden (heute meist fetch mit JSON). Eine Single Page Application lädt einmal und baut Inhalte per JavaScript um. Eine Progressive Web App ist installierbar, offlinefähig (Service Worker) und kann Push-Benachrichtigungen senden."],
      ["Native, Cross-Platform, hybrid oder Web-App", "Native Apps nutzen Plattform-SDKs (Kotlin, Swift): beste Performance und voller Gerätezugriff, aber pro Plattform entwickelt. Cross-Platform-Frameworks (z. B. Flutter, React Native, .NET MAUI) teilen den Code. Hybride Apps zeigen Webinhalte in einem nativen Container. Web-Apps laufen im Browser ohne Installation."],
      ["Angriffe auf Webanwendungen", "XSS: Angreifer schleust ein Skript ein, das im Browser anderer Nutzer läuft (Schutz: Ausgabe kodieren, Content Security Policy). CSRF: Eine fremde Seite löst Aktionen mit der Sitzung des Opfers aus (Schutz: CSRF-Token, SameSite-Cookies). Session Hijacking: Übernahme der Sitzungs-ID (Schutz: HTTPS, HttpOnly- und Secure-Cookies, neue ID nach dem Login)."],
      ["Web 2.0 und 3.0", "Web 2.0 steht für nutzergenerierte Inhalte und Interaktion (soziale Netzwerke, Wikis, Blogs). Web 3.0 meint das semantische Web mit maschinenlesbaren Bedeutungen (RDF, OWL) und wird auch für dezentrale, blockchainbasierte Ansätze verwendet."]
    ],
    fallen: ["401 und 403 verwechselt.", "Wohlgeformt und gültig gleichgesetzt.", "XSS und SQL-Injection verwechselt.", "Bei der App-Wahl nicht mit der Situation begründet (Gerätezugriff, Budget, Plattformen)."],
    ziele: ["Ich nenne Methoden und Statuscodes passend zur Situation.", "Ich unterscheide REST und SOAP.", "Ich erkläre XSS, CSRF und Session Hijacking samt Schutz.", "Ich wähle native App, Cross-Platform oder PWA begründet."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G11", titel: "Programmiersprachen und Paradigmen", teil: "Teil 1 + 2", prio: "Wichtig", h: 2, relevanz: "Sprachen, Paradigmen, Übersetzung und Fehlerbehandlung werden in Planen als Kurzfragen geprüft und helfen beim Pseudocode in Algorithmen.",
    kern: [
      ["Paradigmen", "Imperativ bzw. prozedural: Anweisungen nacheinander, Prozeduren (C, Pascal). Objektorientiert: Objekte mit Zustand und Verhalten (Java, C#). Funktional: Funktionen ohne Seiteneffekte, unveränderliche Daten (Haskell, F#, Teile von Java und JavaScript). Logisch bzw. deklarativ: Fakten und Regeln beschreiben, was gilt (Prolog); auch SQL ist deklarativ."],
      ["Typisierung", "Statisch: Typen werden beim Kompilieren geprüft (Java, C#). Dynamisch: zur Laufzeit (Python, JavaScript). Stark: wenig automatische Umwandlung (Python: \"3\" + 3 ist ein Fehler). Schwach: viel implizite Umwandlung (JavaScript: \"3\" + 3 ergibt \"33\")."],
      ["Compiler, Interpreter, JIT", "Ein Compiler übersetzt den ganzen Quellcode vorab in Maschinencode (schnell, plattformabhängig). Ein Interpreter führt den Code zur Laufzeit Anweisung für Anweisung aus (flexibel, langsamer). Java und C# kompilieren in Bytecode bzw. IL, der in einer virtuellen Maschine läuft und per Just-in-Time-Compiler zur Laufzeit in Maschinencode übersetzt wird."],
      ["Sprachgenerationen und DSL", "1GL Maschinencode, 2GL Assembler, 3GL höhere Sprachen (C, Java), 4GL deklarative, problemorientierte Sprachen (SQL). Domänenspezifische Sprachen (DSL) sind auf ein Fachgebiet zugeschnitten, z. B. SQL, HTML, CSS, reguläre Ausdrücke; General Purpose Languages sind universell."],
      ["Funktionale Konzepte", "Pure Funktionen liefern bei gleicher Eingabe immer dasselbe Ergebnis ohne Seiteneffekte. Higher-Order Functions nehmen Funktionen als Parameter oder geben sie zurück. Lambdas sind anonyme Funktionen. Map wandelt jedes Element um, Filter wählt aus, Reduce fasst zusammen.", "List<Double> brutto = netto.stream()\n  .filter(p -> p > 0)\n  .map(p -> p * 1.19)\n  .collect(Collectors.toList());"],
      ["Synchron, asynchron, parallel", "Synchron: Der Aufrufer wartet auf das Ergebnis (blockiert). Asynchron: Die Anfrage läuft im Hintergrund, das Ergebnis kommt per Callback, Promise oder async/await; die Oberfläche bleibt bedienbar. Parallel: Aufgaben laufen wirklich gleichzeitig auf mehreren Kernen; Gefahr von Race Conditions und Deadlocks, daher Synchronisation."],
      ["Fehlerbehandlung", "Syntaxfehler findet der Compiler, Laufzeitfehler (Exceptions) treten beim Ausführen auf, logische Fehler liefern falsche Ergebnisse ohne Absturz. Exceptions fängt man mit try-catch-finally. Programme melden über Exit-Codes ihren Erfolg (0 = erfolgreich, sonst Fehler). Der Debugger hält an Breakpoints an und zeigt Variablenwerte.", "try {\n  int menge = Integer.parseInt(eingabe);\n} catch (NumberFormatException e) {\n  zeigeFehler(\"Bitte eine ganze Zahl eingeben.\");\n} finally {\n  log.schliessen();\n}"],
      ["IDE, Bibliothek, Framework, Low-Code", "Eine IDE bündelt Editor, Compiler, Debugger und Versionsverwaltung. Eine Bibliothek wird von deinem Code aufgerufen; ein Framework gibt die Struktur vor und ruft deinen Code auf (Inversion of Control, Hollywood-Prinzip). Low-Code- und No-Code-Plattformen erstellen Anwendungen grafisch, schnell, aber mit Vendor-Lock-in und Grenzen bei Spezialfällen. Wiederkehrende Abläufe automatisiert man mit Skripten und Zeitplänen (cron, Aufgabenplanung)."]
    ],
    fallen: ["Statisch/dynamisch mit stark/schwach typisiert verwechselt.", "Java als rein interpretierte Sprache bezeichnet.", "Bibliothek und Framework ohne Inversion of Control unterschieden.", "Exit-Code 0 als Fehler gedeutet."],
    ziele: ["Ich ordne Sprachen Paradigmen und Typisierung zu.", "Ich erkläre Compiler, Interpreter und JIT.", "Ich unterscheide synchron, asynchron und parallel.", "Ich schreibe try-catch und nenne die Fehlerarten."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G12", titel: "Softwarearchitektur, Cloud und Versionsverwaltung", teil: "Teil 1", prio: "Wichtig", h: 2, relevanz: "Architekturentscheidungen, Cloud-Modelle und Git kommen in Planen als Begründungs- und Vergleichsfragen vor.",
    kern: [
      ["Architekturstile", "Monolith: eine Anwendung, ein Deployment; einfach am Anfang, schwer zu skalieren. Schichtenarchitektur: Präsentation, Logik und Datenhaltung mit klaren Zuständigkeiten. Microservices: kleine, unabhängig deploybare Dienste mit eigener Datenhaltung, die über APIs kommunizieren; flexibel und skalierbar, aber aufwendiger im Betrieb."],
      ["Weitere Muster", "MVC trennt Model, View und Controller; MVVM bindet die View per Datenbindung an ein ViewModel. Pipes and Filters verarbeitet Daten in Stufen (z. B. ETL). SOA verbindet Dienste über standardisierte Schnittstellen, oft mit einem Enterprise Service Bus."],
      ["Entwurfsrichtung und Modularisierung", "Top-down zerlegt das Gesamtsystem schrittweise in Teile, Bottom-up setzt fertige Bausteine zusammen; in der Praxis kombiniert man beides. Module sollen hohe Kohäsion (eine klare Aufgabe) und lose Kopplung (wenige Abhängigkeiten) haben."],
      ["Cloud-Servicemodelle", "IaaS: virtuelle Server, Netz und Speicher; Betriebssystem und Software verwaltet der Kunde. PaaS: Laufzeitumgebung und Datenbank als Dienst; der Kunde bringt nur die Anwendung. SaaS: fertige Software im Browser (z. B. Office 365, CRM). FaaS bzw. Serverless: einzelne Funktionen laufen ereignisgesteuert und werden pro Aufruf abgerechnet. On-Premises: alles im eigenen Rechenzentrum."],
      ["Container", "Docker verpackt eine Anwendung mit allen Abhängigkeiten in ein Image; Container teilen sich den Kernel des Hosts und starten schneller als virtuelle Maschinen. Kubernetes orchestriert viele Container: Verteilung, Skalierung und Neustart bei Ausfall."],
      ["Versionsverwaltung", "Zentral (z. B. Subversion): ein Server mit dem Repository, ohne Verbindung kaum Arbeit möglich. Verteilt (z. B. Git): Jeder hat das komplette Repository mit Historie. Begriffe: Commit, Branch, Merge, Konflikt, Tag (Release), Pull und Push, Pull Request für Code-Reviews.", "git switch -c feature/rabatt\ngit add .\ngit commit -m \"Rabattberechnung ergänzt\"\ngit push origin feature/rabatt"],
      ["Branching-Strategien", "Feature-Branch: jede Funktion in einem eigenen Branch, Merge per Pull Request. Git-Flow: feste Branches main, develop, feature, release und hotfix. Trunk-based Development: Alle integrieren sehr häufig in den Hauptzweig, unfertige Funktionen stehen hinter Feature-Toggles."],
      ["CI/CD", "Continuous Integration: Jeder Commit wird automatisch gebaut und getestet. Continuous Delivery: Jede getestete Version ist auslieferbar, die Freigabe erfolgt per Knopfdruck. Continuous Deployment: Die Auslieferung bis in die Produktion erfolgt automatisch."]
    ],
    fallen: ["IaaS, PaaS und SaaS über die Verantwortung falsch abgegrenzt.", "Container und virtuelle Maschine gleichgesetzt.", "Merge-Konflikt als Systemfehler statt als parallele Änderung erklärt.", "Continuous Delivery und Continuous Deployment verwechselt."],
    ziele: ["Ich vergleiche Monolith und Microservices mit Vor- und Nachteilen.", "Ich ordne IaaS, PaaS, SaaS und FaaS Beispielen zu.", "Ich erkläre Branch, Merge und Pull Request.", "Ich unterscheide CI, Continuous Delivery und Continuous Deployment."], decks: [], ueb: [], quiz: null, alt: "" },
  { id: "G13", titel: "Software-Ergonomie, Recht und Softwarearten", teil: "Teil 1", prio: "Wichtig", h: 1.5, relevanz: "Dialoggrundsätze, Lizenzen und Softwarearten sind typische 2- bis 6-Punkte-Fragen in Planen, immer mit Bezug zur Situation.",
    kern: [
      ["Usability und User Experience", "Usability beschreibt, wie effektiv, effizient und zufriedenstellend Nutzer ihre Ziele erreichen (DIN EN ISO 9241-11). User Experience umfasst das gesamte Erleben vor, während und nach der Nutzung, auch Emotionen und Erwartungen."],
      ["Grundsätze der Dialoggestaltung (ISO 9241-110)", "Aufgabenangemessenheit, Selbstbeschreibungsfähigkeit, Erwartungskonformität, Lernförderlichkeit, Steuerbarkeit, Fehlertoleranz, Individualisierbarkeit. In der Fassung von 2020 heißen sie teils anders (Erlernbarkeit, Robustheit gegen Benutzungsfehler), und Individualisierbarkeit wurde durch Benutzerbindung ersetzt. In der Prüfung jeden Grundsatz mit einem Beispiel aus der Situation belegen."],
      ["Bedienelemente richtig wählen", "Radiobuttons für genau eine Auswahl aus wenigen Optionen, Checkboxen für mehrere unabhängige Optionen, Dropdown für eine Auswahl aus vielen Einträgen, Textfeld für freie Eingaben (mit Validierung), Buttons für Aktionen mit eindeutiger Beschriftung."],
      ["Lizenzen", "Open Source: Quellcode offen; Nutzung, Änderung und Weitergabe erlaubt. Copyleft (GPL): Weitergegebene Änderungen müssen unter derselben Lizenz stehen. Schwaches Copyleft (LGPL): Die Bibliothek darf auch in proprietärer Software genutzt werden. Freizügig (MIT, Apache): nahezu frei nutzbar, Lizenzhinweis behalten. Proprietär: Nutzung nach Vertrag, z. B. Kauf, Abo, pro Nutzer oder gleichzeitige Nutzung (Concurrent Use)."],
      ["Rechtsaspekte", "Das Urheberrecht schützt Software als Werk; bei Software aus dem Arbeitsverhältnis erhält der Arbeitgeber die Nutzungsrechte (§ 69b UrhG). Namens- und Markenrecht betreffen Produkt- und Domainnamen. Das Persönlichkeitsrecht schützt z. B. das Recht am eigenen Bild. Das Wettbewerbsrecht (UWG) verbietet irreführende Werbung und unlautere Methoden."],
      ["Softwarearten", "Standardsoftware für viele Kunden, Individualsoftware für einen Auftraggeber. ERP (Ressourcen und Geschäftsprozesse), CRM (Kundenbeziehungen), SCM (Lieferkette), CMS (Webinhalte), DMS (Dokumente), CAD (Konstruktion), Branchensoftware für spezielle Branchen."],
      ["Dokumentation", "Technische Dokumentation richtet sich an Entwicklung und Betrieb (Architektur, Schnittstellen, Installation, Code-Kommentare), Benutzerdokumentation an Anwender (Handbuch, Online-Hilfe, Schulungsunterlagen). Entscheidend ist die Zielgruppe."]
    ],
    fallen: ["Dialoggrundsatz nur genannt, ohne Beispiel aus der Situation.", "GPL und LGPL verwechselt.", "Benutzerdokumentation mit Fachbegriffen der Entwickler geschrieben."],
    ziele: ["Ich nenne die Dialoggrundsätze mit Beispiel.", "Ich wähle passende Bedienelemente.", "Ich unterscheide GPL, LGPL, MIT und proprietäre Lizenzen.", "Ich ordne ERP, CRM, CMS und DMS zu."], decks: [], ueb: [], quiz: null, alt: "" }
);

  function rTopic(el, t) {
