    ["Ein Rechenzentrum zahlt für seine CO₂-Emissionen einen Preis pro Tonne.\n\nErklären Sie das Verursacherprinzip und grenzen Sie es vom Gemeinlastprinzip ab. (3 P)", "Verursacherprinzip: Wer Umweltbelastungen verursacht, trägt die Kosten für Vermeidung oder Beseitigung – z. B. CO₂-Preis, Abwassergebühren.\nGemeinlastprinzip: Die Allgemeinheit trägt die Kosten über Steuern, wenn der Verursacher nicht feststellbar ist.", "2 P Verursacherprinzip mit Beispiel, 1 P Abgrenzung."],
    ["Ein IT-Unternehmen entsorgt jährlich viele alte Notebooks. Es möchte sich an der Abfallhierarchie orientieren.\n\nNennen Sie die fünf Stufen der Abfallhierarchie und ordnen Sie Maßnahmen für die Notebooks zu. (5 P)", "1. Vermeidung – Geräte länger nutzen, reparieren statt neu kaufen\n2. Vorbereitung zur Wiederverwendung – aufbereiten und spenden oder verkaufen\n3. Recycling – Rohstoffe wie Kupfer und Gold zurückgewinnen\n4. Sonstige Verwertung, z. B. energetisch\n5. Beseitigung", "Je 1 P pro Stufe in richtiger Reihenfolge (Kreislaufwirtschaftsgesetz)."],
    ["Im Büro werden Altpapier, Tonerkartuschen und Elektroschrott getrennt gesammelt.\n\nErklären Sie Recycling und grenzen Sie es von der Wiederverwendung ab. (3 P)", "Recycling: Abfälle werden zu Rohstoffen für neue Produkte aufbereitet, z. B. Altpapier zu Recyclingpapier.\nWiederverwendung: Ein Produkt wird erneut für denselben Zweck genutzt, z. B. Tonerkartusche wird wiederbefüllt.\nWiederverwendung steht in der Abfallhierarchie über dem Recycling.", "Je 1 P."],
    ["Die Beschaffung soll umweltfreundliche Monitore und Papier einkaufen.\n\nErklären Sie das Umweltzeichen „Blauer Engel“. (2 P)", "Staatliches deutsches Umweltzeichen (vom Bundesumweltministerium).\nEs kennzeichnet Produkte, die umweltfreundlicher sind als vergleichbare Produkte, z. B. Recyclingpapier oder energiesparende Bildschirme.", "Je 1 P."],
    ["Ein Unternehmen will einen Nachhaltigkeitsbericht veröffentlichen.\n\nNennen Sie die drei Säulen der Nachhaltigkeit mit je einem Beispiel und definieren Sie Nachhaltigkeit. (4 P)", "Ökologie: Energieverbrauch und Emissionen senken\nÖkonomie: dauerhaft wirtschaftlich erfolgreich sein\nSoziales: faire Arbeitsbedingungen, Weiterbildung\nNachhaltigkeit: Bedürfnisse der heutigen Generation erfüllen, ohne die Möglichkeiten künftiger Generationen einzuschränken.", "Je 1 P pro Säule mit Beispiel, 1 P Definition."],
    ["Ein Rechenzentrumsbetreiber möchte „grüner“ werden.\n\nErklären Sie den Begriff Green IT und nennen Sie vier Maßnahmen. (5 P)", "Green IT: energie- und ressourcenschonender Einsatz von IT über den gesamten Lebenszyklus (Herstellung, Nutzung, Entsorgung).\nMaßnahmen: energieeffiziente Hardware, Virtualisierung und Serverkonsolidierung, Abwärmenutzung und Ökostrom, längere Nutzungsdauer, fachgerechtes Recycling.", "1 P Definition, je 1 P pro Maßnahme."],
    ["Ein Softwarehaus unterzeichnet die „Charta der Vielfalt“.\n\nBeschreiben Sie die Charta und nennen Sie zwei Vorteile von Diversity Management. (3 P)", "Die Charta der Vielfalt ist eine Selbstverpflichtung von Unternehmen zu einem vorurteilsfreien Arbeitsumfeld, in dem Vielfalt wertgeschätzt wird.\nVorteile: unterschiedliche Perspektiven verbessern Ideen und Produkte; größere Attraktivität für Fachkräfte; besseres Verständnis vielfältiger Kunden.", "1 P Beschreibung, je 1 P pro Vorteil."],
    ["Ein Vertriebsmitarbeiter bekommt von einem Lieferanten eine teure Uhr geschenkt, kurz bevor über einen Großauftrag entschieden wird.\n\nErklären Sie Compliance und beurteilen Sie die Situation. (3 P)", "Compliance: Einhaltung von Gesetzen und unternehmensinternen Regeln (Verhaltenskodex), z. B. gegen Korruption, Datenschutz- oder Kartellverstöße.\nBeurteilung: Das Geschenk kann die Auftragsvergabe beeinflussen – Korruptionsgefahr. Er muss es nach den internen Regeln ablehnen bzw. melden.", "1 P Definition, 2 P Beurteilung."]
  ]
};


const SQL_SCHEMA = "Kunde (KID [PK], Name, Ort, Email)\nArtikel (ArtNr [PK], Bezeichnung, Kategorie, Preis)\nBestellung (BID [PK], KID [FK → Kunde], Datum, Status)\nPosition (BID [PK, FK → Bestellung], ArtNr [PK, FK → Artikel], Menge)";

const UEB = [
  { id: "P1", teil: "Teil 2", thema: "Pseudocode", titel: "Messwerte auswerten", max: 15, min: 20,
    text: "Ein Sensor liefert Messwerte in einem eindimensionalen Array werte: Double[].\n\nEntwickeln Sie in Pseudocode die Methode\n  auswerten(werte: Double[], grenze: Double) : Auswertung\n\nSie soll ein Objekt der Klasse Auswertung zurückgeben mit\n- dem Durchschnitt aller Werte,\n- der Anzahl der Werte, die größer als grenze sind,\n- dem größten Wert und seinem Index.\n\nKonstruktor: Auswertung(durchschnitt: Double, anzahlUeber: Integer, maxWert: Double, maxIndex: Integer)\nIst das Array leer, wird null zurückgegeben.",
    loesung: "auswerten(werte: Double[], grenze: Double) : Auswertung\n  wenn werte.length == 0 dann\n    Rückgabe null\n  ende wenn\n  summe = 0.0\n  anzahlUeber = 0\n  maxWert = werte[0]\n  maxIndex = 0\n  für i = 0 bis werte.length - 1\n    summe = summe + werte[i]\n    wenn werte[i] > grenze dann\n      anzahlUeber = anzahlUeber + 1\n    ende wenn\n    wenn werte[i] > maxWert dann\n      maxWert = werte[i]\n      maxIndex = i\n    ende wenn\n  ende für\n  Rückgabe new Auswertung(summe / werte.length, anzahlUeber, maxWert, maxIndex)\nende auswerten\n\nBewertung: leeres Array 2 P, Initialisierung 3 P, Schleife 3 P, Zählen 2 P, Maximum mit Index 3 P, Rückgabe 2 P." },
  { id: "P2", teil: "Teil 2", thema: "Pseudocode", titel: "Durchschnittsgehalt je Abteilung", max: 20, min: 25,
    text: "Gegeben ist eine Liste List<Mitarbeiter>. Mitarbeiter hat die Getter getName(), getAbteilung(): String und getGehalt(): Double.\n\nDie Klasse AbtStat hat die Attribute abteilung: String, summe: Double, anzahl: Integer, den Konstruktor AbtStat(abteilung: String) (summe = 0, anzahl = 0) sowie Getter und Setter.\n\nListen bieten add(o), size(), get(i).\n\nEntwickeln Sie in Pseudocode die Methode\n  statistik(ma: List<Mitarbeiter>) : List<AbtStat>\n\nFür jede Abteilung soll genau ein AbtStat-Objekt mit Gehaltssumme und Anzahl der Mitarbeitenden in der Ergebnisliste stehen.",
    loesung: "statistik(ma: List<Mitarbeiter>) : List<AbtStat>\n  ergebnis = new List<AbtStat>()\n  für i = 0 bis ma.size() - 1\n    m = ma.get(i)\n    stat = null\n    für j = 0 bis ergebnis.size() - 1\n      wenn ergebnis.get(j).getAbteilung() == m.getAbteilung() dann\n        stat = ergebnis.get(j)\n      ende wenn\n    ende für\n    wenn stat == null dann\n      stat = new AbtStat(m.getAbteilung())\n      ergebnis.add(stat)\n    ende wenn\n    stat.setSumme(stat.getSumme() + m.getGehalt())\n    stat.setAnzahl(stat.getAnzahl() + 1)\n  ende für\n  Rückgabe ergebnis\nende statistik\n\nBewertung: Ergebnisliste 2 P, äußere Schleife 3 P, Suche in Ergebnisliste 6 P, neues Objekt anlegen und hinzufügen 4 P, Summe/Anzahl erhöhen 3 P, Rückgabe 2 P.\nDieses Muster (gruppieren ohne Map) kam so ähnlich in S 26 vor." },
  { id: "P3", teil: "Teil 2", thema: "Pseudocode", titel: "Umsätze im 2D-Array", max: 20, min: 25,
    text: "Im zweidimensionalen Array umsatz: Double[][] steht in umsatz[f][m] der Umsatz der Filiale f (0 … anzahl−1) im Monat m (0 = Januar … 11 = Dezember).\n\na) Entwickeln Sie besterMonat(umsatz: Double[][]) : Integer. Sie gibt die Monatsnummer 1–12 zurück, in dem der Gesamtumsatz aller Filialen am höchsten war. (10 P)\n\nb) Entwickeln Sie zielErreicht(umsatz: Double[][], ziel: Double) : Integer. Sie gibt zurück, wie viele Filialen in jedem einzelnen Monat mindestens ziel erreicht haben. (10 P)",
    loesung: "a)\nbesterMonat(umsatz: Double[][]) : Integer\n  besterIndex = 0\n  besteSumme = -1\n  für m = 0 bis 11\n    summe = 0\n    für f = 0 bis umsatz.length - 1\n      summe = summe + umsatz[f][m]\n    ende für\n    wenn summe > besteSumme dann\n      besteSumme = summe\n      besterIndex = m\n    ende wenn\n  ende für\n  Rückgabe besterIndex + 1\nende besterMonat\n\nb)\nzielErreicht(umsatz: Double[][], ziel: Double) : Integer\n  anzahl = 0\n  für f = 0 bis umsatz.length - 1\n    immer = true\n    für m = 0 bis 11\n      wenn umsatz[f][m] < ziel dann\n        immer = false\n      ende wenn\n    ende für\n    wenn immer dann\n      anzahl = anzahl + 1\n    ende wenn\n  ende für\n  Rückgabe anzahl\nende zielErreicht\n\nTypische Fehler: Summe nicht pro Monat zurücksetzen, Index statt Monatsnummer zurückgeben, Flag außerhalb der äußeren Schleife initialisieren." },
  { id: "P4", teil: "Teil 2", thema: "Pseudocode", titel: "Fehlersuche und Schreibtischtest", max: 15, min: 20,
    text: "Die Methode soll das Minimum eines Arrays und seine Position liefern:\n\n01 minimumUndPosition(werte: Integer[]) : Integer[]\n02   min = 0\n03   pos = 0\n04   für i = 1 bis werte.length\n05     wenn werte[i] > min dann\n06       min = werte[i]\n07       pos = i\n08     ende wenn\n09   ende für\n10   Rückgabe [min, pos]\n11 ende minimumUndPosition\n\na) Führen Sie einen Schreibtischtest mit werte = {4, -2, 7, -5} durch. Was passiert? (5 P)\nb) Nennen Sie drei Fehler mit Zeilennummer und Korrektur. (6 P)\nc) Welcher Testfall fehlt außerdem und wie behandeln Sie ihn? (4 P)",
    loesung: "a) min = 0, pos = 0\ni = 1: -2 > 0? nein\ni = 2: 7 > 0? ja → min = 7, pos = 2\ni = 3: -5 > 7? nein\ni = 4: Zugriff auf werte[4] → Index außerhalb des Arrays (Laufzeitfehler).\nSelbst ohne Absturz wäre das Ergebnis [7, 2] (Maximum statt Minimum).\n\nb)\nZeile 02: min = werte[0] statt 0\nZeile 04: für i = 1 bis werte.length - 1\nZeile 05: werte[i] < min statt >\n\nKorrektes Ergebnis für das Beispiel: [-5, 3]\n\nc) Leeres Array oder null: werte[0] löst einen Fehler aus. Vorher prüfen und z. B. null zurückgeben oder eine Exception mit verständlicher Meldung werfen." },
  { id: "P5", teil: "Teil 2", thema: "Pseudocode", titel: "Selection Sort und Insertion Sort", max: 20, min: 25,
    text: "Ein Array artikel: Artikel[] soll absteigend nach getPreis() sortiert werden.\n\na) Implementieren Sie die Sortierung als Selection Sort. (8 P)\nb) Implementieren Sie die Sortierung als Insertion Sort. (8 P)\nc) Welches Verfahren ist bei bereits fast sortierten Daten im Vorteil? Begründen Sie. (4 P)",
    loesung: "a) Selection Sort\nfür i = 0 bis artikel.length - 2\n  maxPos = i\n  für j = i + 1 bis artikel.length - 1\n    wenn artikel[j].getPreis() > artikel[maxPos].getPreis() dann\n      maxPos = j\n    ende wenn\n  ende für\n  tmp = artikel[i]\n  artikel[i] = artikel[maxPos]\n  artikel[maxPos] = tmp\nende für\n\nb) Insertion Sort\nfür i = 1 bis artikel.length - 1\n  aktuell = artikel[i]\n  j = i - 1\n  solange j >= 0 und artikel[j].getPreis() < aktuell.getPreis()\n    artikel[j + 1] = artikel[j]\n    j = j - 1\n  ende solange\n  artikel[j + 1] = aktuell\nende für\n\nc) Insertion Sort: Bei fast sortierten Daten wird die innere Schleife kaum durchlaufen, Aufwand nahe O(n). Selection Sort sucht immer den ganzen Rest ab und bleibt bei O(n²)." },
  { id: "S1", teil: "Teil 2", thema: "SQL", titel: "Abfragen mit JOIN, GROUP BY, HAVING", max: 16, min: 20,
    schema: true,
    text: "a) Alle Kunden aus Mainz, alphabetisch nach Name. (2 P)\n\nb) Für jeden Kunden die Anzahl seiner Bestellungen im Jahr 2026, auch Kunden ohne Bestellung (Anzahl 0). Absteigend nach Anzahl. (6 P)\n\nc) Umsatz je Kategorie im Jahr 2026 (Menge × Preis), nur Kategorien mit mehr als 10.000 € Umsatz, absteigend. (8 P)",
    loesung: "a)\nSELECT * FROM Kunde WHERE Ort = 'Mainz' ORDER BY Name;\n\nb)\nSELECT K.KID, K.Name, COUNT(B.BID) AS Anzahl\nFROM Kunde AS K\nLEFT JOIN Bestellung AS B\n  ON B.KID = K.KID AND YEAR(B.Datum) = 2026\nGROUP BY K.KID, K.Name\nORDER BY Anzahl DESC;\n\nWichtig: Jahresbedingung im ON, nicht im WHERE. COUNT(B.BID) statt COUNT(*).\n\nc)\nSELECT A.Kategorie, SUM(P.Menge * A.Preis) AS Umsatz\nFROM Bestellung AS B\nINNER JOIN Position AS P ON P.BID = B.BID\nINNER JOIN Artikel AS A ON A.ArtNr = P.ArtNr\nWHERE YEAR(B.Datum) = 2026\nGROUP BY A.Kategorie\nHAVING SUM(P.Menge * A.Preis) > 10000\nORDER BY Umsatz DESC;" },
  { id: "S2", teil: "Teil 2", thema: "SQL", titel: "Daten ändern, löschen, einfügen", max: 13, min: 15,
    schema: true,
    text: "a) Erhöhen Sie die Preise aller Artikel der Kategorie Zubehör um 5 %. (3 P)\nb) Löschen Sie alle Artikel, die noch nie bestellt wurden. (4 P)\nc) Fügen Sie den Artikel 4711, USB-C-Kabel 2 m, Zubehör, 12,90 € ein. (2 P)\nd) Geben Sie Bezeichnung und Preis des teuersten Artikels aus (bei Gleichstand alle). (4 P)",
    loesung: "a)\nUPDATE Artikel SET Preis = Preis * 1.05 WHERE Kategorie = 'Zubehör';\n\nb)\nDELETE FROM Artikel\nWHERE ArtNr NOT IN (SELECT ArtNr FROM Position);\n\nc)\nINSERT INTO Artikel (ArtNr, Bezeichnung, Kategorie, Preis)\nVALUES (4711, 'USB-C-Kabel 2 m', 'Zubehör', 12.90);\n\nd)\nSELECT Bezeichnung, Preis FROM Artikel\nWHERE Preis = (SELECT MAX(Preis) FROM Artikel);" },
  { id: "S3", teil: "Teil 2", thema: "SQL", titel: "Struktur, Rechte und Archivieren", max: 15, min: 20,
    schema: true,
    text: "a) Erweitern Sie Kunde um die Spalte Telefon (Text, 30 Zeichen). (2 P)\nb) Legen Sie einen Index auf Bestellung.Datum an. (2 P)\nc) Alle Bestellungen vor dem 01.01.2025 sollen in die Tabelle Bestellung_Archiv (gleiche Struktur) übertragen und danach aus Bestellung gelöscht werden. Beachten Sie die Fremdschlüssel. (8 P)\nd) Der Benutzer praktikant soll die Tabelle Artikel lesen dürfen. Entziehen Sie das Recht anschließend wieder. (3 P)",
    loesung: "a)\nALTER TABLE Kunde ADD Telefon VARCHAR(30);\n\nb)\nCREATE INDEX idx_bestellung_datum ON Bestellung (Datum);\n\nc)\nINSERT INTO Bestellung_Archiv (BID, KID, Datum, Status)\n  SELECT BID, KID, Datum, Status\n  FROM Bestellung\n  WHERE Datum < '2025-01-01';\n\nDELETE FROM Position\nWHERE BID IN (SELECT BID FROM Bestellung WHERE Datum < '2025-01-01');\n\nDELETE FROM Bestellung WHERE Datum < '2025-01-01';\n\nPositionen zuerst löschen (oder ebenfalls archivieren), sonst verletzt das Löschen die referentielle Integrität.\n\nd)\nGRANT SELECT ON Artikel TO praktikant;\nREVOKE SELECT ON Artikel FROM praktikant;" },
  { id: "S4", teil: "Teil 2", thema: "SQL", titel: "Tabelle anlegen und Unterabfrage im FROM", max: 16, min: 20,
    schema: true,
    text: "a) Erstellen Sie die Tabelle Position mit zusammengesetztem Primärschlüssel und beiden Fremdschlüsseln. (5 P)\nb) Geben Sie alle Kunden aus, die noch nie bestellt haben. (3 P)\nc) Ermitteln Sie je Kunde den durchschnittlichen Bestellwert (Wert einer Bestellung = Summe Menge × Preis ihrer Positionen). (8 P)",
    loesung: "a)\nCREATE TABLE Position (\n  BID INT NOT NULL,\n  ArtNr INT NOT NULL,\n  Menge INT NOT NULL,\n  PRIMARY KEY (BID, ArtNr),\n  FOREIGN KEY (BID) REFERENCES Bestellung(BID),\n  FOREIGN KEY (ArtNr) REFERENCES Artikel(ArtNr)\n);\n\nb)\nSELECT K.KID, K.Name\nFROM Kunde AS K\nLEFT JOIN Bestellung AS B ON B.KID = K.KID\nWHERE B.BID IS NULL;\n\nc)\nSELECT K.KID, K.Name, AVG(BW.Wert) AS DurchschnittBestellwert\nFROM Kunde AS K\nINNER JOIN (\n  SELECT B.BID, B.KID, SUM(P.Menge * A.Preis) AS Wert\n  FROM Bestellung AS B\n  INNER JOIN Position AS P ON P.BID = B.BID\n  INNER JOIN Artikel AS A ON A.ArtNr = P.ArtNr\n  GROUP BY B.BID, B.KID\n) AS BW ON BW.KID = K.KID\nGROUP BY K.KID, K.Name;" },
  { id: "D1", teil: "Teil 2", thema: "Datenmodell", titel: "Relationenmodell Fitnessstudio", max: 25, min: 25,
    text: "Ein Fitnessstudio verwaltet seine Mitglieder (Name, Vorname, Geburtsdatum). Jedes Mitglied hat genau einen Tarif (Bezeichnung, Monatsbeitrag).\nKurse (Bezeichnung, Wochentag, Uhrzeit) finden immer in genau einem Raum (Raumname, Kapazität) statt und werden von genau einem Trainer (Name, Qualifikation) geleitet.\nMitglieder melden sich für Kurse an. Gespeichert werden das Anmeldedatum und ob das Mitglied erschienen ist.\n\nErstellen Sie ein relationales Datenmodell in der 3. Normalform. Kennzeichnen Sie PK und FK und tragen Sie alle Beziehungen mit Kardinalitäten ein.",
    loesung: "Tarif (TarifID [PK], Bezeichnung, Monatsbeitrag)\nMitglied (MitgliedID [PK], Name, Vorname, Geburtsdatum, TarifID [FK])\nRaum (RaumID [PK], Raumname, Kapazitaet)\nTrainer (TrainerID [PK], Name, Qualifikation)\nKurs (KursID [PK], Bezeichnung, Wochentag, Uhrzeit, RaumID [FK], TrainerID [FK])\nAnmeldung (MitgliedID [PK, FK], KursID [PK, FK], Anmeldedatum, Erschienen)\n\nBeziehungen:\nTarif 1 : n Mitglied\nRaum 1 : n Kurs\nTrainer 1 : n Kurs\nMitglied 1 : n Anmeldung\nKurs 1 : n Anmeldung   (m:n Mitglied–Kurs über Anmeldung aufgelöst)\n\nBewertung wie in der IHK-Prüfung: 6 Tabellen à 1 P, 6 PK à 1 P, 6 FK à 1 P, 5 Beziehungen mit Kardinalität à 1 P, Attribute vollständig 2 P.\nFinden Kurse mehrfach an verschiedenen Terminen statt, gehört zusätzlich eine Tabelle Kurstermin dazu." },
  { id: "D2", teil: "Teil 1", thema: "Datenmodell", titel: "Anomalien und Normalisierung", max: 20, min: 20,
    text: "Eine Kfz-Werkstatt speichert Aufträge in einer einzigen Tabelle:\n\nAuftragNr | Datum | KundenNr | KundenName | KundenOrt | Kennzeichen | Leistungen\n1001 | 03.11.26 | 17 | Weber | Mainz | MZ-AB 12 | Ölwechsel 89 €, Bremsen 240 €\n1002 | 04.11.26 | 17 | Weber | Mainz | MZ-AB 12 | Inspektion 199 €\n1003 | 04.11.26 | 22 | Kaya | Wiesbaden | WI-K 77 | Ölwechsel 89 €\n\na) Welche Normalform ist verletzt? Begründen Sie. (2 P)\nb) Beschreiben Sie Einfüge-, Änderungs- und Löschanomalie an diesem Beispiel. (6 P)\nc) Überführen Sie die Daten in die 3. Normalform. (12 P)",
    loesung: "a) Schon die 1. NF: Die Spalte Leistungen enthält mehrere Werte (nicht atomar), Leistung und Preis sind zusammengeschrieben.\n\nb)\nEinfügeanomalie: Ein neuer Kunde oder eine neue Leistung kann nicht gespeichert werden, solange es keinen Auftrag gibt.\nÄnderungsanomalie: Zieht Weber um, muss der Ort in allen seinen Aufträgen geändert werden; wird einer vergessen, sind die Daten widersprüchlich. Ebenso bei Preisänderung Ölwechsel.\nLöschanomalie: Wird Auftrag 1003 gelöscht, gehen alle Daten von Kunde Kaya verloren.\n\nc)\nKunde (KundenNr [PK], Name, Ort)\nFahrzeug (Kennzeichen [PK], KundenNr [FK])\nAuftrag (AuftragNr [PK], Datum, Kennzeichen [FK])\nLeistung (LeistungNr [PK], Bezeichnung, Preis)\nAuftragsposition (AuftragNr [PK, FK], LeistungNr [PK, FK], Menge)\n\nKunde 1:n Fahrzeug, Fahrzeug 1:n Auftrag, Auftrag 1:n Auftragsposition, Leistung 1:n Auftragsposition.\nSoll der Preis zum Auftragszeitpunkt erhalten bleiben, zusätzlich Preis in Auftragsposition speichern." },
  { id: "U1", teil: "Teil 1 + 2", thema: "UML", titel: "Aktivitätsdiagramm Retoure", max: 18, min: 25,
    text: "Zeichnen Sie ein Aktivitätsdiagramm mit den Partitionen Kunde, Kundenservice und Lager:\n\nDer Kunde meldet eine Rücksendung online an. Der Kundenservice prüft, ob die 30-Tage-Frist eingehalten ist. Ist sie überschritten, wird dem Kunden eine Ablehnung gesendet und der Vorgang endet.\nSonst erzeugt der Kundenservice ein Retourenlabel und der Kunde verschickt das Paket. Das Lager prüft die Ware. Ist sie beschädigt, wird eine Teilerstattung berechnet, sonst die volle Erstattung.\nAnschließend laufen parallel: Das Lager bucht die Ware ein, der Kundenservice veranlasst die Erstattung und sendet eine Bestätigung. Sind beide fertig, ist der Vorgang abgeschlossen.",
    loesung: "Kunde: Start ● → [Rücksendung anmelden]\nKundenservice: [Frist prüfen] → Raute\n  [Frist überschritten] → [Ablehnung senden] → Ende ◉\n  [Frist eingehalten] → [Retourenlabel erzeugen]\nKunde: [Paket verschicken]\nLager: [Ware prüfen] → Raute\n  [beschädigt] → [Teilerstattung berechnen]\n  [nicht beschädigt] → [volle Erstattung berechnen]\n  → Zusammenführungsraute → Fork-Balken\n    Lager: [Ware einbuchen]\n    Kundenservice: [Erstattung veranlassen] → [Bestätigung senden]\n  → Join-Balken → Ende ◉\n\nPunkte je Aktion 1 P (9), je Verzweigung mit Bedingungen 2 P (4), Fork/Join 2 P, Start/Ende und richtige Partitionen 3 P.\nHäufige Fehler: Bedingungen ohne eckige Klammern, fehlende Zusammenführung nach der Verzweigung, Join vergessen." },
  { id: "U2", teil: "Teil 1 + 2", thema: "UML", titel: "Zustandsdiagramm Paketfach", max: 15, min: 20,
    text: "Ein Fach einer Paketstation kann frei, reserviert, belegt, abgelaufen oder gesperrt sein.\n- Ein freies Fach wird reserviert, wenn ein Zusteller ein Paket passender Größe ankündigt.\n- Legt der Zusteller das Paket ein, ist das Fach belegt und dem Empfänger wird ein Abholcode gesendet.\n- Wird nicht innerhalb von 24 Stunden eingelegt, ist das Fach wieder frei.\n- Gibt der Empfänger den richtigen Code ein, öffnet die Tür, er entnimmt das Paket und das Fach ist frei.\n- Wird ein Paket 7 Tage nicht abgeholt, ist das Fach abgelaufen; der Zusteller nimmt es mit und das Fach ist frei.\n- Bei einer Störung wird jedes Fach gesperrt; nach der Reparatur ist es frei.\n\nZeichnen Sie das Zustandsdiagramm.",
    loesung: "● → frei\nfrei → reserviert: ankündigen [Größe passt]\nreserviert → belegt: einlegen / Abholcode senden\nreserviert → frei: nach 24 h\nbelegt → frei: Code eingeben [Code korrekt] / Tür öffnen\nbelegt → abgelaufen: nach 7 Tagen\nabgelaufen → frei: Zusteller entnimmt\nfrei, reserviert, belegt, abgelaufen → gesperrt: Störung\ngesperrt → frei: repariert\n\nBewertung: je Zustand 1 P (5), je Übergang mit richtiger Beschriftung 1 P (9), Startzustand 1 P.\nÜbergangsform: Ereignis [Bedingung] / Aktion." },
  { id: "U3", teil: "Teil 1 + 2", thema: "UML", titel: "Sequenzdiagramm Login mit 2FA", max: 15, min: 20,
    text: "Lebenslinien: :Benutzer, :LoginView, :AuthService, :UserRepository.\n\nDer Benutzer gibt Benutzername und Passwort in der LoginView ein. Die LoginView ruft login(name, pw) beim AuthService auf. Dieser lädt mit findUser(name) den Benutzer aus dem UserRepository und prüft das Passwort mit checkHash(pw).\nIst das Passwort falsch, liefert login false und die View zeigt eine Fehlermeldung.\nIst es richtig, sendet der AuthService einen Code per SMS (sendCode()), die View fragt den Code ab und ruft verify(code) auf. Bei korrektem Code liefert verify true und die View zeigt das Dashboard.",
    loesung: "Benutzer → LoginView: eingeben(name, pw)\nLoginView → AuthService: login(name, pw)\nAuthService → UserRepository: findUser(name)\nUserRepository --> AuthService: user\nAuthService → AuthService: checkHash(pw)\nalt [Passwort falsch]\n  AuthService --> LoginView: false\n  LoginView → Benutzer: Fehlermeldung anzeigen\n[Passwort richtig]\n  AuthService → AuthService: sendCode()\n  AuthService --> LoginView: true (Code gesendet)\n  LoginView → Benutzer: Code abfragen\n  Benutzer → LoginView: code eingeben\n  LoginView → AuthService: verify(code)\n  AuthService --> LoginView: true\n  LoginView → Benutzer: Dashboard anzeigen\n\nBewertung: je Nachricht mit Antwort 0,5–1 P, alt-Fragment mit beiden Bedingungen 3 P, Aktivierungsbalken optional.\nAntworten gestrichelt, Aufrufe mit gefüllter Pfeilspitze." },
  { id: "N1", teil: "Teil 1", thema: "Projektmanagement", titel: "Netzplan", max: 20, min: 25,
    text: "Vorgänge (Dauer in Tagen, Vorgänger):\nA Anforderungsanalyse 5, –\nB Datenbankentwurf 4, A\nC UI-Entwurf 3, A\nD Backend implementieren 8, B\nE Frontend implementieren 6, C\nF Integrationstest 3, D und E\nG Schulungsunterlagen 2, C\nH Abnahme und Bereitstellung 2, F und G\n\na) Berechnen Sie FAZ, FEZ, SAZ, SEZ, Gesamtpuffer und freien Puffer. (14 P)\nb) Geben Sie den kritischen Pfad und die Projektdauer an. (3 P)\nc) Erklären Sie den Unterschied zwischen Gesamtpuffer und freiem Puffer. (3 P)",
    loesung: "Vorgang | FAZ | FEZ | SAZ | SEZ | GP | FP\nA | 0 | 5 | 0 | 5 | 0 | 0\nB | 5 | 9 | 5 | 9 | 0 | 0\nC | 5 | 8 | 8 | 11 | 3 | 0\nD | 9 | 17 | 9 | 17 | 0 | 0\nE | 8 | 14 | 11 | 17 | 3 | 3\nF | 17 | 20 | 17 | 20 | 0 | 0\nG | 8 | 10 | 18 | 20 | 10 | 10\nH | 20 | 22 | 20 | 22 | 0 | 0\n\nb) Kritischer Pfad A – B – D – F – H, Projektdauer 22 Tage.\n\nc) Gesamtpuffer (SAZ − FAZ): Verschiebung ohne Verzögerung des Projektendes. Freier Puffer (kleinster FAZ der Nachfolger − FEZ): Verschiebung, ohne dass ein Nachfolger später beginnen kann. C hat 3 Tage Gesamtpuffer, aber 0 freien Puffer, weil E und G sofort an C anschließen." },
  { id: "X1", teil: "Teil 2", thema: "Testen", titel: "Testfälle und Überdeckung", max: 20, min: 20,
    text: "versandkosten(gewicht: Double, express: Boolean) : Double\n  wenn gewicht <= 0 dann\n    Rückgabe -1\n  ende wenn\n  wenn gewicht <= 2 dann\n    preis = 4.99\n  sonst wenn gewicht <= 10 dann\n    preis = 6.99\n  sonst\n    preis = 14.99\n  ende wenn\n  wenn express dann\n    preis = preis + 5\n  ende wenn\n  Rückgabe preis\nende versandkosten\n\na) Bilden Sie Äquivalenzklassen für gewicht und nennen Sie Grenzwerte. (6 P)\nb) Geben Sie eine minimale Menge Testfälle für vollständige Zweigüberdeckung an (Eingabe und erwartetes Ergebnis). (6 P)\nc) Erklären Sie Anweisungs-, Zweig- und Pfadüberdeckung. (6 P)\nd) Wofür steht TDD und wie läuft es ab? (2 P)",
    loesung: "a) Klassen: ungültig gewicht <= 0; 0 < gewicht <= 2; 2 < gewicht <= 10; gewicht > 10.\nGrenzwerte: 0 und 0,01; 2 und 2,01; 10 und 10,01.\n\nb) Vier Testfälle genügen:\n(0, false) → -1\n(1, true) → 9.99\n(5, false) → 6.99\n(12, true) → 19.99\nJede Bedingung ist damit einmal wahr und einmal falsch.\n\nc) Anweisungsüberdeckung: jede Anweisung mindestens einmal. Zweigüberdeckung: jeder Zweig jeder Entscheidung (wahr/falsch) mindestens einmal, schließt Anweisungsüberdeckung ein. Pfadüberdeckung: jede mögliche Kombination von Zweigen vom Start bis zum Ende, hier 1 + 3 × 2 = 7 Pfade.\n\nd) Test Driven Development: Test zuerst schreiben (schlägt fehl), dann minimalen Code bis er besteht, dann Refactoring." },
  { id: "O1", teil: "Teil 1", thema: "OOP", titel: "Klassendiagramm Fahrzeugvermietung", max: 25, min: 25,
    text: "Eine Vermietung verwaltet Fahrzeuge. Jedes Fahrzeug hat Kennzeichen und Tagespreis. Es gibt PKW (Sitzplätze) und Transporter (Ladevolumen). Ein Fahrzeug selbst wird nie angelegt, nur PKW oder Transporter.\nAlle Fahrzeuge haben die Methode berechneMiete(tage: Integer): Double. Beim PKW ist die Miete Tage × Tagespreis, beim Transporter kommt eine Reinigungspauschale von 25 € dazu.\nEin Kunde (Name, Kundennummer) kann mehrere Mietverträge haben. Ein Mietvertrag (Beginn, Ende) gehört zu genau einem Kunden und genau einem Fahrzeug.\n\na) Erstellen Sie das Klassendiagramm mit Attributen, Datentypen, Sichtbarkeiten, Methoden und Beziehungen mit Multiplizitäten. (13 P)\nb) Erklären Sie Polymorphie an diesem Beispiel. (4 P)\nc) Wäre die Beziehung Kunde–Mietvertrag eine Komposition oder Aggregation? Begründen Sie. (4 P)\nd) Welches Entwurfsmuster passt, wenn Kunden bei Statusänderungen ihres Mietvertrags automatisch benachrichtigt werden sollen? (4 P)",
    loesung: "a)\n{abstract} Fahrzeug\n  - kennzeichen: String\n  - tagespreis: Double\n  + berechneMiete(tage: Integer): Double {abstract}\nPKW erbt von Fahrzeug\n  - sitzplaetze: Integer\n  + berechneMiete(tage: Integer): Double\nTransporter erbt von Fahrzeug\n  - ladevolumen: Double\n  + berechneMiete(tage: Integer): Double\nKunde\n  - kundennummer: Integer\n  - name: String\nMietvertrag\n  - beginn: Date\n  - ende: Date\n\nKunde 1 —— 0..* Mietvertrag\nMietvertrag 0..* —— 1 Fahrzeug\nVererbung mit leerem Dreieck zu Fahrzeug, Fahrzeug kursiv oder {abstract}.\n\nb) Der Aufruf fahrzeug.berechneMiete(3) ist für alle Fahrzeuge gleich. Erst zur Laufzeit wird anhand des tatsächlichen Objekts (PKW oder Transporter) entschieden, welche Implementierung läuft.\n\nc) Komposition ist vertretbar, wenn ein Mietvertrag ohne Kunden nicht existieren soll (gefüllte Raute beim Kunden). Müssen Verträge aus rechtlichen Gründen auch nach Löschung des Kunden aufbewahrt werden, eher Assoziation/Aggregation. Begründung zählt.\n\nd) Observer: Mietvertrag ist Subjekt, Kunde (bzw. ein Benachrichtigungsdienst) registriert sich als Beobachter und wird bei Statusänderung per update() informiert." },
  { id: "PM1", teil: "Teil 1", thema: "Projektmanagement", titel: "Projektplanung Zeiterfassungs-App", max: 28, min: 30,
    text: "Ein Handwerksbetrieb mit 60 Beschäftigten führt eine App zur mobilen Zeiterfassung ein; bisher werden Stundenzettel auf Papier geführt.\n\na) Beschreiben Sie für zwei Stakeholder Erwartung, Befürchtung und eine Maßnahme. (8 P)\nb) Nennen Sie zwei Risiken mit Ursache, Auswirkung und Gegenmaßnahme. (8 P)\nc) Würden Sie agil oder klassisch vorgehen? Begründen Sie. (4 P)\nd) Nennen Sie je zwei funktionale und nichtfunktionale Anforderungen. (4 P)\ne) Wie können Sie nach Projektende den Erfolg prüfen? Zwei Aspekte. (4 P)",
    loesung: "a) Beispiele:\nMitarbeitende – Erwartung: weniger Papierkram, schnellere Lohnabrechnung – Befürchtung: Überwachung per GPS – Maßnahme: früh informieren, nur Arbeitszeit ohne Standort, Schulung.\nBetriebsrat – Erwartung: korrekte Erfassung von Überstunden – Befürchtung: Leistungs- und Verhaltenskontrolle – Maßnahme: Betriebsvereinbarung abschließen (Mitbestimmung § 87 Nr. 6 BetrVG).\nGeschäftsführung – Erwartung: Kosten senken, Auswertungen – Befürchtung: Kostenüberschreitung – Maßnahme: Kostencontrolling, Meilensteine.\n\nb) Beispiele:\nAkzeptanzproblem – Ursache: Angst vor Kontrolle – Auswirkung: App wird nicht genutzt – Gegenmaßnahme: Einbindung, Schulung.\nSchnittstelle zur Lohnsoftware – Ursache: unklare Datenformate – Auswirkung: Verzögerung, Mehrkosten – Gegenmaßnahme: frühe Schnittstellenanalyse, Prototyp.\nKein Netz auf Baustellen – Ursache: Funklöcher – Auswirkung: Daten fehlen – Gegenmaßnahme: Offline-Modus mit Synchronisierung.\n\nc) Agil, z. B. Scrum: Anforderungen der Handwerker sind am Anfang unklar, frühe Testversionen geben Feedback. Klassisch ist auch vertretbar, wenn Anforderungen fest sind und ein Festpreis vereinbart ist.\n\nd) Funktional: Arbeitsbeginn/-ende erfassen, Zeiten einem Auftrag zuordnen, Export an Lohnbuchhaltung. Nichtfunktional: Bedienung mit Handschuhen/große Buttons, offlinefähig, Antwortzeit < 2 s, DSGVO-konforme Speicherung.\n\ne) Soll-Ist-Vergleich mit Pflichtenheft, Kosten und Termin; Nutzerbefragung zur Zufriedenheit; Kennzahlen wie Zeitaufwand der Lohnabrechnung vorher/nachher; Lessons Learned." },
  { id: "SEC1", teil: "Teil 1", thema: "IT-Sicherheit", titel: "Sicherheit einer Web-App", max: 22, min: 25,
    text: "Für ein Kundenportal sollen Sie das Sicherheitskonzept erstellen.\n\na) Erklären Sie, wie TLS die Verbindung zwischen Browser und Server schützt (hybride Verschlüsselung, Zertifikat). (6 P)\nb) Wie speichern Sie die Passwörter der Kunden? Begründen Sie. (4 P)\nc) Im Login steht der Code\n   sql = \"SELECT * FROM kunde WHERE name = '\" + name + \"' AND pw = '\" + pw + \"'\"\n   Erklären Sie die Gefahr an einem Beispiel und nennen Sie die Abhilfe. (6 P)\nd) Ordnen Sie den drei Schutzzielen je eine Maßnahme für das Portal zu. (6 P)",
    loesung: "a) Der Server schickt sein Zertifikat, signiert von einer CA; der Browser prüft die Signatur und so die Echtheit des Servers. Über asymmetrische Verfahren (Schlüsselaustausch, z. B. ECDHE) einigen sich beide auf einen Sitzungsschlüssel. Die eigentlichen Daten werden dann schnell symmetrisch (z. B. AES) verschlüsselt. Schutz vor Mitlesen (Vertraulichkeit) und Manipulation (Integrität), Man-in-the-Middle wird durch die Zertifikatsprüfung verhindert.\n\nb) Als Hash mit einem langsamen Verfahren (bcrypt, Argon2) und einem zufälligen Salt pro Kunde. Selbst bei einem Datenbankdiebstahl sind die Passwörter nicht im Klartext lesbar, gleiche Passwörter ergeben durch das Salt verschiedene Hashes, Rainbow-Tables helfen nicht.\n\nc) SQL-Injection: Gibt ein Angreifer als Name  admin' --  ein, wird die Passwortprüfung auskommentiert und er ist als admin angemeldet. Mit ' OR '1'='1 werden alle Datensätze geliefert. Abhilfe: Prepared Statements mit Parametern (WHERE name = ? AND …), Eingaben validieren, Datenbankbenutzer mit minimalen Rechten.\n\nd) Vertraulichkeit: TLS, Rollen- und Rechtekonzept, Verschlüsselung der Datenbank. Integrität: Hashes/Signaturen, Eingabevalidierung, Protokollierung von Änderungen. Verfügbarkeit: Backups, redundante Server, DDoS-Schutz, Monitoring." },
  { id: "WEB1", teil: "Teil 1", thema: "Web & REST", titel: "REST-API für Termine", max: 16, min: 20,
    text: "Eine Arztpraxis bietet unter https://api.praxis.de/termine eine REST-API an.\n\na) Erklären Sie zwei Merkmale von REST. (4 P)\nb) Geben Sie für Anlegen, Abrufen eines Termins (ID 42), Verschieben und Absagen jeweils HTTP-Methode und URL an. (4 P)\nc) Welche Statuscodes erwarten Sie für: Termin angelegt, Termin 42 existiert nicht, fehlende Anmeldung? (3 P)\nd) Schreiben Sie einen JSON-Body für einen neuen Termin (Datum, Uhrzeit, Patient-ID, Grund). (3 P)\ne) Unterschied zwischen PUT und PATCH? (2 P)",
    loesung: "a) Ressourcen sind über eindeutige URLs adressiert; Standard-HTTP-Methoden; zustandslos (jede Anfrage enthält alle Infos, z. B. Token); Client und Server lose gekoppelt; Antworten meist JSON.\n\nb)\nAnlegen: POST /termine\nAbrufen: GET /termine/42\nVerschieben: PUT oder PATCH /termine/42\nAbsagen: DELETE /termine/42\n\nc) 201 Created, 404 Not Found, 401 Unauthorized\n\nd)\n{\n  \"datum\": \"2026-11-30\",\n  \"uhrzeit\": \"09:15\",\n  \"patientId\": 1873,\n  \"grund\": \"Kontrolle\"\n}\n\ne) PUT ersetzt die ganze Ressource, PATCH ändert nur die übergebenen Felder." }
];

const MC = [
  // ---------- Teil 1: Projektmanagement & Anforderungen
  ["t1", "pm", "Für eine Terminbuchungs-App einer Arztpraxis werden Anforderungen gesammelt.\n\nWelche Anforderung ist nichtfunktional?", ["Die App erstellt eine Rechnung als PDF.","Die Seite lädt in unter 2 Sekunden.","Patienten können Termine stornieren.","Die Praxis kann Benutzer sperren."], 1, "Funktionale Anforderungen beschreiben, was das System tut. Nichtfunktionale beschreiben, wie gut: Performance, Verfügbarkeit, Sicherheit, Benutzbarkeit."],
  ["t1", "pm", "In einem Scrum-Projekt einer Versicherung sollen neue Anforderungen eingeordnet und nach Geschäftswert sortiert werden.\n\nWer pflegt und priorisiert das Product Backlog?", ["Scrum Master","Product Owner","Developers","Fachbereichsleitung"], 1, "Der Product Owner verantwortet das Product Backlog und den Wert des Produkts. Der Scrum Master kümmert sich um den Prozess, die Developers um die Umsetzung."],
  ["t1", "pm", "Ein Scrum-Team trifft sich jeden Morgen, um den Fortschritt abzustimmen. Die Treffen werden immer länger.\n\nWie lange dauert ein Daily Scrum höchstens?", ["5 Minuten","15 Minuten","30 Minuten","1 Stunde"], 1, "Das Daily Scrum ist auf 15 Minuten begrenzt (Timebox). Detailfragen werden danach in kleiner Runde geklärt."],
  ["t1", "pm", "Ein Autohaus beauftragt einen IT-Dienstleister mit einer neuen Werkstattplanung. Zuerst beschreibt das Autohaus seine Anforderungen.\n\nWie heißt das Dokument, das der Auftraggeber erstellt?", ["Pflichtenheft","Lastenheft","Testkonzept","Abnahmeprotokoll"], 1, "Lastenheft: Was will der Auftraggeber? Pflichtenheft: Wie setzt der Auftragnehmer es um? Das Pflichtenheft baut auf dem Lastenheft auf."],
  ["t1", "pm", "Eine Behörde lässt eine Software zur Antragsbearbeitung entwickeln. Die Anforderungen sind gesetzlich festgelegt und ändern sich während des Projekts nicht.\n\nWann ist ein klassisches Vorgehen wie das Wasserfallmodell besonders geeignet?", ["Wenn Anforderungen erst während der Umsetzung schrittweise entstehen","Wenn Anforderungen früh vollständig bekannt und stabil sind","Wenn der Kunde nach jedem Sprint lauffähige Teilergebnisse prüfen will","Wenn Anforderungen häufig geändert und kurzfristig umgesetzt werden"], 1, "Das Wasserfallmodell arbeitet Phase für Phase. Es ist gut planbar, aber späte Änderungen sind teuer – bei stabilen Anforderungen ist das kein Nachteil."],
  ["t1", "pm", "Im Netzplan eines Softwareprojekts hat der Vorgang „Datenbank einrichten“ den frühesten Anfangszeitpunkt FAZ = 8 und den spätesten Anfangszeitpunkt SAZ = 11.\n\nWie groß ist der Gesamtpuffer?", ["0","3","8","11"], 1, "Gesamtpuffer GP = SAZ − FAZ = 11 − 8 = 3. Um so viele Zeiteinheiten kann der Vorgang verschoben werden, ohne das Projektende zu gefährden."],
  ["t1", "pm", "Die Projektleiterin möchte wissen, welche Vorgänge sie besonders eng überwachen muss, weil jede Verzögerung das Projektende verschiebt.\n\nWas kennzeichnet den kritischen Pfad?", ["Die längste Dauer eines einzelnen Vorgangs","Alle Vorgänge mit Gesamtpuffer 0","Die teuersten Vorgänge","Vorgänge ohne Vorgänger"], 1, "Der kritische Pfad ist die Folge der Vorgänge ohne Puffer (GP = 0). Er bestimmt die Gesamtdauer des Projekts."],
  ["t1", "pm", "Ein Team prüft seine User Stories mit dem INVEST-Schema.\n\nWelches Kriterium gehört nicht zu INVEST?", ["Independent","Valuable","Expensive","Testable"], 2, "INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable. Eine Story soll schätzbar (Estimable) sein, nicht teuer."],
  ["t1", "pm", "Ein Pflegedienst führt eine App zur Tourenplanung ein. Pflegekräfte befürchten Überwachung, die Geschäftsführung erwartet Kostensenkungen.\n\nWelche Aussage über eine Stakeholderanalyse stimmt?", ["Sie beschränkt sich auf die Erwartungen der Geschäftsführung und leitet Projektziele ab.","Sie erfasst Interessen und Befürchtungen aller Betroffenen und leitet Maßnahmen ab.","Sie bewertet Risiken nach Eintrittswahrscheinlichkeit und ersetzt damit die Risikoanalyse.","Sie wird nach Projektende erstellt, um die Zufriedenheit der Betroffenen auszuwerten."], 1, "Die Stakeholderanalyse wird früh erstellt und betrachtet alle Beteiligten und Betroffenen – z. B. auch Betriebsrat und Mitarbeitende – samt Maßnahmen wie Schulung oder frühe Einbindung."],
  ["t1", "pm", "Ein Projekt zur Einführung eines CRM-Systems ist abgeschlossen. Die Projektleitung bereitet den Abschluss vor.\n\nWas gehört in den Projektabschluss?", ["Kick-off-Meeting und Meilensteinplanung","Soll-Ist-Vergleich und Lessons Learned","Lastenheft und Projektstrukturplan erstellen","Machbarkeitsstudie und Stakeholderanalyse"], 1, "Zum Abschluss gehören Soll-Ist-Vergleich (Leistung, Kosten, Termine), Abnahme, Abschlussbericht, Lessons Learned und die Übergabe in den Betrieb."],
  ["t1", "pm", "Im Projektplan eines Webshops ist „Freigabe des Designs durch den Kunden“ als Meilenstein eingetragen.\n\nWas ist ein Meilenstein?", ["Ein Vorgang mit festgelegter Dauer, der eine wichtige Projektphase abschließt","Ein Ereignis ohne Dauer, das einen wichtigen Projektzustand markiert","Ein Arbeitspaket auf der untersten Ebene des Projektstrukturplans","Ein Zeitpuffer am Ende einer Phase, der Verzögerungen auffangen soll"], 1, "Meilensteine sind Prüfpunkte ohne Dauer (im Gantt-Diagramm als Raute). An ihnen wird der Fortschritt kontrolliert."],
  ["t1", "pm", "Ein Kunde kann seine Anforderungen an eine neue App nur vage beschreiben. Das Team baut in zwei Wochen eine klickbare Vorabversion.\n\nWozu dient dieser Prototyp?", ["Die Abnahme durch den Kunden formal vorwegnehmen","Anforderungen klären und die Machbarkeit testen","Das Pflichtenheft und die Dokumentation ersetzen","Die endgültige Version direkt produktiv einsetzen"], 1, "Prototypen machen Anforderungen sichtbar und prüfbar. Ein Wegwerf-Prototyp wird danach verworfen, ein evolutionärer Prototyp weiterentwickelt."],
  ["t1", "pm", "Für die Kalkulation eines IT-Projekts werden die Kosten nach Kostenarten gegliedert.\n\nWelche Kosten sind Personalkosten?", ["Laptops der Entwickler","Gehalt der Entwickler","Lizenzen der Entwickler","Miete des Schulungsraums"], 1, "Personalkosten entstehen durch die Arbeitszeit der Beteiligten (Stunden × Stundensatz). Lizenzen, Cloud und Raummiete sind Sachkosten."],
  ["t1", "pm", "Mitten im Projekt wünscht der Kunde eine zusätzliche Exportfunktion, die nicht im Pflichtenheft steht.\n\nWas beschreibt das Change Request Management?", ["Die direkte Umsetzung von Kundenwünschen ohne erneute Bewertung","Die geregelte Bewertung und Umsetzung von Änderungswünschen","Die grundsätzliche Ablehnung von Wünschen außerhalb des Pflichtenhefts","Die geregelte Behebung von Fehlern, die im Betrieb gemeldet werden"], 1, "Änderungswünsche werden dokumentiert, auf Aufwand, Kosten und Termine bewertet, entschieden und erst nach Freigabe umgesetzt – sonst droht unkontrolliertes Wachstum des Umfangs."],
  // ---------- Teil 1: Modellierung & OOP
  ["t1", "mod", "Im Anwendungsfalldiagramm eines Online-Shops kann der Kunde beim Bestellen optional einen Gutschein einlösen.\n\nWelche Beziehung verbindet „Gutschein einlösen“ mit „Bestellung aufgeben“?", ["«include»","«extend»","Generalisierung","Assoziation"], 1, "«extend» beschreibt einen optionalen Zusatzablauf, der nur unter einer Bedingung stattfindet. «include» wird dagegen immer mit ausgeführt."],
  ["t1", "mod", "Im Anwendungsfalldiagramm einer Bank bindet „Geld abheben“ immer „Karte prüfen“ per «include» ein.\n\nWohin zeigt der include-Pfeil?", ["Von „Karte prüfen“ zu „Geld abheben“","Von „Geld abheben“ zu „Karte prüfen“","Vom Akteur zum Anwendungsfall","Der Pfeil hat keine Richtung"], 1, "Der include-Pfeil zeigt vom Basisfall zum eingebundenen Fall („Geld abheben“ benutzt „Karte prüfen“). Beim extend zeigt der Pfeil umgekehrt vom erweiternden zum Basisfall."],
  ["t1", "mod", "Im Klassendiagramm einer Fahrzeugverwaltung steht in der Klasse Fahrzeug das Attribut # kilometerstand: Integer.\n\nWas bedeutet das Zeichen #?", ["public","private","protected","static"], 2, "Sichtbarkeiten: + public, - private, # protected (Klasse und Unterklassen), ~ package."],
  ["t1", "mod", "In einer Rechnungssoftware besteht eine Rechnung aus Positionen. Wird die Rechnung gelöscht, werden auch ihre Positionen gelöscht.\n\nWelche Beziehung modellieren Sie zwischen Rechnung und Position?", ["Assoziation","Aggregation","Komposition","Vererbung"], 2, "Die Positionen sind existenzabhängig vom Ganzen: Komposition, gezeichnet mit gefüllter Raute an der Rechnung."],
  ["t1", "mod", "In einer Zoo-Software ist die Klasse Tier abstrakt; Loewe und Pinguin erben von ihr.\n\nWas trifft auf die abstrakte Klasse Tier zu?", ["Sie kann direkt mit new Tier() instanziiert werden.","Sie darf weder Attribute noch Konstruktoren besitzen.","Von ihr selbst können keine Objekte erzeugt werden.","Sie darf keine Methoden mit Implementierung enthalten."], 2, "Abstrakte Klassen dienen als gemeinsame Oberklasse. Sie dürfen Attribute und konkrete Methoden haben, Objekte gibt es aber nur von den konkreten Unterklassen."],
  ["t1", "mod", "Eine Anwendung soll genau ein Konfigurationsobjekt besitzen, auf das alle Programmteile zugreifen.\n\nWelches Entwurfsmuster stellt sicher, dass es nur eine Instanz gibt?", ["Observer","Factory","Singleton","Prototype"], 2, "Singleton: privater Konstruktor, statisches Attribut für die einzige Instanz und statische Methode getInstance()."],
  ["t1", "mod", "Eine Wetterstation liefert neue Messwerte. Ein Display, eine App und ein Logger sollen automatisch aktualisiert werden, ohne dass die Station sie im Detail kennt.\n\nWelches Entwurfsmuster passt?", ["Singleton","Observer","Facade","Builder"], 1, "Beim Observer meldet sich jeder Beobachter beim Subjekt an. Bei einer Änderung ruft das Subjekt bei allen update() auf."],
  ["t1", "mod", "Ein Grafikprogramm erzeugt Formen über die Methode FormFactory.erzeuge(\"Kreis\"), ohne dass der Aufrufer die konkrete Klasse kennt.\n\nZu welcher Kategorie gehört das Factory-Muster?", ["Strukturmuster","Verhaltensmuster","Erzeugungsmuster","Architekturmuster"], 2, "Erzeugungsmuster kapseln die Objekterzeugung (Factory, Singleton, Builder). Strukturmuster setzen Objekte zusammen, Verhaltensmuster regeln die Zusammenarbeit."],
  ["t1", "mod", "Eine Liste enthält Objekte der Klassen Kreis und Rechteck, beide erben von Form. In einer Schleife wird für jedes Element berechneFlaeche() aufgerufen.\n\nWelches OOP-Prinzip sorgt dafür, dass jeweils die richtige Berechnung läuft?", ["Überladen: gleicher Methodenname, Auswahl anhand der Parameterliste beim Kompilieren","Polymorphie: gleicher Aufruf, Verhalten abhängig vom tatsächlichen Objekttyp","Kapselung: Attribute privat, Zugriff ausschließlich über öffentliche Methoden","Mehrfachvererbung: Kreis und Rechteck erben von mehreren Oberklassen zugleich"], 1, "Polymorphie mit dynamischem Binden: Welche überschriebene Methode läuft, entscheidet sich zur Laufzeit am konkreten Objekt."],
  ["t1", "mod", "Im Klassendiagramm einer Bibliothek gilt: Jede Ausleihe enthält mindestens ein Buch.\n\nWelche Multiplizität steht an der Seite von Buch?", ["0..1","1","1..*","*"], 2, "1..* bedeutet mindestens eins, beliebig viele. * bzw. 0..* erlaubt auch keins, 0..1 höchstens eins."],
  ["t1", "mod", "Eine Webanwendung ist nach dem MVC-Muster aufgebaut. Ein Klick auf „Speichern“ soll verarbeitet werden.\n\nWelche Komponente ist für die Verarbeitung der Benutzereingabe zuständig?", ["Model","View","Controller","ViewModel"], 2, "Der Controller nimmt Eingaben entgegen, ruft das Model auf (Daten, Logik) und sorgt für die Aktualisierung der View (Darstellung)."],
  ["t1", "mod", "Für einen Getränkeautomaten sollen die Zustände „Bereit“, „Geld eingeworfen“ und „Ausgabe“ sowie die Wechsel dazwischen modelliert werden.\n\nWas beschreibt ein Zustandsdiagramm?", ["Den zeitlichen Nachrichtenaustausch zwischen mehreren Objekten","Die Zustände eines Objekts und die Übergänge durch Ereignisse","Die Abfolge von Aktionen mit Verzweigungen und parallelen Abläufen","Die Klassen eines Systems mit Attributen und ihren Beziehungen"], 1, "Das Zustandsdiagramm zeigt Zustände (abgerundete Rechtecke) und Transitionen mit Ereignis [Bedingung] / Aktion."],
  ["t1", "mod", "Im Aktivitätsdiagramm einer Bestellabwicklung sollen „Rechnung erstellen“ und „Ware verpacken“ gleichzeitig ablaufen.\n\nWie wird die Aufteilung in parallele Abläufe dargestellt?", ["Mit einer Raute (Decision)","Mit einem dicken Balken (Fork)","Mit gestrichelten Pfeilen (Include)","Mit einer Swimlane (Partition)"], 1, "Der Fork-Balken teilt einen Fluss in parallele Flüsse, der Join-Balken führt sie wieder zusammen und wartet, bis alle fertig sind. Die Raute steht für Entscheidungen."],
  // ---------- Teil 1: Sicherheit & Netzwerk
  ["t1", "sec", "Ein Onlineshop ist per HTTPS erreichbar. Beim Verbindungsaufbau wird ein Sitzungsschlüssel ausgehandelt.\n\nWelches Verfahren nutzt TLS für die eigentliche Datenübertragung?", ["Asymmetrische Verschlüsselung mit dem öffentlichen Schlüssel des Servers","Digitale Signatur jedes Datenpakets mit dem privaten Schlüssel des Servers","Symmetrische Verschlüsselung mit dem ausgehandelten Sitzungsschlüssel","Asymmetrische Verschlüsselung mit dem ausgehandelten Sitzungsschlüssel"], 2, "TLS arbeitet hybrid: Der Schlüsselaustausch erfolgt asymmetrisch, die Nutzdaten werden schnell symmetrisch (z. B. AES) verschlüsselt. Der ausgehandelte Sitzungsschlüssel ist ein symmetrischer Schlüssel."],
  ["t1", "sec", "Frau Klein möchte Herrn Weber eine vertrauliche Datei schicken, die nur er öffnen kann. Beide nutzen asymmetrische Verschlüsselung.\n\nMit welchem Schlüssel verschlüsselt Frau Klein?", ["Mit dem privaten Schlüssel von Frau Klein","Mit dem öffentlichen Schlüssel von Herrn Weber","Mit dem privaten Schlüssel von Herrn Weber","Mit dem öffentlichen Schlüssel von Frau Klein"], 1, "Verschlüsselt wird mit dem öffentlichen Schlüssel des Empfängers; entschlüsseln kann nur er mit seinem privaten Schlüssel."],
  ["t1", "sec", "Die Personalabteilung verschickt Arbeitsverträge per E-Mail und will beweisen, dass sie wirklich von ihr stammen und unverändert sind.\n\nWomit wird die digitale Signatur erstellt?", ["Mit dem öffentlichen Schlüssel des Empfängers","Mit dem privaten Schlüssel des Absenders","Mit dem öffentlichen Schlüssel des Absenders","Mit dem Passwort des Empfängers"], 1, "Der Hashwert des Dokuments wird mit dem privaten Schlüssel des Absenders signiert. Prüfen kann jeder mit dessen öffentlichem Schlüssel."],
  ["t1", "sec", "Ein Angreifer verändert unbemerkt die Messwerte der Temperatursensoren in einem Kühlhaus.\n\nWelches Schutzziel ist verletzt?", ["Vertraulichkeit","Integrität","Verfügbarkeit","Anonymität"], 1, "Integrität bedeutet, dass Daten vollständig und unverändert sind. Vertraulichkeit wäre verletzt, wenn Unbefugte die Werte lesen könnten."],
  ["t1", "sec", "Ein Onlineshop ist am Black Friday nicht erreichbar, weil ein Botnetz ihn mit Millionen Anfragen überlastet.\n\nWelches Schutzziel greift dieser DDoS-Angriff an?", ["Vertraulichkeit","Integrität","Verfügbarkeit","Authentizität"], 2, "Ein (D)DoS-Angriff soll einen Dienst lahmlegen – er richtet sich gegen die Verfügbarkeit."],
  ["t1", "sec", "Ein Kundenportal soll die Passwörter seiner Nutzer speichern.\n\nWie speichert man Passwörter richtig?", ["Verschlüsselt, z. B. mit AES-256","Als Base64-Kodierung, z. B. per btoa","Als Hash mit Salt, z. B. mit bcrypt","Als Hash ohne Salt, z. B. mit MD5"], 2, "Passwörter werden nicht entschlüsselbar gespeichert, sondern mit einer langsamen Hashfunktion und zufälligem Salt pro Benutzer. Base64 ist nur eine Kodierung. Verwechslungsgefahr: Ein schneller Hash wie MD5 ohne Salt ist über Rainbow Tables angreifbar."],
  ["t1", "sec", "Im Login eines Webportals wird die Eingabe direkt in eine SQL-Abfrage eingesetzt. Ein Angreifer gibt ' OR 1=1 -- ein.\n\nWas schützt am besten vor SQL-Injection?", ["Verschlüsselte Verbindung (HTTPS mit TLS 1.3)","Prepared Statements (parametrisierte Abfragen)","Paketfilter-Firewall (Sperre externer Ports)","Passwortrichtlinie (lange und komplexe Passwörter)"], 1, "Bei Prepared Statements werden Eingaben nur als Daten übergeben, nie als SQL-Code interpretiert. Ergänzend: Eingabevalidierung und minimale Datenbankrechte."],
  ["t1", "sec", "Eine Bank führt für das Online-Banking Zwei-Faktor-Authentifizierung ein.\n\nWelche Kombination ist echte Zwei-Faktor-Authentifizierung?", ["Passwort + Antwort auf eine Sicherheitsfrage","Passwort + Code aus einer Authenticator-App","PIN + zusätzliches, separat vergebenes Passwort","Benutzername + Passwort aus dem Passwortmanager"], 1, "Die Faktoren müssen aus verschiedenen Kategorien stammen: Wissen (Passwort), Besitz (Smartphone mit App), Inhärenz (Fingerabdruck). Passwort und PIN sind beide Wissen."],
  ["t1", "sec", "Beim Aufruf des Onlinebankings zeigt der Browser ein gültiges Zertifikat an.\n\nWas bestätigt die Zertifizierungsstelle (CA) damit?", ["Die Geheimhaltung des privaten Schlüssels durch den Serverbetreiber","Die Zugehörigkeit eines öffentlichen Schlüssels zu einer Identität","Die Verschlüsselung der Daten mit dem privaten Schlüssel der CA","Die Sicherheit der Serversoftware gegen bekannte Schwachstellen"], 1, "Die CA signiert das Zertifikat und bestätigt damit, dass der öffentliche Schlüssel zur angegebenen Domain bzw. Organisation gehört."],
  ["t1", "sec", "In einem Windows-Netzwerk mit Active Directory erhalten Benutzer nach der Anmeldung Tickets, mit denen sie auf Dienste zugreifen, ohne das Passwort erneut zu senden.\n\nWelches Protokoll arbeitet mit Tickets und einem Key Distribution Center?", ["RADIUS","Kerberos","OAuth 2.0","NTLM"], 1, "Kerberos nutzt eine vertrauenswürdige dritte Stelle (KDC), die Ticket Granting Tickets und Service-Tickets ausstellt."],
  ["t1", "sec", "Ein Unternehmen führt Single Sign-On für alle internen Anwendungen ein.\n\nWas ist ein Nachteil von Single Sign-On?", ["Nutzer müssen sich viele Passwörter merken.","Ein gestohlener Zugang öffnet viele Dienste.","Konten werden dezentral je Dienst verwaltet.","Nutzer müssen sich bei jedem Dienst neu anmelden."], 1, "SSO ist ein Single Point of Failure: Wird ein Zugang kompromittiert oder fällt der Identity Provider aus, sind alle Dienste betroffen. Deshalb SSO mit MFA kombinieren."],
  ["t1", "sec", "Ein Unternehmen verbindet sein Büronetz 192.168.10.0/24 mit dem Lagernetz 192.168.20.0/24. Dafür wird ein Router eingesetzt.\n\nAuf welcher OSI-Schicht arbeitet der Router?", ["Schicht 1 – Bitübertragung","Schicht 2 – Sicherung","Schicht 3 – Vermittlung","Schicht 7 – Anwendung"], 2, "Router verbinden verschiedene Netze und leiten Pakete anhand von IP-Adressen weiter (Schicht 3). Switches arbeiten mit MAC-Adressen auf Schicht 2."],
  ["t1", "sec", "Ein Administrator liest am Drucker die Hardwareadresse 00:1A:2B:3C:4D:5E ab.\n\nWie lang ist eine MAC-Adresse?", ["32 Bit","48 Bit","64 Bit","128 Bit"], 1, "Eine MAC-Adresse hat 6 Byte = 48 Bit, hexadezimal geschrieben. Die ersten 3 Byte kennzeichnen den Hersteller (OUI). 32 Bit hat IPv4, 128 Bit IPv6."],
  ["t1", "sec", "Ein Weingut will auf mehreren Kilometern Rebfläche Bodenfeuchtesensoren mit Batterie betreiben, die jahrelang halten sollen. Es werden nur wenige Messwerte pro Stunde übertragen.\n\nWelche Netzart eignet sich?", ["WLAN, z. B. Wi-Fi 6","WPAN, z. B. Bluetooth","LPWAN, z. B. LoRaWAN","LAN, z. B. Ethernet"], 2, "LPWAN (Low Power Wide Area Network) bietet große Reichweite bei sehr geringem Energieverbrauch, aber niedriger Datenrate – ideal für IoT-Sensoren."],
  ["t1", "sec", "Ein Rechenzentrum stellt mehreren Datenbankservern schnellen Speicher über ein eigenes Netz mit Blockzugriff bereit.\n\nWas ist ein SAN?", ["Ein Dateiserver im LAN, der Speicher per SMB oder NFS auf Dateiebene freigibt","Ein eigenes Hochgeschwindigkeitsnetz für Speicher mit Blockzugriff","Ein direkt an einen einzelnen Server angeschlossener Blockspeicher ohne eigenes Netz","Ein Cloud-Speicherdienst, der Dateien über HTTPS im Internet bereitstellt"], 1, "Ein Storage Area Network stellt Speicher auf Blockebene bereit (wie eine lokale Festplatte). Ein NAS ist dagegen ein Dateiserver im LAN mit Dateizugriff (SMB, NFS)."],
  ["t1", "sec", "Eine Arztpraxis verarbeitet Gesundheitsdaten und muss nach DSGVO technisch-organisatorische Maßnahmen umsetzen.\n\nWelche Maßnahme ist eine TOM?", ["Datenschutzerklärung auf der Website","Zugriffskontrolle mit Rollenkonzept","Einwilligungserklärung der Patienten","Auskunft an Patienten nach Art. 15 DSGVO"], 1, "TOM schützen Daten technisch oder organisatorisch: Zutritts-, Zugangs- und Zugriffskontrolle, Verschlüsselung, Protokollierung, Backups. Die Datenschutzerklärung ist eine Informationspflicht, die Einwilligung eine Rechtsgrundlage der Verarbeitung und die Auskunft ein Betroffenenrecht."],
  ["t1", "sec", "Ein Entwicklungsteam integriert seine Änderungen mehrmals täglich in den Hauptzweig. Jeder Commit wird automatisch gebaut und getestet.\n\nWas beschreibt CI in CI/CD?", ["Code wird häufig integriert, automatisch gebaut und getestet.","Code wird nach jedem Build automatisch in Produktion ausgeliefert.","Code wird einmal pro Sprint zusammengeführt und manuell getestet.","Code wird vor jedem Merge von einem Kollegen manuell begutachtet."], 0, "Continuous Integration: häufig zusammenführen, automatisch bauen und testen – Fehler fallen sofort auf. CD (Delivery/Deployment) automatisiert anschließend die Auslieferung."],
  // ---------- Teil 1: Web, UI & Qualität
  ["t1", "ux", "Eine REST-API eines Onlineshops verwaltet Kunden unter /api/kunden.\n\nWelche HTTP-Methode legt einen neuen Kunden an?", ["GET","POST","DELETE","HEAD"], 1, "CRUD ↔ HTTP: Create → POST, Read → GET, Update → PUT/PATCH, Delete → DELETE."],
  ["t1", "ux", "Eine App ruft GET /api/kunden/9999 auf. Einen Kunden mit dieser Nummer gibt es nicht.\n\nWelchen Statuscode liefert der Server?", ["200 OK","201 Created","404 Not Found","500 Internal Server Error"], 2, "4xx sind Clientfehler: Die angefragte Ressource existiert nicht. 5xx würde einen Fehler auf dem Server bedeuten."],
  ["t1", "ux", "Eine App ruft eine geschützte Ressource auf, ohne ein gültiges Token mitzuschicken.\n\nWelcher Statuscode passt?", ["401 Unauthorized","403 Forbidden","409 Conflict","503 Service Unavailable"], 0, "401: nicht oder nicht korrekt angemeldet. 403: angemeldet, aber ohne Berechtigung für diese Ressource."],
  ["t1", "ux", "Eine REST-API soll auf mehrere Server verteilt werden, ohne dass Sitzungsdaten zwischen ihnen abgeglichen werden müssen.\n\nWas bedeutet „zustandslos“ bei REST?", ["Der Server speichert keinerlei Daten, auch nicht in der Datenbank.","Jede Anfrage enthält alle nötigen Informationen, z. B. das Token.","Der Server hält die Sitzung im Speicher, z. B. über eine Session-ID.","Der Client speichert Antworten, damit der Server sie nicht erneut sendet."], 1, "Der Server merkt sich zwischen zwei Anfragen keinen Sitzungszustand. Deshalb kann jede Anfrage von einem beliebigen Server beantwortet werden – gut für Skalierung."],
  ["t1", "ux", "Ein Lieferant schickt eine XML-Bestellung. Alle Tags sind korrekt geschlossen und verschachtelt, es fehlt aber das in der DTD vorgeschriebene Element <lieferdatum>.\n\nWie ist das Dokument zu bewerten?", ["Gültig, aber nicht wohlgeformt","Wohlgeformt, aber nicht gültig","Weder wohlgeformt noch gültig","Wohlgeformt und gültig"], 1, "Wohlgeformt = Syntaxregeln eingehalten. Gültig = zusätzlich konform zur DTD bzw. zum XML-Schema. Ein gültiges Dokument ist immer auch wohlgeformt."],
  ["t1", "ux", "Die Website einer Stadtverwaltung soll auch für sehbehinderte Menschen mit Screenreader nutzbar sein.\n\nWelche Maßnahme verbessert die Barrierefreiheit?", ["Informationen nur über Farbe vermitteln","Alternativtexte für Bilder","Kleine Schrift","Bedienung nur per Maus"], 1, "Screenreader lesen Alternativtexte vor. Weitere Maßnahmen: ausreichender Kontrast, skalierbare Schrift, Tastaturbedienung, nicht nur über Farbe informieren (BITV, WCAG)."],
  ["t1", "ux", "In einer Bürosoftware öffnet Strg + S plötzlich das Drucken statt das Speichern. Die Nutzer sind irritiert.\n\nWelcher Dialoggrundsatz der ISO 9241-110 ist verletzt?", ["Steuerbarkeit","Erwartungskonformität","Fehlertoleranz","Individualisierbarkeit"], 1, "Erwartungskonformität: Der Dialog verhält sich so, wie Nutzer es aus Erfahrung und Konventionen erwarten."],
  ["t1", "ux", "Vor der Entwicklung einer Kunden-App zeigt das Team dem Auftraggeber gezeichnete Bildschirmentwürfe.\n\nWas ist ein Vorteil von Mockups?", ["Den fertigen Oberflächencode aus dem Entwurf übernehmen","Früh Feedback einholen, bevor programmiert wird","Die Ladezeiten der App messen, bevor programmiert wird","Den Abnahmetest mit dem Auftraggeber ersetzen"], 1, "Änderungen am Entwurf sind billig, Änderungen am fertigen Code teuer. Mockups vermeiden Missverständnisse über die Oberfläche."],
  ["t1", "ux", "Ein Softwarehaus übernimmt eine Anwendung, deren Code kaum dokumentiert und schwer zu ändern ist. Neue Funktionen dauern deshalb sehr lange.\n\nWelches Qualitätsmerkmal nach ISO/IEC 25010 ist hier mangelhaft?", ["Zuverlässigkeit","Wartbarkeit","Benutzbarkeit","Kompatibilität"], 1, "Wartbarkeit beschreibt, wie leicht Software analysiert, geändert, getestet und wiederverwendet werden kann. Zuverlässigkeit betrifft dagegen den fehlerfreien Betrieb."],
  ["t1", "ux", "In einem Entwicklungsteam häufen sich Fehler, die erst beim Kunden auffallen.\n\nWelche Maßnahme sichert die Qualität bereits während der Entwicklung?", ["Code-Reviews","Mehr Meetings","Längere Arbeitszeiten","Verzicht auf Dokumentation"], 0, "Beim Code-Review prüft ein zweiter Entwickler den Code vor der Übernahme. Weitere Maßnahmen: Pair Programming, automatisierte Tests, Coding-Standards, statische Codeanalyse."],
  ["t1", "ux", "Eine App sendet per POST ein JSON-Objekt an eine REST-API.\n\nWelche Angabe gehört in den HTTP-Header?", ["Die Nutzdaten, z. B. {\"telefon\": \"0611-123\"}","Content-Type: application/json","Der Statuscode 201 Created der Antwort","Die SQL-Anweisung INSERT INTO kunde"], 1, "Header enthalten Metadaten zur Anfrage, z. B. Content-Type, Accept und Authorization. Die eigentlichen Daten stehen im Body, der Statuscode steht in der Statuszeile der Antwort."],
  ["t1", "ux", "Ein Kunde ändert in der App nur seine Telefonnummer. Die API bietet PUT und PATCH für /api/kunden/42 an.\n\nWodurch unterscheidet sich PATCH von PUT?", ["PUT ändert nur die übergebenen Felder, PATCH ersetzt die ganze Ressource.","PATCH ändert nur die übergebenen Felder, PUT ersetzt die ganze Ressource.","PATCH legt eine neue Ressource an, PUT ändert eine bestehende Ressource.","PATCH liest die Telefonnummer aus, PUT ersetzt die ganze Ressource."], 1, "PUT überträgt die vollständige Ressource und ersetzt sie (idempotent). PATCH überträgt nur die Änderungen – hier nur die Telefonnummer."],

  // ---------- Teil 2: Pseudocode & Algorithmen
  ["t2", "algo", "Eine Wetterstation speichert Tagestiefsttemperaturen im Array werte: Double[]. Im Winter sind alle Werte negativ. Gesucht ist der höchste Wert.\n\nWomit initialisieren Sie die Variable max am sichersten?", ["max = 0","max = werte[0]","max = -1","max = werte.length"], 1, "Mit dem ersten Element ist max immer ein echter Wert aus dem Array. Mit 0 oder -1 bliebe max bei lauter negativen Werten (z. B. -3, -7) falsch auf 0 bzw. -1 stehen."],
  ["t2", "algo", "Ein Algorithmus durchläuft ein Array mit für i = 0 bis werte.length und greift auf werte[i] zu.\n\nWas passiert im letzten Durchlauf?", ["Es wird auf das letzte Element innerhalb des Arrays zugegriffen.","Es wird auf ein Element außerhalb des Arrays zugegriffen.","Es wird erneut auf das erste Element des Arrays zugegriffen.","Die Schleife bricht vorher ab, da i den Wert werte.length erreicht."], 1, "Die Indizes laufen von 0 bis length - 1. Mit „bis werte.length“ greift der letzte Durchlauf auf werte[length] zu – einen Index, den es nicht gibt (Off-by-one-Fehler, Laufzeitfehler)."],
  ["t2", "algo", "Ein Sortierverfahren vergleicht immer zwei benachbarte Elemente und vertauscht sie, wenn sie in falscher Reihenfolge stehen. Nach jedem Durchlauf steht das größte Element hinten.\n\nUm welches Verfahren handelt es sich?", ["Selection Sort","Insertion Sort","Bubble Sort","Binäre Suche"], 2, "Bubble Sort lässt große Elemente wie Blasen nach hinten „aufsteigen“. Selection Sort sucht das Minimum, Insertion Sort fügt in einen sortierten Teil ein."],
  ["t2", "algo", "Ein Verfahren sucht in jedem Durchlauf im noch unsortierten Rest das kleinste Element und tauscht es an die erste Position dieses Rests.\n\nUm welches Sortierverfahren handelt es sich?", ["Bubble Sort","Selection Sort","Insertion Sort","Quick Sort"], 1, "Selection Sort („Sortieren durch Auswählen“) braucht immer O(n²) Vergleiche, aber höchstens n - 1 Tauschvorgänge."],
  ["t2", "algo", "Eine Kundenliste ist bereits nach Namen sortiert. Täglich kommen wenige neue Kunden am Ende hinzu, danach wird neu sortiert.\n\nWelches Verfahren ist hier am schnellsten?", ["Selection Sort","Insertion Sort","Bubble Sort ohne vorzeitigen Abbruch","Alle sind gleich schnell"], 1, "Insertion Sort muss bei fast sortierten Daten kaum etwas verschieben; der Aufwand liegt dann nahe O(n). Selection Sort braucht immer O(n²) Vergleiche."],
  ["t2", "algo", "Ein Online-Shop sortiert seine Artikelliste mit Bubble Sort. Die Anzahl der Artikel verdoppelt sich.\n\nWelche Laufzeitklasse hat Bubble Sort im Durchschnitt?", ["O(log n)","O(n)","O(n · log n)","O(n²)"], 3, "Zwei verschachtelte Schleifen über die Daten: quadratischer Aufwand. Bei doppelter Datenmenge braucht das Sortieren etwa viermal so lange."],
  ["t2", "algo", "Ein Entwickler will in einem Array mit 10.000 Artikelnummern die binäre Suche einsetzen.\n\nWelche Voraussetzung muss erfüllt sein?", ["Das Array ist unsortiert.","Das Array ist sortiert.","Die Daten liegen in einer verketteten Liste.","Die Suche ist rekursiv programmiert."], 1, "Nur bei sortierten Daten lässt sich nach dem Vergleich mit dem mittleren Element eine Hälfte sicher ausschließen."],
  ["t2", "algo", "Ein Algorithmus verteilt 17 Pakete gleichmäßig auf 5 Fahrzeuge. Die Restpakete übernimmt ein Kurier.\n\nWas liefert 17 mod 5?", ["2","3","3,4","12"], 0, "mod liefert den Rest der ganzzahligen Division: 17 = 3 · 5 + 2. Typischer Einsatz: gerade/ungerade prüfen (x mod 2 = 0)."],
  ["t2", "algo", "Im selben Beispiel sollen 17 Pakete auf 5 Fahrzeuge verteilt werden.\n\nWas liefert die ganzzahlige Division 17 div 5?", ["2","3","3,4","12"], 1, "div liefert nur den ganzzahligen Anteil: 17 div 5 = 3. Jedes Fahrzeug bekommt 3 Pakete, 2 bleiben übrig (17 mod 5)."],
  ["t2", "algo", "Im Schreibtischtest soll folgender Pseudocode ausgewertet werden:\n```\nsumme = 0\nfür i = 1 bis 4\n  summe = summe + i * 2\nende für\n```\n\nWelchen Wert hat summe am Ende?", ["10","12","20","30"], 2, "i = 1: 2, i = 2: 6, i = 3: 12, i = 4: 20. Die Schleife läuft einschließlich 4. Verwechslungsgefahr: 12 ergibt sich, wenn die Schleife fälschlich nur bis 3 läuft, 10 ohne den Faktor 2, 30 bei einem Durchlauf bis 5."],
  ["t2", "algo", "Ein Entwickler schreibt eine Methode fakultaet(n), die sich selbst mit n - 1 aufruft.\n\nWas ist bei einer rekursiven Methode zwingend nötig?", ["Eine Zählschleife (for-Schleife) um den Aufruf","Eine Abbruchbedingung (Rekursionsanker)","Eine globale Variable (Zwischenspeicher)","Ein zweiter Parameter (Akkumulator)"], 1, "Ohne Anker (z. B. wenn n <= 1 dann Rückgabe 1) ruft sich die Methode endlos auf, bis der Aufrufstapel überläuft."],
  ["t2", "algo", "Ein Kino speichert die Belegung im 2D-Array sitz[reihe][platz]. Gesucht ist die Anzahl belegter Plätze in Reihe r.\n\nWie gehen Sie vor?", ["Schleife über alle Reihen bei festem Platz r","Schleife über alle Plätze bei fester Reihe r","Doppelschleife über alle Reihen und alle Plätze","Den Wert sitz[r].length als Anzahl auslesen"], 1, "Die Reihe ist fest (erster Index r), es wird über den zweiten Index (Platz) iteriert. sitz[r].length liefert nur die Anzahl der Plätze, nicht die belegten."],
  ["t2", "algo", "Ein Sortieralgorithmus nutzt die Methode vergleiche(a, b), um Kunden nach Umsatz zu sortieren.\n\nWann liefert vergleiche(a, b) einen positiven Wert?", ["Wenn a kleiner als b ist","Wenn a gleich b ist","Wenn a größer als b ist","Wenn a ungleich b ist"], 2, "Konvention: negativ bei a < b, 0 bei Gleichheit, positiv bei a > b. Bei positivem Ergebnis werden in einer aufsteigenden Sortierung a und b getauscht."],
  ["t2", "algo", "In einem Programm sind summe = 7 und anzahl = 2 als Integer deklariert. Es wird durchschnitt = summe / anzahl berechnet.\n\nWelchen Wert erhält durchschnitt?", ["3,5","3","4","Fehlermeldung"], 1, "Integer / Integer ist eine ganzzahlige Division und schneidet ab. Richtig: einen Operanden als Double rechnen, z. B. summe / 2.0 oder (Double) summe / anzahl."],
  // ---------- Teil 2: SQL
  ["t2", "sql", "Die Rheinhessen IT GmbH möchte nur die Kunden anzeigen, die mehr als zwei Bestellungen aufgegeben haben. Die Abfrage gruppiert dazu nach Kunde.\n\nIn welche Klausel gehört die Bedingung COUNT(*) > 2?", ["WHERE","HAVING","ORDER BY","FROM"], 1, "WHERE filtert einzelne Zeilen vor der Gruppierung und kennt noch keine Gruppenergebnisse. Bedingungen auf Aggregatfunktionen wie COUNT oder SUM stehen deshalb im HAVING."],
  ["t2", "sql", "Für eine Kundenübersicht sollen alle Kunden mit ihren Bestellungen erscheinen, auch Kunden, die noch nie bestellt haben.\n\nWelcher Join liefert dieses Ergebnis?", ["Kunde INNER JOIN Bestellung","Kunde LEFT JOIN Bestellung","Kunde RIGHT JOIN Bestellung","Kunde CROSS JOIN Bestellung"], 1, "Der LEFT JOIN behält alle Zeilen der linken Tabelle (Kunde). Fehlt ein Partner in Bestellung, sind dessen Spalten NULL. Der INNER JOIN würde Kunden ohne Bestellung weglassen."],
  ["t2", "sql", "Ein Entwickler zählt die Bestellungen je Kunde mit Kunde LEFT JOIN Bestellung und COUNT(*). Die Bäckerei Roth hat noch nie bestellt.\n\nWelche Anzahl zeigt die Abfrage für die Bäckerei Roth?", ["0","1","NULL","Fehlermeldung"], 1, "Der LEFT JOIN erzeugt für die Bäckerei eine Zeile mit NULL-Werten in den Bestellspalten. COUNT(*) zählt diese Zeile mit, also 1. Richtig ist COUNT(B.BID): Es zählt nur Werte, die nicht NULL sind, und liefert 0."],
  ["t2", "sql", "In der Tabelle Kunde ist bei einigen Kunden keine E-Mail-Adresse hinterlegt. Diese Kunden sollen angeschrieben werden.\n\nWelche Bedingung findet die Kunden ohne E-Mail-Adresse?", ["WHERE Email = NULL","WHERE Email IS NULL","WHERE Email == NULL","WHERE Email LIKE NULL"], 1, "NULL bedeutet „unbekannt“. Jeder Vergleich mit = oder LIKE ergibt wieder „unbekannt“ und damit nie wahr. Auf NULL prüft man nur mit IS NULL bzw. IS NOT NULL."],
  ["t2", "sql", "Der Preis des Artikels 102 (Monitor 27 Zoll) steigt auf 269,90 €.\n\nMit welchem SQL-Befehl ändern Sie den vorhandenen Datensatz?", ["ALTER","UPDATE","INSERT","MODIFY"], 1, "UPDATE ändert Werte vorhandener Zeilen (DML): UPDATE Artikel SET Preis = 269.90 WHERE ArtNr = 102. ALTER ändert dagegen die Struktur einer Tabelle (DDL)."],
  ["t2", "sql", "Die Tabelle Kunde soll zusätzlich eine Telefonnummer speichern.\n\nWelcher Befehl ergänzt die Spalte?", ["UPDATE TABLE Kunde ADD Telefon VARCHAR(30)","ALTER TABLE Kunde ADD Telefon VARCHAR(30)","ALTER TABLE Kunde MODIFY Telefon VARCHAR(30)","INSERT COLUMN Telefon VARCHAR(30) INTO Kunde"], 1, "Strukturänderungen gehören zur DDL. ALTER TABLE … ADD fügt eine Spalte mit Datentyp hinzu, ALTER TABLE … DROP COLUMN entfernt sie."],
  ["t2", "sql", "Der Auszubildende mit dem Datenbankbenutzer azubi soll die Tabelle Artikel lesen, aber nicht ändern dürfen.\n\nWelche Anweisung vergibt genau dieses Recht?", ["GRANT SELECT ON Artikel TO azubi;","ALLOW READ Artikel azubi;","REVOKE SELECT ON Artikel FROM azubi;","SET RIGHTS Artikel = 'read' FOR azubi;"], 0, "Rechte werden mit GRANT vergeben und mit REVOKE entzogen (DCL). SELECT erlaubt nur das Lesen."],
  ["t2", "sql", "Im Kundenstamm wird nach einem Namen gesucht, der „Meier“, „Maier“ oder „Mayer“ geschrieben sein kann. Die Bedingung lautet Name LIKE 'M_ier'.\n\nWas bewirkt der Unterstrich?", ["Er steht für beliebig viele Zeichen am Anfang.","Er steht für genau ein beliebiges Zeichen an dieser Stelle.","Er steht für beliebig viele Zeichen an dieser Stelle, auch keins.","Er wird als normales Zeichen „_“ an dieser Stelle gesucht."], 1, "Bei LIKE steht _ für genau ein Zeichen, % für beliebig viele (auch keins). 'M_ier' findet Meier und Maier, aber nicht Mayer."],
  ["t2", "sql", "Eine Abfrage gruppiert die Artikel mit GROUP BY Kategorie und berechnet den Durchschnittspreis.\n\nWelche Spalten dürfen im SELECT stehen?", ["Beliebige Spalten der Tabelle Artikel und Aggregatfunktionen","Nur die Gruppierungsspalten und Aggregatfunktionen","Nur Aggregatfunktionen, aber keine Gruppierungsspalten","Nur die Gruppierungsspalten, aber keine Aggregatfunktionen"], 1, "Pro Gruppe entsteht genau eine Ergebniszeile. Eine Spalte wie Bezeichnung hat in einer Gruppe aber mehrere Werte. Deshalb sind nur Gruppierungsspalten und Aggregate wie AVG(Preis) erlaubt."],
  ["t2", "sql", "Ein Kollege führt in der Produktivdatenbank die Anweisung UPDATE Artikel SET Preis = 0; aus.\n\nWas passiert?", ["Es erscheint eine Fehlermeldung, weil WHERE fehlt.","Nichts, weil kein Artikel ausgewählt ist.","Der Preis aller Artikel wird auf 0 gesetzt.","Nur der erste Artikel der Tabelle erhält den Preis 0."], 2, "Ohne WHERE gilt UPDATE (und ebenso DELETE) für alle Zeilen der Tabelle. Vor Änderungen deshalb die Bedingung erst mit einem SELECT testen und in einer Transaktion arbeiten."],
  ["t2", "sql", "Die Suche nach Kunden über den Ort ist bei großen Datenmengen langsam. Ein Kollege schlägt einen Index auf Kunde(Ort) vor.\n\nWas bewirkt der Index?", ["Er spart Speicher, da gleiche Orte zusammengefasst werden.","Er beschleunigt Suche und Sortierung nach dem Ort.","Er beschleunigt INSERT und UPDATE auf der Tabelle Kunde.","Er stellt sicher, dass jeder Ort eindeutig vorkommt."], 1, "Ein Index ist eine zusätzliche, sortierte Zugriffsstruktur. Lesen wird schneller, dafür kostet er Speicher und verlangsamt INSERT, UPDATE und DELETE etwas, weil er mitgepflegt werden muss."],
  ["t2", "sql", "Sie schreiben in der Prüfung eine Abfrage mit Gruppierung und Sortierung.\n\nIn welcher Reihenfolge müssen die Klauseln notiert werden?", ["SELECT, FROM, GROUP BY, WHERE, HAVING, ORDER BY","SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY","SELECT, FROM, WHERE, HAVING, GROUP BY, ORDER BY","FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY"], 1, "Die Schreibreihenfolge ist fest: SELECT – FROM (mit JOIN … ON) – WHERE – GROUP BY – HAVING – ORDER BY. Eine falsche Reihenfolge ist ein Syntaxfehler."],
  ["t2", "sql", "Jede Preisänderung in der Tabelle Artikel soll automatisch in einer Protokolltabelle festgehalten werden, egal welches Programm die Änderung auslöst.\n\nWelches Datenbankobjekt eignet sich dafür?", ["Ein Index, der bei UPDATE auf Artikel aktualisiert wird","Ein Trigger, der bei UPDATE auf Artikel ausgeführt wird","Eine View, die alle Preisänderungen auf Artikel anzeigt","Eine Stored Procedure, die das Programm nach UPDATE aufruft"], 1, "Ein Trigger startet automatisch bei INSERT, UPDATE oder DELETE auf einer Tabelle. Er eignet sich für Protokollierung und Plausibilitätsprüfungen direkt in der Datenbank. Verwechslungsgefahr: Eine Stored Procedure läuft nur, wenn ein Programm sie ausdrücklich aufruft."],
  ["t2", "sql", "Die Kundenliste der Filiale Mainz und die der Filiale Worms sollen untereinander ausgegeben werden. Ein Kunde, der in beiden Listen steht, soll zweimal erscheinen.\n\nWelchen Operator verwenden Sie?", ["UNION – er entfernt Duplikate","UNION ALL – er behält Duplikate","JOIN – er setzt die Tabellen nebeneinander","INTERSECT – er liefert nur gemeinsame Zeilen"], 1, "UNION und UNION ALL hängen Ergebnisse gleicher Spaltenstruktur untereinander. UNION entfernt doppelte Zeilen, UNION ALL behält sie und ist dadurch auch schneller."],
  // ---------- Teil 2: Datenmodell
  ["t2", "dm", "Eine Tierarztpraxis speichert in der Tabelle Halter das Feld Telefonnummern mit dem Inhalt „0611-123, 0171-456“.\n\nWelche Normalform ist verletzt?", ["1. Normalform","2. Normalform","3. Normalform","Keine"], 0, "Die 1. NF verlangt atomare Werte: pro Feld genau ein Wert. Mehrere Telefonnummern gehören in eine eigene Tabelle (z. B. Telefon mit Fremdschlüssel auf Halter)."],
  ["t2", "dm", "Die Tabelle Kunde eines Online-Shops hat die Spalten KundenNr (PK), Name, PLZ und Ort.\n\nWelche Normalform ist verletzt?", ["1. Normalform","2. Normalform","3. Normalform","Keine"], 2, "Ort hängt nicht direkt vom Schlüssel ab, sondern über PLZ: KundenNr → PLZ → Ort. Diese transitive Abhängigkeit verletzt die 3. NF. Lösung: eigene Tabelle Ort(PLZ, Ort)."],
  ["t2", "dm", "Sie prüfen mehrere Tabellen eines Fitnessstudios auf die 2. Normalform.\n\nBei welchen Tabellen kann die 2. NF überhaupt verletzt sein?", ["Bei Tabellen mit zusammengesetztem Primärschlüssel","Bei Tabellen mit einem einspaltigen Primärschlüssel","Bei Tabellen mit Fremdschlüsseln auf andere Tabellen","Bei Tabellen mit transitiv abhängigen Nichtschlüsselspalten"], 0, "Die 2. NF verbietet, dass ein Nichtschlüsselattribut nur von einem Teil des Schlüssels abhängt. Besteht der Schlüssel aus nur einem Attribut, gibt es keinen Teil – die 2. NF ist dann automatisch erfüllt. Verwechslungsgefahr: Transitive Abhängigkeiten zwischen Nichtschlüsselattributen betreffen die 3. NF."],
  ["t2", "dm", "In einer Musikschule kann jeder Schüler mehrere Kurse belegen und jeder Kurs hat mehrere Schüler.\n\nWie setzen Sie diese m:n-Beziehung im Relationenmodell um?", ["Je ein Fremdschlüssel in Schueler und Kurs","Eine Zwischentabelle mit beiden Fremdschlüsseln","Gar nicht, m:n ist relational nicht darstellbar","Eine der beiden Tabellen wird gelöscht"], 1, "Die m:n-Beziehung wird über eine Zwischentabelle (z. B. Belegung) aufgelöst. Sie enthält beide Fremdschlüssel, meist zusammen als Primärschlüssel, plus Beziehungsattribute wie das Anmeldedatum."],
  ["t2", "dm", "Eine Abteilung hat viele Mitarbeiter, ein Mitarbeiter gehört zu genau einer Abteilung.\n\nIn welcher Tabelle steht der Fremdschlüssel?", ["In Abteilung (1-Seite)","In Mitarbeiter (n-Seite)","In beiden Tabellen","In einer Zwischentabelle"], 1, "Bei 1:n steht der Fremdschlüssel immer auf der n-Seite: Mitarbeiter.AbteilungsNr verweist auf Abteilung. Umgekehrt müsste eine Abteilung mehrere Werte in einem Feld speichern."],
  ["t2", "dm", "In einer nicht normalisierten Tabelle Auftrag stehen Kundendaten und Auftragsdaten zusammen. Ein neuer Interessent kann erst gespeichert werden, wenn er einen Auftrag erteilt.\n\nWelche Anomalie liegt vor?", ["Einfügeanomalie","Änderungsanomalie","Löschanomalie","Keine Anomalie"], 0, "Bei der Einfügeanomalie lässt sich eine Information nicht speichern, ohne andere, noch fehlende Daten mitzuerfassen. Ursache ist die Vermischung zweier Entitäten in einer Tabelle."],
  ["t2", "dm", "Ein Datenbanksystem wirbt mit vollständiger ACID-Unterstützung.\n\nWofür steht das I in ACID?", ["Integrity","Isolation","Independence","Identity"], 1, "ACID: Atomicity, Consistency, Isolation, Durability. Isolation bedeutet, dass sich parallel laufende Transaktionen nicht gegenseitig beeinflussen."],
  ["t2", "dm", "Eine Klinik speichert Röntgenbilder als unkomprimierte RGB-Bilder mit 24 Bit Farbtiefe.\n\nWie viele Byte belegt ein Pixel?", ["2 Byte","3 Byte","4 Byte","24 Byte"], 1, "24 Bit ÷ 8 Bit pro Byte = 3 Byte, je ein Byte für Rot, Grün und Blau."],
  ["t2", "dm", "Ein Speicherhersteller gibt die Kapazität in GiB an.\n\nWie viel Byte entspricht 1 GiB?", ["1.000.000.000 Byte","1.073.741.824 Byte","1.024.000 Byte","8.000.000.000 Bit"], 1, "GiB ist eine Binäreinheit: 1 GiB = 2³⁰ Byte = 1024³ Byte. 1 GB = 10⁹ Byte ist die Dezimaleinheit."],
  ["t2", "dm", "Für die Kundentabelle eines Versandhändlers soll der Datentyp der Postleitzahl festgelegt werden. Es gibt auch Kunden in Dresden (PLZ 01067).\n\nWelcher Datentyp passt?", ["INTEGER bzw. SMALLINT","CHAR(5) bzw. VARCHAR","DECIMAL(5) bzw. NUMERIC","FLOAT bzw. DOUBLE"], 1, "Bei einem Zahlentyp ginge die führende Null verloren (01067 → 1067). Mit der PLZ wird außerdem nicht gerechnet. Gleiches gilt für Telefonnummern."],
  ["t2", "dm", "In einer Bibliotheksdatenbank soll keine Ausleihe auf ein Buch verweisen, das es nicht gibt.\n\nWelches Prinzip stellt das sicher?", ["Entitätsintegrität: Jeder Primärschlüsselwert ist eindeutig und darf nicht NULL sein","Referentielle Integrität: Fremdschlüssel verweisen nur auf existierende Datensätze","Normalisierung: Jede Information wird nur einmal in der Datenbank gespeichert","Atomarität: Änderungen einer Transaktion werden ganz oder gar nicht ausgeführt"], 1, "Referentielle Integrität wird über FOREIGN KEY durchgesetzt. Das DBMS lehnt dann z. B. eine Ausleihe mit unbekannter BuchNr oder das Löschen eines ausgeliehenen Buches ab."],
  ["t2", "dm", "Ein Start-up speichert Produktbeschreibungen, deren Merkmale je nach Produkt stark variieren. Ein Produkt wird meist komplett geladen.\n\nWann ist eine dokumentenorientierte Datenbank sinnvoll?", ["Bei streng gleich strukturierten Buchungsdaten mit vielen Joins","Bei flexibel strukturierten Daten, die meist zusammen gelesen werden","Bei stark vernetzten Daten, deren Beziehungen meist traversiert werden","Bei Daten mit festem Schema, die über Fremdschlüssel verknüpft werden"], 1, "Dokumentdatenbanken (z. B. MongoDB) speichern JSON-ähnliche Dokumente ohne festes Schema, die meist als Ganzes geladen werden. Einheitlich strukturierte Daten mit festem Schema, Fremdschlüsseln und vielen Joins passen besser in ein relationales System, stark vernetzte Daten mit vielen Beziehungsabfragen in eine Graphdatenbank."],
  // ---------- Teil 2: Diagramme & Testen
  ["t2", "diag", "Für die Methode berechneRabatt() werden Testfälle erstellt, bis jede Anweisung mindestens einmal ausgeführt wurde.\n\nWelche Überdeckung ist damit erreicht?", ["C0 – Anweisungsüberdeckung","C1 – Zweigüberdeckung","C2 – Pfadüberdeckung","Mehrfachbedingungsüberdeckung"], 0, "C0 verlangt nur, dass jede Anweisung einmal läuft. Ein „wenn“ ohne „sonst“ kann so durchlaufen sein, ohne dass der Fall „Bedingung falsch“ getestet wurde."],
