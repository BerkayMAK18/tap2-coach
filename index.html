/* TAP2 Prüfungscoach: Lern-App für die Abschlussprüfung Teil 2 (Fachinformatik Anwendungsentwicklung).
   Farben: Blau als Hauptfarbe, Violett, Gelb und Rot als Akzente; Grün, Gelb, Rot zusätzlich als Ampel für den Lernstand. */
:root {
  --blue: #6AD2E2; --violet: #928BDE; --violet-l: #E0E1F6; --violet-m: #C5C3EE; --violet-d: #5D4495;
  --yellow: #FFD03D; --yellow-l: #FBF9AA; --yellow-b: #FFE667; --yellow-d: #E18600;
  --red: #EE6541; --red-l: #F5CDB9; --red-b: #F58A68; --red-d: #86251B;
  --gray-l: #F6F5F3; --gray-w: #E5E3DE;
  --ok: #1EAD1B; --warn: #FF8413; --bad: #F62B2B;
  --bg: #F6F5F3; --surface: #FFFFFF; --surface-2: #F6F5F3; --ink: #08312A; --on-blue: #08312A;
  --muted: rgba(8, 49, 42, 0.64); --faint: rgba(8, 49, 42, 0.42); --line: #E5E3DE; --line-2: rgba(8, 49, 42, 0.16);
  --blue-soft: rgba(106, 210, 226, 0.2); --blue-soft-2: rgba(106, 210, 226, 0.36);
  --violet-soft: #E0E1F6; --yellow-soft: #FBF9AA; --red-soft: #F5CDB9;
  --ok-soft: rgba(30, 173, 27, 0.12); --bad-soft: rgba(246, 43, 43, 0.1);
  --sh-1: 0 1px 2px rgba(8, 49, 42, 0.05), 0 6px 20px rgba(8, 49, 42, 0.06);
  --sh-2: 0 2px 6px rgba(8, 49, 42, 0.06), 0 16px 40px rgba(8, 49, 42, 0.12);
  --glow: 0 6px 20px rgba(106, 210, 226, 0.55);
  --r-xl: 28px; --r-lg: 22px; --r: 16px; --r-sm: 11px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 36px;
  --display: "Plus Jakarta Sans", ui-sans-serif, sans-serif;
  --body: "DM Sans", ui-sans-serif, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --nav-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11182A; --surface: #1A2338; --surface-2: #222D47; --ink: #F6F5F3;
    --muted: rgba(246, 245, 243, 0.68); --faint: rgba(246, 245, 243, 0.45); --line: rgba(246, 245, 243, 0.1); --line-2: rgba(246, 245, 243, 0.2);
    --blue-soft: rgba(106, 210, 226, 0.14); --blue-soft-2: rgba(106, 210, 226, 0.26);
    --violet-soft: rgba(146, 139, 222, 0.2); --yellow-soft: rgba(255, 208, 61, 0.16); --red-soft: rgba(238, 101, 65, 0.18);
    --ok-soft: rgba(30, 173, 27, 0.2); --bad-soft: rgba(246, 43, 43, 0.18);
    --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    --sh-2: 0 2px 6px rgba(0, 0, 0, 0.35), 0 16px 40px rgba(0, 0, 0, 0.45);
    --glow: 0 6px 22px rgba(106, 210, 226, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  --muted: rgba(246, 245, 243, 0.68); --faint: rgba(246, 245, 243, 0.45); --line: rgba(246, 245, 243, 0.1); --line-2: rgba(246, 245, 243, 0.2);
  --blue-soft: rgba(106, 210, 226, 0.14); --blue-soft-2: rgba(106, 210, 226, 0.26);
  --violet-soft: rgba(146, 139, 222, 0.2); --yellow-soft: rgba(255, 208, 61, 0.16); --red-soft: rgba(238, 101, 65, 0.18);
  --ok-soft: rgba(30, 173, 27, 0.2); --bad-soft: rgba(246, 43, 43, 0.18);
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  --sh-2: 0 2px 6px rgba(0, 0, 0, 0.35), 0 16px 40px rgba(0, 0, 0, 0.45);

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }

/* ---------- shell */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }

.nav-i:hover { background: var(--surface-2); color: var(--ink); }
.nav-i[aria-current="page"] { background: var(--blue-soft-2); color: var(--ink); }

.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

.count-card b { display: block; font-family: var(--display); font-size: 1.3rem; color: var(--ink); line-height: 1.15; }
.reife-card { padding: 14px; border-radius: var(--r); background: var(--surface); box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: 10px; }
.sr-top { display: flex; align-items: baseline; justify-content: space-between; font-size: 0.82rem; color: var(--muted); font-weight: 700; }
.sr-top b { font-family: var(--display); font-size: 1.2rem; color: var(--ink); }
.col { min-width: 0; display: flex; flex-direction: column; }
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 14px clamp(16px, 3vw, 36px); background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color 0.2s; }
header.top.scrolled { border-bottom-color: var(--line); }
.top-l { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
#page-title { font-size: 1.35rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-1); font-weight: 700; font-size: 0.88rem; border: 0; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill .ic { width: 18px; height: 18px; }

.pill.days { cursor: default; }
.pill b { font-family: var(--display); }
main.content { width: 100%; max-width: 1180px; margin: 0 auto; padding: var(--sp-3) clamp(16px, 3vw, 36px) 56px; flex: 1; }
footer.foot { display: flex; align-items: center; gap: 12px; padding: 18px clamp(16px, 3vw, 36px) 22px; font-size: 0.72rem; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--yellow-soft); border-radius: var(--r); padding: 12px 16px; font-size: 0.9rem; margin-bottom: var(--sp-5); }
.banner .ic { stroke: var(--yellow-d); margin-top: 2px; }

/* ---------- primitives */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); padding: clamp(18px, 2.4vw, 26px); }

.sec > .sec-head + * { margin-top: var(--sp-4); }

.btn:hover { border-color: var(--ink); }

.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); box-shadow: var(--glow); }
.btn.primary:hover { box-shadow: 0 8px 26px rgba(106, 210, 226, 0.75); border-color: var(--blue); }
.btn.violet { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn.white { background: #fff; border-color: #fff; color: #08312A; }

.btn.glass:hover { background: rgba(255, 255, 255, 0.26); border-color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn.danger { background: var(--red-soft); border-color: transparent; color: var(--ink); }
.btn.small { padding: 6px 12px; font-size: 0.84rem; }
.btn.big { padding: 14px 26px; font-size: 1.04rem; }
.btn.sel { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.taken { background: var(--blue-soft-2); border-color: transparent; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 0; background: var(--surface-2); cursor: pointer; transition: transform 0.12s, background 0.15s; }
.iconbtn:hover { background: var(--blue-soft-2); }
.iconbtn:active { transform: scale(0.92); }
.linkbtn { background: none; border: 0; padding: 0; font-weight: 700; font-size: 0.88rem; color: var(--ink); text-decoration: underline; text-decoration-color: var(--blue); text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.blue { background: var(--blue-soft-2); } .chip.violet { background: var(--violet-soft); } .chip.yellow { background: var(--yellow-soft); } .chip.red { background: var(--red-soft); }
.chip.solid { background: var(--blue); color: var(--on-blue); }
.chip.muss { background: var(--red); color: #fff; } .chip.wichtig { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line-2); }

.bar.violet > i { background: var(--violet); } .bar.yellow > i { background: var(--yellow); }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring circle { fill: none; }

.t-blue { --tc: var(--blue); --tcs: var(--blue-soft-2); --tct: #08312A; }
.t-violet { --tc: var(--violet); --tcs: var(--violet-soft); --tct: #fff; }
.t-yellow { --tc: var(--yellow); --tcs: var(--yellow-soft); --tct: #08312A; }
.t-red { --tc: var(--red); --tcs: var(--red-soft); --tct: #fff; }
.grad { position: relative; color: #fff; overflow: hidden; isolation: isolate; background-color: #285694;
  background-image: radial-gradient(70% 120% at 100% 0%, rgba(106, 210, 226, 0.9) 0%, rgba(106, 210, 226, 0) 60%), radial-gradient(60% 110% at 0% 100%, rgba(146, 139, 222, 0.85) 0%, rgba(146, 139, 222, 0) 62%), linear-gradient(120deg, #285694 0%, #2F64A8 52%, #0083BB 100%);
  background-size: 160% 160%, 160% 160%, 100% 100%; background-position: 100% 0%, 0% 100%, 0 0; animation: drift 22s ease-in-out infinite alternate; }
.grad::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(20, 40, 100, 0.42) 0%, rgba(20, 40, 100, 0.12) 55%, rgba(20, 40, 100, 0) 100%); z-index: -1; }
@keyframes drift { from { background-position: 100% 0%, 0% 100%, 0 0; } to { background-position: 70% 30%, 25% 70%, 0 0; } }

/* ---------- Übersicht */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; border-radius: var(--r-xl); padding: clamp(22px, 3.4vw, 40px); box-shadow: var(--sh-2); }
.hero h2 { font-size: clamp(1.8rem, 4.2vw, 2.7rem); line-height: 1.08; margin: 8px 0 14px; letter-spacing: -0.025em; }
.hero .mot { font-size: 1rem; opacity: 0.92; margin: 0 0 18px; max-width: 56ch; }
.hero .nexthint { font-size: 0.86rem; opacity: 0.85; margin-top: 12px; }
.hero-side { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.hero .ring .bg { stroke: rgba(255, 255, 255, 0.25); } .hero .ring .fg { stroke: #fff; }
.hero .ring .rv small { color: rgba(255, 255, 255, 0.85); font-size: 0.72rem; }
.hero .ring .rv { font-size: 2rem; }
.parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
.parts .card { margin: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px; }
.part .ring .fg { stroke: var(--tc); }
.today { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 8px; font-size: 0.88rem; font-weight: 700; color: var(--muted); }
.today b { font-family: var(--display); font-size: 1.2rem; color: var(--ink); }
.ink { color: var(--ink); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.qk { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 0; background: var(--surface-2); cursor: pointer; text-align: left; font-weight: 700; font-size: 0.9rem; transition: background 0.15s, transform 0.12s; }
.qk:hover:not(:disabled) { background: var(--blue-soft-2); }
.qk:active:not(:disabled) { transform: scale(0.98); }
.qk:disabled { opacity: 0.45; cursor: default; }
.qk b { font-family: var(--display); }
.qk .ic { stroke: var(--muted); }
.filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.pk-num { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.05rem; background: var(--tc); color: var(--tct); flex: none; }

/* ---------- Ampel und Themenliste */
.amp-bar { display: flex; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.amp-bar i { display: block; height: 100%; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
.amp-bar .g { background: var(--ok); } .amp-bar .y { background: var(--yellow); } .amp-bar .r { background: var(--bad); }
.amp-bar.lg { height: 12px; }
.grad .amp-bar { background: rgba(255, 255, 255, 0.28); }
.amp { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--line-2); flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06); }
.amp.s0 { background: var(--bad); } .amp.s1 { background: var(--yellow); } .amp.s2 { background: var(--ok); }
.grad .amp:not(.s0):not(.s1):not(.s2) { background: rgba(255, 255, 255, 0.4); }
.legend-a { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
.legend-a span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.legend-a .amp { width: 10px; height: 10px; }
.grad .legend-a { color: rgba(255, 255, 255, 0.9); }
.tgroup h3 { margin-bottom: var(--sp-3); }
.tlist { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto 18px; gap: 16px; align-items: center; width: 100%; text-align: left; padding: 14px 16px 14px 14px; border-radius: var(--r); border: 0; background: var(--surface); box-shadow: var(--sh-1); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.trow:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.tr-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--tcs); }
.tr-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tr-t { font-family: var(--display); font-weight: 700; font-size: 1rem; line-height: 1.25; }
.tr-m { font-size: 0.8rem; color: var(--muted); }
.tr-m b { color: var(--ink); font-weight: 700; }
.tr-p { font-family: var(--display); font-weight: 800; font-size: 1.1rem; min-width: 3.4em; text-align: right; }
.trow .chev { color: var(--muted); stroke: var(--muted); }
.overall h2 { font-size: 1.35rem; margin-top: 2px; }

/* ---------- Paket-Detail */
.backlink { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 2px; font-weight: 700; color: var(--muted); cursor: pointer; }
.backlink:hover { color: var(--ink); }
.pd-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: clamp(20px, 3vw, 30px); border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--sh-1); position: relative; overflow: hidden; }
.pd-head::after { content: ""; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: var(--tcs); z-index: 0; }
.pd-head > * { position: relative; z-index: 1; }
.pd-num { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 2.2rem; background: var(--tc); color: var(--tct); }
.pd-title { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pd-title h2 { font-size: clamp(1.45rem, 3.6vw, 2.1rem); overflow-wrap: anywhere; hyphens: auto; }
.pd-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pd-rel { margin: 16px 4px 0; color: var(--muted); max-width: 80ch; }
.pd-rel b { color: var(--ink); }
.pd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; margin-top: 18px; }
.pd-side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 18px; }
.kern { border-radius: var(--r); transition: background 0.15s; }
.kern + .kern { margin-top: 6px; }
.kern summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 12px; border-radius: var(--r); cursor: pointer; font-weight: 700; font-family: var(--display); }
.kern summary::-webkit-details-marker { display: none; }
.kern summary:hover { background: var(--surface-2); }
.kern .kn { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--tcs, var(--blue-soft-2)); font-size: 0.88rem; font-weight: 800; }
.kern .chev { transition: transform 0.2s; color: var(--muted); }
.kern[open] { background: var(--surface-2); }
.kern[open] .chev { transform: rotate(180deg); }
.kern .kb { padding: 0 14px 16px 54px; display: flex; flex-direction: column; gap: 12px; }
.kern .kb pre { background: var(--surface); }
.fallen-card { background: color-mix(in srgb, var(--red-soft) 55%, var(--surface)); box-shadow: none; }
.fallen-card h3 { display: flex; align-items: center; gap: 10px; }
.fallen-card h3 .ic { stroke: var(--red-d); }
:root[data-theme="dark"] .fallen-card h3 .ic { stroke: var(--red-b); }
.fallen { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.fallen li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 0.93rem; }
.fallen li::before { content: "!"; width: 20px; height: 20px; border-radius: 50%; background: var(--red); color: #fff; font-weight: 800; font-size: 0.75rem; display: grid; place-items: center; margin-top: 2px; }
.notation { overflow-x: auto; margin: 12px -4px 10px; padding: 4px; }
.notation svg { width: 100%; min-width: 560px; height: auto; display: block; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .btn .amp { width: 10px; height: 10px; }
.tabs-in { display: flex; gap: 4px; border-bottom: 1px solid var(--line-2); overflow-x: auto; scrollbar-width: none; }
.tabs-in button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs-in button:hover { color: var(--ink); }
.tabs-in button.on { color: var(--ink); border-bottom-color: var(--blue); }
.cnt { font-size: 0.74rem; font-weight: 800; background: var(--surface-2); border-radius: 99px; padding: 1px 8px; }
.btn.primary .cnt { background: rgba(8, 49, 42, 0.12); }
.theory .th-head { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.theory .th-head h3 { font-size: 1.25rem; }
.theory .pd-rel { margin: 10px 0 0; }
.kern-list { margin-top: 14px; }
.sub-box { margin-top: 18px; padding: 18px; border-radius: var(--r); background: var(--surface-2); }
.sub-box h4 { font-family: var(--display); font-size: 1rem; display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
.fallen-box { background: color-mix(in srgb, var(--red-soft) 50%, var(--surface)); }
.fallen-box h4 .ic { stroke: var(--red-d); }
.can ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.can li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 0.93rem; }
.can li .ic { stroke: var(--ok); stroke-width: 3; margin-top: 3px; }
.qlist { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; }
.qlist li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
.qrow { flex: 1; min-width: 0; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; border: 0; background: none; padding: 12px 6px; cursor: pointer; text-align: left; border-radius: 10px; }
.qrow:hover { background: var(--surface-2); }
.qrow .qt { font-size: 0.93rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qrow .qty { font-size: 0.72rem; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 2px 8px; }
.qrow .mk .ic { fill: var(--yellow); stroke: var(--yellow-d); }
.addq { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; padding: 16px; border-radius: var(--r); background: var(--surface-2); }
.iconbtn.sm { width: 32px; height: 32px; }

/* ---------- Lernrunde */
.quiz-top .prog { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 0.84rem; color: var(--muted); font-weight: 700; min-width: 0; }
.quiz-top .prog span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quiz-top .prog .bar { flex: none; height: 8px; }
.qcount { font-family: var(--display); font-weight: 800; font-size: 0.95rem; white-space: nowrap; }
.iconbtn.star.marked .ic { fill: var(--yellow); stroke: var(--yellow-d); }
.qlab { flex-wrap: wrap; }
.stat-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 0.78rem; font-weight: 700; color: var(--muted); padding: 3px 10px 3px 8px; border-radius: 99px; background: var(--surface-2); }
.stat-chip .amp { width: 10px; height: 10px; }
.tchip { background: var(--tcs); }
.reveal { width: 100%; margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 16px; border-radius: var(--r); border: 2px dashed var(--line-2); background: var(--surface-2); cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.12s; }
.reveal:hover { border-color: var(--blue); background: var(--blue-soft); }
.reveal:active { transform: scale(0.99); }
.reveal .ic { width: 26px; height: 26px; stroke: var(--ink); }
.reveal b { font-family: var(--display); font-size: 1.05rem; }
.reveal span { font-size: 0.82rem; color: var(--muted); }
.answer-wrap { margin-top: 20px; padding: 18px 20px; border-radius: var(--r); background: var(--blue-soft); animation: rise 0.25s cubic-bezier(.2,.8,.2,1); }
.alab { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.answer { font-size: 1rem; line-height: 1.65; white-space: pre-wrap; }
.answer.mono { font-family: var(--mono); font-size: 0.86rem; line-height: 1.6; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn.no { background: var(--surface); border-color: var(--bad); color: var(--ink); }
.btn.no .ic { stroke: var(--bad); stroke-width: 3; }
.btn.no:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn.yes { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.yes .ic { stroke-width: 3; }
.btn.yes:hover { border-color: var(--ok); filter: brightness(1.05); }
.trans { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 700; color: var(--muted); padding: 2px 9px; border-radius: 99px; background: var(--surface); white-space: nowrap; }
.trans .amp { width: 9px; height: 9px; }
.ic.xs { width: 13px; height: 13px; }
.lastnote { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; color: var(--muted); padding: 6px 12px; border-radius: 99px; background: var(--surface); box-shadow: var(--sh-1); animation: rise 0.25s cubic-bezier(.2,.8,.2,1); }
.lastnote.ok > .ic { stroke: var(--ok); stroke-width: 3; } .lastnote.bad > .ic { stroke: var(--bad); stroke-width: 3; }
.lastnote .trans { background: var(--surface-2); }
.endcard { display: flex; flex-direction: column; gap: 12px; }
.endcard h2 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); }
.study-nav { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.kbdhelp { text-align: center; color: var(--muted); font-size: 0.8rem; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.navgrid button { height: 38px; border-radius: 10px; border: 0; background: var(--surface); box-shadow: var(--sh-1); font-weight: 700; font-size: 0.84rem; cursor: pointer; font-variant-numeric: tabular-nums; }
.navgrid button.ans { background: var(--blue-soft-2); }
.navgrid button.cur { box-shadow: inset 0 0 0 2.5px var(--ink); }

/* ---------- Übungen */
.ueb-group h3 { margin-bottom: var(--sp-3); }
.ueb-list { display: flex; flex-direction: column; gap: 8px; }
.ueb-item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 12px 16px 12px 12px; border-radius: var(--r); border: 0; background: var(--surface); box-shadow: var(--sh-1); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.ueb-item:hover { transform: translateX(3px); box-shadow: var(--sh-2); }
.ueb-item .id { width: 52px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--tcs); }
.ueb-item .t { font-weight: 700; }
.ueb-item .sub { font-size: 0.8rem; color: var(--muted); }
.qtext { white-space: pre-wrap; font-size: 0.98rem; line-height: 1.65; }

/* ---------- Probeklausur */
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--sp-4); align-items: stretch; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 18px; }
.mode { position: relative; display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 18px; border-radius: var(--r); border: 0; background: var(--surface-2); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, background 0.15s; }
.mode:hover { transform: translateY(-2px); }
.mode .mi { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--surface); }
.mode b { font-family: var(--display); font-size: 1.12rem; }
.mode span { font-size: 0.84rem; color: var(--muted); }
.mode.on { background: var(--surface); box-shadow: var(--sh-1), inset 0 0 0 2.5px var(--tc); }
.mode.on .mi { background: var(--tc); }
.mode.on .mi .ic { stroke: var(--tct); }
.n1 { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.n1 li { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.n1 .n1-i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--line-2); }
.n1 li.ok .n1-i { background: var(--yellow); border: 0; }
.n1 li.ok .n1-i .ic { stroke: #08312A; }
.res-list { display: flex; flex-direction: column; gap: 6px; }
.res { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.res .g { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; }
.g1, .g2 { background: var(--yellow); color: #08312A; } .g3 { background: var(--blue); color: #08312A; } .g4, .g5, .g6 { background: var(--red-soft); }
.res .t { font-weight: 700; }
.res .s { font-size: 0.8rem; color: var(--muted); }
.quiz { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.quiz-top { display: flex; align-items: center; gap: 12px; }
.quiz-top .bar { flex: 1; height: 12px; }
.qcard { padding: clamp(22px, 3.6vw, 34px); }
.qcard .qlab { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.qcard .front { font-family: var(--display); font-weight: 700; font-size: clamp(1.12rem, 2.4vw, 1.35rem); line-height: 1.4; }
.optlist { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 0.97rem; transition: border-color 0.15s, background 0.15s, transform 0.12s; }
.opt:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
.opt:active:not(:disabled) { transform: scale(0.99); }
.opt .k { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 0.86rem; background: var(--surface-2); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake 0.4s; }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt.picked { border-color: var(--blue); background: var(--blue-soft); }
.opt.picked .k { background: var(--blue); color: var(--on-blue); }
.feedback { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; border-radius: var(--r-lg); animation: rise 0.3s cubic-bezier(.2,.8,.2,1); }
.feedback.ok { background: var(--ok-soft); } .feedback.bad { background: var(--bad-soft); }
.feedback .fi { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.feedback.ok .fi { background: var(--ok); } .feedback.bad .fi { background: var(--bad); }
.feedback .fi .ic { stroke: #fff; }
.feedback b { font-family: var(--display); font-size: 1.05rem; }
.feedback p { font-size: 0.9rem; color: var(--muted); margin-top: 2px; }
.result-hero { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; border-radius: var(--r-xl); padding: clamp(22px, 3.4vw, 36px); box-shadow: var(--sh-2); }
.result-hero h2 { font-size: clamp(1.5rem, 3.4vw, 2.2rem); }
.result-hero .ring .bg { stroke: rgba(255, 255, 255, 0.25); } .result-hero .ring .fg { stroke: #fff; }
.result-hero .ring .rv { font-size: 1.8rem; } .result-hero .ring .rv small { color: rgba(255,255,255,.85); }
.result-hero .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
.result-hero .chip { background: rgba(255, 255, 255, 0.2); color: #fff; }
.review { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.review:last-child { border-bottom: 0; }

.timerbar { position: sticky; top: 68px; z-index: 12; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px 12px 20px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--sh-2); }

/* ---------- Code-Editor (CodeMirror) */
pre, code, .mono { font-variant-ligatures: none; } /* <= bleibt <= (wie auf dem Prüfungsbogen) */
:root { --tk-kw: #5D4495; --tk-ty: #0B7285; --tk-num: #A85D00; --tk-str: #1B7A19; --tk-op: #9C2A1E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tk-kw: #BDB7F7; --tk-ty: #6AD2E2; --tk-num: #FFD03D; --tk-str: #86DC8A; --tk-op: #F7A487; } }
:root[data-theme="dark"] { --tk-kw: #BDB7F7; --tk-ty: #6AD2E2; --tk-num: #FFD03D; --tk-str: #86DC8A; --tk-op: #F7A487; }
.code-task { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }

.cmwrap { border: 1.5px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); transition: border-color 0.15s, box-shadow 0.15s; }

.cmwrap .cm-scroller { font-family: var(--mono); line-height: 1.6; font-variant-ligatures: none; }
.cmwrap .cm-content { padding: 10px 0; caret-color: var(--ink); }
.cmwrap .cm-gutters { background: transparent; border-right: 1px solid var(--line); color: var(--faint); }
.cmwrap .cm-activeLine { background: var(--blue-soft); }
.cmwrap .cm-activeLineGutter { background: transparent; color: var(--ink); }
.cmwrap .cm-cursor { border-left: 2px solid var(--ink); }
.cmwrap .cm-selectionBackground, .cmwrap .cm-focused .cm-selectionBackground, .cmwrap .cm-content ::selection { background: var(--blue-soft-2) !important; }
.cmwrap .cm-placeholder { color: var(--faint); font-style: italic; }
.cmwrap .cm-matchingBracket { background: var(--yellow-soft); outline: 1px solid var(--yellow); }
.cm-fallback { font-variant-ligatures: none; display: block; width: 100%; margin: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--mono); font-size: 0.9rem; line-height: 1.6; padding: 10px 12px; white-space: pre-wrap; resize: vertical; outline: none; }
.tok-keyword { color: var(--tk-kw); font-weight: 700; }
.tok-typeName { color: var(--tk-ty); }
.tok-number, .tok-bool, .tok-atom { color: var(--tk-num); }
.tok-string { color: var(--tk-str); }
.tok-operator { color: var(--tk-op); }
.tok-comment { color: var(--faint); font-style: italic; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.cmp.solo { grid-template-columns: 1fr; }
.cmp > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cmp .alab { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.cmp .sol .cmwrap { border-color: var(--ok); }
.cmp-hint { margin-top: 10px; font-size: 0.84rem; color: var(--muted); }
@media (max-width: 760px) { .cmp { grid-template-columns: 1fr; } }


/* ---------- IHK-Stil: Situation + Aufgabe, Erwartungshorizont */
.qcard .front { white-space: pre-line; }
.situ { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 3px solid var(--blue); color: var(--muted); font-size: 0.98rem; line-height: 1.6; white-space: pre-line; }
.ewh { margin-top: 14px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--violet-soft); }
.ewh .alab { display: block; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 4px; }
.ewh-b { white-space: pre-line; font-size: 0.93rem; line-height: 1.6; }
/* ---------- SQL ausführen */
.sqlbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sql-hint { display: flex; gap: 6px; align-items: flex-start; margin: 0; } .sql-hint .ic { margin-top: 3px; }
.sqldb { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.sqldb summary { cursor: pointer; padding: 9px 12px; font-size: 0.86rem; font-weight: 700; display: flex; align-items: center; gap: 8px; list-style: none; }
.sqldb summary::-webkit-details-marker { display: none; }
.sqldb summary .muted { font-weight: 500; }
.sqldb[open] summary { border-bottom: 1px solid var(--line); }
.sqldb-l { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; padding: 8px; }
.sqldb-t { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; cursor: pointer; color: var(--ink); font: inherit; }
.sqldb-t:hover { background: var(--blue-soft); }
.sqldb-t b { font-family: var(--mono); font-size: 0.86rem; } .sqldb-t span { font-size: 0.76rem; color: var(--muted); font-family: var(--mono); }
.sql-out:empty { display: none; }
.sql-out { display: flex; flex-direction: column; gap: 10px; }
.sql-msg { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); font-size: 0.88rem; }
.sql-msg p { margin: 2px 0 0; } .sql-msg .ic { margin-top: 2px; flex: none; }
.sql-msg.ok { background: var(--ok-soft); } .sql-msg.ok .ic { color: var(--ok); }
.sql-msg.bad { background: var(--bad-soft); } .sql-msg.bad .ic { color: var(--bad); }
.sql-msg.info { background: var(--surface-2); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--blue); animation: spin 0.8s linear infinite; flex: none; margin-top: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.sqlres-t { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 4px; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
.tblwrap table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 0.82rem; font-variant-ligatures: none; }
.tblwrap th, .tblwrap td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tblwrap th { background: var(--surface-2); font-weight: 700; position: sticky; top: 0; }
.tblwrap tr:last-child td { border-bottom: 0; }
.tblwrap td.n { text-align: right; } .tblwrap td.null { color: var(--faint); font-style: italic; }
.sqlres-f { font-size: 0.76rem; color: var(--muted); margin-top: 4px; }
.cmp .sql-out { margin-top: 6px; }
@media (max-width: 560px) { .sql-kbd, .sqldb summary .muted { display: none; } }
/* ---------- Suche, Fehler melden, Darstellung */
.hud .hb { width: 36px; height: 36px; background: var(--surface); box-shadow: var(--sh-1); color: var(--ink); }
.hud .hb .ic { width: 18px; height: 18px; }
a.iconbtn { color: var(--ink); text-decoration: none; }
.iconbtn.report .ic { width: 18px; height: 18px; }
.srch-back { position: fixed; inset: 0; z-index: 60; background: rgba(8, 18, 30, 0.45); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding: 8vh 16px 16px; }
.srch-back[hidden] { display: none; }
.srch { width: 100%; max-width: 760px; max-height: 84vh; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); overflow: hidden; }
.srch-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.srch-top .ic { color: var(--muted); }
.srch-top input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 1.05rem; color: var(--ink); padding: 8px 2px; outline: none; }
.srch-top input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.srch-res { overflow-y: auto; padding: 6px 10px 14px; }
.srch-res h4 { margin: 14px 6px 6px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.srch-res h4 .spacer { flex: 1; }
.srch-hit { width: 100%; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; text-align: left; border: 0; background: none; color: var(--ink); padding: 10px 8px; border-radius: 12px; cursor: pointer; font: inherit; }
.srch-hit:hover, .srch-hit:focus-visible { background: var(--surface-2); outline: none; }
.srch-hit .amp { margin-top: 6px; }
.srch-hit .ht { font-size: 0.94rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.srch-hit .hs { grid-column: 2; font-size: 0.82rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.srch-hit .chip { justify-self: end; }
.srch-hit mark, .srch-res mark { background: var(--yellow-soft); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px var(--yellow); }
.srch-empty { padding: 24px 8px; color: var(--muted); text-align: center; }
.srch-more { padding: 6px 8px; font-size: 0.82rem; color: var(--muted); }
.srch-foot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--muted); }
@media (max-width: 560px) {

  .hud { gap: 6px; } .hud .hb { width: 32px; height: 32px; }
}

  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.6s cubic-bezier(.2,.8,.2,1); } }

  algo: [
    ["Grundgerüst: Liste von Objekten durchlaufen und zählen", "zaehler = 0\nfür i = 0 bis liste.size() - 1\n  wenn liste.get(i).getWert() > grenze dann\n    zaehler = zaehler + 1\n  ende wenn\nende für\nRückgabe zaehler"],

  sql: [
    ["Sie sollen in der Prüfung eine vollständige SELECT-Anweisung mit Join, Filter, Gruppierung und Sortierung schreiben.\n\nNennen Sie die Klauseln einer SELECT-Anweisung in der vorgeschriebenen Reihenfolge. (3 P)", "SELECT – FROM – JOIN … ON – WHERE – GROUP BY – HAVING – ORDER BY", "Volle Punktzahl nur bei vollständiger und richtiger Reihenfolge.\nMerksatz: „Sie Fragen Jeden Wie Gut Hilft Oma“ (SELECT, FROM, JOIN, WHERE, GROUP BY, HAVING, ORDER BY)."],
    ["Die Rheinhessen IT GmbH möchte nur offene Bestellungen auswerten und davon nur Kunden mit mehr als einer offenen Bestellung anzeigen.\n\nErläutern Sie den Unterschied zwischen WHERE und HAVING an diesem Beispiel. (4 P)", "WHERE filtert einzelne Zeilen vor der Gruppierung: WHERE Status = 'offen'.\nHAVING filtert Gruppen nach der Gruppierung und darf Aggregatfunktionen enthalten: HAVING COUNT(*) > 1.", "Je 2 P für WHERE und HAVING mit Zeitpunkt (vor/nach GROUP BY) und Bezug zum Beispiel.\nTypischer Fehler: COUNT(*) im WHERE – das ist ein Syntaxfehler."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position.\n\nErläutern Sie den Unterschied zwischen Kunde INNER JOIN Bestellung und Kunde LEFT JOIN Bestellung. (4 P)", "INNER JOIN liefert nur Kunden, zu denen mindestens eine Bestellung existiert.\nLEFT JOIN liefert alle Kunden; Kunden ohne Bestellung erscheinen mit NULL in den Spalten von Bestellung.", "Je 2 P pro Join-Art. Erwartet wird der Hinweis auf NULL-Werte beim LEFT JOIN.\nIn Prüfungen ist der LEFT JOIN fast immer gefragt, wenn „auch Kunden ohne …“ oder „alle …“ im Text steht."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position.\n\nErstellen Sie eine SQL-Anweisung, die für jeden Kunden den Namen und die Anzahl seiner Bestellungen ausgibt. Kunden ohne Bestellung sollen mit 0 erscheinen. (5 P)", "SELECT K.Name, COUNT(B.BID) AS Anzahl\nFROM Kunde K\nLEFT JOIN Bestellung B ON B.KID = K.KID\nGROUP BY K.KID, K.Name;", "- SELECT mit Name und Aggregat (1 P)\n- LEFT JOIN Kunde → Bestellung mit korrekter ON-Bedingung (2 P)\n- COUNT(B.BID) statt COUNT(*) (1 P): COUNT(*) zählt die NULL-Zeile von Kunden ohne Bestellung als 1\n- GROUP BY über alle nicht aggregierten Spalten (1 P)"],
    ["Für einen Bericht werden alle Kunden mit ihren offenen Bestellungen per LEFT JOIN gelistet. Ein Kollege schreibt WHERE B.Status = 'offen' und wundert sich, dass Kunden ohne offene Bestellung fehlen.\n\nErklären Sie den Fehler und nennen Sie die Korrektur. (4 P)", "Die WHERE-Bedingung wird nach dem Join geprüft. Bei Kunden ohne passende Bestellung ist B.Status NULL, die Bedingung ist nicht wahr und die Zeile fällt heraus. Der LEFT JOIN wirkt dadurch wie ein INNER JOIN.\nKorrektur: Bedingung in die ON-Klausel verschieben: LEFT JOIN Bestellung B ON B.KID = K.KID AND B.Status = 'offen'", "2 P Ursache (NULL, Filter nach dem Join), 2 P Korrektur mit Bedingung im ON."],
    ["Ein Kollege schreibt SELECT Kategorie, Bezeichnung, AVG(Preis) FROM Artikel GROUP BY Kategorie; und erhält in vielen DBMS einen Fehler.\n\nNennen Sie die Regel für GROUP BY und korrigieren Sie die Abfrage. (3 P)", "Jede Spalte im SELECT, die nicht in einer Aggregatfunktion steht, muss im GROUP BY stehen.\nKorrektur: Bezeichnung entfernen → SELECT Kategorie, AVG(Preis) FROM Artikel GROUP BY Kategorie;", "2 P Regel, 1 P Korrektur.\nAlternative: Bezeichnung zusätzlich ins GROUP BY aufnehmen – dann ändert sich aber die Bedeutung (Durchschnitt je Artikel statt je Kategorie)."],
    ["Die Geschäftsführung möchte Kennzahlen zu den Artikelpreisen: Anzahl, Summe, Durchschnitt, günstigster und teuerster Preis.\n\nNennen Sie die fünf SQL-Aggregatfunktionen, mit denen Sie diese Werte ermitteln. (5 P)", "COUNT – Anzahl\nSUM – Summe\nAVG – Durchschnitt\nMIN – kleinster Wert\nMAX – größter Wert", "Je 1 P pro Funktion mit Bedeutung.\nAggregatfunktionen ignorieren NULL-Werte, nur COUNT(*) zählt alle Zeilen."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position. Stornierte Bestellungen sollen in die bereits vorhandene Tabelle BestellungArchiv (gleiche Spalten wie Bestellung) verschoben werden. Ihre Positionen werden nicht archiviert.\n\nErstellen Sie die nötigen SQL-Anweisungen. (6 P)", "INSERT INTO BestellungArchiv\nSELECT * FROM Bestellung WHERE Status = 'storniert';\n\nDELETE FROM Position\nWHERE BID IN (SELECT BID FROM Bestellung WHERE Status = 'storniert');\n\nDELETE FROM Bestellung WHERE Status = 'storniert';", "- INSERT INTO … SELECT mit korrekter Bedingung (2 P)\n- Positionen zuerst löschen, weil sie per Fremdschlüssel auf Bestellung verweisen (2 P)\n- Bestellungen löschen (2 P)\nWer Bestellung vor Position löscht, verletzt die referentielle Integrität."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position. Alle Artikel der Kategorie Zubehör werden um 10 % teurer.\n\nErstellen Sie die SQL-Anweisung. (3 P)", "UPDATE Artikel\nSET Preis = Preis * 1.1\nWHERE Kategorie = 'Zubehör';", "- UPDATE … SET (1 P)\n- Berechnung relativ zum alten Preis (1 P)\n- WHERE-Bedingung (1 P) – ohne WHERE würden alle Preise erhöht"],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position. Artikel, die noch nie bestellt wurden, sollen aus dem Sortiment gelöscht werden.\n\nErstellen Sie die SQL-Anweisung. (3 P)", "DELETE FROM Artikel\nWHERE ArtNr NOT IN (SELECT ArtNr FROM Position);", "- DELETE FROM Artikel (1 P)\n- Unterabfrage auf Position (1 P)\n- NOT IN bzw. NOT EXISTS (1 P)\nHinweis: Kann die Unterabfrage NULL liefern, ist NOT EXISTS sicherer."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position. In der Tabelle Kunde soll künftig eine Telefonnummer (bis 30 Zeichen) gespeichert werden. Die Spalte Email wird nicht mehr benötigt.\n\nErstellen Sie die SQL-Anweisungen zur Strukturänderung. (4 P)", "ALTER TABLE Kunde ADD Telefon VARCHAR(30);\nALTER TABLE Kunde DROP COLUMN Email;", "Je 2 P pro Anweisung (ALTER TABLE, Aktion, Datentyp).\nDatentyp einer Spalte ändern: je nach DBMS ALTER TABLE … MODIFY (MySQL) oder ALTER COLUMN (SQL Server, PostgreSQL). SQLite kennt beides nicht."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position. Die Suche nach Kunden über den Ort ist zu langsam.\n\nErstellen Sie die SQL-Anweisung für einen passenden Index und nennen Sie einen Nachteil von Indizes. (3 P)", "CREATE INDEX idx_kunde_ort ON Kunde (Ort);", "2 P Anweisung, 1 P Nachteil.\nNachteile: zusätzlicher Speicherbedarf; INSERT, UPDATE und DELETE werden langsamer, weil der Index mitgepflegt werden muss."],
    ["Der neue Auszubildende soll mit dem Datenbankbenutzer azubi (Passwort Start123!) die Tabelle Artikel lesen und neue Artikel anlegen dürfen. Nach der Probezeit wird das Recht zum Anlegen wieder entzogen.\n\nErstellen Sie die SQL-Anweisungen. (4 P)", "CREATE USER azubi IDENTIFIED BY 'Start123!';\nGRANT SELECT, INSERT ON Artikel TO azubi;\nREVOKE INSERT ON Artikel FROM azubi;", "- CREATE USER (1 P)\n- GRANT mit beiden Rechten und Tabelle (2 P)\n- REVOKE nur für INSERT (1 P)\nDie Syntax von CREATE USER ist herstellerabhängig (MySQL: IDENTIFIED BY)."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position.\n\nErstellen Sie eine SQL-Anweisung, die alle Artikel mit dem höchsten Preis ausgibt. Gibt es mehrere Artikel mit diesem Preis, sollen alle erscheinen. (3 P)", "SELECT *\nFROM Artikel\nWHERE Preis = (SELECT MAX(Preis) FROM Artikel);", "- Unterabfrage mit MAX (2 P)\n- Vergleich in der WHERE-Klausel (1 P)\nORDER BY Preis DESC LIMIT 1 ist falsch, weil dann bei Gleichstand nur ein Artikel erscheint."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position.\n\nErmitteln Sie mit einer SQL-Anweisung, wie viele Positionen eine Bestellung durchschnittlich hat. (4 P)", "SELECT AVG(Anzahl) AS DurchschnittPositionen\nFROM (\n  SELECT COUNT(*) AS Anzahl\n  FROM Position\n  GROUP BY BID\n) AS t;", "- Innere Abfrage: Anzahl je Bestellung mit GROUP BY (2 P)\n- Äußere Abfrage: AVG über das Zwischenergebnis (1 P)\n- Alias für die Unterabfrage im FROM (1 P)\nAggregate lassen sich nicht direkt schachteln: AVG(COUNT(*)) ist ein Fehler."],
    ["In der Kundentabelle sollen alle Kunden aus dem PLZ-Bereich 55 sowie alle Namen mit „Meier“ oder „Maier“ gefunden werden.\n\nErklären Sie die LIKE-Platzhalter % und _ und geben Sie für beide Fälle eine Bedingung an. (4 P)", "% steht für beliebig viele Zeichen (auch keins), _ für genau ein Zeichen.\nPLZ LIKE '55%'\nName LIKE 'M_ier'", "Je 1 P pro Platzhalter, je 1 P pro Bedingung."],
    ["Ein Kollege sucht Kunden ohne E-Mail-Adresse mit WHERE Email = NULL und erhält kein Ergebnis.\n\nErklären Sie den Fehler und geben Sie die richtige Bedingung an. (3 P)", "NULL bedeutet „unbekannt“. Jeder Vergleich mit = ergibt wieder unbekannt und ist nie wahr.\nRichtig: WHERE Email IS NULL (bzw. IS NOT NULL)", "2 P Erklärung, 1 P korrekte Bedingung."],
    ["Die Kundenlisten zweier Filialen sollen zu einer Liste zusammengeführt werden.\n\nErläutern Sie den Unterschied zwischen UNION und UNION ALL und nennen Sie eine Voraussetzung. (3 P)", "Beide hängen Ergebnismengen untereinander.\nUNION entfernt doppelte Zeilen, UNION ALL behält sie (und ist schneller).\nVoraussetzung: gleiche Spaltenanzahl mit verträglichen Datentypen.", "Je 1 P pro Operator, 1 P Voraussetzung."],
    ["Die Rheinhessen IT GmbH will Preisänderungen automatisch protokollieren und die Buchungslogik zentral in der Datenbank ablegen.\n\nUnterscheiden Sie Trigger und Stored Procedure und ordnen Sie beide Anforderungen zu. (4 P)", "Trigger: startet automatisch bei einem Ereignis (INSERT, UPDATE, DELETE) auf einer Tabelle → Protokollierung der Preisänderungen.\nStored Procedure: gespeicherte, parametrisierte Folge von SQL-Anweisungen, wird ausdrücklich aufgerufen → zentrale Buchungslogik.", "Je 1 P pro Definition, je 1 P pro passender Zuordnung."],
    ["Die Rheinhessen IT GmbH verkauft IT-Ausstattung an Geschäftskunden. Ihre Datenbank enthält die Tabellen Kunde, Artikel, Bestellung und Position. Die Tabelle Position soll neu angelegt werden. Sie speichert, welcher Artikel in welcher Menge zu einer Bestellung gehört.\n\nErstellen Sie die CREATE-TABLE-Anweisung mit Primär- und Fremdschlüsseln. (6 P)", "CREATE TABLE Position (\n  BID INT,\n  ArtNr INT,\n  Menge INT,\n  PRIMARY KEY (BID, ArtNr),\n  FOREIGN KEY (BID) REFERENCES Bestellung(BID),\n  FOREIGN KEY (ArtNr) REFERENCES Artikel(ArtNr)\n);", "- Spalten mit Datentypen (1 P)\n- Zusammengesetzter Primärschlüssel (BID, ArtNr) (2 P)\n- Je Fremdschlüssel mit REFERENCES (je 1,5 P)"]
  ],
  db: [
    ["Eine Tierarztpraxis speichert in der Tabelle Tier das Feld Impfungen mit dem Inhalt „Tollwut 03/25, Staupe 05/25“.\n\nBeschreiben Sie die Anforderung der 1. Normalform und erläutern Sie, wie Sie die Tabelle anpassen. (4 P)", "1. NF: Alle Attribute sind atomar (genau ein Wert pro Feld), es gibt keine Wiederholungsgruppen.\nAnpassung: eigene Tabelle Impfung(ImpfID, TierNr [FK], Impfstoff, Datum), je Impfung eine Zeile.", "2 P Definition, 2 P Lösung mit eigener Tabelle und Fremdschlüssel."],
    ["Die Tabelle Belegung(SchuelerNr, KursNr, Kursname, Note) eines Bildungsträgers hat den Primärschlüssel (SchuelerNr, KursNr).\n\nBeschreiben Sie die 2. Normalform und prüfen Sie, ob die Tabelle sie erfüllt. (4 P)", "2. NF: 1. NF und jedes Nichtschlüsselattribut hängt vom gesamten Primärschlüssel ab, nicht nur von einem Teil.\nKursname hängt nur von KursNr ab → 2. NF verletzt. Lösung: Kurs(KursNr, Kursname) auslagern; Note bleibt in Belegung.", "2 P Definition, 2 P Prüfung mit Begründung.\nDie 2. NF kann nur bei zusammengesetzten Schlüsseln verletzt sein."],
    ["Die Tabelle Mitarbeiter(PersNr, Name, AbtNr, AbtName) ist in der 2. Normalform.\n\nBeschreiben Sie die 3. Normalform und bringen Sie die Tabelle in die 3. NF. (4 P)", "3. NF: 2. NF und keine transitiven Abhängigkeiten – Nichtschlüsselattribute hängen nicht von anderen Nichtschlüsselattributen ab.\nPersNr → AbtNr → AbtName ist transitiv.\nLösung: Mitarbeiter(PersNr, Name, AbtNr [FK]) und Abteilung(AbtNr, AbtName).", "2 P Definition, 2 P Zerlegung mit Fremdschlüssel."],
    ["Ein Autohaus speichert Kunden und Probefahrten in einer gemeinsamen Tabelle Probefahrt(FahrtNr, Datum, KundenNr, KundenName, Telefon).\n\nBeschreiben Sie die Einfügeanomalie an diesem Beispiel. (2 P)", "Ein neuer Interessent kann nicht gespeichert werden, solange er keine Probefahrt gemacht hat, weil dafür eine FahrtNr benötigt wird.", "1 P Definition (Information lässt sich nicht ohne andere, noch fehlende Daten speichern), 1 P Bezug zum Beispiel."],
    ["In derselben Tabelle Probefahrt(FahrtNr, Datum, KundenNr, KundenName, Telefon) hat ein Kunde fünf Probefahrten gemacht und eine neue Telefonnummer.\n\nBeschreiben Sie die Änderungsanomalie an diesem Beispiel. (2 P)", "Die Telefonnummer steht fünfmal in der Tabelle und muss in allen fünf Zeilen geändert werden. Wird eine Zeile vergessen, sind die Daten widersprüchlich (inkonsistent).", "1 P Definition (mehrfach gespeicherte Information), 1 P Folge: Inkonsistenz."],
    ["In der Tabelle Probefahrt(FahrtNr, Datum, KundenNr, KundenName, Telefon) wird die einzige Probefahrt eines Kunden gelöscht.\n\nBeschreiben Sie die Löschanomalie an diesem Beispiel. (2 P)", "Mit der Probefahrt gehen auch Name und Telefonnummer des Kunden verloren, obwohl der Kunde weiterhin gespeichert bleiben sollte.", "1 P Definition (ungewollter Verlust anderer Informationen), 1 P Bezug zum Beispiel."],
    ["Eine Prüfungsaufgabe zeigt eine Tabelle, in der Kundenname und Anschrift bei jeder Bestellung erneut gespeichert werden.\n\nErklären Sie den Begriff Redundanz und ihren Zusammenhang mit Anomalien. (3 P)", "Redundanz ist die mehrfache Speicherung derselben Information. Sie verschwendet Speicher und ist die Ursache von Einfüge-, Änderungs- und Löschanomalien. Normalisierung beseitigt sie durch Aufteilen in mehrere Tabellen.", "1 P Definition, 1 P Nachteil, 1 P Zusammenhang mit Anomalien bzw. Normalisierung."],
    ["In einer Musikschule kann jeder Schüler mehrere Kurse belegen, jeder Kurs hat mehrere Schüler. Gespeichert werden soll auch das Anmeldedatum.\n\nErläutern Sie, wie diese Beziehung im Relationenmodell umgesetzt wird. (4 P)", "Die m:n-Beziehung wird über eine Zwischentabelle aufgelöst:\nSchueler(SchuelerNr, Name)\nKurs(KursNr, Titel)\nBelegung(SchuelerNr [PK, FK], KursNr [PK, FK], Anmeldedatum)\nDas Anmeldedatum ist ein Attribut der Beziehung und gehört in die Zwischentabelle.", "- Zwischentabelle (1 P)\n- Beide Fremdschlüssel (1 P)\n- Zusammengesetzter Primärschlüssel (1 P)\n- Beziehungsattribut in der Zwischentabelle (1 P)"],
    ["Ein Kunde kann viele Bestellungen aufgeben, eine Bestellung gehört zu genau einem Kunden.\n\nNennen Sie die Tabelle, in der der Fremdschlüssel steht, und begründen Sie. (2 P)", "Der Fremdschlüssel KundenNr steht in Bestellung, also auf der n-Seite.\nBegründung: Jede Bestellung verweist auf genau einen Kunden. Auf der 1-Seite müsste ein Kunde mehrere Bestellnummern in einem Feld speichern (Verstoß gegen die 1. NF).", "1 P richtige Tabelle, 1 P Begründung."],
    ["Sie erstellen in der Prüfung ein Relationenmodell für einen Fahrradverleih mit Kunden, Fahrrädern und Ausleihen.\n\nNennen Sie die Elemente, für die es in der Bewertung Punkte gibt. (4 P)", "Je Tabelle mit allen Attributen\nJe Primärschlüssel (unterstrichen/gekennzeichnet)\nJe Fremdschlüssel (gekennzeichnet)\nJe Beziehung mit Kardinalität (1 und n an den Linien)", "Je 1 P pro Element. PK und FK immer eindeutig beschriften, sonst gehen Punkte verloren, auch wenn das Modell richtig ist."],
    ["In der Datenbank eines Fahrradverleihs soll keine Ausleihe auf ein Fahrrad verweisen, das es nicht gibt.\n\nErklären Sie den Begriff referentielle Integrität und nennen Sie ein Beispiel, wie das DBMS sie durchsetzt. (3 P)", "Referentielle Integrität: Ein Fremdschlüssel verweist nur auf existierende Primärschlüsselwerte (oder ist NULL).\nBeispiel: Das DBMS lehnt das Löschen eines Fahrrads ab, solange Ausleihen darauf verweisen, oder löscht diese mit (ON DELETE CASCADE).", "2 P Erklärung, 1 P Beispiel (Löschen verhindern, Einfügen mit unbekanntem Schlüssel verhindern oder Kaskadierung)."],
    ["Ein Buchungssystem für Konzertkarten muss auch bei vielen gleichzeitigen Käufen zuverlässig arbeiten.\n\nNennen und erklären Sie die vier ACID-Eigenschaften. (4 P)", "Atomicity (Atomarität): Transaktion ganz oder gar nicht\nConsistency (Konsistenz): Datenbank vorher und nachher in einem gültigen Zustand\nIsolation: Parallele Transaktionen beeinflussen sich nicht\nDurability (Dauerhaftigkeit): Bestätigte Änderungen bleiben auch nach einem Absturz erhalten", "Je 1 P pro Eigenschaft mit Erklärung. Ein Bezug zum Kartenverkauf (z. B. kein Platz doppelt verkauft) bringt Sicherheit bei der Bewertung."],
    ["Ein Start-up überlegt, ob es für seine Social-Media-App eine NoSQL- oder eine relationale Datenbank einsetzen soll.\n\nStellen Sie je zwei Merkmale beider Ansätze gegenüber. (4 P)", "Relational: festes Schema, Joins über Fremdschlüssel, ACID-Transaktionen, starke Konsistenz.\nNoSQL: flexibles bzw. kein festes Schema, horizontal skalierbar über viele Server, gut für große und unstrukturierte Daten, oft nur „eventual consistency“.", "Je 1 P pro Merkmal (2 × relational, 2 × NoSQL)."],
    ["Eine Klinik archiviert Röntgenbilder mit 3.000 × 2.000 Pixeln und 24 Bit Farbtiefe unkomprimiert.\n\nBerechnen Sie den Speicherbedarf eines Bildes in MiB. Der Rechenweg ist anzugeben. (3 P)", "3.000 · 2.000 = 6.000.000 Pixel\n6.000.000 · 24 Bit = 144.000.000 Bit\n144.000.000 Bit ÷ 8 = 18.000.000 Byte\n18.000.000 Byte ÷ 1024 ÷ 1024 ≈ 17,17 MiB", "Je 1 P pro Rechenschritt (Pixel, Byte, MiB). Ohne Rechenweg gibt es in der Prüfung keine volle Punktzahl.\nBei MB (dezimal) wird durch 1000 geteilt: 18 MB."],
    ["Ein Kunde reklamiert, dass seine neue „1-TB“-Festplatte im Betriebssystem nur etwa 931 GiB anzeigt.\n\nErklären Sie den Unterschied zwischen GB und GiB und begründen Sie die Anzeige. (3 P)", "GB ist dezimal: 1 GB = 10⁹ Byte. GiB ist binär: 1 GiB = 2³⁰ Byte = 1.073.741.824 Byte.\nDer Hersteller rechnet dezimal (10¹² Byte), das Betriebssystem binär: 10¹² ÷ 2³⁰ ≈ 931 GiB.", "1 P GB, 1 P GiB, 1 P Begründung mit Rechnung."]
  ],
  uml: [
    ["Aktivitätsdiagramm: Elemente", "Startknoten (gefüllter Kreis), Aktion (abgerundetes Rechteck), Entscheidung/Zusammenführung (Raute), Gabelung/Vereinigung (dicker Balken, Fork/Join), Endknoten (Kreis mit Punkt), Partitionen (Swimlanes)."],
    ["Bedingungen an einer Verzweigung", "In eckigen Klammern an jeder ausgehenden Kante, z. B. [verfügbar] / [nicht verfügbar]. Bedingungen müssen sich ausschließen."],
    ["Fork vs. Join", "Fork teilt einen Fluss in parallele Abläufe, Join wartet, bis alle parallelen Abläufe fertig sind."],
    ["Zustandsdiagramm: Übergangsbeschriftung", "Ereignis [Bedingung] / Aktion, z. B. bezahlen [Betrag ok] / Quittung drucken"],
    ["Zustand: entry, do, exit", "entry / beim Betreten, do / solange im Zustand, exit / beim Verlassen."],
    ["Sequenzdiagramm: Elemente", "Lebenslinien (Objekt:Klasse), Aktivierungsbalken, synchrone Nachricht (gefüllte Pfeilspitze), Antwort (gestrichelt), Fragmente alt, opt, loop."],
    ["alt vs. opt vs. loop", "alt: mehrere Alternativen mit Bedingungen. opt: Ablauf nur, wenn Bedingung erfüllt. loop: Wiederholung."],
    ["Anwendungsfalldiagramm: include vs. extend", "include: wird immer mit ausgeführt (Pfeil vom Basis- zum eingebundenen Fall). extend: optional unter Bedingung (Pfeil vom erweiternden zum Basisfall)."],
    ["Anwendungsfalldiagramm: Elemente", "Systemgrenze mit Name, Akteure (außerhalb), Anwendungsfälle (Ellipsen), Assoziationen, include/extend, Generalisierung zwischen Akteuren."],
    ["Klassendiagramm: Sichtbarkeiten", "+ public, - private, # protected, ~ package"],
    ["Klassendiagramm: Methodensignatur", "+ name(param: Typ): Rückgabetyp, statisch unterstrichen oder {static}, abstrakt kursiv oder {abstract}."],
    ["Multiplizitäten", "1 genau eins, 0..1 höchstens eins, * oder 0..* beliebig viele, 1..* mindestens eins."]
  ],
  oop: [
    ["Kapselung", "Attribute privat, Zugriff nur über Methoden (Getter/Setter). Schützt den Zustand des Objekts."],
    ["Vererbung", "Unterklasse übernimmt Attribute und Methoden der Oberklasse und kann sie erweitern oder überschreiben (ist-ein-Beziehung)."],
    ["Polymorphie", "Gleicher Methodenaufruf, unterschiedliches Verhalten je nach tatsächlichem Objekttyp. Welche Methode läuft, entscheidet sich erst zur Laufzeit (dynamisches Binden)."],
    ["Abstrakte Klasse", "Kann nicht instanziiert werden, kann abstrakte und konkrete Methoden sowie Attribute haben. Unterklassen müssen abstrakte Methoden implementieren."],
    ["Interface", "Nur Methodensignaturen (Vertrag), keine Attribute mit Zustand. Eine Klasse kann mehrere Interfaces implementieren (gestrichelter Pfeil mit leerem Dreieck)."],
    ["Aggregation vs. Komposition", "Beide Ganzes-Teil. Aggregation (leere Raute): Teil kann ohne Ganzes existieren. Komposition (gefüllte Raute): Teil ist existenzabhängig vom Ganzen."],
    ["Überladen vs. Überschreiben", "Überladen: gleicher Name, andere Parameter in derselben Klasse. Überschreiben: gleiche Signatur in Unterklasse, neue Implementierung."],
    ["Observer-Pattern", "Verhaltensmuster. Subjekt hält Liste von Beobachtern und ruft bei Änderung bei allen update() auf (notifyObservers). Beispiel: Anzeigen werden bei neuen Messwerten aktualisiert."],
    ["Factory-Pattern", "Erzeugungsmuster. Objekterzeugung wird in eine Methode ausgelagert, die je nach Parameter passende Unterklasse liefert; Aufrufer kennt nur die Oberklasse/das Interface."],
    ["Singleton-Pattern", "Erzeugungsmuster. Genau eine Instanz: privater Konstruktor, statisches Attribut, statische getInstance()-Methode."],
    ["Kategorien von Entwurfsmustern", "Erzeugungsmuster (Singleton, Factory), Strukturmuster (Facade, Adapter, Proxy), Verhaltensmuster (Observer, Strategy, Command)."],
    ["Vorteile von Entwurfsmustern", "Bewährte Lösungen für wiederkehrende Probleme, gemeinsame Sprache im Team, bessere Wartbarkeit und Erweiterbarkeit."],
    ["Generische Klasse", "Typparametrisiert, z. B. List<T>: Methoden für einen beliebigen, beim Erzeugen festgelegten Typ. Typsicher ohne Casts."]
  ],
  test: [
    ["Anweisungsüberdeckung (C0)", "Jede Anweisung wird mindestens einmal ausgeführt."],
    ["Zweigüberdeckung (C1)", "Jeder Zweig jeder Entscheidung (wahr und falsch) wird mindestens einmal durchlaufen. Schließt Anweisungsüberdeckung ein."],
    ["Pfadüberdeckung (C2)", "Jeder mögliche Pfad vom Start zum Ende wird durchlaufen. Bei Schleifen meist nicht vollständig erreichbar."],
    ["Black-Box vs. White-Box", "Black-Box: Testfälle aus der Spezifikation, Code unbekannt (Äquivalenzklassen, Grenzwerte). White-Box: Testfälle aus dem Code (Überdeckungen)."],
    ["Äquivalenzklassen und Grenzwertanalyse", "Eingaben in Klassen mit gleichem Verhalten teilen (gültig und ungültig), je Klasse ein Testfall. Zusätzlich Werte direkt an und neben den Grenzen testen."],
    ["Teststufen", "Komponententest (Unit), Integrationstest (Zusammenspiel), Systemtest (Gesamtsystem gegen Anforderungen), Abnahmetest (durch den Auftraggeber)."],
    ["Regressionstest", "Wiederholung vorhandener Tests nach Änderungen, um sicherzustellen, dass bestehende Funktionen weiter funktionieren."],
    ["Unit-Test: FIRST", "Fast, Independent, Repeatable, Self-Validating, Timely."],
    ["Testfall besteht aus", "Vorbedingung, Eingabedaten, erwartetes Ergebnis, tatsächliches Ergebnis, Bewertung."],
    ["Inhalte eines Testkonzepts", "Testziele, Teststufen, Testmethoden, Testumgebung, Testdaten, Verantwortliche, Zeitplan, Abbruch-/Endekriterien, Dokumentation."],
    ["Qualitätsmerkmale ISO/IEC 25010", "Funktionale Eignung, Leistungseffizienz, Kompatibilität, Benutzbarkeit (Interaktionskapazität), Zuverlässigkeit, Sicherheit, Wartbarkeit, Übertragbarkeit (Flexibilität)."],
    ["Zuverlässigkeit", "Software erbringt ihre Funktionen unter festgelegten Bedingungen über einen Zeitraum: Reife, Verfügbarkeit, Fehlertoleranz, Wiederherstellbarkeit."],
    ["Qualitätssichernde Maßnahmen", "Code-Reviews, Pair Programming, automatisierte Tests in CI/CD, Coding-Standards, statische Codeanalyse, standardisiertes Vorgehensmodell, Dokumentation."]
  ],
  sec: [
    ["Schutzziele (CIA)", "Vertraulichkeit (nur Berechtigte lesen), Integrität (Daten unverändert und korrekt), Verfügbarkeit (Systeme nutzbar wenn nötig). Ergänzend: Authentizität, Verbindlichkeit."],
    ["Symmetrische Verschlüsselung", "Ein gemeinsamer Schlüssel zum Ver- und Entschlüsseln (z. B. AES). Schnell, aber Problem der sicheren Schlüsselverteilung."],
    ["Asymmetrische Verschlüsselung", "Schlüsselpaar: mit dem öffentlichen Schlüssel des Empfängers verschlüsseln, mit seinem privaten entschlüsseln (z. B. RSA). Kein vorheriger Schlüsseltausch, aber langsam."],
    ["Hybride Verschlüsselung (TLS)", "Asymmetrisch wird ein Sitzungsschlüssel ausgetauscht, die eigentlichen Daten werden symmetrisch verschlüsselt. Verbindet Sicherheit beim Austausch mit Geschwindigkeit."],
    ["Digitale Signatur", "Hashwert der Nachricht wird mit dem privaten Schlüssel des Absenders verschlüsselt. Empfänger prüft mit dem öffentlichen Schlüssel: Integrität und Authentizität."],
    ["Hashfunktion", "Einwegfunktion, erzeugt Prüfwert fester Länge. Kleine Änderung → ganz anderer Hash. Für Integritätsprüfung und Passwortspeicherung."],
    ["Passwörter sicher speichern", "Nie im Klartext. Mit langsamer Hashfunktion (bcrypt, Argon2) und zufälligem Salt pro Benutzer hashen; Salt mit speichern."],
    ["Zertifikat und CA", "Zertifikat bindet einen öffentlichen Schlüssel an eine Identität; eine Zertifizierungsstelle (CA) bestätigt das mit ihrer Signatur."],
    ["Zwei-Faktor-Authentifizierung", "Zwei Faktoren aus verschiedenen Kategorien: Wissen (Passwort), Besitz (Smartphone, Token), Biometrie (Fingerabdruck)."],
    ["Single Sign-On: Vor- und Nachteil", "Vorteil: ein Login für viele Dienste, zentrale Rechteverwaltung. Nachteil: kompromittierter Zugang öffnet alles, Abhängigkeit vom Identity Provider."],
    ["OAuth 2.0", "Autorisierungsprotokoll: Ein Client erhält über einen Authorization Server ein Token für den Zugriff auf Ressourcen, ohne das Passwort des Nutzers zu kennen."],
    ["DSGVO: Rechte der Betroffenen", "Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch. Verarbeitung braucht Rechtsgrundlage (z. B. Einwilligung)."],
    ["Phishing erkennen", "Druck/Dringlichkeit, falscher Absender oder Link-Domain, Aufforderung zur Eingabe von Zugangsdaten, unpersönliche Anrede, Anhänge mit Makros."]
  ],
  pm: [
    ["Stakeholder-Analyse in der Prüfung", "Tabelle: Stakeholder – Erwartung/Interesse – Befürchtung – Maßnahme. Beispiele: Geschäftsführung (Kosten, Termin), Mitarbeitende (Arbeitsplatzangst → Schulung, frühe Einbindung), Kunden, Betriebsrat (Überwachung)."],
    ["Klassisches Vorgehen (Wasserfall)", "Lineare Phasen (Analyse, Entwurf, Umsetzung, Test, Einführung), Anforderungen vorab fest im Lastenheft. Gut bei stabilen Anforderungen, unflexibel bei Änderungen."],
    ["Agiles Vorgehen", "Iterativ in kurzen Zyklen, Anforderungen werden laufend angepasst, enge Einbindung des Kunden, früh lauffähige Teilergebnisse."],
    ["Scrum: Rollen", "Product Owner (Anforderungen, Priorität im Product Backlog), Scrum Master (Prozess, Hindernisse), Developers (Umsetzung)."],
    ["Scrum: Events und Artefakte", "Sprint (1–4 Wochen), Sprint Planning, Daily Scrum (15 Min.), Sprint Review, Retrospektive. Artefakte: Product Backlog, Sprint Backlog, Increment."],
    ["User Story und INVEST", "Als <Rolle> möchte ich <Funktion>, damit <Nutzen>. INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable."],
    ["Lastenheft vs. Pflichtenheft", "Lastenheft: Was der Auftraggeber will (vom Auftraggeber). Pflichtenheft: Wie der Auftragnehmer es umsetzt."],
    ["Funktionale vs. nichtfunktionale Anforderung", "Funktional: was das System tut (z. B. Termin buchen). Nichtfunktional: wie gut (Performance, Verfügbarkeit, Sicherheit, Benutzbarkeit)."],
    ["Risikoanalyse in der Prüfung", "Risiko – Ursache – Auswirkung – Gegenmaßnahme. Beispiele: Aufwand unterschätzt, Anforderungsänderungen, Schnittstellenprobleme, Ausfall von Personal, Widerstand der Belegschaft."],
    ["Netzplan: FAZ, FEZ, SAZ, SEZ", "Vorwärts: FEZ = FAZ + Dauer, FAZ = größter FEZ der Vorgänger. Rückwärts: SAZ = SEZ − Dauer, SEZ = kleinster SAZ der Nachfolger."],
    ["Gesamtpuffer vs. freier Puffer", "Gesamtpuffer = SAZ − FAZ: so weit kann ein Vorgang verschoben werden, ohne das Projektende zu verschieben. Freier Puffer = kleinster FAZ der Nachfolger − FEZ: ohne Nachfolger zu verschieben."],
    ["Kritischer Pfad", "Folge der Vorgänge mit Gesamtpuffer 0. Jede Verzögerung dort verschiebt das Projektende."],
    ["Projektabschluss", "Soll-Ist-Vergleich (Pflichtenheft, Kosten, Termine), Abnahme, Abschlussbericht, Lessons Learned, Übergabe in den Betrieb."],
    ["Machbarkeitsstudie: Kriterien", "Technisch, wirtschaftlich (Kosten/Nutzen, Amortisation), organisatorisch (Personal, Zeit), rechtlich (Datenschutz), Markt (Bedarf, Konkurrenz)."],
    ["Kostenarten im Projekt", "Personalkosten, Sachkosten (Hard- und Software, Lizenzen), Schulungskosten, externe Dienstleister, laufende Betriebskosten."],
    ["Prototyping", "Vereinfachte Vorabversion, um Anforderungen zu klären oder Machbarkeit/Aufwand zu prüfen. Wegwerf-Prototyp oder evolutionärer Prototyp."]
  ],
  web: [
    ["REST: Prinzipien", "Ressourcen über eindeutige URLs, Standard-HTTP-Methoden, zustandslos (jeder Request enthält alles Nötige), Client-Server getrennt, meist JSON."],
    ["CRUD ↔ HTTP", "Create → POST, Read → GET, Update → PUT (ganz ersetzen) / PATCH (teilweise), Delete → DELETE."],
    ["HTTP-Statuscodes", "2xx Erfolg (200 OK, 201 Created, 204 No Content), 3xx Umleitung, 4xx Clientfehler (400, 401 Unauthorized, 403 Forbidden, 404 Not Found), 5xx Serverfehler (500)."],
    ["Aufbau eines HTTP-Requests", "Methode + URL (mit Query-Parametern ?a=1&b=2), Header (Content-Type, Authorization, Accept), Body (z. B. JSON)."],
    ["XML: wohlgeformt vs. gültig", "Wohlgeformt: Syntaxregeln eingehalten (ein Wurzelelement, Tags korrekt geöffnet/geschlossen und verschachtelt). Gültig: zusätzlich konform zu DTD/XML-Schema."],
    ["JSON-Grundsyntax", "Objekt { \"key\": wert }, Array [ ... ], Werte: String in doppelten Anführungszeichen, Zahl, true/false, null, verschachtelt möglich."],
    ["Barrierefreiheit: Maßnahmen", "Ausreichender Kontrast, skalierbare Schrift, Alternativtexte für Bilder, Tastaturbedienbarkeit, Screenreader-Unterstützung, nicht nur über Farbe informieren, einfache Sprache."],
    ["Usability-Grundsätze (ISO 9241-110)", "Aufgabenangemessenheit, Selbstbeschreibungsfähigkeit, Erwartungskonformität, Erlernbarkeit, Steuerbarkeit, Robustheit gegen Benutzerfehler, Benutzerbindung."],
    ["Vorteile von Mockups", "Früh Feedback vom Kunden, Missverständnisse vermeiden, günstige Änderungen vor der Umsetzung, Grundlage für Entwicklung und Tests."],
    ["LAN, SAN, NAS, LPWAN", "LAN: lokales Netz im Gebäude. SAN: eigenes schnelles Speichernetz im Rechenzentrum (Blockzugriff). NAS: Dateiserver im Netz (Dateizugriff, SMB/NFS). LPWAN (z. B. LoRaWAN): große Reichweite, wenig Energie, geringe Datenrate für IoT-Sensoren."],
    ["MAC-Adresse", "48 Bit (6 Byte), hexadezimal. Erste 3 Byte Herstellerkennung (OUI), letzte 3 Byte Gerätekennung. Arbeitet auf Schicht 2."],
    ["Switch, Router, Bridge", "Switch: verbindet Geräte im selben Netz anhand MAC (Schicht 2). Router: verbindet verschiedene Netze anhand IP (Schicht 3). Bridge: koppelt zwei Netzsegmente auf Schicht 2."],
    ["CI/CD", "Continuous Integration: Code wird häufig zusammengeführt, automatisch gebaut und getestet. Continuous Delivery/Deployment: automatisierte Auslieferung in Test- und Produktivumgebungen über Pipelines."],
    ["Client-Server / 3-Schichten", "Präsentation (Frontend), Logik (Backend/API), Daten (Datenbank). Frontend fragt Backend, Backend fragt Datenbank."]
  ],
  neu: [
    ["Test Driven Development (TDD)", "Erst den Test schreiben, der fehlschlägt (Red), dann minimalen Code bis er besteht (Green), dann aufräumen (Refactor). Ergebnis: hohe Testabdeckung, testbares Design."],
    ["Last- und Performancetest", "Lasttest: Verhalten unter erwarteter Last (viele Nutzer). Stresstest: über die Grenze hinaus. Performancetest: Antwortzeiten und Ressourcenverbrauch messen."],
